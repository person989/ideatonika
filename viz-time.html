<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Семантическое Время • Идеатоника</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: linear-gradient(145deg, #0d1117 0%, #161b22 100%); min-height: 100vh; font-family: 'Georgia', serif; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 1rem; overflow-x: hidden; }
        .stars-bg { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 0; }
        .star { position: absolute; background: white; border-radius: 50%; animation: twinkle var(--duration) ease-in-out infinite; animation-delay: var(--delay); opacity: 0; }
        @keyframes twinkle { 0%,100% { opacity:0.2; transform:scale(1); } 50% { opacity:1; transform:scale(1.8); } }
        .main-container { position: relative; z-index: 1; width: 100%; max-width: 1100px; background: rgba(22,27,34,0.85); backdrop-filter: blur(12px); border: 1px solid rgba(227,184,124,0.3); border-radius: 32px; padding: 2rem; box-shadow: 0 20px 40px rgba(0,0,0,0.6); }
        .header { text-align: center; margin-bottom: 1.5rem; }
        .header h1 { font-size: 2.5rem; font-weight: 400; letter-spacing: 3px; color: #f3e7c0; text-shadow: 0 0 20px rgba(255,215,80,0.4); margin-bottom: 0.3rem; }
        .header .subtitle { font-size: 1rem; color: #c0b090; font-style: italic; border-bottom: 1px solid #5d4a3a; display: inline-block; padding-bottom: 0.4rem; }
        .canvas-wrapper { position: relative; width: 100%; background: radial-gradient(ellipse at center, #1a2030 0%, #0a0e14 100%); border-radius: 20px; border: 1px solid #5d4a3a; overflow: hidden; margin-bottom: 1.5rem; box-shadow: inset 0 0 80px rgba(0,0,0,0.5); }
        canvas { display: block; width: 100%; height: auto; }
        .controls-panel { background: rgba(0,0,0,0.3); border: 1px solid #5d4a3a; border-radius: 20px; padding: 1.5rem 2rem; }
        .controls-title { font-size: 1.2rem; color: #ffd54f; margin-bottom: 1.2rem; text-align: center; letter-spacing: 1px; }
        .slider-group { margin-bottom: 1.2rem; }
        .slider-group label { display: flex; justify-content: space-between; align-items: center; color: #d0c8b8; font-size: 0.95rem; margin-bottom: 0.4rem; }
        .slider-group label .param-value { color: #ffd54f; font-weight: bold; font-size: 1.1rem; min-width: 50px; text-align: right; }
        .slider-group input[type="range"] { width: 100%; -webkit-appearance: none; height: 8px; background: linear-gradient(90deg, #3a2a4a, #5d4a3a, #3a2a4a); border-radius: 4px; outline: none; cursor: pointer; }
        .slider-group input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; width: 24px; height: 24px; background: radial-gradient(circle at 40% 40%, #ffe082, #ff8f00); border-radius: 50%; cursor: pointer; box-shadow: 0 0 15px rgba(255,215,80,0.6); border: 2px solid #ffd54f; }
        .range-labels { display: flex; justify-content: space-between; color: #706858; font-size: 0.75rem; margin-top: 0.2rem; }
        .info-box { margin-top: 1.5rem; padding: 1rem 1.5rem; background: rgba(255,215,80,0.05); border: 1px solid rgba(255,215,80,0.2); border-radius: 12px; text-align: center; color: #c0b090; font-size: 0.9rem; font-style: italic; }
        .info-box .formula-display { font-family: 'Courier New', monospace; color: #ffd54f; font-size: 1rem; margin: 0.3rem 0; }
        .back-row { text-align: center; margin-top: 1.5rem; }
        .back-link { display: inline-block; color: #ffd54f; text-decoration: none; border: 1px solid #ffd54f; padding: 0.6rem 1.5rem; border-radius: 30px; transition: 0.3s; font-size: 0.9rem; }
        .back-link:hover { background: #ffd54f; color: #0d1117; }
        @media (max-width: 700px) { .main-container { padding: 1rem; } .header h1 { font-size: 1.8rem; } .controls-panel { padding: 1rem; } }
    </style>
</head>
<body>
<div class="stars-bg" id="starsBg"></div>
<div class="main-container">
    <div class="header">
        <h1>⏳ Семантическое Время</h1>
        <div class="subtitle">Визуализация §13: реальное t и субъективное τ</div>
    </div>
    <div class="canvas-wrapper" id="canvasWrapper">
        <canvas id="timeCanvas"></canvas>
    </div>
    <div class="controls-panel">
        <div class="controls-title">🎛️ Параметры</div>
        <div class="slider-group">
            <label><span>🎯 Когерентность Cₛ</span><span class="param-value" id="csValue">0.50</span></label>
            <input type="range" id="csSlider" min="0" max="1" value="0.5" step="0.01">
            <div class="range-labels"><span>0 (рассеянность)</span><span>0.5</span><span>1 (поток)</span></div>
        </div>
        <div class="slider-group">
            <label><span>📊 Поток информации dI/dt</span><span class="param-value" id="infoValue">Средний</span></label>
            <input type="range" id="infoSlider" min="0" max="3" value="1" step="1">
            <div class="range-labels"><span>0 (скука)</span><span>1 (рутина)</span><span>2 (поток)</span><span>3 (стресс)</span></div>
        </div>
        <div class="slider-group">
            <label><span>🧭 Вектор внимания θₜ</span><span class="param-value" id="thetaValue">В будущее (0°)</span></label>
            <input type="range" id="thetaSlider" min="0" max="2" value="0" step="1">
            <div class="range-labels"><span>0° (будущее)</span><span>90° (настоящее)</span><span>180° (прошлое)</span></div>
        </div>
        <div class="slider-group">
            <label><span>⏱️ Скорость симуляции</span><span class="param-value" id="speedValue">1.0x</span></label>
            <input type="range" id="speedSlider" min="0.1" max="2.0" value="1.0" step="0.1">
            <div class="range-labels"><span>0.1x</span><span>1.0x</span><span>2.0x</span></div>
        </div>
        <div class="slider-group" style="text-align:center;">
            <button id="pauseBtn" style="padding:0.6rem 2rem;background:rgba(255,215,80,0.1);border:1px solid #ffd54f;color:#ffd54f;border-radius:30px;font-family:Georgia,serif;font-size:1rem;cursor:pointer;">⏯️ Пауза</button>
        </div>
        <div class="info-box">
            <span id="statusText" style="color:#ffd54f;font-weight:bold;">⏱️ Время идёт обычно</span>
            <div class="formula-display" id="formulaDisplay"></div>
        </div>
    </div>
    <div class="back-row">
        <a href="visualizations.html" class="back-link">← К списку визуализаций</a>
    </div>
</div>
<script>
(function(){
    const bg=document.getElementById('starsBg');
    for(let i=0;i<100;i++){
        const d=document.createElement('div');d.className='star';
        d.style.left=Math.random()*100+'%';d.style.top=Math.random()*100+'%';
        const s=Math.random()*2.5+0.5;d.style.width=s+'px';d.style.height=s+'px';
        d.style.setProperty('--duration',(Math.random()*4+2)+'s');
        d.style.setProperty('--delay',(Math.random()*5)+'s');
        bg.appendChild(d);
    }
})();
const canvas=document.getElementById('timeCanvas');
const ctx=canvas.getContext('2d');
const wrapper=document.getElementById('canvasWrapper');
let time=0,paused=false,animId,trailT=[],trailTau=[];
const MAX_TRAIL=120;
function resize(){
    const r=wrapper.getBoundingClientRect();
    canvas.width=r.width;canvas.height=Math.max(500,Math.min(650,r.width*0.7));
    wrapper.style.height=canvas.height+'px';trailT=[];trailTau=[];
}
resize();window.addEventListener('resize',resize);
const csSlider=document.getElementById('csSlider'),infoSlider=document.getElementById('infoSlider'),thetaSlider=document.getElementById('thetaSlider'),speedSlider=document.getElementById('speedSlider');
const csValue=document.getElementById('csValue'),infoValue=document.getElementById('infoValue'),thetaValue=document.getElementById('thetaValue'),speedValue=document.getElementById('speedValue');
const pauseBtn=document.getElementById('pauseBtn'),statusText=document.getElementById('statusText'),formulaDisplay=document.getElementById('formulaDisplay');
const infoLabels=['Скука','Рутина','Поток','Стресс'],thetaLabels=['В будущее (0°)','В настоящее (90°)','В прошлое (180°)'];
csSlider.oninput=()=>{csValue.textContent=parseFloat(csSlider.value).toFixed(2);updateInfo();};
infoSlider.oninput=()=>{infoValue.textContent=infoLabels[parseInt(infoSlider.value)];updateInfo();};
thetaSlider.oninput=()=>{thetaValue.textContent=thetaLabels[parseInt(thetaSlider.value)];updateInfo();};
speedSlider.oninput=()=>{speedValue.textContent=parseFloat(speedSlider.value).toFixed(1)+'x';};
pauseBtn.onclick=()=>{paused=!paused;pauseBtn.textContent=paused?'▶️ Продолжить':'⏯️ Пауза';};
function updateInfo(){
    const cs=parseFloat(csSlider.value),info=parseInt(infoSlider.value),th=parseInt(thetaSlider.value);
    let cos=1;if(th===1)cos=0;else if(th===2)cos=-1;
    let dTau=1+0.5*cs*info*cos;if(dTau<0.01)dTau=0.01;
    // dTau>1 — время ТЯНЕТСЯ, dTau<1 — время ЛЕТИТ
    if(dTau>1.3)statusText.textContent='🐌 Время ТЯНЕТСЯ — субъективно дольше';
    else if(dTau>1.1)statusText.textContent='🕰️ Время течёт медленнее';
    else if(dTau<0.7)statusText.textContent='🚀 Время ЛЕТИТ — субъективно быстрее';
    else if(dTau<0.9)statusText.textContent='⏩ Время ускоряется';
    else statusText.textContent='⏱️ Время идёт обычно';
    formulaDisplay.textContent='dτ/dt = 1 + 0.5·'+cs.toFixed(2)+'·'+info+'·'+cos.toFixed(0)+' = '+dTau.toFixed(2);
}
updateInfo();
function drawFrame(){
    const cs=parseFloat(csSlider.value),info=parseInt(infoSlider.value),th=parseInt(thetaSlider.value),speed=parseFloat(speedSlider.value),w=canvas.width,h=canvas.height;
    if(!paused)time+=0.02*speed;
    let cos=1;if(th===1)cos=0;else if(th===2)cos=-1;
    let dTau=1+0.5*cs*info*cos;if(dTau<0.01)dTau=0.01;
    const tauTime=time*dTau;
    ctx.fillStyle='#060a10';ctx.fillRect(0,0,w,h);
    ctx.strokeStyle='rgba(255,255,255,0.02)';ctx.lineWidth=1;
    for(let x=0;x<w;x+=50){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,h);ctx.stroke();}
    for(let y=0;y<h;y+=50){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(w,y);ctx.stroke();}
    const cxT=w*0.3,cxTau=w*0.7,cy=h*0.2,len=h*0.45;
    const aT=Math.sin(time*1.5)*0.5,aTau=Math.sin(tauTime*1.5)*0.5;
    const tx=cxT+Math.sin(aT)*len,ty=cy+Math.cos(aT)*len;
    const taux=cxTau+Math.sin(aTau)*len,tauy=cy+Math.cos(aTau)*len;
    if(!paused){
        trailT.push({x:tx,y:ty,age:0});trailTau.push({x:taux,y:tauy,age:0});
        while(trailT.length>MAX_TRAIL)trailT.shift();
        while(trailTau.length>MAX_TRAIL)trailTau.shift();
    }
    trailT.forEach(p=>p.age+=0.02*speed);trailTau.forEach(p=>p.age+=0.02*speed);
    for(let p of trailT){const a=0.3*(1-p.age/3);if(a>0){ctx.fillStyle=`rgba(100,180,255,${a})`;ctx.beginPath();ctx.arc(p.x,p.y,3,0,Math.PI*2);ctx.fill();}}
    // dTau>1 (тянется, маятник быстрее) — оранжевый, dTau<1 (летит, маятник медленнее) — фиолетовый
    const tauCol=dTau>1?'rgba(255,180,80,':'rgba(180,100,255,';
    for(let p of trailTau){const a=0.3*(1-p.age/3);if(a>0){ctx.fillStyle=tauCol+a+')';ctx.beginPath();ctx.arc(p.x,p.y,3,0,Math.PI*2);ctx.fill();}}
    function drawPen(cx,cy,x,y,col,lab,tlab){
        ctx.strokeStyle='rgba(255,255,255,0.3)';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(cx,cy);ctx.lineTo(x,y);ctx.stroke();
        ctx.fillStyle='#8b7355';ctx.beginPath();ctx.arc(cx,cy,6,0,Math.PI*2);ctx.fill();
        const g=ctx.createRadialGradient(x,y,0,x,y,16);g.addColorStop(0,'#fff');g.addColorStop(0.4,col);g.addColorStop(1,'rgba(0,0,0,0)');
        ctx.fillStyle=g;ctx.beginPath();ctx.arc(x,y,16,0,Math.PI*2);ctx.fill();
        const gl=ctx.createRadialGradient(x,y,8,x,y,30);gl.addColorStop(0,col);gl.addColorStop(1,'rgba(0,0,0,0)');
        ctx.fillStyle=gl;ctx.beginPath();ctx.arc(x,y,30,0,Math.PI*2);ctx.fill();
        ctx.fillStyle=col;ctx.font='bold 16px Georgia';ctx.textAlign='center';ctx.fillText(lab,cx,cy-30);ctx.fillText(tlab,cx,cy-12);
    }
    drawPen(cxT,cy,tx,ty,'rgb(100,180,255)','Реальное t','t='+(time*10).toFixed(1)+'с');
    drawPen(cxTau,cy,taux,tauy,dTau>1?'rgb(255,180,80)':'rgb(180,100,255)','Субъективное τ','τ='+(tauTime*10).toFixed(1)+'с');
    ctx.strokeStyle='rgba(255,255,255,0.1)';ctx.setLineDash([4,8]);ctx.beginPath();ctx.moveTo(w/2,cy-len-40);ctx.lineTo(w/2,h-10);ctx.stroke();ctx.setLineDash([]);
    ctx.fillStyle='#ffd54f';ctx.font='14px Georgia';ctx.textAlign='center';
    const statusLabel=dTau>1?'(тянется)':dTau<1?'(летит)':'(норма)';
    ctx.fillText(`dτ/dt=${dTau.toFixed(2)} ${statusLabel}`,w/2,h-20);
    animId=requestAnimationFrame(drawFrame);
}
drawFrame();
window.addEventListener('beforeunload',()=>{if(animId)cancelAnimationFrame(animId);});
</script>
</body>
</html>
