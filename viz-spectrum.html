<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Семантический Спектр • Идеатоника</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: linear-gradient(145deg, #0d1117 0%, #161b22 100%);
            min-height: 100vh;
            font-family: 'Georgia', 'Times New Roman', serif;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            padding: 1rem; overflow-x: hidden;
        }
        .stars-bg { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 0; }
        .star { position: absolute; background: white; border-radius: 50%; animation: twinkle var(--duration) ease-in-out infinite; animation-delay: var(--delay); opacity: 0; }
        @keyframes twinkle { 0%,100% { opacity:0.2; transform:scale(1); } 50% { opacity:1; transform:scale(1.8); } }
        .main-container {
            position: relative; z-index: 1; width: 100%; max-width: 1100px;
            background: rgba(22,27,34,0.85); backdrop-filter: blur(12px);
            border: 1px solid rgba(227,184,124,0.3); border-radius: 32px;
            padding: 2rem; box-shadow: 0 20px 40px rgba(0,0,0,0.6);
        }
        .header { text-align: center; margin-bottom: 1.5rem; }
        .header h1 { font-size: 2.5rem; font-weight: 400; letter-spacing: 3px; color: #f3e7c0; text-shadow: 0 0 20px rgba(255,215,80,0.4); margin-bottom: 0.3rem; }
        .header .subtitle { font-size: 1rem; color: #c0b090; font-style: italic; border-bottom: 1px solid #5d4a3a; display: inline-block; padding-bottom: 0.4rem; }
        .canvas-wrapper { position: relative; width: 100%; background: radial-gradient(ellipse at center, #1a2030 0%, #0a0e14 100%); border-radius: 20px; border: 1px solid #5d4a3a; overflow: hidden; margin-bottom: 1.5rem; box-shadow: inset 0 0 80px rgba(0,0,0,0.5); }
        canvas { display: block; width: 100%; height: auto; }
        .controls-panel { background: rgba(0,0,0,0.3); border: 1px solid #5d4a3a; border-radius: 20px; padding: 1.5rem 2rem; }
        .controls-title { font-size: 1.2rem; color: #ffd54f; margin-bottom: 1.2rem; text-align: center; letter-spacing: 1px; }
        .slider-group { margin-bottom: 1.2rem; }
        .slider-group label { display: flex; justify-content: space-between; align-items: center; color: #d0c8b8; font-size: 0.95rem; margin-bottom: 0.4rem; }
        .slider-group label .param-value { color: #ffd54f; font-weight: bold; font-size: 1.1rem; min-width: 50px; text-align: right; }
        .slider-group input[type="range"] { width: 100%; -webkit-appearance: none; height: 8px; background: linear-gradient(90deg, #3a2a4a, #5d4a3a, #3a2a4a); border-radius: 4px; outline: none; cursor: pointer; }
        .slider-group input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; width: 24px; height: 24px; background: radial-gradient(circle at 40% 40%, #ffe082, #ff8f00); border-radius: 50%; cursor: pointer; box-shadow: 0 0 15px rgba(255,215,80,0.6); border: 2px solid #ffd54f; }
        .range-labels { display: flex; justify-content: space-between; color: #706858; font-size: 0.75rem; margin-top: 0.2rem; }
        .info-box { margin-top: 1.5rem; padding: 1rem 1.5rem; background: rgba(255,215,80,0.05); border: 1px solid rgba(255,215,80,0.2); border-radius: 12px; text-align: center; color: #c0b090; font-size: 0.9rem; font-style: italic; }
        .info-box .formula-display { font-family: 'Courier New', monospace; color: #ffd54f; font-size: 1rem; margin: 0.3rem 0; }
        .back-row { text-align: center; margin-top: 1.5rem; }
        .back-link { display: inline-block; color: #ffd54f; text-decoration: none; border: 1px solid #ffd54f; padding: 0.6rem 1.5rem; border-radius: 30px; transition: 0.3s; font-size: 0.9rem; }
        .back-link:hover { background: #ffd54f; color: #0d1117; }
        @media (max-width: 700px) { .main-container { padding: 1rem; } .header h1 { font-size: 1.8rem; } .controls-panel { padding: 1rem; } }
    </style>
</head>
<body>
<div class="stars-bg" id="starsBg"></div>
<div class="main-container">
    <div class="header">
        <h1>🌈 Семантический Спектр</h1>
        <div class="subtitle">Визуализация §60, §89: аура и разложение Qₛ на частоты</div>
    </div>
    <div class="canvas-wrapper" id="canvasWrapper">
        <canvas id="spectrumCanvas"></canvas>
    </div>
    <div class="controls-panel">
        <div class="controls-title">🎛️ Параметры</div>
        <div class="slider-group">
            <label><span>🎵 Доминирующая частота ωₛ</span><span class="param-value" id="freqValue">5.0 Гц (Тета)</span></label>
            <input type="range" id="freqSlider" min="0.5" max="100" value="5" step="0.1">
            <div class="range-labels"><span>0.5 (Дельта)</span><span>5 (Тета)</span><span>10 (Альфа)</span><span>30 (Бета)</span><span>100 (Гамма)</span></div>
        </div>
        <div class="slider-group">
            <label><span>☀️ Семантический заряд Qₛ</span><span class="param-value" id="qsValue">+5</span></label>
            <input type="range" id="qsSlider" min="-10" max="10" value="5" step="1">
            <div class="range-labels"><span>-10 (Тьма)</span><span>0</span><span>+10 (Свет)</span></div>
        </div>
        <div class="slider-group">
            <label><span>🎯 Когерентность Cₛ</span><span class="param-value" id="csValue">0.7</span></label>
            <input type="range" id="csSlider" min="0" max="1" value="0.7" step="0.01">
            <div class="range-labels"><span>0 (шум)</span><span>0.5</span><span>1 (лазер)</span></div>
        </div>
        <div class="info-box">
            <span id="statusText" style="color:#ffd54f;font-weight:bold;">🧘 Тета-ритм — медитация, интуиция</span>
            <div class="formula-display" id="formulaDisplay"></div>
        </div>
    </div>
    <div class="back-row">
        <a href="visualizations.html" class="back-link">← К списку визуализаций</a>
    </div>
</div>

<script>
(function(){
    const starsBg=document.getElementById('starsBg');
    for(let i=0;i<100;i++){
        const d=document.createElement('div');d.className='star';
        d.style.left=Math.random()*100+'%';d.style.top=Math.random()*100+'%';
        const s=Math.random()*2.5+0.5;d.style.width=s+'px';d.style.height=s+'px';
        d.style.setProperty('--duration',(Math.random()*4+2)+'s');
        d.style.setProperty('--delay',(Math.random()*5)+'s');
        starsBg.appendChild(d);
    }
})();

const canvas=document.getElementById('spectrumCanvas');
const ctx=canvas.getContext('2d');
const wrapper=document.getElementById('canvasWrapper');
let time=0,animId;

let particles=[];
const NUM_PARTICLES=150;

function resize(){
    const r=wrapper.getBoundingClientRect();
    canvas.width=r.width;
    canvas.height=Math.max(500,Math.min(650,r.width*0.7));
    wrapper.style.height=canvas.height+'px';
    initParticles();
}
function initParticles(){
    particles=[];
    const w=canvas.width,h=canvas.height;
    for(let i=0;i<NUM_PARTICLES;i++){
        const angle=Math.random()*Math.PI*2;
        const dist=10+Math.random()*Math.min(w,h)*0.4;
        particles.push({
            baseX:w/2,
            baseY:h/2,
            angle:angle,
            dist:dist,
            phase:Math.random()*Math.PI*2,
            freq:0.5+Math.random()*99.5,
            life:Math.random()
        });
    }
}
resize();window.addEventListener('resize',resize);

const freqSlider=document.getElementById('freqSlider');
const qsSlider=document.getElementById('qsSlider');
const csSlider=document.getElementById('csSlider');
const freqValue=document.getElementById('freqValue');
const qsValue=document.getElementById('qsValue');
const csValue=document.getElementById('csValue');
const statusText=document.getElementById('statusText');
const formulaDisplay=document.getElementById('formulaDisplay');

const freqNames=[
    {max:1,name:'Дельта (глубокий сон)'},
    {max:4,name:'Дельта (восстановление)'},
    {max:8,name:'Тета (медитация, интуиция)'},
    {max:14,name:'Альфа (расслабление, ясность)'},
    {max:30,name:'Бета (активность, мышление)'},
    {max:100,name:'Гамма (озарение, поток)'}
];

freqSlider.oninput=function(){
    const f=parseFloat(this.value);
    let name='';
    for(const range of freqNames){
        if(f<=range.max){name=range.name;break;}
    }
    freqValue.textContent=f.toFixed(1)+' Гц ('+name+')';
    updateInfo();
};
qsSlider.oninput=function(){qsValue.textContent=(parseInt(this.value)>=0?'+':'')+parseInt(this.value);};
csSlider.oninput=function(){csValue.textContent=parseFloat(this.value).toFixed(2);updateInfo();};

function updateInfo(){
    const f=parseFloat(freqSlider.value);
    if(f<4) statusText.textContent='😴 Дельта-диапазон — глубокий сон, транс';
    else if(f<8) statusText.textContent='🧘 Тета-диапазон — медитация, интуиция';
    else if(f<14) statusText.textContent='😌 Альфа-диапазон — ясность, покой';
    else if(f<30) statusText.textContent='⚡ Бета-диапазон — активность, логика';
    else statusText.textContent='🚀 Гамма-диапазон — озарение, поток';
    formulaDisplay.textContent='S(ω) ~ |FFT(Φ(t))|² | ω='+f.toFixed(1)+' Гц';
}
updateInfo();

function getFreqColor(freq,baseAlpha){
    const t=Math.min(1,freq/100);
    let r,g,b;
    if(t<0.15){r=255;g=Math.floor(30+t*500);b=30;}
    else if(t<0.3){r=255;g=Math.floor(105+(t-0.15)*500);b=30;}
    else if(t<0.45){r=Math.floor(255-(t-0.3)*800);g=Math.floor(180+(t-0.3)*200);b=30;}
    else if(t<0.6){r=Math.floor(135-(t-0.45)*400);g=Math.floor(210-(t-0.45)*100);b=Math.floor(30+(t-0.45)*600);}
    else if(t<0.75){r=Math.floor(75-(t-0.6)*200);g=Math.floor(195-(t-0.6)*300);b=Math.floor(120+(t-0.6)*300);}
    else if(t<0.9){r=Math.floor(45+(t-0.75)*300);g=Math.floor(150-(t-0.75)*200);b=Math.floor(165-(t-0.75)*100);}
    else{r=Math.floor(90+(t-0.9)*500);g=Math.floor(120+(t-0.9)*400);b=Math.floor(150+(t-0.9)*300);}
    r=Math.min(255,Math.max(0,r));
    g=Math.min(255,Math.max(0,g));
    b=Math.min(255,Math.max(0,b));
    return `rgba(${r},${g},${b},${baseAlpha})`;
}

function applyQSModulation(color,alpha,qs,cs){
    // Qₛ модулирует яркость: при Qₛ<0 цвет тускнеет и смещается в тёмный
    const absQ=Math.abs(qs);
    const qsNorm=absQ/10;
    const brightness=0.1+0.9*qsNorm;
    return color.replace(/[\d.]+\)$/, (match)=>{
        const currentAlpha=parseFloat(match);
        const modAlpha=currentAlpha*brightness*(0.3+0.7*cs);
        return modAlpha.toFixed(3)+')';
    });
}

function drawFrame(){
    const domFreq=parseFloat(freqSlider.value);
    const qs=parseInt(qsSlider.value);
    const cs=parseFloat(csSlider.value);
    const w=canvas.width,h=canvas.height;
    time+=0.016;
    
    ctx.fillStyle='#060a10';
    ctx.fillRect(0,0,w,h);
    
    const cx=w/2,cy=h/2;
    const absQ=Math.abs(qs);
    const qsNorm=absQ/10;
    const brightness=0.1+0.9*qsNorm;
    
    // Свечение ауры
    const auraRadius=Math.min(w,h)*0.4;
    const auraGrad=ctx.createRadialGradient(cx,cy,auraRadius*0.1,cx,cy,auraRadius);
    const domColor=getFreqColor(domFreq,1);
    const domAlpha=0.7+cs*0.3;
    auraGrad.addColorStop(0,domColor.replace('1)',(domAlpha*brightness).toFixed(2)+')'));
    auraGrad.addColorStop(0.3,domColor.replace('1)',((0.4+cs*0.3)*brightness).toFixed(2)+')'));
    auraGrad.addColorStop(0.6,domColor.replace('1)',((0.15+cs*0.1)*brightness).toFixed(2)+')'));
    auraGrad.addColorStop(1,'rgba(0,0,0,0)');
    ctx.fillStyle=auraGrad;
    ctx.beginPath();ctx.arc(cx,cy,auraRadius,0,Math.PI*2);ctx.fill();
    
    // Кольца разных частот
    const numRings=8;
    for(let ring=0;ring<numRings;ring++){
        const t=ring/numRings;
        const freq=t*100;
        const resonance=Math.exp(-Math.pow((freq-domFreq)/(10+cs*20),2));
        const alpha=(0.1+resonance*0.5)*brightness;
        if(alpha<0.015) continue;
        
        const baseRadius=auraRadius*(0.2+t*0.7);
        const pulse=1+0.05*Math.sin(time*freq*0.1);
        const radius=baseRadius*pulse;
        
        ctx.strokeStyle=getFreqColor(freq,alpha);
        ctx.lineWidth=(1.5+resonance*3)*brightness;
        ctx.beginPath();ctx.arc(cx,cy,radius,0,Math.PI*2);ctx.stroke();
    }
    
    // Частицы ауры
    for(const p of particles){
        const resonance=Math.exp(-Math.pow((p.freq-domFreq)/(8+cs*15),2));
        const amplitude=20+resonance*60;
        const pulse=1+0.3*Math.sin(time*p.freq*0.5+p.phase);
        const radius=p.dist*pulse;
        
        p.angle+=0.005*p.freq*0.1;
        const x=cx+Math.cos(p.angle)*radius;
        const y=cy+Math.sin(p.angle)*radius;
        
        const alpha=(0.1+resonance*0.5)*brightness;
        if(alpha<0.01) continue;
        const size=(1+resonance*3)*brightness;
        
        ctx.fillStyle=getFreqColor(p.freq,alpha);
        ctx.beginPath();ctx.arc(x,y,size,0,Math.PI*2);ctx.fill();
    }
    
    // Центральный источник
    const coreGrad=ctx.createRadialGradient(cx,cy,0,cx,cy,25);
    coreGrad.addColorStop(0,'rgba(255,255,255,'+(0.9*brightness).toFixed(2)+')');
    coreGrad.addColorStop(0.3,domColor.replace('1)',((0.7+cs*0.3)*brightness).toFixed(2)+')'));
    coreGrad.addColorStop(1,'rgba(0,0,0,0)');
    ctx.fillStyle=coreGrad;
    ctx.beginPath();ctx.arc(cx,cy,25,0,Math.PI*2);ctx.fill();
    
    // Шкала спектра
    const scaleX=20,scaleY=h-60,scaleW=w-40,scaleH=20;
    const scaleGrad=ctx.createLinearGradient(scaleX,0,scaleX+scaleW,0);
    for(let i=0;i<=100;i++){
        scaleGrad.addColorStop(i/100,getFreqColor(i,brightness));
    }
    ctx.fillStyle=scaleGrad;
    ctx.fillRect(scaleX,scaleY,scaleW,scaleH);
    ctx.strokeStyle='rgba(255,255,255,'+(0.3*brightness).toFixed(2)+')';
    ctx.strokeRect(scaleX,scaleY,scaleW,scaleH);
    
    // Метка текущей частоты
    const markerX=scaleX+(domFreq/100)*scaleW;
    ctx.fillStyle='white';
    ctx.beginPath();ctx.moveTo(markerX,scaleY-5);ctx.lineTo(markerX-5,scaleY-12);ctx.lineTo(markerX+5,scaleY-12);ctx.closePath();ctx.fill();
    ctx.font='11px Georgia,serif';
    ctx.textAlign='center';
    ctx.fillText(domFreq.toFixed(1)+' Гц',markerX,scaleY-16);
    
    ctx.fillStyle='rgba(255,255,255,0.4)';
    ctx.textAlign='left';
    ctx.fillText('0.5 Гц',scaleX,scaleY-5);
    ctx.textAlign='right';
    ctx.fillText('100 Гц',scaleX+scaleW,scaleY-5);
    
    // Подпись
    ctx.fillStyle='rgba(255,255,255,0.5)';
    ctx.font='14px Georgia,serif';
    ctx.textAlign='center';
    ctx.fillText('Спектр Qₛ (частота ω) | Qₛ='+(qs>=0?'+':'')+qs,w/2,scaleY-30);
    
    animId=requestAnimationFrame(drawFrame);
}

drawFrame();
window.addEventListener('beforeunload',()=>{if(animId)cancelAnimationFrame(animId);});
</script>

</body>
</html>
