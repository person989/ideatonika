<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Тест: Ваш круг • Идеатоника</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: linear-gradient(145deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            font-family: 'Georgia', 'Times New Roman', serif;
            padding: 2rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            transition: background 0.5s ease;
        }
        .cosmic-bg {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle at 30% 40%, rgba(255,215,150,0.08) 0%, transparent 50%),
                        radial-gradient(circle at 80% 70%, rgba(100,150,255,0.05) 0%, transparent 60%);
            pointer-events: none; z-index: 0;
        }
        .test-container {
            max-width: 700px;
            width: 100%;
            position: relative;
            z-index: 1;
            background: rgba(30, 40, 60, 0.85);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(227, 184, 124, 0.4);
            border-radius: 32px;
            padding: 2.5rem;
            box-shadow: 0 20px 40px rgba(0,0,0,0.5);
            transition: border-color 0.3s ease;
        }
        .test-header { text-align: center; margin-bottom: 2rem; }
        .test-header h1 {
            font-size: 2.2rem;
            color: #f3e7c0;
            margin-bottom: 0.5rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        .progress-bar {
            width: 100%;
            height: 6px;
            background: rgba(0,0,0,0.3);
            border-radius: 3px;
            margin: 1.5rem 0;
        }
        .progress-fill {
            height: 100%;
            background: #ffb74d;
            border-radius: 3px;
            width: 0%;
            transition: width 0.3s ease;
        }
        .progress-text {
            text-align: right;
            color: #a09080;
            font-size: 0.8rem;
            margin-top: 0.3rem;
        }
        .question-box { margin-bottom: 2rem; }
        .question-text {
            color: #f3e7c0;
            font-size: 1.3rem;
            margin-bottom: 1.5rem;
            line-height: 1.5;
        }
        .options { display: flex; flex-direction: column; gap: 12px; }
        .option {
            background: rgba(0,0,0,0.2);
            border: 1px solid #5d4a3a;
            border-radius: 16px;
            padding: 1rem 1.5rem;
            cursor: pointer;
            transition: all 0.2s ease;
            color: #d0c8b8;
            display: flex;
            align-items: center;
            gap: 15px;
        }
        .option:hover {
            background: rgba(255, 183, 77, 0.15);
            border-color: #ffb74d;
        }
        .option.selected {
            background: rgba(255, 183, 77, 0.25);
            border-color: #ffb74d;
            color: #f3e7c0;
        }
        .option-marker {
            width: 24px; height: 24px;
            border-radius: 50%;
            border: 2px solid #5d4a3a;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }
        .option.selected .option-marker {
            border-color: #ffb74d;
            background: #ffb74d;
            box-shadow: 0 0 10px #ffb74d;
        }
        .option.selected .option-marker::after {
            content: "✓";
            color: #1a1a2e;
            font-weight: bold;
        }
        .option-text { flex: 1; }
        .nav-buttons {
            display: flex;
            justify-content: space-between;
            margin-top: 2rem;
            gap: 15px;
        }
        .btn {
            background: transparent;
            border: 1.5px solid #ffb74d;
            color: #ffb74d;
            padding: 0.8rem 1.8rem;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 40px;
            cursor: pointer;
            transition: 0.2s;
            font-family: inherit;
        }
        .btn:hover { background: #ffb74d; color: #1a1a2e; }
        .btn:disabled { opacity: 0.3; cursor: not-allowed; }
        .btn-secondary { border-color: #5d4a3a; color: #a09080; }
        .btn-secondary:hover { background: #5d4a3a; color: #d0c8b8; }
        .result-container { text-align: center; }
        .result-score {
            font-size: 5rem;
            font-weight: bold;
            margin: 1rem 0;
        }
        .result-scale { font-size: 1.2rem; margin-bottom: 1.5rem; color: #d0c8b8; }
        .result-comment {
            background: rgba(0,0,0,0.2);
            border-radius: 20px;
            padding: 1.5rem;
            margin: 1.5rem 0;
            line-height: 1.6;
            color: #d0c8b8;
        }
        .result-advice {
            background: rgba(255, 183, 77, 0.1);
            border-left: 4px solid #ffb74d;
            padding: 1.2rem 1.5rem;
            border-radius: 0 12px 12px 0;
            text-align: left;
            color: #d0c8b8;
        }
        .hidden { display: none !important; }
        .back-link {
            display: inline-block;
            margin-top: 1.5rem;
            color: #ffb74d;
            text-decoration: none;
            font-size: 0.9rem;
        }
        .back-link:hover { text-decoration: underline; }
    </style>
</head>
<body id="mainBody">
<div class="cosmic-bg"></div>
<div class="test-container" id="testContainer">
    
    <div class="test-header">
        <h1>
            <span>👥</span>
            <span id="testTitle">Кто вокруг вас?</span>
            <span>🌟</span>
        </h1>
        <div class="progress-bar">
            <div class="progress-fill" id="progressFill"></div>
        </div>
        <div class="progress-text" id="progressText">Вопрос 1 из 7</div>
    </div>
    
    <div id="questionContainer"></div>
    
    <div class="nav-buttons">
        <button class="btn btn-secondary" id="prevBtn" disabled>← Назад</button>
        <button class="btn btn-secondary" id="exitBtn">🚪 Выйти</button>
        <button class="btn" id="nextBtn">Далее →</button>
    </div>
    
    <div style="text-align: center;">
        <a href="diagnostics-hub.html" class="back-link">← Вернуться в Хаб Диагностики</a>
    </div>
</div>

<script>
    (function() {
        const questions = [
            {
                text: "После общения с вашим самым близким человеком (партнёр, лучший друг, родственник) вы обычно чувствуете:",
                options: [
                    { text: "Опустошение, усталость, раздражение", value: -3 },
                    { text: "Лёгкую усталость, как будто меня «выжали»", value: -2 },
                    { text: "Ничего особенного, нейтрально", value: 0 },
                    { text: "Лёгкий прилив сил, хорошее настроение", value: 1 },
                    { text: "Радость, тепло, желание творить", value: 2 },
                    { text: "Мощный заряд энергии, вдохновение", value: 3 }
                ]
            },
            {
                text: "Как часто в вашем окружении случаются конфликты, ссоры, выяснения отношений?",
                options: [
                    { text: "Постоянно, это норма моей жизни", value: -3 },
                    { text: "Часто, несколько раз в неделю", value: -2 },
                    { text: "Иногда, maybe раз в месяц", value: -1 },
                    { text: "Редко, я стараюсь избегать конфликтов", value: 0 },
                    { text: "Очень редко, в основном мир и гармония", value: 2 },
                    { text: "Практически никогда, мы решаем всё спокойно", value: 3 }
                ]
            },
            {
                text: "Есть ли в вашем окружении человек, которого вы могли бы назвать «вампиром» — после общения с ним вы чувствуете себя хуже?",
                options: [
                    { text: "Да, и я вынужден(а) общаться с ним постоянно", value: -3 },
                    { text: "Да, но я стараюсь минимизировать контакты", value: -1 },
                    { text: "Был(а) такой человек, но я прекратил(а) общение", value: 1 },
                    { text: "Нет, в моём окружении таких нет", value: 2 },
                    { text: "Я сам(а) являюсь для других источником энергии", value: 3 }
                ]
            },
            {
                text: "Когда вам нужна поддержка или совет, сколько человек вы можете набрать прямо сейчас?",
                options: [
                    { text: "Ни одного. Я совсем один(а)", value: -3 },
                    { text: "Один человек, и то не всегда доступен", value: -1 },
                    { text: "Два-три человека, которым я доверяю", value: 1 },
                    { text: "Пять и более, у меня широкая сеть поддержки", value: 3 }
                ]
            },
            {
                text: "Как вы чувствуете себя в толпе (транспорт, мероприятие, очередь)?",
                options: [
                    { text: "Ужасно, толпа меня истощает, хочется сбежать", value: -3 },
                    { text: "Дискомфортно, стараюсь абстрагироваться", value: -1 },
                    { text: "Нейтрально, не обращаю внимания", value: 0 },
                    { text: "Нормально, могу даже «зарядиться» энергией толпы", value: 1 },
                    { text: "Отлично, я чувствую единение и прилив сил", value: 2 }
                ]
            },
            {
                text: "Есть ли в вашей жизни наставник, учитель или просто мудрый человек, к которому вы можете обратиться?",
                options: [
                    { text: "Нет, и я не верю, что такие бывают", value: -2 },
                    { text: "Нет, но я в поиске", value: 0 },
                    { text: "Да, есть один человек, чьё мнение для меня важно", value: 2 },
                    { text: "Да, у меня есть несколько таких людей", value: 3 }
                ]
            },
            {
                text: "Какое утверждение лучше всего описывает ваше окружение?",
                options: [
                    { text: "«Я в токсичном болоте, которое тянет меня на дно»", value: -3 },
                    { text: "«В моём окружении много «серых», уставших людей»", value: -1 },
                    { text: "«У меня нейтральное окружение, без сильных плюсов и минусов»", value: 0 },
                    { text: "«Меня окружают хорошие, добрые люди»", value: 1 },
                    { text: "«Мои близкие — это источник Света и Вдохновения»", value: 2 },
                    { text: "«Я — центр кристаллизации позитивного окружения»", value: 3 }
                ]
            }
        ];
        
        const totalQuestions = questions.length;
        let currentIndex = 0;
        let answers = new Array(totalQuestions).fill(null);
        
        const questionContainer = document.getElementById('questionContainer');
        const prevBtn = document.getElementById('prevBtn');
        const nextBtn = document.getElementById('nextBtn');
        const exitBtn = document.getElementById('exitBtn');
        const progressFill = document.getElementById('progressFill');
        const progressText = document.getElementById('progressText');
        const testContainer = document.getElementById('testContainer');
        const mainBody = document.getElementById('mainBody');
        const testTitle = document.getElementById('testTitle');
        
        let isResultMode = false;
        
        function renderQuestion(index) {
            const q = questions[index];
            let html = `<div class="question-box">`;
            html += `<div class="question-text">${index + 1}. ${q.text}</div>`;
            html += `<div class="options">`;
            
            q.options.forEach((opt) => {
                const isSelected = answers[index] === opt.value;
                html += `
                    <div class="option ${isSelected ? 'selected' : ''}" data-value="${opt.value}">
                        <div class="option-marker"></div>
                        <div class="option-text">${opt.text}</div>
                    </div>
                `;
            });
            
            html += `</div></div>`;
            questionContainer.innerHTML = html;
            
            document.querySelectorAll('.option').forEach(opt => {
                opt.addEventListener('click', () => {
                    const value = parseInt(opt.dataset.value);
                    answers[index] = value;
                    renderQuestion(index);
                });
            });
            
            const progress = ((index + 1) / totalQuestions) * 100;
            progressFill.style.width = progress + '%';
            progressText.textContent = `Вопрос ${index + 1} из ${totalQuestions}`;
            
            prevBtn.disabled = index === 0;
            if (index === totalQuestions - 1) {
                nextBtn.textContent = '🎉 Завершить';
            } else {
                nextBtn.textContent = 'Далее →';
            }
        }
        
        function calculateResult() {
            const sum = answers.reduce((acc, val) => acc + val, 0);
            // Макс = 7*3 = 21, мин = -21. Приводим к шкале -10…+10
            const normalized = Math.round((sum / 21) * 10);
            return Math.max(-10, Math.min(10, normalized));
        }
        
        function getResultColor(rank) {
            if (rank >= 7) return '#ffd54f';
            if (rank >= 3) return '#81c784';
            if (rank >= 0) return '#90caf9';
            if (rank >= -3) return '#ffb74d';
            if (rank >= -6) return '#ef5350';
            return '#b71c1c';
        }
        
        function getResultComment(rank) {
            if (rank >= 8) return "🌟 Вы — центр кристаллизации Света. Ваше окружение — это созвездие ярких, поддерживающих людей. Вы и они взаимно усиливаете друг друга. Это идеальная среда для роста.";
            if (rank >= 5) return "🌿 У вас очень хорошее окружение. Рядом есть люди, которые вас питают и поддерживают. Берегите их.";
            if (rank >= 2) return "🙂 У вас нормальное, нейтрально-положительное окружение. Есть и плюсы, и минусы. Старайтесь проводить больше времени с теми, кто вас «заряжает».";
            if (rank >= -1) return "⚖️ Ваше окружение нейтрально или слегка негативно. Возможно, есть «токсичные» люди. Оцените, кто из вашего круга отнимает у вас энергию.";
            if (rank >= -4) return "⚠️ В вашем окружении преобладают люди, которые вас истощают. Вы можете быть в роли «жертвы» или «спасателя». Подумайте о защите своих границ.";
            if (rank >= -7) return "🆘 Ваше окружение seriously истощает вас. Это может быть абьюзивная среда или глубокая изоляция. Вам срочно нужна помощь и новые социальные связи.";
            return "💔 Вы в глубокой изоляции или в крайне токсичной среде. Это угрожает вашему семантическому полю. Обратитесь за профессиональной помощью.";
        }
        
        function getResultAdvice(rank) {
            if (rank >= 5) return "🌟 Совет: Продолжайте культивировать это окружение. Благодарите своих близких. Устраивайте совместные ритуалы (обеды, прогулки). Ваш круг — ваш главный ресурс.";
            if (rank >= 2) return "🌱 Совет: Укрепляйте связи с позитивными людьми. Инициируйте встречи, звонки. Ищите новые знакомства по интересам (клубы, курсы, волонтёрство).";
            if (rank >= -1) return "🧹 Совет: Проведите «аудит» окружения. Составьте список людей, с которыми вы общаетесь регулярно. Рядом с кем вы чувствуете прилив сил, а рядом с кем — упадок? Минимизируйте контакты со второй группой.";
            if (rank >= -4) return "🛡️ Совет: Учитесь ставить семантические щиты (§124). Ограничьте время общения с «вампирами». Если не можете разорвать контакт (родственник, коллега) — сведите его к минимуму и всегда «заземляйтесь» после.";
            if (rank >= -7) return "🆘 Совет: Вам нужна новая среда. Начните с малого: онлайн-сообщества по интересам, форумы, чаты. Ищите «своих» людей. Не бойтесь обратиться к психологу.";
            return "💔 Совет: Немедленно обратитесь за помощью. Кризисный центр, телефон доверия, психотерапевт. Вы не одиноки. Первый шаг — признать проблему и попросить о помощи.";
        }
        
        function showResult() {
            isResultMode = true;
            const rank = calculateResult();
            const color = getResultColor(rank);
            const comment = getResultComment(rank);
            const advice = getResultAdvice(rank);
            
            mainBody.style.background = `linear-gradient(145deg, ${color}20 0%, #16213e 100%)`;
            testContainer.style.borderColor = color;
            
            let html = `<div class="result-container">`;
            html += `<h2 style="color: ${color};">Ваш результат</h2>`;
            html += `<div class="result-score" style="color: ${color};">${rank > 0 ? '+' : ''}${rank}</div>`;
            html += `<div class="result-scale">Ранг вашего окружения (от -10 до +10)</div>`;
            html += `<div class="result-comment">${comment}</div>`;
            html += `<div class="result-advice">${advice}</div>`;
            html += `<p style="margin-top: 1.5rem; color: #a09080; font-style: italic;">Вы — среднее арифметическое пяти человек, с которыми вы общаетесь чаще всего. Выбирайте их осознанно.</p>`;
            html += `</div>`;
            
            questionContainer.innerHTML = html;
            
            prevBtn.classList.add('hidden');
            nextBtn.classList.add('hidden');
            exitBtn.textContent = '🔄 Пройти заново';
            exitBtn.classList.remove('btn-secondary');
            exitBtn.classList.add('btn');
            
            testTitle.textContent = `Результат: Ранг окружения = ${rank > 0 ? '+' : ''}${rank}`;
            progressText.textContent = `Тест завершён`;
            
            setTimeout(function() {
    const passportBtn = document.createElement('button');
    passportBtn.textContent = '💾 Сохранить результат в Семантический Паспорт';
    passportBtn.style.cssText = 'display: block; margin: 2rem auto; padding: 1rem 2rem; background: #90a4ae; color: #1a1a2e; border: none; border-radius: 40px; font-size: 1rem; cursor: pointer; font-weight: bold; transition: 0.3s;';
    passportBtn.onmouseover = () => passportBtn.style.background = '#607d8b';
    passportBtn.onmouseout = () => passportBtn.style.background = '#90a4ae';

    passportBtn.addEventListener('click', function() {
        const scoreElement = document.querySelector('.result-score');
        if (scoreElement) {
            const resultText = scoreElement.textContent.trim();
            const resultValue = parseFloat(resultText);
            if (!isNaN(resultValue)) {
                localStorage.setItem('ideatonika_test_circle', resultValue);
            } else {
                localStorage.setItem('ideatonika_test_circle', resultText);
            }
            passportBtn.textContent = '✅ Сохранено в Паспорт!';
            passportBtn.style.background = '#37474f';
            passportBtn.style.color = 'white';
            passportBtn.disabled = true;
        }
    });

    const container = document.querySelector('.result-container') || document.getElementById('questionContainer');
    if (container) {
        container.appendChild(passportBtn);
    }
}, 100);

// ========== КНОПКА "ПОДЕЛИТЬСЯ РЕЗУЛЬТАТОМ" ==========
setTimeout(function() {
    const shareContainer = document.createElement('div');
    shareContainer.style.cssText = 'text-align: center; margin-top: 1.5rem;';

    const shareBtn = document.createElement('button');
    shareBtn.textContent = '📤 Поделиться результатом';
    shareBtn.style.cssText = 'display: block; margin: 0 auto 0.8rem auto; padding: 0.8rem 2rem; background: transparent; color: #81c784; border: 1.5px solid #81c784; border-radius: 40px; font-size: 1rem; cursor: pointer; font-weight: bold; transition: 0.3s; font-family: Georgia, serif;';
    shareBtn.onmouseover = () => shareBtn.style.background = '#81c784';
    shareBtn.onmouseout = () => shareBtn.style.background = 'transparent';
    shareBtn.onmouseover = () => shareBtn.style.color = '#1a1a2e';
    shareBtn.onmouseout = () => shareBtn.style.color = '#81c784';

    shareBtn.addEventListener('click', function() {
        // Получаем название теста из заголовка страницы
        const testName = document.title.replace(' • Идеатоника', '').trim();
        
        // Получаем результат из элемента .result-score
        const scoreElement = document.querySelector('.result-score');
        let resultText = '';
        if (scoreElement) {
            resultText = scoreElement.textContent.trim();
        }
        
        // Получаем комментарий из элемента .result-comment или .result-interpretation
        const commentElement = document.querySelector('.result-comment') || document.querySelector('.result-interpretation');
        let commentText = '';
        if (commentElement) {
            commentText = commentElement.textContent.trim();
        }
        
        // Формируем текст для отправки
        const shareText = `🧪 Я прошёл тест «${testName}» на портале Идеатоника!\n\n` +
            `📊 Мой результат: ${resultText}\n` +
            `💬 ${commentText}\n\n` +
            `🎯 А какой результат у тебя?\n` +
            `👉 Пройти тест: ${window.location.href}\n\n` +
            `🌌 Идеатоника — физика смысла.`;
        
        // Пытаемся использовать Web Share API (мобильные устройства)
        if (navigator.share) {
            navigator.share({
                title: `Мой результат теста «${testName}»`,
                text: shareText,
                url: window.location.href
            }).catch(() => {
                // Если не получилось — копируем в буфер
                copyToClipboard(shareText);
            });
        } else {
            // Если Web Share API не поддерживается — копируем в буфер
            copyToClipboard(shareText);
        }
    });

    function copyToClipboard(text) {
        if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(text).then(() => {
                const originalText = shareBtn.textContent;
                shareBtn.textContent = '✅ Скопировано! Отправь другу';
                shareBtn.style.borderColor = '#ffd54f';
                shareBtn.style.color = '#ffd54f';
                setTimeout(() => {
                    shareBtn.textContent = originalText;
                    shareBtn.style.borderColor = '#81c784';
                    shareBtn.style.color = '#81c784';
                }, 2500);
            }).catch(() => {
                fallbackCopy(text);
            });
        } else {
            fallbackCopy(text);
        }
    }

    function fallbackCopy(text) {
        const textarea = document.createElement('textarea');
        textarea.value = text;
        textarea.style.position = 'fixed';
        textarea.style.left = '-9999px';
        document.body.appendChild(textarea);
        textarea.select();
        try {
            document.execCommand('copy');
            const originalText = shareBtn.textContent;
            shareBtn.textContent = '✅ Скопировано! Отправь другу';
            shareBtn.style.borderColor = '#ffd54f';
            shareBtn.style.color = '#ffd54f';
            setTimeout(() => {
                shareBtn.textContent = originalText;
                shareBtn.style.borderColor = '#81c784';
                shareBtn.style.color = '#81c784';
            }, 2500);
        } catch(e) {
            shareBtn.textContent = '❌ Не удалось скопировать';
            shareBtn.style.borderColor = '#ef5350';
            shareBtn.style.color = '#ef5350';
        }
        document.body.removeChild(textarea);
    }

    // Добавляем подсказку
    const hint = document.createElement('div');
    hint.style.cssText = 'color: #a09080; font-size: 0.8rem; font-style: italic;';
    hint.textContent = 'Нажмите, чтобы скопировать результат и отправить другу';
    shareContainer.appendChild(shareBtn);
    shareContainer.appendChild(hint);

    // Ищем контейнер с результатом
    const container = document.querySelector('.result-container') || document.getElementById('questionContainer');
    if (container) {
        container.appendChild(shareContainer);
    }
}, 100);

        }
        
        function resetTest() {
            isResultMode = false;
            currentIndex = 0;
            answers = new Array(totalQuestions).fill(null);
            
            mainBody.style.background = '';
            testContainer.style.borderColor = '';
            testTitle.textContent = 'Кто вокруг вас?';
            
            prevBtn.classList.remove('hidden');
            nextBtn.classList.remove('hidden');
            exitBtn.textContent = '🚪 Выйти';
            exitBtn.classList.add('btn-secondary');
            
            renderQuestion(0);
        }
        
        prevBtn.addEventListener('click', () => {
            if (currentIndex > 0) { currentIndex--; renderQuestion(currentIndex); }
        });
        
        nextBtn.addEventListener('click', () => {
            if (answers[currentIndex] === null) {
                alert('Пожалуйста, выберите один из вариантов ответа.');
                return;
            }
            if (currentIndex < totalQuestions - 1) {
                currentIndex++;
                renderQuestion(currentIndex);
            } else {
                if (answers.includes(null)) {
                    alert('Пожалуйста, ответьте на все вопросы.');
                    return;
                }
                showResult();
            }
        });
        
        exitBtn.addEventListener('click', () => {
            if (isResultMode) {
                resetTest();
            } else {
                if (confirm('Вы уверены, что хотите выйти? Прогресс будет потерян.')) {
                    window.location.href = 'diagnostics-hub.html';
                }
            }
        });
        
        renderQuestion(0);
    })();
</script>
</body>
</html>
