<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Тест: Частота вашей души • Идеатоника</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: linear-gradient(145deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            font-family: 'Georgia', 'Times New Roman', serif;
            padding: 2rem;
            display: flex; flex-direction: column; align-items: center;
            transition: background 0.5s ease;
        }
        .cosmic-bg {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle at 30% 40%, rgba(255,215,150,0.08) 0%, transparent 50%),
                        radial-gradient(circle at 80% 70%, rgba(100,150,255,0.05) 0%, transparent 60%);
            pointer-events: none; z-index: 0;
        }
        .test-container {
            max-width: 700px; width: 100%; position: relative; z-index: 1;
            background: rgba(30,40,60,0.85); backdrop-filter: blur(12px);
            border: 1px solid rgba(227,184,124,0.4); border-radius: 32px;
            padding: 2.5rem; box-shadow: 0 20px 40px rgba(0,0,0,0.5);
            transition: border-color 0.3s ease;
        }
        .test-header { text-align: center; margin-bottom: 2rem; }
        .test-header h1 { font-size: 2.2rem; color: #f3e7c0; margin-bottom: 0.5rem; display: flex; align-items: center; justify-content: center; gap: 10px; }
        .progress-bar { width: 100%; height: 6px; background: rgba(0,0,0,0.3); border-radius: 3px; margin: 1.5rem 0; }
        .progress-fill { height: 100%; background: #ffb74d; border-radius: 3px; width: 0%; transition: width 0.3s ease; }
        .progress-text { text-align: right; color: #a09080; font-size: 0.8rem; margin-top: 0.3rem; }
        .question-text { color: #f3e7c0; font-size: 1.3rem; margin-bottom: 1.5rem; line-height: 1.5; }
        .options { display: flex; flex-direction: column; gap: 12px; }
        .option {
            background: rgba(0,0,0,0.2); border: 1px solid #5d4a3a; border-radius: 16px;
            padding: 1rem 1.5rem; cursor: pointer; transition: all 0.2s ease;
            color: #d0c8b8; display: flex; align-items: center; gap: 15px;
        }
        .option:hover { background: rgba(255,183,77,0.15); border-color: #ffb74d; }
        .option.selected { background: rgba(255,183,77,0.25); border-color: #ffb74d; color: #f3e7c0; }
        .option-marker { width: 24px; height: 24px; border-radius: 50%; border: 2px solid #5d4a3a; display: flex; align-items: center; justify-content: center; transition: all 0.2s; }
        .option.selected .option-marker { border-color: #ffb74d; background: #ffb74d; box-shadow: 0 0 10px #ffb74d; }
        .option.selected .option-marker::after { content: "✓"; color: #1a1a2e; font-weight: bold; }
        .option-text { flex: 1; }
        .nav-buttons { display: flex; justify-content: space-between; margin-top: 2rem; gap: 15px; }
        .btn {
            background: transparent; border: 1.5px solid #ffb74d; color: #ffb74d;
            padding: 0.8rem 1.8rem; font-size: 1rem; font-weight: bold; border-radius: 40px;
            cursor: pointer; transition: 0.2s; font-family: inherit;
        }
        .btn:hover { background: #ffb74d; color: #1a1a2e; }
        .btn:disabled { opacity: 0.3; cursor: not-allowed; }
        .btn-secondary { border-color: #5d4a3a; color: #a09080; }
        .btn-secondary:hover { background: #5d4a3a; color: #d0c8b8; }
        .result-container { text-align: center; }
        .result-score { font-size: 5rem; font-weight: bold; margin: 1rem 0; }
        .result-comment { background: rgba(0,0,0,0.2); border-radius: 20px; padding: 1.5rem; margin: 1.5rem 0; line-height: 1.6; color: #d0c8b8; }
        .result-advice { background: rgba(255,183,77,0.1); border-left: 4px solid #ffb74d; padding: 1.2rem 1.5rem; border-radius: 0 12px 12px 0; text-align: left; color: #d0c8b8; }
        .hidden { display: none !important; }
        .back-link { display: inline-block; margin-top: 1.5rem; color: #ffb74d; text-decoration: none; font-size: 0.9rem; }
        .back-link:hover { text-decoration: underline; }
    </style>
</head>
<body id="mainBody">
<div class="cosmic-bg"></div>
<div class="test-container" id="testContainer">
    <div class="test-header">
        <h1><span>🎵</span><span id="testTitle">Частота вашей души</span><span>🎧</span></h1>
        <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
        <div class="progress-text" id="progressText">Вопрос 1 из 7</div>
    </div>
    <div id="questionContainer"></div>
    <div class="nav-buttons">
        <button class="btn btn-secondary" id="prevBtn" disabled>← Назад</button>
        <button class="btn btn-secondary" id="exitBtn">🚪 Выйти</button>
        <button class="btn" id="nextBtn">Далее →</button>
    </div>
    <div style="text-align: center;"><a href="diagnostics-hub.html" class="back-link">← Вернуться в Хаб Диагностики</a></div>
</div>

<script>
(function() {
    const questions = [
        {
            text: "Какая музыка чаще всего звучит в вашем плейлисте?",
            options: [
                { text: "Тишина. Я редко слушаю музыку", value: 0 },
                { text: "Тяжёлый рок, метал, агрессивная электроника", value: -2 },
                { text: "Поп-музыка, радио, то, что «в тренде»", value: -1 },
                { text: "Спокойная инструментальная, эмбиент, lo-fi", value: 2 },
                { text: "Классика (Моцарт, Бах, Вивальди)", value: 3 },
                { text: "Мантры, духовные песнопения, поющие чаши", value: 4 },
                { text: "Звуки природы (лес, океан, пение птиц)", value: 5 }
            ]
        },
        {
            text: "Что вы чувствуете, когда слушаете любимую музыку?",
            options: [
                { text: "Раздражение или агрессию", value: -3 },
                { text: "Грусть, ностальгию, тяжесть", value: -2 },
                { text: "Ничего особенного, просто фон", value: -1 },
                { text: "Лёгкое удовольствие, расслабление", value: 1 },
                { text: "Прилив энергии, радость, желание двигаться", value: 2 },
                { text: "Глубокое умиротворение, слёзы катарсиса", value: 3 },
                { text: "Выход за пределы тела, экстаз, единение", value: 4 }
            ]
        },
        {
            text: "Какой темп музыки вам ближе всего?",
            options: [
                { text: "Очень быстрый, агрессивный (> 140 BPM)", value: -2 },
                { text: "Быстрый, энергичный (120-140 BPM)", value: 1 },
                { text: "Средний, «рабочий» (80-120 BPM)", value: 2 },
                { text: "Медленный, спокойный (40-80 BPM)", value: 3 },
                { text: "Очень медленный, медитативный (< 40 BPM)", value: 4 }
            ]
        },
        {
            text: "Как часто вы поёте сами (в душе, для себя, в хоре)?",
            options: [
                { text: "Никогда. Мне это не нравится", value: -2 },
                { text: "Очень редко, только когда никто не слышит", value: -1 },
                { text: "Иногда, под настроение", value: 1 },
                { text: "Часто, это приносит мне радость", value: 3 },
                { text: "Постоянно. Пение — моя практика", value: 4 }
            ]
        },
        {
            text: "Как на вас действует полная тишина?",
            options: [
                { text: "Пугает, давит, вызывает тревогу", value: -3 },
                { text: "Не комфортно, сразу хочется что-то включить", value: -1 },
                { text: "Нейтрально, могу побыть, но недолго", value: 1 },
                { text: "Успокаивает, помогает думать", value: 3 },
                { text: "Это моё естественное состояние. Я наслаждаюсь тишиной", value: 5 }
            ]
        },
        {
            text: "Какие звуки природы вас наиболее умиротворяют?",
            options: [
                { text: "Никакие. Я городской житель", value: -2 },
                { text: "Дождь, гроза", value: 2 },
                { text: "Шум волн, прибой", value: 3 },
                { text: "Пение птиц на рассвете", value: 3 },
                { text: "Шум ветра в листве, лес", value: 4 },
                { text: "Треск костра", value: 2 },
                { text: "Все перечисленные — я сливаюсь с природой", value: 5 }
            ]
        },
        {
            text: "Если бы ваша душа была музыкальным инструментом, чем бы она была?",
            options: [
                { text: "Барабан — ритм, сила, напор", value: -1 },
                { text: "Электрогитара — бунт, энергия, драйв", value: 0 },
                { text: "Фортепиано — гармония, глубина, классика", value: 2 },
                { text: "Скрипка — эмоции, душа, тонкость", value: 3 },
                { text: "Флейта — лёгкость, воздух, духовность", value: 4 },
                { text: "Тишина — я инструмент тишины", value: 5 }
            ]
        }
    ];
    
    const totalQuestions = questions.length;
    let currentIndex = 0;
    let answers = new Array(totalQuestions).fill(null);
    
    const questionContainer = document.getElementById('questionContainer');
    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');
    const exitBtn = document.getElementById('exitBtn');
    const progressFill = document.getElementById('progressFill');
    const progressText = document.getElementById('progressText');
    const testContainer = document.getElementById('testContainer');
    const mainBody = document.getElementById('mainBody');
    const testTitle = document.getElementById('testTitle');
    let isResultMode = false;
    
    function renderQuestion(index) {
        const q = questions[index];
        let html = `<div class="question-box"><div class="question-text">${index + 1}. ${q.text}</div><div class="options">`;
        q.options.forEach(opt => {
            const isSelected = answers[index] === opt.value;
            html += `<div class="option ${isSelected ? 'selected' : ''}" data-value="${opt.value}"><div class="option-marker"></div><div class="option-text">${opt.text}</div></div>`;
        });
        html += `</div></div>`;
        questionContainer.innerHTML = html;
        document.querySelectorAll('.option').forEach(opt => {
            opt.addEventListener('click', () => {
                answers[index] = parseInt(opt.dataset.value);
                renderQuestion(index);
            });
        });
        progressFill.style.width = ((index + 1) / totalQuestions * 100) + '%';
        progressText.textContent = `Вопрос ${index + 1} из ${totalQuestions}`;
        prevBtn.disabled = index === 0;
        nextBtn.textContent = index === totalQuestions - 1 ? '🎉 Завершить' : 'Далее →';
    }
    
    function calculateResult() {
        const sum = answers.reduce((acc, val) => acc + val, 0);
        const normalized = (sum + 21) / 42 * 10;
        return Math.round(normalized * 10) / 10;
    }
    
    function getResultComment(score) {
        if (score < 2) return "🔇 Вы — «ТИШИНА В ШУМЕ». Возможно, вы перегружены какофонией мира. Ваша душа жаждет покоя и чистоты. Попробуйте проводить хотя бы 15 минут в день в полной тишине.";
        if (score < 4) return "🥁 Вы — «РИТМ ГОРОДА». Ваша частота — это пульс мегаполиса. Вы энергичны, но иногда «зашумлены». Добавьте в свой плейлист звуки природы и спокойную инструментальную музыку.";
        if (score < 6) return "🎹 Вы — «ГАРМОНИЯ». У вас хороший баланс между ритмом и мелодией, между звуком и тишиной. Вы интуитивно выбираете то, что резонирует с вашим текущим состоянием.";
        if (score < 8) return "🎻 Вы — «МЕЛОДИЯ ДУШИ». Ваша частота близка к классической гармонии и природным ритмам. Вы чувствуете музыку глубже, чем большинство. Продолжайте окружать себя красотой звука.";
        if (score < 9.5) return "🕊️ Вы — «ПЕСНЬ НЕБЕС». Ваша душа поёт на частотах, близких к сакральным. Мантры, хоралы, тишина — это ваша стихия. Вы — проводник высоких вибраций.";
        return "🌌 Вы — «МУЗЫКА СФЕР». Вы слышите неслышимое. Ваша частота выходит за пределы звука. Вы — воплощённая гармония Космоса.";
    }
    
    function getResultAdvice(score) {
        if (score < 4) return "🎧 Совет: Устройте себе «звуковой детокс» — день без музыки, подкастов, радио. Только естественные звуки. Это перезагрузит ваше слуховое восприятие и снизит S_noise.";
        if (score < 6) return "🎵 Совет: Попробуйте слушать музыку с частотой 432 Гц вместо стандартных 440 Гц. Многие отмечают, что она звучит «теплее» и «естественнее». Также полезны бинауральные ритмы (тета-диапазон).";
        if (score < 8) return "🎼 Совет: Углубите свою связь с музыкой. Попробуйте петь (даже если «нет слуха»), играть на инструменте. Это повышает Cₛ и синхронизирует полушария мозга.";
        if (score < 9.5) return "🕯️ Совет: Практикуйте «звуковую медитацию». Слушайте поющие чаши, тибетские колокольчики, мантры. Эти частоты настраивают поле на высокие вибрации.";
        return "🌠 Совет: Ваша миссия — нести эту гармонию другим. Делитесь музыкой, тишиной, звуками природы с теми, кто «зашумлён». Вы — камертон для своего окружения.";
    }
    
    function showResult() {
        isResultMode = true;
        const score = calculateResult();
        const comment = getResultComment(score);
        const advice = getResultAdvice(score);
        const color = score > 5 ? '#81c784' : '#ffb74d';
        
        mainBody.style.background = `linear-gradient(145deg, ${color}20 0%, #16213e 100%)`;
        testContainer.style.borderColor = color;
        
        let html = `<div class="result-container"><h2 style="color: ${color};">Ваш результат</h2>`;
        html += `<div class="result-score" style="color: ${color};">${score.toFixed(1)}</div>`;
        html += `<div class="result-scale">по шкале «Частота души» (от 0 до 10)</div>`;
        html += `<div class="result-comment">${comment}</div>`;
        html += `<div class="result-advice">${advice}</div>`;
        html += `<p style="margin-top: 1.5rem; color: #a09080; font-style: italic;">Музыка — это вибрация. Ваша душа — это инструмент. Настройте его правильно.</p></div>`;
        
        questionContainer.innerHTML = html;
        prevBtn.classList.add('hidden');
        nextBtn.classList.add('hidden');
        exitBtn.textContent = '🔄 Пройти заново';
        exitBtn.classList.remove('btn-secondary');
        exitBtn.classList.add('btn');
        testTitle.textContent = `Результат: ${score.toFixed(1)}`;
        progressText.textContent = `Тест завершён`;
        
        setTimeout(function() {
    const passportBtn = document.createElement('button');
    passportBtn.textContent = '💾 Сохранить результат в Семантический Паспорт';
    passportBtn.style.cssText = 'display: block; margin: 2rem auto; padding: 1rem 2rem; background: #81c784; color: #1a1a2e; border: none; border-radius: 40px; font-size: 1rem; cursor: pointer; font-weight: bold; transition: 0.3s;';
    passportBtn.onmouseover = () => passportBtn.style.background = '#4caf50';
    passportBtn.onmouseout = () => passportBtn.style.background = '#81c784';

    passportBtn.addEventListener('click', function() {
        const scoreElement = document.querySelector('.result-score');
        if (scoreElement) {
            const resultText = scoreElement.textContent.trim();
            const resultValue = parseFloat(resultText);
            if (!isNaN(resultValue)) {
                localStorage.setItem('ideatonika_test_sound', resultValue);
            } else {
                localStorage.setItem('ideatonika_test_sound', resultText);
            }
            passportBtn.textContent = '✅ Сохранено в Паспорт!';
            passportBtn.style.background = '#1b5e20';
            passportBtn.style.color = 'white';
            passportBtn.disabled = true;
        }
    });

    const container = document.querySelector('.result-container') || document.getElementById('questionContainer');
    if (container) {
        container.appendChild(passportBtn);
    }
}, 100);

// ========== КНОПКА "ПОДЕЛИТЬСЯ РЕЗУЛЬТАТОМ" ==========
setTimeout(function() {
    const shareContainer = document.createElement('div');
    shareContainer.style.cssText = 'text-align: center; margin-top: 1.5rem;';

    const shareBtn = document.createElement('button');
    shareBtn.textContent = '📤 Поделиться результатом';
    shareBtn.style.cssText = 'display: block; margin: 0 auto 0.8rem auto; padding: 0.8rem 2rem; background: transparent; color: #81c784; border: 1.5px solid #81c784; border-radius: 40px; font-size: 1rem; cursor: pointer; font-weight: bold; transition: 0.3s; font-family: Georgia, serif;';
    shareBtn.onmouseover = () => shareBtn.style.background = '#81c784';
    shareBtn.onmouseout = () => shareBtn.style.background = 'transparent';
    shareBtn.onmouseover = () => shareBtn.style.color = '#1a1a2e';
    shareBtn.onmouseout = () => shareBtn.style.color = '#81c784';

    shareBtn.addEventListener('click', function() {
        // Получаем название теста из заголовка страницы
        const testName = document.title.replace(' • Идеатоника', '').trim();
        
        // Получаем результат из элемента .result-score
        const scoreElement = document.querySelector('.result-score');
        let resultText = '';
        if (scoreElement) {
            resultText = scoreElement.textContent.trim();
        }
        
        // Получаем комментарий из элемента .result-comment или .result-interpretation
        const commentElement = document.querySelector('.result-comment') || document.querySelector('.result-interpretation');
        let commentText = '';
        if (commentElement) {
            commentText = commentElement.textContent.trim();
        }
        
        // Формируем текст для отправки
        const shareText = `🧪 Я прошёл тест «${testName}» на портале Идеатоника!\n\n` +
            `📊 Мой результат: ${resultText}\n` +
            `💬 ${commentText}\n\n` +
            `🎯 А какой результат у тебя?\n` +
            `👉 Пройти тест: ${window.location.href}\n\n` +
            `🌌 Идеатоника — физика смысла.`;
        
        // Пытаемся использовать Web Share API (мобильные устройства)
        if (navigator.share) {
            navigator.share({
                title: `Мой результат теста «${testName}»`,
                text: shareText,
                url: window.location.href
            }).catch(() => {
                // Если не получилось — копируем в буфер
                copyToClipboard(shareText);
            });
        } else {
            // Если Web Share API не поддерживается — копируем в буфер
            copyToClipboard(shareText);
        }
    });

    function copyToClipboard(text) {
        if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(text).then(() => {
                const originalText = shareBtn.textContent;
                shareBtn.textContent = '✅ Скопировано! Отправь другу';
                shareBtn.style.borderColor = '#ffd54f';
                shareBtn.style.color = '#ffd54f';
                setTimeout(() => {
                    shareBtn.textContent = originalText;
                    shareBtn.style.borderColor = '#81c784';
                    shareBtn.style.color = '#81c784';
                }, 2500);
            }).catch(() => {
                fallbackCopy(text);
            });
        } else {
            fallbackCopy(text);
        }
    }

    function fallbackCopy(text) {
        const textarea = document.createElement('textarea');
        textarea.value = text;
        textarea.style.position = 'fixed';
        textarea.style.left = '-9999px';
        document.body.appendChild(textarea);
        textarea.select();
        try {
            document.execCommand('copy');
            const originalText = shareBtn.textContent;
            shareBtn.textContent = '✅ Скопировано! Отправь другу';
            shareBtn.style.borderColor = '#ffd54f';
            shareBtn.style.color = '#ffd54f';
            setTimeout(() => {
                shareBtn.textContent = originalText;
                shareBtn.style.borderColor = '#81c784';
                shareBtn.style.color = '#81c784';
            }, 2500);
        } catch(e) {
            shareBtn.textContent = '❌ Не удалось скопировать';
            shareBtn.style.borderColor = '#ef5350';
            shareBtn.style.color = '#ef5350';
        }
        document.body.removeChild(textarea);
    }

    // Добавляем подсказку
    const hint = document.createElement('div');
    hint.style.cssText = 'color: #a09080; font-size: 0.8rem; font-style: italic;';
    hint.textContent = 'Нажмите, чтобы скопировать результат и отправить другу';
    shareContainer.appendChild(shareBtn);
    shareContainer.appendChild(hint);

    // Ищем контейнер с результатом
    const container = document.querySelector('.result-container') || document.getElementById('questionContainer');
    if (container) {
        container.appendChild(shareContainer);
    }
}, 100);

    }
    
    function resetTest() {
        isResultMode = false; currentIndex = 0; answers = new Array(totalQuestions).fill(null);
        mainBody.style.background = ''; testContainer.style.borderColor = '';
        testTitle.textContent = 'Частота вашей души';
        prevBtn.classList.remove('hidden'); nextBtn.classList.remove('hidden');
        exitBtn.textContent = '🚪 Выйти'; exitBtn.classList.add('btn-secondary');
        renderQuestion(0);
    }
    
    prevBtn.addEventListener('click', () => { if (currentIndex > 0) { currentIndex--; renderQuestion(currentIndex); } });
    nextBtn.addEventListener('click', () => {
        if (answers[currentIndex] === null) { alert('Пожалуйста, выберите один из вариантов ответа.'); return; }
        if (currentIndex < totalQuestions - 1) { currentIndex++; renderQuestion(currentIndex); }
        else { if (answers.includes(null)) { alert('Пожалуйста, ответьте на все вопросы.'); return; } showResult(); }
    });
    exitBtn.addEventListener('click', () => {
        if (isResultMode) resetTest();
        else { if (confirm('Вы уверены, что хотите выйти? Прогресс будет потерян.')) { window.location.href = 'diagnostics-hub.html'; } }
    });
    
    renderQuestion(0);
})();
</script>
</body>
</html>
