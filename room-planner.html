        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: linear-gradient(145deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            font-family: 'Georgia', 'Times New Roman', serif;
            padding: 1.5rem;
            display: flex; flex-direction: column; align-items: center;
        }
        .main-container {
            max-width: 700px; width: 100%;
            background: rgba(20, 25, 40, 0.95);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 28px;
            padding: 2rem 1.5rem;
            box-shadow: 0 20px 40px rgba(0,0,0,0.5);
        }
        h1 { text-align: center; color: #f3e7c0; font-size: 1.8rem; font-weight: 400; margin-bottom: 0.3rem; }
        .subtitle { text-align: center; color: #706858; font-size: 0.85rem; margin-bottom: 1.5rem; font-style: italic; }

        /* Список планов */
        .plans-list { margin-bottom: 1.5rem; }
        .plan-card {
            background: rgba(0,0,0,0.3); border: 1px solid #5d4a3a; border-radius: 16px;
            padding: 1.2rem 1.5rem; margin-bottom: 0.8rem; cursor: pointer;
            transition: all 0.2s ease; display: flex; justify-content: space-between; align-items: center;
        }
        .plan-card:hover { border-color: #ff9800; background: rgba(255,152,0,0.05); }
        .plan-name { color: #f3e7c0; font-size: 1.1rem; font-weight: bold; }
        .plan-date { color: #706858; font-size: 0.8rem; margin-top: 0.2rem; }
        .plan-delete {
            background: transparent; border: 1px solid #ef5350; color: #ef5350;
            padding: 0.4rem 0.8rem; border-radius: 15px; cursor: pointer; font-family: inherit; font-size: 0.75rem;
        }
        .plan-delete:hover { background: #ef5350; color: white; }

        .empty-state { text-align: center; color: #706858; font-style: italic; padding: 2rem; }

        .btn {
            padding: 1rem 2rem; font-size: 1rem; font-weight: bold; border-radius: 40px;
            cursor: pointer; font-family: inherit; border: none; width: 100%; text-align: center;
            transition: 0.3s;
        }
        .btn-add { background: #ff9800; color: #1a1a2e; }
        .btn-add:hover { background: #ffb74d; }

        /* Форма создания */
        .create-form {
            background: rgba(0,0,0,0.3); border: 1px solid #5d4a3a; border-radius: 16px;
            padding: 1.5rem; margin-bottom: 1.5rem;
        }
        .create-form input {
            width: 100%; padding: 0.8rem 1rem; background: rgba(0,0,0,0.3); border: 1px solid #5d4a3a;
            border-radius: 12px; color: #f3e7c0; font-family: inherit; font-size: 1rem; margin-bottom: 1rem;
        }
        .create-form input:focus { outline: none; border-color: #ff9800; }
        .btn-row { display: flex; gap: 0.8rem; }
        .btn-create { flex: 1; background: #ff9800; color: #1a1a2e; }
        .btn-create:hover { background: #ffb74d; }
        .btn-cancel { flex: 1; background: transparent; border: 1px solid #ffd54f; color: #ffd54f; }
        .btn-cancel:hover { background: rgba(255,215,80,0.1); }

        .hidden { display: none !important; }
        .back-link { display: block; text-align: center; margin-top: 1.5rem; color: #706858; text-decoration: none; font-size: 0.85rem; }
        .back-link:hover { color: #f3e7c0; }
    </style>
</head>

    // ========== ЗАГРУЗКА/СОХРАНЕНИЕ ПЛАНОВ ==========
    function loadPlans() {
        const raw = localStorage.getItem(STORAGE_KEY);
        return raw ? JSON.parse(raw) : [];
    }
    function savePlans(plans) {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(plans));
    }

                        </div>
                        <button class="plan-delete" data-delete="${i}">🗑️</button>
                    </div>`;
            });
        }
        html += `

            document.getElementById('showCreateBtn').classList.add('hidden');
            document.getElementById('createForm').classList.remove('hidden');
        });
        document.getElementById('cancelCreateBtn').addEventListener('click', () => {
            document.getElementById('createForm').classList.add('hidden');
            document.getElementById('showCreateBtn').classList.remove('hidden');
            document.getElementById('planName').value = '';
        });
        document.getElementById('confirmCreateBtn').addEventListener('click', () => {
            const name = document.getElementById('planName').value.trim();
            if (!name) { alert('Введите название планировки.'); return; }
            const plans = loadPlans();
            plans.push({ name, width: 8, height: 6, createdAt: new Date().toISOString(), walls: [], furniture: [], plants: [], altar: null });
            savePlans(plans);
            renderList();
        });
        document.querySelectorAll('.plan-card').forEach(card => {
            card.addEventListener('click', (e) => {
                if (e.target.closest('.plan-delete')) return;
                renderEditor(parseInt(card.dataset.idx));
            });
        });
        document.querySelectorAll('.plan-delete').forEach(btn => {
            btn.addEventListener('click', (e) => {
                e.stopPropagation();
                const idx = parseInt(btn.dataset.delete);
                if (confirm('Удалить эту планировку?')) {
                    const plans = loadPlans();
                    plans.splice(idx, 1);
                    savePlans(plans);
                    renderList();
                }
            });
        });

        // ========== CANVAS (с зумом и панорамированием) ==========
const canvas = document.getElementById('mainCanvas');
const ctx = canvas.getContext('2d');
const canvasArea = document.getElementById('canvasArea');
let cellSize = 50;
let offsetX = 0;  // смещение по X (панорамирование)
let offsetY = 0;  // смещение по Y (панорамирование)
let zoomLevel = 1; // уровень зума

function resizeCanvas() {
    const rect = canvasArea.getBoundingClientRect();
    canvas.width = rect.width;
    canvas.height = rect.height;
}
resizeCanvas();
window.addEventListener('resize', () => { resizeCanvas(); drawGrid(); });

// Зум колесом мыши
canvas.addEventListener('wheel', (e) => {
    if (currentMode !== 'navigate') return;
    e.preventDefault();
    const rect = canvas.getBoundingClientRect();
    const mouseX = e.clientX - rect.left;
    const mouseY = e.clientY - rect.top;
    
    const oldZoom = zoomLevel;
    if (e.deltaY < 0) zoomLevel = Math.min(3, zoomLevel * 1.1);  // увеличение
    else zoomLevel = Math.max(0.2, zoomLevel / 1.1);  // уменьшение
    
    // Зум к точке мыши
    offsetX = mouseX - (mouseX - offsetX) * (zoomLevel / oldZoom);
    offsetY = mouseY - (mouseY - offsetY) * (zoomLevel / oldZoom);
    
    cellSize = 50 * zoomLevel;
    drawAll();
});

// Панорамирование (перетаскивание)
let isPanning = false;
let panStartX = 0, panStartY = 0;

canvas.addEventListener('mousedown', (e) => {
    if (currentMode !== 'navigate') return;
    isPanning = true;
    panStartX = e.clientX - offsetX;
    panStartY = e.clientY - offsetY;
    canvas.style.cursor = 'grabbing';
});

window.addEventListener('mousemove', (e) => {
    if (!isPanning || currentMode !== 'navigate') return;
    offsetX = e.clientX - panStartX;
    offsetY = e.clientY - panStartY;
    drawAll();
});

window.addEventListener('mouseup', () => {
    isPanning = false;
    if (currentMode === 'navigate') canvas.style.cursor = 'grab';
});

// Сенсорное управление (пальцы)
let touchDist0 = 0;
canvas.addEventListener('touchstart', (e) => {
    if (currentMode !== 'navigate') return;
    if (e.touches.length === 2) {
        // Два пальца — запоминаем расстояние для зума
        const dx = e.touches[0].clientX - e.touches[1].clientX;
        const dy = e.touches[0].clientY - e.touches[1].clientY;
        touchDist0 = Math.sqrt(dx * dx + dy * dy);
    } else if (e.touches.length === 1) {
        // Один палец — панорамирование
        isPanning = true;
        panStartX = e.touches[0].clientX - offsetX;
        panStartY = e.touches[0].clientY - offsetY;
    }
});

canvas.addEventListener('touchmove', (e) => {
    if (currentMode !== 'navigate') return;
    e.preventDefault();
    if (e.touches.length === 2 && touchDist0 > 0) {
        const dx = e.touches[0].clientX - e.touches[1].clientX;
        const dy = e.touches[0].clientY - e.touches[1].clientY;
        const dist = Math.sqrt(dx * dx + dy * dy);
        zoomLevel = Math.max(0.2, Math.min(3, zoomLevel * (dist / touchDist0)));
        touchDist0 = dist;
        cellSize = 50 * zoomLevel;
        drawAll();
    } else if (e.touches.length === 1 && isPanning) {
        offsetX = e.touches[0].clientX - panStartX;
        offsetY = e.touches[0].clientY - panStartY;
        drawAll();
    }
});

canvas.addEventListener('touchend', () => {
    isPanning = false;
    touchDist0 = 0;
});

        function drawGrid() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = '#1a1a2e';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    
    // Бесконечная сетка
    const cs = cellSize;
    const startX = offsetX % cs;
    const startY = offsetY % cs;
    
    ctx.strokeStyle = 'rgba(255,255,255,0.08)';
    ctx.lineWidth = 1;
    
    // Вертикальные линии
    for (let x = startX; x < canvas.width; x += cs) {
        ctx.beginPath();
        ctx.moveTo(x, 0);
        ctx.lineTo(x, canvas.height);
        ctx.stroke();
    }
    // Горизонтальные линии
    for (let y = startY; y < canvas.height; y += cs) {
        ctx.beginPath();
        ctx.moveTo(0, y);
        ctx.lineTo(canvas.width, y);
        ctx.stroke();
    }
    
    
}

canvas.addEventListener('click', (e) => {
    if (currentMode === 'navigate') return;

    const rect = canvas.getBoundingClientRect();
    const mouseX = e.clientX - rect.left;
    const mouseY = e.clientY - rect.top;

    const gridX = (mouseX - offsetX) / cellSize;
    const gridY = (mouseY - offsetY) / cellSize;

    const x = Math.floor(gridX);
    const y = Math.floor(gridY);

    const tool = currentTool;
    const sub = selectedSubItem;

    // Ластик — удаляет всё в клетке
    if (tool === 'eraser') {
        plan.walls = plan.walls.filter(w => !(w.x === x && w.y === y));
        plan.furniture = plan.furniture.filter(f => !(f.x === x && f.y === y));
        plan.plants = plan.plants.filter(p => !(p.x === x && p.y === y));
        if (plan.altar && plan.altar.x === x && plan.altar.y === y) plan.altar = null;
        if (plan.floors) plan.floors = plan.floors.filter(fl => !(fl.x === x && fl.y === y));
        saveAndDraw();
        return;
    }

    if (!sub) return;

    const itemName = sub.item;
    const itemData = getItemData(sub.sub, sub.category, sub.item);
    if (!itemData) return;

    const itemObj = {
        x, y,
        type: tool,
        sub: sub.sub,
        category: sub.category,
        name: itemName,
        qs: itemData.qs || 0,
        ts: itemData.ts || 0,
        cs: itemData.cs || 0,
        gen: itemData.gen || 0,
        color: itemData.color || '#ffd54f'
    };

    const hasFloor = plan.floors && plan.floors.some(fl => fl.x === x && fl.y === y);
    const hasWallHere = plan.walls.some(w => w.x === x && w.y === y);
    const hasFurniture = plan.furniture.some(f => f.x === x && f.y === y);
    const hasPlant = plan.plants.some(p => p.x === x && p.y === y);
    const hasAltar = plan.altar && plan.altar.x === x && plan.altar.y === y;

    switch (tool) {
        case 'floor':
            // Пол можно ставить всегда
            if (!plan.floors) plan.floors = [];
            plan.floors = plan.floors.filter(fl => !(fl.x === x && fl.y === y));
            plan.floors.push(itemObj);
            break;

        case 'wall':
            // Стены ТОЛЬКО на пол
            if (!hasFloor) {
                alert('Сначала положите пол! 🪵');
                return;
            }
            // Нельзя ставить стену поверх мебели/растений/алтаря
            if (hasFurniture || hasPlant || hasAltar) {
                alert('Здесь уже стоит мебель, растение или алтарь. Удалите их сначала. 🗑️');
                return;
            }
            if (hasWallHere) {
                plan.walls = plan.walls.filter(w => !(w.x === x && w.y === y));
            }
            plan.walls.push(itemObj);
            break;
            
        case 'wallpaper':
            // Обои ТОЛЬКО на стены
            if (!hasWallHere) {
                alert('Здесь нет стены. Сначала поставьте стену. 🧱');
                return;
            }
            const wallToUpdate = plan.walls.find(w => w.x === x && w.y === y);
            wallToUpdate.wallpaper = itemName;
            wallToUpdate.wallpaperData = itemData;
            break;
            
        case 'window':
        case 'door':
            // Окна и двери — только на стены
            if (!hasWallHere) {
                alert('Окна и двери можно ставить только на стены. 🧱');
                return;
            }
            plan.walls = plan.walls.filter(w => !(w.x === x && w.y === y));
            itemObj.onWall = true;
            plan.walls.push(itemObj);
            break;

        case 'furniture':
            // Мебель — только на пол, не на стену
            if (hasWallHere) {
                alert('Нельзя ставить мебель на стену! Удалите стену ластиком. 🗑️');
                return;
            }
            if (!hasFloor) {
                alert('Сначала положите пол! 🪵');
                return;
            }
            plan.furniture = plan.furniture.filter(f => !(f.x === x && f.y === y));
            plan.furniture.push(itemObj);
            break;
            
        case 'plant':
            // Растения — только на пол, не на стену
            if (hasWallHere) {
                alert('Нельзя ставить растение на стену! Удалите стену ластиком. 🗑️');
                return;
            }
            if (!hasFloor) {
                alert('Сначала положите пол! 🪵');
                return;
            }
            plan.plants = plan.plants.filter(p => !(p.x === x && p.y === y));
            plan.plants.push(itemObj);
            break;
            
        case 'altar':
            // Алтарь — только на пол, не на стену
            if (hasWallHere) {
                alert('Нельзя ставить алтарь на стену! Удалите стену ластиком. 🗑️');
                return;
            }
            if (!hasFloor) {
                alert('Сначала положите пол! 🪵');
                return;
            }
            plan.altar = { x, y, ...itemObj };
            break;
    }

    saveAndDraw();
});

// ========== ОТРИСОВКА ВСЕХ ОБЪЕКТОВ НА СЕТКЕ ==========
function getItemData(subKey, category, itemName) {
    const items = ITEMS_LIBRARY[subKey];
    if (!items) return null;
    if (category && items[category]) {
        return items[category][itemName] || null;
    }
    return items[itemName] || null;
}

function drawAll() {
    drawGrid();
    const cs = cellSize;
    const ox = offsetX;
    const oy = offsetY;

    // 1. ПОЛ
    if (plan.floors) {
        plan.floors.forEach(fl => {
            ctx.fillStyle = fl.color || '#bcaaa4';
            ctx.fillRect(ox + fl.x * cs + 1, oy + fl.y * cs + 1, cs - 2, cs - 2);
            ctx.fillStyle = 'rgba(0,0,0,0.1)';
            for (let i = 0; i < 3; i++) {
                ctx.fillRect(ox + fl.x * cs + 4 + i * cs/3, oy + fl.y * cs + 4, 2, cs - 8);
            }
        });
    }

    // 2. СТЕНЫ
    plan.walls.forEach(w => {
        if (w.type === 'wall' || w.type === 'floor') {
            ctx.fillStyle = w.color || '#888';
            ctx.fillRect(ox + w.x * cs, oy + w.y * cs, cs, 4);
            ctx.fillRect(ox + w.x * cs, oy + w.y * cs + cs - 4, cs, 4);
            ctx.fillRect(ox + w.x * cs, oy + w.y * cs, 4, cs);
            ctx.fillRect(ox + w.x * cs + cs - 4, oy + w.y * cs, 4, cs);
            ctx.fillStyle = '#1a1a2e';
            ctx.fillRect(ox + w.x * cs + 4, oy + w.y * cs + 4, cs - 8, cs - 8);
            if (w.wallpaperData && w.wallpaperData.color && w.wallpaperData.color !== 'transparent') {
                ctx.fillStyle = w.wallpaperData.color;
                ctx.fillRect(ox + w.x * cs + 4, oy + w.y * cs + 4, cs - 8, cs - 8);
            }
        } else if (w.type === 'window') {
            ctx.fillStyle = w.color || '#64b5f6';
            ctx.fillRect(ox + w.x * cs, oy + w.y * cs + cs/3, cs, cs/3);
            ctx.fillStyle = '#fff';
            ctx.font = `${Math.max(12, cs/3)}px Georgia`;
            ctx.textAlign = 'center';
            ctx.fillText('🪟', ox + w.x * cs + cs/2, oy + w.y * cs + cs/2 + 5);
        } else if (w.type === 'door') {
            ctx.fillStyle = w.color || '#8d6e63';
            ctx.fillRect(ox + w.x * cs + cs/4, oy + w.y * cs, cs/2, cs);
            ctx.fillStyle = '#fff';
            ctx.font = `${Math.max(12, cs/3)}px Georgia`;
            ctx.textAlign = 'center';
            ctx.fillText('🚪', ox + w.x * cs + cs/2, oy + w.y * cs + cs/2 + 5);
        }
    });

    // 3. МЕБЕЛЬ
    plan.furniture.forEach(f => {
        ctx.fillStyle = 'rgba(0,0,0,0.3)';
        ctx.fillRect(ox + f.x * cs + 2, oy + f.y * cs + 2, cs - 4, cs - 4);
        ctx.fillStyle = '#fff';
        const emoji = getFurnitureEmoji(f.name);
        ctx.font = `${Math.max(14, cs/2.5)}px Georgia`;
        ctx.textAlign = 'center';
        ctx.fillText(emoji, ox + f.x * cs + cs/2, oy + f.y * cs + cs/2 + 5);
        ctx.fillStyle = '#ccc';
        ctx.font = `${Math.max(6, cs/7)}px Georgia`;
        ctx.fillText(f.name.substring(0, 6), ox + f.x * cs + cs/2, oy + f.y * cs + cs - 2);
    });

    // 4. РАСТЕНИЯ
    plan.plants.forEach(p => {
        ctx.fillStyle = 'rgba(76,175,80,0.4)';
        ctx.beginPath();
        ctx.arc(ox + p.x * cs + cs/2, oy + p.y * cs + cs/2, cs/2 - 3, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#fff';
        ctx.font = `${Math.max(14, cs/2.5)}px Georgia`;
        ctx.textAlign = 'center';
        ctx.fillText('🪴', ox + p.x * cs + cs/2, oy + p.y * cs + cs/2 + 5);
    });

    // 5. АЛТАРЬ
    if (plan.altar) {
        const a = plan.altar;
        ctx.fillStyle = 'rgba(255,215,0,0.4)';
        ctx.fillRect(ox + a.x * cs + 2, oy + a.y * cs + 2, cs - 4, cs - 4);
        ctx.fillStyle = '#fff';
        ctx.font = `${Math.max(16, cs/2)}px Georgia`;
        ctx.textAlign = 'center';
        ctx.fillText('🕯️', ox + a.x * cs + cs/2, oy + a.y * cs + cs/2 + 6);
    }
}

                🌡️ Tₛ: 1 = ледяной ступор • 5 = оптимум • 10 = перегрев, паника<br>
                💡 Re < 1000 = ламинарный • Re > 4000 = турбулентный
            </p>
            <div style="display: flex; justify-content: center; gap: 0.5rem; margin-bottom: 1rem; flex-wrap: wrap;">
                <button class="param-btn active" data-param="qs" style="padding:0.4rem 1rem; border:1px solid #ffd54f; background:rgba(255,215,80,0.2); color:#ffd54f; border-radius:20px; cursor:pointer;">☀️ Qₛ</button>
                <button class="param-btn" data-param="ts" style="padding:0.4rem 1rem; border:1px solid #ff9800; background:transparent; color:#ff9800; border-radius:20px; cursor:pointer;">🌡️ Tₛ</button>
                <button class="param-btn" data-param="cs" style="padding:0.4rem 1rem; border:1px solid #42a5f5; background:transparent; color:#42a5f5; border-radius:20px; cursor:pointer;">🎯 Cₛ</button>
                <button class="param-btn" data-param="re" style="padding:0.4rem 1rem; border:1px solid #ef5350; background:transparent; color:#ef5350; border-radius:20px; cursor:pointer;">🌪️ Re</button>
            </div>
            <canvas id="heatmapCanvas" style="width:100%; border:1px solid #5d4a3a; border-radius:12px;"></canvas>
            <div style="text-align:center; margin-top:1rem;">
                <button id="closeAnalysisBtn" style="padding:0.6rem 2rem; background:#ce93d8; color:#1a1a2e; border:none; border-radius:30px; cursor:pointer; font-family:inherit; font-size:1rem;">Закрыть</button>
            </div>
        </div>
    `;
    document.body.appendChild(overlay);

    drawHeatmap('qs');

    overlay.querySelectorAll('.param-btn').forEach(btn => {
        btn.addEventListener('click', () => {
            overlay.querySelectorAll('.param-btn').forEach(b => { b.classList.remove('active'); b.style.background = 'transparent'; });
            btn.classList.add('active');
            const p = btn.dataset.param;
            btn.style.background = p === 'qs' ? 'rgba(255,215,80,0.2)' : p === 'ts' ? 'rgba(255,152,0,0.2)' : p === 'cs' ? 'rgba(66,165,245,0.2)' : 'rgba(239,83,80,0.2)';
            drawHeatmap(p);
        });
    });

    overlay.querySelector('#closeAnalysisBtn').addEventListener('click', () => document.body.removeChild(overlay));
    overlay.addEventListener('click', (e) => { if (e.target === overlay) document.body.removeChild(overlay); });
}

function drawHeatmap(param) {
    const canvas = document.getElementById('heatmapCanvas');
    if (!canvas) return;
    const ctx = canvas.getContext('2d');
    const size = 30;
    const margin = 2;

    let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
    Object.keys(analysisData).forEach(key => {
        if (analysisData[key].count === 0) return;
        const [cx, cy] = key.split(',').map(Number);
        if (cx < minX) minX = cx;
        if (cx > maxX) maxX = cx;
        if (cy < minY) minY = cy;
        if (cy > maxY) maxY = cy;
    });

    if (minX === Infinity) { canvas.width = 400; canvas.height = 200; return; }

    const cols = maxX - minX + 1;
    const rows = maxY - minY + 1;
    canvas.width = cols * size + margin * 2;
    canvas.height = rows * size + margin * 2;
    canvas.style.width = Math.min(canvas.width, 700) + 'px';
    canvas.style.height = (canvas.height / canvas.width * Math.min(canvas.width, 700)) + 'px';

    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // Находим min/max для градиента
    let allVals = [];
    Object.values(analysisData).forEach(c => {
        if (c.count > 0) {
            // Для температуры — усредняем!
            const val = param === 'ts' ? c.ts / c.count : c[param];
            allVals.push(val);
        }
    });
    
    const minVal = Math.min(...allVals);
    const maxVal = Math.max(...allVals);
    const range = maxVal - minVal || 1;

    Object.keys(analysisData).forEach(key => {
        const c = analysisData[key];
        if (c.count === 0) return;
        const [cx, cy] = key.split(',').map(Number);
        
        // Для температуры — усредняем!
        const val = param === 'ts' ? c.ts / c.count : c[param];
        const t = (val - minVal) / range;

        let r, g, b;
        if (t < 0.5) { r = Math.floor(66 * (1 - t * 2)); g = Math.floor(165 * (t * 2)); b = Math.floor(245); }
        else { r = Math.floor(245 * ((t - 0.5) * 2)); g = Math.floor(165 * (1 - (t - 0.5) * 2)); b = Math.floor(66); }
        
        ctx.fillStyle = `rgb(${r},${g},${b})`;
        ctx.fillRect(margin + (cx - minX) * size, margin + (cy - minY) * size, size - 1, size - 1);

        ctx.fillStyle = '#fff';
        ctx.font = `${Math.max(8, size/3)}px Georgia`;
        ctx.textAlign = 'center';
        ctx.fillText(val.toFixed(1), margin + (cx - minX) * size + size/2, margin + (cy - minY) * size + size/2 + 4);
    });
}
