<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Тест: Светлая или Тёмная еда? • Идеатоника</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: linear-gradient(145deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            font-family: 'Georgia', 'Times New Roman', serif;
            padding: 2rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            transition: background 0.5s ease;
        }
        .cosmic-bg {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle at 30% 40%, rgba(255,215,150,0.08) 0%, transparent 50%),
                        radial-gradient(circle at 80% 70%, rgba(100,150,255,0.05) 0%, transparent 60%);
            pointer-events: none; z-index: 0;
        }
        .test-container {
            max-width: 700px;
            width: 100%;
            position: relative;
            z-index: 1;
            background: rgba(30, 40, 60, 0.85);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(227, 184, 124, 0.4);
            border-radius: 32px;
            padding: 2.5rem;
            box-shadow: 0 20px 40px rgba(0,0,0,0.5);
            transition: border-color 0.3s ease;
        }
        
        .test-header {
            text-align: center;
            margin-bottom: 2rem;
        }
        .test-header h1 {
            font-size: 2.2rem;
            color: #f3e7c0;
            margin-bottom: 0.5rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        .progress-bar {
            width: 100%;
            height: 6px;
            background: rgba(0,0,0,0.3);
            border-radius: 3px;
            margin: 1.5rem 0;
        }
        .progress-fill {
            height: 100%;
            background: #81c784;
            border-radius: 3px;
            width: 0%;
            transition: width 0.3s ease;
        }
        .progress-text {
            text-align: right;
            color: #a09080;
            font-size: 0.8rem;
            margin-top: 0.3rem;
        }
        
        .question-box {
            margin-bottom: 2rem;
        }
        .question-text {
            color: #f3e7c0;
            font-size: 1.3rem;
            margin-bottom: 1.5rem;
            line-height: 1.5;
        }
        .options {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .option {
            background: rgba(0,0,0,0.2);
            border: 1px solid #5d4a3a;
            border-radius: 16px;
            padding: 1rem 1.5rem;
            cursor: pointer;
            transition: all 0.2s ease;
            color: #d0c8b8;
            display: flex;
            align-items: center;
            gap: 15px;
        }
        .option:hover {
            background: rgba(129, 199, 132, 0.15);
            border-color: #81c784;
        }
        .option.selected {
            background: rgba(129, 199, 132, 0.25);
            border-color: #81c784;
            color: #f3e7c0;
        }
        .option-marker {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            border: 2px solid #5d4a3a;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }
        .option.selected .option-marker {
            border-color: #81c784;
            background: #81c784;
            box-shadow: 0 0 10px #81c784;
        }
        .option.selected .option-marker::after {
            content: "✓";
            color: #1a1a2e;
            font-weight: bold;
        }
        .option-text {
            flex: 1;
        }
        
        .nav-buttons {
            display: flex;
            justify-content: space-between;
            margin-top: 2rem;
            gap: 15px;
        }
        .btn {
            background: transparent;
            border: 1.5px solid #81c784;
            color: #81c784;
            padding: 0.8rem 1.8rem;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 40px;
            cursor: pointer;
            transition: 0.2s;
            font-family: inherit;
        }
        .btn:hover {
            background: #81c784;
            color: #1a1a2e;
        }
        .btn:disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }
        .btn-secondary {
            border-color: #5d4a3a;
            color: #a09080;
        }
        .btn-secondary:hover {
            background: #5d4a3a;
            color: #d0c8b8;
        }
        
        .result-container {
            text-align: center;
        }
        .result-score {
            font-size: 5rem;
            font-weight: bold;
            margin: 1rem 0;
        }
        .result-scale {
            font-size: 1.2rem;
            margin-bottom: 1.5rem;
        }
        .result-comment {
            background: rgba(0,0,0,0.2);
            border-radius: 20px;
            padding: 1.5rem;
            margin: 1.5rem 0;
            line-height: 1.6;
        }
        .result-advice {
            background: rgba(129, 199, 132, 0.1);
            border-left: 4px solid #81c784;
            padding: 1.2rem 1.5rem;
            border-radius: 0 12px 12px 0;
            text-align: left;
        }
        
        .hidden {
            display: none !important;
        }
        
        .back-link {
            display: inline-block;
            margin-top: 1.5rem;
            color: #81c784;
            text-decoration: none;
            font-size: 0.9rem;
        }
        .back-link:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body id="mainBody">
<div class="cosmic-bg"></div>
<div class="test-container" id="testContainer">
    
    <div class="test-header">
        <h1>
            <span>🍎</span>
            <span id="testTitle">Светлая или Тёмная еда?</span>
            <span>🍔</span>
        </h1>
        <div class="progress-bar">
            <div class="progress-fill" id="progressFill"></div>
        </div>
        <div class="progress-text" id="progressText">Вопрос 1 из 10</div>
    </div>
    
    <div id="questionContainer"></div>
    
    <div class="nav-buttons">
        <button class="btn btn-secondary" id="prevBtn" disabled>← Назад</button>
        <button class="btn btn-secondary" id="exitBtn">🚪 Выйти</button>
        <button class="btn" id="nextBtn">Далее →</button>
    </div>
    
    <div style="text-align: center;">
        <a href="diagnostics-hub.html" class="back-link">← Вернуться в Хаб Диагностики</a>
    </div>
</div>

<script>
    (function() {
        const questions = [
            {
                text: "Что вы чаще всего едите на завтрак?",
                options: [
                    { text: "Фастфуд, бутерброды с колбасой, сладкие хлопья", value: -3 },
                    { text: "Бутерброды с маслом/сыром, магазинная выпечка", value: -1 },
                    { text: "Каша быстрого приготовления, мюсли из пакета", value: 0 },
                    { text: "Овсянка/гречка, сваренные на воде", value: 2 },
                    { text: "Домашняя каша на молоке, омлет, творог", value: 3 },
                    { text: "Цельнозерновой хлеб, авокадо, свежие овощи", value: 4 },
                    { text: "Свежевыжатый сок, фрукты, проростки, мёд", value: 5 }
                ]
            },
            {
                text: "Как часто вы едите свежие овощи и фрукты?",
                options: [
                    { text: "Почти никогда. Овощи — это гарнир в супе", value: -3 },
                    { text: "Редко, maybe раз в неделю", value: -1 },
                    { text: "Пару раз в неделю, когда есть в холодильнике", value: 1 },
                    { text: "Стараюсь каждый день, но не всегда получается", value: 3 },
                    { text: "Каждый день, минимум 1-2 порции", value: 4 },
                    { text: "Несколько раз в день, основа моего рациона", value: 5 },
                    { text: "Я — сыроед/веган, овощи и фрукты — это 80% моей еды", value: 5 }
                ]
            },
            {
                text: "Какую воду вы пьёте чаще всего?",
                options: [
                    { text: "Газировку, колу, энергетики", value: -3 },
                    { text: "Соки из пакетов, сладкий чай, кофе", value: -1 },
                    { text: "Фильтрованную воду из-под крана", value: 1 },
                    { text: "Бутилированную воду", value: 2 },
                    { text: "Родниковую или колодезную воду", value: 4 },
                    { text: "Структурированную/заряженную воду", value: 5 },
                    { text: "Я пью только освящённую или наговорённую воду", value: 5 }
                ]
            },
            {
                text: "Где вы обычно обедаете / ужинаете?",
                options: [
                    { text: "Фастфуд, уличная еда, автоматы", value: -3 },
                    { text: "Столовая, кафе с разогретой едой", value: -1 },
                    { text: "Дома, но из полуфабрикатов", value: 0 },
                    { text: "Дома, готовлю сам(а) из обычных продуктов", value: 2 },
                    { text: "Дома, из свежих фермерских продуктов", value: 4 },
                    { text: "Готовлю с любовью, использую натуральные специи и травы", value: 5 },
                    { text: "Ем только осознанно, с молитвой/благодарностью, в тишине", value: 5 }
                ]
            },
            {
                text: "Как часто в вашем рационе появляются ЧИПСЫ, СУХАРИКИ, ФАСТФУД, ГАЗИРОВКА?",
                options: [
                    { text: "Каждый день, это моя основная еда", value: -3 },
                    { text: "Несколько раз в неделю", value: -2 },
                    { text: "Раз в неделю", value: -1 },
                    { text: "Пару раз в месяц", value: 1 },
                    { text: "Очень редко, maybe раз в полгода", value: 3 },
                    { text: "Почти никогда, я избегаю такой еды", value: 4 },
                    { text: "Никогда. Я считаю это семантическим мусором", value: 5 }
                ]
            },
            {
                text: "Из какой посуды вы обычно едите?",
                options: [
                    { text: "Пластиковые контейнеры, одноразовая посуда", value: -2 },
                    { text: "Дешёвый пластик, старые сковородки с царапинами", value: -1 },
                    { text: "Обычная керамика, стекло", value: 1 },
                    { text: "Качественная керамика, деревянные миски", value: 3 },
                    { text: "Дерево, глина, чугун, серебро", value: 4 },
                    { text: "Освящённая посуда, намолотые деревянные ложки", value: 5 },
                    { text: "У меня есть ритуальная посуда для особых приёмов пищи", value: 5 }
                ]
            },
            {
                text: "Как вы относитесь к процессу приготовления еды?",
                options: [
                    { text: "Ненавижу готовить, это трата времени", value: -3 },
                    { text: "Готовлю на скорую руку, лишь бы наесться", value: -1 },
                    { text: "Нейтрально, готовлю, потому что надо", value: 0 },
                    { text: "Стараюсь готовить с душой, когда есть время", value: 2 },
                    { text: "Люблю готовить, это мой ритуал, моя медитация", value: 4 },
                    { text: "Готовлю только в хорошем настроении, с благословением", value: 5 },
                    { text: "Я — повар-семантик, заряжаю еду намерением", value: 5 }
                ]
            },
            {
                text: "Чувствуете ли вы разницу во вкусе/энергии между домашней и магазинной едой?",
                options: [
                    { text: "Нет, еда — она и есть еда", value: -2 },
                    { text: "Иногда, но не придаю значения", value: 0 },
                    { text: "Да, домашняя обычно вкуснее", value: 2 },
                    { text: "Определённо! Домашняя еда «греет душу»", value: 3 },
                    { text: "Очень сильно. Я чувствую «пустоту» в магазинной еде", value: 4 },
                    { text: "Я ощущаю Qₛ еды и могу сказать, с каким настроением её готовили", value: 5 },
                    { text: "Я — сенситив, для меня еда — это чистая семантика", value: 5 }
                ]
            },
            {
                text: "Есть ли у вас ритуал перед едой (молитва, благодарность, минута тишины)?",
                options: [
                    { text: "Нет, я ем на ходу, не задумываясь", value: -3 },
                    { text: "Иногда, по праздникам", value: -1 },
                    { text: "Редко, когда вспоминаю", value: 0 },
                    { text: "Иногда благодарю мысленно", value: 1 },
                    { text: "Стараюсь регулярно благодарить перед едой", value: 3 },
                    { text: "Всегда читаю молитву или благословляю пищу", value: 4 },
                    { text: "У меня сложный ритуал: молитва, осознанное поедание, тишина", value: 5 }
                ]
            },
            {
                text: "Какое утверждение лучше всего описывает ваше отношение к еде?",
                options: [
                    { text: "«Еда — это просто топливо. Не важно, что есть, лишь бы сытно»", value: -3 },
                    { text: "«Я ем то, что вкусно, не задумываюсь о пользе»", value: -1 },
                    { text: "«Я стараюсь питаться правильно, но без фанатизма»", value: 1 },
                    { text: "«Я выбираю продукты осознанно, читаю состав»", value: 2 },
                    { text: "«Я чувствую, какая еда мне нужна, и ем интуитивно»", value: 3 },
                    { text: "«Еда для меня — это священнодействие. Я ем Свет»", value: 4 },
                    { text: "«Я — семантический гурман. Я измеряю Qₛ еды и выбираю лучшее»", value: 5 }
                ]
            }
        ];
        
        const totalQuestions = questions.length;
        let currentIndex = 0;
        let answers = new Array(totalQuestions).fill(null);
        
        const questionContainer = document.getElementById('questionContainer');
        const prevBtn = document.getElementById('prevBtn');
        const nextBtn = document.getElementById('nextBtn');
        const exitBtn = document.getElementById('exitBtn');
        const progressFill = document.getElementById('progressFill');
        const progressText = document.getElementById('progressText');
        const testContainer = document.getElementById('testContainer');
        const mainBody = document.getElementById('mainBody');
        const testTitle = document.getElementById('testTitle');
        
        let isResultMode = false;
        
        function renderQuestion(index) {
            const q = questions[index];
            let html = `<div class="question-box">`;
            html += `<div class="question-text">${index + 1}. ${q.text}</div>`;
            html += `<div class="options">`;
            
            q.options.forEach((opt) => {
                const isSelected = answers[index] === opt.value;
                html += `
                    <div class="option ${isSelected ? 'selected' : ''}" data-value="${opt.value}">
                        <div class="option-marker"></div>
                        <div class="option-text">${opt.text}</div>
                    </div>
                `;
            });
            
            html += `</div></div>`;
            questionContainer.innerHTML = html;
            
            document.querySelectorAll('.option').forEach(opt => {
                opt.addEventListener('click', () => {
                    const value = parseInt(opt.dataset.value);
                    answers[index] = value;
                    renderQuestion(index);
                });
            });
            
            const progress = ((index + 1) / totalQuestions) * 100;
            progressFill.style.width = progress + '%';
            progressText.textContent = `Вопрос ${index + 1} из ${totalQuestions}`;
            
            prevBtn.disabled = index === 0;
            if (index === totalQuestions - 1) {
                nextBtn.textContent = '🎉 Завершить';
            } else {
                nextBtn.textContent = 'Далее →';
            }
        }
        
        function calculateResult() {
            const sum = answers.reduce((acc, val) => acc + val, 0);
            // Максимум 50, минимум -28
            // Приводим к гастрономическому рангу от -3 до +8
            let rank;
            if (sum >= 40) rank = 8;
            else if (sum >= 30) rank = 7;
            else if (sum >= 22) rank = 6;
            else if (sum >= 15) rank = 5;
            else if (sum >= 8) rank = 4;
            else if (sum >= 2) rank = 3;
            else if (sum >= -3) rank = 2;
            else if (sum >= -8) rank = 1;
            else if (sum >= -13) rank = 0;
            else if (sum >= -18) rank = -1;
            else if (sum >= -23) rank = -2;
            else rank = -3;
            return rank;
        }
        
        function getResultColor(rank) {
            if (rank >= 7) return '#ffd54f';
            if (rank >= 5) return '#81c784';
            if (rank >= 3) return '#90caf9';
            if (rank >= 1) return '#b0bec5';
            if (rank >= 0) return '#a1887f';
            if (rank >= -1) return '#ffb74d';
            if (rank >= -2) return '#ef5350';
            return '#b71c1c';
        }
        
        function getResultComment(rank) {
            if (rank >= 7) return "🌟 Ваш рацион — СВЕТЛЫЙ. Вы питаетесь как просветлённый! Ваша еда — это генератор высокого Qₛ. Вы наверняка чувствуете лёгкость, энергию и ясность.";
            if (rank >= 5) return "🌿 Ваш рацион — ЖИВОЙ. Вы едите много свежего, натурального. Ваша еда поддерживает ваше поле в хорошем состоянии.";
            if (rank >= 3) return "🥗 Ваш рацион — ЗДОРОВЫЙ. Вы стараетесь питаться правильно, но есть куда расти. Добавьте больше свежих овощей и осознанности.";
            if (rank >= 1) return "🍞 Ваш рацион — НЕЙТРАЛЬНЫЙ. Вы едите обычную еду, не вредную, но и не «живую». Попробуйте заменить полуфабрикаты на домашнюю еду.";
            if (rank >= 0) return "🍔 Ваш рацион — ПЕРЕХОДНЫЙ. В вашей еде есть и хорошее, и плохое. Пора задуматься о качестве продуктов.";
            if (rank >= -1) return "🌑 Ваш рацион — ТЁМНЫЙ. Вы едите много обработанной, «мёртвой» еды. Это истощает ваше поле. Срочно добавьте свежих овощей!";
            if (rank >= -2) return "💀 Ваш рацион — БЛИЗОК К ТОКСИЧНОМУ. Фастфуд, газировка, полуфабрикаты... Ваше поле кричит о помощи. Начните с малого: замените газировку на воду.";
            return "☠️ Ваш рацион — ТОКСИЧНЫЙ. Вы употребляете много «семантического мусора». Это разрушает ваше здоровье и психику. Вам нужна срочная гастрономическая перезагрузка!";
        }
        
        function getResultAdvice(rank) {
            if (rank >= 5) return "🌟 Совет: Продолжайте в том же духе! Делитесь своими знаниями о «живой» еде с близкими. Попробуйте вести дневник питания и отмечайте, как разная еда влияет на ваше состояние.";
            if (rank >= 3) return "🌱 Совет: Добавьте в рацион больше свежих овощей и фруктов. Попробуйте проращивать зёрна (пшеницу, маш) — это мощный генератор Qₛ. Готовьте с любовью.";
            if (rank >= 1) return "🍎 Совет: Начните с одного изменения: замените магазинные сладости на сухофрукты и мёд. Пейте больше чистой воды. Ходите на рынок за фермерскими продуктами.";
            if (rank >= 0) return "🔄 Совет: Пора меняться! Попробуйте 1 день в неделю питаться только «живой» едой (фрукты, овощи, орехи). Вы почувствуете разницу. Уберите газировку.";
            if (rank >= -1) return "⚠️ Совет: Исключите фастфуд и чипсы. Замените их на орехи и сухофрукты. Начните читать состав продуктов. Всё, что содержит глутамат и красители, — в мусор.";
            if (rank >= -2) return "🆘 Совет: Вам нужна гастрономическая интервенция. Проведите 3-дневный детокс на свежих овощах и воде. Посмотрите на Гастрономическую Таблицу — она укажет путь.";
            return "🚨 Совет: Ваше питание разрушает вас. Начните с визита к диетологу и психологу (пищевые привычки часто связаны с эмоциями). Замените газировку на воду. Это первый шаг.";
        }
        
        function showResult() {
            isResultMode = true;
            const rank = calculateResult();
            const color = getResultColor(rank);
            const comment = getResultComment(rank);
            const advice = getResultAdvice(rank);
            
            mainBody.style.background = `linear-gradient(145deg, ${color}20 0%, #16213e 100%)`;
            testContainer.style.borderColor = color;
            
            let html = `<div class="result-container">`;
            html += `<h2 style="color: ${color};">Ваш гастрономический ранг</h2>`;
            html += `<div class="result-score" style="color: ${color};">${rank > 0 ? '+' : ''}${rank}</div>`;
            html += `<div class="result-scale">по шкале от -3 (Токсичная) до +8 (Светлая)</div>`;
            html += `<div class="result-comment" style="color: #d0c8b8;">${comment}</div>`;
            html += `<div class="result-advice" style="color: #d0c8b8;">${advice}</div>`;
            html += `<p style="margin-top: 1.5rem; color: #a09080; font-style: italic;">Подробнее о рангах еды — в Гастрономической Таблице на нашем Портале.</p>`;
            html += `</div>`;
            
            questionContainer.innerHTML = html;
            
            prevBtn.classList.add('hidden');
            nextBtn.classList.add('hidden');
            exitBtn.textContent = '🔄 Пройти заново';
            exitBtn.classList.remove('btn-secondary');
            exitBtn.classList.add('btn');
            
            testTitle.textContent = `Результат: Ранг = ${rank > 0 ? '+' : ''}${rank}`;
            progressText.textContent = `Тест завершён`;
            
            setTimeout(function() {
    const passportBtn = document.createElement('button');
    passportBtn.textContent = '💾 Сохранить результат в Семантический Паспорт';
    passportBtn.style.cssText = 'display: block; margin: 2rem auto; padding: 1rem 2rem; background: #ffb74d; color: #1a1a2e; border: none; border-radius: 40px; font-size: 1rem; cursor: pointer; font-weight: bold; transition: 0.3s;';
    passportBtn.onmouseover = () => passportBtn.style.background = '#ff9800';
    passportBtn.onmouseout = () => passportBtn.style.background = '#ffb74d';

    passportBtn.addEventListener('click', function() {
        const scoreElement = document.querySelector('.result-score');
        if (scoreElement) {
            const resultValue = parseFloat(scoreElement.textContent);
            if (!isNaN(resultValue)) {
                localStorage.setItem('ideatonika_test_food', resultValue);
                passportBtn.textContent = '✅ Сохранено в Паспорт!';
                passportBtn.style.background = '#e65100';
                passportBtn.style.color = 'white';
                passportBtn.disabled = true;
            }
        }
    });

    const container = document.querySelector('.result-container') || document.getElementById('questionContainer');
    if (container) {
        container.appendChild(passportBtn);
    }
}, 100);

// ========== КНОПКА "ПОДЕЛИТЬСЯ РЕЗУЛЬТАТОМ" ==========
setTimeout(function() {
    const shareContainer = document.createElement('div');
    shareContainer.style.cssText = 'text-align: center; margin-top: 1.5rem;';

    const shareBtn = document.createElement('button');
    shareBtn.textContent = '📤 Поделиться результатом';
    shareBtn.style.cssText = 'display: block; margin: 0 auto 0.8rem auto; padding: 0.8rem 2rem; background: transparent; color: #81c784; border: 1.5px solid #81c784; border-radius: 40px; font-size: 1rem; cursor: pointer; font-weight: bold; transition: 0.3s; font-family: Georgia, serif;';
    shareBtn.onmouseover = () => shareBtn.style.background = '#81c784';
    shareBtn.onmouseout = () => shareBtn.style.background = 'transparent';
    shareBtn.onmouseover = () => shareBtn.style.color = '#1a1a2e';
    shareBtn.onmouseout = () => shareBtn.style.color = '#81c784';

    shareBtn.addEventListener('click', function() {
        // Получаем название теста из заголовка страницы
        const testName = document.title.replace(' • Идеатоника', '').trim();
        
        // Получаем результат из элемента .result-score
        const scoreElement = document.querySelector('.result-score');
        let resultText = '';
        if (scoreElement) {
            resultText = scoreElement.textContent.trim();
        }
        
        // Получаем комментарий из элемента .result-comment или .result-interpretation
        const commentElement = document.querySelector('.result-comment') || document.querySelector('.result-interpretation');
        let commentText = '';
        if (commentElement) {
            commentText = commentElement.textContent.trim();
        }
        
        // Формируем текст для отправки
        const shareText = `🧪 Я прошёл тест «${testName}» на портале Идеатоника!\n\n` +
            `📊 Мой результат: ${resultText}\n` +
            `💬 ${commentText}\n\n` +
            `🎯 А какой результат у тебя?\n` +
            `👉 Пройти тест: ${window.location.href}\n\n` +
            `🌌 Идеатоника — физика смысла.`;
        
        // Пытаемся использовать Web Share API (мобильные устройства)
        if (navigator.share) {
            navigator.share({
                title: `Мой результат теста «${testName}»`,
                text: shareText,
                url: window.location.href
            }).catch(() => {
                // Если не получилось — копируем в буфер
                copyToClipboard(shareText);
            });
        } else {
            // Если Web Share API не поддерживается — копируем в буфер
            copyToClipboard(shareText);
        }
    });

    function copyToClipboard(text) {
        if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(text).then(() => {
                const originalText = shareBtn.textContent;
                shareBtn.textContent = '✅ Скопировано! Отправь другу';
                shareBtn.style.borderColor = '#ffd54f';
                shareBtn.style.color = '#ffd54f';
                setTimeout(() => {
                    shareBtn.textContent = originalText;
                    shareBtn.style.borderColor = '#81c784';
                    shareBtn.style.color = '#81c784';
                }, 2500);
            }).catch(() => {
                fallbackCopy(text);
            });
        } else {
            fallbackCopy(text);
        }
    }

    function fallbackCopy(text) {
        const textarea = document.createElement('textarea');
        textarea.value = text;
        textarea.style.position = 'fixed';
        textarea.style.left = '-9999px';
        document.body.appendChild(textarea);
        textarea.select();
        try {
            document.execCommand('copy');
            const originalText = shareBtn.textContent;
            shareBtn.textContent = '✅ Скопировано! Отправь другу';
            shareBtn.style.borderColor = '#ffd54f';
            shareBtn.style.color = '#ffd54f';
            setTimeout(() => {
                shareBtn.textContent = originalText;
                shareBtn.style.borderColor = '#81c784';
                shareBtn.style.color = '#81c784';
            }, 2500);
        } catch(e) {
            shareBtn.textContent = '❌ Не удалось скопировать';
            shareBtn.style.borderColor = '#ef5350';
            shareBtn.style.color = '#ef5350';
        }
        document.body.removeChild(textarea);
    }

    // Добавляем подсказку
    const hint = document.createElement('div');
    hint.style.cssText = 'color: #a09080; font-size: 0.8rem; font-style: italic;';
    hint.textContent = 'Нажмите, чтобы скопировать результат и отправить другу';
    shareContainer.appendChild(shareBtn);
    shareContainer.appendChild(hint);

    // Ищем контейнер с результатом
    const container = document.querySelector('.result-container') || document.getElementById('questionContainer');
    if (container) {
        container.appendChild(shareContainer);
    }
}, 100);

        }
        
        function resetTest() {
            isResultMode = false;
            currentIndex = 0;
            answers = new Array(totalQuestions).fill(null);
            
            mainBody.style.background = '';
            testContainer.style.borderColor = '';
            testTitle.textContent = 'Светлая или Тёмная еда?';
            
            prevBtn.classList.remove('hidden');
            nextBtn.classList.remove('hidden');
            exitBtn.textContent = '🚪 Выйти';
            exitBtn.classList.add('btn-secondary');
            
            renderQuestion(0);
        }
        
        prevBtn.addEventListener('click', () => {
            if (currentIndex > 0) {
                currentIndex--;
                renderQuestion(currentIndex);
            }
        });
        
        nextBtn.addEventListener('click', () => {
            if (answers[currentIndex] === null) {
                alert('Пожалуйста, выберите один из вариантов ответа.');
                return;
            }
            
            if (currentIndex < totalQuestions - 1) {
                currentIndex++;
                renderQuestion(currentIndex);
            } else {
                if (answers.includes(null)) {
                    alert('Пожалуйста, ответьте на все вопросы.');
                    return;
                }
                showResult();
            }
        });
        
        exitBtn.addEventListener('click', () => {
            if (isResultMode) {
                resetTest();
            } else {
                if (confirm('Вы уверены, что хотите выйти? Прогресс будет потерян.')) {
                    window.location.href = 'diagnostics-hub.html';
                }
            }
        });
        
        renderQuestion(0);
    })();
</script>
