<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Тест: Портал или Яма? • Идеатоника</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: linear-gradient(145deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh; font-family: 'Georgia', 'Times New Roman', serif;
            padding: 2rem; display: flex; flex-direction: column; align-items: center;
            transition: background 0.5s ease;
        }
        .cosmic-bg {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle at 30% 40%, rgba(255,215,150,0.08) 0%, transparent 50%),
                        radial-gradient(circle at 80% 70%, rgba(100,150,255,0.05) 0%, transparent 60%);
            pointer-events: none; z-index: 0;
        }
        .test-container {
            max-width: 700px; width: 100%; position: relative; z-index: 1;
            background: rgba(30, 40, 60, 0.85); backdrop-filter: blur(12px);
            border: 1px solid rgba(227, 184, 124, 0.4); border-radius: 32px;
            padding: 2.5rem; box-shadow: 0 20px 40px rgba(0,0,0,0.5);
            transition: border-color 0.3s ease;
        }
        .test-header { text-align: center; margin-bottom: 2rem; }
        .test-header h1 { font-size: 2.2rem; color: #f3e7c0; margin-bottom: 0.5rem; display: flex; align-items: center; justify-content: center; gap: 10px; }
        .progress-bar { width: 100%; height: 6px; background: rgba(0,0,0,0.3); border-radius: 3px; margin: 1.5rem 0; }
        .progress-fill { height: 100%; background: #7e57c2; border-radius: 3px; width: 0%; transition: width 0.3s ease; }
        .progress-text { text-align: right; color: #a09080; font-size: 0.8rem; margin-top: 0.3rem; }
        .question-box { margin-bottom: 2rem; }
        .question-text { color: #f3e7c0; font-size: 1.3rem; margin-bottom: 1.5rem; line-height: 1.5; }
        .options { display: flex; flex-direction: column; gap: 12px; }
        .option {
            background: rgba(0,0,0,0.2); border: 1px solid #5d4a3a; border-radius: 16px;
            padding: 1rem 1.5rem; cursor: pointer; transition: all 0.2s ease;
            color: #d0c8b8; display: flex; align-items: center; gap: 15px;
        }
        .option:hover { background: rgba(126, 87, 194, 0.15); border-color: #7e57c2; }
        .option.selected { background: rgba(126, 87, 194, 0.25); border-color: #7e57c2; color: #f3e7c0; }
        .option-marker {
            width: 24px; height: 24px; border-radius: 50%; border: 2px solid #5d4a3a;
            display: flex; align-items: center; justify-content: center; transition: all 0.2s;
        }
        .option.selected .option-marker { border-color: #7e57c2; background: #7e57c2; box-shadow: 0 0 10px #7e57c2; }
        .option.selected .option-marker::after { content: "✓"; color: #1a1a2e; font-weight: bold; }
        .option-text { flex: 1; }
        .nav-buttons { display: flex; justify-content: space-between; margin-top: 2rem; gap: 15px; }
        .btn {
            background: transparent; border: 1.5px solid #7e57c2; color: #7e57c2;
            padding: 0.8rem 1.8rem; font-size: 1rem; font-weight: bold; border-radius: 40px;
            cursor: pointer; transition: 0.2s; font-family: inherit;
        }
        .btn:hover { background: #7e57c2; color: #1a1a2e; }
        .btn:disabled { opacity: 0.3; cursor: not-allowed; }
        .btn-secondary { border-color: #5d4a3a; color: #a09080; }
        .btn-secondary:hover { background: #5d4a3a; color: #d0c8b8; }
        .result-container { text-align: center; }
        .result-score { font-size: 5rem; font-weight: bold; margin: 1rem 0; }
        .result-scale { font-size: 1.2rem; margin-bottom: 1.5rem; }
        .result-comment { background: rgba(0,0,0,0.2); border-radius: 20px; padding: 1.5rem; margin: 1.5rem 0; line-height: 1.6; }
        .result-advice { background: rgba(126, 87, 194, 0.1); border-left: 4px solid #7e57c2; padding: 1.2rem 1.5rem; border-radius: 0 12px 12px 0; text-align: left; }
        .hidden { display: none !important; }
        .back-link { display: inline-block; margin-top: 1.5rem; color: #7e57c2; text-decoration: none; font-size: 0.9rem; }
        .back-link:hover { text-decoration: underline; }
    </style>
</head>
<body id="mainBody">
<div class="cosmic-bg"></div>
<div class="test-container" id="testContainer">
    <div class="test-header">
        <h1><span>🌙</span><span id="testTitle">Портал или Яма?</span><span>💤</span></h1>
        <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
        <div class="progress-text" id="progressText">Вопрос 1 из 7</div>
    </div>
    <div id="questionContainer"></div>
    <div class="nav-buttons">
        <button class="btn btn-secondary" id="prevBtn" disabled>← Назад</button>
        <button class="btn btn-secondary" id="exitBtn">🚪 Выйти</button>
        <button class="btn" id="nextBtn">Далее →</button>
    </div>
    <div style="text-align: center;"><a href="diagnostics-hub.html" class="back-link">← Вернуться в Хаб Диагностики</a></div>
</div>

<script>
(function() {
    const questions = [
        {
            text: "Как часто вы запоминаете свои сны?",
            options: [
                { text: "Почти никогда. Я сплю «без снов» (или не помню)", value: -3 },
                { text: "Иногда помню обрывки, раз в неделю или реже", value: -1 },
                { text: "Часто помню яркие, сюжетные сны, несколько раз в неделю", value: 2 },
                { text: "Почти каждую ночь. Я веду дневник сновидений", value: 4 }
            ]
        },
        {
            text: "Бывают ли у вас осознанные сны (когда вы понимаете, что спите, и можете управлять сюжетом)?",
            options: [
                { text: "Никогда. Даже не представляю, как это", value: -2 },
                { text: "Было пару раз в жизни случайно", value: 0 },
                { text: "Да, иногда (раз в месяц или чаще) я осознаю себя во сне", value: 3 },
                { text: "Регулярно. Я практикую осознанные сновидения", value: 5 }
            ]
        },
        {
            text: "Какие сны вам снятся чаще всего?",
            options: [
                { text: "Кошмары, тревожные сны, погони, падения", value: -4 },
                { text: "Нейтральные, бытовые, не запоминающиеся", value: -1 },
                { text: "Яркие, сюжетные, иногда со смыслом и символами", value: 2 },
                { text: "Вещие, пророческие, полные глубоких символов и посланий", value: 5 }
            ]
        },
        {
            text: "Как вы чувствуете себя после пробуждения?",
            options: [
                { text: "Разбитым, уставшим, как будто и не спал. Тяжело вставать", value: -4 },
                { text: "Немного вялым, нужно время, чтобы «раскачаться»", value: -1 },
                { text: "Отдохнувшим, свежим, готовым к новому дню", value: 2 },
                { text: "Превосходно! Я просыпаюсь с ясной головой и новыми идеями", value: 4 }
            ]
        },
        {
            text: "Бывает ли, что во сне вы находите решение проблемы, над которой давно думали?",
            options: [
                { text: "Никогда. Мои сны — это просто хаос", value: -2 },
                { text: "Очень редко, maybe раз в год", value: 0 },
                { text: "Да, иногда приходят озарения или подсказки", value: 2 },
                { text: "Регулярно. Сон — мой главный источник инсайтов", value: 4 }
            ]
        },
        {
            text: "Случалось ли вам видеть во сне умерших близких, и это ощущалось как реальный контакт?",
            options: [
                { text: "Никогда. И я не верю в такое", value: -2 },
                { text: "Пару раз, но скорее это просто воспоминания", value: 0 },
                { text: "Да, были очень яркие, реалистичные встречи", value: 3 },
                { text: "Да, и я чувствую, что это был настоящий контакт, а не просто сон", value: 5 }
            ]
        },
        {
            text: "Влияет ли то, что вы делаете перед сном, на ваши сновидения?",
            options: [
                { text: "Не замечал связи", value: -1 },
                { text: "Если смотрю ужасы или новости — снятся кошмары", value: 1 },
                { text: "Да, если медитирую или читаю хорошую книгу — сны ярче и спокойнее", value: 3 },
                { text: "Я могу программировать свои сны. Перед сном задаю вопрос — и ночью получаю ответ", value: 5 }
            ]
        }
    ];
    
    const totalQuestions = questions.length;
    let currentIndex = 0;
    let answers = new Array(totalQuestions).fill(null);
    
    const questionContainer = document.getElementById('questionContainer');
    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');
    const exitBtn = document.getElementById('exitBtn');
    const progressFill = document.getElementById('progressFill');
    const progressText = document.getElementById('progressText');
    const testContainer = document.getElementById('testContainer');
    const mainBody = document.getElementById('mainBody');
    const testTitle = document.getElementById('testTitle');
    let isResultMode = false;
    
    function renderQuestion(index) {
        const q = questions[index];
        let html = `<div class="question-box"><div class="question-text">${index + 1}. ${q.text}</div><div class="options">`;
        q.options.forEach(opt => {
            const isSelected = answers[index] === opt.value;
            html += `<div class="option ${isSelected ? 'selected' : ''}" data-value="${opt.value}"><div class="option-marker"></div><div class="option-text">${opt.text}</div></div>`;
        });
        html += `</div></div>`;
        questionContainer.innerHTML = html;
        document.querySelectorAll('.option').forEach(opt => {
            opt.addEventListener('click', () => {
                answers[index] = parseInt(opt.dataset.value);
                renderQuestion(index);
            });
        });
        const progress = ((index + 1) / totalQuestions) * 100;
        progressFill.style.width = progress + '%';
        progressText.textContent = `Вопрос ${index + 1} из ${totalQuestions}`;
        prevBtn.disabled = index === 0;
        nextBtn.textContent = index === totalQuestions - 1 ? '🎉 Завершить' : 'Далее →';
    }
    
    function calculateResult() {
        const sum = answers.reduce((acc, val) => acc + val, 0);
        const maxSum = 32, minSum = -18;
        // Приводим к шкале от 0 до 10
        const normalized = (sum - minSum) / (maxSum - minSum) * 10;
        return Math.round(normalized * 10) / 10;
    }
    
    function getResultColor(score) {
        if (score > 8) return '#e1bee7';
        if (score > 6) return '#ce93d8';
        if (score > 4) return '#ab47bc';
        if (score > 2) return '#7e57c2';
        if (score > 0) return '#5c6bc0';
        return '#37474f';
    }
    
    function getResultComment(score) {
        if (score > 9) return "🌌 Вы — ПРОВОДНИК. Ваши сны — это портал в ноосферу. Вы способны к осознанным сновидениям, контакту с ушедшими и получению прямого знания. Ваш сон — это не отдых, а работа души.";
        if (score > 7) return "🌙 Вы — ИССЛЕДОВАТЕЛЬ. У вас яркие, осмысленные сны. Вы часто получаете инсайты и подсказки. Ваш сон хорошо восстанавливает Qₛ.";
        if (score > 5) return "💤 Вы — ЗДОРОВЫЙ СПЯЩИЙ. Ваш сон в норме. Вы хорошо восстанавливаетесь, иногда видите интересные сны. Есть потенциал для развития осознанности.";
        if (score > 3) return "🥱 Вы — УСТАВШИЙ. Сон не полностью восстанавливает ваше поле. Сны редкие или тревожные. Обратите внимание на семантическую гигиену перед сном.";
        if (score > 1) return "😴 Вы — БЕСПОКОЙНЫЙ. Ваш сон поверхностный, с кошмарами или без снов. Qₛ почти не восстанавливается. Вам нужен ритуал подготовки ко сну.";
        return "💀 Вы — ИСТОЩЁННЫЙ. Ваш сон — это яма, в которую проваливаешься без сил и выныриваешь без них. Срочно займитесь восстановлением сна. Это база всего.";
    }
    
    function getResultAdvice(score) {
        if (score > 7) return "🌌 Совет: Продолжайте практику! Ведите дневник снов. Изучайте технику осознанных сновидений. Попробуйте DREAM-LINK с близким человеком. Ваш дар — это ключ к ноосфере.";
        if (score > 5) return "💤 Совет: Чтобы углубить сны, за час до сна откажитесь от экранов. Читайте бумажную книгу. Поставьте в спальне аметист (ранг +6). Практикуйте благодарность за день.";
        if (score > 3) return "🥱 Совет: Проверьте ранг вашей спальни (Тест №5). Уберите пластик, синтетику. Добавьте натуральные ткани (лён, хлопок). Проветривайте перед сном. Попробуйте дыхание 4-7-8.";
        if (score > 1) return "😴 Совет: Исключите кофеин после 14:00. Не ешьте за 2-3 часа до сна. Примите тёплую ванну с солью. Слушайте розовый шум или резонанс Шумана (7.83 Гц) для засыпания.";
        return "💀 Совет: Это кризис. Обратитесь к врачу-сомнологу. Исключите апноэ и другие расстройства. Начните с малого: ложитесь и вставайте в одно и то же время. Спите не менее 8 часов. Темнота и тишина — ваши лекарства.";
    }
    
    function showResult() {
        isResultMode = true;
        const score = calculateResult();
        const color = getResultColor(score);
        const comment = getResultComment(score);
        const advice = getResultAdvice(score);
        mainBody.style.background = `linear-gradient(145deg, ${color}20 0%, #16213e 100%)`;
        testContainer.style.borderColor = color;
        let html = `<div class="result-container">`;
        html += `<h2 style="color: ${color};">Ваш результат</h2>`;
        html += `<div class="result-score" style="color: ${color};">${score.toFixed(1)}</div>`;
        html += `<div class="result-scale">по шкале качества сновидений (от 0 до 10)</div>`;
        html += `<div class="result-comment" style="color: #d0c8b8;">${comment}</div>`;
        html += `<div class="result-advice" style="color: #d0c8b8;">${advice}</div>`;
        html += `<p style="margin-top: 1.5rem; color: #a09080; font-style: italic;">Сон — это не просто отдых. Это путешествие в семантическое поле. Сделайте его осознанным.</p>`;
        html += `</div>`;
        questionContainer.innerHTML = html;
        prevBtn.classList.add('hidden');
        nextBtn.classList.add('hidden');
        exitBtn.textContent = '🔄 Пройти заново';
        exitBtn.classList.remove('btn-secondary');
        exitBtn.classList.add('btn');
        testTitle.textContent = `Результат: Сон = ${score.toFixed(1)}`;
        progressText.textContent = `Тест завершён`;
        
        setTimeout(function() {
    const passportBtn = document.createElement('button');
    passportBtn.textContent = '💾 Сохранить результат в Семантический Паспорт';
    passportBtn.style.cssText = 'display: block; margin: 2rem auto; padding: 1rem 2rem; background: #ba68c8; color: white; border: none; border-radius: 40px; font-size: 1rem; cursor: pointer; font-weight: bold; transition: 0.3s;';
    passportBtn.onmouseover = () => passportBtn.style.background = '#9c27b0';
    passportBtn.onmouseout = () => passportBtn.style.background = '#ba68c8';

    passportBtn.addEventListener('click', function() {
        const scoreElement = document.querySelector('.result-score');
        if (scoreElement) {
            const resultText = scoreElement.textContent.trim();
            const resultValue = parseFloat(resultText);
            if (!isNaN(resultValue)) {
                localStorage.setItem('ideatonika_test_dream', resultValue);
            } else {
                localStorage.setItem('ideatonika_test_dream', resultText);
            }
            passportBtn.textContent = '✅ Сохранено в Паспорт!';
            passportBtn.style.background = '#4a148c';
            passportBtn.disabled = true;
        }
    });

    const container = document.querySelector('.result-container') || document.getElementById('questionContainer');
    if (container) {
        container.appendChild(passportBtn);
    }
}, 100);

// ========== КНОПКА "ПОДЕЛИТЬСЯ РЕЗУЛЬТАТОМ" ==========
setTimeout(function() {
    const shareContainer = document.createElement('div');
    shareContainer.style.cssText = 'text-align: center; margin-top: 1.5rem;';

    const shareBtn = document.createElement('button');
    shareBtn.textContent = '📤 Поделиться результатом';
    shareBtn.style.cssText = 'display: block; margin: 0 auto 0.8rem auto; padding: 0.8rem 2rem; background: transparent; color: #81c784; border: 1.5px solid #81c784; border-radius: 40px; font-size: 1rem; cursor: pointer; font-weight: bold; transition: 0.3s; font-family: Georgia, serif;';
    shareBtn.onmouseover = () => shareBtn.style.background = '#81c784';
    shareBtn.onmouseout = () => shareBtn.style.background = 'transparent';
    shareBtn.onmouseover = () => shareBtn.style.color = '#1a1a2e';
    shareBtn.onmouseout = () => shareBtn.style.color = '#81c784';

    shareBtn.addEventListener('click', function() {
        // Получаем название теста из заголовка страницы
        const testName = document.title.replace(' • Идеатоника', '').trim();
        
        // Получаем результат из элемента .result-score
        const scoreElement = document.querySelector('.result-score');
        let resultText = '';
        if (scoreElement) {
            resultText = scoreElement.textContent.trim();
        }
        
        // Получаем комментарий из элемента .result-comment или .result-interpretation
        const commentElement = document.querySelector('.result-comment') || document.querySelector('.result-interpretation');
        let commentText = '';
        if (commentElement) {
            commentText = commentElement.textContent.trim();
        }
        
        // Формируем текст для отправки
        const shareText = `🧪 Я прошёл тест «${testName}» на портале Идеатоника!\n\n` +
            `📊 Мой результат: ${resultText}\n` +
            `💬 ${commentText}\n\n` +
            `🎯 А какой результат у тебя?\n` +
            `👉 Пройти тест: ${window.location.href}\n\n` +
            `🌌 Идеатоника — физика смысла.`;
        
        // Пытаемся использовать Web Share API (мобильные устройства)
        if (navigator.share) {
            navigator.share({
                title: `Мой результат теста «${testName}»`,
                text: shareText,
                url: window.location.href
            }).catch(() => {
                // Если не получилось — копируем в буфер
                copyToClipboard(shareText);
            });
        } else {
            // Если Web Share API не поддерживается — копируем в буфер
            copyToClipboard(shareText);
        }
    });

    function copyToClipboard(text) {
        if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(text).then(() => {
                const originalText = shareBtn.textContent;
                shareBtn.textContent = '✅ Скопировано! Отправь другу';
                shareBtn.style.borderColor = '#ffd54f';
                shareBtn.style.color = '#ffd54f';
                setTimeout(() => {
                    shareBtn.textContent = originalText;
                    shareBtn.style.borderColor = '#81c784';
                    shareBtn.style.color = '#81c784';
                }, 2500);
            }).catch(() => {
                fallbackCopy(text);
            });
        } else {
            fallbackCopy(text);
        }
    }

    function fallbackCopy(text) {
        const textarea = document.createElement('textarea');
        textarea.value = text;
        textarea.style.position = 'fixed';
        textarea.style.left = '-9999px';
        document.body.appendChild(textarea);
        textarea.select();
        try {
            document.execCommand('copy');
            const originalText = shareBtn.textContent;
            shareBtn.textContent = '✅ Скопировано! Отправь другу';
            shareBtn.style.borderColor = '#ffd54f';
            shareBtn.style.color = '#ffd54f';
            setTimeout(() => {
                shareBtn.textContent = originalText;
                shareBtn.style.borderColor = '#81c784';
                shareBtn.style.color = '#81c784';
            }, 2500);
        } catch(e) {
            shareBtn.textContent = '❌ Не удалось скопировать';
            shareBtn.style.borderColor = '#ef5350';
            shareBtn.style.color = '#ef5350';
        }
        document.body.removeChild(textarea);
    }

    // Добавляем подсказку
    const hint = document.createElement('div');
    hint.style.cssText = 'color: #a09080; font-size: 0.8rem; font-style: italic;';
    hint.textContent = 'Нажмите, чтобы скопировать результат и отправить другу';
    shareContainer.appendChild(shareBtn);
    shareContainer.appendChild(hint);

    // Ищем контейнер с результатом
    const container = document.querySelector('.result-container') || document.getElementById('questionContainer');
    if (container) {
        container.appendChild(shareContainer);
    }
}, 100);

    }
    
    function resetTest() {
        isResultMode = false;
        currentIndex = 0;
        answers = new Array(totalQuestions).fill(null);
        mainBody.style.background = '';
        testContainer.style.borderColor = '';
        testTitle.textContent = 'Портал или Яма?';
        prevBtn.classList.remove('hidden');
        nextBtn.classList.remove('hidden');
        exitBtn.textContent = '🚪 Выйти';
        exitBtn.classList.add('btn-secondary');
        renderQuestion(0);
    }
    
    prevBtn.addEventListener('click', () => { if (currentIndex > 0) { currentIndex--; renderQuestion(currentIndex); } });
    nextBtn.addEventListener('click', () => {
        if (answers[currentIndex] === null) { alert('Пожалуйста, выберите один из вариантов ответа.'); return; }
        if (currentIndex < totalQuestions - 1) { currentIndex++; renderQuestion(currentIndex); }
        else { if (answers.includes(null)) { alert('Пожалуйста, ответьте на все вопросы.'); return; } showResult(); }
    });
    exitBtn.addEventListener('click', () => {
        if (isResultMode) resetTest();
        else { if (confirm('Вы уверены, что хотите выйти? Прогресс будет потерян.')) window.location.href = 'diagnostics-hub.html'; }
    });
    renderQuestion(0);
})();
</script>
