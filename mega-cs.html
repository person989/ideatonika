<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мега-тест Cₛ • Архив Ноосферы</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: linear-gradient(145deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            font-family: 'Georgia', 'Times New Roman', serif;
            padding: 2rem;
            display: flex; flex-direction: column; align-items: center;
            transition: background 0.5s ease;
        }
        .cosmic-bg {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle at 30% 40%, rgba(255,215,150,0.08) 0%, transparent 50%),
                        radial-gradient(circle at 80% 70%, rgba(100,150,255,0.05) 0%, transparent 60%);
            pointer-events: none; z-index: 0;
        }
        .test-container {
            max-width: 750px; width: 100%; position: relative; z-index: 1;
            background: rgba(30, 40, 60, 0.85); backdrop-filter: blur(12px);
            border: 1px solid rgba(227, 184, 124, 0.4); border-radius: 32px;
            padding: 2.5rem; box-shadow: 0 20px 40px rgba(0,0,0,0.5);
            transition: border-color 0.3s ease;
        }
        .test-header { text-align: center; margin-bottom: 2rem; }
        .test-header h1 {
            font-size: 2.5rem; color: #f3e7c0; margin-bottom: 0.5rem;
            display: flex; align-items: center; justify-content: center; gap: 10px;
        }
        .progress-bar { width: 100%; height: 6px; background: rgba(0,0,0,0.3); border-radius: 3px; margin: 1.5rem 0; }
        .progress-fill { height: 100%; background: #64b5f6; border-radius: 3px; width: 0%; transition: width 0.3s ease; }
        .progress-text { text-align: right; color: #a09080; font-size: 0.8rem; margin-top: 0.3rem; }
        .question-box { margin-bottom: 2rem; }
        .question-text { color: #f3e7c0; font-size: 1.3rem; margin-bottom: 1.5rem; line-height: 1.5; }
        .options { display: flex; flex-direction: column; gap: 10px; }
        .option {
            background: rgba(0,0,0,0.2); border: 1px solid #5d4a3a; border-radius: 16px;
            padding: 1rem 1.5rem; cursor: pointer; transition: all 0.2s ease;
            color: #d0c8b8; display: flex; align-items: center; gap: 15px;
        }
        .option:hover { background: rgba(100,181,246,0.15); border-color: #64b5f6; }
        .option.selected { background: rgba(100,181,246,0.25); border-color: #64b5f6; color: #f3e7c0; }
        .option-marker {
            width: 28px; height: 28px; border-radius: 50%; border: 2px solid #5d4a3a;
            display: flex; align-items: center; justify-content: center; transition: all 0.2s; flex-shrink: 0;
        }
        .option.selected .option-marker { border-color: #64b5f6; background: #64b5f6; box-shadow: 0 0 10px #64b5f6; }
        .option.selected .option-marker::after { content: "✓"; color: #1a1a2e; font-weight: bold; }
        .option-text { flex: 1; }
        .nav-buttons { display: flex; justify-content: space-between; margin-top: 2rem; gap: 15px; }
        .btn {
            background: transparent; border: 1.5px solid #64b5f6; color: #64b5f6;
            padding: 0.8rem 1.8rem; font-size: 1rem; font-weight: bold; border-radius: 40px;
            cursor: pointer; transition: 0.2s; font-family: inherit;
        }
        .btn:hover { background: #64b5f6; color: #1a1a2e; }
        .btn:disabled { opacity: 0.3; cursor: not-allowed; }
        .btn-secondary { border-color: #5d4a3a; color: #a09080; }
        .btn-secondary:hover { background: #5d4a3a; color: #d0c8b8; }
        .result-container { text-align: center; }
        .result-score { font-size: 6rem; font-weight: bold; margin: 1rem 0; line-height: 1; }
        .result-scale { font-size: 1.2rem; margin-bottom: 1.5rem; }
        .result-comment { background: rgba(0,0,0,0.2); border-radius: 20px; padding: 1.5rem; margin: 1.5rem 0; line-height: 1.6; }
        .result-advice { padding: 1.2rem 1.5rem; border-radius: 0 12px 12px 0; text-align: left; margin-top: 1.5rem; }
        .hidden { display: none !important; }
        .back-link { display: inline-block; margin-top: 1.5rem; color: #64b5f6; text-decoration: none; font-size: 0.9rem; }
        .back-link:hover { text-decoration: underline; }
    </style>
</head>
<body id="mainBody">
<div class="cosmic-bg"></div>
<div class="test-container" id="testContainer">

    <div class="test-header">
        <h1><span>🎯</span><span id="testTitle">Мега-тест Cₛ</span><span>🎯</span></h1>
        <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
        <div class="progress-text" id="progressText">Вопрос 1 из 30</div>
    </div>

    <div id="questionContainer"></div>

    <div class="nav-buttons">
        <button class="btn btn-secondary" id="prevBtn" disabled>← Назад</button>
        <button class="btn btn-secondary" id="exitBtn">🚪 Выйти</button>
        <button class="btn" id="nextBtn">Далее →</button>
    </div>

    <div style="text-align: center;">
        <a href="hidden-tests.html" class="back-link">← Вернуться к списку тестов</a>
    </div>
</div>

<script>
    (function() {
        const questions = [
            // Вопрос 1
            { text: "Как долго вы можете удерживать внимание на одной задаче (чтение, работа, медитация), не отвлекаясь на телефон или посторонние мысли?", options: [
                { text: "Меньше минуты. Мысли постоянно скачут, я не могу сосредоточиться ни на чём.", value: -5 },
                { text: "1-3 минуты. Почти сразу тянет проверить телефон или думать о другом.", value: -3 },
                { text: "3-5 минут. С трудом, но иногда получается удержать фокус на короткое время.", value: -1 },
                { text: "5-10 минут. Если задача интересная, могу погрузиться ненадолго.", value: 0 },
                { text: "10-20 минут. Могу работать, но периодически отвлекаюсь на уведомления.", value: 2 },
                { text: "20-40 минут. Довольно устойчивое внимание, особенно в тишине.", value: 4 },
                { text: "40-60 минут. Легко вхожу в ритм и удерживаю концентрацию.", value: 6 },
                { text: "1-2 часа. Глубокое погружение, забываю о времени и окружающем мире.", value: 8 },
                { text: "3-4 часа. Полное растворение в задаче. Меня трудно отвлечь даже сиреной.", value: 9 },
                { text: "Столько, сколько нужно. Я полностью контролирую своё внимание. Оно подчиняется мне.", value: 10 }

            // Вопрос 2
            { text: "Как часто вы ловите себя на том, что «залипаете» в телефоне или соцсетях, не осознавая, сколько прошло времени?", options: [
                { text: "Постоянно. Это мой основной режим существования. Я живу в телефоне.", value: -5 },
                { text: "Очень часто. Теряю часы, не замечая, как пролетел день.", value: -3 },
                { text: "Часто. Стараюсь контролировать, но срываюсь по несколько раз в день.", value: -1 },
                { text: "Бывает, когда устаю или скучаю. Но не каждый день.", value: 0 },
                { text: "Иногда. Я осознаю это и стараюсь ограничивать время.", value: 2 },
                { text: "Редко. Я установил(а) лимиты и в основном их соблюдаю.", value: 4 },
                { text: "Очень редко. Телефон — только инструмент для связи и работы.", value: 6 },
                { text: "Почти никогда. Я полностью контролирую, сколько времени провожу в телефоне.", value: 8 },
                { text: "Я не «залипаю». Моё внимание принадлежит мне, а не алгоритмам.", value: 9 },
                { text: "Я не пользуюсь соцсетями. Моё сознание свободно от цифрового шума.", value: 10 }

                { text: "Оглушительный. В голове круглосуточный шум, как на вокзале в час пик.", value: -5 },
                { text: "Очень громкий. Мысли не умолкают ни на минуту, я устаю от самого себя.", value: -3 },
                { text: "Громкий. Часто отвлекаюсь на внутренние монологи и тревожные размышления.", value: -1 },

                { text: "Очень тихий. Внутренний диалог возникает редко, в основном по делу.", value: 4 },
                { text: "Почти безмолвный. Часто наступает глубокая ясность и тишина.", value: 6 },
                { text: "Я могу входить в состояние полной внутренней тишины по своему желанию.", value: 8 },

                { text: "Внутреннего диалога нет. Есть только чистое восприятие реальности здесь и сейчас.", value: 10 }

            // Вопрос 4
            { text: "Когда вы выполняете монотонную работу (уборка, мытьё посуды, прогулка), где находятся ваши мысли?", options: [
                { text: "Скачут хаотично. Я переживаю прошлое, тревожусь о будущем, прокручиваю обиды.", value: -5 },
                { text: "Блуждают где-то далеко. Я не помню, о чём думал(а) последние полчаса.", value: -3 },

                { text: "Пробовал(а), но почти не получается. Мысли возвращаются через пару секунд.", value: -1 },
                { text: "Иногда получается на несколько секунд, если специально концентрируюсь на дыхании.", value: 0 },
                { text: "Могу успокоить ум на минуту-другую, если в тишине и с закрытыми глазами.", value: 2 },
                { text: "Да, регулярно практикую и легко вхожу в тишину на 5-10 минут.", value: 4 },
                { text: "Внутренняя тишина — мой частый гость. Я могу удерживать её десятки минут.", value: 6 },
                { text: "Тишина стала моим базовым состоянием. Мысли появляются редко.", value: 8 },
                { text: "Я живу в тишине. Ум чист и ясен, пока я не решу его чем-то занять.", value: 9 },
                { text: "Я и есть эта тишина. Мысли — лишь облака, проплывающие в бесконечном небе сознания.", value: 10 }
            ]},
            // Вопрос 6
            { text: "Как часто вы испытываете состояние «потока» — когда время исчезает, а вы полностью слиты с делом?", options: [
                { text: "Никогда. Я не знаю, что это такое. Моя деятельность всегда разорвана и хаотична.", value: -5 },
                { text: "Крайне редко. Наверное, раз в год или реже, случайно.", value: -3 },
                { text: "Редко. Наверное, раз в месяц, когда занимаюсь чем-то очень любимым.", value: -1 },
                { text: "Иногда. Раз в неделю или две, если повезёт с настроением и задачей.", value: 0 },
                { text: "Довольно часто. Несколько раз в неделю я теряю счёт времени за работой.", value: 2 },
                { text: "Часто. Это мой обычный режим работы, когда я занимаюсь своим делом.", value: 4 },
                { text: "Очень часто. Я стараюсь строить день так, чтобы большую часть времени быть в потоке.", value: 6 },
                { text: "Почти всегда. Поток — это мой способ жить. Я редко из него выхожу.", value: 8 },

                { text: "Поток и я — одно. Нет разницы между «мной» и «тем, что я делаю».", value: 10 }

            // Вопрос 7
            { text: "Легко ли вам заснуть? Насколько «чистое» у вас состояние сознания перед сном?", options: [
                { text: "Очень трудно. Часами ворочаюсь, мысли терзают, тревога не даёт уснуть.", value: -5 },
                { text: "Трудно. Нужно не меньше часа, чтобы «остыть» и хоть как-то успокоить ум.", value: -3 },
                { text: "По-разному. Иногда легко, иногда часами не могу уснуть. Зависит от дня.", value: -1 },
                { text: "Нормально. Засыпаю в течение 20-30 минут, если день был обычным.", value: 0 },
                { text: "Довольно легко. Ложусь и через 10-15 минут сплю.", value: 2 },
                { text: "Легко. Выключаюсь почти мгновенно, голова чистая.", value: 4 },
                { text: "Очень легко. Я ложусь и засыпаю за пару минут. Сон — мой друг.", value: 6 },
                { text: "Я могу войти в сон осознанно, сохраняя ясность сознания.", value: 8 },
                { text: "Сон и бодрствование для меня — лишь разные формы восприятия. Я сплю без потери себя.", value: 9 },
                { text: "Я не «засыпаю» в обычном смысле. Я просто перехожу в иное состояние бытия.", value: 10 }

            // Вопрос 8
            { text: "Как часто вы отвлекаетесь на уведомления, звонки или сообщения во время важной работы или разговора?", options: [

                { text: "Почти всегда. Мне трудно игнорировать уведомления, даже если я занят(а).", value: -3 },
                { text: "Часто. Я проверяю телефон, даже если он не пищал — на всякий случай.", value: -1 },

                { text: "Очень редко. Телефон в беззвучном режиме, я смотрю его только в перерывах.", value: 4 },
                { text: "Почти никогда. Я полностью контролирую, когда мне доступен внешний мир.", value: 6 },
                { text: "Я не отвлекаюсь. Моё внимание устойчиво, как пламя свечи в безветренную ночь.", value: 8 },

                { text: "5-10 минут. Если я устал(а), то могу просто посидеть, глядя в окно.", value: 0 },

            { text: "Что происходит с вашим вниманием, когда вы голодны?", options: [
                { text: "Полный коллапс. Я не могу думать ни о чём, кроме еды. Всё бесит.", value: -5 },
                { text: "Сильно падает. Я раздражителен(на) и не могу сосредоточиться.", value: -3 },
                { text: "Заметно хуже. Трудно работать, мысли всё время возвращаются к еде.", value: -1 },
                { text: "Зависит от степени голода. Иногда мешает, иногда — нет.", value: 0 },
                { text: "Почти не меняется. Я могу потерпеть и продолжать работать.", value: 2 },
                { text: "Не меняется. Голод не влияет на мою способность концентрироваться.", value: 4 },
                { text: "Голод обостряет моё внимание. Я становлюсь даже более собранным(ой).", value: 6 },
                { text: "Я не замечаю голода, когда увлечён(а) делом. Тело может подождать.", value: 8 },
                { text: "Я не отождествляю себя с телом. Голод — это просто сигнал, который я могу игнорировать.", value: 9 },
                { text: "Я питаюсь Светом. Физическая еда для меня — не необходимость, а ритуал.", value: 10 }
            ]},
            // Вопрос 28
            { text: "Можете ли вы, читая книгу, одновременно осознавать своё дыхание и положение тела?", options: [
                { text: "Нет. Я полностью теряю связь с телом, когда читаю или работаю.", value: -5 },
                { text: "Очень редко. Я либо читаю, либо осознаю тело. Одновременно — никак.", value: -3 },
                { text: "Иногда получается, если я специально практикую это. Но обычно нет.", value: -1 },
                { text: "Могу время от времени, если напоминаю себе об этом.", value: 0 },
                { text: "Да, я могу удерживать часть внимания на теле, читая книгу.", value: 2 },
                { text: "Легко. Я часто практикую двойное осознание: и текст, и тело.", value: 4 },
                { text: "Это моё обычное состояние. Я всегда осознаю тело, что бы я ни делал(а).", value: 6 },
                { text: "Я осознаю не только тело, но и эмоции, мысли и пространство вокруг одновременно.", value: 8 },
                { text: "Я и книга, и тело, и дыхание — всё это один поток осознания.", value: 9 },
                { text: "Я осознаю всё одновременно. Нет разделения на «читающего», «тело» и «дыхание». Всё едино.", value: 10 }
            ]},
            // Вопрос 29
            { text: "Как вы реагируете, если вас просят объяснить что-то сложное человеку, который совсем не разбирается в теме?", options: [
                { text: "Это бесит. Я не умею объяснять «для тупых» и раздражаюсь на вопросы.", value: -5 },
                { text: "Мне трудно. Я срываюсь на сложные термины, и человек меня не понимает.", value: -3 },
                { text: "Стараюсь, но не всегда получается. Иногда я не могу подобрать простые слова.", value: -1 },
                { text: "Нормально. Я пытаюсь объяснить на доступном уровне, но не всегда успешно.", value: 0 },
                { text: "С интересом. Это вызов — сделать сложное простым и понятным.", value: 2 },
                { text: "Легко. Я умею находить метафоры и примеры, чтобы объяснить что угодно.", value: 4 },
                { text: "С радостью. Объяснять — это учиться самому. Я вижу в этом дар.", value: 6 },
                { text: "Я чувствую, на каком уровне находится человек, и подстраиваю объяснение под него.", value: 8 },
                { text: "Объяснение происходит через меня. Я — просто проводник знания.", value: 9 },
                { text: "Я не объясняю. Я просто делюсь Светом понимания, и он сам находит путь.", value: 10 }
            ]},
            // Вопрос 30
            { text: "Как часто вы чувствуете, что ваш ум абсолютно ясен, прозрачен и готов к любой задаче?", options: [
                { text: "Никогда. Мой ум всегда в тумане, я не знаю, что такое ясность.", value: -5 },
                { text: "Очень редко. Бывало пару раз в жизни, после хорошего отдыха.", value: -3 },
                { text: "Иногда. После медитации, прогулки на природе или утром в выходной.", value: -1 },
                { text: "Раз в несколько дней. Бывают моменты, когда я чувствую «щелчок» и всё становится чётким.", value: 0 },
                { text: "Несколько раз в неделю. Я ценю эти моменты и стараюсь их продлить.", value: 2 },
                { text: "Почти каждый день. Ясность ума — моё обычное рабочее состояние.", value: 4 },
                { text: "Постоянно. Мой ум почти всегда прозрачен и готов к работе.", value: 6 },
                { text: "Ясность — это моя природа. Я не знаю, что такое «туман в голове».", value: 8 },
                { text: "Я и есть эта ясность. Ум — лишь инструмент, который я использую, когда нужно.", value: 9 },
                { text: "Я не «чувствую» ясность. Я и есть сама ясность, из которой рождаются все мысли и действия.", value: 10 }
            ]}
        ];

        const totalQuestions = questions.length;
        let currentIndex = 0;
        let answers = new Array(totalQuestions).fill(null);

        const questionContainer = document.getElementById('questionContainer');
        const prevBtn = document.getElementById('prevBtn');
        const nextBtn = document.getElementById('nextBtn');
        const exitBtn = document.getElementById('exitBtn');
        const progressFill = document.getElementById('progressFill');
        const progressText = document.getElementById('progressText');
        const testContainer = document.getElementById('testContainer');
        const mainBody = document.getElementById('mainBody');
        const testTitle = document.getElementById('testTitle');
        let isResultMode = false;

        function renderQuestion(index) {
            const q = questions[index];
            let html = `<div class="question-box">`;
            html += `<div class="question-text">${index + 1}. ${q.text}</div>`;
            html += `<div class="options">`;

            q.options.forEach((opt) => {
                const isSelected = answers[index] === opt.value;
                html += `<div class="option ${isSelected ? 'selected' : ''}" data-value="${opt.value}">
                    <div class="option-marker"></div>
                    <div class="option-text">${opt.text}</div>
                </div>`;
            });

            html += `</div></div>`;
            questionContainer.innerHTML = html;

            document.querySelectorAll('.option').forEach(opt => {
                opt.addEventListener('click', () => {
                    const value = parseInt(opt.dataset.value);
                    answers[index] = value;
                    renderQuestion(index);
                });
            });

            const progress = ((index + 1) / totalQuestions) * 100;
            progressFill.style.width = progress + '%';
            progressText.textContent = `Вопрос ${index + 1} из ${totalQuestions}`;
            prevBtn.disabled = index === 0;
            if (index === totalQuestions - 1) { nextBtn.textContent = '🎉 Завершить'; }
            else { nextBtn.textContent = 'Далее →'; }
        }

        function calculateResult() {
            let sum = 0;
            answers.forEach(val => sum += val);
            const raw = sum / totalQuestions;
            const normalized = Math.round(raw * 100) / 100;
            return Math.max(0, Math.min(1, (normalized + 5) / 15));
        }

        function getResultStyle(cs) {
            if (cs >= 0.95) return { color: '#64b5f6', borderColor: '#64b5f6', bg: 'rgba(100,181,246,0.1)', label: 'ЛАЗЕР', emoji: '🔦' };
            if (cs >= 0.85) return { color: '#42a5f5', borderColor: '#42a5f5', bg: 'rgba(66,165,245,0.1)', label: 'Лазерная указка', emoji: '💠' };
            if (cs >= 0.70) return { color: '#90caf9', borderColor: '#90caf9', bg: 'rgba(144,202,249,0.1)', label: 'Прожектор', emoji: '🔆' };
            if (cs >= 0.55) return { color: '#81c784', borderColor: '#81c784', bg: 'rgba(129,199,132,0.1)', label: 'Светодиод', emoji: '💡' };
            if (cs >= 0.40) return { color: '#ffb74d', borderColor: '#ffb74d', bg: 'rgba(255,183,77,0.1)', label: 'Лампочка накаливания', emoji: '💡' };
            if (cs >= 0.25) return { color: '#ff8a65', borderColor: '#ff8a65', bg: 'rgba(255,138,101,0.1)', label: 'Тусклая лампочка', emoji: '🕯️' };
            if (cs >= 0.10) return { color: '#ef5350', borderColor: '#ef5350', bg: 'rgba(239,83,80,0.1)', label: 'Мигающая лампочка', emoji: '💥' };
            return { color: '#b71c1c', borderColor: '#b71c1c', bg: 'rgba(183,28,28,0.1)', label: 'Перегоревшая лампочка', emoji: '⚫' };
        }

        function getResultComment(cs) {
            if (cs >= 0.95) return "Вы — ЛАЗЕР. Ваша когерентность близка к идеальной. Вы способны фокусировать Смысл с невероятной силой. Вы на уровне просветлённых мастеров.";
            if (cs >= 0.85) return "Вы — лазерная указка. Очень высокая когерентность. Вы легко входите в поток и можете долго удерживать концентрацию.";
            if (cs >= 0.70) return "Вы — яркий прожектор. Хорошая когерентность. Вы умеете сосредотачиваться, но иногда «шум» всё же проникает.";
            if (cs >= 0.55) return "Вы — светодиодная лампа. Средняя когерентность. Вы можете фокусироваться, но часто отвлекаетесь.";
            if (cs >= 0.40) return "Вы — лампочка накаливания. Когерентность ниже среднего. Ваше внимание рассеяно, мысли скачут.";
            if (cs >= 0.25) return "Вы — тусклая лампочка. Низкая когерентность. Вы постоянно отвлекаетесь, вам трудно завершать дела.";
            if (cs >= 0.10) return "Вы — мигающая лампочка. Очень низкая когерентность. Ваш ум — это хаос. Вам нужен информационный детокс.";
            return "Вы — перегоревшая лампочка. Когерентность на нуле. Вы истощены, возможно, депрессия. Срочно обратитесь за помощью.";
        }

        function getResultAdvice(cs) {
            if (cs >= 0.85) return "💎 Совет: Вы владеете редким даром. Используйте его для творчества и помощи другим. Не забывайте «заземляться» через природу.";
            if (cs >= 0.70) return "🧘 Совет: Ваша когерентность хороша. Чтобы поднять её выше, практикуйте «однозадачность». Уберите телефон во время еды и работы.";
            if (cs >= 0.55) return "📵 Совет: Ваше внимание «плавает». Введите правило: за 1 час до сна — никаких экранов. Читайте бумажные книги.";
            if (cs >= 0.40) return "🚫 Совет: Вы перегружены информацией. Устройте себе «цифровой шаббат» — один день в неделю без интернета.";
            if (cs >= 0.25) return "🧹 Совет: Начните с наведения порядка. Разберите рабочий стол, удалите ненужные приложения. Внешний порядок помогает внутреннему.";
            return "🆘 Совет: Ваш ум истощён. Вам нужен полный покой и тишина. Спите не менее 8 часов. Исключите кофеин и алкоголь.";
        }

        function showResult() {
            isResultMode = true;
            const cs = calculateResult();
            const style = getResultStyle(cs);
            const comment = getResultComment(cs);
            const advice = getResultAdvice(cs);

            mainBody.style.background = `linear-gradient(145deg, ${style.color}20 0%, #16213e 100%)`;
            testContainer.style.borderColor = style.borderColor;

            let html = `<div class="result-container">`;
            html += `<h2 style="color: ${style.color};">${style.emoji} ${style.label}</h2>`;
            html += `<div class="result-score" style="color: ${style.color};">${cs.toFixed(2)}</div>`;
            html += `<div class="result-scale">по шкале Cₛ (от 0 до 1)</div>`;
            html += `<div class="result-comment" style="color: #d0c8b8; background: ${style.bg};">${comment}</div>`;
            html += `<div class="result-advice" style="color: #d0c8b8; background: ${style.bg}; border-left: 4px solid ${style.borderColor};">${advice}</div>`;
            html += `<p style="margin-top: 1.5rem; color: #a09080; font-style: italic;">Помните: когерентность тренируется. Как мышца. Регулярные практики творят чудеса.</p>`;
            html += `</div>`;

            questionContainer.innerHTML = html;
            prevBtn.classList.add('hidden');
            nextBtn.classList.add('hidden');
            exitBtn.textContent = '🔄 Пройти заново';
            exitBtn.classList.remove('btn-secondary');
            exitBtn.classList.add('btn');
            testTitle.textContent = `Результат: Cₛ = ${cs.toFixed(2)}`;
            progressText.textContent = `Тест завершён`;
            
            // --- СОХРАНЕНИЕ В УЛЬТРА-ПАСПОРТ ---
setTimeout(function() {
    const passportBtn = document.createElement('button');
    passportBtn.textContent = '💾 Сохранить результат в Ультра-Паспорт';
    passportBtn.style.cssText = 'display: block; margin: 2rem auto; padding: 1rem 2rem; background: #81c784; color: #1a1a2e; border: none; border-radius: 40px; font-size: 1rem; cursor: pointer; font-weight: bold; transition: 0.3s;';
    passportBtn.onmouseover = () => passportBtn.style.background = '#4caf50';
    passportBtn.onmouseout = () => passportBtn.style.background = '#81c784';

    passportBtn.addEventListener('click', function() {
        // Ищем результат на странице
        const scoreElement = document.querySelector('.result-score');
        if (scoreElement) {
            const resultValue = parseFloat(scoreElement.textContent);
            if (!isNaN(resultValue)) {
                // Ключ: ideatonika_deep_qs (НЕ пересекается с обычным ideatonika_test_qs)
                localStorage.setItem('ideatonika_deep_cs', resultValue);
                passportBtn.textContent = '✅ Сохранено в Ультра-Паспорт!';
                passportBtn.style.background = '#388e3c';
                passportBtn.style.color = 'white';
                passportBtn.disabled = true;
            }
        }
    });

    const container = document.querySelector('.result-container') || document.getElementById('questionContainer');
    if (container) {
        container.appendChild(passportBtn);
    }
}, 100);

// ========== КНОПКА "ПОДЕЛИТЬСЯ РЕЗУЛЬТАТОМ" ==========
setTimeout(function() {
    const shareContainer = document.createElement('div');
    shareContainer.style.cssText = 'text-align: center; margin-top: 1.5rem;';

    const shareBtn = document.createElement('button');
    shareBtn.textContent = '📤 Поделиться результатом';
    shareBtn.style.cssText = 'display: block; margin: 0 auto 0.8rem auto; padding: 0.8rem 2rem; background: transparent; color: #81c784; border: 1.5px solid #81c784; border-radius: 40px; font-size: 1rem; cursor: pointer; font-weight: bold; transition: 0.3s; font-family: Georgia, serif;';
    shareBtn.onmouseover = () => shareBtn.style.background = '#81c784';
    shareBtn.onmouseout = () => shareBtn.style.background = 'transparent';
    shareBtn.onmouseover = () => shareBtn.style.color = '#1a1a2e';
    shareBtn.onmouseout = () => shareBtn.style.color = '#81c784';

    shareBtn.addEventListener('click', function() {
        // Получаем название теста из заголовка страницы
        const testName = document.title.replace(' • Идеатоника', '').trim();
        
        // Получаем результат из элемента .result-score
        const scoreElement = document.querySelector('.result-score');
        let resultText = '';
        if (scoreElement) {
            resultText = scoreElement.textContent.trim();
        }
        
        // Получаем комментарий из элемента .result-comment или .result-interpretation
        const commentElement = document.querySelector('.result-comment') || document.querySelector('.result-interpretation');
        let commentText = '';
        if (commentElement) {
            commentText = commentElement.textContent.trim();
        }
        
        // Формируем текст для отправки
        const shareText = `🧪 Я прошёл тест «${testName}» на портале Идеатоника!\n\n` +
            `📊 Мой результат: ${resultText}\n` +
            `💬 ${commentText}\n\n` +
            `🎯 А какой результат у тебя?\n` +
            `👉 Пройти тест: ${window.location.href}\n\n` +
            `🌌 Идеатоника — физика смысла.`;
        
        // Пытаемся использовать Web Share API (мобильные устройства)
        if (navigator.share) {
            navigator.share({
                title: `Мой результат теста «${testName}»`,
                text: shareText,
                url: window.location.href
            }).catch(() => {
                // Если не получилось — копируем в буфер
                copyToClipboard(shareText);
            });
        } else {
            // Если Web Share API не поддерживается — копируем в буфер
            copyToClipboard(shareText);
        }
    });

    function copyToClipboard(text) {
        if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(text).then(() => {
                const originalText = shareBtn.textContent;
                shareBtn.textContent = '✅ Скопировано! Отправь другу';
                shareBtn.style.borderColor = '#ffd54f';
                shareBtn.style.color = '#ffd54f';
                setTimeout(() => {
                    shareBtn.textContent = originalText;
                    shareBtn.style.borderColor = '#81c784';
                    shareBtn.style.color = '#81c784';
                }, 2500);
            }).catch(() => {
                fallbackCopy(text);
            });
        } else {
            fallbackCopy(text);
        }
    }

    function fallbackCopy(text) {
        const textarea = document.createElement('textarea');
        textarea.value = text;
        textarea.style.position = 'fixed';
        textarea.style.left = '-9999px';
        document.body.appendChild(textarea);
        textarea.select();
        try {
            document.execCommand('copy');
            const originalText = shareBtn.textContent;
            shareBtn.textContent = '✅ Скопировано! Отправь другу';
            shareBtn.style.borderColor = '#ffd54f';
            shareBtn.style.color = '#ffd54f';
            setTimeout(() => {
                shareBtn.textContent = originalText;
                shareBtn.style.borderColor = '#81c784';
                shareBtn.style.color = '#81c784';
            }, 2500);
        } catch(e) {
            shareBtn.textContent = '❌ Не удалось скопировать';
            shareBtn.style.borderColor = '#ef5350';
            shareBtn.style.color = '#ef5350';
        }
        document.body.removeChild(textarea);
    }

    // Добавляем подсказку
    const hint = document.createElement('div');
    hint.style.cssText = 'color: #a09080; font-size: 0.8rem; font-style: italic;';
    hint.textContent = 'Нажмите, чтобы скопировать результат и отправить другу';
    shareContainer.appendChild(shareBtn);
    shareContainer.appendChild(hint);

    // Ищем контейнер с результатом
    const container = document.querySelector('.result-container') || document.getElementById('questionContainer');
    if (container) {
        container.appendChild(shareContainer);
    }
}, 100);

        }

        function resetTest() {
            isResultMode = false;
            currentIndex = 0;
            answers = new Array(totalQuestions).fill(null);
            mainBody.style.background = '';
            testContainer.style.borderColor = '';
            testTitle.textContent = 'Мега-тест Cₛ';
            prevBtn.classList.remove('hidden');
            nextBtn.classList.remove('hidden');
            exitBtn.textContent = '🚪 Выйти';
            exitBtn.classList.add('btn-secondary');
            renderQuestion(0);
        }

        prevBtn.addEventListener('click', () => { if (currentIndex > 0) { currentIndex--; renderQuestion(currentIndex); } });
        nextBtn.addEventListener('click', () => {
            if (answers[currentIndex] === null) { alert('Пожалуйста, выберите один из вариантов ответа.'); return; }
            if (currentIndex < totalQuestions - 1) { currentIndex++; renderQuestion(currentIndex); }
            else { if (!answers.includes(null)) showResult(); else alert('Пожалуйста, ответьте на все вопросы.'); }
        });
        exitBtn.addEventListener('click', () => { if (isResultMode) resetTest(); else { if (confirm('Вы уверены, что хотите выйти? Прогресс будет потерян.')) window.location.href = 'hidden-tests.html'; } });

        renderQuestion(0);
    })();
</script>
