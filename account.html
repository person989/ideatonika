<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Личный кабинет • Идеатоника</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: linear-gradient(145deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            font-family: 'Georgia', 'Times New Roman', serif;
            padding: 2rem;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
        }
        .cosmic-bg { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 0; }
        .main-container {
            max-width: 600px; width: 100%; position: relative; z-index: 1;
            background: rgba(30, 40, 60, 0.9); backdrop-filter: blur(12px);
            border: 1px solid rgba(227, 184, 124, 0.4); border-radius: 32px;
            padding: 3rem 2.5rem; box-shadow: 0 20px 40px rgba(0,0,0,0.5);
            text-align: center;
        }
        h1 { font-size: 2.5rem; color: #f3e7c0; margin-bottom: 0.5rem; font-weight: 400; }
        .subtitle { color: #c0b090; font-style: italic; margin-bottom: 2.5rem; font-size: 1rem; }

        /* ========== ЭКРАН "НЕТ АККАУНТА" ========== */
        .welcome-icon { font-size: 5rem; margin-bottom: 1rem; }
        .welcome-text { color: #d0c8b8; font-size: 1.2rem; margin-bottom: 2rem; line-height: 1.6; }
        .btn-row { display: flex; gap: 1.5rem; justify-content: center; flex-wrap: wrap; }
        .btn {
            padding: 1rem 2.5rem; font-size: 1.1rem; font-weight: bold; border-radius: 40px;
            cursor: pointer; font-family: inherit; text-decoration: none; transition: 0.3s;
            display: inline-block; border: 1.5px solid;
        }
        .btn-primary { background: #ce93d8; color: #1a1a2e; border-color: #ce93d8; }
        .btn-primary:hover { background: #ab47bc; box-shadow: 0 0 20px rgba(206,147,216,0.5); }
        .btn-outline { background: transparent; color: #ce93d8; border-color: #ce93d8; }
        .btn-outline:hover { background: rgba(206,147,216,0.1); }

        /* ========== ЭКРАН РЕГИСТРАЦИИ ========== */
        .register-form { text-align: left; }
        .form-group { margin-bottom: 1.5rem; }
        .form-group label { display: block; color: #d0c8b8; font-size: 0.9rem; margin-bottom: 0.4rem; }
        .form-group input, .form-group select {
            width: 100%; padding: 0.9rem 1rem; background: rgba(0,0,0,0.3); border: 1px solid #5d4a3a;
            border-radius: 12px; color: #f3e7c0; font-family: 'Georgia', serif; font-size: 1rem;
        }
        .form-group input:focus, .form-group select:focus { outline: none; border-color: #ce93d8; }
        .form-group select option { background: #1a1a2e; color: #f3e7c0; }
        .error-msg { color: #ef5350; font-size: 0.85rem; margin-top: 0.3rem; display: none; }
        .error-msg.show { display: block; }

        /* ========== ЭКРАН АККАУНТА (пустой пока) ========== */
        .account-info { color: #d0c8b8; font-size: 1.1rem; margin-bottom: 1rem; }
        .logout-link { color: #ef5350; cursor: pointer; font-size: 0.9rem; margin-top: 2rem; display: inline-block; }
        .logout-link:hover { text-decoration: underline; }

        .hidden { display: none !important; }
    </style>
</head>
<body>
<div class="cosmic-bg"></div>
<div class="main-container" id="mainContainer">
    <!-- Содержимое будет динамически отрисовываться -->
</div>

<script>
(function() {
    const container = document.getElementById('mainContainer');
    const STORAGE_KEY = 'ideatonika_user_profile';

    // ========== ПРОВЕРКА: ЕСТЬ ЛИ АККАУНТ ==========
    const savedProfile = localStorage.getItem(STORAGE_KEY);
    let userProfile = savedProfile ? JSON.parse(savedProfile) : null;

    // ========== ЭКРАН 1: НЕТ АККАУНТА ==========
    function renderWelcome() {
        container.innerHTML = `
            <div class="welcome-icon">👤</div>
            <h1>Личный кабинет</h1>
            <p class="welcome-text">
                У вас ещё нет аккаунта.<br>
                Создайте его, чтобы сохранять результаты тестов,<br>
                отслеживать динамику Семантического Паспорта<br>
                и получать персональные рекомендации.
            </p>
            <div class="btn-row">
                <button class="btn btn-primary" id="goRegisterBtn">✨ Создать аккаунт</button>
                <a href="index.html" class="btn btn-outline">← Вернуться на Портал</a>
            </div>
        `;
        document.getElementById('goRegisterBtn').addEventListener('click', renderRegister);
    }

    // ========== ЭКРАН 2: РЕГИСТРАЦИЯ ==========
    function renderRegister() {
        container.innerHTML = `
            <h1>📝 Регистрация</h1>
            <p class="subtitle">Заполните все поля, чтобы создать аккаунт</p>
            <div class="register-form">
                <div class="form-group">
                    <label>👤 Имя *</label>
                    <input type="text" id="regName" placeholder="Ваше имя" autocomplete="given-name">
                    <div class="error-msg" id="errName">Введите имя</div>
                </div>
                <div class="form-group">
                    <label>👥 Фамилия *</label>
                    <input type="text" id="regSurname" placeholder="Ваша фамилия" autocomplete="family-name">
                    <div class="error-msg" id="errSurname">Введите фамилию</div>
                </div>
                <div class="form-group">
                    <label>⚤ Пол *</label>
                    <select id="regGender">
                        <option value="">— Выберите —</option>
                        <option value="male">Мужской</option>
                        <option value="female">Женский</option>
                        <option value="other">Другой</option>
                    </select>
                    <div class="error-msg" id="errGender">Выберите пол</div>
                </div>
                <div class="form-group">
                    <label>🎂 Дата рождения *</label>
                    <input type="date" id="regBirthdate">
                    <div class="error-msg" id="errBirthdate">Укажите дату рождения</div>
                </div>
                <div class="btn-row" style="margin-top: 2rem;">
                    <button class="btn btn-primary" id="submitRegisterBtn">💾 Сохранить и войти</button>
                    <button class="btn btn-outline" id="backToWelcomeBtn">← Назад</button>
                </div>
            </div>
        `;

        // Обработчики
        document.getElementById('submitRegisterBtn').addEventListener('click', handleRegister);
        document.getElementById('backToWelcomeBtn').addEventListener('click', renderWelcome);
    }

    function handleRegister() {
        const name = document.getElementById('regName').value.trim();
        const surname = document.getElementById('regSurname').value.trim();
        const gender = document.getElementById('regGender').value;
        const birthdate = document.getElementById('regBirthdate').value;

        // Сброс ошибок
        document.querySelectorAll('.error-msg').forEach(el => el.classList.remove('show'));

        let hasError = false;

        if (!name) { document.getElementById('errName').classList.add('show'); hasError = true; }
        if (!surname) { document.getElementById('errSurname').classList.add('show'); hasError = true; }
        if (!gender) { document.getElementById('errGender').classList.add('show'); hasError = true; }
        if (!birthdate) { document.getElementById('errBirthdate').classList.add('show'); hasError = true; }

        if (hasError) return;

        // Сохраняем профиль
        userProfile = {
            name,
            surname,
            gender,
            birthdate,
            createdAt: new Date().toISOString(),
            passportHistory: [] // Пока пустой массив для будущих паспортов
        };

        localStorage.setItem(STORAGE_KEY, JSON.stringify(userProfile));
        renderAccount();
    }

// ========== ЭКРАН 3: АККАУНТ (с карточками) ==========
function renderAccount() {
    if (!userProfile) {
        renderWelcome();
        return;
    }

    container.innerHTML = `
        <style>
            .account-grid {
                display: grid;
                grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
                gap: 1.2rem;
                margin: 2rem 0;
            }
            .account-card {
                background: rgba(0,0,0,0.3);
                border: 1px solid #5d4a3a;
                border-radius: 20px;
                padding: 1.5rem 1rem;
                text-align: center;
                cursor: pointer;
                transition: all 0.2s ease;
                text-decoration: none;
                color: #d0c8b8;
                display: flex;
                flex-direction: column;
                align-items: center;
                gap: 0.5rem;
            }
            .account-card:hover {
                background: rgba(206,147,216,0.15);
                border-color: #ce93d8;
                transform: translateY(-3px);
                box-shadow: 0 8px 20px rgba(206,147,216,0.2);
            }
            .account-card .card-emoji {
                font-size: 2.5rem;
                margin-bottom: 0.3rem;
            }
            .account-card .card-label {
                font-size: 0.85rem;
                font-weight: bold;
                color: #e1bee7;
            }
            .account-card .card-hint {
                font-size: 0.7rem;
                color: #706858;
                font-style: italic;
            }
            .card-planner {
    border: 2px solid #ff9800 !important;
    background: linear-gradient(135deg, rgba(255, 152, 0, 0.1), rgba(30, 40, 60, 0.7)) !important;
}
        </style>

        <h1>👤 ${userProfile.name} ${userProfile.surname}</h1>
        <p class="subtitle">Добро пожаловать в личный кабинет!</p>

        <div class="account-grid">
            <a href="passport-choice.html" class="account-card">
                <div class="card-emoji">🪪</div>
                <div class="card-label">Мой Паспорт</div>
                <div class="card-hint">Просмотреть / Распечатать</div>
            </a>
            <div class="account-card" id="cardHistory">
                <div class="card-emoji">📈</div>
                <div class="card-label">История</div>
                <div class="card-hint">Динамика ранга</div>
            </div>
            <div class="account-card" id="cardTests">
                <div class="card-emoji">🧪</div>
                <div class="card-label">Мои Тесты</div>
                <div class="card-hint">Пройденные / Новые</div>
            </div>
            <a href="diary.html" class="account-card">
                <div class="card-emoji">📝</div>
                <div class="card-label">Дневник</div>
                <div class="card-hint">Заметки и наблюдения</div>
            </a>
            <a href="semantic-calculators.html" class="account-card">
                <div class="card-emoji">🧮</div>
                <div class="card-label">Калькуляторы</div>
                <div class="card-hint">50+ инструментов</div>
            </a>
            <div class="account-card" id="cardGoals">
                <div class="card-emoji">🎯</div>
                <div class="card-label">Цели</div>
                <div class="card-hint">Семантический план</div>
            </div>
            <a href="room-planner.html" class="account-card card-planner">
    <div class="card-emoji">🏗️</div>
    <div class="card-label">Планировщик</div>
    <div class="card-hint">Семантика жилища</div>
</a>
        </div>

        <div class="btn-row" style="margin-top: 1rem;">
            <button class="btn btn-primary" id="goSettingsBtn">⚙️ Настройки</button>
            <a href="index.html" class="btn btn-outline">← На Портал</a>
        </div>
    `;

    document.getElementById('goSettingsBtn').addEventListener('click', renderSettings);

    const cardHistory = document.getElementById('cardHistory');
if (cardHistory) cardHistory.addEventListener('click', () => window.location.href = 'history.html');

const cardTests = document.getElementById('cardTests');
if (cardTests) cardTests.addEventListener('click', () => window.location.href = 'my-tests.html');

const cardDiary = document.getElementById('cardDiary');
if (cardDiary) cardDiary.addEventListener('click', () => window.location.href = 'diary.html');

const cardGoals = document.getElementById('cardGoals');
if (cardGoals) cardGoals.addEventListener('click', () => window.location.href = 'goals.html');
}

// ========== ЭКРАН 4: НАСТРОЙКИ ==========
function renderSettings() {
    if (!userProfile) {
        renderWelcome();
        return;
    }

    container.innerHTML = `
        <h1>⚙️ Настройки профиля</h1>
        <p class="subtitle">Измените данные или удалите аккаунт</p>
        <div class="register-form">
            <div class="form-group">
                <label>👤 Имя</label>
                <input type="text" id="settingsName" value="${userProfile.name}">
                <div class="error-msg" id="errSettingsName">Введите имя</div>
            </div>
            <div class="form-group">
                <label>👥 Фамилия</label>
                <input type="text" id="settingsSurname" value="${userProfile.surname}">
                <div class="error-msg" id="errSettingsSurname">Введите фамилию</div>
            </div>
            <div class="form-group">
                <label>⚤ Пол</label>
                <select id="settingsGender">
                    <option value="male" ${userProfile.gender === 'male' ? 'selected' : ''}>Мужской</option>
                    <option value="female" ${userProfile.gender === 'female' ? 'selected' : ''}>Женский</option>
                    <option value="other" ${userProfile.gender === 'other' ? 'selected' : ''}>Другой</option>
                </select>
            </div>
            <div class="form-group">
                <label>🎂 Дата рождения</label>
                <input type="date" id="settingsBirthdate" value="${userProfile.birthdate}">
                <div class="error-msg" id="errSettingsBirthdate">Укажите дату рождения</div>
            </div>
            <div class="btn-row" style="margin-top: 2rem;">
                <button class="btn btn-primary" id="saveSettingsBtn">💾 Сохранить изменения</button>
                <button class="btn btn-outline" id="backToAccountBtn">← Назад</button>
            </div>
            <div style="margin-top: 3rem; padding-top: 2rem; border-top: 1px solid #5d4a3a; text-align: center;">
                <button class="btn" id="deleteAccountBtn" style="background: transparent; border-color: #ef5350; color: #ef5350; padding: 0.7rem 1.5rem; font-size: 0.9rem;">🗑️ Удалить аккаунт</button>
            </div>
        </div>
    `;

    // Обработчики
    document.getElementById('saveSettingsBtn').addEventListener('click', handleSaveSettings);
    document.getElementById('backToAccountBtn').addEventListener('click', renderAccount);
    document.getElementById('deleteAccountBtn').addEventListener('click', handleDeleteAccount);
}

function handleSaveSettings() {
    const name = document.getElementById('settingsName').value.trim();
    const surname = document.getElementById('settingsSurname').value.trim();
    const gender = document.getElementById('settingsGender').value;
    const birthdate = document.getElementById('settingsBirthdate').value;

    // Сброс ошибок
    document.querySelectorAll('.error-msg').forEach(el => el.classList.remove('show'));

    let hasError = false;
    if (!name) { document.getElementById('errSettingsName').classList.add('show'); hasError = true; }
    if (!surname) { document.getElementById('errSettingsSurname').classList.add('show'); hasError = true; }
    if (!birthdate) { document.getElementById('errSettingsBirthdate').classList.add('show'); hasError = true; }

    if (hasError) return;

    // Обновляем профиль
    userProfile.name = name;
    userProfile.surname = surname;
    userProfile.gender = gender;
    userProfile.birthdate = birthdate;
    localStorage.setItem(STORAGE_KEY, JSON.stringify(userProfile));
    renderAccount();
}

function handleDeleteAccount() {
    if (confirm('Вы уверены, что хотите безвозвратно удалить аккаунт? Все данные (включая историю паспортов) будут потеряны.')) {
        if (confirm('Подтвердите удаление. Это действие нельзя отменить.')) {
            userProfile = null;
            localStorage.removeItem(STORAGE_KEY);
            renderWelcome();
        }
    }
}

    // ========== ЗАПУСК ==========
    if (userProfile) {
        renderAccount();
    } else {
        renderWelcome();
    }

})();
</script>

</body>
</html>
