<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Калькулятор Семантической Запутанности • Идеатоника</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: linear-gradient(145deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            font-family: 'Georgia', 'Times New Roman', serif;
            padding: 2rem;
            display: flex; flex-direction: column; align-items: center;
        }
        .cosmic-bg { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 0; }
        .main-container {
            max-width: 800px; width: 100%; position: relative; z-index: 1;
            background: rgba(30, 40, 60, 0.85); backdrop-filter: blur(12px);
            border: 1px solid rgba(227, 184, 124, 0.4); border-radius: 32px;
            padding: 2.5rem; box-shadow: 0 20px 40px rgba(0,0,0,0.5);
        }
        h1 { font-size: 2.5rem; color: #f3e7c0; text-align: center; margin-bottom: 0.5rem; font-weight: 400; }
        .subtitle { text-align: center; color: #c0b090; font-style: italic; margin-bottom: 2rem; border-bottom: 1px solid #5d4a3a; padding-bottom: 1rem; }
        .calc-section { background: rgba(0,0,0,0.2); border-radius: 20px; padding: 2rem; margin-bottom: 2rem; border: 1px solid #5d4a3a; }
        .section-title { font-size: 1.4rem; color: #ffd54f; margin-bottom: 1.5rem; }
        .input-group { margin-bottom: 1.5rem; }
        .input-group label { display: flex; justify-content: space-between; align-items: center; color: #d0c8b8; font-size: 1rem; margin-bottom: 0.5rem; }
        .input-group label span { color: #ffd54f; font-weight: bold; font-size: 1.2rem; }
        .input-group input[type="range"] { width: 100%; -webkit-appearance: none; height: 8px; background: #5d4a3a; border-radius: 4px; outline: none; cursor: pointer; }
        .input-group input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; width: 22px; height: 22px; background: #ffd54f; border-radius: 50%; cursor: pointer; box-shadow: 0 0 10px rgba(255,215,80,0.5); }
        .input-group .range-labels { display: flex; justify-content: space-between; color: #706858; font-size: 0.8rem; margin-top: 0.3rem; }
        .input-group select { width: 100%; padding: 0.8rem 1rem; background: rgba(0,0,0,0.3); border: 1px solid #5d4a3a; border-radius: 10px; color: #f3e7c0; font-family: 'Georgia', serif; font-size: 1rem; }
        .input-group select option { background: #1a1a2e; color: #f3e7c0; }
        .result-box { background: rgba(255,215,80,0.1); border: 2px solid #ffd54f; border-radius: 20px; padding: 2rem; text-align: center; margin-top: 2rem; }
        .result-number { font-size: 4rem; font-weight: bold; color: #ffd54f; line-height: 1; }
        .result-label { color: #c0b090; font-size: 1.2rem; margin-top: 0.5rem; }
        .result-extra { color: #d0c8b8; font-size: 1rem; margin-top: 1rem; font-style: italic; }
        .result-formula { color: #a09080; font-style: italic; font-size: 0.9rem; margin-top: 1rem; font-family: 'Courier New', monospace; }
        .back-link { display: inline-block; margin-top: 1.5rem; color: #ffd54f; text-decoration: none; border: 1px solid #ffd54f; padding: 0.6rem 1.5rem; border-radius: 30px; transition: 0.2s; }
        .back-link:hover { background: #ffd54f; color: #1a1a2e; }
    </style>
</head>
<body>
<div class="cosmic-bg"></div>
<div class="main-container">

    <h1>🔗 Семантическая Запутанность</h1>
    <div class="subtitle">Калькулятор силы нелокальной связи (§104, §55, Эксперимент DREAM-LINK)</div>

    <div class="calc-section">
        <div class="section-title">📐 Параметры связи</div>

        <!-- Тип связи -->
        <div class="input-group">
            <label>👥 Тип отношений:</label>
            <select id="relationSelect">
                <option value="10">Мать и младенец (K₀ = 10)</option>
                <option value="9">Однояйцевые близнецы (K₀ = 9)</option>
                <option value="7">Супруги (долгий счастливый брак) (K₀ = 7)</option>
                <option value="6">Духовный учитель — ученик (K₀ = 6)</option>
                <option value="4" selected>Близкие друзья (K₀ = 4)</option>
                <option value="2">Коллеги, знакомые (K₀ = 2)</option>
            </select>
        </div>

        <!-- Совместные эмоции -->
        <div class="input-group">
            <label>💗 Сила совместных переживаний (Q_эмоций): <span id="emotionValue">5</span> из 10</label>
            <input type="range" id="emotionSlider" min="0" max="10" value="5" step="0.5">
            <div class="range-labels"><span>0 (почти нет)</span><span>10 (прошли огонь и воду)</span></div>
        </div>

        <!-- Время без контакта -->
        <div class="input-group">
            <label>⏳ Время без контакта: <span id="timeValue">30</span> дней</label>
            <input type="range" id="timeSlider" min="0" max="365" value="30" step="1">
            <div class="range-labels"><span>0 (рядом)</span><span>365 (год разлуки)</span></div>
        </div>

        <!-- Cₛ участников -->
        <div class="input-group">
            <label>🎯 Средняя когерентность участников (Cₛ): <span id="csValue">0.6</span></label>
            <input type="range" id="csSlider" min="0.1" max="1" value="0.6" step="0.01">
            <div class="range-labels"><span>0.1 (оба рассеяны)</span><span>1.0 (оба в потоке)</span></div>
        </div>
    </div>

    <!-- Результат -->
    <div class="result-box" id="resultBox">
        <div class="result-number" id="resultNumber">—</div>
        <div class="result-label" id="resultLabel">Текущая сила связи</div>
        <div class="result-extra" id="resultExtra"></div>
        <div class="result-formula" id="resultFormula"></div>
    </div>

    <div style="text-align: center;">
        <a href="semantic-calculators.html" class="back-link">← К списку калькуляторов</a>
    </div>

</div>

<script>
    const relationSelect = document.getElementById('relationSelect');
    const emotionSlider = document.getElementById('emotionSlider');
    const timeSlider = document.getElementById('timeSlider');
    const csSlider = document.getElementById('csSlider');
    const emotionValue = document.getElementById('emotionValue');
    const timeValue = document.getElementById('timeValue');
    const csValue = document.getElementById('csValue');
    const resultNumber = document.getElementById('resultNumber');
    const resultLabel = document.getElementById('resultLabel');
    const resultExtra = document.getElementById('resultExtra');
    const resultFormula = document.getElementById('resultFormula');

    relationSelect.addEventListener('change', calculate);
    emotionSlider.addEventListener('input', () => { emotionValue.textContent = parseFloat(emotionSlider.value).toFixed(1); calculate(); });
    timeSlider.addEventListener('input', () => { timeValue.textContent = parseInt(timeSlider.value); calculate(); });
    csSlider.addEventListener('input', () => { csValue.textContent = parseFloat(csSlider.value).toFixed(2); calculate(); });

    function calculate() {
        const K0 = parseFloat(relationSelect.value);
        const Qemotion = parseFloat(emotionSlider.value);
        const days = parseFloat(timeSlider.value);
        const C = parseFloat(csSlider.value);

        // Характерное время затухания связи τ (в днях)
        const tau = 90; // 3 месяца без контакта — связь ослабевает в e раз
        
        // Формула: K = K₀ · (0.3 + 0.7 · Q/10) · e^(-t/τ) · C
        const emotionFactor = 0.3 + 0.7 * (Qemotion / 10);
        const timeFactor = Math.exp(-days / tau);
        const K = K0 * emotionFactor * timeFactor * C;

        const roundedK = Math.round(K * 10) / 10;

        resultNumber.textContent = roundedK.toFixed(1) + ' / 10';
        resultLabel.textContent = 'Текущая сила запутанности';

        let extra = '';
        if (roundedK >= 8) extra = '💞 Сверхсильная связь. Вы чувствуете друг друга на любом расстоянии.';
        else if (roundedK >= 5) extra = '🔗 Сильная связь. Интуиция работает, молитва доходит мгновенно.';
        else if (roundedK >= 2) extra = '📡 Средняя связь. Иногда чувствуете, иногда нет.';
        else if (roundedK >= 0.5) extra = '🌫️ Слабая связь. Почти затухла. Нужен контакт.';
        else extra = '💔 Связь практически исчезла. Восстановите контакт.';
        resultExtra.textContent = extra;

        const relationName = relationSelect.options[relationSelect.selectedIndex].text.split(' (')[0];
        resultFormula.textContent = `K = ${K0.toFixed(0)} · (0.3 + 0.7·${(Qemotion/10).toFixed(2)}) · e^(-${days}/${tau}) · ${C.toFixed(2)} = ${roundedK.toFixed(1)}`;
    }

    calculate();
</script>

</body>
</html>
