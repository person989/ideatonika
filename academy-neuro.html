<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Семантическая нейродинамика • Академия Идеатоники</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: linear-gradient(145deg, #1a1a2e 0%, #16213e 100%); min-height: 100vh; font-family: 'Georgia', serif; padding: 2rem; display: flex; justify-content: center; align-items: flex-start; }
        .main-container { max-width: 850px; width: 100%; background: rgba(30,40,60,0.85); backdrop-filter: blur(12px); border: 2px solid #ce93d8; border-radius: 32px; padding: 2.5rem; box-shadow: 0 20px 40px rgba(0,0,0,0.5); }
        h1 { text-align: center; color: #ce93d8; font-size: 2.5rem; font-weight: 400; margin-bottom: 0.5rem; }
        .subtitle { text-align: center; color: #c0b090; font-style: italic; margin-bottom: 2rem; }
        .progress-bar { width: 100%; height: 6px; background: rgba(0,0,0,0.3); border-radius: 3px; margin: 1rem 0; }
        .progress-fill { height: 100%; background: #ce93d8; border-radius: 3px; width: 0%; transition: width 0.3s; }
        .task-box { background: rgba(0,0,0,0.2); border-radius: 16px; padding: 2rem; margin-bottom: 1.5rem; border: 1px solid #5d4a3a; }
        .task-title { color: #ce93d8; font-size: 1.3rem; margin-bottom: 1rem; }
        .task-text { color: #d0c8b8; line-height: 1.6; margin-bottom: 1.5rem; white-space: pre-line; }
        .task-input { width: 100%; padding: 0.8rem 1rem; background: rgba(0,0,0,0.3); border: 1px solid #5d4a3a; border-radius: 10px; color: #f3e7c0; font-family: 'Georgia', serif; font-size: 1rem; }
        .task-input::placeholder { color: #706858; font-style: italic; }
        .hint { color: #a09080; font-size: 0.85rem; margin-top: 0.5rem; font-style: italic; }
        .nav-buttons { display: flex; justify-content: space-between; margin-top: 2rem; gap: 10px; }
        .btn { background: transparent; border: 1.5px solid #ce93d8; color: #ce93d8; padding: 0.8rem 1.8rem; font-size: 1rem; font-weight: bold; border-radius: 40px; cursor: pointer; font-family: inherit; }
        .btn:hover { background: #ce93d8; color: #1a1a2e; }
        .btn:disabled { opacity: 0.3; cursor: not-allowed; }
        .result-container { text-align: center; }
        .result-score { font-size: 5rem; color: #ce93d8; font-weight: bold; }
        .result-table { width: 100%; margin: 2rem 0; border-collapse: collapse; }
        .result-table th, .result-table td { padding: 10px; border: 1px solid #5d4a3a; color: #d0c8b8; text-align: left; }
        .result-table th { background: #2a2a4a; color: #ce93d8; }
        .correct { color: #81c784; } .wrong { color: #ef5350; }
        .hidden { display: none; }
        .back-link { display: block; text-align: center; margin-top: 1.5rem; color: #ce93d8; text-decoration: none; }
    </style>
</head>
<body>
<div class="main-container" id="quizContainer">
    <h1>🧠 СЕМАНТИЧЕСКАЯ НЕЙРОДИНАМИКА</h1>
    <div class="subtitle">10 задач • числовой ответ • звание «Магистр»</div>
    <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
    <div id="taskArea"></div>
    <div class="nav-buttons">
        <button class="btn" id="prevBtn" disabled>← Назад</button>
        <button class="btn" id="exitBtn" onclick="window.location.href='academy-magistr-menu.html'">🚪 Выйти</button>
        <button class="btn" id="nextBtn">Далее →</button>
    </div>
    <a href="academy-magistr-menu.html" class="back-link">← Вернуться к темам Магистра</a>
</div>

<script>
const tasks = [
    {
        title: "Задача №1. Субъективное ускорение времени в потоке",
        text: "Дано: Cₛ = 0.85, поток информации dI/dt = 2 (высокий), вектор внимания θₜ = 0° (в будущее), κ = 0.5.\nВо сколько раз субъективное время быстрее физического?\nОтвет округлите до сотых.",
        answer: "1.85"
    },
    {
        title: "Задача №2. Замедление времени в стрессе",
        text: "Дано: Cₛ = 0.3, dI/dt = 3 (экстремальный), θₜ = 180° (в прошлое, страх), κ = 0.5.\nЧему равен темп времени dτ/dt?\nОтвет округлите до сотых.",
        answer: "0.55"
    },
    {
        title: "Задача №3. Влияние шума на чувствительность",
        text: "Дано: максимальная чувствительность χ_max = 10, уровень шума S_noise = 0.4, максимальный шум S_max = 1.0.\nЧему равна эффективная чувствительность χ_eff?\nОтвет округлите до целых.",
        answer: "6"
    },
    {
        title: "Задача №4. Оптимальная когерентность для потока",
        text: "Дано: мощность P_sense пропорциональна Cₛ² · (1 — Cₛ). При каком Cₛ мощность максимальна?\nОтвет округлите до сотых.",
        answer: "0.67"
    },
    {
        title: "Задача №5. Потери мощности из-за шума",
        text: "Дано: идеальная мощность P_ideal = 100 W, S_noise = 0.35, S_max = 1.0.\nЧему равна реальная мощность P_real?\nОтвет округлите до десятых.",
        answer: "42.3"
    },
    {
        title: "Задача №6. Семантическая слепота",
        text: "Дано: вероятность заметить событие P₀ = 0.9, когерентность Cₛ = 0.95 (очень высокая).\nЧему равна вероятность НЕ заметить событие?\nОтвет округлите до сотых.",
        answer: "0.65"
    },
    {
        title: "Задача №7. Время входа в поток",
        text: "Дано: начальная Cₛ = 0.3, целевая Cₛ = 0.8, постоянная времени τ_входа = 10 мин.\nСколько минут нужно, чтобы достичь Cₛ = 0.7?\nОтвет округлите до десятых.",
        answer: "16.1"
    },
    {
        title: "Задача №8. Эффективный вектор внимания",
        text: "Дано: θ₁ = 0° (к цели), θ₂ = 180° (от цели). Человек колеблется: 70% времени внимание к цели, 30% — от цели.\nЧему равен эффективный cos θ_eff?\nОтвет округлите до десятых.",
        answer: "0.4"
    },
    {
        title: "Задача №9. Деградация Cₛ без практики",
        text: "Дано: начальная Cₛ = 0.9, время без медитации t = 14 дней, постоянная деградации τ_deg = 30 дней.\nЧему равна Cₛ через 14 дней?\nОтвет округлите до сотых.",
        answer: "0.56"
    },
    {
        title: "Задача №10. Порог различения двух сигналов",
        text: "Дано: два Qₛ-сигнала: Q₁ = 100, Q₂ = 105. Чувствительность χ = 4.\nСможет ли человек их различить?\nОтвет: введите минимально различимую разницу (округлите до десятых) и «да» или «нет» через пробел.",
        answer: "2.5 да"
    }
];

let idx = 0, answers = Array(10).fill('');
const tArea = document.getElementById('taskArea');
const pf = document.getElementById('progressFill');
const prev = document.getElementById('prevBtn'), next = document.getElementById('nextBtn');

function render() {
    const t = tasks[idx];
    let h = `<div class="task-box"><div class="task-title">${t.title}</div><div class="task-text">${t.text}</div>`;
    h += `<input type="text" class="task-input" id="answerInput" placeholder="Введите числовой ответ..." value="${answers[idx]}">`;
    h += `<div class="hint">💡 Введите только число (или число и слово через пробел для задачи №10).</div>`;
    h += '</div>';
    tArea.innerHTML = h;
    document.getElementById('answerInput').addEventListener('input', function(){
        answers[idx] = this.value.trim();
    });
    pf.style.width = ((idx+1)/10*100)+'%';
    prev.disabled = idx===0;
    next.textContent = idx===9 ? '🎉 Завершить' : 'Далее →';
    if(idx===9) document.getElementById('answerInput').focus();
}

function toNumber(str) {
    return parseFloat(str.replace(',', '.').trim());
}

function showResult() {
    let correct=0, rows='';
    tasks.forEach((t,i)=>{
        const userAns = answers[i].replace(',','.').trim().toLowerCase();
        const realAns = t.answer.toLowerCase();
        if (i === 9) {
            const userParts = userAns.split(/\s+/);
            const realParts = realAns.split(/\s+/);
            let ok = false;
            if (userParts.length >= 2) {
                const userNum = toNumber(userParts[0]);
                const realNum = toNumber(realParts[0]);
                ok = !isNaN(userNum) && Math.abs(userNum - realNum) < 0.015 && userParts[1] === realParts[1];
            }
            if (ok) correct++;
            rows += `<tr><td>${t.title}</td><td style="color:#f3e7c0;">${answers[i]||'—'}</td><td style="color:#a09080;">${t.answer}</td><td class="${ok?'correct':'wrong'}">${ok?'✅':'❌'}</td></tr>`;
        } else {
            const userNum = toNumber(answers[i]);
            const realNum = toNumber(t.answer);
            const ok = !isNaN(userNum) && Math.abs(userNum - realNum) < 0.015;
            if(ok) correct++;
            rows += `<tr><td>${t.title}</td><td style="color:#f3e7c0;">${answers[i]||'—'}</td><td style="color:#a09080;">${t.answer}</td><td class="${ok?'correct':'wrong'}">${ok?'✅':'❌'}</td></tr>`;
        }
    });
    const pct = Math.round(correct/10*100);
    let comment = pct>=90?'🧠 Вы — Магистр Нейродинамики!':pct>=70?'📚 Отличный результат, Адепт.':pct>=40?'🔬 Неплохо, но есть куда расти.':'🌱 Нейродинамика требует практики.';
    tArea.innerHTML = `<div class="result-container"><div class="result-score">${pct}%</div><p style="color:#c0b090;">${comment}</p><table class="result-table"><tr><th>Задача</th><th>Ваш ответ</th><th>Правильный</th><th>Результат</th></tr>${rows}</table><p style="color:#a09080;">Звание: ${pct>=90?'🧠 Магистр':pct>=70?'📚 Адепт':pct>=40?'🔬 Практик':'🌱 Неофит'}</p></div>`;
    document.querySelector('.nav-buttons').classList.add('hidden');
}

prev.addEventListener('click', ()=>{ if(idx>0){ idx--; render(); } });
next.addEventListener('click', ()=>{
    if(answers[idx]===''){ alert('Введите ответ!'); return; }
    if(idx<9){ idx++; render(); } else showResult();
});
render();
</script>
</body>
</html>
