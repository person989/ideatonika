<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Коллективная Синергия • Идеатоника</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: linear-gradient(145deg, #0d1117 0%, #161b22 100%);
            min-height: 100vh;
            font-family: 'Georgia', 'Times New Roman', serif;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            padding: 1rem; overflow-x: hidden;
        }
        .stars-bg { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 0; }
        .star { position: absolute; background: white; border-radius: 50%; animation: twinkle var(--duration) ease-in-out infinite; animation-delay: var(--delay); opacity: 0; }
        @keyframes twinkle { 0%,100% { opacity:0.2; transform:scale(1); } 50% { opacity:1; transform:scale(1.8); } }
        .main-container {
            position: relative; z-index: 1; width: 100%; max-width: 1100px;
            background: rgba(22,27,34,0.85); backdrop-filter: blur(12px);
            border: 1px solid rgba(227,184,124,0.3); border-radius: 32px;
            padding: 2rem; box-shadow: 0 20px 40px rgba(0,0,0,0.6);
        }
        .header { text-align: center; margin-bottom: 1.5rem; }
        .header h1 { font-size: 2.5rem; font-weight: 400; letter-spacing: 3px; color: #f3e7c0; text-shadow: 0 0 20px rgba(255,215,80,0.4); margin-bottom: 0.3rem; }
        .header .subtitle { font-size: 1rem; color: #c0b090; font-style: italic; border-bottom: 1px solid #5d4a3a; display: inline-block; padding-bottom: 0.4rem; }
        .canvas-wrapper { position: relative; width: 100%; background: radial-gradient(ellipse at center, #1a2030 0%, #0a0e14 100%); border-radius: 20px; border: 1px solid #5d4a3a; overflow: hidden; margin-bottom: 1.5rem; box-shadow: inset 0 0 80px rgba(0,0,0,0.5); }
        canvas { display: block; width: 100%; height: auto; }
        .controls-panel { background: rgba(0,0,0,0.3); border: 1px solid #5d4a3a; border-radius: 20px; padding: 1.5rem 2rem; }
        .controls-title { font-size: 1.2rem; color: #ffd54f; margin-bottom: 1.2rem; text-align: center; letter-spacing: 1px; }
        .slider-group { margin-bottom: 1.2rem; }
        .slider-group label { display: flex; justify-content: space-between; align-items: center; color: #d0c8b8; font-size: 0.95rem; margin-bottom: 0.4rem; }
        .slider-group label .param-value { color: #ffd54f; font-weight: bold; font-size: 1.1rem; min-width: 50px; text-align: right; }
        .slider-group input[type="range"] { width: 100%; -webkit-appearance: none; height: 8px; background: linear-gradient(90deg, #3a2a4a, #5d4a3a, #3a2a4a); border-radius: 4px; outline: none; cursor: pointer; }
        .slider-group input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; width: 24px; height: 24px; background: radial-gradient(circle at 40% 40%, #ffe082, #ff8f00); border-radius: 50%; cursor: pointer; box-shadow: 0 0 15px rgba(255,215,80,0.6); border: 2px solid #ffd54f; }
        .range-labels { display: flex; justify-content: space-between; color: #706858; font-size: 0.75rem; margin-top: 0.2rem; }
        .info-box { margin-top: 1.5rem; padding: 1rem 1.5rem; background: rgba(255,215,80,0.05); border: 1px solid rgba(255,215,80,0.2); border-radius: 12px; text-align: center; color: #c0b090; font-size: 0.9rem; font-style: italic; }
        .info-box .formula-display { font-family: 'Courier New', monospace; color: #ffd54f; font-size: 1rem; margin: 0.3rem 0; }
        .back-row { text-align: center; margin-top: 1.5rem; }
        .back-link { display: inline-block; color: #ffd54f; text-decoration: none; border: 1px solid #ffd54f; padding: 0.6rem 1.5rem; border-radius: 30px; transition: 0.3s; font-size: 0.9rem; }
        .back-link:hover { background: #ffd54f; color: #0d1117; }
        @media (max-width: 700px) { .main-container { padding: 1rem; } .header h1 { font-size: 1.8rem; } .controls-panel { padding: 1rem; } }
    </style>
</head>
<body>
<div class="stars-bg" id="starsBg"></div>
<div class="main-container">
    <div class="header">
        <h1>👥 Коллективная Синергия</h1>
        <div class="subtitle">Визуализация §92 и §123: мощность N² при синхронизации</div>
    </div>
    <div class="canvas-wrapper" id="canvasWrapper">
        <canvas id="syncCanvas"></canvas>
    </div>
    <div class="controls-panel">
        <div class="controls-title">🎛️ Параметры</div>
        <div class="slider-group">
            <label><span>👤 Количество источников (N)</span><span class="param-value" id="nValue">5</span></label>
            <input type="range" id="nSlider" min="1" max="20" value="5" step="1">
            <div class="range-labels"><span>1</span><span>5</span><span>10</span><span>20</span></div>
        </div>
        <div class="slider-group">
            <label><span>🔄 Синхронизация фаз (Δφ)</span><span class="param-value" id="phaseValue">0° (полная)</span></label>
            <input type="range" id="phaseSlider" min="0" max="180" value="0" step="1">
            <div class="range-labels"><span>0° (синхрон)</span><span>90°</span><span>180° (хаос)</span></div>
        </div>
        <div class="slider-group">
            <label><span>☀️ Семантический заряд Qₛ</span><span class="param-value" id="qsValue">+5</span></label>
            <input type="range" id="qsSlider" min="-10" max="10" value="5" step="1">
            <div class="range-labels"><span>-10</span><span>0</span><span>+10</span></div>
        </div>
        <div class="info-box">
            <span id="statusText" style="color:#ffd54f;font-weight:bold;">💪 Максимальная синергия — мощность ×25!</span>
            <div class="formula-display" id="formulaDisplay"></div>
        </div>
    </div>
    <div class="back-row">
        <a href="visualizations.html" class="back-link">← К списку визуализаций</a>
    </div>
</div>

<script>
(function(){
    const starsBg=document.getElementById('starsBg');
    for(let i=0;i<100;i++){
        const d=document.createElement('div');d.className='star';
        d.style.left=Math.random()*100+'%';d.style.top=Math.random()*100+'%';
        const s=Math.random()*2.5+0.5;d.style.width=s+'px';d.style.height=s+'px';
        d.style.setProperty('--duration',(Math.random()*4+2)+'s');
        d.style.setProperty('--delay',(Math.random()*5)+'s');
        starsBg.appendChild(d);
    }
})();

const canvas=document.getElementById('syncCanvas');
const ctx=canvas.getContext('2d');
const wrapper=document.getElementById('canvasWrapper');
let time=0,animId;

function resize(){
    const r=wrapper.getBoundingClientRect();
    canvas.width=r.width;
    canvas.height=Math.max(500,Math.min(650,r.width*0.7));
    wrapper.style.height=canvas.height+'px';
}
resize();window.addEventListener('resize',resize);

const nSlider=document.getElementById('nSlider');
const phaseSlider=document.getElementById('phaseSlider');
const qsSlider=document.getElementById('qsSlider');
const nValue=document.getElementById('nValue');
const phaseValue=document.getElementById('phaseValue');
const qsValue=document.getElementById('qsValue');
const statusText=document.getElementById('statusText');
const formulaDisplay=document.getElementById('formulaDisplay');

nSlider.oninput=function(){nValue.textContent=this.value;updateInfo();};
phaseSlider.oninput=function(){
    const p=parseInt(this.value);
    if(p===0) phaseValue.textContent='0° (полная)';
    else if(p<30) phaseValue.textContent=p+'° (почти синхрон)';
    else if(p<90) phaseValue.textContent=p+'° (расхождение)';
    else if(p<150) phaseValue.textContent=p+'° (сильное расхождение)';
    else phaseValue.textContent='180° (хаос)';
    updateInfo();
};
qsSlider.oninput=function(){qsValue.textContent=(parseInt(this.value)>=0?'+':'')+parseInt(this.value);};

function updateInfo(){
    const N=parseInt(nSlider.value);
    const phase=parseInt(phaseSlider.value);
    const syncFactor=Math.cos(phase*Math.PI/180);
    const k=1+syncFactor;
    const P_ratio=Math.pow(N,k-1);
    
    if(syncFactor>0.9) statusText.textContent='💪 Максимальная синергия — мощность ×'+P_ratio.toFixed(1)+'!';
    else if(syncFactor>0.5) statusText.textContent='🔗 Хорошая синергия — мощность ×'+P_ratio.toFixed(1);
    else if(syncFactor>0) statusText.textContent='📡 Слабая синергия — почти как сумма';
    else if(syncFactor>-0.5) statusText.textContent='🌫️ Деструктивная интерференция — мощность падает';
    else statusText.textContent='💀 Полное гашение — волны в противофазе!';
    
    formulaDisplay.textContent='P_total≈P₁·N^('+k.toFixed(2)+')='+P_ratio.toFixed(1)+'×P₁ | N='+N+' | Δφ='+phase+'°';
}
updateInfo();

function getQSColor(qs,alpha){
    const absQ=Math.abs(qs);
    const norm=absQ/10;
    if(absQ<0.5){const gray=Math.floor(100*norm+30);return `rgba(${gray},${gray},${gray},${alpha*0.4})`;}
    if(qs>=0){const r=Math.floor(30+norm*225);const g=Math.floor(5+norm*235);const b=Math.floor(80*(1-norm)+255*norm);return `rgba(${r},${g},${b},${alpha})`;}
    else{const r=Math.floor(80*(1-norm)+30*norm);const g=Math.floor(40*(1-norm)+5*norm);const b=Math.floor(30+norm*200);return `rgba(${r},${g},${b},${alpha})`;}
}

function drawFrame(){
    const N=parseInt(nSlider.value);
    const phaseDeg=parseInt(phaseSlider.value);
    const qs=parseInt(qsSlider.value);
    const w=canvas.width,h=canvas.height;
    time+=0.016;
    
    ctx.fillStyle='#060a10';
    ctx.fillRect(0,0,w,h);
    
    const centerX=w*0.5,centerY=h*0.5;
    const radius=h*0.28;
    const phaseRad=phaseDeg*Math.PI/180;
    const syncFactor=Math.cos(phaseRad);
    const k=1+syncFactor;
    
    // === РАССТАНОВКА ИСТОЧНИКОВ ПО КРУГУ ===
    const sources=[];
    for(let i=0;i<N;i++){
        const angle=(i/N)*Math.PI*2-Math.PI/2;
        const sx=centerX+Math.cos(angle)*radius;
        const sy=centerY+Math.sin(angle)*radius;
        const phase=(i/N)*Math.PI*2*phaseRad/180;
        sources.push({x:sx,y:sy,phase:phase});
    }
    
    // === ВОЛНЫ ОТ ИСТОЧНИКОВ ===
    const maxRings=30;
    for(let ring=0;ring<maxRings;ring++){
        const ringRadius=10+ring*12;
        const alpha=0.3*(1-ring/maxRings)*Math.exp(-ring/25);
        if(alpha<0.01) continue;
        
        ctx.strokeStyle=getQSColor(qs,alpha);
        ctx.lineWidth=1.5;
        ctx.beginPath();
        
        for(const src of sources){
            const a0=0,a1=Math.PI*2;
            for(let a=a0;a<=a1;a+=0.05){
                const x=src.x+Math.cos(a)*ringRadius;
                const y=src.y+Math.sin(a)*ringRadius;
                if(a===a0) ctx.moveTo(x,y);
                else ctx.lineTo(x,y);
            }
        }
        ctx.stroke();
    }
    
    // === ЦЕНТРАЛЬНАЯ ЗОНА ИНТЕРФЕРЕНЦИИ ===
    if(N>1){
        const interferenceIntensity=syncFactor*N/20;
        const intGlow=ctx.createRadialGradient(centerX,centerY,0,centerX,centerY,radius*0.6);
        intGlow.addColorStop(0,'rgba(255,255,255,'+(0.3+interferenceIntensity*0.7)+')');
        intGlow.addColorStop(0.3,getQSColor(qs,0.3+interferenceIntensity*0.7));
        intGlow.addColorStop(0.7,'rgba(255,200,100,0.1)');
        intGlow.addColorStop(1,'rgba(0,0,0,0)');
        ctx.fillStyle=intGlow;
        ctx.beginPath();ctx.arc(centerX,centerY,radius*0.6,0,Math.PI*2);ctx.fill();
        
        // Пульсация в центре
        const pulse=1+0.5*interferenceIntensity*Math.sin(time*4);
        ctx.strokeStyle='rgba(255,255,255,0.5)';
        ctx.lineWidth=2;
        ctx.beginPath();ctx.arc(centerX,centerY,15*pulse,0,Math.PI*2);ctx.stroke();
    }
    
    // === САМИ ИСТОЧНИКИ ===
    for(const src of sources){
        const glow=ctx.createRadialGradient(src.x,src.y,0,src.x,src.y,18);
        glow.addColorStop(0,'rgba(255,255,255,0.9)');
        glow.addColorStop(0.3,getQSColor(qs,0.7));
        glow.addColorStop(1,'rgba(0,0,0,0)');
        ctx.fillStyle=glow;
        ctx.beginPath();ctx.arc(src.x,src.y,18,0,Math.PI*2);ctx.fill();
        
        ctx.fillStyle='white';
        ctx.beginPath();ctx.arc(src.x,src.y,6,0,Math.PI*2);ctx.fill();
    }
    
    // === ЛИНИИ СВЯЗИ ===
    if(syncFactor>0.5){
        ctx.strokeStyle='rgba(255,255,200,0.2)';
        ctx.lineWidth=1;
        ctx.setLineDash([3,5]);
        ctx.beginPath();
        for(let i=0;i<N;i++){
            const s1=sources[i];
            const s2=sources[(i+1)%N];
            ctx.moveTo(s1.x,s1.y);
            ctx.lineTo(s2.x,s2.y);
        }
        ctx.stroke();
        ctx.setLineDash([]);
    }
    
    // === ПОДПИСИ ===
    ctx.fillStyle='white';
    ctx.font='bold 16px Georgia,serif';
    ctx.textAlign='center';
    ctx.fillText('N='+N,centerX,centerY-8);
    ctx.fillText('P_total≈P₁×N^'+k.toFixed(2),centerX,centerY+12);
    
    ctx.fillText('Источники Qₛ',centerX,centerY-radius-25);
    
    // === ГРАФИК МОЩНОСТИ ===
    const graphX=w*0.75,graphY=20,graphW=w*0.2,graphH=h*0.25;
    
    ctx.fillStyle='rgba(0,0,0,0.3)';
    ctx.fillRect(graphX,graphY,graphW,graphH);
    ctx.strokeStyle='rgba(255,255,255,0.3)';
    ctx.strokeRect(graphX,graphY,graphW,graphH);
    
    // Столбик мощности
    const maxPower=N*N;
    const currentPower=N*Math.pow(N,k-1);
    const barH=(currentPower/maxPower)*graphH;
    
    const barGrad=ctx.createLinearGradient(graphX,graphY+graphH,graphX,graphY+graphH-barH);
    barGrad.addColorStop(0,'rgba(100,200,255,0.6)');
    barGrad.addColorStop(1,'rgba(255,200,100,0.9)');
    ctx.fillStyle=barGrad;
    ctx.fillRect(graphX+4,graphY+graphH-barH,graphW-8,barH);
    
    ctx.fillStyle='white';
    ctx.font='11px Georgia,serif';
    ctx.textAlign='center';
    ctx.fillText('Мощность',graphX+graphW/2,graphY-8);
    ctx.fillText('P='+currentPower.toFixed(0),graphX+graphW/2,graphY+graphH+16);
    
    // Подпись N²
    ctx.fillText('N²='+(N*N),graphX+graphW/2,graphY+graphH+32);
    
    animId=requestAnimationFrame(drawFrame);
}

drawFrame();
window.addEventListener('beforeunload',()=>{if(animId)cancelAnimationFrame(animId);});
</script>

</body>
</html>
