<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Калькулятор Водного Баланса • Идеатоника</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: linear-gradient(145deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            font-family: 'Georgia', 'Times New Roman', serif;
            padding: 2rem;
            display: flex; flex-direction: column; align-items: center;
        }
        .cosmic-bg { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 0; }
        .main-container {
            max-width: 800px; width: 100%; position: relative; z-index: 1;
            background: rgba(30, 40, 60, 0.85); backdrop-filter: blur(12px);
            border: 1px solid rgba(227, 184, 124, 0.4); border-radius: 32px;
            padding: 2.5rem; box-shadow: 0 20px 40px rgba(0,0,0,0.5);
        }
        h1 { font-size: 2.5rem; color: #f3e7c0; text-align: center; margin-bottom: 0.5rem; font-weight: 400; }
        .subtitle { text-align: center; color: #c0b090; font-style: italic; margin-bottom: 2rem; border-bottom: 1px solid #5d4a3a; padding-bottom: 1rem; }
        .calc-section { background: rgba(0,0,0,0.2); border-radius: 20px; padding: 2rem; margin-bottom: 2rem; border: 1px solid #5d4a3a; }
        .section-title { font-size: 1.4rem; color: #ffd54f; margin-bottom: 1.5rem; }
        .input-group { margin-bottom: 1.5rem; }
        .input-group label { display: flex; justify-content: space-between; align-items: center; color: #d0c8b8; font-size: 1rem; margin-bottom: 0.5rem; }
        .input-group label span { color: #ffd54f; font-weight: bold; font-size: 1.2rem; }
        .input-group input[type="range"] { width: 100%; -webkit-appearance: none; height: 8px; background: #5d4a3a; border-radius: 4px; outline: none; cursor: pointer; }
        .input-group input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; width: 22px; height: 22px; background: #ffd54f; border-radius: 50%; cursor: pointer; box-shadow: 0 0 10px rgba(255,215,80,0.5); }
        .input-group .range-labels { display: flex; justify-content: space-between; color: #706858; font-size: 0.8rem; margin-top: 0.3rem; }
        .input-group select { width: 100%; padding: 0.8rem 1rem; background: rgba(0,0,0,0.3); border: 1px solid #5d4a3a; border-radius: 10px; color: #f3e7c0; font-family: 'Georgia', serif; font-size: 1rem; }
        .input-group select option { background: #1a1a2e; color: #f3e7c0; }
        .result-box { background: rgba(79,195,247,0.1); border: 2px solid #4fc3f7; border-radius: 20px; padding: 2rem; text-align: center; margin-top: 2rem; }
        .result-number { font-size: 4rem; font-weight: bold; color: #4fc3f7; line-height: 1; }
        .result-label { color: #c0b090; font-size: 1.2rem; margin-top: 0.5rem; }
        .result-extra { color: #d0c8b8; font-size: 1rem; margin-top: 1rem; font-style: italic; }
        .result-details { text-align: left; margin-top: 1.5rem; color: #d0c8b8; font-size: 0.9rem; line-height: 1.8; }
        .result-details table { width: 100%; border-collapse: collapse; margin-top: 0.5rem; }
        .result-details th { background: #2a2a4a; color: #4fc3f7; padding: 8px; border: 1px solid #5d4a3a; font-size: 0.85rem; }
        .result-details td { padding: 8px; border: 1px solid #5d4a3a; font-size: 0.85rem; color: #d0c8b8; }
        .result-details tr:nth-child(even) td { background: rgba(0,0,0,0.1); }
        .result-formula { color: #a09080; font-style: italic; font-size: 0.9rem; margin-top: 1rem; font-family: 'Courier New', monospace; }
        .back-link { display: inline-block; margin-top: 1.5rem; color: #ffd54f; text-decoration: none; border: 1px solid #ffd54f; padding: 0.6rem 1.5rem; border-radius: 30px; transition: 0.2s; }
        .back-link:hover { background: #ffd54f; color: #1a1a2e; }
    </style>
</head>
<body>
<div class="cosmic-bg"></div>
<div class="main-container">

    <h1>💧 Водный баланс</h1>
    <div class="subtitle">Калькулятор восстановления Qₛ через воду (§127, Таблица Материалов)</div>

    <div class="calc-section">
        <div class="section-title">📐 Ваши параметры</div>

        <!-- Текущий Qₛ -->
        <div class="input-group">
            <label>🌙 Текущий Qₛ: <span id="qsValue">+2</span></label>
            <input type="range" id="qsSlider" min="-5" max="10" value="2" step="0.5">
            <div class="range-labels"><span>-5 (истощён)</span><span>0</span><span>+10 (святой)</span></div>
        </div>

        <!-- Желаемый Qₛ -->
        <div class="input-group">
            <label>🎯 Желаемый Qₛ: <span id="targetValue">+5</span></label>
            <input type="range" id="targetSlider" min="-5" max="10" value="5" step="0.5">
            <div class="range-labels"><span>-5</span><span>0</span><span>+10 (святой)</span></div>
        </div>

        <!-- Тип воды -->
        <div class="input-group">
            <label>💧 Тип воды:</label>
            <select id="waterSelect">
                <option value="8">🌟 Святая вода (ранг +8, σ=10) — освящённая в храме</option>
                <option value="5">🌿 Родниковая / талая вода (ранг +5, σ=9) — природный источник</option>
                <option value="3" selected>💧 Фильтрованная / бутилированная (ранг +3, σ=7)</option>
                <option value="1">🚰 Водопроводная (ранг +1, σ=6) — отстоянная</option>
            </select>
        </div>

        <!-- Cₛ во время питья -->
        <div class="input-group">
            <label>🧘 Осознанность при питье (Cₛ): <span id="csValue">0.5</span></label>
            <input type="range" id="csSlider" min="0.1" max="1" value="0.5" step="0.01">
            <div class="range-labels"><span>0.1 (на бегу)</span><span>1.0 (с благодарностью)</span></div>
        </div>

        <!-- Рост/вес для нормы воды -->
        <div class="input-group">
            <label>⚖️ Ваш вес: <span id="weightValue">70</span> кг</label>
            <input type="range" id="weightSlider" min="40" max="120" value="70" step="1">
            <div class="range-labels"><span>40 кг</span><span>120 кг</span></div>
        </div>
    </div>

    <!-- Результат -->
    <div class="result-box" id="resultBox">
        <div class="result-number" id="resultNumber">—</div>
        <div class="result-label" id="resultLabel">Стаканов воды в день</div>
        <div class="result-extra" id="resultExtra"></div>
        <div class="result-details" id="resultDetails"></div>
        <div class="result-formula" id="resultFormula"></div>
    </div>

    <div style="text-align: center;">
        <a href="semantic-calculators.html" class="back-link">← К списку калькуляторов</a>
    </div>

</div>

<script>
    const qsSlider = document.getElementById('qsSlider');
    const targetSlider = document.getElementById('targetSlider');
    const waterSelect = document.getElementById('waterSelect');
    const csSlider = document.getElementById('csSlider');
    const weightSlider = document.getElementById('weightSlider');
    const qsValue = document.getElementById('qsValue');
    const targetValue = document.getElementById('targetValue');
    const csValue = document.getElementById('csValue');
    const weightValue = document.getElementById('weightValue');
    const resultNumber = document.getElementById('resultNumber');
    const resultLabel = document.getElementById('resultLabel');
    const resultExtra = document.getElementById('resultExtra');
    const resultDetails = document.getElementById('resultDetails');
    const resultFormula = document.getElementById('resultFormula');

    qsSlider.addEventListener('input', () => { qsValue.textContent = (parseFloat(qsSlider.value) >= 0 ? '+' : '') + parseFloat(qsSlider.value).toFixed(1); calculate(); });
    targetSlider.addEventListener('input', () => { targetValue.textContent = (parseFloat(targetSlider.value) >= 0 ? '+' : '') + parseFloat(targetSlider.value).toFixed(1); calculate(); });
    waterSelect.addEventListener('change', calculate);
    csSlider.addEventListener('input', () => { csValue.textContent = parseFloat(csSlider.value).toFixed(2); calculate(); });
    weightSlider.addEventListener('input', () => { weightValue.textContent = parseInt(weightSlider.value); calculate(); });

    function calculate() {
        const Qcurrent = parseFloat(qsSlider.value);
        const Qtarget = parseFloat(targetSlider.value);
        const waterRank = parseFloat(waterSelect.value);
        const C = parseFloat(csSlider.value);
        const weight = parseInt(weightSlider.value);

        // Физиологическая норма воды (мл) = вес * 30
        const dailyWaterMl = weight * 30;
        const dailyGlasses = Math.round(dailyWaterMl / 250);

        if (Qtarget <= Qcurrent) {
            resultNumber.textContent = dailyGlasses + ' ст.';
            resultLabel.textContent = 'Поддерживающая норма';
            resultExtra.textContent = '✅ Ваш Qₛ уже на целевом уровне. Пейте воду в обычном режиме для поддержания баланса.';
            resultDetails.innerHTML = '';
            resultFormula.textContent = 'Q_цель ≤ Q_текущий — дополнительное восстановление не требуется.';
            return;
        }

        // Прирост Qₛ от одного стакана воды (250 мл)
        const deltaPerGlass = (waterRank / 10) * C * 0.4;
        const deficit = Qtarget - Qcurrent;
        const extraGlassesNeeded = Math.ceil(deficit / deltaPerGlass);
        const totalGlasses = dailyGlasses + extraGlassesNeeded;

        resultNumber.textContent = totalGlasses + ' ст.';
        resultLabel.textContent = 'стаканов воды в день';

        let extra = '';
        if (extraGlassesNeeded <= 2) extra = '💧 Достаточно добавить пару стаканов к обычной норме. Легко!';
        else if (extraGlassesNeeded <= 5) extra = '🚰 Немного больше обычного. Пейте осознанно, с благодарностью.';
        else if (extraGlassesNeeded <= 10) extra = '🌊 Серьёзная водная терапия. Растяните на весь день.';
        else extra = '⚠️ Очень много воды! Возможно, стоит выбрать воду более высокого ранга — это ускорит процесс.';
        resultExtra.textContent = extra;

        const waterName = waterSelect.options[waterSelect.selectedIndex].text.split(' (')[0];
        const finalQ = Math.min(10, Qcurrent + deltaPerGlass * extraGlassesNeeded);

        resultDetails.innerHTML = `
            <p><strong>📋 Параметры водного баланса:</strong></p>
            <table>
                <tr><th>Параметр</th><th>Значение</th></tr>
                <tr><td>Тип воды</td><td>${waterName}</td></tr>
                <tr><td>Физиологическая норма</td><td>${dailyWaterMl} мл (${dailyGlasses} ст. по 250 мл)</td></tr>
                <tr><td>Дополнительно для Qₛ</td><td>${extraGlassesNeeded} ст. (${extraGlassesNeeded * 250} мл)</td></tr>
                <tr><td>Прирост Qₛ на стакан</td><td>+${deltaPerGlass.toFixed(3)}</td></tr>
                <tr><td>Qₛ после дня терапии</td><td>${(finalQ >= 0 ? '+' : '') + finalQ.toFixed(1)}</td></tr>
                <tr><td>Ритуал</td><td>Пить медленно, держать стакан в руках 10 секунд, мысленно благодарить</td></tr>
            </table>
        `;

        resultFormula.textContent = `ΔQ/ст = (${waterRank.toFixed(0)} / 10) · ${C.toFixed(2)} · 0.4 = +${deltaPerGlass.toFixed(3)} | Дефицит: ${deficit.toFixed(1)} | Стаканов: ${extraGlassesNeeded}`;
    }

    calculate();
</script>

</body>
</html>
