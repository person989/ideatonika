<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Практикум: профессиональный • Основы Идеатоники</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: linear-gradient(145deg, #1a1a2e 0%, #16213e 100%); min-height: 100vh; font-family: 'Georgia', serif; padding: 2rem; display: flex; justify-content: center; align-items: flex-start; }
        .main-container { max-width: 800px; width: 100%; background: rgba(30,40,60,0.85); backdrop-filter: blur(12px); border: 2px solid #81c784; border-radius: 32px; padding: 2.5rem; box-shadow: 0 20px 40px rgba(0,0,0,0.5); }
        h1 { text-align: center; color: #81c784; font-size: 2.5rem; font-weight: 400; margin-bottom: 0.5rem; }
        .subtitle { text-align: center; color: #c0b090; font-style: italic; margin-bottom: 2rem; }
        .progress-bar { width: 100%; height: 6px; background: rgba(0,0,0,0.3); border-radius: 3px; margin: 1rem 0; }
        .progress-fill { height: 100%; background: #81c784; border-radius: 3px; width: 0%; transition: width 0.3s; }
        .question-box { margin-bottom: 2rem; }
        .question-text { color: #f3e7c0; font-size: 1.2rem; margin-bottom: 1.5rem; line-height: 1.5; }
        .options { display: flex; flex-direction: column; gap: 10px; }
        .option { background: rgba(0,0,0,0.2); border: 1px solid #5d4a3a; border-radius: 12px; padding: 1rem 1.5rem; cursor: pointer; color: #d0c8b8; transition: 0.2s; display: flex; align-items: center; gap: 12px; }
        .option:hover { border-color: #81c784; background: rgba(129,199,132,0.1); }
        .option.selected { border-color: #81c784; background: rgba(129,199,132,0.2); color: #f3e7c0; }
        .nav-buttons { display: flex; justify-content: space-between; margin-top: 2rem; gap: 10px; }
        .btn { background: transparent; border: 1.5px solid #81c784; color: #81c784; padding: 0.8rem 1.8rem; font-size: 1rem; font-weight: bold; border-radius: 40px; cursor: pointer; font-family: inherit; }
        .btn:hover { background: #81c784; color: #1a1a2e; }
        .btn:disabled { opacity: 0.3; cursor: not-allowed; }
        .result-container { text-align: center; }
        .result-score { font-size: 5rem; color: #81c784; font-weight: bold; }
        .result-table { width: 100%; margin: 2rem 0; border-collapse: collapse; }
        .result-table th, .result-table td { padding: 10px; border: 1px solid #5d4a3a; color: #d0c8b8; text-align: left; }
        .result-table th { background: #2a2a4a; color: #81c784; }
        .correct { color: #81c784; } .wrong { color: #ef5350; }
        .hidden { display: none; }
        .back-link { display: block; text-align: center; margin-top: 1.5rem; color: #81c784; text-decoration: none; }
    </style>
</head>
<body>
<div class="main-container" id="quizContainer">
    <h1>🧪 ПРАКТИКУМ: ПРОФЕССИОНАЛЬНЫЙ</h1>
    <div class="subtitle">Эксперименты №21–№30 • 10 вопросов • 5 вариантов</div>
    <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
    <div id="questionArea"></div>
    <div class="nav-buttons">
        <button class="btn" id="prevBtn" disabled>← Назад</button>
        <button class="btn" id="exitBtn" onclick="window.location.href='academy-basics-menu.html'">🚪 Выйти</button>
        <button class="btn" id="nextBtn">Далее →</button>
    </div>
    <a href="academy-basics-menu.html" class="back-link">← Вернуться к списку тем</a>
</div>

<script>
const questions = [
    {
        q: "Что измеряет прибор TEMP-METER (Эксперимент №21)?",
        opts: ["Когерентность Cₛ", "Чувствительность χ", "Семантическую температуру Tₛ", "Сопротивление R_sense", "Мощность P_sense"],
        ans: 2
    },
    {
        q: "Какова цель эксперимента №22 «SEC-4» (Каскадный умножитель)?",
        opts: ["Собрать массив ячеек для питания нагрузки", "Измерить температуру", "Очистить воду", "Проверить закон Ома", "Зарядить кристалл"],
        ans: 0
    },
    {
        q: "Что выясняет эксперимент №23 «SEC-5» (Вакуумный преобразователь)?",
        opts: ["Влияние температуры на Qₛ", "Скорость звука в воде", "Электропроводность металлов", "Распространяется ли Qₛ в вакууме", "Вес предметов в вакууме"],
        ans: 3
    },
    {
        q: "Что строит система FIELD-MAP (Эксперимент №24)?",
        opts: ["График температуры", "Трёхмерные карты Qₛ, Cₛ, Tₛ и Re_sense", "Спектр звука", "Диаграмму мощности", "Таблицу материалов"],
        ans: 1
    },
    {
        q: "Какой метод используется в HEAL-TEST (Эксперимент №25)?",
        opts: ["Одиночный слепой", "Открытое исследование", "Наблюдение", "Двойной слепой с контролем плацебо", "Опрос"],
        ans: 3
    },
    {
        q: "Что измеряет EGREGOR-METER (Эксперимент №26)?",
        opts: ["Температуру воздуха", "Скорость ветра", "Влажность", "Мощность коллективного семантического поля (эгрегора)", "Давление"],
        ans: 3
    },
    {
        q: "Что измеряет прибор FOOD-Q (Эксперимент №27)?",
        opts: ["Калорийность", "Температуру блюда", "Вес продукта", "Срок годности", "Семантический заряд Qₛ продуктов питания"],
        ans: 4
    },
    {
        q: "Что проверяет эксперимент №28 «CHEF-COH»?",
        opts: ["Вкус еды", "Температуру плиты", "Скорость приготовления", "Влияние Cₛ повара на Qₛ блюда", "Цвет посуды"],
        ans: 3
    },
    {
        q: "Что сравнивает эксперимент №29 «SLOW-FOOD»?",
        opts: ["Разные рецепты", "Разную посуду", "Осознанное поедание против быстрого", "Разные продукты", "Разные плиты"],
        ans: 2
    },
    {
        q: "Что доказывает эксперимент №30 «CHRONOS-1»?",
        opts: ["Что время абсолютно", "Что часы спешат", "Что время не существует", "Что время обратимо", "Что Cₛ влияет на субъективное восприятие времени τ"],
        ans: 4
    }
];

let idx = 0, answers = Array(10).fill(null);
const qArea = document.getElementById('questionArea');
const pf = document.getElementById('progressFill');
const prev = document.getElementById('prevBtn'), next = document.getElementById('nextBtn');

function render() {
    const q = questions[idx];
    let h = `<div class="question-box"><div class="question-text">${idx+1}. ${q.q}</div><div class="options">`;
    q.opts.forEach((o, i) => {
        h += `<div class="option${answers[idx]===i?' selected':''}" data-i="${i}">${o}</div>`;
    });
    h += '</div></div>';
    qArea.innerHTML = h;
    document.querySelectorAll('.option').forEach(o => o.addEventListener('click', function(){
        answers[idx] = parseInt(this.dataset.i);
        render();
    }));
    pf.style.width = ((idx+1)/10*100)+'%';
    prev.disabled = idx===0;
    next.textContent = idx===9 ? '🎉 Завершить' : 'Далее →';
}

function showResult() {
    let correct=0, rows='';
    questions.forEach((q,i)=>{
        const ok = answers[i]===q.ans;
        if(ok) correct++;
        rows += `<tr><td>${i+1}. ${q.q.substring(0,70)}...</td><td class="${ok?'correct':'wrong'}">${ok?'✅':'❌'}</td></tr>`;
    });
    const pct = Math.round(correct/10*100);
    let comment = pct>=90?'🧪 Вы — Профессор-Семантик!':pct>=70?'👍 Отличное знание Практикума!':pct>=50?'📖 Есть куда расти.': '🌱 Повторите Эксперименты №21–№30.';
    qArea.innerHTML = `<div class="result-container"><div class="result-score">${pct}%</div><p style="color:#c0b090;">${comment}</p><table class="result-table"><tr><th>Вопрос</th><th>Результат</th></tr>${rows}</table><p style="color:#a09080;">Звание: ${pct>=90?'🧪 Профессор-Семантик':pct>=70?'📚 Исследователь':pct>=50?'📖 Практикант':'🌱 Новобранец'}</p></div>`;
    document.querySelector('.nav-buttons').classList.add('hidden');
}

prev.addEventListener('click', ()=>{ if(idx>0){idx--; render();} });
next.addEventListener('click', ()=>{
    if(answers[idx]===null){ alert('Выберите ответ!'); return; }
    if(idx<9){ idx++; render(); } else showResult();
});
render();
</script>
</body>
</html>
