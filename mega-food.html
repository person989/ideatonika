        const totalQuestions = questions.length;
        let currentIndex = 0;
        let answers = new Array(totalQuestions).fill(null);

        const questionContainer = document.getElementById('questionContainer');
        const prevBtn = document.getElementById('prevBtn');
        const nextBtn = document.getElementById('nextBtn');
        const exitBtn = document.getElementById('exitBtn');
        const progressFill = document.getElementById('progressFill');
        const progressText = document.getElementById('progressText');
        const testContainer = document.getElementById('testContainer');
        const mainBody = document.getElementById('mainBody');
        const testTitle = document.getElementById('testTitle');
        let isResultMode = false;

        function renderQuestion(index) {
            const q = questions[index];
            let html = `<div class="question-box"><div class="question-text">${index + 1}. ${q.text}</div><div class="options">`;
            q.options.forEach((opt) => {
                const isSelected = answers[index] === opt.value;
                html += `<div class="option ${isSelected ? 'selected' : ''}" data-value="${opt.value}"><div class="option-marker"></div><div class="option-text">${opt.text}</div></div>`;
            });
            html += `</div></div>`;
            questionContainer.innerHTML = html;
            document.querySelectorAll('.option').forEach(opt => { opt.addEventListener('click', () => { answers[index] = parseInt(opt.dataset.value); renderQuestion(index); }); });
            progressFill.style.width = ((index + 1) / totalQuestions * 100) + '%';
            progressText.textContent = `Вопрос ${index + 1} из ${totalQuestions}`;
            prevBtn.disabled = index === 0;
            nextBtn.textContent = index === totalQuestions - 1 ? '🎉 Завершить' : 'Далее →';
        }

        function calculateResult() {
            let sum = 0; answers.forEach(v => sum += v);
            const raw = sum / totalQuestions;
            return Math.round(raw * 10) / 10;
        }

        function getResultStyle(score) {
            if (score >= 7) return { color: '#ffd54f', borderColor: '#ffd54f', bg: 'rgba(255,215,80,0.1)', label: '🌟 Светлая еда', comment: 'Ваше питание — это источник Света. Вы едите осознанно, с благодарностью. Ваша еда исцеляет вас и мир вокруг.', advice: '🌟 Продолжайте! Делитесь своим опытом с другими. Ваш стол — это алтарь.' };
            if (score >= 3) return { color: '#81c784', borderColor: '#81c784', bg: 'rgba(129,199,132,0.1)', label: '🌿 Живая еда', comment: 'Вы на правильном пути. В вашем рационе много живого и полезного. Немного осознанности — и вы перейдёте на следующий уровень.', advice: '🌱 Добавьте больше свежих овощей и благодарности перед едой.' };
            if (score >= 0) return { color: '#90caf9', borderColor: '#90caf9', bg: 'rgba(144,202,249,0.1)', label: '🟰 Нейтральная еда', comment: 'Ваша еда — просто топливо. Вы не вредите себе, но и не получаете максимум энергии.', advice: '🧹 Попробуйте готовить хотя бы раз в день осознанно.' };
            if (score >= -3) return { color: '#ffb74d', borderColor: '#ffb74d', bg: 'rgba(255,183,77,0.1)', label: '🌑 Тёмная еда', comment: 'В вашем рационе много «мёртвой» еды. Это истощает ваше поле.', advice: '⚠️ Начните с малого: замените газировку на воду, фастфуд на домашнюю еду.' };
            return { color: '#ef5350', borderColor: '#ef5350', bg: 'rgba(239,83,80,0.1)', label: '☠️ Токсичная еда', comment: 'Ваше питание разрушает ваше семантическое поле. Вы едите то, что несёт Тьму.', advice: '🚨 Срочно пересмотрите рацион. Начните с чистой воды и свежих фруктов.' };
        }

        function showResult() {
            isResultMode = true;
            const score = calculateResult();
            const style = getResultStyle(score);
            mainBody.style.background = `linear-gradient(145deg, ${style.color}20 0%, #16213e 100%)`;
            testContainer.style.borderColor = style.borderColor;
            let html = `<div class="result-container"><h2 style="color: ${style.color};">${style.label}</h2><div class="result-score" style="color: ${style.color};">${score > 0 ? '+' : ''}${score}</div><div class="result-scale">по шкале Qₛ еды (от -5 до +10)</div><div class="result-comment" style="color: #d0c8b8; background: ${style.bg};">${style.comment}</div><div class="result-advice" style="color: #d0c8b8; background: ${style.bg}; border-left: 4px solid ${style.borderColor};">${style.advice}</div></div>`;
            questionContainer.innerHTML = html;
            prevBtn.classList.add('hidden'); nextBtn.classList.add('hidden');
            exitBtn.textContent = '🔄 Пройти заново'; exitBtn.classList.remove('btn-secondary'); exitBtn.classList.add('btn');
            testTitle.textContent = `Результат: ${style.label}`;
            progressText.textContent = `Тест завершён`;
            
            // --- СОХРАНЕНИЕ В УЛЬТРА-ПАСПОРТ ---
setTimeout(function() {
    const passportBtn = document.createElement('button');
    passportBtn.textContent = '💾 Сохранить результат в Ультра-Паспорт';
    passportBtn.style.cssText = 'display: block; margin: 2rem auto; padding: 1rem 2rem; background: #81c784; color: #1a1a2e; border: none; border-radius: 40px; font-size: 1rem; cursor: pointer; font-weight: bold; transition: 0.3s;';
    passportBtn.onmouseover = () => passportBtn.style.background = '#4caf50';
    passportBtn.onmouseout = () => passportBtn.style.background = '#81c784';

    passportBtn.addEventListener('click', function() {
        // Ищем результат на странице
        const scoreElement = document.querySelector('.result-score');
        if (scoreElement) {
            const resultValue = parseFloat(scoreElement.textContent);
            if (!isNaN(resultValue)) {
                // Ключ: ideatonika_deep_qs (НЕ пересекается с обычным ideatonika_test_qs)
                localStorage.setItem('ideatonika_deep_food', resultValue);
                passportBtn.textContent = '✅ Сохранено в Ультра-Паспорт!';
                passportBtn.style.background = '#388e3c';
                passportBtn.style.color = 'white';
                passportBtn.disabled = true;
            }
        }
    });

    const container = document.querySelector('.result-container') || document.getElementById('questionContainer');
    if (container) {
        container.appendChild(passportBtn);
    }
}, 100);

// ========== КНОПКА "ПОДЕЛИТЬСЯ РЕЗУЛЬТАТОМ" ==========
setTimeout(function() {
    const shareContainer = document.createElement('div');
    shareContainer.style.cssText = 'text-align: center; margin-top: 1.5rem;';

    const shareBtn = document.createElement('button');
    shareBtn.textContent = '📤 Поделиться результатом';
    shareBtn.style.cssText = 'display: block; margin: 0 auto 0.8rem auto; padding: 0.8rem 2rem; background: transparent; color: #81c784; border: 1.5px solid #81c784; border-radius: 40px; font-size: 1rem; cursor: pointer; font-weight: bold; transition: 0.3s; font-family: Georgia, serif;';
    shareBtn.onmouseover = () => shareBtn.style.background = '#81c784';
    shareBtn.onmouseout = () => shareBtn.style.background = 'transparent';
    shareBtn.onmouseover = () => shareBtn.style.color = '#1a1a2e';
    shareBtn.onmouseout = () => shareBtn.style.color = '#81c784';

    shareBtn.addEventListener('click', function() {
        // Получаем название теста из заголовка страницы
        const testName = document.title.replace(' • Идеатоника', '').trim();
        
        // Получаем результат из элемента .result-score
        const scoreElement = document.querySelector('.result-score');
        let resultText = '';
        if (scoreElement) {
            resultText = scoreElement.textContent.trim();
        }
        
        // Получаем комментарий из элемента .result-comment или .result-interpretation
        const commentElement = document.querySelector('.result-comment') || document.querySelector('.result-interpretation');
        let commentText = '';
        if (commentElement) {
            commentText = commentElement.textContent.trim();
        }
        
        // Формируем текст для отправки
        const shareText = `🧪 Я прошёл тест «${testName}» на портале Идеатоника!\n\n` +
            `📊 Мой результат: ${resultText}\n` +
            `💬 ${commentText}\n\n` +
            `🎯 А какой результат у тебя?\n` +
            `👉 Пройти тест: ${window.location.href}\n\n` +
            `🌌 Идеатоника — физика смысла.`;
        
        // Пытаемся использовать Web Share API (мобильные устройства)
        if (navigator.share) {
            navigator.share({
                title: `Мой результат теста «${testName}»`,
                text: shareText,
                url: window.location.href
            }).catch(() => {
                // Если не получилось — копируем в буфер
                copyToClipboard(shareText);
            });
        } else {
            // Если Web Share API не поддерживается — копируем в буфер
            copyToClipboard(shareText);
        }
    });

    function copyToClipboard(text) {
        if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(text).then(() => {
                const originalText = shareBtn.textContent;
                shareBtn.textContent = '✅ Скопировано! Отправь другу';
                shareBtn.style.borderColor = '#ffd54f';
                shareBtn.style.color = '#ffd54f';
                setTimeout(() => {
                    shareBtn.textContent = originalText;
                    shareBtn.style.borderColor = '#81c784';
                    shareBtn.style.color = '#81c784';
                }, 2500);
            }).catch(() => {
                fallbackCopy(text);
            });
        } else {
            fallbackCopy(text);
        }
    }

    function fallbackCopy(text) {
        const textarea = document.createElement('textarea');
        textarea.value = text;
        textarea.style.position = 'fixed';
        textarea.style.left = '-9999px';
        document.body.appendChild(textarea);
        textarea.select();
        try {
            document.execCommand('copy');
            const originalText = shareBtn.textContent;
            shareBtn.textContent = '✅ Скопировано! Отправь другу';
            shareBtn.style.borderColor = '#ffd54f';
            shareBtn.style.color = '#ffd54f';
            setTimeout(() => {
                shareBtn.textContent = originalText;
                shareBtn.style.borderColor = '#81c784';
                shareBtn.style.color = '#81c784';
            }, 2500);
        } catch(e) {
            shareBtn.textContent = '❌ Не удалось скопировать';
            shareBtn.style.borderColor = '#ef5350';
            shareBtn.style.color = '#ef5350';
        }
        document.body.removeChild(textarea);
    }

    // Добавляем подсказку
    const hint = document.createElement('div');
    hint.style.cssText = 'color: #a09080; font-size: 0.8rem; font-style: italic;';
    hint.textContent = 'Нажмите, чтобы скопировать результат и отправить другу';
    shareContainer.appendChild(shareBtn);
    shareContainer.appendChild(hint);

    // Ищем контейнер с результатом
    const container = document.querySelector('.result-container') || document.getElementById('questionContainer');
    if (container) {
        container.appendChild(shareContainer);
    }
}, 100);

        }

        function resetTest() { isResultMode = false; currentIndex = 0; answers = new Array(totalQuestions).fill(null); mainBody.style.background = ''; testContainer.style.borderColor = ''; testTitle.textContent = 'Мега-тест: Светлая или Тёмная еда?'; prevBtn.classList.remove('hidden'); nextBtn.classList.remove('hidden'); exitBtn.textContent = '🚪 Выйти'; exitBtn.classList.add('btn-secondary'); renderQuestion(0); }

        prevBtn.addEventListener('click', () => { if (currentIndex > 0) { currentIndex--; renderQuestion(currentIndex); } });
        nextBtn.addEventListener('click', () => { if (answers[currentIndex] === null) { alert('Выберите ответ.'); return; } if (currentIndex < totalQuestions - 1) { currentIndex++; renderQuestion(currentIndex); } else { if (!answers.includes(null)) showResult(); else alert('Ответьте на все вопросы.'); } });
        exitBtn.addEventListener('click', () => { if (isResultMode) resetTest(); else { if (confirm('Выйти?')) window.location.href = 'hidden-tests.html'; } });
        renderQuestion(0);
    })();
</script>
