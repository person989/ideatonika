<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Тест: Свет или Тьма? • Идеатоника</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: linear-gradient(145deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            font-family: 'Georgia', 'Times New Roman', serif;
            padding: 2rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            transition: background 0.5s ease;
        }
        .cosmic-bg {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle at 30% 40%, rgba(255,215,150,0.08) 0%, transparent 50%),
                        radial-gradient(circle at 80% 70%, rgba(100,150,255,0.05) 0%, transparent 60%);
            pointer-events: none; z-index: 0;
        }
        .test-container {
            max-width: 700px;
            width: 100%;
            position: relative;
            z-index: 1;
            background: rgba(30, 40, 60, 0.85);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(227, 184, 124, 0.4);
            border-radius: 32px;
            padding: 2.5rem;
            box-shadow: 0 20px 40px rgba(0,0,0,0.5);
            transition: border-color 0.3s ease;
        }
        
        /* Заголовок */
        .test-header {
            text-align: center;
            margin-bottom: 2rem;
        }
        .test-header h1 {
            font-size: 2.2rem;
            color: #f3e7c0;
            margin-bottom: 0.5rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        .progress-bar {
            width: 100%;
            height: 6px;
            background: rgba(0,0,0,0.3);
            border-radius: 3px;
            margin: 1.5rem 0;
        }
        .progress-fill {
            height: 100%;
            background: #e3b87c;
            border-radius: 3px;
            width: 0%;
            transition: width 0.3s ease;
        }
        .progress-text {
            text-align: right;
            color: #a09080;
            font-size: 0.8rem;
            margin-top: 0.3rem;
        }
        
        /* Вопрос */
        .question-box {
            margin-bottom: 2rem;
        }
        .question-text {
            color: #f3e7c0;
            font-size: 1.3rem;
            margin-bottom: 1.5rem;
            line-height: 1.5;
        }
        .options {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .option {
            background: rgba(0,0,0,0.2);
            border: 1px solid #5d4a3a;
            border-radius: 16px;
            padding: 1rem 1.5rem;
            cursor: pointer;
            transition: all 0.2s ease;
            color: #d0c8b8;
            display: flex;
            align-items: center;
            gap: 15px;
        }
        .option:hover {
            background: rgba(227, 184, 124, 0.15);
            border-color: #e3b87c;
        }
        .option.selected {
            background: rgba(227, 184, 124, 0.25);
            border-color: #e3b87c;
            color: #f3e7c0;
        }
        .option-marker {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            border: 2px solid #5d4a3a;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }
        .option.selected .option-marker {
            border-color: #e3b87c;
            background: #e3b87c;
            box-shadow: 0 0 10px #e3b87c;
        }
        .option.selected .option-marker::after {
            content: "✓";
            color: #1a1a2e;
            font-weight: bold;
        }
        .option-text {
            flex: 1;
        }
        
        /* Навигация */
        .nav-buttons {
            display: flex;
            justify-content: space-between;
            margin-top: 2rem;
            gap: 15px;
        }
        .btn {
            background: transparent;
            border: 1.5px solid #e3b87c;
            color: #e3b87c;
            padding: 0.8rem 1.8rem;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 40px;
            cursor: pointer;
            transition: 0.2s;
            font-family: inherit;
        }
        .btn:hover {
            background: #e3b87c;
            color: #1a1a2e;
        }
        .btn:disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }
        .btn-secondary {
            border-color: #5d4a3a;
            color: #a09080;
        }
        .btn-secondary:hover {
            background: #5d4a3a;
            color: #d0c8b8;
        }
        
        /* Результат */
        .result-container {
            text-align: center;
        }
        .result-score {
            font-size: 5rem;
            font-weight: bold;
            margin: 1rem 0;
        }
        .result-scale {
            font-size: 1.2rem;
            margin-bottom: 1.5rem;
        }
        .result-comment {
            background: rgba(0,0,0,0.2);
            border-radius: 20px;
            padding: 1.5rem;
            margin: 1.5rem 0;
            line-height: 1.6;
        }
        .result-advice {
            background: rgba(227, 184, 124, 0.1);
            border-left: 4px solid #e3b87c;
            padding: 1.2rem 1.5rem;
            border-radius: 0 12px 12px 0;
            text-align: left;
        }
        
        .hidden {
            display: none !important;
        }
        
        .back-link {
            display: inline-block;
            margin-top: 1.5rem;
            color: #e3b87c;
            text-decoration: none;
            font-size: 0.9rem;
        }
        .back-link:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body id="mainBody">
<div class="cosmic-bg"></div>
<div class="test-container" id="testContainer">
    
    <!-- Шапка -->
    <div class="test-header">
        <h1>
            <span>☀️</span>
            <span id="testTitle">Свет или Тьма?</span>
            <span>🌑</span>
        </h1>
        <div class="progress-bar">
            <div class="progress-fill" id="progressFill"></div>
        </div>
        <div class="progress-text" id="progressText">Вопрос 1 из 7</div>
    </div>
    
    <!-- Контейнер вопроса -->
    <div id="questionContainer"></div>
    
    <!-- Навигация -->
    <div class="nav-buttons">
        <button class="btn btn-secondary" id="prevBtn" disabled>← Назад</button>
        <button class="btn btn-secondary" id="exitBtn">🚪 Выйти</button>
        <button class="btn" id="nextBtn">Далее →</button>
    </div>
    
    <!-- Ссылка назад -->
    <div style="text-align: center;">
        <a href="diagnostics-hub.html" class="back-link">← Вернуться в Хаб Диагностики</a>
    </div>
</div>

<script>
    (function() {
        // Вопросы теста
        const questions = [
            {
                text: "Проснувшись утром, какая мысль приходит к вам чаще всего?",
                options: [
                    { text: "«Опять этот ужасный день… Всё бессмысленно»", value: -3 },
                    { text: "«Скорее бы вечер, чтобы лечь обратно»", value: -2 },
                    { text: "«Тревожно, что-то будет не так»", value: -1 },
                    { text: "«Надо вставать, дела…» (нейтрально)", value: 0 },
                    { text: "«Интересно, что сегодня произойдёт?»", value: 1 },
                    { text: "«Доброе утро, мир! Спасибо за новый день!»", value: 2 },
                    { text: "«Я чувствую прилив сил, радость и благодарность!»", value: 3 }
                ]
            },
            {
                text: "Как часто в течение дня вы испытываете искреннюю благодарность?",
                options: [
                    { text: "Никогда. Я не вижу поводов для благодарности", value: -3 },
                    { text: "Очень редко, только если случится что-то из ряда вон", value: -2 },
                    { text: "Иногда, когда специально задумываюсь об этом", value: -1 },
                    { text: "Пару раз в день, за очевидные вещи (еда, крыша)", value: 0 },
                    { text: "Часто, замечаю приятные мелочи", value: 1 },
                    { text: "Очень часто, почти постоянно нахожу поводы", value: 2 },
                    { text: "Это моё естественное состояние. Я живу с благодарностью", value: 3 }
                ]
            },
            {
                text: "Какие эмоции вы испытываете чаще всего в течение обычного дня?",
                options: [
                    { text: "Гнев, раздражение, обиду, зависть", value: -3 },
                    { text: "Тревогу, страх, беспокойство", value: -2 },
                    { text: "Апатию, усталость, безразличие", value: -1 },
                    { text: "Спокойствие, нейтральность", value: 0 },
                    { text: "Лёгкую радость, интерес", value: 1 },
                    { text: "Вдохновение, воодушевление, любовь", value: 2 },
                    { text: "Глубокий покой, умиротворение, единство", value: 3 }
                ]
            },
            {
                text: "Как вы обычно реагируете на чужие успехи или радость?",
                options: [
                    { text: "Завидую, злюсь, ищу подвох", value: -3 },
                    { text: "Чувствую себя хуже, расстраиваюсь", value: -2 },
                    { text: "Мне всё равно", value: -1 },
                    { text: "Нейтрально принимаю к сведению", value: 0 },
                    { text: "Радуюсь за них, но немного отстранённо", value: 1 },
                    { text: "Искренне радуюсь и вдохновляюсь", value: 2 },
                    { text: "Чувствую их радость как свою, это наполняет меня", value: 3 }
                ]
            },
            {
                text: "Что вы чувствуете, когда остаётесь в полной тишине наедине с собой?",
                options: [
                    { text: "Пустоту, тоску, бессмысленность", value: -3 },
                    { text: "Тревогу, беспокойство, некомфортно", value: -2 },
                    { text: "Скуку, желание чем-то занять себя", value: -1 },
                    { text: "Нейтрально, могу побыть, но без удовольствия", value: 0 },
                    { text: "Лёгкое спокойствие, отдых", value: 1 },
                    { text: "Глубокое умиротворение, приятно", value: 2 },
                    { text: "Блаженство, единение с миром, наполненность", value: 3 }
                ]
            },
            {
                text: "Как часто вы желаете добра другим людям (мысленно или вслух)?",
                options: [
                    { text: "Никогда. Желаю скорее наоборот", value: -3 },
                    { text: "Редко, только самым близким", value: -2 },
                    { text: "Иногда, когда кто-то просит или болеет", value: -1 },
                    { text: "По привычке (например, «спокойной ночи»)", value: 0 },
                    { text: "Регулярно, незнакомым людям на улице", value: 1 },
                    { text: "Часто, это часть моей практики", value: 2 },
                    { text: "Постоянно, это моё естественное состояние", value: 3 }
                ]
            },
            {
                text: "Какое утверждение лучше всего описывает ваше отношение к будущему?",
                options: [
                    { text: "Будущее ужасно, всё будет только хуже", value: -3 },
                    { text: "Я боюсь будущего, там одни проблемы", value: -2 },
                    { text: "Будущее туманно и скорее неприятно", value: -1 },
                    { text: "Будущее неопределённо, поживём — увидим", value: 0 },
                    { text: "Я смотрю в будущее с осторожным оптимизмом", value: 1 },
                    { text: "Я верю, что будущее принесёт много хорошего", value: 2 },
                    { text: "Будущее прекрасно, я с радостью иду ему навстречу", value: 3 }
                ]
            }
        ];
        
        const totalQuestions = questions.length;
        let currentIndex = 0;
        let answers = new Array(totalQuestions).fill(null);
        
        const questionContainer = document.getElementById('questionContainer');
        const prevBtn = document.getElementById('prevBtn');
        const nextBtn = document.getElementById('nextBtn');
        const exitBtn = document.getElementById('exitBtn');
        const progressFill = document.getElementById('progressFill');
        const progressText = document.getElementById('progressText');
        const testContainer = document.getElementById('testContainer');
        const mainBody = document.getElementById('mainBody');
        const testTitle = document.getElementById('testTitle');
        
        let isResultMode = false;
        
        function renderQuestion(index) {
            const q = questions[index];
            let html = `<div class="question-box">`;
            html += `<div class="question-text">${index + 1}. ${q.text}</div>`;
            html += `<div class="options">`;
            
            q.options.forEach((opt, optIndex) => {
                const isSelected = answers[index] === opt.value;
                html += `
                    <div class="option ${isSelected ? 'selected' : ''}" data-value="${opt.value}">
                        <div class="option-marker"></div>
                        <div class="option-text">${opt.text}</div>
                    </div>
                `;
            });
            
            html += `</div></div>`;
            questionContainer.innerHTML = html;
            
            // Вешаем обработчики на опции
            document.querySelectorAll('.option').forEach(opt => {
                opt.addEventListener('click', () => {
                    const value = parseInt(opt.dataset.value);
                    answers[index] = value;
                    renderQuestion(index);
                });
            });
            
            // Обновляем прогресс
            const progress = ((index + 1) / totalQuestions) * 100;
            progressFill.style.width = progress + '%';
            progressText.textContent = `Вопрос ${index + 1} из ${totalQuestions}`;
            
            // Обновляем кнопки
            prevBtn.disabled = index === 0;
            if (index === totalQuestions - 1) {
                nextBtn.textContent = '🎉 Завершить';
            } else {
                nextBtn.textContent = 'Далее →';
            }
        }
        
        function calculateResult() {
            const sum = answers.reduce((acc, val) => acc + val, 0);
            // Максимальная сумма = 7 * 3 = 21, минимальная = -21
            // Приводим к шкале от -10 до +10
            const normalized = Math.round((sum / 21) * 10);
            return Math.max(-10, Math.min(10, normalized));
        }
        
        function getResultColor(score) {
            if (score >= 7) return '#ffd54f'; // Золотой
            if (score >= 4) return '#ffb300'; // Янтарный
            if (score >= 1) return '#ff9800'; // Оранжевый
            if (score >= 0) return '#9e9e9e'; // Серый
            if (score >= -3) return '#795548'; // Коричневый
            if (score >= -6) return '#455a64'; // Сине-серый
            return '#1a1a2e'; // Почти чёрный
        }
        
        function getResultComment(score) {
            if (score >= 9) {
                return "Вы — источник чистого Света. Ваше присутствие исцеляет и вдохновляет. Вы близки к состоянию святости.";
            } else if (score >= 7) {
                return "Вы — яркий Свет. Вы регулярно генерируете позитивный Qₛ, и люди тянутся к вам за поддержкой и теплом.";
            } else if (score >= 5) {
                return "Вы — тёплый Свет. В вашей жизни много радости и благодарности. Вы на верном пути.";
            } else if (score >= 3) {
                return "Вы — мерцающий огонёк. Позитив преобладает, но есть над чем работать. Укрепляйте свою когерентность.";
            } else if (score >= 1) {
                return "Вы — нейтрально-положительны. В вашей жизни есть и свет, и тень. Старайтесь осознанно культивировать благодарность.";
            } else if (score >= -1) {
                return "Вы — нейтральны. Ваш Qₛ близок к нулю. Вы не излучаете Тьму, но и не генерируете Свет. Это точка выбора.";
            } else if (score >= -3) {
                return "Вы — лёгкий сумрак. Тревога, апатия или усталость преобладают. Обратите внимание на семантическую гигиену.";
            } else if (score >= -5) {
                return "Вы — глубокая тень. Обиды, страхи или гнев отравляют ваше поле. Требуется очищение и работа с психологом.";
            } else if (score >= -7) {
                return "Вы — густая Тьма. Вы находитесь в состоянии сильного стресса, депрессии или озлобленности. Вам нужна помощь.";
            } else {
                return "Вы — поглотитель Света. Ваше поле разрушает себя и окружающих. Это кризисное состояние. Немедленно обратитесь за поддержкой.";
            }
        }
        
        function getResultAdvice(score) {
            if (score >= 7) {
                return "🌟 Совет: Продолжайте светить! Но не забывайте заземляться и отдыхать. Делитесь своим Светом с теми, кто в нём нуждается, но не позволяйте вампирам истощать вас. Практикуйте благословение пищи и воды.";
            } else if (score >= 3) {
                return "🌿 Совет: Укрепляйте свой Свет. Ведите дневник благодарности (3 вещи в день). Чаще бывайте на природе. Окружите себя живыми растениями и натуральными материалами. Слушайте музыку 432 Гц.";
            } else if (score >= 0) {
                return "⚖️ Совет: Вы на распутье. Начните с малого: каждое утро находите 1 повод для искренней улыбки. Откажитесь от токсичных новостей и соцсетей хотя бы за час до сна. Пейте больше чистой воды.";
            } else if (score >= -3) {
                return "🧹 Совет: Вам нужна семантическая чистка. Проведите генеральную уборку дома, выбросите хлам и сломанные вещи. Принимайте ванны с солью. Гуляйте в лесу или парке минимум 30 минут в день. Ограничьте общение с «нытиками».";
            } else if (score >= -6) {
                return "🆘 Совет: Вам нужна срочная помощь. Обратитесь к психологу или психотерапевту. Начните практиковать медитацию или молитву (хотя бы 5 минут в день). Исключите алкоголь и фастфуд. Попросите близких о поддержке.";
            } else {
                return "🚨 Совет: Немедленно обратитесь за профессиональной помощью (психиатр, кризисный центр). Вы не одиноки. Даже из самой глубокой Тьмы есть выход. Начните с простого: каждый день принимайте душ, ешьте горячую еду, спите не менее 7 часов. Это база для восстановления.";
            }
        }
        
        function showResult() {
            isResultMode = true;
            const score = calculateResult();
            const color = getResultColor(score);
            const comment = getResultComment(score);
            const advice = getResultAdvice(score);
            
            // Меняем фон body
            mainBody.style.background = `linear-gradient(145deg, ${color}20 0%, #16213e 100%)`;
            testContainer.style.borderColor = color;
            
            let html = `<div class="result-container">`;
            html += `<h2 style="color: ${color};">Ваш результат</h2>`;
            html += `<div class="result-score" style="color: ${color};">${score > 0 ? '+' : ''}${score}</div>`;
            html += `<div class="result-scale">по шкале Qₛ (от -10 до +10)</div>`;
            html += `<div class="result-comment" style="color: #d0c8b8;">${comment}</div>`;
            html += `<div class="result-advice" style="color: #d0c8b8;">${advice}</div>`;
            html += `<p style="margin-top: 1.5rem; color: #a09080; font-style: italic;">Помните: ваш Qₛ не фиксирован. Вы можете изменить его осознанными действиями.</p>`;
            html += `</div>`;
            
            questionContainer.innerHTML = html;
            
            // Скрываем навигацию
            prevBtn.classList.add('hidden');
            nextBtn.classList.add('hidden');
            exitBtn.textContent = '🔄 Пройти заново';
            exitBtn.classList.remove('btn-secondary');
            exitBtn.classList.add('btn');
            
            // Меняем заголовок
            testTitle.textContent = `Результат: Qₛ = ${score > 0 ? '+' : ''}${score}`;
            progressText.textContent = `Тест завершён`;
            
// --- СОХРАНЕНИЕ В ПАСПОРТ (УНИВЕРСАЛЬНЫЙ БЛОК) ---
setTimeout(function() {
    const passportBtn = document.createElement('button');
    passportBtn.textContent = '💾 Сохранить результат в Семантический Паспорт';
    passportBtn.style.cssText = 'display: block; margin: 2rem auto; padding: 1rem 2rem; background: #81c784; color: #1a1a2e; border: none; border-radius: 40px; font-size: 1rem; cursor: pointer; font-weight: bold; transition: 0.3s;';
    passportBtn.onmouseover = () => passportBtn.style.background = '#4caf50';
    passportBtn.onmouseout = () => passportBtn.style.background = '#81c784';

    passportBtn.addEventListener('click', function() {
        const scoreElement = document.querySelector('.result-score');
        if (scoreElement) {
            const resultValue = parseFloat(scoreElement.textContent);
            if (!isNaN(resultValue)) {
                // 1. Сохраняем для Паспорта (как раньше)
                localStorage.setItem('ideatonika_test_qs', resultValue);
                // 2. Сохраняем в историю (НОВОЕ!)
                saveToHistory('qs_history', resultValue);
                
                passportBtn.textContent = '✅ Сохранено в Паспорт!';
                passportBtn.style.background = '#388e3c';
                passportBtn.style.color = 'white';
                passportBtn.disabled = true;
            }
        }
    });

    const container = document.querySelector('.result-container') || document.getElementById('questionContainer');
    if (container) {
        container.appendChild(passportBtn);
    }
}, 100);

// Функция сохранения истории (НОВАЯ!)
function saveToHistory(historyKey, value) {
    const raw = localStorage.getItem(historyKey);
    const history = raw ? JSON.parse(raw) : [];
    history.push({
        date: new Date().toISOString().split('T')[0],
        value: value
    });
    localStorage.setItem(historyKey, JSON.stringify(history));
}

// ========== КНОПКА "ПОДЕЛИТЬСЯ РЕЗУЛЬТАТОМ" ==========
setTimeout(function() {
    const shareContainer = document.createElement('div');
    shareContainer.style.cssText = 'text-align: center; margin-top: 1.5rem;';

    const shareBtn = document.createElement('button');
    shareBtn.textContent = '📤 Поделиться результатом';
    shareBtn.style.cssText = 'display: block; margin: 0 auto 0.8rem auto; padding: 0.8rem 2rem; background: transparent; color: #81c784; border: 1.5px solid #81c784; border-radius: 40px; font-size: 1rem; cursor: pointer; font-weight: bold; transition: 0.3s; font-family: Georgia, serif;';
    shareBtn.onmouseover = () => shareBtn.style.background = '#81c784';
    shareBtn.onmouseout = () => shareBtn.style.background = 'transparent';
    shareBtn.onmouseover = () => shareBtn.style.color = '#1a1a2e';
    shareBtn.onmouseout = () => shareBtn.style.color = '#81c784';

    shareBtn.addEventListener('click', function() {
        // Получаем название теста из заголовка страницы
        const testName = document.title.replace(' • Идеатоника', '').trim();
        
        // Получаем результат из элемента .result-score
        const scoreElement = document.querySelector('.result-score');
        let resultText = '';
        if (scoreElement) {
            resultText = scoreElement.textContent.trim();
        }
        
        // Получаем комментарий из элемента .result-comment или .result-interpretation
        const commentElement = document.querySelector('.result-comment') || document.querySelector('.result-interpretation');
        let commentText = '';
        if (commentElement) {
            commentText = commentElement.textContent.trim();
        }
        
        // Формируем текст для отправки
        const shareText = `🧪 Я прошёл тест «${testName}» на портале Идеатоника!\n\n` +
            `📊 Мой результат: ${resultText}\n` +
            `💬 ${commentText}\n\n` +
            `🎯 А какой результат у тебя?\n` +
            `👉 Пройти тест: ${window.location.href}\n\n` +
            `🌌 Идеатоника — физика смысла.`;
        
        // Пытаемся использовать Web Share API (мобильные устройства)
        if (navigator.share) {
            navigator.share({
                title: `Мой результат теста «${testName}»`,
                text: shareText,
                url: window.location.href
            }).catch(() => {
                // Если не получилось — копируем в буфер
                copyToClipboard(shareText);
            });
        } else {
            // Если Web Share API не поддерживается — копируем в буфер
            copyToClipboard(shareText);
        }
    });

    function copyToClipboard(text) {
        if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(text).then(() => {
                const originalText = shareBtn.textContent;
                shareBtn.textContent = '✅ Скопировано! Отправь другу';
                shareBtn.style.borderColor = '#ffd54f';
                shareBtn.style.color = '#ffd54f';
                setTimeout(() => {
                    shareBtn.textContent = originalText;
                    shareBtn.style.borderColor = '#81c784';
                    shareBtn.style.color = '#81c784';
                }, 2500);
            }).catch(() => {
                fallbackCopy(text);
            });
        } else {
            fallbackCopy(text);
        }
    }

    function fallbackCopy(text) {
        const textarea = document.createElement('textarea');
        textarea.value = text;
        textarea.style.position = 'fixed';
        textarea.style.left = '-9999px';
        document.body.appendChild(textarea);
        textarea.select();
        try {
            document.execCommand('copy');
            const originalText = shareBtn.textContent;
            shareBtn.textContent = '✅ Скопировано! Отправь другу';
            shareBtn.style.borderColor = '#ffd54f';
            shareBtn.style.color = '#ffd54f';
            setTimeout(() => {
                shareBtn.textContent = originalText;
                shareBtn.style.borderColor = '#81c784';
                shareBtn.style.color = '#81c784';
            }, 2500);
        } catch(e) {
            shareBtn.textContent = '❌ Не удалось скопировать';
            shareBtn.style.borderColor = '#ef5350';
            shareBtn.style.color = '#ef5350';
        }
        document.body.removeChild(textarea);
    }

    // Добавляем подсказку
    const hint = document.createElement('div');
    hint.style.cssText = 'color: #a09080; font-size: 0.8rem; font-style: italic;';
    hint.textContent = 'Нажмите, чтобы скопировать результат и отправить другу';
    shareContainer.appendChild(shareBtn);
    shareContainer.appendChild(hint);

    // Ищем контейнер с результатом
    const container = document.querySelector('.result-container') || document.getElementById('questionContainer');
    if (container) {
        container.appendChild(shareContainer);
    }
}, 100);

        }
        
        function resetTest() {
            isResultMode = false;
            currentIndex = 0;
            answers = new Array(totalQuestions).fill(null);
            
            // Сбрасываем стили
            mainBody.style.background = '';
            testContainer.style.borderColor = '';
            testTitle.textContent = 'Свет или Тьма?';
            
            // Восстанавливаем кнопки
            prevBtn.classList.remove('hidden');
            nextBtn.classList.remove('hidden');
            exitBtn.textContent = '🚪 Выйти';
            exitBtn.classList.add('btn-secondary');
            
            renderQuestion(0);
        }
        
        // Обработчики
        prevBtn.addEventListener('click', () => {
            if (currentIndex > 0) {
                currentIndex--;
                renderQuestion(currentIndex);
            }
        });
        
        nextBtn.addEventListener('click', () => {
            if (answers[currentIndex] === null) {
                alert('Пожалуйста, выберите один из вариантов ответа.');
                return;
            }
            
            if (currentIndex < totalQuestions - 1) {
                currentIndex++;
                renderQuestion(currentIndex);
            } else {
                // Проверяем, все ли вопросы отвечены
                if (answers.includes(null)) {
                    alert('Пожалуйста, ответьте на все вопросы.');
                    return;
                }
                showResult();
            }
        });
        
        exitBtn.addEventListener('click', () => {
            if (isResultMode) {
                resetTest();
            } else {
                if (confirm('Вы уверены, что хотите выйти? Прогресс будет потерян.')) {
                    window.location.href = 'diagnostics-hub.html';
                }
            }
        });
        
        // Запуск
        renderQuestion(0);
    })();
</script>
