<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Калькулятор Вероятности Дежавю • Идеатоника</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: linear-gradient(145deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            font-family: 'Georgia', 'Times New Roman', serif;
            padding: 2rem;
            display: flex; flex-direction: column; align-items: center;
        }
        .cosmic-bg { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 0; }
        .main-container {
            max-width: 800px; width: 100%; position: relative; z-index: 1;
            background: rgba(30, 40, 60, 0.85); backdrop-filter: blur(12px);
            border: 1px solid rgba(227, 184, 124, 0.4); border-radius: 32px;
            padding: 2.5rem; box-shadow: 0 20px 40px rgba(0,0,0,0.5);
        }
        h1 { font-size: 2.5rem; color: #f3e7c0; text-align: center; margin-bottom: 0.5rem; font-weight: 400; }
        .subtitle { text-align: center; color: #c0b090; font-style: italic; margin-bottom: 2rem; border-bottom: 1px solid #5d4a3a; padding-bottom: 1rem; }
        .calc-section { background: rgba(0,0,0,0.2); border-radius: 20px; padding: 2rem; margin-bottom: 2rem; border: 1px solid #5d4a3a; }
        .section-title { font-size: 1.4rem; color: #ffd54f; margin-bottom: 1.5rem; }
        .input-group { margin-bottom: 1.5rem; }
        .input-group label { display: flex; justify-content: space-between; align-items: center; color: #d0c8b8; font-size: 1rem; margin-bottom: 0.5rem; }
        .input-group label span { color: #ffd54f; font-weight: bold; font-size: 1.2rem; }
        .input-group input[type="range"] { width: 100%; -webkit-appearance: none; height: 8px; background: #5d4a3a; border-radius: 4px; outline: none; cursor: pointer; }
        .input-group input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; width: 22px; height: 22px; background: #ffd54f; border-radius: 50%; cursor: pointer; box-shadow: 0 0 10px rgba(255,215,80,0.5); }
        .input-group .range-labels { display: flex; justify-content: space-between; color: #706858; font-size: 0.8rem; margin-top: 0.3rem; }
        .input-group select { width: 100%; padding: 0.8rem 1rem; background: rgba(0,0,0,0.3); border: 1px solid #5d4a3a; border-radius: 10px; color: #f3e7c0; font-family: 'Georgia', serif; font-size: 1rem; }
        .input-group select option { background: #1a1a2e; color: #f3e7c0; }
        .result-box { background: rgba(255,215,80,0.1); border: 2px solid #ffd54f; border-radius: 20px; padding: 2rem; text-align: center; margin-top: 2rem; }
        .result-number { font-size: 5rem; font-weight: bold; color: #ffd54f; line-height: 1; }
        .result-label { color: #c0b090; font-size: 1.2rem; margin-top: 0.5rem; }
        .result-extra { color: #d0c8b8; font-size: 1rem; margin-top: 1rem; font-style: italic; }
        .result-detail { color: #a09080; font-size: 0.9rem; margin-top: 0.5rem; font-style: italic; }
        .result-formula { color: #a09080; font-style: italic; font-size: 0.9rem; margin-top: 1rem; font-family: 'Courier New', monospace; }
        .back-link { display: inline-block; margin-top: 1.5rem; color: #ffd54f; text-decoration: none; border: 1px solid #ffd54f; padding: 0.6rem 1.5rem; border-radius: 30px; transition: 0.2s; }
        .back-link:hover { background: #ffd54f; color: #1a1a2e; }
    </style>
</head>
<body>
<div class="cosmic-bg"></div>
<div class="main-container">

    <h1>🕰️ Вероятность Дежавю</h1>
    <div class="subtitle">Калькулятор вероятности «уже виденного» (§74, Формула P = |⟨Φ_pres|Φ_past⟩|²/(θ²+|⟨Φ_pres|Φ_past⟩|²))</div>

    <div class="calc-section">
        <div class="section-title">📐 Параметры ситуации</div>

        <div class="input-group">
            <label>🔄 Сходство с прошлым опытом: <span id="simValue">30</span>%</label>
            <input type="range" id="simSlider" min="0" max="100" value="30" step="1">
            <div class="range-labels"><span>0% (уникально)</span><span>50%</span><span>100% (точная копия)</span></div>
        </div>

        <div class="input-group">
            <label>⏳ Время с момента похожего события:</label>
            <select id="timeSelect">
                <option value="1.5">Только что / сегодня (×1.5)</option>
                <option value="1.2">Несколько дней назад (×1.2)</option>
                <option value="1.0" selected>Неделю-месяц назад (×1.0)</option>
                <option value="0.7">Год назад (×0.7)</option>
                <option value="0.3">Очень давно, детство (×0.3)</option>
            </select>
        </div>

        <div class="input-group">
            <label>😴 Усталость / Состояние:</label>
            <select id="fatigueSelect">
                <option value="2.0">Сильная усталость, недосып (×2.0)</option>
                <option value="1.5">Лёгкая усталость, вечер (×1.5)</option>
                <option value="1.0" selected>Обычное, бодрое (×1.0)</option>
                <option value="0.6">Полный энергии, утро (×0.6)</option>
            </select>
        </div>

        <div class="input-group">
            <label>🧠 Загруженность ума (S_noise): <span id="noiseValue">0.5</span></label>
            <input type="range" id="noiseSlider" min="0.1" max="1" value="0.5" step="0.01">
            <div class="range-labels"><span>0.1 (пустота, медитация)</span><span>1.0 (перегрузка)</span></div>
        </div>

        <div class="input-group">
            <label>🎯 Когерентность (Cₛ): <span id="csValue">0.5</span></label>
            <input type="range" id="csSlider" min="0.1" max="1" value="0.5" step="0.01">
            <div class="range-labels"><span>0.1 (рассеян)</span><span>1.0 (лазер)</span></div>
        </div>
    </div>

    <!-- Результат -->
    <div class="result-box" id="resultBox">
        <div class="result-number" id="resultNumber">—</div>
        <div class="result-label" id="resultLabel">Вероятность дежавю</div>
        <div class="result-extra" id="resultExtra"></div>
        <div class="result-detail" id="resultDetail"></div>
        <div class="result-formula" id="resultFormula"></div>
    </div>

    <div style="text-align: center;">
        <a href="semantic-calculators.html" class="back-link">← К списку калькуляторов</a>
    </div>

</div>

<script>
    const simSlider = document.getElementById('simSlider');
    const timeSelect = document.getElementById('timeSelect');
    const fatigueSelect = document.getElementById('fatigueSelect');
    const noiseSlider = document.getElementById('noiseSlider');
    const csSlider = document.getElementById('csSlider');
    const simValue = document.getElementById('simValue');
    const noiseValue = document.getElementById('noiseValue');
    const csValue = document.getElementById('csValue');
    const resultNumber = document.getElementById('resultNumber');
    const resultLabel = document.getElementById('resultLabel');
    const resultExtra = document.getElementById('resultExtra');
    const resultDetail = document.getElementById('resultDetail');
    const resultFormula = document.getElementById('resultFormula');

    simSlider.addEventListener('input', () => { simValue.textContent = parseInt(simSlider.value); calculate(); });
    timeSelect.addEventListener('change', calculate);
    fatigueSelect.addEventListener('change', calculate);
    noiseSlider.addEventListener('input', () => { noiseValue.textContent = parseFloat(noiseSlider.value).toFixed(2); calculate(); });
    csSlider.addEventListener('input', () => { csValue.textContent = parseFloat(csSlider.value).toFixed(2); calculate(); });

    function calculate() {
        const similarity = parseInt(simSlider.value) / 100; // 0..1
        const timeCoeff = parseFloat(timeSelect.value);
        const fatigueCoeff = parseFloat(fatigueSelect.value);
        const Snoise = parseFloat(noiseSlider.value);
        const C = parseFloat(csSlider.value);

        // Перекрытие полей |⟨Φ_present|Φ_past⟩|²
        // Зависит от сходства, времени, усталости, шума и когерентности
        const overlap = similarity * timeCoeff * fatigueCoeff * (1 - Snoise * 0.3) * C;

        // Порог дежавю (чем выше шум и ниже когерентность, тем выше порог)
        const theta0 = 0.3;
        const theta = theta0 * (1 + Snoise * 2) * (1 + (1 - C) * 2);

        // Вероятность дежавю
        const P = (overlap * overlap) / (theta * theta + overlap * overlap);

        const percent = (P * 100).toFixed(1);

        resultNumber.textContent = percent + '%';
        resultLabel.textContent = 'Вероятность дежавю';

        let extra = '';
        let detail = '';
        if (P >= 0.7) {
            extra = '🌀 Очень высокая вероятность! Вы почти наверняка испытаете дежавю.';
            detail = 'Сознание «зависло» между прошлым и настоящим.';
        } else if (P >= 0.4) {
            extra = '🔮 Высокая вероятность. Будьте внимательны к ощущениям.';
            detail = 'Семантические поля настоящего и прошлого сильно перекрываются.';
        } else if (P >= 0.15) {
            extra = '🌫️ Умеренная вероятность. Может случиться, а может и нет.';
            detail = 'Перекрытие полей есть, но оно нестабильно.';
        } else if (P >= 0.03) {
            extra = '💨 Низкая вероятность. Вряд ли сегодня.';
            detail = 'Слишком много шума или мало сходства с прошлым.';
        } else {
            extra = '❌ Очень низкая вероятность. Дежавю не ожидается.';
            detail = 'Семантические поля почти ортогональны.';
        }
        resultExtra.textContent = extra;
        resultDetail.textContent = detail;

        resultFormula.textContent = `|⟨Φ_pres|Φ_past⟩|² = ${similarity.toFixed(2)} · ${timeCoeff.toFixed(1)} · ${fatigueCoeff.toFixed(1)} · (1−${Snoise.toFixed(2)}·0.3) · ${C.toFixed(2)} = ${overlap.toFixed(3)} | θ = ${theta.toFixed(3)} | P = ${overlap.toFixed(3)}²/(${theta.toFixed(3)}²+${overlap.toFixed(3)}²) = ${P.toFixed(3)}`;
    }

    calculate();
</script>

</body>
</html>
