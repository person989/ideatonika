<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Тест: Лазер или Лампочка? • Идеатоника</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: linear-gradient(145deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            font-family: 'Georgia', 'Times New Roman', serif;
            padding: 2rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            transition: background 0.5s ease;
        }
        .cosmic-bg {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle at 30% 40%, rgba(255,215,150,0.08) 0%, transparent 50%),
                        radial-gradient(circle at 80% 70%, rgba(100,150,255,0.05) 0%, transparent 60%);
            pointer-events: none; z-index: 0;
        }
        .test-container {
            max-width: 700px;
            width: 100%;
            position: relative;
            z-index: 1;
            background: rgba(30, 40, 60, 0.85);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(227, 184, 124, 0.4);
            border-radius: 32px;
            padding: 2.5rem;
            box-shadow: 0 20px 40px rgba(0,0,0,0.5);
            transition: border-color 0.3s ease;
        }
        
        /* Заголовок */
        .test-header {
            text-align: center;
            margin-bottom: 2rem;
        }
        .test-header h1 {
            font-size: 2.2rem;
            color: #f3e7c0;
            margin-bottom: 0.5rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        .progress-bar {
            width: 100%;
            height: 6px;
            background: rgba(0,0,0,0.3);
            border-radius: 3px;
            margin: 1.5rem 0;
        }
        .progress-fill {
            height: 100%;
            background: #64b5f6;
            border-radius: 3px;
            width: 0%;
            transition: width 0.3s ease;
        }
        .progress-text {
            text-align: right;
            color: #a09080;
            font-size: 0.8rem;
            margin-top: 0.3rem;
        }
        
        /* Вопрос */
        .question-box {
            margin-bottom: 2rem;
        }
        .question-text {
            color: #f3e7c0;
            font-size: 1.3rem;
            margin-bottom: 1.5rem;
            line-height: 1.5;
        }
        .options {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .option {
            background: rgba(0,0,0,0.2);
            border: 1px solid #5d4a3a;
            border-radius: 16px;
            padding: 1rem 1.5rem;
            cursor: pointer;
            transition: all 0.2s ease;
            color: #d0c8b8;
            display: flex;
            align-items: center;
            gap: 15px;
        }
        .option:hover {
            background: rgba(100, 181, 246, 0.15);
            border-color: #64b5f6;
        }
        .option.selected {
            background: rgba(100, 181, 246, 0.25);
            border-color: #64b5f6;
            color: #f3e7c0;
        }
        .option-marker {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            border: 2px solid #5d4a3a;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }
        .option.selected .option-marker {
            border-color: #64b5f6;
            background: #64b5f6;
            box-shadow: 0 0 10px #64b5f6;
        }
        .option.selected .option-marker::after {
            content: "✓";
            color: #1a1a2e;
            font-weight: bold;
        }
        .option-text {
            flex: 1;
        }
        
        /* Навигация */
        .nav-buttons {
            display: flex;
            justify-content: space-between;
            margin-top: 2rem;
            gap: 15px;
        }
        .btn {
            background: transparent;
            border: 1.5px solid #64b5f6;
            color: #64b5f6;
            padding: 0.8rem 1.8rem;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 40px;
            cursor: pointer;
            transition: 0.2s;
            font-family: inherit;
        }
        .btn:hover {
            background: #64b5f6;
            color: #1a1a2e;
        }
        .btn:disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }
        .btn-secondary {
            border-color: #5d4a3a;
            color: #a09080;
        }
        .btn-secondary:hover {
            background: #5d4a3a;
            color: #d0c8b8;
        }
        
        /* Результат */
        .result-container {
            text-align: center;
        }
        .result-score {
            font-size: 5rem;
            font-weight: bold;
            margin: 1rem 0;
        }
        .result-scale {
            font-size: 1.2rem;
            margin-bottom: 1.5rem;
        }
        .result-comment {
            background: rgba(0,0,0,0.2);
            border-radius: 20px;
            padding: 1.5rem;
            margin: 1.5rem 0;
            line-height: 1.6;
        }
        .result-advice {
            background: rgba(100, 181, 246, 0.1);
            border-left: 4px solid #64b5f6;
            padding: 1.2rem 1.5rem;
            border-radius: 0 12px 12px 0;
            text-align: left;
        }
        
        .hidden {
            display: none !important;
        }
        
        .back-link {
            display: inline-block;
            margin-top: 1.5rem;
            color: #64b5f6;
            text-decoration: none;
            font-size: 0.9rem;
        }
        .back-link:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body id="mainBody">
<div class="cosmic-bg"></div>
<div class="test-container" id="testContainer">
    
    <!-- Шапка -->
    <div class="test-header">
        <h1>
            <span>💡</span>
            <span id="testTitle">Лазер или Лампочка?</span>
            <span>🔦</span>
        </h1>
        <div class="progress-bar">
            <div class="progress-fill" id="progressFill"></div>
        </div>
        <div class="progress-text" id="progressText">Вопрос 1 из 7</div>
    </div>
    
    <!-- Контейнер вопроса -->
    <div id="questionContainer"></div>
    
    <!-- Навигация -->
    <div class="nav-buttons">
        <button class="btn btn-secondary" id="prevBtn" disabled>← Назад</button>
        <button class="btn btn-secondary" id="exitBtn">🚪 Выйти</button>
        <button class="btn" id="nextBtn">Далее →</button>
    </div>
    
    <!-- Ссылка назад -->
    <div style="text-align: center;">
        <a href="diagnostics-hub.html" class="back-link">← Вернуться в Хаб Диагностики</a>
    </div>
</div>

<script>
    (function() {
        // Вопросы теста
        const questions = [
            {
                text: "Как долго вы можете удерживать внимание на одной задаче (чтение, работа, медитация), не отвлекаясь?",
                options: [
                    { text: "Меньше минуты. Мысли постоянно скачут", value: -3 },
                    { text: "1-5 минут, потом нужно переключиться", value: -2 },
                    { text: "5-15 минут, с трудом, но возможно", value: -1 },
                    { text: "15-30 минут, если задача интересная", value: 0 },
                    { text: "30-60 минут, вхожу в ритм", value: 1 },
                    { text: "1-2 часа, легко удерживаю фокус", value: 2 },
                    { text: "Могу часами быть погружённым, теряя счёт времени", value: 3 }
                ]
            },
            {
                text: "Как часто вы замечаете, что «залипаете» в телефоне или соцсетях, не осознавая этого?",
                options: [
                    { text: "Постоянно. Это мой основной режим существования", value: -3 },
                    { text: "Очень часто, теряю часы", value: -2 },
                    { text: "Часто, но стараюсь контролировать", value: -1 },
                    { text: "Иногда, когда устал или скучно", value: 0 },
                    { text: "Редко, я осознанно ограничиваю время", value: 1 },
                    { text: "Очень редко, телефон — только инструмент", value: 2 },
                    { text: "Никогда. Я полностью контролирую своё внимание", value: 3 }
                ]
            },
            {
                text: "Насколько «громким» вы оцениваете свой внутренний диалог (постоянные мысли, проговаривание, «ментальная жвачка»)?",
                options: [
                    { text: "Оглушительный. В голове постоянно шум, как на вокзале", value: -3 },
                    { text: "Громкий. Много беспокойных мыслей", value: -2 },
                    { text: "Заметный. Часто отвлекаюсь на свои мысли", value: -1 },
                    { text: "Умеренный. Иногда тишина, иногда мысли", value: 0 },
                    { text: "Тихий. Мысли есть, но они не мешают", value: 1 },
                    { text: "Очень тихий. Часто наступает ясность", value: 2 },
                    { text: "Почти полная тишина. Я наблюдаю мысли, но не вовлекаюсь", value: 3 }
                ]
            },
            {
                text: "Легко ли вам заснуть? Насколько «чистое» у вас состояние перед сном?",
                options: [
                    { text: "Очень трудно. Часами ворочаюсь, мысли не отпускают", value: -3 },
                    { text: "Трудно. Нужно время, чтобы «остыть»", value: -2 },
                    { text: "По-разному. Иногда легко, иногда нет", value: -1 },
                    { text: "Нормально. Засыпаю в течение 15-30 минут", value: 0 },
                    { text: "Легко. Ложусь и через 5-10 минут сплю", value: 1 },
                    { text: "Очень легко. Выключаюсь почти мгновенно", value: 2 },
                    { text: "Я могу войти в сон осознанно и сохранять ясность", value: 3 }
                ]
            },
            {
                text: "Можете ли вы по своему желанию «очистить ум» и войти в состояние внутренней тишины?",
                options: [
                    { text: "Понятия не имею, о чём речь. Это невозможно", value: -3 },
                    { text: "Никогда не пробовал, кажется сложным", value: -2 },
                    { text: "Пробовал, но почти не получается", value: -1 },
                    { text: "Иногда получается на несколько секунд", value: 0 },
                    { text: "Да, могу успокоить ум на минуту-другую", value: 1 },
                    { text: "Да, регулярно практикую и легко вхожу в тишину", value: 2 },
                    { text: "Тишина — моё естественное состояние. Мысли приходят, когда я их зову", value: 3 }
                ]
            },
            {
                text: "Когда вы выполняете монотонную работу (уборка, мытьё посуды, прогулка), где ваши мысли?",
                options: [
                    { text: "Скачут хаотично, я переживаю прошлое или тревожусь о будущем", value: -3 },
                    { text: "Блуждают где-то далеко, я не помню, о чём думал", value: -2 },
                    { text: "Думаю о планах, списках дел, проблемах", value: -1 },
                    { text: "Частично в процессе, частично в мыслях", value: 0 },
                    { text: "В основном сосредоточен на процессе, иногда отвлекаюсь", value: 1 },
                    { text: "Полностью погружён в процесс, мысли текут плавно", value: 2 },
                    { text: "Я и есть этот процесс. Нет разделения на «я» и «действие»", value: 3 }
                ]
            },
            {
                text: "Как часто вы испытываете состояние «потока» — когда время исчезает, а вы полностью слиты с делом?",
                options: [
                    { text: "Никогда. Не знаю, что это", value: -3 },
                    { text: "Крайне редко, наверное раз в год", value: -2 },
                    { text: "Редко, наверное раз в месяц", value: -1 },
                    { text: "Иногда, когда занимаюсь любимым делом", value: 0 },
                    { text: "Часто, несколько раз в неделю", value: 1 },
                    { text: "Очень часто, это мой обычный рабочий режим", value: 2 },
                    { text: "Я постоянно в потоке. Жизнь — это одно сплошное творческое течение", value: 3 }
                ]
            }
        ];
        
        const totalQuestions = questions.length;
        let currentIndex = 0;
        let answers = new Array(totalQuestions).fill(null);
        
        const questionContainer = document.getElementById('questionContainer');
        const prevBtn = document.getElementById('prevBtn');
        const nextBtn = document.getElementById('nextBtn');
        const exitBtn = document.getElementById('exitBtn');
        const progressFill = document.getElementById('progressFill');
        const progressText = document.getElementById('progressText');
        const testContainer = document.getElementById('testContainer');
        const mainBody = document.getElementById('mainBody');
        const testTitle = document.getElementById('testTitle');
        
        let isResultMode = false;
        
        function renderQuestion(index) {
            const q = questions[index];
            let html = `<div class="question-box">`;
            html += `<div class="question-text">${index + 1}. ${q.text}</div>`;
            html += `<div class="options">`;
            
            q.options.forEach((opt, optIndex) => {
                const isSelected = answers[index] === opt.value;
                html += `
                    <div class="option ${isSelected ? 'selected' : ''}" data-value="${opt.value}">
                        <div class="option-marker"></div>
                        <div class="option-text">${opt.text}</div>
                    </div>
                `;
            });
            
            html += `</div></div>`;
            questionContainer.innerHTML = html;
            
            // Вешаем обработчики на опции
            document.querySelectorAll('.option').forEach(opt => {
                opt.addEventListener('click', () => {
                    const value = parseInt(opt.dataset.value);
                    answers[index] = value;
                    renderQuestion(index);
                });
            });
            
            // Обновляем прогресс
            const progress = ((index + 1) / totalQuestions) * 100;
            progressFill.style.width = progress + '%';
            progressText.textContent = `Вопрос ${index + 1} из ${totalQuestions}`;
            
            // Обновляем кнопки
            prevBtn.disabled = index === 0;
            if (index === totalQuestions - 1) {
                nextBtn.textContent = '🎉 Завершить';
            } else {
                nextBtn.textContent = 'Далее →';
            }
        }
        
        function calculateResult() {
            const sum = answers.reduce((acc, val) => acc + val, 0);
            // Максимальная сумма = 7 * 3 = 21, минимальная = -21
            // Cₛ — это значение от 0 до 1. Приводим сумму к этому диапазону
            const normalized = (sum + 21) / 42; // Теперь от 0 до 1
            return Math.round(normalized * 100) / 100; // Два знака после запятой
        }
        
        function getResultColor(cs) {
            if (cs >= 0.9) return '#64b5f6'; // Ярко-голубой (лазер)
            if (cs >= 0.7) return '#42a5f5'; // Голубой
            if (cs >= 0.5) return '#90caf9'; // Светло-голубой
            if (cs >= 0.3) return '#b0bec5'; // Серо-голубой
            if (cs >= 0.1) return '#ffb74d'; // Оранжевый (лампа накаливания)
            return '#ef5350'; // Красный (мигающая лампочка)
        }
        
        function getResultComment(cs) {
            if (cs >= 0.95) {
                return "Вы — ЛАЗЕР. Ваша когерентность близка к идеальной. Вы способны фокусировать Смысл с невероятной силой. Вы на уровне просветлённых мастеров.";
            } else if (cs >= 0.85) {
                return "Вы — лазерная указка. Очень высокая когерентность. Вы легко входите в поток и можете долго удерживать концентрацию. Ваши мысли точны и эффективны.";
            } else if (cs >= 0.70) {
                return "Вы — яркий прожектор. Хорошая когерентность. Вы умеете сосредотачиваться, но иногда «шум» всё же проникает. Регулярная медитация усилит ваш луч.";
            } else if (cs >= 0.55) {
                return "Вы — светодиодная лампа. Средняя когерентность. Вы можете фокусироваться, но часто отвлекаетесь. Тренируйте внимание через монотонные практики (спорт, рисование, уборка).";
            } else if (cs >= 0.40) {
                return "Вы — лампочка накаливания. Когерентность ниже среднего. Ваше внимание рассеяно, мысли скачут. Попробуйте «семантическую диету» — ограничьте соцсети и новости.";
            } else if (cs >= 0.25) {
                return "Вы — тусклая лампочка. Низкая когерентность. Вы постоянно отвлекаетесь, вам трудно завершать дела. Начните с малого: 5 минут полной тишины в день.";
            } else if (cs >= 0.10) {
                return "Вы — мигающая лампочка. Очень низкая когерентность. Ваш ум — это хаос. Вам нужен информационный детокс и, возможно, помощь психолога.";
            } else {
                return "Вы — перегоревшая лампочка. Когерентность на нуле. Вы истощены, возможно, депрессия. Срочно обратитесь за помощью и начните с базового отдыха.";
            }
        }
        
        function getResultAdvice(cs) {
            if (cs >= 0.85) {
                return "💎 Совет: Вы владеете редким даром. Используйте его для творчества, помощи другим и глубоких медитаций. Но не забывайте «заземляться» — гуляйте босиком, работайте руками, чтобы не улететь в астрал.";
            } else if (cs >= 0.70) {
                return "🧘 Совет: Ваша когерентность хороша. Чтобы поднять её выше, практикуйте «однозадачность». Уберите телефон во время еды и работы. Попробуйте медитацию с концентрацией на пламени свечи (10 минут в день).";
            } else if (cs >= 0.55) {
                return "📵 Совет: Ваше внимание «плавает». Введите правило: за 1 час до сна — никаких экранов. Читайте бумажные книги. Слушайте музыку без слов (эмбиент, классика). Это снизит S_noise.";
            } else if (cs >= 0.40) {
                return "🚫 Совет: Вы перегружены информацией. Устройте себе «цифровой шаббат» — один день в неделю без интернета и соцсетей. Гуляйте в парке, смотрите на воду или огонь. Это перезагрузит ваше поле.";
            } else if (cs >= 0.25) {
                return "🧹 Совет: Начните с наведения порядка. Разберите рабочий стол, удалите ненужные файлы и приложения. Внешний порядок помогает внутреннему. Попробуйте дыхательную практику «4-7-8» (вдох 4с, задержка 7с, выдох 8с) 5 раз в день.";
            } else {
                return "🆘 Совет: Ваш ум истощён. Вам нужен полный покой и тишина. Попросите близких о помощи в бытовых делах. Спите не менее 8 часов. Исключите кофеин и алкоголь. Обратитесь к психотерапевту — это не стыдно, это забота о себе.";
            }
        }
        
        function showResult() {
            isResultMode = true;
            const cs = calculateResult();
            const color = getResultColor(cs);
            const comment = getResultComment(cs);
            const advice = getResultAdvice(cs);
            
            // Меняем фон body
            mainBody.style.background = `linear-gradient(145deg, ${color}20 0%, #16213e 100%)`;
            testContainer.style.borderColor = color;
            
            let html = `<div class="result-container">`;
            html += `<h2 style="color: ${color};">Ваш результат</h2>`;
            html += `<div class="result-score" style="color: ${color};">${cs.toFixed(2)}</div>`;
            html += `<div class="result-scale">по шкале Cₛ (от 0 до 1)</div>`;
            html += `<div class="result-comment" style="color: #d0c8b8;">${comment}</div>`;
            html += `<div class="result-advice" style="color: #d0c8b8;">${advice}</div>`;
            html += `<p style="margin-top: 1.5rem; color: #a09080; font-style: italic;">Помните: когерентность тренируется. Как мышца. Регулярные практики творят чудеса.</p>`;
            html += `</div>`;
            
            questionContainer.innerHTML = html;
            
            // Скрываем навигацию
            prevBtn.classList.add('hidden');
            nextBtn.classList.add('hidden');
            exitBtn.textContent = '🔄 Пройти заново';
            exitBtn.classList.remove('btn-secondary');
            exitBtn.classList.add('btn');
            
            // Меняем заголовок
            testTitle.textContent = `Результат: Cₛ = ${cs.toFixed(2)}`;
            progressText.textContent = `Тест завершён`;
            
// --- СОХРАНЕНИЕ В ПАСПОРТ (УНИВЕРСАЛЬНЫЙ БЛОК + ИСТОРИЯ) ---
setTimeout(function() {
    const passportBtn = document.createElement('button');
    passportBtn.textContent = '💾 Сохранить результат в Семантический Паспорт';
    passportBtn.style.cssText = 'display: block; margin: 2rem auto; padding: 1rem 2rem; background: #64b5f6; color: #1a1a2e; border: none; border-radius: 40px; font-size: 1rem; cursor: pointer; font-weight: bold; transition: 0.3s;';
    passportBtn.onmouseover = () => passportBtn.style.background = '#2196f3';
    passportBtn.onmouseout = () => passportBtn.style.background = '#64b5f6';

    passportBtn.addEventListener('click', function() {
        const scoreElement = document.querySelector('.result-score');
        if (scoreElement) {
            const resultValue = parseFloat(scoreElement.textContent);
            if (!isNaN(resultValue)) {
                // 1. Сохраняем для Паспорта (как раньше)
                localStorage.setItem('ideatonika_test_cs', resultValue);
                // 2. Сохраняем в историю (НОВОЕ!)
                saveToHistory('cs_history', resultValue);
                
                passportBtn.textContent = '✅ Сохранено в Паспорт!';
                passportBtn.style.background = '#1565c0';
                passportBtn.style.color = 'white';
                passportBtn.disabled = true;
            }
        }
    });

    const container = document.querySelector('.result-container') || document.getElementById('questionContainer');
    if (container) {
        container.appendChild(passportBtn);
    }
}, 100);

// Функция сохранения истории (НОВАЯ!)
function saveToHistory(historyKey, value) {
    const raw = localStorage.getItem(historyKey);
    const history = raw ? JSON.parse(raw) : [];
    history.push({
        date: new Date().toISOString().split('T')[0],
        value: value
    });
    localStorage.setItem(historyKey, JSON.stringify(history));
}

// ========== КНОПКА "ПОДЕЛИТЬСЯ РЕЗУЛЬТАТОМ" ==========
setTimeout(function() {
    const shareContainer = document.createElement('div');
    shareContainer.style.cssText = 'text-align: center; margin-top: 1.5rem;';

    const shareBtn = document.createElement('button');
    shareBtn.textContent = '📤 Поделиться результатом';
    shareBtn.style.cssText = 'display: block; margin: 0 auto 0.8rem auto; padding: 0.8rem 2rem; background: transparent; color: #81c784; border: 1.5px solid #81c784; border-radius: 40px; font-size: 1rem; cursor: pointer; font-weight: bold; transition: 0.3s; font-family: Georgia, serif;';
    shareBtn.onmouseover = () => shareBtn.style.background = '#81c784';
    shareBtn.onmouseout = () => shareBtn.style.background = 'transparent';
    shareBtn.onmouseover = () => shareBtn.style.color = '#1a1a2e';
    shareBtn.onmouseout = () => shareBtn.style.color = '#81c784';

    shareBtn.addEventListener('click', function() {
        // Получаем название теста из заголовка страницы
        const testName = document.title.replace(' • Идеатоника', '').trim();
        
        // Получаем результат из элемента .result-score
        const scoreElement = document.querySelector('.result-score');
        let resultText = '';
        if (scoreElement) {
            resultText = scoreElement.textContent.trim();
        }
        
        // Получаем комментарий из элемента .result-comment или .result-interpretation
        const commentElement = document.querySelector('.result-comment') || document.querySelector('.result-interpretation');
        let commentText = '';
        if (commentElement) {
            commentText = commentElement.textContent.trim();
        }
        
        // Формируем текст для отправки
        const shareText = `🧪 Я прошёл тест «${testName}» на портале Идеатоника!\n\n` +
            `📊 Мой результат: ${resultText}\n` +
            `💬 ${commentText}\n\n` +
            `🎯 А какой результат у тебя?\n` +
            `👉 Пройти тест: ${window.location.href}\n\n` +
            `🌌 Идеатоника — физика смысла.`;
        
        // Пытаемся использовать Web Share API (мобильные устройства)
        if (navigator.share) {
            navigator.share({
                title: `Мой результат теста «${testName}»`,
                text: shareText,
                url: window.location.href
            }).catch(() => {
                // Если не получилось — копируем в буфер
                copyToClipboard(shareText);
            });
        } else {
            // Если Web Share API не поддерживается — копируем в буфер
            copyToClipboard(shareText);
        }
    });

    function copyToClipboard(text) {
        if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(text).then(() => {
                const originalText = shareBtn.textContent;
                shareBtn.textContent = '✅ Скопировано! Отправь другу';
                shareBtn.style.borderColor = '#ffd54f';
                shareBtn.style.color = '#ffd54f';
                setTimeout(() => {
                    shareBtn.textContent = originalText;
                    shareBtn.style.borderColor = '#81c784';
                    shareBtn.style.color = '#81c784';
                }, 2500);
            }).catch(() => {
                fallbackCopy(text);
            });
        } else {
            fallbackCopy(text);
        }
    }

    function fallbackCopy(text) {
        const textarea = document.createElement('textarea');
        textarea.value = text;
        textarea.style.position = 'fixed';
        textarea.style.left = '-9999px';
        document.body.appendChild(textarea);
        textarea.select();
        try {
            document.execCommand('copy');
            const originalText = shareBtn.textContent;
            shareBtn.textContent = '✅ Скопировано! Отправь другу';
            shareBtn.style.borderColor = '#ffd54f';
            shareBtn.style.color = '#ffd54f';
            setTimeout(() => {
                shareBtn.textContent = originalText;
                shareBtn.style.borderColor = '#81c784';
                shareBtn.style.color = '#81c784';
            }, 2500);
        } catch(e) {
            shareBtn.textContent = '❌ Не удалось скопировать';
            shareBtn.style.borderColor = '#ef5350';
            shareBtn.style.color = '#ef5350';
        }
        document.body.removeChild(textarea);
    }

    // Добавляем подсказку
    const hint = document.createElement('div');
    hint.style.cssText = 'color: #a09080; font-size: 0.8rem; font-style: italic;';
    hint.textContent = 'Нажмите, чтобы скопировать результат и отправить другу';
    shareContainer.appendChild(shareBtn);
    shareContainer.appendChild(hint);

    // Ищем контейнер с результатом
    const container = document.querySelector('.result-container') || document.getElementById('questionContainer');
    if (container) {
        container.appendChild(shareContainer);
    }
}, 100);

        }
        
        function resetTest() {
            isResultMode = false;
            currentIndex = 0;
            answers = new Array(totalQuestions).fill(null);
            
            // Сбрасываем стили
            mainBody.style.background = '';
            testContainer.style.borderColor = '';
            testTitle.textContent = 'Лазер или Лампочка?';
            
            // Восстанавливаем кнопки
            prevBtn.classList.remove('hidden');
            nextBtn.classList.remove('hidden');
            exitBtn.textContent = '🚪 Выйти';
            exitBtn.classList.add('btn-secondary');
            
            renderQuestion(0);
        }
        
        // Обработчики
        prevBtn.addEventListener('click', () => {
            if (currentIndex > 0) {
                currentIndex--;
                renderQuestion(currentIndex);
            }
        });
        
        nextBtn.addEventListener('click', () => {
            if (answers[currentIndex] === null) {
                alert('Пожалуйста, выберите один из вариантов ответа.');
                return;
            }
            
            if (currentIndex < totalQuestions - 1) {
                currentIndex++;
                renderQuestion(currentIndex);
            } else {
                if (answers.includes(null)) {
                    alert('Пожалуйста, ответьте на все вопросы.');
                    return;
                }
                showResult();
            }
        });
        
        exitBtn.addEventListener('click', () => {
            if (isResultMode) {
                resetTest();
            } else {
                if (confirm('Вы уверены, что хотите выйти? Прогресс будет потерян.')) {
                    window.location.href = 'diagnostics-hub.html';
                }
            }
        });
        
        // Запуск
        renderQuestion(0);
    })();
</script>
