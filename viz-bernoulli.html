<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Эффект Бернулли • Идеатоника</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: linear-gradient(145deg, #0d1117 0%, #161b22 100%);
            min-height: 100vh;
            font-family: 'Georgia', 'Times New Roman', serif;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            padding: 1rem; overflow-x: hidden;
        }
        .stars-bg { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 0; }
        .star { position: absolute; background: white; border-radius: 50%; animation: twinkle var(--duration) ease-in-out infinite; animation-delay: var(--delay); opacity: 0; }
        @keyframes twinkle { 0%,100% { opacity:0.2; transform:scale(1); } 50% { opacity:1; transform:scale(1.8); } }
        .main-container {
            position: relative; z-index: 1; width: 100%; max-width: 1100px;
            background: rgba(22,27,34,0.85); backdrop-filter: blur(12px);
            border: 1px solid rgba(227,184,124,0.3); border-radius: 32px;
            padding: 2rem; box-shadow: 0 20px 40px rgba(0,0,0,0.6);
        }
        .header { text-align: center; margin-bottom: 1.5rem; }
        .header h1 { font-size: 2.5rem; font-weight: 400; letter-spacing: 3px; color: #f3e7c0; text-shadow: 0 0 20px rgba(255,215,80,0.4); margin-bottom: 0.3rem; }
        .header .subtitle { font-size: 1rem; color: #c0b090; font-style: italic; border-bottom: 1px solid #5d4a3a; display: inline-block; padding-bottom: 0.4rem; }
        .canvas-wrapper { position: relative; width: 100%; background: radial-gradient(ellipse at center, #1a2030 0%, #0a0e14 100%); border-radius: 20px; border: 1px solid #5d4a3a; overflow: hidden; margin-bottom: 1.5rem; box-shadow: inset 0 0 80px rgba(0,0,0,0.5); }
        canvas { display: block; width: 100%; height: auto; }
        .controls-panel { background: rgba(0,0,0,0.3); border: 1px solid #5d4a3a; border-radius: 20px; padding: 1.5rem 2rem; }
        .controls-title { font-size: 1.2rem; color: #ffd54f; margin-bottom: 1.2rem; text-align: center; letter-spacing: 1px; }
        .slider-group { margin-bottom: 1.2rem; }
        .slider-group label { display: flex; justify-content: space-between; align-items: center; color: #d0c8b8; font-size: 0.95rem; margin-bottom: 0.4rem; }
        .slider-group label .param-value { color: #ffd54f; font-weight: bold; font-size: 1.1rem; min-width: 50px; text-align: right; }
        .slider-group input[type="range"] { width: 100%; -webkit-appearance: none; height: 8px; background: linear-gradient(90deg, #3a2a4a, #5d4a3a, #3a2a4a); border-radius: 4px; outline: none; cursor: pointer; }
        .slider-group input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; width: 24px; height: 24px; background: radial-gradient(circle at 40% 40%, #ffe082, #ff8f00); border-radius: 50%; cursor: pointer; box-shadow: 0 0 15px rgba(255,215,80,0.6); border: 2px solid #ffd54f; }
        .range-labels { display: flex; justify-content: space-between; color: #706858; font-size: 0.75rem; margin-top: 0.2rem; }
        .info-box { margin-top: 1.5rem; padding: 1rem 1.5rem; background: rgba(255,215,80,0.05); border: 1px solid rgba(255,215,80,0.2); border-radius: 12px; text-align: center; color: #c0b090; font-size: 0.9rem; font-style: italic; }
        .info-box .formula-display { font-family: 'Courier New', monospace; color: #ffd54f; font-size: 1rem; margin: 0.3rem 0; }
        .back-row { text-align: center; margin-top: 1.5rem; }
        .back-link { display: inline-block; color: #ffd54f; text-decoration: none; border: 1px solid #ffd54f; padding: 0.6rem 1.5rem; border-radius: 30px; transition: 0.3s; font-size: 0.9rem; }
        .back-link:hover { background: #ffd54f; color: #0d1117; }
        @media (max-width: 700px) { .main-container { padding: 1rem; } .header h1 { font-size: 1.8rem; } .controls-panel { padding: 1rem; } }
    </style>
</head>
<body>
<div class="stars-bg" id="starsBg"></div>
<div class="main-container">
    <div class="header">
        <h1>💨 Эффект Бернулли</h1>
        <div class="subtitle">Визуализация §117: ускорение Qₛ в сужении, падение давления</div>
    </div>
    <div class="canvas-wrapper" id="canvasWrapper">
        <canvas id="bernoulliCanvas"></canvas>
    </div>
    <div class="controls-panel">
        <div class="controls-title">🎛️ Параметры</div>
        <div class="slider-group">
            <label><span>📏 Ширина сужения</span><span class="param-value" id="widthValue">30%</span></label>
            <input type="range" id="widthSlider" min="10" max="100" value="30" step="1">
            <div class="range-labels"><span>10% (очень узко)</span><span>50%</span><span>100% (нет сужения)</span></div>
        </div>
        <div class="slider-group">
            <label><span>⚡ Скорость потока на входе</span><span class="param-value" id="speedValue">1.0</span></label>
            <input type="range" id="inSpeedSlider" min="0.3" max="3" value="1" step="0.1">
            <div class="range-labels"><span>0.3 (медленно)</span><span>1.0</span><span>3.0 (быстро)</span></div>
        </div>
        <div class="slider-group">
            <label><span>☀️ Семантический заряд Qₛ</span><span class="param-value" id="qsValue">+5</span></label>
            <input type="range" id="qsSlider" min="-10" max="10" value="5" step="1">
            <div class="range-labels"><span>-10 (Тьма)</span><span>0</span><span>+10 (Свет)</span></div>
        </div>
        <div class="info-box">
            <span id="statusText" style="color:#ffd54f;font-weight:bold;">💨 Поток ускоряется в сужении</span>
            <div class="formula-display" id="formulaDisplay"></div>
        </div>
    </div>
    <div class="back-row">
        <a href="visualizations.html" class="back-link">← К списку визуализаций</a>
    </div>
</div>

<script>
(function(){
    const starsBg=document.getElementById('starsBg');
    for(let i=0;i<100;i++){
        const d=document.createElement('div');d.className='star';
        d.style.left=Math.random()*100+'%';d.style.top=Math.random()*100+'%';
        const s=Math.random()*2.5+0.5;d.style.width=s+'px';d.style.height=s+'px';
        d.style.setProperty('--duration',(Math.random()*4+2)+'s');
        d.style.setProperty('--delay',(Math.random()*5)+'s');
        starsBg.appendChild(d);
    }
})();

const canvas=document.getElementById('bernoulliCanvas');
const ctx=canvas.getContext('2d');
const wrapper=document.getElementById('canvasWrapper');
let time=0,animId;

let particles=[];
const NUM_PARTICLES=80;

function resize(){
    const r=wrapper.getBoundingClientRect();
    canvas.width=r.width;
    canvas.height=Math.max(450,Math.min(600,r.width*0.6));
    wrapper.style.height=canvas.height+'px';
    initParticles();
}
function initParticles(){
    particles=[];
    const w=canvas.width,h=canvas.height;
    for(let i=0;i<NUM_PARTICLES;i++){
        particles.push({
            x:-50-Math.random()*200,
            y:h*0.2+Math.random()*h*0.6,
            speed:0,
            baseY:0
        });
    }
}
resize();window.addEventListener('resize',resize);

const widthSlider=document.getElementById('widthSlider');
const inSpeedSlider=document.getElementById('inSpeedSlider');
const qsSlider=document.getElementById('qsSlider');
const widthValue=document.getElementById('widthValue');
const speedValue=document.getElementById('speedValue');
const qsValue=document.getElementById('qsValue');
const statusText=document.getElementById('statusText');
const formulaDisplay=document.getElementById('formulaDisplay');

widthSlider.oninput=function(){
    widthValue.textContent=this.value+'%';
    updateInfo();
};
inSpeedSlider.oninput=function(){
    speedValue.textContent=parseFloat(this.value).toFixed(1);
    updateInfo();
};
qsSlider.oninput=function(){
    qsValue.textContent=(parseInt(this.value)>=0?'+':'')+parseInt(this.value);
};

function updateInfo(){
    const narrowPct=parseInt(widthSlider.value)/100;
    const inSpeed=parseFloat(inSpeedSlider.value);
    if(narrowPct<0.15) statusText.textContent='💨 Сильное ускорение — давление резко падает!';
    else if(narrowPct<0.4) statusText.textContent='💨 Поток ускоряется в сужении';
    else if(narrowPct<0.8) statusText.textContent='🌊 Лёгкое ускорение';
    else statusText.textContent='🟰 Равномерный поток — нет сужения';
    
    const speedRatio=1/narrowPct;
    const pressureRatio=1/(speedRatio*speedRatio);
    formulaDisplay.textContent='P₁+½ρv₁²=P₂+½ρv₂² | v₂≈'+speedRatio.toFixed(1)+'·v₁ | P₂≈'+pressureRatio.toFixed(2)+'·P₁';
}
updateInfo();

function getQSColor(qs,alpha){
    const norm=(qs+10)/20;
    const r=Math.floor(30+norm*225);
    const g=Math.floor(5+norm*235);
    const b=Math.floor(80*(1-norm)+255*norm);
    return `rgba(${r},${g},${b},${alpha})`;
}

function getPressureColor(pressure,alpha){
    // Высокое давление = тёплый, низкое = холодный
    const t=Math.max(0,Math.min(1,pressure));
    const r=Math.floor(50+t*200);
    const g=Math.floor(180*(1-t)+50*t);
    const b=Math.floor(220*(1-t)+30*t);
    return `rgba(${r},${g},${b},${alpha})`;
}

function drawFrame(){
    const narrowPct=parseInt(widthSlider.value)/100;
    const inSpeed=parseFloat(inSpeedSlider.value);
    const qs=parseInt(qsSlider.value);
    const w=canvas.width,h=canvas.height;
    
    time+=0.016;
    
    // Очистка
    ctx.fillStyle='#060a10';
    ctx.fillRect(0,0,w,h);
    
    // Параметры трубы
    const tubeY=h*0.25;
    const tubeH=h*0.5;
    const tubeCenterY=h/2;
    
    // Зона сужения
    const narrowStart=w*0.35;
    const narrowEnd=w*0.65;
    const narrowWidth=tubeH*narrowPct;
    const narrowY=tubeCenterY-narrowWidth/2;
    
    // Рисуем трубу
    ctx.fillStyle='rgba(40,35,30,0.8)';
    ctx.strokeStyle='rgba(255,255,255,0.4)';
    ctx.lineWidth=2;
    
    // Верхняя стенка
    ctx.beginPath();
    ctx.moveTo(0,tubeY);
    ctx.lineTo(narrowStart,tubeY);
    ctx.lineTo(narrowStart,narrowY);
    ctx.lineTo(narrowEnd,narrowY);
    ctx.lineTo(narrowEnd,tubeY);
    ctx.lineTo(w,tubeY);
    ctx.lineTo(w,0);
    ctx.lineTo(0,0);
    ctx.closePath();
    ctx.fill();
    
    // Нижняя стенка
    ctx.beginPath();
    ctx.moveTo(0,tubeY+tubeH);
    ctx.lineTo(narrowStart,tubeY+tubeH);
    ctx.lineTo(narrowStart,narrowY+narrowWidth);
    ctx.lineTo(narrowEnd,narrowY+narrowWidth);
    ctx.lineTo(narrowEnd,tubeY+tubeH);
    ctx.lineTo(w,tubeY+tubeH);
    ctx.lineTo(w,h);
    ctx.lineTo(0,h);
    ctx.closePath();
    ctx.fill();
    
    // Контур трубы
    ctx.strokeStyle='rgba(255,255,255,0.5)';
    ctx.beginPath();
    ctx.moveTo(0,tubeY);
    ctx.lineTo(narrowStart,tubeY);
    ctx.lineTo(narrowStart,narrowY);
    ctx.lineTo(narrowEnd,narrowY);
    ctx.lineTo(narrowEnd,tubeY);
    ctx.lineTo(w,tubeY);
    ctx.stroke();
    
    ctx.beginPath();
    ctx.moveTo(0,tubeY+tubeH);
    ctx.lineTo(narrowStart,tubeY+tubeH);
    ctx.lineTo(narrowStart,narrowY+narrowWidth);
    ctx.lineTo(narrowEnd,narrowY+narrowWidth);
    ctx.lineTo(narrowEnd,tubeY+tubeH);
    ctx.lineTo(w,tubeY+tubeH);
    ctx.stroke();
    
    // Обновление частиц
    for(const p of particles){
        // Определяем, в какой зоне частица
        let localSpeed=inSpeed;
        let localWidth=tubeH;
        
        if(p.x>=narrowStart&&p.x<=narrowEnd){
            localWidth=narrowWidth;
            localSpeed=inSpeed*(tubeH/localWidth);
        }
        
        p.speed=localSpeed;
        p.x+=p.speed*1.5;
        
        // Если вышла за экран — возвращаем слева
        if(p.x>w+50){
            p.x=-50-Math.random()*100;
            p.y=tubeY+10+Math.random()*(localWidth-20);
            p.baseY=p.y;
        }
        
        // Плавное следование за трубой
        const currentWidth=(p.x>=narrowStart&&p.x<=narrowEnd)?narrowWidth:tubeH;
        const currentY=(p.x>=narrowStart&&p.x<=narrowEnd)?narrowY:tubeY;
        const targetY=currentY+10+Math.random()*(currentWidth-20);
        p.baseY+=(targetY-p.baseY)*0.1;
        p.y=p.baseY+Math.sin(p.x*0.03+time*3)*3;
    }
    
    // Рисуем частицы
    for(const p of particles){
        const inNarrow=(p.x>=narrowStart&&p.x<=narrowEnd);
        const pressure=inNarrow?0.3:1.0;
        const alpha=0.5+0.3*(p.speed/inSpeed);
        const size=1+2*(p.speed/inSpeed);
        
        // Частицы окрашены в Qₛ, но с оттенком давления
        const qsAlpha=0.7;
        const pressureAlpha=0.3;
        
        ctx.fillStyle=getQSColor(qs,qsAlpha*alpha);
        ctx.beginPath();ctx.arc(p.x,p.y,size,0,Math.PI*2);ctx.fill();
        
        // Поверх — цвет давления
        ctx.fillStyle=getPressureColor(pressure,pressureAlpha*alpha);
        ctx.beginPath();ctx.arc(p.x,p.y,size,0,Math.PI*2);ctx.fill();
    }
    
    // Стрелки скорости
    const arrowY=narrowY-25;
    ctx.fillStyle='rgba(255,255,255,0.6)';
    ctx.font='16px Georgia,serif';
    ctx.textAlign='center';
    
    // До сужения
    ctx.fillText('→ v₁='+inSpeed.toFixed(1),w*0.15,arrowY);
    // В сужении
    const narrowSpeed=inSpeed*(tubeH/narrowWidth);
    ctx.fillText('→→→ v₂='+narrowSpeed.toFixed(1),w*0.5,arrowY);
    // После
    ctx.fillText('→ v₁='+inSpeed.toFixed(1),w*0.82,arrowY);
    
    // Подписи давления
    ctx.fillText('P₁ (норма)',w*0.15,tubeY-8);
    ctx.fillText('P₂ (низкое!)',w*0.5,narrowY-8);
    ctx.fillText('P₁ (норма)',w*0.82,tubeY-8);
    
    // График скорости внизу
    const graphY=tubeY+tubeH+30;
    const graphH=60;
    ctx.strokeStyle='rgba(255,255,255,0.2)';
    ctx.beginPath();ctx.moveTo(0,graphY);ctx.lineTo(w,graphY);ctx.stroke();
    ctx.fillStyle='rgba(255,255,255,0.4)';
    ctx.font='12px Georgia,serif';
    ctx.textAlign='center';
    ctx.fillText('v(x)',w/2,graphY-8);
    
    ctx.strokeStyle='#ff9800';
    ctx.lineWidth=2;
    ctx.beginPath();
    for(let x=0;x<w;x+=4){
        let localV=inSpeed;
        if(x>=narrowStart&&x<=narrowEnd) localV=inSpeed*(tubeH/narrowWidth);
        const vx=x;
        const vy=graphY-localV*10;
        if(x===0) ctx.moveTo(vx,vy);
        else ctx.lineTo(vx,vy);
    }
    ctx.stroke();
    ctx.fillStyle='#ff9800';
    ctx.fillText('v(x)',w-40,graphY-15);
    
    animId=requestAnimationFrame(drawFrame);
}

drawFrame();
window.addEventListener('beforeunload',()=>{if(animId)cancelAnimationFrame(animId);});
</script>

</body>
</html>
