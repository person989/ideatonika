<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Семантическая Гравитация • Идеатоника</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: linear-gradient(145deg, #0d1117 0%, #161b22 100%);
            min-height: 100vh;
            font-family: 'Georgia', 'Times New Roman', serif;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            padding: 1rem; overflow-x: hidden;
        }
        .stars-bg { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 0; }
        .star { position: absolute; background: white; border-radius: 50%; animation: twinkle var(--duration) ease-in-out infinite; animation-delay: var(--delay); opacity: 0; }
        @keyframes twinkle { 0%,100% { opacity:0.2; transform:scale(1); } 50% { opacity:1; transform:scale(1.8); } }
        .main-container {
            position: relative; z-index: 1; width: 100%; max-width: 1100px;
            background: rgba(22,27,34,0.85); backdrop-filter: blur(12px);
            border: 1px solid rgba(227,184,124,0.3); border-radius: 32px;
            padding: 2rem; box-shadow: 0 20px 40px rgba(0,0,0,0.6);
        }
        .header { text-align: center; margin-bottom: 1.5rem; }
        .header h1 { font-size: 2.5rem; font-weight: 400; letter-spacing: 3px; color: #f3e7c0; text-shadow: 0 0 20px rgba(255,215,80,0.4); margin-bottom: 0.3rem; }
        .header .subtitle { font-size: 1rem; color: #c0b090; font-style: italic; border-bottom: 1px solid #5d4a3a; display: inline-block; padding-bottom: 0.4rem; }
        .canvas-wrapper { position: relative; width: 100%; background: radial-gradient(ellipse at center, #1a2030 0%, #0a0e14 100%); border-radius: 20px; border: 1px solid #5d4a3a; overflow: hidden; margin-bottom: 1.5rem; box-shadow: inset 0 0 80px rgba(0,0,0,0.5); }
        canvas { display: block; width: 100%; height: auto; }
        .controls-panel { background: rgba(0,0,0,0.3); border: 1px solid #5d4a3a; border-radius: 20px; padding: 1.5rem 2rem; }
        .controls-title { font-size: 1.2rem; color: #ffd54f; margin-bottom: 1.2rem; text-align: center; letter-spacing: 1px; }
        .slider-group { margin-bottom: 1.2rem; }
        .slider-group label { display: flex; justify-content: space-between; align-items: center; color: #d0c8b8; font-size: 0.95rem; margin-bottom: 0.4rem; }
        .slider-group label .param-value { color: #ffd54f; font-weight: bold; font-size: 1.1rem; min-width: 50px; text-align: right; }
        .slider-group input[type="range"] { width: 100%; -webkit-appearance: none; height: 8px; background: linear-gradient(90deg, #3a2a4a, #5d4a3a, #3a2a4a); border-radius: 4px; outline: none; cursor: pointer; }
        .slider-group input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; width: 24px; height: 24px; background: radial-gradient(circle at 40% 40%, #ffe082, #ff8f00); border-radius: 50%; cursor: pointer; box-shadow: 0 0 15px rgba(255,215,80,0.6); border: 2px solid #ffd54f; }
        .range-labels { display: flex; justify-content: space-between; color: #706858; font-size: 0.75rem; margin-top: 0.2rem; }
        .info-box { margin-top: 1.5rem; padding: 1rem 1.5rem; background: rgba(255,215,80,0.05); border: 1px solid rgba(255,215,80,0.2); border-radius: 12px; text-align: center; color: #c0b090; font-size: 0.9rem; font-style: italic; }
        .info-box .formula-display { font-family: 'Courier New', monospace; color: #ffd54f; font-size: 1rem; margin: 0.3rem 0; }
        .back-row { text-align: center; margin-top: 1.5rem; }
        .back-link { display: inline-block; color: #ffd54f; text-decoration: none; border: 1px solid #ffd54f; padding: 0.6rem 1.5rem; border-radius: 30px; transition: 0.3s; font-size: 0.9rem; }
        .back-link:hover { background: #ffd54f; color: #0d1117; }
        @media (max-width: 700px) { .main-container { padding: 1rem; } .header h1 { font-size: 1.8rem; } .controls-panel { padding: 1rem; } }
    </style>
</head>
<body>
<div class="stars-bg" id="starsBg"></div>
<div class="main-container">
    <div class="header">
        <h1>⚖️ Семантическая Гравитация</h1>
        <div class="subtitle">Визуализация Эксперимента №41 и §53: Qₛ против гравитации</div>
    </div>
    <div class="canvas-wrapper" id="canvasWrapper">
        <canvas id="gravityCanvas"></canvas>
    </div>
    <div class="controls-panel">
        <div class="controls-title">🎛️ Параметры</div>
        <div class="slider-group">
            <label><span>☀️ Qₛ правого предмета</span><span class="param-value" id="qsValue">+5</span></label>
            <input type="range" id="qsSlider" min="-10" max="10" value="5" step="0.5">
            <div class="range-labels"><span>-10 (Тьма, тяжелеет)</span><span>0</span><span>+10 (Свет, левитирует)</span></div>
        </div>
        <div class="slider-group">
            <label><span>🎯 Когерентность предмета Cₛ</span><span class="param-value" id="csValue">0.70</span></label>
            <input type="range" id="csSlider" min="0.1" max="1" value="0.7" step="0.01">
            <div class="range-labels"><span>0.1 (хаотичный)</span><span>1.0 (лазерный)</span></div>
        </div>
        <div class="slider-group">
            <label><span>🛡️ Сопротивление среды R_sense</span><span class="param-value" id="rValue">1.0 (воздух)</span></label>
            <input type="range" id="rSlider" min="0.1" max="5" value="1" step="0.1">
            <div class="range-labels"><span>0.1 (храм)</span><span>1 (воздух)</span><span>5 (бетон)</span></div>
        </div>
        <div class="info-box">
            <span id="statusText" style="color:#ffd54f;font-weight:bold;">⚖️ Предмет слегка парит</span>
            <div class="formula-display" id="formulaDisplay"></div>
        </div>
    </div>
    <div class="back-row">
        <a href="visualizations.html" class="back-link">← К списку визуализаций</a>
    </div>
</div>

<script>
(function(){
    const starsBg=document.getElementById('starsBg');
    for(let i=0;i<100;i++){
        const d=document.createElement('div');d.className='star';
        d.style.left=Math.random()*100+'%';d.style.top=Math.random()*100+'%';
        const s=Math.random()*2.5+0.5;d.style.width=s+'px';d.style.height=s+'px';
        d.style.setProperty('--duration',(Math.random()*4+2)+'s');
        d.style.setProperty('--delay',(Math.random()*5)+'s');
        starsBg.appendChild(d);
    }
})();

const canvas=document.getElementById('gravityCanvas');
const ctx=canvas.getContext('2d');
const wrapper=document.getElementById('canvasWrapper');
let time=0,animId;

function resize(){
    const r=wrapper.getBoundingClientRect();
    canvas.width=r.width;
    canvas.height=Math.max(500,Math.min(650,r.width*0.7));
    wrapper.style.height=canvas.height+'px';
}
resize();window.addEventListener('resize',resize);

const qsSlider=document.getElementById('qsSlider');
const csSlider=document.getElementById('csSlider');
const rSlider=document.getElementById('rSlider');
const qsValue=document.getElementById('qsValue');
const csValue=document.getElementById('csValue');
const rValue=document.getElementById('rValue');
const statusText=document.getElementById('statusText');
const formulaDisplay=document.getElementById('formulaDisplay');

qsSlider.oninput=function(){
    const q=parseFloat(this.value);
    qsValue.textContent=(q>=0?'+':'')+q.toFixed(1);
    updateInfo();
};
csSlider.oninput=function(){csValue.textContent=parseFloat(this.value).toFixed(2);updateInfo();};
rSlider.oninput=function(){
    const r=parseFloat(this.value);
    if(r<0.3) rValue.textContent=r.toFixed(1)+' (храм)';
    else if(r<1.5) rValue.textContent=r.toFixed(1)+' (воздух)';
    else rValue.textContent=r.toFixed(1)+' (бетон)';
    updateInfo();
};

function updateInfo(){
    const qs=parseFloat(qsSlider.value);
    const cs=parseFloat(csSlider.value);
    const r=parseFloat(rSlider.value);
    
    const effectiveQ=qs*cs/r;
    
    if(effectiveQ>8) statusText.textContent='🚀 СИЛЬНАЯ ЛЕВИТАЦИЯ — предмет взлетает!';
    else if(effectiveQ>4) statusText.textContent='🕊️ Заметная левитация — предмет парит';
    else if(effectiveQ>1) statusText.textContent='⚖️ Лёгкое парение — предмет чуть легче';
    else if(effectiveQ>-1) statusText.textContent='⚖️ Равновесие — вес не меняется';
    else if(effectiveQ>-4) statusText.textContent='🏋️ Предмет тяжелеет — тянет вниз';
    else statusText.textContent='🪨 СИЛЬНОЕ УТЯЖЕЛЕНИЕ — предмет как камень';
    
    formulaDisplay.textContent='g_eff=g — g_sem | g_sem≈Qₛ·Cₛ/R='+qs.toFixed(1)+'·'+cs.toFixed(2)+'/'+r.toFixed(1)+'='+effectiveQ.toFixed(1);
}
updateInfo();

function getQSColor(qs,alpha){
    const absQ=Math.abs(qs);
    const norm=Math.min(1,absQ/10);
    if(absQ<0.5){const g=Math.floor(100*norm+30);return `rgba(${g},${g},${g},${alpha*0.3})`;}
    if(qs>=0){const r=Math.floor(30+norm*225);const g=Math.floor(5+norm*235);const b=Math.floor(80*(1-norm)+255*norm);return `rgba(${r},${g},${b},${alpha})`;}
    else{const r=Math.floor(80*(1-norm)+30*norm);const g=Math.floor(40*(1-norm)+5*norm);const b=Math.floor(30+norm*200);return `rgba(${r},${g},${b},${alpha})`;}
}

function drawFrame(){
    const qs=parseFloat(qsSlider.value);
    const cs=parseFloat(csSlider.value);
    const r=parseFloat(rSlider.value);
    const w=canvas.width,h=canvas.height;
    time+=0.016;
    
    const effectiveQ=qs*cs/r;
    const liftOffset=-effectiveQ*8;
    const clampedLift=Math.max(-80,Math.min(80,liftOffset));
    
    // Очистка
    ctx.fillStyle='#060a10';
    ctx.fillRect(0,0,w,h);
    
    // Сетка
    ctx.strokeStyle='rgba(255,255,255,0.02)';ctx.lineWidth=1;
    for(let x=0;x<w;x+=50){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,h);ctx.stroke();}
    for(let y=0;y<h;y+=50){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(w,y);ctx.stroke();}
    
    // Весы
const balanceX=w/2,balanceY=h*0.2;
const armLength=w*0.18;
const maxTilt=0.4;
// При положительном effectiveQ правая чаша ПОДНИМАЕТСЯ (левитация)
const tilt=Math.max(-maxTilt,Math.min(maxTilt,-effectiveQ*0.04));

// Основание
const baseW=60,baseH=30;
ctx.fillStyle='#5d4037';
ctx.beginPath();ctx.roundRect(balanceX-baseW/2,balanceY+armLength+30,baseW,baseH,6);ctx.fill();
ctx.fillStyle='#4a3728';
ctx.beginPath();ctx.roundRect(balanceX-15,balanceY+armLength,30,40,4);ctx.fill();

// Точка опоры (треугольник)
ctx.fillStyle='#8b6914';
ctx.beginPath();
ctx.moveTo(balanceX,balanceY+armLength+5);
ctx.lineTo(balanceX-12,balanceY+armLength+25);
ctx.lineTo(balanceX+12,balanceY+armLength+25);
ctx.closePath();
ctx.fill();
ctx.strokeStyle='rgba(255,255,255,0.3)';ctx.lineWidth=1;ctx.stroke();

// Коромысло (вращается вокруг точки опоры)
const pivotY=balanceY+armLength+5;
const leftEndX=balanceX-armLength;
const rightEndX=balanceX+armLength;

ctx.strokeStyle='rgba(255,255,255,0.5)';
ctx.lineWidth=3;
ctx.beginPath();
ctx.moveTo(leftEndX,pivotY-tilt*armLength);
ctx.lineTo(rightEndX,pivotY+tilt*armLength);
ctx.stroke();

// Точка опоры (круг)
ctx.fillStyle='#ffd54f';
ctx.beginPath();ctx.arc(balanceX,pivotY,5,0,Math.PI*2);ctx.fill();

// Левая чаша
const leftPanX=leftEndX,leftPanY=pivotY-tilt*armLength;
const panWidth=60,panHeight=10;

ctx.strokeStyle='rgba(255,255,255,0.3)';ctx.lineWidth=1;
ctx.beginPath();ctx.moveTo(leftPanX,leftPanY);ctx.lineTo(leftPanX-20,leftPanY+40);ctx.stroke();
ctx.beginPath();ctx.moveTo(leftPanX,leftPanY);ctx.lineTo(leftPanX+20,leftPanY+40);ctx.stroke();

ctx.fillStyle='#8b7355';
ctx.beginPath();ctx.ellipse(leftPanX,leftPanY+40,panWidth/2,panHeight,0,0,Math.PI*2);ctx.fill();
ctx.strokeStyle='rgba(255,255,255,0.4)';ctx.stroke();

// Нейтральный предмет
ctx.fillStyle='#9e9e9e';
ctx.beginPath();ctx.roundRect(leftPanX-12,leftPanY+25,24,24,4);ctx.fill();
ctx.fillStyle='rgba(255,255,255,0.5)';
ctx.font='11px Georgia,serif';ctx.textAlign='center';
ctx.fillText('Qₛ=0',leftPanX,leftPanY+65);
ctx.fillText('Нейтральный',leftPanX,leftPanY+80);

// Правая чаша
const rightPanX=rightEndX,rightPanY=pivotY+tilt*armLength;

ctx.strokeStyle='rgba(255,255,255,0.3)';ctx.lineWidth=1;
ctx.beginPath();ctx.moveTo(rightPanX,rightPanY);ctx.lineTo(rightPanX-20,rightPanY+40);ctx.stroke();
ctx.beginPath();ctx.moveTo(rightPanX,rightPanY);ctx.lineTo(rightPanX+20,rightPanY+40);ctx.stroke();

ctx.fillStyle='#8b7355';
ctx.beginPath();ctx.ellipse(rightPanX,rightPanY+40,panWidth/2,panHeight,0,0,Math.PI*2);ctx.fill();
ctx.strokeStyle='rgba(255,255,255,0.4)';ctx.stroke();

// Заряженный предмет
const chargedItemX=rightPanX,chargedItemY=rightPanY+25;

// Свечение
const glowRadius=20+Math.abs(effectiveQ)*3;
const itemGlow=ctx.createRadialGradient(chargedItemX,chargedItemY,0,chargedItemX,chargedItemY,glowRadius);
itemGlow.addColorStop(0,getQSColor(qs,0.9));
itemGlow.addColorStop(0.5,getQSColor(qs,0.4));
itemGlow.addColorStop(1,'rgba(0,0,0,0)');
ctx.fillStyle=itemGlow;
ctx.beginPath();ctx.arc(chargedItemX,chargedItemY,glowRadius,0,Math.PI*2);ctx.fill();

ctx.fillStyle=getQSColor(qs,0.9);
ctx.beginPath();ctx.roundRect(chargedItemX-12,chargedItemY-12,24,24,4);ctx.fill();

// Частицы вокруг заряженного предмета
const numOrbitParticles=Math.floor(Math.abs(effectiveQ)*3);
for(let i=0;i<numOrbitParticles;i++){
    const angle=(i/numOrbitParticles)*Math.PI*2+time*2;
    const dist=18+Math.abs(effectiveQ)*2;
    const px=chargedItemX+Math.cos(angle)*dist;
    const py=chargedItemY+Math.sin(angle)*dist;
    ctx.fillStyle=getQSColor(qs,0.5);
    ctx.beginPath();ctx.arc(px,py,1.5,0,Math.PI*2);ctx.fill();
}

// Стрелки-индикаторы
if(effectiveQ>0.5){
    ctx.fillStyle=getQSColor(qs,0.7);
    ctx.font='18px Georgia,serif';
    ctx.fillText('↑↑↑',chargedItemX,chargedItemY-25);
}else if(effectiveQ<-0.5){
    ctx.fillStyle=getQSColor(qs,0.7);
    ctx.font='18px Georgia,serif';
    ctx.fillText('↓↓↓',chargedItemX,chargedItemY+45);
}

// Подпись Qₛ
ctx.fillStyle=getQSColor(qs,0.9);
ctx.font='11px Georgia,serif';ctx.textAlign='center';
ctx.fillText('Qₛ='+(qs>=0?'+':'')+qs.toFixed(1),chargedItemX,chargedItemY+42);
if(effectiveQ>1) ctx.fillText('ЛЕВИТАЦИЯ ↑',chargedItemX,chargedItemY+56);
else if(effectiveQ<-1) ctx.fillText('УТЯЖЕЛЕНИЕ ↓',chargedItemX,chargedItemY+56);
else ctx.fillText('Равновесие',chargedItemX,chargedItemY+56);
    
    // Стрелки-индикаторы
    if(effectiveQ>0.5){
        ctx.fillStyle=getQSColor(qs,0.7);
        ctx.font='20px Georgia,serif';
        ctx.fillText('↑↑↑',chargedItemX,chargedItemY-30);
    }else if(effectiveQ<-0.5){
        ctx.fillStyle=getQSColor(qs,0.7);
        ctx.font='20px Georgia,serif';
        ctx.fillText('↓↓↓',chargedItemX,chargedItemY+55);
    }
    
    // Уровень гравитации
    const gravY=h*0.82;
    ctx.fillStyle='rgba(255,255,255,0.2)';
    ctx.font='14px Georgia,serif';
    ctx.textAlign='center';
    ctx.fillText('g = 9.8 м/с²',balanceX,gravY);
    ctx.fillText('g_eff = '+(9.8-effectiveQ*0.8).toFixed(1)+' м/с²',balanceX,gravY+20);
    
    animId=requestAnimationFrame(drawFrame);
}

drawFrame();
window.addEventListener('beforeunload',()=>{if(animId)cancelAnimationFrame(animId);});
</script>

</body>
</html>
