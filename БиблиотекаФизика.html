<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Мега-библиотека физики</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Inter', 'Segoe UI', Roboto, system-ui, sans-serif;
    }
    body {
      background: #ecf4fa;
      color: #0e2f40;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    .header {
      background: linear-gradient(145deg, #103f55, #1e6887);
      color: white;
      padding: 1.2rem 2rem;
      box-shadow: 0 12px 30px #0b34496e;
    }
    .header h1 {
      font-weight: 500;
      font-size: 2.3rem;
      display: flex;
      align-items: center;
      gap: 1rem;
      flex-wrap: wrap;
    }
    .header h1 span {
      background: #2b7da0;
      padding: 0.2rem 1.4rem;
      border-radius: 40px;
      font-size: 1rem;
      color: #e3f2fd;
    }

    .app-main {
      display: flex;
      flex: 1;
      min-height: 0;
      overflow: hidden;
    }

    .sections-col {
      width: 280px;
      background: #ffffffd6;
      backdrop-filter: blur(8px);
      border-right: 1px solid #c2ddef;
      padding: 2rem 0.5rem 2rem 1.2rem;
      overflow-y: auto;
      box-shadow: 6px 0 20px #b7cfec;
    }
    .sections-col h3 {
      font-size: 0.8rem;
      text-transform: uppercase;
      color: #527e9c;
      margin-bottom: 1.8rem;
      padding-left: 0.8rem;
    }
    .sec-btn {
      display: block;
      width: 100%;
      text-align: left;
      background: transparent;
      border: none;
      border-left: 4px solid transparent;
      padding: 0.9rem 1rem;
      margin: 0.3rem 0;
      border-radius: 14px;
      font-size: 1rem;
      font-weight: 500;
      color: #1a4056;
      cursor: pointer;
      transition: 0.1s;
    }
    .sec-btn:hover { background: #e1f0fc; border-left-color: #9ac2de; }
    .sec-btn.active {
      background: #276b92;
      color: white;
      border-left-color: #ffb74d;
      box-shadow: 0 5px 15px #1b4a67;
    }

    .formulas-col {
      width: 340px;
      background: #f4fafd;
      border-right: 1px solid #c2daf0;
      display: flex;
      flex-direction: column;
      padding: 2rem 0.5rem 2rem 1.2rem;
      overflow-y: auto;
    }
    .formulas-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1.5rem;
    }
    .formulas-header h2 {
      font-size: 1.7rem;
      font-weight: 400;
      color: #195e7c;
    }
    .back-sections-btn {
      background: white;
      border: 1px solid #b2d6f0;
      border-radius: 40px;
      padding: 0.2rem 1.2rem;
      font-size: 0.8rem;
      cursor: pointer;
    }
    .formula-item {
      background: white;
      border: 1px solid #c5e4fc;
      border-radius: 22px;
      padding: 1rem 1.2rem;
      margin: 0.4rem 0;
      font-weight: 500;
      cursor: pointer;
      box-shadow: 0 2px 8px #afd2ed36;
      transition: 0.1s;
    }
    .formula-item:hover {
      background: #e2f2ff;
      border-color: #3087b9;
      transform: translateX(5px);
    }

    .detail-col {
      flex: 1;
      background: white;
      padding: 2.5rem 3rem;
      overflow-y: auto;
    }
    .detail-card {
      max-width: 1000px;
    }
    .detail-title {
      font-size: 2.6rem;
      font-weight: 300;
      color: #124961;
      border-bottom: 3px solid #cfe2f5;
      padding-bottom: 0.6rem;
      margin-bottom: 2rem;
    }
    .detail-eq {
      background: #f2faff;
      border-radius: 60px;
      padding: 2rem 2.5rem;
      font-size: 2rem;
      text-align: center;
      font-family: 'Courier New', monospace;
      color: #005982;
      border: 1px solid #b5daff;
      margin: 2rem 0;
      box-shadow: inset 0 2px 8px #b8d8f5, 0 15px 30px #d2e8fc;
      word-break: break-word;
    }
    .detail-desc {
      font-size: 1.2rem;
      line-height: 1.7;
      margin: 2rem 0;
      background: #f3fbff;
      padding: 1.5rem 2rem;
      border-radius: 40px;
    }
    .var-table {
      width: 100%;
      border-collapse: separate;
      border-spacing: 0 0.7rem;
    }
    .var-table td {
      background: #f2faff;
      padding: 0.9rem 1.2rem;
      border-radius: 28px;
    }
    .var-table td:first-child {
      font-family: monospace;
      font-size: 1.3rem;
      font-weight: 600;
      width: 200px;
      color: #00668f;
    }
    .back-from-detail {
      display: inline-block;
      margin-top: 2.5rem;
      border: 1px solid #b9daf8;
      padding: 0.6rem 2.2rem;
      border-radius: 40px;
      cursor: pointer;
      color: #1f75a0;
      transition: 0.1s;
    }
    .back-from-detail:hover { background: #eff7ff; }

    footer {
      background: #cbe2f0;
      padding: 0.8rem 2rem;
      font-size: 0.9rem;
      color: #1d4b61;
      border-top: 1px solid #97c1dc;
    }
  </style>
</head>
<body>
  <header class="header">
    <h1>📘 Мега-библиотека физики <span>~3000 формул</span></h1>
  </header>

  <div class="app-main">
    <div class="sections-col" id="sectionsContainer"></div>
    <div class="formulas-col" id="formulasColumn" style="display: none;">
      <div class="formulas-header">
        <h2 id="currentSectionTitle"></h2>
        <button class="back-sections-btn" id="backToSectionsBtn">← все разделы</button>
      </div>
      <div id="formulasList"></div>
    </div>
    <div class="detail-col" id="detailColumn" style="display: none;">
      <div class="detail-card" id="detailContent"></div>
    </div>
  </div>

  <footer>⚛️ 15 разделов</footer>

  <script>
    (function() {
      // ========== СПИСОК РАЗДЕЛОВ ==========
      const sections = [
        'механика','волны','оптика','ядерная','электричество',
        'молекулярная','атомная','постоянные','астрофизика','квантовая физика',
        'идеатоника','хронофизика','кенотика','айоника','архетика'
      ];

      let nextId = 0;
      const formulas = [];

      // Функция добавления с проверкой на дубликаты
      function addUnique(section, name, formula, desc, variables = []) {
        const exists = formulas.some(f => f.section === section.toLowerCase() && f.name === name);
        if (exists) {
          console.warn(`Формула "${name}" уже существует, пропускаем`);
          return;
        }
        const varObj = {};
        variables.forEach(v => {
          const parts = v.split(':');
          if (parts.length >= 2) varObj[parts[0].trim()] = parts.slice(1).join(':').trim();
          else varObj[parts[0].trim()] = '—';
        });
        formulas.push({
          id: String(nextId++),
          section: section.toLowerCase(),
          name: name,
          formula: formula,
          desc: desc,
          variables: varObj
        });
      }

      // ========== 1. МЕХАНИКА ==========
      addUnique('механика','Скорость равномерная','v = S / t','Скорость – отношение пройденного пути ко времени.',['S:путь (м)','t:время (с)','v:скорость (м/с)']);
      addUnique('механика','Плотность вещества','ρ = m / V','Масса единицы объёма.',['m:масса (кг)','V:объём (м³)','ρ:плотность (кг/м³)']);
      addUnique('механика','Сила тяжести','F = m·g','Сила притяжения к Земле.',['m:масса (кг)','g:ускорение свободного падения (≈9.8 м/с²)','F:сила (Н)']);
      addUnique('механика','Закон Гука','F = k·x','Упругая сила пропорциональна деформации.',['k:жёсткость (Н/м)','x:удлинение (м)','F:сила упругости (Н)']);
      addUnique('механика','Сила трения скольжения','F_тр = μ·N','Максимальная сила трения.',['μ:коэффициент трения','N:сила реакции опоры (Н)','F_тр:сила трения (Н)']);
      addUnique('механика','Давление твёрдого тела','p = F / S','Сила на единицу площади.',['F:сила (Н)','S:площадь (м²)','p:давление (Па)']);
      addUnique('механика','Гидростатическое давление','p = ρ·g·h','Давление столба жидкости.',['ρ:плотность жидкости (кг/м³)','g:9.8 м/с²','h:глубина (м)','p:давление (Па)']);
      addUnique('механика','Сила Архимеда','F_A = ρ_ж·g·V_т','Выталкивающая сила.',['ρ_ж:плотность жидкости (кг/м³)','g:9.8 м/с²','V_т:объём погружённой части тела (м³)','F_A:сила Архимеда (Н)']);
      addUnique('механика','Момент силы','M = F·l','Вращающий момент.',['F:сила (Н)','l:плечо (м)','M:момент силы (Н·м)']);
      addUnique('механика','КПД','η = (A_п / A_з)·100%','Коэффициент полезного действия.',['A_п:полезная работа (Дж)','A_з:затраченная работа (Дж)','η:КПД (%)']);
      addUnique('механика','Импульс тела','p = m·v','Количество движения.',['m:масса (кг)','v:скорость (м/с)','p:импульс (кг·м/с)']);
      addUnique('механика','Закон сохранения импульса','m₁v₁ + m₂v₂ = m₁v₁\' + m₂v₂\'','Для замкнутой системы.',['m₁,m₂:массы тел','v₁,v₂:скорости до взаимодействия','v₁\',v₂\':скорости после взаимодействия']);
      addUnique('механика','Кинетическая энергия','E_k = m·v²/2','Энергия движения.',['m:масса (кг)','v:скорость (м/с)','E_k:кинетическая энергия (Дж)']);
      addUnique('механика','Потенциальная энергия (тяготение)','E_p = m·g·h','В поле тяжести вблизи Земли.',['m:масса (кг)','g:9.8 м/с²','h:высота над нулевым уровнем (м)','E_p:потенциальная энергия (Дж)']);
      addUnique('механика','Работа постоянной силы','A = F·S·cosα','Работа силы.',['F:сила (Н)','S:перемещение (м)','α:угол между векторами силы и перемещения','A:работа (Дж)']);
      addUnique('механика','Мощность (средняя)','N = A / t','Быстрота совершения работы.',['A:работа (Дж)','t:время (с)','N:мощность (Вт)']);
      addUnique('механика','Ускорение (среднее)','a = (v - v₀) / t','Изменение скорости за время.',['v₀:начальная скорость (м/с)','v:конечная скорость (м/с)','t:время (с)','a:ускорение (м/с²)']);
      addUnique('механика','Путь равноускоренный','S = v₀t + at²/2','Перемещение при равноускоренном движении.',['v₀:начальная скорость (м/с)','a:ускорение (м/с²)','t:время (с)','S:путь (м)']);
      addUnique('механика','Скорость равноускоренная','v = v₀ + at','Скорость при равноускоренном движении.',['v₀:начальная скорость','a:ускорение','t:время','v:скорость в момент t']);
      addUnique('механика','Второй закон Ньютона (общий)','F = dp/dt','Сила – производная импульса по времени.',['p:импульс (кг·м/с)','t:время (с)','F:сила (Н)']);
      addUnique('механика','Закон всемирного тяготения','F = G·m₁·m₂ / r²','Сила гравитационного притяжения.',['G:гравитационная постоянная (6.674·10⁻¹¹ Н·м²/кг²)','m₁,m₂:массы тел (кг)','r:расстояние между центрами масс (м)','F:сила (Н)']);
      addUnique('механика','Первая космическая скорость','v₁ = √(GM/R)','Скорость круговой орбиты.',['G:гравитационная постоянная','M:масса планеты (кг)','R:радиус планеты (м)','v₁:первая космическая скорость (м/с)']);
      addUnique('механика','Вторая космическая скорость','v₂ = √(2GM/R)','Скорость убегания (параболическая).',['G:гравитационная постоянная','M:масса планеты (кг)','R:радиус планеты (м)','v₂:вторая космическая скорость (м/с)']);
      addUnique('механика','Уравнение движения центра масс','M·a_ц = Σ F_внеш','Закон движения центра масс.',['M:общая масса','a_ц:ускорение центра масс','F_внеш:внешние силы']);
      addUnique('механика','Закон сохранения момента импульса','L = const (при M_внеш = 0)','Момент импульса замкнутой системы постоянен.',['L:момент импульса','M_внеш:сумма внешних моментов']);
      addUnique('механика','Кинетическая энергия вращения','E_вр = Iω²/2','Энергия вращательного движения.',['I:момент инерции (кг·м²)','ω:угловая скорость (рад/с)','E_вр:энергия (Дж)']);
      addUnique('механика','Теорема Штейнера','I = I_ц + m·d²','Момент инерции относительно произвольной оси.',['I_ц:момент инерции относительно оси через центр масс','m:масса тела','d:расстояние между осями']);
      addUnique('механика','Работа при вращении','A = ∫ M dφ','Работа момента сил.',['M:момент силы','φ:угол поворота']);
      addUnique('механика','Мощность при вращении','N = M·ω','Мощность момента сил.',['M:момент силы','ω:угловая скорость']);
      addUnique('механика','Уравнение движения с переменной массой (Мещерский)','m dv/dt = F + u dm/dt','Движение ракеты.',['u:скорость отделяющихся частиц']);
      addUnique('механика','Центростремительное ускорение','a_ц = v²/R','Ускорение при движении по окружности.',['v:скорость','R:радиус']);
      addUnique('механика','Угловая скорость','ω = Δφ/Δt','Скорость вращения.',['Δφ:угол поворота','Δt:время']);
      addUnique('механика','Угловое ускорение','ε = Δω/Δt','Изменение угловой скорости.',['Δω:изменение угловой скорости']);
      addUnique('механика','Закон Бернулли для жидкости','p + ½ρv² + ρgh = const','Для идеальной жидкости.',['p:давление','ρ:плотность','v:скорость','h:высота']);
      addUnique('механика','Уравнение с рывком','r(t)= r₀ + v₀t + ½a₀t² + ⅙j₀t³','Кинематика с учётом третьей производной (рывок).',['r₀:начальное положение (м)','v₀:начальная скорость (м/с)','a₀:начальное ускорение (м/с²)','j₀:рывок (м/с³)','r(t):положение в момент t']);
      addUnique('механика','Закон сохранения рывка','Σ m_i j_i = const','В изолированной системе сумма рывков сохраняется.',['m_i:масса i-го тела (кг)','j_i:рывок i-го тела (м/с³)']);
      addUnique('механика','Энергия рывка','E_j = ½ μ j² t²','Энергия, связанная с изменением ускорения.',['μ:инерция рывка (кг·с²)','j:рывок (м/с³)','t:время (с)','E_j:энергия рывка (Дж)']);
      addUnique('механика','Релятивистский рывок','j\' = j / γ⁴·(1−v²/c²)⁻³/²','Преобразование рывка в СТО.',['j:рывок в исходной системе','γ:лоренц-фактор','v:скорость','c:скорость света','j\':рывок в движущейся системе']);
      addUnique('механика','Гравитация с запаздыванием','F = −G m₁m₂ / r²(t−τ) r̂(t−τ)','Учёт конечной скорости распространения гравитации.',['τ = r/c:время запаздывания','G:гравитационная постоянная','m₁,m₂:массы','r:расстояние']);
      addUnique('механика','Пятая сила','F₅ = α m₁m₂ / r² · e^(−r/λ₅)(1+r/λ₅)','Гипотетическая сила отталкивания на малых расстояниях.',['α:константа связи','λ₅:радиус действия (м)']);
      addUnique('механика','Тензор инерции фрактала','I_{ij}= ρ₀∫ r² δ_{ij} r^{D-3} dV','Момент инерции для фрактальных тел.',['D:фрактальная размерность','ρ₀:базовая плотность','dV:элемент объёма']);
      addUnique('механика','Уравнение Лиувилля с трением','∂ρ/∂t + Σ(∂ρ/∂q·q̇+∂ρ/∂p·ṗ) = β Σ ∂/∂p (pρ)','Эволюция функции распределения с диссипацией.',['ρ:плотность вероятности','q,p:обобщённые координаты и импульсы','β:коэффициент трения']);
      // ========== НОВЫЕ ФОРМУЛЫ ПО МЕХАНИКЕ (ДОПОЛНИТЕЛЬНЫЕ) ==========

// Кинематика точки
addUnique('механика','Тангенциальное ускорение','a_τ = dv/dt','Характеризует изменение скорости по модулю.',['v:скорость (м/с)','t:время (с)','a_τ:тангенциальное ускорение (м/с²)']);
addUnique('механика','Нормальное ускорение','a_n = v²/R','Характеризует изменение скорости по направлению.',['v:скорость (м/с)','R:радиус кривизны (м)','a_n:нормальное ускорение (м/с²)']);
addUnique('механика','Полное ускорение','a = √(a_τ² + a_n²)','При криволинейном движении.',['a_τ:тангенциальное ускорение','a_n:нормальное ускорение','a:полное ускорение']);
addUnique('механика','Радиус кривизны траектории','R = v²/a_n','Определяется через нормальное ускорение.',['v:скорость','a_n:нормальное ускорение','R:радиус кривизны']);
addUnique('механика','Уравнение траектории','y = f(x)','Зависимость координат при движении.',[]);
addUnique('механика','Скорость при равнопеременном движении','v = v₀ + at','Линейная зависимость от времени.',['v₀:начальная скорость','a:ускорение','t:время','v:скорость']);
addUnique('механика','Координата при равнопеременном движении','x = x₀ + v₀t + at²/2','Закон движения.',['x₀:начальная координата','v₀:начальная скорость','a:ускорение','t:время','x:координата']);
addUnique('механика','Средняя путевая скорость','v_ср = S/t','Отношение всего пути ко времени.',['S:путь (м)','t:время (с)','v_ср:средняя скорость (м/с)']);
addUnique('механика','Средняя скорость перемещения','v_ср = |Δr|/t','Отношение модуля перемещения ко времени.',['Δr:перемещение (м)','t:время (с)','v_ср:средняя скорость (м/с)']);
addUnique('механика','Относительная скорость','v_12 = v_1 - v_2','Скорость первого тела относительно второго.',['v_1:скорость первого тела','v_2:скорость второго тела','v_12:относительная скорость']);
addUnique('механика','Уравнение связи скоростей','v_1·cosα₁ = v_2·cosα₂','Для систем с жёсткими связями.',[]);

// Динамика материальной точки

      // ========== ЛОГИКА ПРИЛОЖЕНИЯ (БЕЗ ПОИСКА) ==========
      let activeSection = null;
      let activeFormulaId = null;

      function renderSections() {
        const container = document.getElementById('sectionsContainer');
        if (!container) return;
        container.innerHTML = '';
        sections.forEach(sec => {
          const btn = document.createElement('button');
          btn.className = 'sec-btn' + (activeSection === sec ? ' active' : '');
          btn.textContent = sec.charAt(0).toUpperCase() + sec.slice(1);
          btn.addEventListener('click', () => {
            activeSection = sec;
            renderSections();
            showFormulas(sec);
          });
          container.appendChild(btn);
        });
      }

      function showFormulas(sec) {
        const formulasCol = document.getElementById('formulasColumn');
        const detailCol = document.getElementById('detailColumn');
        if (!formulasCol || !detailCol) return;
        formulasCol.style.display = 'flex';
        detailCol.style.display = 'none';
        const titleEl = document.getElementById('currentSectionTitle');
        if (titleEl) titleEl.textContent = sec.charAt(0).toUpperCase() + sec.slice(1);
        const filtered = formulas.filter(f => f.section === sec);
        const listDiv = document.getElementById('formulasList');
        if (!listDiv) return;
        listDiv.innerHTML = '';
        filtered.forEach(f => {
          const div = document.createElement('div');
          div.className = 'formula-item';
          div.textContent = f.name;
          div.addEventListener('click', () => {
            activeFormulaId = f.id;
            formulasCol.style.display = 'none';
            detailCol.style.display = 'block';
            renderDetail(f.id);
          });
          listDiv.appendChild(div);
        });
      }

      function renderDetail(fid) {
        const f = formulas.find(f => f.id === fid);
        if (!f) return;
        let varsHtml = '';
        for (let [sym, def] of Object.entries(f.variables)) {
          varsHtml += `<tr><td>${sym}</td><td>${def}</td></tr>`;
        }
        const html = `
          <div class="detail-title">${f.name}</div>
          <div class="detail-eq">${f.formula}</div>
          <div class="detail-desc"><strong>Описание:</strong> ${f.desc}</div>
          <h3 style="margin-top:2rem;">Все переменные</h3>
          <table class="var-table">${varsHtml || '<tr><td>—</td><td>нет переменных</td></tr>'}</table>
          <div class="back-from-detail" id="backDetailBtn">← назад к формулам</div>
        `;
        const detailContent = document.getElementById('detailContent');
        if (detailContent) detailContent.innerHTML = html;
        const backBtn = document.getElementById('backDetailBtn');
        if (backBtn) {
          backBtn.addEventListener('click', () => {
            if (activeSection) {
              document.getElementById('detailColumn').style.display = 'none';
              document.getElementById('formulasColumn').style.display = 'flex';
              showFormulas(activeSection);
            }
          });
        }
      }

      const backBtn = document.getElementById('backToSectionsBtn');
      if (backBtn) {
        backBtn.addEventListener('click', () => {
          activeSection = null;
          activeFormulaId = null;
          document.getElementById('formulasColumn').style.display = 'none';
          document.getElementById('detailColumn').style.display = 'none';
          renderSections();
        });
      }

      console.log('Всего формул загружено:', formulas.length);
      
      // Запуск
      renderSections();
    })();
  </script>
</body>
</html>
