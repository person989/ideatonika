<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Резонанс Растений • Идеатоника</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: linear-gradient(145deg, #0d1117 0%, #161b22 100%);
            min-height: 100vh;
            font-family: 'Georgia', 'Times New Roman', serif;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            padding: 1rem; overflow-x: hidden;
        }
        .stars-bg { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 0; }
        .star { position: absolute; background: white; border-radius: 50%; animation: twinkle var(--duration) ease-in-out infinite; animation-delay: var(--delay); opacity: 0; }
        @keyframes twinkle { 0%,100% { opacity:0.2; transform:scale(1); } 50% { opacity:1; transform:scale(1.8); } }
        .main-container {
            position: relative; z-index: 1; width: 100%; max-width: 1100px;
            background: rgba(22,27,34,0.85); backdrop-filter: blur(12px);
            border: 1px solid rgba(227,184,124,0.3); border-radius: 32px;
            padding: 2rem; box-shadow: 0 20px 40px rgba(0,0,0,0.6);
        }
        .header { text-align: center; margin-bottom: 1.5rem; }
        .header h1 { font-size: 2.5rem; font-weight: 400; letter-spacing: 3px; color: #f3e7c0; text-shadow: 0 0 20px rgba(255,215,80,0.4); margin-bottom: 0.3rem; }
        .header .subtitle { font-size: 1rem; color: #c0b090; font-style: italic; border-bottom: 1px solid #5d4a3a; display: inline-block; padding-bottom: 0.4rem; }
        .canvas-wrapper { position: relative; width: 100%; background: radial-gradient(ellipse at center, #1a2030 0%, #0a0e14 100%); border-radius: 20px; border: 1px solid #5d4a3a; overflow: hidden; margin-bottom: 1.5rem; box-shadow: inset 0 0 80px rgba(0,0,0,0.5); }
        canvas { display: block; width: 100%; height: auto; }
        .controls-panel { background: rgba(0,0,0,0.3); border: 1px solid #5d4a3a; border-radius: 20px; padding: 1.5rem 2rem; }
        .controls-title { font-size: 1.2rem; color: #ffd54f; margin-bottom: 1.2rem; text-align: center; letter-spacing: 1px; }
        .slider-group { margin-bottom: 1.2rem; }
        .slider-group label { display: flex; justify-content: space-between; align-items: center; color: #d0c8b8; font-size: 0.95rem; margin-bottom: 0.4rem; }
        .slider-group label .param-value { color: #ffd54f; font-weight: bold; font-size: 1.1rem; min-width: 50px; text-align: right; }
        .slider-group input[type="range"] { width: 100%; -webkit-appearance: none; height: 8px; background: linear-gradient(90deg, #3a2a4a, #5d4a3a, #3a2a4a); border-radius: 4px; outline: none; cursor: pointer; }
        .slider-group input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; width: 24px; height: 24px; background: radial-gradient(circle at 40% 40%, #ffe082, #ff8f00); border-radius: 50%; cursor: pointer; box-shadow: 0 0 15px rgba(255,215,80,0.6); border: 2px solid #ffd54f; }
        .range-labels { display: flex; justify-content: space-between; color: #706858; font-size: 0.75rem; margin-top: 0.2rem; }
        .info-box { margin-top: 1.5rem; padding: 1rem 1.5rem; background: rgba(255,215,80,0.05); border: 1px solid rgba(255,215,80,0.2); border-radius: 12px; text-align: center; color: #c0b090; font-size: 0.9rem; font-style: italic; }
        .info-box .formula-display { font-family: 'Courier New', monospace; color: #ffd54f; font-size: 1rem; margin: 0.3rem 0; }
        .back-row { text-align: center; margin-top: 1.5rem; }
        .back-link { display: inline-block; color: #ffd54f; text-decoration: none; border: 1px solid #ffd54f; padding: 0.6rem 1.5rem; border-radius: 30px; transition: 0.3s; font-size: 0.9rem; }
        .back-link:hover { background: #ffd54f; color: #0d1117; }
        @media (max-width: 700px) { .main-container { padding: 1rem; } .header h1 { font-size: 1.8rem; } .controls-panel { padding: 1rem; } }
    </style>
</head>
<body>
<div class="stars-bg" id="starsBg"></div>
<div class="main-container">
    <div class="header">
        <h1>🎵 Резонанс Растений</h1>
        <div class="subtitle">Визуализация Эксперимента №49: как частота звука влияет на Qₛ роста</div>
    </div>
    <div class="canvas-wrapper" id="canvasWrapper">
        <canvas id="plantsCanvas"></canvas>
    </div>
    <div class="controls-panel">
        <div class="controls-title">🎛️ Параметры</div>
        <div class="slider-group">
            <label><span>⏱️ Время роста</span><span class="param-value" id="timeValue">7 дней</span></label>
            <input type="range" id="timeSlider" min="0" max="30" value="7" step="0.5">
            <div class="range-labels"><span>0 (посадка)</span><span>15 дней</span><span>30 дней (сбор)</span></div>
        </div>
        <div class="slider-group">
            <label><span>☀️ Базовый Qₛ среды</span><span class="param-value" id="qsValue">+3</span></label>
            <input type="range" id="qsSlider" min="0" max="8" value="3" step="0.5">
            <div class="range-labels"><span>0 (темница)</span><span>+4 (норма)</span><span>+8 (теплица)</span></div>
        </div>
        <div class="slider-group" style="text-align:center;">
            <button id="resetBtn" style="padding:0.6rem 2rem;background:rgba(255,215,80,0.1);border:1px solid #ffd54f;color:#ffd54f;border-radius:30px;font-family:Georgia,serif;font-size:1rem;cursor:pointer;">🔄 Заново</button>
        </div>
        <div class="info-box">
            <span id="statusText" style="color:#ffd54f;font-weight:bold;">🌱 Растения набирают силу</span>
            <div class="formula-display" id="formulaDisplay"></div>
        </div>
    </div>
    <div class="back-row">
        <a href="visualizations.html" class="back-link">← К списку визуализаций</a>
    </div>
</div>

<script>
(function(){
    const starsBg=document.getElementById('starsBg');
    for(let i=0;i<100;i++){
        const d=document.createElement('div');d.className='star';
        d.style.left=Math.random()*100+'%';d.style.top=Math.random()*100+'%';
        const s=Math.random()*2.5+0.5;d.style.width=s+'px';d.style.height=s+'px';
        d.style.setProperty('--duration',(Math.random()*4+2)+'s');
        d.style.setProperty('--delay',(Math.random()*5)+'s');
        starsBg.appendChild(d);
    }
})();

const canvas=document.getElementById('plantsCanvas');
const ctx=canvas.getContext('2d');
const wrapper=document.getElementById('canvasWrapper');
let time=0,animId;

function resize(){
    const r=wrapper.getBoundingClientRect();
    canvas.width=r.width;
    canvas.height=Math.max(500,Math.min(650,r.width*0.7));
    wrapper.style.height=canvas.height+'px';
}
resize();window.addEventListener('resize',resize);

const timeSlider=document.getElementById('timeSlider');
const qsSlider=document.getElementById('qsSlider');
const timeValue=document.getElementById('timeValue');
const qsValue=document.getElementById('qsValue');
const resetBtn=document.getElementById('resetBtn');
const statusText=document.getElementById('statusText');
const formulaDisplay=document.getElementById('formulaDisplay');

timeSlider.oninput=function(){
    const t=parseFloat(this.value);
    timeValue.textContent=t.toFixed(1)+' дней';
    updateInfo();
};
qsSlider.oninput=function(){
    qsValue.textContent='+'+parseFloat(this.value).toFixed(1);
};
resetBtn.onclick=function(){
    timeSlider.value=0;
    timeValue.textContent='0 дней';
    updateInfo();
};

function updateInfo(){
    const t=parseFloat(timeSlider.value);
    if(t<3) statusText.textContent='🌱 Прорастание — растения только проклюнулись';
    else if(t<10) statusText.textContent='🌿 Активный рост — стебли тянутся вверх';
    else if(t<20) statusText.textContent='🌳 Зрелость — растения набирают силу';
    else statusText.textContent='🍎 Плодоношение — максимальный Qₛ';
    
    const h432=Math.min(1,t/20)*100;
    const h440=Math.min(1,t/20)*85;
    const hSilence=Math.min(1,t/20)*70;
    formulaDisplay.textContent='432 Гц: '+h432.toFixed(0)+'% | 440 Гц: '+h440.toFixed(0)+'% | Тишина: '+hSilence.toFixed(0)+'%';
}
updateInfo();

function getPlantColor(qs,alpha){
    const norm=qs/8;
    const r=Math.floor(20+norm*80);
    const g=Math.floor(100+norm*155);
    const b=Math.floor(20+norm*60);
    return `rgba(${r},${g},${b},${alpha})`;
}

function drawFrame(){
    const t=parseFloat(timeSlider.value);
    const qs=parseFloat(qsSlider.value);
    const w=canvas.width,h=canvas.height;
    time+=0.016;
    
    ctx.fillStyle='#060a10';
    ctx.fillRect(0,0,w,h);
    
    ctx.strokeStyle='rgba(255,255,255,0.02)';ctx.lineWidth=1;
    for(let x=0;x<w;x+=50){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,h);ctx.stroke();}
    for(let y=0;y<h;y+=50){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(w,y);ctx.stroke();}
    
    // Три растения
    const plants=[
        {name:'Тишина',x:w*0.2,label:'🔇',growthRate:0.7,qsMult:1.0,color:'rgba(150,200,150,<alpha>)'},
        {name:'440 Гц',x:w*0.5,label:'🎵',growthRate:0.85,qsMult:1.2,color:'rgba(180,210,180,<alpha>)'},
        {name:'432 Гц',x:w*0.8,label:'🎶',growthRate:1.0,qsMult:1.5,color:'rgba(100,220,120,<alpha>)'}
    ];
    
    const maxHeight=h*0.45;
    const potY=h*0.8;
    const potW=50,potH=40;
    
    for(const plant of plants){
        const growth=t*plant.growthRate/20;
        const stemH=Math.min(maxHeight,growth*maxHeight);
        const stemX=plant.x;
        const stemBaseY=potY-10;
        const stemTopY=stemBaseY-stemH;
        
        // Горшок
        ctx.fillStyle='#8d6e63';
        ctx.beginPath();
        ctx.moveTo(stemX-potW/2,potY);
        ctx.lineTo(stemX-potW/3,potY-potH);
        ctx.lineTo(stemX+potW/3,potY-potH);
        ctx.lineTo(stemX+potW/2,potY);
        ctx.closePath();
        ctx.fill();
        ctx.strokeStyle='rgba(255,255,255,0.3)';ctx.lineWidth=1;ctx.stroke();
        
        // Почва
        ctx.fillStyle='#4e342e';
        ctx.beginPath();ctx.ellipse(stemX,potY-potH+5,potW/3,6,0,0,Math.PI*2);ctx.fill();
        
        // Стебель
        if(stemH>5){
            ctx.strokeStyle=plant.color.replace('<alpha>','0.8');
            ctx.lineWidth=3+growth*0.5;
            ctx.beginPath();
            ctx.moveTo(stemX,stemBaseY);
            const midX=stemX+Math.sin(stemX*0.05+time)*5;
            const midY=stemBaseY-stemH*0.6;
            ctx.quadraticCurveTo(midX,midY,stemX+Math.sin(stemX*0.05+time+1)*3,stemTopY);
            ctx.stroke();
            
            // Листья
            const numLeaves=Math.floor(growth*6);
            for(let l=0;l<numLeaves;l++){
                const leafT=(l+1)/(numLeaves+1);
                const leafY=stemBaseY-stemH*leafT;
                const leafX=stemX+Math.sin(stemX*0.05+leafT*3+time)*5;
                const leafSize=5+growth*8;
                const angle=l*1.5+time*0.5;
                
                ctx.fillStyle=plant.color.replace('<alpha>','0.7');
                ctx.beginPath();
                ctx.ellipse(leafX,leafY,leafSize,leafSize*0.4,angle,0,Math.PI*2);
                ctx.fill();
            }
        }
        
        // Свечение Qₛ вокруг растения
        const qsLevel=Math.min(10,qs*plant.qsMult*growth);
        const glowRadius=15+qsLevel*5;
        const glow=ctx.createRadialGradient(stemX,stemBaseY-stemH*0.3,0,stemX,stemBaseY-stemH*0.3,glowRadius);
        const glowAlpha=0.15+qsLevel*0.05;
        glow.addColorStop(0,`rgba(100,255,130,${glowAlpha})`);
        glow.addColorStop(0.5,`rgba(100,200,100,${glowAlpha*0.5})`);
        glow.addColorStop(1,'rgba(0,0,0,0)');
        ctx.fillStyle=glow;
        ctx.fillRect(stemX-glowRadius,potY-potH-stemH-glowRadius,glowRadius*2,stemH+glowRadius*2+potH);
        
        // Частицы Qₛ вокруг растения
        const numParticles=Math.floor(qsLevel*3);
        for(let i=0;i<numParticles;i++){
            const angle=Math.random()*Math.PI*2;
            const dist=glowRadius*(0.3+Math.random()*0.7);
            const px=stemX+Math.cos(angle)*dist;
            const py=stemBaseY-stemH*0.3+Math.sin(angle)*dist;
            const alpha=glowAlpha*0.8;
            ctx.fillStyle=`rgba(100,255,150,${alpha})`;
            ctx.beginPath();ctx.arc(px,py,1.5,0,Math.PI*2);ctx.fill();
        }
        
        // Звуковая волна (для 440 и 432)
        if(plant.name!=='Тишина'){
            const freq=plant.name==='432 Гц'?432:440;
            const normFreq=freq/500;
            const waveY=potY-potH-stemH-25;
            
            ctx.strokeStyle=plant.color.replace('<alpha>','0.5');
            ctx.lineWidth=1.5;
            ctx.beginPath();
            for(let wx=stemX-40;wx<=stemX+40;wx+=2){
                const wy=waveY+Math.sin((wx-stemX)*0.3+time*normFreq*0.1)*8;
                if(wx===stemX-40) ctx.moveTo(wx,wy);
                else ctx.lineTo(wx,wy);
            }
            ctx.stroke();
        }
        
        // Подпись
        ctx.fillStyle='rgba(255,255,255,0.8)';
        ctx.font='bold 14px Georgia,serif';
        ctx.textAlign='center';
        ctx.fillText(plant.label+' '+plant.name,stemX,potY+25);
        
        const rawQs=qs*plant.qsMult*growth;
const qsDisplay=(Math.min(10,rawQs)).toFixed(1);
        ctx.fillText('Qₛ: +'+qsDisplay,stemX,potY+42);
    }
    
    // "Пол" — линия земли
    ctx.strokeStyle='rgba(255,255,255,0.2)';
    ctx.lineWidth=2;
    ctx.beginPath();ctx.moveTo(0,potY+5);ctx.lineTo(w,potY+5);ctx.stroke();
    
    // Подпись снизу
    ctx.fillStyle='rgba(255,255,255,0.4)';
    ctx.font='13px Georgia,serif';
    ctx.textAlign='center';
    ctx.fillText('Рост: '+t.toFixed(1)+' дней | Qₛ среды: +'+qs.toFixed(1),w/2,h-15);
    
    animId=requestAnimationFrame(drawFrame);
}

drawFrame();
window.addEventListener('beforeunload',()=>{if(animId)cancelAnimationFrame(animId);});
</script>

</body>
</html>
