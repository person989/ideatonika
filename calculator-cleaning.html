<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Калькулятор Эффективности Очистки • Идеатоника</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: linear-gradient(145deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            font-family: 'Georgia', 'Times New Roman', serif;
            padding: 2rem;
            display: flex; flex-direction: column; align-items: center;
        }
        .cosmic-bg { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 0; }
        .main-container {
            max-width: 800px; width: 100%; position: relative; z-index: 1;
            background: rgba(30, 40, 60, 0.85); backdrop-filter: blur(12px);
            border: 1px solid rgba(227, 184, 124, 0.4); border-radius: 32px;
            padding: 2.5rem; box-shadow: 0 20px 40px rgba(0,0,0,0.5);
        }
        h1 { font-size: 2.5rem; color: #f3e7c0; text-align: center; margin-bottom: 0.5rem; font-weight: 400; }
        .subtitle { text-align: center; color: #c0b090; font-style: italic; margin-bottom: 2rem; border-bottom: 1px solid #5d4a3a; padding-bottom: 1rem; }
        .calc-section { background: rgba(0,0,0,0.2); border-radius: 20px; padding: 2rem; margin-bottom: 2rem; border: 1px solid #5d4a3a; }
        .section-title { font-size: 1.4rem; color: #ffd54f; margin-bottom: 1.5rem; }
        .input-group { margin-bottom: 1.5rem; }
        .input-group label { display: flex; justify-content: space-between; align-items: center; color: #d0c8b8; font-size: 1rem; margin-bottom: 0.5rem; }
        .input-group label span { color: #ffd54f; font-weight: bold; font-size: 1.2rem; }
        .input-group input[type="range"] { width: 100%; -webkit-appearance: none; height: 8px; background: #5d4a3a; border-radius: 4px; outline: none; cursor: pointer; }
        .input-group input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; width: 22px; height: 22px; background: #ffd54f; border-radius: 50%; cursor: pointer; box-shadow: 0 0 10px rgba(255,215,80,0.5); }
        .input-group .range-labels { display: flex; justify-content: space-between; color: #706858; font-size: 0.8rem; margin-top: 0.3rem; }
        .input-group select { width: 100%; padding: 0.8rem 1rem; background: rgba(0,0,0,0.3); border: 1px solid #5d4a3a; border-radius: 10px; color: #f3e7c0; font-family: 'Georgia', serif; font-size: 1rem; }
        .input-group select option { background: #1a1a2e; color: #f3e7c0; }
        .result-box { background: rgba(255,215,80,0.1); border: 2px solid #ffd54f; border-radius: 20px; padding: 2rem; text-align: center; margin-top: 2rem; }
        .result-number { font-size: 4rem; font-weight: bold; color: #ffd54f; line-height: 1; }
        .result-label { color: #c0b090; font-size: 1.2rem; margin-top: 0.5rem; }
        .result-extra { color: #d0c8b8; font-size: 1rem; margin-top: 1rem; font-style: italic; }
        .result-formula { color: #a09080; font-style: italic; font-size: 0.9rem; margin-top: 1rem; font-family: 'Courier New', monospace; }
        .back-link { display: inline-block; margin-top: 1.5rem; color: #ffd54f; text-decoration: none; border: 1px solid #ffd54f; padding: 0.6rem 1.5rem; border-radius: 30px; transition: 0.2s; }
        .back-link:hover { background: #ffd54f; color: #1a1a2e; }
    </style>
</head>
<body>
<div class="cosmic-bg"></div>
<div class="main-container">

    <h1>🧂 Эффективность Очистки</h1>
    <div class="subtitle">Калькулятор семантического очищения (§47, Эксперимент SALT-CLEAN)</div>

    <div class="calc-section">
        <div class="section-title">📐 Параметры загрязнения и очистки</div>

        <!-- Q_pure — чистый кристалл -->
        <div class="input-group">
            <label>💎 Qₛ чистого предмета (до загрязнения): <span id="pureValue">900</span> усл. ед.</label>
            <input type="range" id="pureSlider" min="100" max="1000" value="900" step="10">
            <div class="range-labels"><span>100 (слабый)</span><span>1000 (мощный)</span></div>
        </div>

        <!-- Q_green — после загрязнения -->
        <div class="input-group">
            <label>☠️ Qₛ после загрязнения (до очистки): <span id="greenValue">400</span> усл. ед.</label>
            <input type="range" id="greenSlider" min="0" max="1000" value="400" step="10">
            <div class="range-labels"><span>0 (убит)</span><span>1000 (не загрязнён)</span></div>
        </div>

        <!-- Тип очистителя -->
        <div class="input-group">
            <label>🧹 Материал для очистки:</label>
            <select id="materialSelect">
                <option value="0.63">Поваренная соль (эффективность 63%)</option>
                <option value="0.79">Морская соль (эффективность 79%)</option>
                <option value="0.84">Шунгитовая крошка (эффективность 84%)</option>
                <option value="0.55">Активированный уголь (эффективность 55%)</option>
                <option value="0.45">Проточная вода (эффективность 45%)</option>
                <option value="0.33">Просто проветривание (эффективность 33%)</option>
            </select>
        </div>

        <!-- Время очистки -->
        <div class="input-group">
            <label>⏱️ Время очистки: <span id="timeValue">24</span> часа</label>
            <input type="range" id="timeSlider" min="1" max="72" value="24" step="1">
            <div class="range-labels"><span>1 час</span><span>72 часа</span></div>
        </div>
    </div>

    <!-- Результат -->
    <div class="result-box" id="resultBox">
        <div class="result-number" id="resultNumber">—</div>
        <div class="result-label" id="resultLabel">Эффективность очистки</div>
        <div class="result-extra" id="resultExtra"></div>
        <div class="result-formula" id="resultFormula"></div>
    </div>

    <div style="text-align: center;">
        <a href="semantic-calculators.html" class="back-link">← К списку калькуляторов</a>
    </div>

</div>

<script>
    const pureSlider = document.getElementById('pureSlider');
    const greenSlider = document.getElementById('greenSlider');
    const materialSelect = document.getElementById('materialSelect');
    const timeSlider = document.getElementById('timeSlider');
    const pureValue = document.getElementById('pureValue');
    const greenValue = document.getElementById('greenValue');
    const timeValue = document.getElementById('timeValue');
    const resultNumber = document.getElementById('resultNumber');
    const resultLabel = document.getElementById('resultLabel');
    const resultExtra = document.getElementById('resultExtra');
    const resultFormula = document.getElementById('resultFormula');

    pureSlider.addEventListener('input', () => { pureValue.textContent = parseInt(pureSlider.value); calculate(); });
    greenSlider.addEventListener('input', () => { greenValue.textContent = parseInt(greenSlider.value); calculate(); });
    materialSelect.addEventListener('change', calculate);
    timeSlider.addEventListener('input', () => { timeValue.textContent = parseInt(timeSlider.value); calculate(); });

    function calculate() {
        const Qpure = parseFloat(pureSlider.value);
        const Qgreen = parseFloat(greenSlider.value);
        const baseEfficiency = parseFloat(materialSelect.value);
        const hours = parseFloat(timeSlider.value);

        // Эффективность растёт со временем, но не мгновенно (экспонента)
        const timeCorrection = 1 - Math.exp(-hours / 12);
        const effectiveEfficiency = baseEfficiency * timeCorrection;

        // Очищенный заряд
        const Qcleaned = Qgreen + (Qpure - Qgreen) * effectiveEfficiency;
        const percentRestored = ((Qcleaned - Qgreen) / (Qpure - Qgreen)) * 100;

        // Ограничения
        if (Qgreen >= Qpure) {
            resultNumber.textContent = '0%';
            resultLabel.textContent = 'Предмет не загрязнён!';
            resultExtra.textContent = 'Очистка не требуется.';
            resultFormula.textContent = 'Q_green ≥ Q_pure — очистка не нужна.';
            return;
        }

        resultNumber.textContent = percentRestored.toFixed(1) + '%';
        resultLabel.textContent = 'Восстановление Qₛ';

        const materialName = materialSelect.options[materialSelect.selectedIndex].text.split(' (')[0];
        let extra = `Очиститель: ${materialName}. `;
        if (percentRestored >= 90) extra += '✅ Почти идеальная очистка! Предмет снова «светится».';
        else if (percentRestored >= 70) extra += '👍 Хорошая очистка. Большая часть негатива ушла.';
        else if (percentRestored >= 40) extra += '🟰 Умеренная очистка. Нужно больше времени или другой материал.';
        else extra += '⚠️ Слабая очистка. Попробуйте шунгит или морскую соль на более долгий срок.';
        resultExtra.textContent = extra;

        resultFormula.textContent = `Q_clean = ${Qgreen.toFixed(0)} + (${Qpure.toFixed(0)} — ${Qgreen.toFixed(0)}) · ${effectiveEfficiency.toFixed(3)} = ${Qcleaned.toFixed(0)} | Восстановлено: ${percentRestored.toFixed(1)}%`;
    }

    calculate();
</script>

</body>
</html>
