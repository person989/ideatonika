<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Калькулятор «Когда меня найдут?» • Идеатоника</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: linear-gradient(145deg, #1a1a2e 0%, #16213e 100%); min-height: 100vh; font-family: 'Georgia', serif; padding: 2rem; display: flex; flex-direction: column; align-items: center; }
        .cosmic-bg { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 0; }
        .main-container { max-width: 800px; width: 100%; position: relative; z-index: 1; background: rgba(30,40,60,0.85); backdrop-filter: blur(12px); border: 1px solid rgba(227,184,124,0.4); border-radius: 32px; padding: 2.5rem; box-shadow: 0 20px 40px rgba(0,0,0,0.5); }
        h1 { font-size: 2.5rem; color: #f3e7c0; text-align: center; margin-bottom: 0.5rem; font-weight: 400; }
        .subtitle { text-align: center; color: #c0b090; font-style: italic; margin-bottom: 2rem; border-bottom: 1px solid #5d4a3a; padding-bottom: 1rem; }
        .calc-section { background: rgba(0,0,0,0.2); border-radius: 20px; padding: 2rem; margin-bottom: 2rem; border: 1px solid #5d4a3a; }
        .section-title { font-size: 1.4rem; color: #ffd54f; margin-bottom: 1.5rem; }
        .input-group { margin-bottom: 1.5rem; }
        .input-group label { display: flex; justify-content: space-between; align-items: center; color: #d0c8b8; font-size: 1rem; margin-bottom: 0.5rem; }
        .input-group label span { color: #ffd54f; font-weight: bold; font-size: 1.2rem; }
        .input-group input[type="range"] { width: 100%; -webkit-appearance: none; height: 8px; background: #5d4a3a; border-radius: 4px; outline: none; cursor: pointer; }
        .input-group input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; width: 22px; height: 22px; background: #ffd54f; border-radius: 50%; cursor: pointer; box-shadow: 0 0 10px rgba(255,215,80,0.5); }
        .input-group .range-labels { display: flex; justify-content: space-between; color: #706858; font-size: 0.8rem; margin-top: 0.3rem; }
        .input-group select { width: 100%; padding: 0.8rem 1rem; background: rgba(0,0,0,0.3); border: 1px solid #5d4a3a; border-radius: 10px; color: #f3e7c0; font-family: 'Georgia', serif; font-size: 1rem; }
        .input-group select option { background: #1a1a2e; color: #f3e7c0; }
        .result-box { background: rgba(255,215,80,0.1); border: 2px solid #ffd54f; border-radius: 20px; padding: 2rem; text-align: center; margin-top: 2rem; }
        .result-number { font-size: 4rem; font-weight: bold; color: #ffd54f; line-height: 1; }
        .result-label { color: #c0b090; font-size: 1.2rem; margin-top: 0.5rem; }
        .result-extra { color: #d0c8b8; font-size: 1rem; margin-top: 1rem; font-style: italic; }
        .result-year { color: #ffd54f; font-size: 1.5rem; margin-top: 0.5rem; font-weight: bold; }
        .result-formula { color: #a09080; font-style: italic; font-size: 0.9rem; margin-top: 1rem; font-family: 'Courier New', monospace; }
        .back-link { display: inline-block; margin-top: 1.5rem; color: #ffd54f; text-decoration: none; border: 1px solid #ffd54f; padding: 0.6rem 1.5rem; border-radius: 30px; transition: 0.2s; }
        .back-link:hover { background: #ffd54f; color: #1a1a2e; }
    </style>
</head>
<body>
<div class="cosmic-bg"></div>
<div class="main-container">

    <h1>🔍 Когда меня найдут?</h1>
    <div class="subtitle">Калькулятор вероятности открытия вашего наследия (§48, история Алексея)</div>

    <div class="calc-section">
        <div class="section-title">📐 Характеристики вашего наследия</div>

        <!-- Тип наследия -->
        <div class="input-group">
            <label>📦 Что вы оставили миру:</label>
            <select id="legacyTypeSelect">
                <option value="1">Заметки в столе / личный дневник (×1)</option>
                <option value="3" selected>Сайт в интернете (×3)</option>
                <option value="5">Опубликованная книга / научная статья (×5)</option>
                <option value="8">Вирусный контент, соцсети (×8)</option>
                <option value="10">Памятник, здание, организация (×10)</option>
            </select>
        </div>

        <!-- Размер аудитории сейчас -->
        <div class="input-group">
            <label>👥 Сколько людей уже знают о вашем труде: <span id="audienceValue">10</span> человек</label>
            <input type="range" id="audienceSlider" min="1" max="10000" value="10" step="1">
            <div class="range-labels"><span>1 (только вы)</span><span>100</span><span>10 000</span></div>
        </div>

        <!-- Качество контента (Qₛ труда) -->
        <div class="input-group">
            <label>🌟 Семантический заряд вашего труда (Qₛ): <span id="qualityValue">+5</span></label>
            <input type="range" id="qualitySlider" min="1" max="10" value="5" step="0.5">
            <div class="range-labels"><span>1 (сырой черновик)</span><span>5</span><span>10 (шедевр)</span></div>
        </div>

        <!-- Cₛ труда (структурированность) -->
        <div class="input-group">
            <label>🎯 Когерентность изложения (Cₛ): <span id="coherenceValue">0.7</span></label>
            <input type="range" id="coherenceSlider" min="0.1" max="1" value="0.7" step="0.01">
            <div class="range-labels"><span>0.1 (хаос, бред)</span><span>1.0 (кристальная ясность)</span></div>
        </div>

        <!-- Эпоха (чувствительность человечества) -->
        <div class="input-group">
            <label>🌐 Восприимчивость эпохи (χ человечества сейчас):</label>
            <select id="epochSelect">
                <option value="1">Каменный век / Средневековье (низкая χ) — ×1</option>
                <option value="3" selected="selected">XXI век, интернет, но много шума — ×3</option>
                <option value="7">Эпоха Просвещения / духовного поиска — ×7</option>
                <option value="10">Золотой век ноосферы (все ищут Смысл) — ×10</option>
            </select>
        </div>
    </div>

    <!-- Результат -->
    <div class="result-box" id="resultBox">
        <div class="result-number" id="resultNumber">—</div>
        <div class="result-label" id="resultLabel">До первого значимого открытия</div>
        <div class="result-year" id="resultYear"></div>
        <div class="result-extra" id="resultExtra"></div>
        <div class="result-formula" id="resultFormula"></div>
    </div>

    <div style="text-align: center;">
        <a href="semantic-calculators.html" class="back-link">← К списку калькуляторов</a>
    </div>

</div>

<script>
    const legacyTypeSelect = document.getElementById('legacyTypeSelect');
    const audienceSlider = document.getElementById('audienceSlider');
    const qualitySlider = document.getElementById('qualitySlider');
    const coherenceSlider = document.getElementById('coherenceSlider');
    const epochSelect = document.getElementById('epochSelect');
    const audienceValue = document.getElementById('audienceValue');
    const qualityValue = document.getElementById('qualityValue');
    const coherenceValue = document.getElementById('coherenceValue');
    const resultNumber = document.getElementById('resultNumber');
    const resultLabel = document.getElementById('resultLabel');
    const resultYear = document.getElementById('resultYear');
    const resultExtra = document.getElementById('resultExtra');
    const resultFormula = document.getElementById('resultFormula');

    audienceSlider.addEventListener('input', () => { audienceValue.textContent = parseInt(audienceSlider.value); calculate(); });
    qualitySlider.addEventListener('input', () => { qualityValue.textContent = '+' + parseFloat(qualitySlider.value).toFixed(1); calculate(); });
    coherenceSlider.addEventListener('input', () => { coherenceValue.textContent = parseFloat(coherenceSlider.value).toFixed(2); calculate(); });
    [legacyTypeSelect, epochSelect].forEach(s => s.addEventListener('change', calculate));

    function calculate() {
        const legacyType = parseInt(legacyTypeSelect.value);
        const audience = parseInt(audienceSlider.value);
        const Qwork = parseFloat(qualitySlider.value);
        const Cwork = parseFloat(coherenceSlider.value);
        const epoch = parseInt(epochSelect.value);

        // Формула: время (лет) = 100 / (legacyType × audience × Qwork × Cwork × epoch / 100)
        const factor = legacyType * Math.max(1, audience) * Qwork * Cwork * epoch;
        const yearsToDiscovery = factor > 0 ? Math.round(10000 / factor) : 9999;
        const clampedYears = Math.min(9999, Math.max(0, yearsToDiscovery));

        const currentYear = 2026;
        const discoveryYear = currentYear + clampedYears;

        let timeText = '';
        if (clampedYears === 0) timeText = 'Уже найдено!';
        else if (clampedYears < 1) timeText = 'Менее года';
        else if (clampedYears < 100) timeText = clampedYears + ' лет';
        else if (clampedYears < 1000) timeText = Math.round(clampedYears / 100) + ' веков';
        else timeText = Math.round(clampedYears / 1000) + ' тысячелетий';

        resultNumber.textContent = timeText;
        resultLabel.textContent = 'До первого значимого открытия';
        resultYear.textContent = 'Примерно в ' + discoveryYear + ' году';

        let extra = '';
        if (clampedYears === 0) {
            extra = '🎉 Ваше наследие УЖЕ найдено и работает! Вы — наш современник-первооткрыватель.';
        } else if (clampedYears < 5) {
            extra = '🚀 Очень скоро! Кто-то уже на пороге вашего открытия.';
        } else if (clampedYears < 25) {
            extra = '📅 В ближайшие десятилетия. Возможно в близжайших годах — студент найдёт ваш сайт в архивах.';
        } else if (clampedYears < 75) {
            extra = '⏳ В этом веке. Возможно, потребуется смена поколений, чтобы ваши идеи были услышаны.';
        } else if (clampedYears < 200) {
            extra = '📜 В ближайшие столетия. Ваше наследие будет ждать своего часа, как труды Леонардо да Винчи.';
        } else if (clampedYears < 1000) {
            extra = '🏺 Через многие века. Ваш труд — капсула времени. Археологи будущего будут поражены.';
        } else {
            extra = '🌌 Почти вечность. Но если ваш Qₛ высок, даже через тысячелетия луч Света пробьётся сквозь тьму забвения.';
        }
        resultExtra.textContent = extra;

        resultFormula.textContent = `t = 10000 / (${legacyType} · ${audience} · ${Qwork.toFixed(1)} · ${Cwork.toFixed(2)} · ${epoch}) = ${clampedYears} лет`;
    }

    calculate();
</script>

</body>
</html>
