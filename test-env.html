<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Тест: Храм или Бункер? • Идеатоника</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: linear-gradient(145deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            font-family: 'Georgia', 'Times New Roman', serif;
            padding: 2rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            transition: background 0.5s ease;
        }
        .cosmic-bg {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle at 30% 40%, rgba(255,215,150,0.08) 0%, transparent 50%),
                        radial-gradient(circle at 80% 70%, rgba(100,150,255,0.05) 0%, transparent 60%);
            pointer-events: none; z-index: 0;
        }
        .test-container {
            max-width: 700px;
            width: 100%;
            position: relative;
            z-index: 1;
            background: rgba(30, 40, 60, 0.85);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(227, 184, 124, 0.4);
            border-radius: 32px;
            padding: 2.5rem;
            box-shadow: 0 20px 40px rgba(0,0,0,0.5);
            transition: border-color 0.3s ease;
        }
        
        .test-header {
            text-align: center;
            margin-bottom: 2rem;
        }
        .test-header h1 {
            font-size: 2.2rem;
            color: #f3e7c0;
            margin-bottom: 0.5rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        .progress-bar {
            width: 100%;
            height: 6px;
            background: rgba(0,0,0,0.3);
            border-radius: 3px;
            margin: 1.5rem 0;
        }
        .progress-fill {
            height: 100%;
            background: #81c784;
            border-radius: 3px;
            width: 0%;
            transition: width 0.3s ease;
        }
        .progress-text {
            text-align: right;
            color: #a09080;
            font-size: 0.8rem;
            margin-top: 0.3rem;
        }
        
        .question-box {
            margin-bottom: 2rem;
        }
        .question-text {
            color: #f3e7c0;
            font-size: 1.3rem;
            margin-bottom: 1.5rem;
            line-height: 1.5;
        }
        .options {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .option {
            background: rgba(0,0,0,0.2);
            border: 1px solid #5d4a3a;
            border-radius: 16px;
            padding: 1rem 1.5rem;
            cursor: pointer;
            transition: all 0.2s ease;
            color: #d0c8b8;
            display: flex;
            align-items: center;
            gap: 15px;
        }
        .option:hover {
            background: rgba(129, 199, 132, 0.15);
            border-color: #81c784;
        }
        .option.selected {
            background: rgba(129, 199, 132, 0.25);
            border-color: #81c784;
            color: #f3e7c0;
        }
        .option-marker {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            border: 2px solid #5d4a3a;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }
        .option.selected .option-marker {
            border-color: #81c784;
            background: #81c784;
            box-shadow: 0 0 10px #81c784;
        }
        .option.selected .option-marker::after {
            content: "✓";
            color: #1a1a2e;
            font-weight: bold;
        }
        .option-text {
            flex: 1;
        }
        
        .nav-buttons {
            display: flex;
            justify-content: space-between;
            margin-top: 2rem;
            gap: 15px;
        }
        .btn {
            background: transparent;
            border: 1.5px solid #81c784;
            color: #81c784;
            padding: 0.8rem 1.8rem;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 40px;
            cursor: pointer;
            transition: 0.2s;
            font-family: inherit;
        }
        .btn:hover {
            background: #81c784;
            color: #1a1a2e;
        }
        .btn:disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }
        .btn-secondary {
            border-color: #5d4a3a;
            color: #a09080;
        }
        .btn-secondary:hover {
            background: #5d4a3a;
            color: #d0c8b8;
        }
        
        .result-container {
            text-align: center;
        }
        .result-score {
            font-size: 5rem;
            font-weight: bold;
            margin: 1rem 0;
        }
        .result-scale {
            font-size: 1.2rem;
            margin-bottom: 1.5rem;
        }
        .result-comment {
            background: rgba(0,0,0,0.2);
            border-radius: 20px;
            padding: 1.5rem;
            margin: 1.5rem 0;
            line-height: 1.6;
        }
        .result-advice {
            background: rgba(129, 199, 132, 0.1);
            border-left: 4px solid #81c784;
            padding: 1.2rem 1.5rem;
            border-radius: 0 12px 12px 0;
            text-align: left;
        }
        
        .hidden {
            display: none !important;
        }
        
        .back-link {
            display: inline-block;
            margin-top: 1.5rem;
            color: #81c784;
            text-decoration: none;
            font-size: 0.9rem;
        }
        .back-link:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body id="mainBody">
<div class="cosmic-bg"></div>
<div class="test-container" id="testContainer">
    
    <div class="test-header">
        <h1>
            <span>🏛️</span>
            <span id="testTitle">Храм или Бункер?</span>
            <span>🏠</span>
        </h1>
        <div class="progress-bar">
            <div class="progress-fill" id="progressFill"></div>
        </div>
        <div class="progress-text" id="progressText">Вопрос 1 из 10</div>
    </div>
    
    <div id="questionContainer"></div>
    
    <div class="nav-buttons">
        <button class="btn btn-secondary" id="prevBtn" disabled>← Назад</button>
        <button class="btn btn-secondary" id="exitBtn">🚪 Выйти</button>
        <button class="btn" id="nextBtn">Далее →</button>
    </div>
    
    <div style="text-align: center;">
        <a href="diagnostics-hub.html" class="back-link">← Вернуться в Хаб Диагностики</a>
    </div>
</div>

<script>
    (function() {
        const questions = [
            {
                text: "Из какого материала сделаны стены в вашей комнате / доме?",
                options: [
                    { text: "Бетон, железобетон, пластиковые панели", value: -3 },
                    { text: "Кирпич, гипсокартон, виниловые обои", value: -1 },
                    { text: "Дерево (вагонка, брус), бумажные обои", value: 2 },
                    { text: "Натуральный камень, массив дерева, глина (саман)", value: 4 }
                ]
            },
            {
                text: "Какой пол у вас под ногами?",
                options: [
                    { text: "Линолеум, ламинат, ковролин на бетоне", value: -2 },
                    { text: "Паркет, деревянные доски", value: 2 },
                    { text: "Натуральный камень, керамическая плитка", value: 1 },
                    { text: "Земля, пробка, массив дерева по лагам", value: 4 }
                ]
            },
            {
                text: "Есть ли в вашем доме живые растения?",
                options: [
                    { text: "Нет, и не планирую", value: -3 },
                    { text: "Один-два кактуса или искусственные цветы", value: -1 },
                    { text: "Несколько горшков на подоконнике", value: 2 },
                    { text: "Много растений, они повсюду, я за ними ухаживаю", value: 5 }
                ]
            },
            {
                text: "Есть ли у вас домашние животные?",
                options: [
                    { text: "Нет и не хочу", value: -1 },
                    { text: "Нет, но хотелось бы", value: 1 },
                    { text: "Да, одно небольшое (кошка, собака, грызун)", value: 3 },
                    { text: "Да, несколько, или крупное животное", value: 5 }
                ]
            },
            {
                text: "Как часто вы проветриваете комнату / делаете влажную уборку?",
                options: [
                    { text: "Редко, у меня «творческий беспорядок»", value: -3 },
                    { text: "Раз в неделю или реже", value: -1 },
                    { text: "Несколько раз в неделю", value: 2 },
                    { text: "Каждый день, люблю чистоту и свежесть", value: 4 }
                ]
            },
            {
                text: "Какие предметы преобладают в вашем интерьере?",
                options: [
                    { text: "Пластик, синтетика, ДСП, стекло, металл", value: -2 },
                    { text: "Смесь натурального и синтетики", value: 0 },
                    { text: "В основном дерево, ткани, камень", value: 3 },
                    { text: "Антиквариат, намоленные иконы, кристаллы, живые цветы", value: 5 }
                ]
            },
            {
                text: "Есть ли в вашем доме «красный угол», алтарь или место для молитвы/медитации?",
                options: [
                    { text: "Нет, это не для меня", value: -2 },
                    { text: "Нет, но я молюсь/медитирую где придётся", value: 0 },
                    { text: "Да, есть небольшой уголок с иконой или свечой", value: 3 },
                    { text: "Да, это центр моего дома, намоленное место", value: 6 }
                ]
            },
            {
                text: "Какая атмосфера обычно царит в вашем доме?",
                options: [
                    { text: "Тяжёлая, давящая, часто ссоримся", value: -4 },
                    { text: "Нейтральная, «как в гостинице»", value: 0 },
                    { text: "Уютная, спокойная, «хорошо»", value: 3 },
                    { text: "Радостная, светлая, «благодатная»", value: 6 }
                ]
            },
            {
                text: "Есть ли в вашем доме сломанные вещи, которые вы давно не чините, или хлам, который «жалко выбросить»?",
                options: [
                    { text: "Да, целые завалы", value: -4 },
                    { text: "Есть немного на балконе / в кладовке", value: -1 },
                    { text: "Нет, я регулярно избавляюсь от ненужного", value: 2 },
                    { text: "У меня минимализм, только нужное и любимое", value: 4 }
                ]
            },
            {
                text: "Как часто вы зажигаете дома свечи (не для романтики, а для «души»)?",
                options: [
                    { text: "Никогда", value: -2 },
                    { text: "Очень редко, по праздникам", value: 0 },
                    { text: "Иногда, когда хочется уюта", value: 2 },
                    { text: "Регулярно, это мой ритуал", value: 5 }
                ]
            }
        ];
        
        const totalQuestions = questions.length;
        let currentIndex = 0;
        let answers = new Array(totalQuestions).fill(null);
        
        const questionContainer = document.getElementById('questionContainer');
        const prevBtn = document.getElementById('prevBtn');
        const nextBtn = document.getElementById('nextBtn');
        const exitBtn = document.getElementById('exitBtn');
        const progressFill = document.getElementById('progressFill');
        const progressText = document.getElementById('progressText');
        const testContainer = document.getElementById('testContainer');
        const mainBody = document.getElementById('mainBody');
        const testTitle = document.getElementById('testTitle');
        
        let isResultMode = false;
        
        function renderQuestion(index) {
            const q = questions[index];
            let html = `<div class="question-box">`;
            html += `<div class="question-text">${index + 1}. ${q.text}</div>`;
            html += `<div class="options">`;
            
            q.options.forEach((opt) => {
                const isSelected = answers[index] === opt.value;
                html += `
                    <div class="option ${isSelected ? 'selected' : ''}" data-value="${opt.value}">
                        <div class="option-marker"></div>
                        <div class="option-text">${opt.text}</div>
                    </div>
                `;
            });
            
            html += `</div></div>`;
            questionContainer.innerHTML = html;
            
            document.querySelectorAll('.option').forEach(opt => {
                opt.addEventListener('click', () => {
                    const value = parseInt(opt.dataset.value);
                    answers[index] = value;
                    renderQuestion(index);
                });
            });
            
            const progress = ((index + 1) / totalQuestions) * 100;
            progressFill.style.width = progress + '%';
            progressText.textContent = `Вопрос ${index + 1} из ${totalQuestions}`;
            
            prevBtn.disabled = index === 0;
            if (index === totalQuestions - 1) {
                nextBtn.textContent = '🎉 Завершить';
            } else {
                nextBtn.textContent = 'Далее →';
            }
        }
        
        function calculateResult() {
            const sum = answers.reduce((acc, val) => acc + val, 0);
            // Максимум около 40, минимум около -25
            // Приводим к шкале от -10 до +10
            let normalized = Math.round(sum / 4);
            return Math.max(-10, Math.min(10, normalized));
        }
        
        function getResultColor(rank) {
            if (rank >= 7) return '#ffd54f';
            if (rank >= 4) return '#81c784';
            if (rank >= 1) return '#90caf9';
            if (rank >= 0) return '#b0bec5';
            if (rank >= -3) return '#a1887f';
            if (rank >= -6) return '#78909c';
            return '#455a64';
        }
        
        function getResultComment(rank) {
            if (rank >= 8) return "🏛️ Вы живёте в ХРАМЕ. Ваше окружение — мощный генератор Света. Оно исцеляет вас и ваших гостей. Высокий ранг!";
            if (rank >= 5) return "🌿 Вы живёте в САДУ. Очень хорошее, живое окружение. Много натуральных материалов, plants, уют. Ваш дом восстанавливает ваши силы.";
            if (rank >= 2) return "🏠 Вы живёте в ДОМЕ. Неплохое, нейтрально-положительное окружение. Есть над чем работать, но в целом у вас хороший «семантический тыл».";
            if (rank >= 0) return "🪑 Вы живёте в КВАРТИРЕ. Нейтральное окружение. Не вредит, но и не помогает. Добавьте живых растений, уберите хлам, замените пластик на дерево.";
            if (rank >= -3) return "🏢 Вы живёте в ОФИСЕ. Окружение с лёгким негативом. Много синтетики, мало жизни. Это истощает вас. Проводите больше времени на природе.";
            if (rank >= -6) return "🏭 Вы живёте в БУНКЕРЕ. Серьёзный перекос в сторону «мёртвых» материалов. Бетон, пластик, хлам. Ваше поле не восстанавливается. Срочно меняйте обстановку.";
            return "💀 Вы живёте в СКЛЕПЕ. Окружение с крайне низким Qₛ. Возможно, «проклятое» место или вы в глубокой депрессии. Срочно требуется очищение пространства и, возможно, переезд.";
        }
        
        function getResultAdvice(rank) {
            if (rank >= 5) return "🌟 Совет: Поддерживайте эту чистоту! Регулярно очищайте пространство солью, звуком (колокольчик, поющие чаши), проветривайте. Ваш дом — ваша крепость Света.";
            if (rank >= 2) return "🌱 Совет: Добавьте «живого». Заведите ещё одно растение, поставьте вазу с живыми цветами, используйте аромалампу с эфирными маслами. Замените пластиковые вещи на деревянные.";
            if (rank >= 0) return "🧹 Совет: Начните с уборки. Разберите завалы на балконе и в шкафах. Выбросите сломанные вещи. Купите хотя бы один кристалл (кварц, аметист) и поставьте на видное место.";
            if (rank >= -3) return "🪴 Совет: Вам срочно нужно «озелениться». Купите неприхотливое растение (хлорофитум, замиокулькас). Замените шторы на льняные. Чаще проветривайте и делайте влажную уборку с солью.";
            if (rank >= -6) return "🆘 Совет: Это кризис. Начните с малого: выбросите 10 ненужных вещей. Купите деревянную разделочную доску вместо пластиковой. Повесьте на стену картину с пейзажем. Каждый день зажигайте свечу хотя бы на 10 минут.";
            return "🚨 Совет: Вам нужна радикальная чистка. Пригласите священника освятить жильё или проведите ритуал очищения солью и шалфеем. Если есть возможность — переезжайте. Ваше здоровье и психика под угрозой.";
        }
        
        function showResult() {
            isResultMode = true;
            const rank = calculateResult();
            const color = getResultColor(rank);
            const comment = getResultComment(rank);
            const advice = getResultAdvice(rank);
            
            mainBody.style.background = `linear-gradient(145deg, ${color}20 0%, #16213e 100%)`;
            testContainer.style.borderColor = color;
            
            let html = `<div class="result-container">`;
            html += `<h2 style="color: ${color};">Ваш результат</h2>`;
            html += `<div class="result-score" style="color: ${color};">${rank > 0 ? '+' : ''}${rank}</div>`;
            html += `<div class="result-scale">Ранг вашего окружения (от -10 до +10)</div>`;
            html += `<div class="result-comment" style="color: #d0c8b8;">${comment}</div>`;
            html += `<div class="result-advice" style="color: #d0c8b8;">${advice}</div>`;
            html += `<p style="margin-top: 1.5rem; color: #a09080; font-style: italic;">Окружение формирует поле. Изменив его, вы измените себя.</p>`;
            html += `</div>`;
            
            questionContainer.innerHTML = html;
            
            prevBtn.classList.add('hidden');
            nextBtn.classList.add('hidden');
            exitBtn.textContent = '🔄 Пройти заново';
            exitBtn.classList.remove('btn-secondary');
            exitBtn.classList.add('btn');
            
            testTitle.textContent = `Результат: Ранг = ${rank > 0 ? '+' : ''}${rank}`;
            progressText.textContent = `Тест завершён`;
            
 // --- СОХРАНЕНИЕ В ПАСПОРТ (УНИВЕРСАЛЬНЫЙ БЛОК + ИСТОРИЯ) ---
setTimeout(function() {
    const passportBtn = document.createElement('button');
    passportBtn.textContent = '💾 Сохранить результат в Семантический Паспорт';
    passportBtn.style.cssText = 'display: block; margin: 2rem auto; padding: 1rem 2rem; background: #a1887f; color: white; border: none; border-radius: 40px; font-size: 1rem; cursor: pointer; font-weight: bold; transition: 0.3s;';
    passportBtn.onmouseover = () => passportBtn.style.background = '#795548';
    passportBtn.onmouseout = () => passportBtn.style.background = '#a1887f';

    passportBtn.addEventListener('click', function() {
        const scoreElement = document.querySelector('.result-score');
        if (scoreElement) {
            const resultValue = parseFloat(scoreElement.textContent);
            if (!isNaN(resultValue)) {
                // 1. Сохраняем для Паспорта (как раньше)
                localStorage.setItem('ideatonika_test_env', resultValue);
                // 2. Сохраняем в историю (НОВОЕ!)
                saveToHistory('env_history', resultValue);
                
                passportBtn.textContent = '✅ Сохранено в Паспорт!';
                passportBtn.style.background = '#4e342e';
                passportBtn.style.color = 'white';
                passportBtn.disabled = true;
            }
        }
    });

    const container = document.querySelector('.result-container') || document.getElementById('questionContainer');
    if (container) {
        container.appendChild(passportBtn);
    }
}, 100);

// Функция сохранения истории (НОВАЯ!)
function saveToHistory(historyKey, value) {
    const raw = localStorage.getItem(historyKey);
    const history = raw ? JSON.parse(raw) : [];
    history.push({
        date: new Date().toISOString().split('T')[0],
        value: value
    });
    localStorage.setItem(historyKey, JSON.stringify(history));
}

// ========== КНОПКА "ПОДЕЛИТЬСЯ РЕЗУЛЬТАТОМ" ==========
setTimeout(function() {
    const shareContainer = document.createElement('div');
    shareContainer.style.cssText = 'text-align: center; margin-top: 1.5rem;';

    const shareBtn = document.createElement('button');
    shareBtn.textContent = '📤 Поделиться результатом';
    shareBtn.style.cssText = 'display: block; margin: 0 auto 0.8rem auto; padding: 0.8rem 2rem; background: transparent; color: #81c784; border: 1.5px solid #81c784; border-radius: 40px; font-size: 1rem; cursor: pointer; font-weight: bold; transition: 0.3s; font-family: Georgia, serif;';
    shareBtn.onmouseover = () => shareBtn.style.background = '#81c784';
    shareBtn.onmouseout = () => shareBtn.style.background = 'transparent';
    shareBtn.onmouseover = () => shareBtn.style.color = '#1a1a2e';
    shareBtn.onmouseout = () => shareBtn.style.color = '#81c784';

    shareBtn.addEventListener('click', function() {
        // Получаем название теста из заголовка страницы
        const testName = document.title.replace(' • Идеатоника', '').trim();
        
        // Получаем результат из элемента .result-score
        const scoreElement = document.querySelector('.result-score');
        let resultText = '';
        if (scoreElement) {
            resultText = scoreElement.textContent.trim();
        }
        
        // Получаем комментарий из элемента .result-comment или .result-interpretation
        const commentElement = document.querySelector('.result-comment') || document.querySelector('.result-interpretation');
        let commentText = '';
        if (commentElement) {
            commentText = commentElement.textContent.trim();
        }
        
        // Формируем текст для отправки
        const shareText = `🧪 Я прошёл тест «${testName}» на портале Идеатоника!\n\n` +
            `📊 Мой результат: ${resultText}\n` +
            `💬 ${commentText}\n\n` +
            `🎯 А какой результат у тебя?\n` +
            `👉 Пройти тест: ${window.location.href}\n\n` +
            `🌌 Идеатоника — физика смысла.`;
        
        // Пытаемся использовать Web Share API (мобильные устройства)
        if (navigator.share) {
            navigator.share({
                title: `Мой результат теста «${testName}»`,
                text: shareText,
                url: window.location.href
            }).catch(() => {
                // Если не получилось — копируем в буфер
                copyToClipboard(shareText);
            });
        } else {
            // Если Web Share API не поддерживается — копируем в буфер
            copyToClipboard(shareText);
        }
    });

    function copyToClipboard(text) {
        if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(text).then(() => {
                const originalText = shareBtn.textContent;
                shareBtn.textContent = '✅ Скопировано! Отправь другу';
                shareBtn.style.borderColor = '#ffd54f';
                shareBtn.style.color = '#ffd54f';
                setTimeout(() => {
                    shareBtn.textContent = originalText;
                    shareBtn.style.borderColor = '#81c784';
                    shareBtn.style.color = '#81c784';
                }, 2500);
            }).catch(() => {
                fallbackCopy(text);
            });
        } else {
            fallbackCopy(text);
        }
    }

    function fallbackCopy(text) {
        const textarea = document.createElement('textarea');
        textarea.value = text;
        textarea.style.position = 'fixed';
        textarea.style.left = '-9999px';
        document.body.appendChild(textarea);
        textarea.select();
        try {
            document.execCommand('copy');
            const originalText = shareBtn.textContent;
            shareBtn.textContent = '✅ Скопировано! Отправь другу';
            shareBtn.style.borderColor = '#ffd54f';
            shareBtn.style.color = '#ffd54f';
            setTimeout(() => {
                shareBtn.textContent = originalText;
                shareBtn.style.borderColor = '#81c784';
                shareBtn.style.color = '#81c784';
            }, 2500);
        } catch(e) {
            shareBtn.textContent = '❌ Не удалось скопировать';
            shareBtn.style.borderColor = '#ef5350';
            shareBtn.style.color = '#ef5350';
        }
        document.body.removeChild(textarea);
    }

    // Добавляем подсказку
    const hint = document.createElement('div');
    hint.style.cssText = 'color: #a09080; font-size: 0.8rem; font-style: italic;';
    hint.textContent = 'Нажмите, чтобы скопировать результат и отправить другу';
    shareContainer.appendChild(shareBtn);
    shareContainer.appendChild(hint);

    // Ищем контейнер с результатом
    const container = document.querySelector('.result-container') || document.getElementById('questionContainer');
    if (container) {
        container.appendChild(shareContainer);
    }
}, 100);

        }
        
        function resetTest() {
            isResultMode = false;
            currentIndex = 0;
            answers = new Array(totalQuestions).fill(null);
            
            mainBody.style.background = '';
            testContainer.style.borderColor = '';
            testTitle.textContent = 'Храм или Бункер?';
            
            prevBtn.classList.remove('hidden');
            nextBtn.classList.remove('hidden');
            exitBtn.textContent = '🚪 Выйти';
            exitBtn.classList.add('btn-secondary');
            
            renderQuestion(0);
        }
        
        prevBtn.addEventListener('click', () => {
            if (currentIndex > 0) {
                currentIndex--;
                renderQuestion(currentIndex);
            }
        });
        
        nextBtn.addEventListener('click', () => {
            if (answers[currentIndex] === null) {
                alert('Пожалуйста, выберите один из вариантов ответа.');
                return;
            }
            
            if (currentIndex < totalQuestions - 1) {
                currentIndex++;
                renderQuestion(currentIndex);
            } else {
                if (answers.includes(null)) {
                    alert('Пожалуйста, ответьте на все вопросы.');
                    return;
                }
                showResult();
            }
        });
        
        exitBtn.addEventListener('click', () => {
            if (isResultMode) {
                resetTest();
            } else {
                if (confirm('Вы уверены, что хотите выйти? Прогресс будет потерян.')) {
                    window.location.href = 'diagnostics-hub.html';
                }
            }
        });
        
        renderQuestion(0);
    })();
</script>
</body>
</html>
