<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Когерентность Cₛ • Идеатоника</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: linear-gradient(145deg, #0d1117 0%, #161b22 100%);
            min-height: 100vh;
            font-family: 'Georgia', 'Times New Roman', serif;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            padding: 1rem; overflow-x: hidden;
        }
        .stars-bg { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 0; }
        .star { position: absolute; background: white; border-radius: 50%; animation: twinkle var(--duration) ease-in-out infinite; animation-delay: var(--delay); opacity: 0; }
        @keyframes twinkle { 0%,100% { opacity:0.2; transform:scale(1); } 50% { opacity:1; transform:scale(1.8); } }
        .main-container {
            position: relative; z-index: 1; width: 100%; max-width: 1100px;
            background: rgba(22,27,34,0.85); backdrop-filter: blur(12px);
            border: 1px solid rgba(227,184,124,0.3); border-radius: 32px;
            padding: 2rem; box-shadow: 0 20px 40px rgba(0,0,0,0.6);
        }
        .header { text-align: center; margin-bottom: 1.5rem; }
        .header h1 { font-size: 2.5rem; font-weight: 400; letter-spacing: 3px; color: #f3e7c0; text-shadow: 0 0 20px rgba(255,215,80,0.4); margin-bottom: 0.3rem; }
        .header .subtitle { font-size: 1rem; color: #c0b090; font-style: italic; border-bottom: 1px solid #5d4a3a; display: inline-block; padding-bottom: 0.4rem; }
        .canvas-wrapper { position: relative; width: 100%; background: radial-gradient(ellipse at center, #1a2030 0%, #0a0e14 100%); border-radius: 20px; border: 1px solid #5d4a3a; overflow: hidden; margin-bottom: 1.5rem; box-shadow: inset 0 0 80px rgba(0,0,0,0.5); }
        canvas { display: block; width: 100%; height: auto; }
        .controls-panel { background: rgba(0,0,0,0.3); border: 1px solid #5d4a3a; border-radius: 20px; padding: 1.5rem 2rem; }
        .controls-title { font-size: 1.2rem; color: #ffd54f; margin-bottom: 1.2rem; text-align: center; letter-spacing: 1px; }
        .slider-group { margin-bottom: 1.2rem; }
        .slider-group label { display: flex; justify-content: space-between; align-items: center; color: #d0c8b8; font-size: 0.95rem; margin-bottom: 0.4rem; }
        .slider-group label .param-value { color: #ffd54f; font-weight: bold; font-size: 1.1rem; min-width: 50px; text-align: right; }
        .slider-group input[type="range"] { width: 100%; -webkit-appearance: none; height: 8px; background: linear-gradient(90deg, #3a2a4a, #5d4a3a, #3a2a4a); border-radius: 4px; outline: none; cursor: pointer; }
        .slider-group input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; width: 24px; height: 24px; background: radial-gradient(circle at 40% 40%, #ffe082, #ff8f00); border-radius: 50%; cursor: pointer; box-shadow: 0 0 15px rgba(255,215,80,0.6); border: 2px solid #ffd54f; }
        .range-labels { display: flex; justify-content: space-between; color: #706858; font-size: 0.75rem; margin-top: 0.2rem; }
        .info-box { margin-top: 1.5rem; padding: 1rem 1.5rem; background: rgba(255,215,80,0.05); border: 1px solid rgba(255,215,80,0.2); border-radius: 12px; text-align: center; color: #c0b090; font-size: 0.9rem; font-style: italic; }
        .info-box .formula-display { font-family: 'Courier New', monospace; color: #ffd54f; font-size: 1rem; margin: 0.3rem 0; }
        .back-row { text-align: center; margin-top: 1.5rem; }
        .back-link { display: inline-block; color: #ffd54f; text-decoration: none; border: 1px solid #ffd54f; padding: 0.6rem 1.5rem; border-radius: 30px; transition: 0.3s; font-size: 0.9rem; }
        .back-link:hover { background: #ffd54f; color: #0d1117; }
        @media (max-width: 700px) { .main-container { padding: 1rem; } .header h1 { font-size: 1.8rem; } .controls-panel { padding: 1rem; } }
    </style>
</head>
<body>
<div class="stars-bg" id="starsBg"></div>
<div class="main-container">
    <div class="header">
        <h1>🔦 Лазер vs Лампочка</h1>
        <div class="subtitle">Визуализация §108: когерентность Cₛ и заряд Qₛ</div>
    </div>
    <div class="canvas-wrapper" id="canvasWrapper">
        <canvas id="coherenceCanvas"></canvas>
    </div>
    <div class="controls-panel">
        <div class="controls-title">🎛️ Параметры</div>
        <div class="slider-group">
            <label><span>🎯 Когерентность Cₛ</span><span class="param-value" id="csValue">0.50</span></label>
            <input type="range" id="csSlider" min="0" max="1" value="0.5" step="0.01">
            <div class="range-labels"><span>0 (лампочка)</span><span>0.5</span><span>1 (лазер)</span></div>
        </div>
        <div class="slider-group">
            <label><span>☀️ Семантический заряд Qₛ</span><span class="param-value" id="qsValue">+5</span></label>
            <input type="range" id="qsSlider" min="-10" max="10" value="5" step="1">
            <div class="range-labels"><span>-10 (Тьма)</span><span>0</span><span>+10 (Свет)</span></div>
        </div>
        <div class="slider-group">
            <label><span>⏱️ Скорость анимации</span><span class="param-value" id="speedValue">1.0x</span></label>
            <input type="range" id="speedSlider" min="0.1" max="2.0" value="1.0" step="0.1">
            <div class="range-labels"><span>0.1x</span><span>1.0x</span><span>2.0x</span></div>
        </div>
        <div class="slider-group" style="text-align:center;">
            <button id="pauseBtn" style="padding:0.6rem 2rem;background:rgba(255,215,80,0.1);border:1px solid #ffd54f;color:#ffd54f;border-radius:30px;font-family:Georgia,serif;font-size:1rem;cursor:pointer;">⏯️ Пауза</button>
        </div>
        <div class="info-box">
            <span id="statusText" style="color:#ffd54f;font-weight:bold;">💡 Лампочка</span>
            <div class="formula-display" id="formulaDisplay"></div>
        </div>
    </div>
    <div class="back-row">
        <a href="visualizations.html" class="back-link">← К списку визуализаций</a>
    </div>
</div>

<script>
(function(){
    const starsBg=document.getElementById('starsBg');
    for(let i=0;i<100;i++){
        const d=document.createElement('div');d.className='star';
        d.style.left=Math.random()*100+'%';d.style.top=Math.random()*100+'%';
        const s=Math.random()*2.5+0.5;d.style.width=s+'px';d.style.height=s+'px';
        d.style.setProperty('--duration',(Math.random()*4+2)+'s');
        d.style.setProperty('--delay',(Math.random()*5)+'s');
        starsBg.appendChild(d);
    }
})();

const canvas=document.getElementById('coherenceCanvas');
const ctx=canvas.getContext('2d');
const wrapper=document.getElementById('canvasWrapper');
let time=0,paused=false,animId;

function resize(){
    const r=wrapper.getBoundingClientRect();
    canvas.width=r.width;
    canvas.height=Math.max(500,Math.min(700,r.width*0.7));
    wrapper.style.height=canvas.height+'px';
}
resize();window.addEventListener('resize',resize);

const csSlider=document.getElementById('csSlider');
const qsSlider=document.getElementById('qsSlider');
const speedSlider=document.getElementById('speedSlider');
const csValue=document.getElementById('csValue');
const qsValue=document.getElementById('qsValue');
const speedValue=document.getElementById('speedValue');
const pauseBtn=document.getElementById('pauseBtn');
const statusText=document.getElementById('statusText');
const formulaDisplay=document.getElementById('formulaDisplay');

csSlider.oninput=function(){csValue.textContent=parseFloat(this.value).toFixed(2);updateInfo();};
qsSlider.oninput=function(){qsValue.textContent=(parseInt(this.value)>=0?'+':'')+parseInt(this.value);updateInfo();};
speedSlider.oninput=function(){speedValue.textContent=parseFloat(this.value).toFixed(1)+'x';};

pauseBtn.onclick=function(){
    paused=!paused;
    this.textContent=paused?'▶️ Продолжить':'⏯️ Пауза';
};

function updateInfo(){
    const cs=parseFloat(csSlider.value);
    const qs=parseInt(qsSlider.value);
    
    if(cs>0.8) statusText.textContent='🔦 ЛАЗЕР — сверхузкий луч';
    else if(cs>0.6) statusText.textContent='🔦 Прожектор — узкий луч';
    else if(cs>0.4) statusText.textContent='💡 Лампа — средний разброс';
    else if(cs>0.2) statusText.textContent='🕯️ Свеча — широкий свет';
    else statusText.textContent='🌫️ Рассеянный свет — почти шум';
    
    if(qs<0) statusText.textContent+=' (Тьма)';
    else if(qs>5) statusText.textContent+=' (Сияние)';
    
    const power=(Math.abs(qs)/10)*(0.3+0.7*cs);
    formulaDisplay.textContent='P_света ≈ |Qₛ|/10 · (0.3+0.7·Cₛ) = '+power.toFixed(2);
}
updateInfo();

function getQSColor(qs){
    if(qs>=8) return {r:255,g:240,b:180};      // ослепительно-золотой
    if(qs>=5) return {r:255,g:220,b:100};      // ярко-золотой
    if(qs>=2) return {r:255,g:200,b:60};       // тёплый жёлтый
    if(qs>=0) return {r:200,g:180,b:100};      // тускло-жёлтый
    if(qs>=-3) return {r:120,g:100,b:140};     // серо-фиолетовый
    if(qs>=-7) return {r:80,g:40,b:80};        // тёмно-фиолетовый
    return {r:20,g:0,b:30};                     // почти чёрный
}

function drawFrame(){
    const cs=parseFloat(csSlider.value);
    const qs=parseInt(qsSlider.value);
    const speed=parseFloat(speedSlider.value);
    const w=canvas.width,h=canvas.height;
    
    if(!paused) time+=0.03*speed;
    
    // Очистка
    ctx.fillStyle='#060a10';
    ctx.fillRect(0,0,w,h);
    
    // Сетка
    ctx.strokeStyle='rgba(255,255,255,0.02)';ctx.lineWidth=1;
    for(let x=0;x<w;x+=50){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,h);ctx.stroke();}
    for(let y=0;y<h;y+=50){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(w,y);ctx.stroke();}
    
    // Позиция фонаря
    const lanternX=w/2;
    const lanternY=h*0.25;
    
    // Параметры луча
    // Чем выше Cₛ, тем уже луч (минимальный угол 2°, максимальный 170°)
    const beamAngleDeg=2+(1-cs)*168; // 2° (лазер) до 170° (лампочка)
    const beamAngleRad=beamAngleDeg*Math.PI/180;
    const beamLength=h*0.8;
    
    // Цвет от Qₛ
    const baseColor=getQSColor(qs);
    const power=(Math.abs(qs)/10)*(0.3+0.7*cs); // сила свечения
    
    // Мерцание (особенно заметно при низкой Cₛ)
    const flicker=cs<0.4?0.6+0.4*Math.sin(time*7)*Math.cos(time*11):1.0;
    const alpha=power*flicker;
    
    // Рисуем луч (множество лучей внутри конуса)
    const numRays=80;
    for(let i=0;i<numRays;i++){
        const t=i/numRays;
        const offset=(t-0.5)*beamAngleRad;
        const endX=lanternX+Math.sin(offset)*beamLength;
        const endY=lanternY+Math.cos(offset)*beamLength;
        
        // Прозрачность луча зависит от угла (центр ярче)
        const rayAlpha=alpha*(1-Math.abs(t-0.5)*1.8)*0.08;
        if(rayAlpha<0.001) continue;
        
        const grad=ctx.createLinearGradient(lanternX,lanternY,endX,endY);
        grad.addColorStop(0,`rgba(${baseColor.r},${baseColor.g},${baseColor.b},${rayAlpha*3})`);
        grad.addColorStop(0.3,`rgba(${baseColor.r},${baseColor.g},${baseColor.b},${rayAlpha*1.5})`);
        grad.addColorStop(1,`rgba(${baseColor.r},${baseColor.g},${baseColor.b},0)`);
        
        ctx.strokeStyle=grad;
        ctx.lineWidth=1+cs*2;
        ctx.beginPath();
        ctx.moveTo(lanternX,lanternY);
        ctx.lineTo(endX,endY);
        ctx.stroke();
    }
    
    // Частицы пыли в луче
    const numParticles=Math.floor(30+cs*70);
    for(let i=0;i<numParticles;i++){
        const dist=Math.random()*beamLength;
        const angleOffset=(Math.random()-0.5)*beamAngleRad;
        const px=lanternX+Math.sin(angleOffset)*dist;
        const py=lanternY+Math.cos(angleOffset)*dist;
        
        const particleAlpha=alpha*0.3*(1-dist/beamLength)*flicker;
        if(particleAlpha<0.01) continue;
        
        ctx.fillStyle=`rgba(${baseColor.r},${baseColor.g},${baseColor.b},${particleAlpha})`;
        ctx.beginPath();
        ctx.arc(px,py,0.5+cs*1.5,0,Math.PI*2);
        ctx.fill();
    }
    
    // Рисуем фонарь
    function drawLantern(){
        const cx=lanternX,cy=lanternY;
        
        // Свечение вокруг
        const glowRadius=15+power*10;
        const glow=ctx.createRadialGradient(cx,cy,0,cx,cy,glowRadius);
        glow.addColorStop(0,`rgba(${baseColor.r},${baseColor.g},${baseColor.b},${0.5+power*0.5})`);
        glow.addColorStop(0.5,`rgba(${baseColor.r},${baseColor.g},${baseColor.b},${power*0.3})`);
        glow.addColorStop(1,'rgba(0,0,0,0)');
        ctx.fillStyle=glow;
        ctx.beginPath();ctx.arc(cx,cy,glowRadius,0,Math.PI*2);ctx.fill();
        
        // Корпус фонаря
        const bodyGrad=ctx.createLinearGradient(cx-20,cy,cx+20,cy);
        bodyGrad.addColorStop(0,'#4a3728');
        bodyGrad.addColorStop(0.3,'#8b6914');
        bodyGrad.addColorStop(0.5,'#c9a84c');
        bodyGrad.addColorStop(0.7,'#8b6914');
        bodyGrad.addColorStop(1,'#4a3728');
        ctx.fillStyle=bodyGrad;
        ctx.fillRect(cx-20,cy-15,40,50);
        
        // Крышка
        ctx.fillStyle='#5d4037';
        ctx.beginPath();ctx.arc(cx,cy-15,22,Math.PI,0);ctx.fill();
        
        // Стекло
        const glassGrad=ctx.createRadialGradient(cx,cy+10,5,cx,cy+10,18);
        glassGrad.addColorStop(0,`rgba(${baseColor.r},${baseColor.g},${baseColor.b},0.9)`);
        glassGrad.addColorStop(0.7,`rgba(${baseColor.r},${baseColor.g},${baseColor.b},0.4)`);
        glassGrad.addColorStop(1,'rgba(255,255,255,0.1)');
        ctx.fillStyle=glassGrad;
        ctx.beginPath();ctx.arc(cx,cy+10,16,0,Math.PI*2);ctx.fill();
        
        // Ручка
        ctx.strokeStyle='#3e2723';
        ctx.lineWidth=3;
        ctx.beginPath();ctx.arc(cx,cy-20,12,Math.PI,0);ctx.stroke();
        
        // Подпись
        ctx.fillStyle='#c0b090';
        ctx.font='bold 14px Georgia,serif';
        ctx.textAlign='center';
        ctx.fillText('ФОНАРЬ',cx,cy+70);
        
        // Параметры
        ctx.fillStyle='#ffd54f';
        ctx.font='12px Georgia,serif';
        ctx.fillText(`Cₛ=${cs.toFixed(2)}  Qₛ=${qs>=0?'+':''}${qs}`,cx,cy+88);
    }
    drawLantern();
    
    // Подписи углов
    const labelDist=beamLength*0.5;
    const leftX=lanternX+Math.sin(-beamAngleRad/2)*labelDist;
    const leftY=lanternY+Math.cos(-beamAngleRad/2)*labelDist;
    const rightX=lanternX+Math.sin(beamAngleRad/2)*labelDist;
    const rightY=lanternY+Math.cos(beamAngleRad/2)*labelDist;
    
    ctx.fillStyle='rgba(255,255,255,0.2)';
    ctx.font='11px Georgia,serif';
    ctx.textAlign='left';
    ctx.fillText(`${beamAngleDeg.toFixed(0)}°`,rightX+8,rightY);
    ctx.textAlign='right';
    ctx.fillText(`${beamAngleDeg.toFixed(0)}°`,leftX-8,leftY);
    
    animId=requestAnimationFrame(drawFrame);
}

drawFrame();
window.addEventListener('beforeunload',()=>{if(animId)cancelAnimationFrame(animId);});
</script>

</body>
</html>
