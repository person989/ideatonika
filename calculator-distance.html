<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Калькулятор Дальности Семантической Связи • Идеатоника</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: linear-gradient(145deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            font-family: 'Georgia', 'Times New Roman', serif;
            padding: 2rem;
            display: flex; flex-direction: column; align-items: center;
        }
        .cosmic-bg { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 0; }
        .main-container {
            max-width: 800px; width: 100%; position: relative; z-index: 1;
            background: rgba(30, 40, 60, 0.85); backdrop-filter: blur(12px);
            border: 1px solid rgba(227, 184, 124, 0.4); border-radius: 32px;
            padding: 2.5rem; box-shadow: 0 20px 40px rgba(0,0,0,0.5);
        }
        h1 { font-size: 2.5rem; color: #f3e7c0; text-align: center; margin-bottom: 0.5rem; font-weight: 400; }
        .subtitle { text-align: center; color: #c0b090; font-style: italic; margin-bottom: 2rem; border-bottom: 1px solid #5d4a3a; padding-bottom: 1rem; }
        .calc-section { background: rgba(0,0,0,0.2); border-radius: 20px; padding: 2rem; margin-bottom: 2rem; border: 1px solid #5d4a3a; }
        .section-title { font-size: 1.4rem; color: #ffd54f; margin-bottom: 1.5rem; }
        .input-group { margin-bottom: 1.5rem; }
        .input-group label { display: flex; justify-content: space-between; align-items: center; color: #d0c8b8; font-size: 1rem; margin-bottom: 0.5rem; }
        .input-group label span { color: #ffd54f; font-weight: bold; font-size: 1.2rem; }
        .input-group input[type="range"] { width: 100%; -webkit-appearance: none; height: 8px; background: #5d4a3a; border-radius: 4px; outline: none; cursor: pointer; }
        .input-group input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; width: 22px; height: 22px; background: #ffd54f; border-radius: 50%; cursor: pointer; box-shadow: 0 0 10px rgba(255,215,80,0.5); }
        .input-group .range-labels { display: flex; justify-content: space-between; color: #706858; font-size: 0.8rem; margin-top: 0.3rem; }
        .input-group select { width: 100%; padding: 0.8rem 1rem; background: rgba(0,0,0,0.3); border: 1px solid #5d4a3a; border-radius: 10px; color: #f3e7c0; font-family: 'Georgia', serif; font-size: 1rem; }
        .input-group select option { background: #1a1a2e; color: #f3e7c0; }
        .result-box { background: rgba(255,215,80,0.1); border: 2px solid #ffd54f; border-radius: 20px; padding: 2rem; text-align: center; margin-top: 2rem; }
        .result-number { font-size: 4rem; font-weight: bold; color: #ffd54f; line-height: 1; }
        .result-label { color: #c0b090; font-size: 1.2rem; margin-top: 0.5rem; }
        .result-extra { color: #d0c8b8; font-size: 1rem; margin-top: 1rem; font-style: italic; }
        .result-formula { color: #a09080; font-style: italic; font-size: 0.9rem; margin-top: 1rem; font-family: 'Courier New', monospace; }
        .back-link { display: inline-block; margin-top: 1.5rem; color: #ffd54f; text-decoration: none; border: 1px solid #ffd54f; padding: 0.6rem 1.5rem; border-radius: 30px; transition: 0.2s; }
        .back-link:hover { background: #ffd54f; color: #1a1a2e; }
    </style>
</head>
<body>
<div class="cosmic-bg"></div>
<div class="main-container">

    <h1>📡 Дальность Семантической Связи</h1>
    <div class="subtitle">Калькулятор распространения Qₛ в пространстве (§129, §114, §120)</div>

    <div class="calc-section">
        <div class="section-title">📐 Параметры сигнала и среды</div>

        <!-- Q отправленный -->
        <div class="input-group">
            <label>⚡ Сила отправленного Qₛ (молитва, намерение): <span id="qsValue">100</span> усл. ед.</label>
            <input type="range" id="qsSlider" min="10" max="500" value="100" step="10">
            <div class="range-labels"><span>10 (мысль)</span><span>500 (благословение)</span></div>
        </div>

        <!-- Расстояние -->
        <div class="input-group">
            <label>📏 Расстояние до цели: <span id="distValue">100</span> км</label>
            <input type="range" id="distSlider" min="0.001" max="2000" value="100" step="0.001">
            <div class="range-labels"><span>1 м</span><span>100 км</span><span>2 000 км</span></div>
        </div>

        <!-- Среда -->
        <div class="input-group">
            <label>🌐 Среда распространения:</label>
            <select id="mediumSelect">
                <option value="0.01">Чистый воздух (α = 0.01)</option>
                <option value="0.1">Вода (α = 0.1)</option>
                <option value="0.5" selected>Дерево, кирпич (α = 0.5)</option>
                <option value="2.0">Гранит, камень (α = 2.0)</option>
                <option value="5.0">Бетон (α = 5.0)</option>
                <option value="20.0">Свинец (α = 20.0)</option>
            </select>
        </div>

        <!-- Ретранслятор -->
        <div class="input-group">
            <label>🛰️ Ретранслятор (усилитель сигнала):</label>
            <select id="repeaterSelect">
                <option value="1">Нет (×1)</option>
                <option value="3">Молитва в храме (×3)</option>
                <option value="10">Мощи святых (×10)</option>
                <option value="100">Коллективная молитва (×100)</option>
            </select>
        </div>
    </div>

    <!-- Результат -->
    <div class="result-box" id="resultBox">
        <div class="result-number" id="resultNumber">—</div>
        <div class="result-label" id="resultLabel">Доходит до цели</div>
        <div class="result-extra" id="resultExtra"></div>
        <div class="result-formula" id="resultFormula"></div>
    </div>

    <div style="text-align: center;">
        <a href="semantic-calculators.html" class="back-link">← К списку калькуляторов</a>
    </div>

</div>

<script>
    const qsSlider = document.getElementById('qsSlider');
    const distSlider = document.getElementById('distSlider');
    const mediumSelect = document.getElementById('mediumSelect');
    const repeaterSelect = document.getElementById('repeaterSelect');
    const qsValue = document.getElementById('qsValue');
    const distValue = document.getElementById('distValue');
    const resultNumber = document.getElementById('resultNumber');
    const resultLabel = document.getElementById('resultLabel');
    const resultExtra = document.getElementById('resultExtra');
    const resultFormula = document.getElementById('resultFormula');

    qsSlider.addEventListener('input', () => { qsValue.textContent = parseInt(qsSlider.value); calculate(); });
    distSlider.addEventListener('input', () => { distValue.textContent = parseFloat(distSlider.value).toFixed(3); calculate(); });
    mediumSelect.addEventListener('change', calculate);
    repeaterSelect.addEventListener('change', calculate);

    function calculate() {
        const Qsent = parseFloat(qsSlider.value);
        const dist = parseFloat(distSlider.value);
        const alpha = parseFloat(mediumSelect.value);
        const repeater = parseFloat(repeaterSelect.value);

        // Закон Бугера-Ламберта-Бера для Qₛ: I(x) = I₀ · e^(-α · x)
        const Qreceived = Qsent * Math.exp(-alpha * dist) * repeater;
        const percentReceived = (Qreceived / Qsent) * 100;

        resultNumber.textContent = Qreceived.toFixed(1) + ' усл. ед.';
        resultLabel.textContent = 'Дошло до цели';

        let extra = '';
        if (percentReceived >= 50) extra = '📡 Отличный сигнал! Цель «слышит» вас очень хорошо.';
        else if (percentReceived >= 10) extra = '👍 Хороший сигнал. Ваше намерение дойдёт.';
        else if (percentReceived >= 1) extra = '📶 Слабый сигнал. Молитва доходит, но едва.';
        else if (percentReceived >= 0.01) extra = '🌫️ Очень слабый сигнал. Нужен ретранслятор или более мощный импульс.';
        else extra = '💀 Сигнал практически исчез. Цель слишком далеко или среда слишком плотная.';
        resultExtra.textContent = extra;

        const mediumName = mediumSelect.options[mediumSelect.selectedIndex].text.split(' (')[0];
        const repeaterName = repeaterSelect.options[repeaterSelect.selectedIndex].text.split(' (')[0];
        resultFormula.textContent = `Q_прин = ${Qsent.toFixed(0)} · e^(-${alpha} · ${dist.toFixed(3)}) · ${repeater} = ${Qreceived.toFixed(1)} | Среда: ${mediumName} | Усилитель: ${repeaterName}`;
    }

    calculate();
</script>

</body>
</html>
