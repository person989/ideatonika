<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Семантическая Линза • Идеатоника</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: linear-gradient(145deg, #0d1117 0%, #161b22 100%);
            min-height: 100vh;
            font-family: 'Georgia', 'Times New Roman', serif;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            padding: 1rem; overflow-x: hidden;
        }
        .stars-bg { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 0; }
        .star { position: absolute; background: white; border-radius: 50%; animation: twinkle var(--duration) ease-in-out infinite; animation-delay: var(--delay); opacity: 0; }
        @keyframes twinkle { 0%,100% { opacity:0.2; transform:scale(1); } 50% { opacity:1; transform:scale(1.8); } }
        .main-container {
            position: relative; z-index: 1; width: 100%; max-width: 1100px;
            background: rgba(22,27,34,0.85); backdrop-filter: blur(12px);
            border: 1px solid rgba(227,184,124,0.3); border-radius: 32px;
            padding: 2rem; box-shadow: 0 20px 40px rgba(0,0,0,0.6);
        }
        .header { text-align: center; margin-bottom: 1.5rem; }
        .header h1 { font-size: 2.5rem; font-weight: 400; letter-spacing: 3px; color: #f3e7c0; text-shadow: 0 0 20px rgba(255,215,80,0.4); margin-bottom: 0.3rem; }
        .header .subtitle { font-size: 1rem; color: #c0b090; font-style: italic; border-bottom: 1px solid #5d4a3a; display: inline-block; padding-bottom: 0.4rem; }
        .canvas-wrapper { position: relative; width: 100%; background: radial-gradient(ellipse at center, #1a2030 0%, #0a0e14 100%); border-radius: 20px; border: 1px solid #5d4a3a; overflow: hidden; margin-bottom: 1.5rem; box-shadow: inset 0 0 80px rgba(0,0,0,0.5); }
        canvas { display: block; width: 100%; height: auto; }
        .controls-panel { background: rgba(0,0,0,0.3); border: 1px solid #5d4a3a; border-radius: 20px; padding: 1.5rem 2rem; }
        .controls-title { font-size: 1.2rem; color: #ffd54f; margin-bottom: 1.2rem; text-align: center; letter-spacing: 1px; }
        .slider-group { margin-bottom: 1.2rem; }
        .slider-group label { display: flex; justify-content: space-between; align-items: center; color: #d0c8b8; font-size: 0.95rem; margin-bottom: 0.4rem; }
        .slider-group label .param-value { color: #ffd54f; font-weight: bold; font-size: 1.1rem; min-width: 50px; text-align: right; }
        .slider-group input[type="range"] { width: 100%; -webkit-appearance: none; height: 8px; background: linear-gradient(90deg, #3a2a4a, #5d4a3a, #3a2a4a); border-radius: 4px; outline: none; cursor: pointer; }
        .slider-group input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; width: 24px; height: 24px; background: radial-gradient(circle at 40% 40%, #ffe082, #ff8f00); border-radius: 50%; cursor: pointer; box-shadow: 0 0 15px rgba(255,215,80,0.6); border: 2px solid #ffd54f; }
        .range-labels { display: flex; justify-content: space-between; color: #706858; font-size: 0.75rem; margin-top: 0.2rem; }
        .info-box { margin-top: 1.5rem; padding: 1rem 1.5rem; background: rgba(255,215,80,0.05); border: 1px solid rgba(255,215,80,0.2); border-radius: 12px; text-align: center; color: #c0b090; font-size: 0.9rem; font-style: italic; }
        .info-box .formula-display { font-family: 'Courier New', monospace; color: #ffd54f; font-size: 1rem; margin: 0.3rem 0; }
        .back-row { text-align: center; margin-top: 1.5rem; }
        .back-link { display: inline-block; color: #ffd54f; text-decoration: none; border: 1px solid #ffd54f; padding: 0.6rem 1.5rem; border-radius: 30px; transition: 0.3s; font-size: 0.9rem; }
        .back-link:hover { background: #ffd54f; color: #0d1117; }
        @media (max-width: 700px) { .main-container { padding: 1rem; } .header h1 { font-size: 1.8rem; } .controls-panel { padding: 1rem; } }
    </style>
</head>
<body>
<div class="stars-bg" id="starsBg"></div>
<div class="main-container">
    <div class="header">
        <h1>🔍 Семантическая Линза</h1>
        <div class="subtitle">Визуализация §90: фокусировка рассеянного Qₛ в точку</div>
    </div>
    <div class="canvas-wrapper" id="canvasWrapper">
        <canvas id="lensCanvas"></canvas>
    </div>
    <div class="controls-panel">
        <div class="controls-title">🎛️ Параметры</div>
        <div class="slider-group">
            <label><span>🔍 Фокусное расстояние</span><span class="param-value" id="focusValue">250 px</span></label>
            <input type="range" id="focusSlider" min="80" max="400" value="250" step="1">
            <div class="range-labels"><span>80 (сильная линза)</span><span>250</span><span>400 (слабая линза)</span></div>
        </div>
        <div class="slider-group">
            <label><span>💎 Коэффициент усиления (K_линзы)</span><span class="param-value" id="strengthValue">7</span></label>
            <input type="range" id="strengthSlider" min="2" max="20" value="7" step="1">
            <div class="range-labels"><span>2 (слабая)</span><span>7 (кварц)</span><span>20 (идеальная)</span></div>
        </div>
        <div class="slider-group">
            <label><span>☀️ Семантический заряд Qₛ</span><span class="param-value" id="qsValue">+5</span></label>
            <input type="range" id="qsSlider" min="-10" max="10" value="5" step="1">
            <div class="range-labels"><span>-10</span><span>0</span><span>+10</span></div>
        </div>
        <div class="info-box">
            <span id="statusText" style="color:#ffd54f;font-weight:bold;">🔍 Сфокусировано!</span>
            <div class="formula-display" id="formulaDisplay"></div>
        </div>
    </div>
    <div class="back-row">
        <a href="visualizations.html" class="back-link">← К списку визуализаций</a>
    </div>
</div>

<script>
(function(){
    const starsBg=document.getElementById('starsBg');
    for(let i=0;i<100;i++){
        const d=document.createElement('div');d.className='star';
        d.style.left=Math.random()*100+'%';d.style.top=Math.random()*100+'%';
        const s=Math.random()*2.5+0.5;d.style.width=s+'px';d.style.height=s+'px';
        d.style.setProperty('--duration',(Math.random()*4+2)+'s');
        d.style.setProperty('--delay',(Math.random()*5)+'s');
        starsBg.appendChild(d);
    }
})();

const canvas=document.getElementById('lensCanvas');
const ctx=canvas.getContext('2d');
const wrapper=document.getElementById('canvasWrapper');
let time=0,animId;

function resize(){
    const r=wrapper.getBoundingClientRect();
    canvas.width=r.width;
    canvas.height=Math.max(500,Math.min(650,r.width*0.7));
    wrapper.style.height=canvas.height+'px';
}
resize();window.addEventListener('resize',resize);

const focusSlider=document.getElementById('focusSlider');
const strengthSlider=document.getElementById('strengthSlider');
const qsSlider=document.getElementById('qsSlider');
const focusValue=document.getElementById('focusValue');
const strengthValue=document.getElementById('strengthValue');
const qsValue=document.getElementById('qsValue');
const statusText=document.getElementById('statusText');
const formulaDisplay=document.getElementById('formulaDisplay');

focusSlider.oninput=function(){focusValue.textContent=this.value+' px';updateInfo();};
strengthSlider.oninput=function(){strengthValue.textContent=this.value;updateInfo();};
qsSlider.oninput=function(){qsValue.textContent=(parseInt(this.value)>=0?'+':'')+parseInt(this.value);};

function updateInfo(){
    const strength=parseInt(strengthSlider.value);
    const f=parseFloat(focusSlider.value);
    if(f<120) statusText.textContent='🔍 Очень близкий фокус — мощная линза, максимальная концентрация';
    else if(f<200) statusText.textContent='🔍 Близкий фокус — сильная концентрация Qₛ';
    else if(f<300) statusText.textContent='🔍 Средний фокус — хорошая фокусировка';
    else statusText.textContent='🌫️ Далёкий фокус — слабая линза, Qₛ почти не собран';
    formulaDisplay.textContent='K_линзы≈'+strength+' | f='+f.toFixed(0)+' px | §90';
}
updateInfo();

function getQSColor(qs,alpha){
    const absQ=Math.abs(qs);
    const norm=absQ/10;
    if(absQ<0.5){const gray=Math.floor(100*norm+30);return `rgba(${gray},${gray},${gray},${alpha*0.4})`;}
    if(qs>=0){const r=Math.floor(30+norm*225);const g=Math.floor(5+norm*235);const b=Math.floor(80*(1-norm)+255*norm);return `rgba(${r},${g},${b},${alpha})`;}
    else{const r=Math.floor(80*(1-norm)+30*norm);const g=Math.floor(40*(1-norm)+5*norm);const b=Math.floor(30+norm*200);return `rgba(${r},${g},${b},${alpha})`;}
}

function drawFrame(){
    const focalLen=parseFloat(focusSlider.value);
    const strength=parseInt(strengthSlider.value);
    const qs=parseInt(qsSlider.value);
    const w=canvas.width,h=canvas.height;
    time+=0.016;
    
    ctx.fillStyle='#060a10';
    ctx.fillRect(0,0,w,h);
    
    // Позиции
    const lensX=w*0.3;
    const lensY=h/2;
    const lensH=h*0.7;
    const lensW=20;
    
    // Точка фокуса СПРАВА от линзы на расстоянии focalLen
    const focusX=lensX+lensW/2+focalLen;
    const focusY=lensY;
    
    // === ИСТОЧНИК Qₛ (слева, далеко) ===
    const srcX=-60;
    
    // Свечение источника
    const srcGlow=ctx.createRadialGradient(srcX,lensY,0,srcX,lensY,60);
    srcGlow.addColorStop(0,getQSColor(qs,0.7));
    srcGlow.addColorStop(0.4,getQSColor(qs,0.3));
    srcGlow.addColorStop(1,'rgba(0,0,0,0)');
    ctx.fillStyle=srcGlow;
    ctx.beginPath();ctx.arc(srcX,lensY,60,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='white';
    ctx.beginPath();ctx.arc(srcX,lensY,15,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='rgba(255,255,255,0.7)';
    ctx.font='bold 14px Georgia,serif';
    ctx.textAlign='center';
    ctx.fillText('Источник',srcX,lensY-50);
    ctx.fillText('Qₛ='+(qs>=0?'+':'')+qs,srcX,lensY-28);
    
    // === ПАРАЛЛЕЛЬНЫЕ ЛУЧИ ОТ ИСТОЧНИКА К ЛИНЗЕ ===
    const numRays=21;
    for(let i=0;i<numRays;i++){
        const t=(i-numRays/2)/(numRays/2);
        const rayY=lensY+t*lensH*0.45;
        const alpha=0.2;
        ctx.strokeStyle=getQSColor(qs,alpha);
        ctx.lineWidth=1;
        ctx.setLineDash([4,6]);
        ctx.beginPath();
        ctx.moveTo(srcX+20,rayY);
        ctx.lineTo(lensX-lensW/2,rayY);
        ctx.stroke();
        ctx.setLineDash([]);
    }
    
    // === ЛИНЗА ===
    const lensGlow=ctx.createRadialGradient(lensX,lensY,lensW*0.5,lensX,lensY,lensW*3);
    lensGlow.addColorStop(0,'rgba(200,220,255,0.6)');
    lensGlow.addColorStop(0.5,'rgba(150,180,255,0.3)');
    lensGlow.addColorStop(1,'rgba(0,0,0,0)');
    ctx.fillStyle=lensGlow;
    ctx.beginPath();ctx.arc(lensX,lensY,lensW*3,0,Math.PI*2);ctx.fill();
    
    const lensGrad=ctx.createLinearGradient(lensX-lensW/2,0,lensX+lensW/2,0);
    lensGrad.addColorStop(0,'rgba(180,200,240,0.4)');
    lensGrad.addColorStop(0.3,'rgba(220,240,255,0.6)');
    lensGrad.addColorStop(0.5,'rgba(255,255,255,0.8)');
    lensGrad.addColorStop(0.7,'rgba(220,240,255,0.6)');
    lensGrad.addColorStop(1,'rgba(180,200,240,0.4)');
    ctx.fillStyle=lensGrad;
    ctx.beginPath();
    ctx.ellipse(lensX,lensY,lensW/2,lensH/2,0,0,Math.PI*2);
    ctx.fill();
    ctx.strokeStyle='rgba(255,255,255,0.7)';
    ctx.lineWidth=2;
    ctx.beginPath();
    ctx.ellipse(lensX,lensY,lensW/2,lensH/2,0,0,Math.PI*2);
    ctx.stroke();
    
    ctx.fillStyle='rgba(255,255,255,0.8)';
    ctx.font='bold 16px Georgia,serif';
    ctx.textAlign='center';
    ctx.fillText('ЛИНЗА',lensX,lensY-lensH/2-20);
    ctx.fillText('K='+strength,lensX,lensY+lensH/2+25);
    ctx.fillText('f='+focalLen.toFixed(0)+' px',lensX,lensY+lensH/2+45);
    
    // === ПРЕЛОМЛЁННЫЕ ЛУЧИ (от линзы к фокусу) ===
    for(let i=0;i<numRays;i++){
        const t=(i-numRays/2)/(numRays/2);
        const startX=lensX+lensW/2;
        const startY=lensY+t*lensH*0.45;
        const endX=focusX;
        const endY=focusY;
        
        // Сходимость зависит от силы линзы
        const convergence=strength/10;
        const midX=startX+(focusX-startX)*0.3;
        const midY=startY+(focusY-startY)*0.3*convergence;
        
        const alpha=0.2+0.5*convergence;
        ctx.strokeStyle=getQSColor(qs,alpha);
        ctx.lineWidth=1+convergence*1.5;
        ctx.beginPath();
        ctx.moveTo(startX,startY);
        ctx.quadraticCurveTo(midX,midY,endX,endY);
        ctx.stroke();
    }
    
    // === ТОЧКА ФОКУСА ===
    if(focusX<w-20){
        const focusGlow=ctx.createRadialGradient(focusX,focusY,0,focusX,focusY,35+strength*6);
        focusGlow.addColorStop(0,'rgba(255,255,255,0.95)');
        focusGlow.addColorStop(0.1,getQSColor(qs,0.9));
        focusGlow.addColorStop(0.4,getQSColor(qs,0.5));
        focusGlow.addColorStop(1,'rgba(0,0,0,0)');
        ctx.fillStyle=focusGlow;
        ctx.beginPath();ctx.arc(focusX,focusY,35+strength*6,0,Math.PI*2);ctx.fill();
        
        ctx.fillStyle='white';
        ctx.beginPath();ctx.arc(focusX,focusY,5+strength*1.2,0,Math.PI*2);ctx.fill();
        
        const pulse=1+0.3*Math.sin(time*5);
        ctx.strokeStyle='rgba(255,255,255,0.5)';
        ctx.lineWidth=2;
        ctx.beginPath();ctx.arc(focusX,focusY,(5+strength*1.2)*pulse*2.5,0,Math.PI*2);ctx.stroke();
        
        ctx.fillStyle='white';
        ctx.font='bold 14px Georgia,serif';
        ctx.textAlign='center';
        ctx.fillText('ФОКУС',focusX,focusY-45);
        ctx.fillText('P×'+strength,focusX,focusY-23);
    }
    
    // === ГРАФИК КОНЦЕНТРАЦИИ ===
    const graphX=w*0.08,graphY=h*0.78,graphW=w*0.84,graphH=45;
    
    ctx.strokeStyle='rgba(255,255,255,0.15)';
    ctx.lineWidth=1;
    ctx.beginPath();ctx.moveTo(graphX,graphY);ctx.lineTo(graphX+graphW,graphY);ctx.stroke();
    
    ctx.strokeStyle='#ffd54f';
    ctx.lineWidth=2;
    ctx.beginPath();
    for(let i=0;i<=graphW;i+=2){
        const px=graphX+i;
        const distFromFocus=Math.abs(px-focusX);
        const sigma=15+strength*4;
        const conc=Math.exp(-distFromFocus*distFromFocus/(2*sigma*sigma));
        const py=graphY-conc*graphH;
        if(i===0) ctx.moveTo(px,py);
        else ctx.lineTo(px,py);
    }
    ctx.stroke();
    
    ctx.fillStyle='rgba(255,255,255,0.35)';
    ctx.font='12px Georgia,serif';
    ctx.textAlign='center';
    ctx.fillText('Концентрация Qₛ вдоль оси',graphX+graphW/2,graphY-20);
    
    // Метка фокуса на графике
    if(focusX>=graphX&&focusX<=graphX+graphW){
        ctx.fillStyle='white';
        ctx.beginPath();ctx.arc(focusX,graphY-15,4,0,Math.PI*2);ctx.fill();
    }
    
    animId=requestAnimationFrame(drawFrame);
}

drawFrame();
window.addEventListener('beforeunload',()=>{if(animId)cancelAnimationFrame(animId);});
</script>

</body>
</html>
