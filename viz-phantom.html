<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Семантический След • Идеатоника</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: linear-gradient(145deg, #0d1117 0%, #161b22 100%);
            min-height: 100vh;
            font-family: 'Georgia', 'Times New Roman', serif;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            padding: 1rem; overflow-x: hidden;
        }
        .stars-bg { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 0; }
        .star { position: absolute; background: white; border-radius: 50%; animation: twinkle var(--duration) ease-in-out infinite; animation-delay: var(--delay); opacity: 0; }
        @keyframes twinkle { 0%,100% { opacity:0.2; transform:scale(1); } 50% { opacity:1; transform:scale(1.8); } }
        .main-container {
            position: relative; z-index: 1; width: 100%; max-width: 1100px;
            background: rgba(22,27,34,0.85); backdrop-filter: blur(12px);
            border: 1px solid rgba(227,184,124,0.3); border-radius: 32px;
            padding: 2rem; box-shadow: 0 20px 40px rgba(0,0,0,0.6);
        }
        .header { text-align: center; margin-bottom: 1.5rem; }
        .header h1 { font-size: 2.5rem; font-weight: 400; letter-spacing: 3px; color: #f3e7c0; text-shadow: 0 0 20px rgba(255,215,80,0.4); margin-bottom: 0.3rem; }
        .header .subtitle { font-size: 1rem; color: #c0b090; font-style: italic; border-bottom: 1px solid #5d4a3a; display: inline-block; padding-bottom: 0.4rem; }
        .canvas-wrapper { position: relative; width: 100%; background: radial-gradient(ellipse at center, #1a2030 0%, #0a0e14 100%); border-radius: 20px; border: 1px solid #5d4a3a; overflow: hidden; margin-bottom: 1.5rem; box-shadow: inset 0 0 80px rgba(0,0,0,0.5); }
        canvas { display: block; width: 100%; height: auto; }
        .controls-panel { background: rgba(0,0,0,0.3); border: 1px solid #5d4a3a; border-radius: 20px; padding: 1.5rem 2rem; }
        .controls-title { font-size: 1.2rem; color: #ffd54f; margin-bottom: 1.2rem; text-align: center; letter-spacing: 1px; }
        .slider-group { margin-bottom: 1.2rem; }
        .slider-group label { display: flex; justify-content: space-between; align-items: center; color: #d0c8b8; font-size: 0.95rem; margin-bottom: 0.4rem; }
        .slider-group label .param-value { color: #ffd54f; font-weight: bold; font-size: 1.1rem; min-width: 50px; text-align: right; }
        .slider-group input[type="range"] { width: 100%; -webkit-appearance: none; height: 8px; background: linear-gradient(90deg, #3a2a4a, #5d4a3a, #3a2a4a); border-radius: 4px; outline: none; cursor: pointer; }
        .slider-group input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; width: 24px; height: 24px; background: radial-gradient(circle at 40% 40%, #ffe082, #ff8f00); border-radius: 50%; cursor: pointer; box-shadow: 0 0 15px rgba(255,215,80,0.6); border: 2px solid #ffd54f; }
        .range-labels { display: flex; justify-content: space-between; color: #706858; font-size: 0.75rem; margin-top: 0.2rem; }
        .info-box { margin-top: 1.5rem; padding: 1rem 1.5rem; background: rgba(255,215,80,0.05); border: 1px solid rgba(255,215,80,0.2); border-radius: 12px; text-align: center; color: #c0b090; font-size: 0.9rem; font-style: italic; }
        .info-box .formula-display { font-family: 'Courier New', monospace; color: #ffd54f; font-size: 1rem; margin: 0.3rem 0; }
        .back-row { text-align: center; margin-top: 1.5rem; }
        .back-link { display: inline-block; color: #ffd54f; text-decoration: none; border: 1px solid #ffd54f; padding: 0.6rem 1.5rem; border-radius: 30px; transition: 0.3s; font-size: 0.9rem; }
        .back-link:hover { background: #ffd54f; color: #0d1117; }
        @media (max-width: 700px) { .main-container { padding: 1rem; } .header h1 { font-size: 1.8rem; } .controls-panel { padding: 1rem; } }
    </style>
</head>
<body>
<div class="stars-bg" id="starsBg"></div>
<div class="main-container">
    <div class="header">
        <h1>👻 Семантический След</h1>
        <div class="subtitle">Визуализация Эксперимента №40: затухание Φₛ после ухода оператора</div>
    </div>
    <div class="canvas-wrapper" id="canvasWrapper">
        <canvas id="phantomCanvas"></canvas>
    </div>
    <div class="controls-panel">
        <div class="controls-title">🎛️ Параметры</div>
        <div class="slider-group">
            <label><span>⏱️ Время после ухода оператора</span><span class="param-value" id="timeValue">0 мин</span></label>
            <input type="range" id="timeSlider" min="0" max="180" value="0" step="0.5">
            <div class="range-labels"><span>0 мин (только ушёл)</span><span>60 мин</span><span>180 мин (3 часа)</span></div>
        </div>
        <div class="slider-group">
            <label><span>🎯 Когерентность оператора Cₛ (при жизни)</span><span class="param-value" id="csValue">0.80 (поток)</span></label>
            <input type="range" id="csSlider" min="0.1" max="1" value="0.8" step="0.01">
            <div class="range-labels"><span>0.1 (рассеянный)</span><span>0.5</span><span>1.0 (святой)</span></div>
        </div>
        <div class="slider-group">
            <label><span>☀️ Семантический заряд Qₛ (при жизни)</span><span class="param-value" id="qsValue">+7</span></label>
            <input type="range" id="qsSlider" min="-5" max="10" value="7" step="0.5">
            <div class="range-labels"><span>-5 (проклинающий)</span><span>0</span><span>+10 (святой)</span></div>
        </div>
        <div class="slider-group">
            <label><span>🧱 Материал кресла</span></label>
            <select id="materialSelect" style="width:100%;padding:0.6rem;background:rgba(0,0,0,0.3);border:1px solid #5d4a3a;color:#f3e7c0;font-family:Georgia,serif;font-size:0.95rem;border-radius:10px;">
                <option value="2.5">Дерево + ткань (τ≈2.5 часа)</option>
                <option value="1.5">Кожа (τ≈1.5 часа)</option>
                <option value="0.5">Пластик (τ≈0.5 часа)</option>
                <option value="0.15">Металл (τ≈0.15 часа)</option>
            </select>
        </div>
        <div class="slider-group" style="text-align:center;">
            <button id="pauseBtn" style="padding:0.6rem 2rem;background:rgba(255,215,80,0.1);border:1px solid #ffd54f;color:#ffd54f;border-radius:30px;font-family:Georgia,serif;font-size:1rem;cursor:pointer;">⏯️ Пауза</button>
        </div>
        <div class="info-box">
            <span id="statusText" style="color:#ffd54f;font-weight:bold;">👻 След яркий — оператор только что ушёл</span>
            <div class="formula-display" id="formulaDisplay"></div>
        </div>
    </div>
    <div class="back-row">
        <a href="visualizations.html" class="back-link">← К списку визуализаций</a>
    </div>
</div>

<script>
(function(){
    const starsBg=document.getElementById('starsBg');
    for(let i=0;i<100;i++){
        const d=document.createElement('div');d.className='star';
        d.style.left=Math.random()*100+'%';d.style.top=Math.random()*100+'%';
        const s=Math.random()*2.5+0.5;d.style.width=s+'px';d.style.height=s+'px';
        d.style.setProperty('--duration',(Math.random()*4+2)+'s');
        d.style.setProperty('--delay',(Math.random()*5)+'s');
        starsBg.appendChild(d);
    }
})();

const canvas=document.getElementById('phantomCanvas');
const ctx=canvas.getContext('2d');
const wrapper=document.getElementById('canvasWrapper');
let animTime=0,paused=false,animId;

function resize(){
    const r=wrapper.getBoundingClientRect();
    canvas.width=r.width;
    canvas.height=Math.max(500,Math.min(650,r.width*0.7));
    wrapper.style.height=canvas.height+'px';
}
resize();window.addEventListener('resize',resize);

const timeSlider=document.getElementById('timeSlider');
const csSlider=document.getElementById('csSlider');
const qsSlider=document.getElementById('qsSlider');
const materialSelect=document.getElementById('materialSelect');
const timeValue=document.getElementById('timeValue');
const csValue=document.getElementById('csValue');
const qsValue=document.getElementById('qsValue');
const pauseBtn=document.getElementById('pauseBtn');
const statusText=document.getElementById('statusText');
const formulaDisplay=document.getElementById('formulaDisplay');

timeSlider.oninput=function(){
    const t=parseFloat(this.value);
    if(t<1) timeValue.textContent=t.toFixed(1)+' мин';
    else timeValue.textContent=Math.floor(t)+' мин';
    updateInfo();
};
csSlider.oninput=function(){
    const c=parseFloat(this.value);
    if(c<0.3) csValue.textContent=c.toFixed(2)+' (рассеянный)';
    else if(c<0.6) csValue.textContent=c.toFixed(2)+' (обычный)';
    else if(c<0.85) csValue.textContent=c.toFixed(2)+' (поток)';
    else csValue.textContent=c.toFixed(2)+' (святой)';
    updateInfo();
};
qsSlider.oninput=function(){
    const q=parseFloat(this.value);
    qsValue.textContent=(q>=0?'+':'')+q.toFixed(1);
    updateInfo();
};
materialSelect.onchange=updateInfo;

pauseBtn.onclick=function(){
    paused=!paused;
    this.textContent=paused?'▶️ Продолжить':'⏯️ Пауза';
};

function updateInfo(){
    const t=parseFloat(timeSlider.value);
    const cs=parseFloat(csSlider.value);
    const qs=parseFloat(qsSlider.value);
    const tauBase=parseFloat(materialSelect.value);
    const tau=tauBase*(0.5+0.5*cs);
    const remaining=Math.abs(qs)*Math.exp(-t/(tau*60));
    
    if(remaining>7) statusText.textContent='👻 След яркий — оператор только что ушёл';
    else if(remaining>4) statusText.textContent='🌫️ След заметный — оператор был здесь недавно';
    else if(remaining>1.5) statusText.textContent='💨 След слабеет — время стирает память';
    else if(remaining>0.3) statusText.textContent='🫥 След почти исчез — скоро совсем пропадёт';
    else statusText.textContent='✨ След исчез — поле очистилось';
    
    formulaDisplay.textContent='Φ(t)=Φ₀·e^(-t/τ) | τ='+tau.toFixed(1)+' ч | Φ₀='+Math.abs(qs).toFixed(1)+' | Φ(t)='+remaining.toFixed(2);
}
updateInfo();

function getQSColor(qs,alpha){
    const absQ=Math.abs(qs);
    const norm=Math.min(1,absQ/10);
    if(absQ<0.5){const g=Math.floor(100*norm+30);return `rgba(${g},${g},${g},${alpha*0.3})`;}
    if(qs>=0){const r=Math.floor(30+norm*225);const g=Math.floor(5+norm*235);const b=Math.floor(80*(1-norm)+255*norm);return `rgba(${r},${g},${b},${alpha})`;}
    else{const r=Math.floor(80*(1-norm)+30*norm);const g=Math.floor(40*(1-norm)+5*norm);const b=Math.floor(30+norm*200);return `rgba(${r},${g},${b},${alpha})`;}
}

function drawFrame(){
    const t=parseFloat(timeSlider.value);
    const cs=parseFloat(csSlider.value);
    const qs=parseFloat(qsSlider.value);
    const tauBase=parseFloat(materialSelect.value);
    const tau=tauBase*(0.5+0.5*cs);
    const w=canvas.width,h=canvas.height;
    
    if(!paused) animTime+=0.016;
    
    const remaining=Math.abs(qs)*Math.exp(-t/(tau*60));
    const normRemaining=Math.min(1,remaining/10);
    
    // Очистка
    ctx.fillStyle='#060a10';
    ctx.fillRect(0,0,w,h);
    
    // Сетка
    ctx.strokeStyle='rgba(255,255,255,0.02)';ctx.lineWidth=1;
    for(let x=0;x<w;x+=50){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,h);ctx.stroke();}
    for(let y=0;y<h;y+=50){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(w,y);ctx.stroke();}
    
    // Кресло
    const chairX=w*0.35,chairY=h*0.3,chairW=w*0.3,chairH=h*0.45;
    
    // Свечение следа (вокруг и внутри кресла)
    const glowIntensity=normRemaining*0.6;
    const glowRadius=60+cs*40;
    
    // Множество слоёв свечения
    for(let layer=3;layer>=0;layer--){
        const r=glowRadius*(1+layer*0.4);
        const alpha=glowIntensity*(0.15+layer*0.05)*Math.exp(-layer*0.3);
        const grad=ctx.createRadialGradient(chairX+chairW/2,chairY+chairH*0.4,0,chairX+chairW/2,chairY+chairH*0.4,r);
        grad.addColorStop(0,getQSColor(qs,alpha*1.5));
        grad.addColorStop(0.3,getQSColor(qs,alpha));
        grad.addColorStop(0.7,getQSColor(qs,alpha*0.3));
        grad.addColorStop(1,'rgba(0,0,0,0)');
        ctx.fillStyle=grad;
        ctx.fillRect(chairX-r,chairY-r,chairW+r*2,chairH+r*2);
    }
    
    // Контур человека (фантом)
    if(normRemaining>0.05){
        const headX=chairX+chairW*0.45,headY=chairY-chairH*0.25,headR=chairW*0.18;
        const bodyX=chairX+chairW*0.45,bodyY=chairY+chairH*0.1,bodyW=chairW*0.35,bodyH=chairH*0.4;
        const armLW=chairW*0.12,armLH=chairH*0.35;
        const armRW=chairW*0.12,armRH=chairH*0.35;
        
        const phantomAlpha=normRemaining*0.5;
        ctx.fillStyle=getQSColor(qs,phantomAlpha);
        
        // Голова
        ctx.beginPath();ctx.arc(headX,headY,headR,0,Math.PI*2);ctx.fill();
        // Тело
        ctx.beginPath();ctx.roundRect(bodyX-bodyW/2,bodyY,bodyW,bodyH,8);ctx.fill();
        // Руки
        ctx.beginPath();ctx.roundRect(bodyX-bodyW/2-armLW-5,bodyY,armLW,armLH,6);ctx.fill();
        ctx.beginPath();ctx.roundRect(bodyX+bodyW/2+5,bodyY,armRW,armRH,6);ctx.fill();
        
        // Мерцание фантома
        ctx.fillStyle=getQSColor(qs,phantomAlpha*0.3);
        ctx.beginPath();ctx.arc(headX,headY,headR,0,Math.PI*2);ctx.fill();
        ctx.beginPath();ctx.roundRect(bodyX-bodyW/2,bodyY,bodyW,bodyH,8);ctx.fill();
    }
    
    // Частицы Qₛ, вылетающие из кресла
    const numParticles=Math.floor(remaining*8);
    for(let i=0;i<numParticles;i++){
        const seed=i*123.456+animTime;
        const angle=Math.random()*Math.PI*2;
        const dist=Math.random()*glowRadius*1.5;
        const px=chairX+chairW/2+Math.cos(angle)*dist;
        const py=chairY+chairH*0.4+Math.sin(angle)*dist;
        const alpha=normRemaining*0.5*(1-dist/(glowRadius*1.5));
        const twinkle=Math.sin(seed*5+animTime*3)*0.5+0.5;
        
        ctx.fillStyle=getQSColor(qs,alpha*twinkle);
        ctx.beginPath();ctx.arc(px,py,1.5+normRemaining*2,0,Math.PI*2);ctx.fill();
    }
    
    // Кресло (поверх свечения)
    // Спинка
    ctx.fillStyle='#4a3728';
    ctx.strokeStyle='rgba(255,255,255,0.3)';
    ctx.lineWidth=2;
    ctx.beginPath();ctx.roundRect(chairX,chairY,chairW*0.15,chairH*0.8,6);ctx.fill();ctx.stroke();
    // Сиденье
    ctx.fillStyle='#5d4037';
    ctx.beginPath();ctx.roundRect(chairX,chairY+chairH*0.6,chairW,chairH*0.15,6);ctx.fill();ctx.stroke();
    // Ножки
    ctx.fillStyle='#3e2723';
    ctx.fillRect(chairX+5,chairY+chairH*0.75,8,chairH*0.25);
    ctx.fillRect(chairX+chairW-13,chairY+chairH*0.75,8,chairH*0.25);
    // Подлокотники
    ctx.fillStyle='#4a3728';
    ctx.beginPath();ctx.roundRect(chairX-chairW*0.02,chairY+chairH*0.5,chairW*0.12,chairH*0.12,4);ctx.fill();ctx.stroke();
    ctx.beginPath();ctx.roundRect(chairX+chairW-chairW*0.1,chairY+chairH*0.5,chairW*0.12,chairH*0.12,4);ctx.fill();ctx.stroke();
    
    // Подписи
    ctx.fillStyle=getQSColor(qs,0.8);
    ctx.font='bold 16px Georgia,serif';
    ctx.textAlign='center';
    ctx.fillText('Φₛ (след)',chairX+chairW/2,chairY-50);
    
    ctx.fillStyle='rgba(255,255,255,0.5)';
    ctx.font='13px Georgia,serif';
    ctx.fillText('τ (время релаксации) = '+tau.toFixed(1)+' ч',chairX+chairW/2,chairY+chairH+50);
    ctx.fillText('Cₛ оператора = '+cs.toFixed(2),chairX+chairW/2,chairY+chairH+70);
    ctx.fillText('Материал: '+materialSelect.options[materialSelect.selectedIndex].text.split(' (')[0],chairX+chairW/2,chairY+chairH+90);
    
    // График затухания (справа)
    const graphX=w*0.75,graphY=h*0.1,graphW=w*0.2,graphH=h*0.35;
    ctx.fillStyle='rgba(0,0,0,0.3)';
    ctx.fillRect(graphX,graphY,graphW,graphH);
    ctx.strokeStyle='rgba(255,255,255,0.3)';
    ctx.strokeRect(graphX,graphY,graphW,graphH);
    
    ctx.strokeStyle=getQSColor(qs,0.8);
    ctx.lineWidth=2;
    ctx.beginPath();
    for(let i=0;i<=graphW;i+=2){
        const frac=i/graphW;
        const x=graphX+i;
        const val=Math.exp(-frac*3);
        const y=graphY+graphH*(1-val);
        if(i===0) ctx.moveTo(x,y);
        else ctx.lineTo(x,y);
    }
    ctx.stroke();
    
    // Текущая точка на графике
    const currentFrac=Math.min(1,t/(tau*60*3));
    const dotX=graphX+currentFrac*graphW;
    const dotVal=Math.exp(-t/(tau*60));
    const dotY=graphY+graphH*(1-dotVal);
    ctx.fillStyle=getQSColor(qs,1);
    ctx.beginPath();ctx.arc(dotX,dotY,4,0,Math.PI*2);ctx.fill();
    
    ctx.fillStyle='rgba(255,255,255,0.5)';
    ctx.font='10px Georgia,serif';
    ctx.textAlign='left';
    ctx.fillText('Φ(t)',graphX,graphY-5);
    ctx.fillText('t→',graphX+graphW-20,graphY+graphH+15);
    
    animId=requestAnimationFrame(drawFrame);
}

drawFrame();
window.addEventListener('beforeunload',()=>{if(animId)cancelAnimationFrame(animId);});
</script>

</body>
</html>
