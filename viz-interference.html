<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Интерференция Qₛ-волн • Идеатоника</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: linear-gradient(145deg, #0d1117 0%, #161b22 100%);
            min-height: 100vh;
            font-family: 'Georgia', 'Times New Roman', serif;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            padding: 1rem; overflow-x: hidden;
        }
        .stars-bg { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 0; }
        .star { position: absolute; background: white; border-radius: 50%; animation: twinkle var(--duration) ease-in-out infinite; animation-delay: var(--delay); opacity: 0; }
        @keyframes twinkle { 0%,100% { opacity:0.2; transform:scale(1); } 50% { opacity:1; transform:scale(1.8); } }
        .main-container {
            position: relative; z-index: 1; width: 100%; max-width: 1100px;
            background: rgba(22,27,34,0.85); backdrop-filter: blur(12px);
            border: 1px solid rgba(227,184,124,0.3); border-radius: 32px;
            padding: 2rem; box-shadow: 0 20px 40px rgba(0,0,0,0.6);
        }
        .header { text-align: center; margin-bottom: 1.5rem; }
        .header h1 { font-size: 2.5rem; font-weight: 400; letter-spacing: 3px; color: #f3e7c0; text-shadow: 0 0 20px rgba(255,215,80,0.4); margin-bottom: 0.3rem; }
        .header .subtitle { font-size: 1rem; color: #c0b090; font-style: italic; border-bottom: 1px solid #5d4a3a; display: inline-block; padding-bottom: 0.4rem; }
        .canvas-wrapper { position: relative; width: 100%; background: radial-gradient(ellipse at center, #1a2030 0%, #0a0e14 100%); border-radius: 20px; border: 1px solid #5d4a3a; overflow: hidden; margin-bottom: 1.5rem; box-shadow: inset 0 0 80px rgba(0,0,0,0.5); }
        canvas { display: block; width: 100%; height: auto; }
        .controls-panel { background: rgba(0,0,0,0.3); border: 1px solid #5d4a3a; border-radius: 20px; padding: 1.5rem 2rem; }
        .controls-title { font-size: 1.2rem; color: #ffd54f; margin-bottom: 1.2rem; text-align: center; letter-spacing: 1px; }
        .slider-group { margin-bottom: 1.2rem; }
        .slider-group label { display: flex; justify-content: space-between; align-items: center; color: #d0c8b8; font-size: 0.95rem; margin-bottom: 0.4rem; }
        .slider-group label .param-value { color: #ffd54f; font-weight: bold; font-size: 1.1rem; min-width: 50px; text-align: right; }
        .slider-group input[type="range"] { width: 100%; -webkit-appearance: none; height: 8px; background: linear-gradient(90deg, #3a2a4a, #5d4a3a, #3a2a4a); border-radius: 4px; outline: none; cursor: pointer; }
        .slider-group input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; width: 24px; height: 24px; background: radial-gradient(circle at 40% 40%, #ffe082, #ff8f00); border-radius: 50%; cursor: pointer; box-shadow: 0 0 15px rgba(255,215,80,0.6); border: 2px solid #ffd54f; }
        .range-labels { display: flex; justify-content: space-between; color: #706858; font-size: 0.75rem; margin-top: 0.2rem; }
        .info-box { margin-top: 1.5rem; padding: 1rem 1.5rem; background: rgba(255,215,80,0.05); border: 1px solid rgba(255,215,80,0.2); border-radius: 12px; text-align: center; color: #c0b090; font-size: 0.9rem; font-style: italic; }
        .info-box .formula-display { font-family: 'Courier New', monospace; color: #ffd54f; font-size: 1rem; margin: 0.3rem 0; }
        .back-row { text-align: center; margin-top: 1.5rem; }
        .back-link { display: inline-block; color: #ffd54f; text-decoration: none; border: 1px solid #ffd54f; padding: 0.6rem 1.5rem; border-radius: 30px; transition: 0.3s; font-size: 0.9rem; }
        .back-link:hover { background: #ffd54f; color: #0d1117; }
        @media (max-width: 700px) { .main-container { padding: 1rem; } .header h1 { font-size: 1.8rem; } .controls-panel { padding: 1rem; } }
    </style>
</head>
<body>
<div class="stars-bg" id="starsBg"></div>
<div class="main-container">
    <div class="header">
        <h1>🌊 Интерференция Qₛ-волн</h1>
        <div class="subtitle">Визуализация §92: столкновение смыслов</div>
    </div>
    <div class="canvas-wrapper" id="canvasWrapper">
        <canvas id="interferenceCanvas"></canvas>
    </div>
    <div class="controls-panel">
        <div class="controls-title">🎛️ Параметры</div>
        <div class="slider-group">
            <label><span>🔄 Разность фаз (Δφ)</span><span class="param-value" id="phaseValue">0°</span></label>
            <input type="range" id="phaseSlider" min="0" max="360" value="0" step="1">
            <div class="range-labels"><span>0° (усиление)</span><span>180° (гашение)</span><span>360°</span></div>
        </div>
        <div class="slider-group">
            <label><span>📏 Расстояние</span><span class="param-value" id="distValue">300 px</span></label>
            <input type="range" id="distSlider" min="100" max="600" value="300" step="10">
            <div class="range-labels"><span>100 px</span><span>300 px</span><span>600 px</span></div>
        </div>
        <div class="slider-group">
            <label><span style="color:#64b5f6;">🔵 Амплитуда Φ₁</span><span class="param-value" id="amp1Value">1.0</span></label>
            <input type="range" id="amp1Slider" min="0.1" max="2.0" value="1.0" step="0.1">
            <div class="range-labels"><span>0.1</span><span>1.0</span><span>2.0</span></div>
        </div>
        <div class="slider-group">
            <label><span style="color:#ef5350;">🔴 Амплитуда Φ₂</span><span class="param-value" id="amp2Value">1.0</span></label>
            <input type="range" id="amp2Slider" min="0.1" max="2.0" value="1.0" step="0.1">
            <div class="range-labels"><span>0.1</span><span>1.0</span><span>2.0</span></div>
        </div>
        <div class="slider-group">
            <label><span>⏱️ Скорость</span><span class="param-value" id="speedValue">1.0x</span></label>
            <input type="range" id="speedSlider" min="0.1" max="2.0" value="1.0" step="0.1">
            <div class="range-labels"><span>0.1x</span><span>1.0x</span><span>2.0x</span></div>
        </div>
        <div class="slider-group" style="text-align:center;">
            <button id="pauseBtn" style="padding:0.6rem 2rem;background:rgba(255,215,80,0.1);border:1px solid #ffd54f;color:#ffd54f;border-radius:30px;font-family:Georgia,serif;font-size:1rem;cursor:pointer;">⏯️ Пауза</button>
        </div>
        <div class="info-box">
            <span id="interferenceResult" style="color:#ffd54f;font-weight:bold;">💪 КОНСТРУКТИВНАЯ</span>
            <div class="formula-display" id="formulaDisplay"></div>
        </div>
    </div>
    <div class="back-row">
        <a href="visualizations.html" class="back-link">← К списку визуализаций</a>
    </div>
</div>

<script>
(function(){
    const starsBg=document.getElementById('starsBg');
    for(let i=0;i<100;i++){
        const d=document.createElement('div');d.className='star';
        d.style.left=Math.random()*100+'%';d.style.top=Math.random()*100+'%';
        const s=Math.random()*2.5+0.5;d.style.width=s+'px';d.style.height=s+'px';
        d.style.setProperty('--duration',(Math.random()*4+2)+'s');
        d.style.setProperty('--delay',(Math.random()*5)+'s');
        starsBg.appendChild(d);
    }
})();

const canvas=document.getElementById('interferenceCanvas');
const ctx=canvas.getContext('2d');
const wrapper=document.getElementById('canvasWrapper');
let time=0,paused=false,animId;
let pixelMemory=null; // Uint8Array RGBA

function resize(){
    const r=wrapper.getBoundingClientRect();
    canvas.width=r.width;
    canvas.height=Math.max(500,Math.min(700,r.width*0.7));
    wrapper.style.height=canvas.height+'px';
    pixelMemory=null; // сброс при ресайзе
}
resize();window.addEventListener('resize',resize);

const sliders={
    phase:document.getElementById('phaseSlider'),
    dist:document.getElementById('distSlider'),
    amp1:document.getElementById('amp1Slider'),
    amp2:document.getElementById('amp2Slider'),
    speed:document.getElementById('speedSlider')
};
const vals={
    phase:document.getElementById('phaseValue'),
    dist:document.getElementById('distValue'),
    amp1:document.getElementById('amp1Value'),
    amp2:document.getElementById('amp2Value'),
    speed:document.getElementById('speedValue')
};
const pauseBtn=document.getElementById('pauseBtn');
const resultEl=document.getElementById('interferenceResult');
const formulaEl=document.getElementById('formulaDisplay');

function getP(){
    return{
        phaseDiff:parseFloat(sliders.phase.value)*Math.PI/180,
        dist:parseFloat(sliders.dist.value),
        amp1:parseFloat(sliders.amp1.value),
        amp2:parseFloat(sliders.amp2.value),
        speed:parseFloat(sliders.speed.value)
    };
}

sliders.phase.oninput=function(){vals.phase.textContent=this.value+'°';updateInfo();};
sliders.dist.oninput=function(){vals.dist.textContent=this.value+' px';updateInfo();};
sliders.amp1.oninput=function(){vals.amp1.textContent=parseFloat(this.value).toFixed(1);updateInfo();};
sliders.amp2.oninput=function(){vals.amp2.textContent=parseFloat(this.value).toFixed(1);updateInfo();};
sliders.speed.oninput=function(){vals.speed.textContent=parseFloat(this.value).toFixed(1)+'x';};

pauseBtn.onclick=function(){
    paused=!paused;
    this.textContent=paused?'▶️ Продолжить':'⏯️ Пауза';
};

function updateInfo(){
    const p=getP();
    const cos=Math.cos(p.phaseDiff);
    const res=Math.sqrt(p.amp1*p.amp1+p.amp2*p.amp2+2*p.amp1*p.amp2*cos);
    if(cos>0.5){resultEl.textContent='💪 УСИЛЕНИЕ (запоминается)';resultEl.style.color='#ce93d8';}
    else if(cos<-0.5){resultEl.textContent='❌ ГАШЕНИЕ (запоминается)';resultEl.style.color='#78909c';}
    else{resultEl.textContent='🟰 ПРОМЕЖУТОЧНАЯ';resultEl.style.color='#ffd54f';}
    formulaEl.textContent='Φ_рез = '+res.toFixed(2);
}

const waves=[];
let waveId=0;
const WAVELENGTH=55;
const MAX_AGE=25;

function spawnWaves(){
    const p=getP();
    const w=canvas.width,h=canvas.height;
    const cx1=w/2-p.dist/2, cx2=w/2+p.dist/2, cy=h/2;
    for(let i=waves.length-1;i>=0;i--){
        if(time-waves[i].birthTime>MAX_AGE) waves.splice(i,1);
    }
    const interval=WAVELENGTH/(p.speed*45);
    const lastBlue=waves.filter(w=>w.color==='blue').sort((a,b)=>b.birthTime-a.birthTime)[0];
    const lastRed=waves.filter(w=>w.color==='red').sort((a,b)=>b.birthTime-a.birthTime)[0];
    if(!lastBlue||time-lastBlue.birthTime>=interval){
        waves.push({cx:cx1,cy:cy,color:'blue',amp:p.amp1,birthTime:time,id:waveId++});
    }
    if(!lastRed||time-lastRed.birthTime>=interval){
        waves.push({cx:cx2,cy:cy,color:'red',amp:p.amp2,birthTime:time,id:waveId++});
    }
}

function drawFrame(){
    const p=getP();
    const w=canvas.width,h=canvas.height;
    const cx1=w/2-p.dist/2, cx2=w/2+p.dist/2, cy=h/2;
    const cosPhase=Math.cos(p.phaseDiff);
    
    // Инициализация памяти
    if(!pixelMemory) pixelMemory=new Uint8Array(w*h*4);
    
    ctx.fillStyle='#060a10';
    ctx.fillRect(0,0,w,h);
    
    ctx.strokeStyle='rgba(255,255,255,0.02)';ctx.lineWidth=1;
    for(let x=0;x<w;x+=50){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,h);ctx.stroke();}
    for(let y=0;y<h;y+=50){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(w,y);ctx.stroke();}
    
    spawnWaves();
    if(!paused) time+=0.05;
    
    const step=2;
    const maxDist=Math.max(w,h)*1.5;
    
    for(let x=0;x<w;x+=step){
        for(let y=0;y<h;y+=step){
            const idx=(y*w+x)*4;
            let blueAmp=0, redAmp=0;
            let hasBlue=false, hasRed=false;
            
            for(const wave of waves){
                const age=time-wave.birthTime;
                const radius=age*(p.speed*45);
                if(radius<0) continue;
                const dist=Math.sqrt((x-wave.cx)**2+(y-wave.cy)**2);
                const thickness=3+wave.amp*2;
                if(Math.abs(dist-radius)<thickness){
                    const decay=Math.max(0,1-radius/maxDist);
                    const amp=wave.amp*decay;
                    if(wave.color==='blue'){blueAmp=amp;hasBlue=true;}
                    else{redAmp=amp;hasRed=true;}
                }
            }
            
            if(!hasBlue&&!hasRed) continue;
            
            let r=0,g=0,b=0,alpha=0;
            
            // Проверяем, есть ли уже запомненный цвет
            const memAlpha=pixelMemory[idx+3];
            
            if(hasBlue&&!hasRed){
                if(memAlpha===0){
                    // Первый раз — записываем
                    r=Math.floor(blueAmp*64);
                    g=Math.floor(blueAmp*120);
                    b=Math.floor(blueAmp*255);
                    alpha=0.2+blueAmp*0.6;
                    pixelMemory[idx]=r; pixelMemory[idx+1]=g; pixelMemory[idx+2]=b; pixelMemory[idx+3]=Math.floor(alpha*255);
                }else{
                    // Используем запомненный цвет
                    r=pixelMemory[idx]; g=pixelMemory[idx+1]; b=pixelMemory[idx+2]; alpha=pixelMemory[idx+3]/255;
                }
            }else if(hasRed&&!hasBlue){
                if(memAlpha===0){
                    r=Math.floor(redAmp*255);
                    g=Math.floor(redAmp*40);
                    b=Math.floor(redAmp*60);
                    alpha=0.2+redAmp*0.6;
                    pixelMemory[idx]=r; pixelMemory[idx+1]=g; pixelMemory[idx+2]=b; pixelMemory[idx+3]=Math.floor(alpha*255);
                }else{
                    r=pixelMemory[idx]; g=pixelMemory[idx+1]; b=pixelMemory[idx+2]; alpha=pixelMemory[idx+3]/255;
                }
            }else{
                // ОБЕ ВОЛНЫ — ИНТЕРФЕРЕНЦИЯ
                const totalAmp=blueAmp+redAmp+0.001;
                const sumAmp=blueAmp+redAmp*cosPhase;
                const brightness=Math.abs(sumAmp)/totalAmp;
                const bw=blueAmp/totalAmp;
                const rw=redAmp/totalAmp;
                
                // ВСЕГДА перезаписываем память при интерференции (новый цвет)
                if(cosPhase>0.5){
                    r=Math.floor((rw*255+bw*64)*brightness);
                    g=Math.floor((rw*40+bw*120)*brightness);
                    b=Math.floor((rw*60+bw*255)*brightness);
                    alpha=0.5+brightness*0.5;
                }else if(cosPhase<-0.5){
                    r=Math.floor(30*brightness);
                    g=Math.floor(5*brightness);
                    b=Math.floor(40*brightness);
                    alpha=0.02+brightness*0.15;
                }else{
                    r=Math.floor((rw*255+bw*64)*brightness);
                    g=Math.floor((rw*40+bw*120)*brightness);
                    b=Math.floor((rw*60+bw*255)*brightness);
                    alpha=0.2+brightness*0.5;
                }
                pixelMemory[idx]=r; pixelMemory[idx+1]=g; pixelMemory[idx+2]=b; pixelMemory[idx+3]=Math.floor(alpha*255);
            }
            
            if(alpha>0.01){
                ctx.fillStyle=`rgba(${r},${g},${b},${alpha})`;
                ctx.fillRect(x,y,step,step);
            }
        }
    }
    
    function drawSource(cx,cy,amp,color,label){
        const pulse=1+0.15*Math.sin(time*3);
        const radius=14*pulse*(0.7+0.3*amp);
        const grad=ctx.createRadialGradient(cx,cy,0,cx,cy,radius*2.5);
        grad.addColorStop(0,'#ffffff');
        grad.addColorStop(0.2,color);
        grad.addColorStop(0.6,color.replace('rgb','rgba').replace(')',',0.3)'));
        grad.addColorStop(1,'rgba(0,0,0,0)');
        ctx.fillStyle=grad;
        ctx.beginPath();ctx.arc(cx,cy,radius*2.5,0,Math.PI*2);ctx.fill();
        ctx.fillStyle=color;
        ctx.font='bold 16px Georgia,serif';ctx.textAlign='center';
        ctx.fillText(label,cx,cy-radius-16);
    }
    drawSource(cx1,cy,p.amp1,'rgb(64,180,255)','Φ₁');
    drawSource(cx2,cy,p.amp2,'rgb(255,82,82)','Φ₂');
    
    animId=requestAnimationFrame(drawFrame);
}

updateInfo();
drawFrame();
window.addEventListener('beforeunload',()=>{if(animId)cancelAnimationFrame(animId);});
</script>

</body>
</html>
