<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Калькулятор Совместимости • Идеатоника</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: linear-gradient(145deg, #1a1a2e 0%, #16213e 100%); min-height: 100vh; font-family: 'Georgia', serif; padding: 2rem; display: flex; flex-direction: column; align-items: center; }
        .cosmic-bg { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 0; }
        .main-container { max-width: 800px; width: 100%; position: relative; z-index: 1; background: rgba(30,40,60,0.85); backdrop-filter: blur(12px); border: 1px solid rgba(227,184,124,0.4); border-radius: 32px; padding: 2.5rem; box-shadow: 0 20px 40px rgba(0,0,0,0.5); }
        h1 { font-size: 2.5rem; color: #f3e7c0; text-align: center; margin-bottom: 0.5rem; font-weight: 400; }
        .subtitle { text-align: center; color: #c0b090; font-style: italic; margin-bottom: 2rem; border-bottom: 1px solid #5d4a3a; padding-bottom: 1rem; }
        
        .two-columns { display: flex; gap: 2rem; margin-bottom: 2rem; }
        @media (max-width: 650px) { .two-columns { flex-direction: column; } }
        
        .person-card { flex: 1; background: rgba(0,0,0,0.2); border-radius: 20px; padding: 1.5rem; border: 1px solid #5d4a3a; }
        .person-card h3 { color: #ffd54f; text-align: center; font-size: 1.2rem; margin-bottom: 1rem; }
        .person-card .emoji { font-size: 3rem; text-align: center; margin-bottom: 0.5rem; }
        
        .input-group { margin-bottom: 1.2rem; }
        .input-group label { display: flex; justify-content: space-between; color: #d0c8b8; font-size: 0.9rem; margin-bottom: 0.3rem; }
        .input-group label span { color: #ffd54f; font-weight: bold; }
        .input-group input[type="range"] { width: 100%; -webkit-appearance: none; height: 6px; background: #5d4a3a; border-radius: 3px; outline: none; cursor: pointer; }
        .input-group input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; width: 20px; height: 20px; background: #ffd54f; border-radius: 50%; cursor: pointer; }
        .input-group .range-labels { display: flex; justify-content: space-between; color: #706858; font-size: 0.7rem; margin-top: 0.2rem; }
        
        .result-box { background: rgba(255,215,80,0.1); border: 2px solid #ffd54f; border-radius: 20px; padding: 2rem; text-align: center; margin-top: 1rem; }
        .result-number { font-size: 5rem; font-weight: bold; color: #ffd54f; line-height: 1; }
        .result-label { color: #c0b090; font-size: 1.2rem; margin-top: 0.5rem; }
        .result-extra { color: #d0c8b8; font-size: 1rem; margin-top: 1rem; font-style: italic; line-height: 1.6; }
        .result-formula { color: #a09080; font-size: 0.85rem; margin-top: 1rem; font-family: 'Courier New', monospace; }
        .result-details { display: flex; justify-content: center; gap: 2rem; margin-top: 1.5rem; flex-wrap: wrap; }
        .detail-item { text-align: center; }
        .detail-item .label { color: #706858; font-size: 0.8rem; }
        .detail-item .value { color: #ffd54f; font-size: 1.5rem; font-weight: bold; }
        
        .back-link { display: inline-block; margin-top: 1.5rem; color: #ffd54f; text-decoration: none; border: 1px solid #ffd54f; padding: 0.6rem 1.5rem; border-radius: 30px; transition: 0.2s; }
        .back-link:hover { background: #ffd54f; color: #1a1a2e; }
    </style>
</head>
<body>
<div class="cosmic-bg"></div>
<div class="main-container">

    <h1>💞 Совместимость людей</h1>
    <div class="subtitle">Калькулятор семантической гармонии (§14, §26, §104)</div>

    <div class="two-columns">
        <!-- Первый человек -->
        <div class="person-card">
            <div class="emoji">🧑</div>
            <h3>Человек А</h3>
            <div class="input-group">
                <label>☀️ Qₛ (Свет/Тьма): <span id="q1Value">+3</span></label>
                <input type="range" id="q1Slider" min="-10" max="10" value="3" step="1">
                <div class="range-labels"><span>-10</span><span>0</span><span>+10</span></div>
            </div>
            <div class="input-group">
                <label>🎯 Cₛ (Когерентность): <span id="c1Value">0.60</span></label>
                <input type="range" id="c1Slider" min="0.1" max="1" value="0.6" step="0.01">
                <div class="range-labels"><span>0.1</span><span>0.5</span><span>1.0</span></div>
            </div>
            <div class="input-group">
                <label>🔮 χ (Чувствительность): <span id="chi1Value">5.0</span></label>
                <input type="range" id="chi1Slider" min="0" max="10" value="5" step="0.1">
                <div class="range-labels"><span>0</span><span>5</span><span>10</span></div>
            </div>
        </div>

        <!-- Второй человек -->
        <div class="person-card">
            <div class="emoji">👩</div>
            <h3>Человек Б</h3>
            <div class="input-group">
                <label>☀️ Qₛ (Свет/Тьма): <span id="q2Value">+2</span></label>
                <input type="range" id="q2Slider" min="-10" max="10" value="2" step="1">
                <div class="range-labels"><span>-10</span><span>0</span><span>+10</span></div>
            </div>
            <div class="input-group">
                <label>🎯 Cₛ (Когерентность): <span id="c2Value">0.50</span></label>
                <input type="range" id="c2Slider" min="0.1" max="1" value="0.5" step="0.01">
                <div class="range-labels"><span>0.1</span><span>0.5</span><span>1.0</span></div>
            </div>
            <div class="input-group">
                <label>🔮 χ (Чувствительность): <span id="chi2Value">4.0</span></label>
                <input type="range" id="chi2Slider" min="0" max="10" value="4" step="0.1">
                <div class="range-labels"><span>0</span><span>5</span><span>10</span></div>
            </div>
        </div>
    </div>

    <!-- Результат -->
    <div class="result-box" id="resultBox">
        <div class="result-number" id="resultNumber">—</div>
        <div class="result-label" id="resultLabel">Совместимость</div>
        <div class="result-details">
            <div class="detail-item"><div class="label">Резонанс Qₛ</div><div class="value" id="resonanceQ">—</div></div>
            <div class="detail-item"><div class="label">Синхронизация Cₛ</div><div class="value" id="resonanceC">—</div></div>
            <div class="detail-item"><div class="label">Эмпатия χ</div><div class="value" id="resonanceChi">—</div></div>
        </div>
        <div class="result-extra" id="resultExtra"></div>
        <div class="result-formula" id="resultFormula"></div>
    </div>

    <div style="text-align: center;">
        <a href="semantic-calculators.html" class="back-link">← К списку калькуляторов</a>
    </div>

</div>

<script>
    const q1Slider = document.getElementById('q1Slider');
    const c1Slider = document.getElementById('c1Slider');
    const chi1Slider = document.getElementById('chi1Slider');
    const q2Slider = document.getElementById('q2Slider');
    const c2Slider = document.getElementById('c2Slider');
    const chi2Slider = document.getElementById('chi2Slider');

    const q1Value = document.getElementById('q1Value');
    const c1Value = document.getElementById('c1Value');
    const chi1Value = document.getElementById('chi1Value');
    const q2Value = document.getElementById('q2Value');
    const c2Value = document.getElementById('c2Value');
    const chi2Value = document.getElementById('chi2Value');

    const resultNumber = document.getElementById('resultNumber');
    const resultLabel = document.getElementById('resultLabel');
    const resultExtra = document.getElementById('resultExtra');
    const resultFormula = document.getElementById('resultFormula');
    const resonanceQ = document.getElementById('resonanceQ');
    const resonanceC = document.getElementById('resonanceC');
    const resonanceChi = document.getElementById('resonanceChi');

    function updateValue(slider, display, format) {
        slider.addEventListener('input', () => {
            const val = parseFloat(slider.value);
            display.textContent = (val >= 0 && format !== 'chi' ? '+' : '') + val.toFixed(format === 'chi' ? 1 : 2);
            calculate();
        });
    }

    updateValue(q1Slider, q1Value, 'q');
    updateValue(c1Slider, c1Value, 'c');
    updateValue(chi1Slider, chi1Value, 'chi');
    updateValue(q2Slider, q2Value, 'q');
    updateValue(c2Slider, c2Value, 'c');
    updateValue(chi2Slider, chi2Value, 'chi');

    function calculate() {
        const Q1 = parseInt(q1Slider.value);
        const C1 = parseFloat(c1Slider.value);
        const Chi1 = parseFloat(chi1Slider.value);
        const Q2 = parseInt(q2Slider.value);
        const C2 = parseFloat(c2Slider.value);
        const Chi2 = parseFloat(chi2Slider.value);

        // Совместимость по Qₛ (0–100%): чем ближе значения, тем лучше
        const qDiff = Math.abs(Q1 - Q2);
        const qScore = Math.max(0, 100 - qDiff * 10);

        // Совместимость по Cₛ (0–100%): чем ближе, тем лучше
        const cDiff = Math.abs(C1 - C2);
        const cScore = Math.max(0, 100 - cDiff * 200);

        // Эмпатическая связь (0–100%): средняя χ, умноженная на близость
        const chiAvg = (Chi1 + Chi2) / 2;
        const chiScore = Math.min(100, chiAvg * 10);

        // Знаки Qₛ: если оба положительные или оба отрицательные — бонус
        let signBonus = 0;
        if ((Q1 > 0 && Q2 > 0) || (Q1 < 0 && Q2 < 0)) signBonus = 15;
        if (Q1 === 0 || Q2 === 0) signBonus = 5;

        // Итоговая совместимость
        const totalScore = Math.round((qScore * 0.35 + cScore * 0.35 + chiScore * 0.2 + signBonus) * 10) / 10;
        const finalScore = Math.min(100, Math.max(0, totalScore));

        resultNumber.textContent = finalScore.toFixed(0) + '%';
        resultLabel.textContent = 'Совместимость';

        resonanceQ.textContent = qScore.toFixed(0) + '%';
        resonanceC.textContent = cScore.toFixed(0) + '%';
        resonanceChi.textContent = chiScore.toFixed(0) + '%';

        let interpretation = '';
        if (finalScore >= 85) interpretation = '💞 Идеальная пара! Ваши поля резонируют. Вы понимаете друг друга без слов. Берегите эту связь.';
        else if (finalScore >= 70) interpretation = '✨ Отличная совместимость. Лёгкое общение, взаимопонимание, поддержка. Хороший фундамент для отношений.';
        else if (finalScore >= 50) interpretation = '🤝 Хорошая совместимость. Вы разные, но можете найти общий язык. Нужно чуть больше усилий для гармонии.';
        else if (finalScore >= 30) interpretation = '🌫️ Средняя совместимость. Возможны недопонимания. Рекомендуется повышать Cₛ обоим.';
        else if (finalScore >= 15) interpretation = '⚠️ Сложная совместимость. Вы на очень разных частотах. Общение может истощать обоих.';
        else interpretation = '💔 Крайне низкая совместимость. Ваши поля конфликтуют. Лучше держаться на расстоянии.';
        resultExtra.textContent = interpretation;

        resultFormula.textContent = `Q-резонанс: 100% — |${Q1} — ${Q2}|·10 = ${qScore.toFixed(0)}%. C-синхр.: ${cScore.toFixed(0)}%. χ-эмпатия: ${chiScore.toFixed(0)}%. Бонус знака: +${signBonus}%`;
    }

    calculate();
</script>

</body>
</html>
