<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Тест: Ваш путь • Идеатоника</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: linear-gradient(145deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            font-family: 'Georgia', 'Times New Roman', serif;
            padding: 2rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            transition: background 0.5s ease;
        }
        .cosmic-bg {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle at 30% 40%, rgba(255,215,150,0.08) 0%, transparent 50%),
                        radial-gradient(circle at 80% 70%, rgba(100,150,255,0.05) 0%, transparent 60%);
            pointer-events: none; z-index: 0;
        }
        .test-container {
            max-width: 700px; width: 100%; position: relative; z-index: 1;
            background: rgba(30, 40, 60, 0.85); backdrop-filter: blur(12px);
            border: 1px solid rgba(227, 184, 124, 0.4); border-radius: 32px;
            padding: 2.5rem; box-shadow: 0 20px 40px rgba(0,0,0,0.5);
            transition: border-color 0.3s ease;
        }
        .test-header { text-align: center; margin-bottom: 2rem; }
        .test-header h1 { font-size: 2.2rem; color: #f3e7c0; margin-bottom: 0.5rem; display: flex; align-items: center; justify-content: center; gap: 10px; }
        .progress-bar { width: 100%; height: 6px; background: rgba(0,0,0,0.3); border-radius: 3px; margin: 1.5rem 0; }
        .progress-fill { height: 100%; background: #ffb74d; border-radius: 3px; width: 0%; transition: width 0.3s ease; }
        .progress-text { text-align: right; color: #a09080; font-size: 0.8rem; margin-top: 0.3rem; }
        .question-box { margin-bottom: 2rem; }
        .question-text { color: #f3e7c0; font-size: 1.3rem; margin-bottom: 1.5rem; line-height: 1.5; }
        .options { display: flex; flex-direction: column; gap: 12px; }
        .option {
            background: rgba(0,0,0,0.2); border: 1px solid #5d4a3a; border-radius: 16px;
            padding: 1rem 1.5rem; cursor: pointer; transition: all 0.2s ease; color: #d0c8b8;
            display: flex; align-items: center; gap: 15px;
        }
        .option:hover { background: rgba(255, 183, 77, 0.15); border-color: #ffb74d; }
        .option.selected { background: rgba(255, 183, 77, 0.25); border-color: #ffb74d; color: #f3e7c0; }
        .option-marker {
            width: 24px; height: 24px; border-radius: 50%; border: 2px solid #5d4a3a;
            display: flex; align-items: center; justify-content: center; transition: all 0.2s;
        }
        .option.selected .option-marker { border-color: #ffb74d; background: #ffb74d; box-shadow: 0 0 10px #ffb74d; }
        .option.selected .option-marker::after { content: "✓"; color: #1a1a2e; font-weight: bold; }
        .option-text { flex: 1; }
        .nav-buttons { display: flex; justify-content: space-between; margin-top: 2rem; gap: 15px; }
        .btn {
            background: transparent; border: 1.5px solid #ffb74d; color: #ffb74d;
            padding: 0.8rem 1.8rem; font-size: 1rem; font-weight: bold; border-radius: 40px;
            cursor: pointer; transition: 0.2s; font-family: inherit;
        }
        .btn:hover { background: #ffb74d; color: #1a1a2e; }
        .btn:disabled { opacity: 0.3; cursor: not-allowed; }
        .btn-secondary { border-color: #5d4a3a; color: #a09080; }
        .btn-secondary:hover { background: #5d4a3a; color: #d0c8b8; }
        .result-container { text-align: center; }
        .result-score { font-size: 5rem; font-weight: bold; margin: 1rem 0; }
        .result-scale { font-size: 1.2rem; margin-bottom: 1.5rem; }
        .result-comment { background: rgba(0,0,0,0.2); border-radius: 20px; padding: 1.5rem; margin: 1.5rem 0; line-height: 1.6; }
        .result-advice { background: rgba(255, 183, 77, 0.1); border-left: 4px solid #ffb74d; padding: 1.2rem 1.5rem; border-radius: 0 12px 12px 0; text-align: left; }
        .hidden { display: none !important; }
        .back-link { display: inline-block; margin-top: 1.5rem; color: #ffb74d; text-decoration: none; font-size: 0.9rem; }
        .back-link:hover { text-decoration: underline; }
    </style>
</head>
<body id="mainBody">
<div class="cosmic-bg"></div>
<div class="test-container" id="testContainer">
    
    <div class="test-header">
        <h1><span>🧭</span><span id="testTitle">Ваш путь</span><span>🌅</span></h1>
        <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
        <div class="progress-text" id="progressText">Вопрос 1 из 7</div>
    </div>
    
    <div id="questionContainer"></div>
    
    <div class="nav-buttons">
        <button class="btn btn-secondary" id="prevBtn" disabled>← Назад</button>
        <button class="btn btn-secondary" id="exitBtn">🚪 Выйти</button>
        <button class="btn" id="nextBtn">Далее →</button>
    </div>
    
    <div style="text-align: center;">
        <a href="diagnostics-hub.html" class="back-link">← Вернуться в Хаб Диагностики</a>
    </div>
</div>

<script>
    (function() {
        const questions = [
            {
                text: "Представляя своё будущее через 5 лет, что вы видите?",
                options: [
                    { text: "Пустоту, темноту, ничего не вижу", value: -3 },
                    { text: "Туман, размытые очертания, трудно представить", value: -2 },
                    { text: "Общие черты: работа, дом, но без деталей", value: 0 },
                    { text: "Довольно ясную картину с некоторыми целями", value: 1 },
                    { text: "Яркую, чёткую картину, я знаю, к чему иду", value: 2 },
                    { text: "Я вижу несколько вариантов и выбираю лучший", value: 2 },
                    { text: "Я живу в моменте, будущее — это сейчас, я его творю", value: 3 }
                ]
            },
            {
                text: "Есть ли у вас Большая Цель, которая ведёт вас по жизни?",
                options: [
                    { text: "Нет, я просто плыву по течению", value: -3 },
                    { text: "Скорее нет, чем да. Есть мелкие задачи", value: -2 },
                    { text: "Есть несколько целей, но они часто меняются", value: -1 },
                    { text: "Есть одна-две важные цели, но я не всегда о них помню", value: 1 },
                    { text: "Да, у меня есть чёткая цель, и я регулярно к ней иду", value: 2 },
                    { text: "Моя цель — это не точка, а направление, вектор развития", value: 3 },
                    { text: "Я и есть своя цель. Я живу осмысленно каждый день", value: 3 }
                ]
            },
            {
                text: "Просыпаясь утром, чувствуете ли вы, что ваш день имеет смысл и направление?",
                options: [
                    { text: "Нет, каждый день — это просто повторение, тоска", value: -3 },
                    { text: "Часто чувствую бессмысленность, «день сурка»", value: -2 },
                    { text: "Иногда есть смысл, иногда нет, как пойдёт", value: -1 },
                    { text: "Обычно я понимаю, зачем встаю, но без энтузиазма", value: 0 },
                    { text: "Да, у меня есть план на день и ощущение цели", value: 1 },
                    { text: "Я просыпаюсь с радостью и предвкушением", value: 2 },
                    { text: "Каждое утро — это подарок, и я знаю, как его использовать", value: 3 }
                ]
            },
            {
                text: "Когда вы сталкиваетесь с трудностями, как вы реагируете?",
                options: [
                    { text: "Опускаю руки, теряю направление, всё бессмысленно", value: -3 },
                    { text: "Сильно расстраиваюсь, цель кажется недостижимой", value: -2 },
                    { text: "Переживаю, но потом как-то выплываю", value: -1 },
                    { text: "Стараюсь искать обходные пути, адаптируюсь", value: 1 },
                    { text: "Трудности — это часть пути. Они меня закаляют", value: 2 },
                    { text: "Я благодарен трудностям — они показывают, куда расти", value: 3 },
                    { text: "Для меня нет «трудностей», есть только «задачи»", value: 3 }
                ]
            },
            {
                text: "Как часто вы задумываетесь о своём «предназначении» или «миссии»?",
                options: [
                    { text: "Никогда, это всё сказки", value: -3 },
                    { text: "Очень редко, когда совсем грустно", value: -2 },
                    { text: "Иногда, но не нахожу ответа", value: -1 },
                    { text: "Периодически возвращаюсь к этому вопросу", value: 0 },
                    { text: "Довольно часто, это помогает мне не сбиваться с пути", value: 1 },
                    { text: "Я знаю свою миссию и регулярно сверяюсь с ней", value: 2 },
                    { text: "Я не думаю о миссии — я ей являюсь", value: 3 }
                ]
            },
            {
                text: "Представьте, что вам осталось жить 1 год. Что вы будете делать?",
                options: [
                    { text: "Впаду в отчаяние, не знаю, зачем что-то делать", value: -3 },
                    { text: "Буду просто ждать конца, пытаться получить удовольствия", value: -2 },
                    { text: "Постараюсь успеть что-то важное, но не знаю что", value: -1 },
                    { text: "Составлю список желаний и начну их исполнять", value: 1 },
                    { text: "Буду жить так же, как сейчас — я уже на своём пути", value: 2 },
                    { text: "Сделаю всё, чтобы оставить после себя Свет", value: 3 },
                    { text: "Я и так живу каждый день как последний — осознанно и полно", value: 3 }
                ]
            },
            {
                text: "Что вы чувствуете, когда думаете о том, какой след вы оставите после себя?",
                options: [
                    { text: "Пустоту. Я никто, и от меня ничего не останется", value: -3 },
                    { text: "Грусть. Хотелось бы большего, но не получается", value: -2 },
                    { text: "Нейтрально. Я об этом не думаю", value: -1 },
                    { text: "Надежду. Я стараюсь, и может быть, что-то останется", value: 0 },
                    { text: "Уверенность. Я уже оставляю след в сердцах близких", value: 1 },
                    { text: "Вдохновение. Я знаю, что моё дело продолжат другие", value: 2 },
                    { text: "Свет. Я чувствую, что я — часть вечного потока Смысла", value: 3 }
                ]
            }
        ];
        
        const totalQuestions = questions.length;
        let currentIndex = 0;
        let answers = new Array(totalQuestions).fill(null);
        
        const questionContainer = document.getElementById('questionContainer');
        const prevBtn = document.getElementById('prevBtn');
        const nextBtn = document.getElementById('nextBtn');
        const exitBtn = document.getElementById('exitBtn');
        const progressFill = document.getElementById('progressFill');
        const progressText = document.getElementById('progressText');
        const testContainer = document.getElementById('testContainer');
        const mainBody = document.getElementById('mainBody');
        const testTitle = document.getElementById('testTitle');
        
        let isResultMode = false;
        
        function renderQuestion(index) {
            const q = questions[index];
            let html = `<div class="question-box"><div class="question-text">${index + 1}. ${q.text}</div><div class="options">`;
            q.options.forEach((opt) => {
                const isSelected = answers[index] === opt.value;
                html += `<div class="option ${isSelected ? 'selected' : ''}" data-value="${opt.value}"><div class="option-marker"></div><div class="option-text">${opt.text}</div></div>`;
            });
            html += `</div></div>`;
            questionContainer.innerHTML = html;
            
            document.querySelectorAll('.option').forEach(opt => {
                opt.addEventListener('click', () => {
                    const value = parseInt(opt.dataset.value);
                    answers[index] = value;
                    renderQuestion(index);
                });
            });
            
            const progress = ((index + 1) / totalQuestions) * 100;
            progressFill.style.width = progress + '%';
            progressText.textContent = `Вопрос ${index + 1} из ${totalQuestions}`;
            prevBtn.disabled = index === 0;
            nextBtn.textContent = index === totalQuestions - 1 ? '🎉 Завершить' : 'Далее →';
        }
        
        function calculateResult() {
            const sum = answers.reduce((acc, val) => acc + val, 0);
            const normalized = (sum + 21) / 42;
            return Math.round(normalized * 100) / 100;
        }
        
        function getResultColor(score) {
            if (score < 0.2) return '#78909c';
            if (score < 0.4) return '#90caf9';
            if (score < 0.6) return '#ffb74d';
            return '#ffd54f';
        }
        
        function getResultComment(score) {
            if (score < 0.2) return "🌑 Вы — ПОТЕРЯННЫЙ. Ваш вектор внимания θₜ направлен в прошлое или в пустоту. Вы не видите будущего и не чувствуете смысла. Это состояние семантической дезориентации. Вам нужна помощь — маяк, который укажет путь.";
            if (score < 0.4) return "🌫️ Вы — БЛУЖДАЮЩИЙ. Вы смутно чувствуете, что куда-то идёте, но не знаете куда. Ваш θₜ колеблется, цель размыта. Начните с малого: определите одну цель на месяц.";
            if (score < 0.6) return "🚶 Вы — ПУТНИК. У вас есть направление и цели, но вы не всегда им следуете. Ваш θₜ в целом направлен вперёд, но отвлекается на помехи. Укрепите свой вектор через планирование.";
            if (score < 0.8) return "🧭 Вы — ИДУЩИЙ. У вас есть чёткое видение будущего и вы регулярно движетесь к цели. Ваш θₜ стабилен. Вы на верном пути.";
            return "🌟 Вы — СВЕТОЧ. Ваш вектор внимания θₜ ясен и могуч. Вы не просто идёте к цели — вы освещаете путь другим. Ваша жизнь — это осмысленное творение будущего.";
        }
        
        function getResultAdvice(score) {
            if (score < 0.2) return "🆘 Совет: Найдите «маяк». Это может быть человек, книга, идея, которая вас зажжёт. Попробуйте технику «100 желаний» — выпишите всё, чего хотите, не фильтруя. Среди мусора найдётся золото.";
            if (score < 0.4) return "🌱 Совет: Поставьте одну маленькую цель на неделю и достигните её. Почувствуйте вкус направления. Ведите дневник «Мой путь» — записывайте, что приблизило вас к цели.";
            if (score < 0.6) return "🧭 Совет: Проведите ревизию целей. Сформулируйте 3 главные цели на год. Повесьте их на видное место. Используйте «семантический якорь» — предмет, который напоминает о цели.";
            if (score < 0.8) return "🚀 Совет: Углубляйте своё видение. Попробуйте визуализацию: представьте свой идеальный день через 5 лет в деталях. Запишите это как сценарий. Ваш θₜ станет ещё ярче.";
            return "💎 Совет: Вы — редкий дар. Помогайте другим найти свой путь. Делитесь своим Светом, но не забывайте «заземляться» и отдыхать. Ваш путь — это служение.";
        }
        
        function showResult() {
            isResultMode = true;
            const score = calculateResult();
            const color = getResultColor(score);
            const comment = getResultComment(score);
            const advice = getResultAdvice(score);
            
            mainBody.style.background = `linear-gradient(145deg, ${color}20 0%, #16213e 100%)`;
            testContainer.style.borderColor = color;
            
            let html = `<div class="result-container">`;
            html += `<h2 style="color: ${color};">Ваш результат</h2>`;
            html += `<div class="result-score" style="color: ${color};">${score.toFixed(2)}</div>`;
            html += `<div class="result-scale">по шкале θₜ (от 0 до 1)</div>`;
            html += `<div class="result-comment" style="color: #d0c8b8;">${comment}</div>`;
            html += `<div class="result-advice" style="color: #d0c8b8;">${advice}</div>`;
            html += `<p style="margin-top: 1.5rem; color: #a09080; font-style: italic;">Ваш путь — это не линия, а танец. И вы — хореограф.</p>`;
            html += `</div>`;
            
            questionContainer.innerHTML = html;
            prevBtn.classList.add('hidden');
            nextBtn.classList.add('hidden');
            exitBtn.textContent = '🔄 Пройти заново';
            exitBtn.classList.remove('btn-secondary');
            exitBtn.classList.add('btn');
            testTitle.textContent = `Результат: θₜ = ${score.toFixed(2)}`;
            progressText.textContent = `Тест завершён`;
            
            setTimeout(function() {
    const passportBtn = document.createElement('button');
    passportBtn.textContent = '💾 Сохранить результат в Семантический Паспорт';
    passportBtn.style.cssText = 'display: block; margin: 2rem auto; padding: 1rem 2rem; background: #fff176; color: #1a1a2e; border: none; border-radius: 40px; font-size: 1rem; cursor: pointer; font-weight: bold; transition: 0.3s;';
    passportBtn.onmouseover = () => passportBtn.style.background = '#ffeb3b';
    passportBtn.onmouseout = () => passportBtn.style.background = '#fff176';

    passportBtn.addEventListener('click', function() {
        const scoreElement = document.querySelector('.result-score');
        if (scoreElement) {
            const resultText = scoreElement.textContent.trim();
            const resultValue = parseFloat(resultText);
            if (!isNaN(resultValue)) {
                localStorage.setItem('ideatonika_test_path', resultValue);
            } else {
                localStorage.setItem('ideatonika_test_path', resultText);
            }
            passportBtn.textContent = '✅ Сохранено в Паспорт!';
            passportBtn.style.background = '#fbc02d';
            passportBtn.disabled = true;
        }
    });

    const container = document.querySelector('.result-container') || document.getElementById('questionContainer');
    if (container) {
        container.appendChild(passportBtn);
    }
}, 100);

// ========== КНОПКА "ПОДЕЛИТЬСЯ РЕЗУЛЬТАТОМ" ==========
setTimeout(function() {
    const shareContainer = document.createElement('div');
    shareContainer.style.cssText = 'text-align: center; margin-top: 1.5rem;';

    const shareBtn = document.createElement('button');
    shareBtn.textContent = '📤 Поделиться результатом';
    shareBtn.style.cssText = 'display: block; margin: 0 auto 0.8rem auto; padding: 0.8rem 2rem; background: transparent; color: #81c784; border: 1.5px solid #81c784; border-radius: 40px; font-size: 1rem; cursor: pointer; font-weight: bold; transition: 0.3s; font-family: Georgia, serif;';
    shareBtn.onmouseover = () => shareBtn.style.background = '#81c784';
    shareBtn.onmouseout = () => shareBtn.style.background = 'transparent';
    shareBtn.onmouseover = () => shareBtn.style.color = '#1a1a2e';
    shareBtn.onmouseout = () => shareBtn.style.color = '#81c784';

    shareBtn.addEventListener('click', function() {
        // Получаем название теста из заголовка страницы
        const testName = document.title.replace(' • Идеатоника', '').trim();
        
        // Получаем результат из элемента .result-score
        const scoreElement = document.querySelector('.result-score');
        let resultText = '';
        if (scoreElement) {
            resultText = scoreElement.textContent.trim();
        }
        
        // Получаем комментарий из элемента .result-comment или .result-interpretation
        const commentElement = document.querySelector('.result-comment') || document.querySelector('.result-interpretation');
        let commentText = '';
        if (commentElement) {
            commentText = commentElement.textContent.trim();
        }
        
        // Формируем текст для отправки
        const shareText = `🧪 Я прошёл тест «${testName}» на портале Идеатоника!\n\n` +
            `📊 Мой результат: ${resultText}\n` +
            `💬 ${commentText}\n\n` +
            `🎯 А какой результат у тебя?\n` +
            `👉 Пройти тест: ${window.location.href}\n\n` +
            `🌌 Идеатоника — физика смысла.`;
        
        // Пытаемся использовать Web Share API (мобильные устройства)
        if (navigator.share) {
            navigator.share({
                title: `Мой результат теста «${testName}»`,
                text: shareText,
                url: window.location.href
            }).catch(() => {
                // Если не получилось — копируем в буфер
                copyToClipboard(shareText);
            });
        } else {
            // Если Web Share API не поддерживается — копируем в буфер
            copyToClipboard(shareText);
        }
    });

    function copyToClipboard(text) {
        if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(text).then(() => {
                const originalText = shareBtn.textContent;
                shareBtn.textContent = '✅ Скопировано! Отправь другу';
                shareBtn.style.borderColor = '#ffd54f';
                shareBtn.style.color = '#ffd54f';
                setTimeout(() => {
                    shareBtn.textContent = originalText;
                    shareBtn.style.borderColor = '#81c784';
                    shareBtn.style.color = '#81c784';
                }, 2500);
            }).catch(() => {
                fallbackCopy(text);
            });
        } else {
            fallbackCopy(text);
        }
    }

    function fallbackCopy(text) {
        const textarea = document.createElement('textarea');
        textarea.value = text;
        textarea.style.position = 'fixed';
        textarea.style.left = '-9999px';
        document.body.appendChild(textarea);
        textarea.select();
        try {
            document.execCommand('copy');
            const originalText = shareBtn.textContent;
            shareBtn.textContent = '✅ Скопировано! Отправь другу';
            shareBtn.style.borderColor = '#ffd54f';
            shareBtn.style.color = '#ffd54f';
            setTimeout(() => {
                shareBtn.textContent = originalText;
                shareBtn.style.borderColor = '#81c784';
                shareBtn.style.color = '#81c784';
            }, 2500);
        } catch(e) {
            shareBtn.textContent = '❌ Не удалось скопировать';
            shareBtn.style.borderColor = '#ef5350';
            shareBtn.style.color = '#ef5350';
        }
        document.body.removeChild(textarea);
    }

    // Добавляем подсказку
    const hint = document.createElement('div');
    hint.style.cssText = 'color: #a09080; font-size: 0.8rem; font-style: italic;';
    hint.textContent = 'Нажмите, чтобы скопировать результат и отправить другу';
    shareContainer.appendChild(shareBtn);
    shareContainer.appendChild(hint);

    // Ищем контейнер с результатом
    const container = document.querySelector('.result-container') || document.getElementById('questionContainer');
    if (container) {
        container.appendChild(shareContainer);
    }
}, 100);

        }
        
        function resetTest() {
            isResultMode = false;
            currentIndex = 0;
            answers = new Array(totalQuestions).fill(null);
            mainBody.style.background = '';
            testContainer.style.borderColor = '';
            testTitle.textContent = 'Ваш путь';
            prevBtn.classList.remove('hidden');
            nextBtn.classList.remove('hidden');
            exitBtn.textContent = '🚪 Выйти';
            exitBtn.classList.add('btn-secondary');
            renderQuestion(0);
        }
        
        prevBtn.addEventListener('click', () => { if (currentIndex > 0) { currentIndex--; renderQuestion(currentIndex); } });
        nextBtn.addEventListener('click', () => {
            if (answers[currentIndex] === null) { alert('Пожалуйста, выберите вариант ответа.'); return; }
            if (currentIndex < totalQuestions - 1) { currentIndex++; renderQuestion(currentIndex); }
            else { if (!answers.includes(null)) showResult(); else alert('Пожалуйста, ответьте на все вопросы.'); }
        });
        exitBtn.addEventListener('click', () => {
            if (isResultMode) resetTest();
            else if (confirm('Вы уверены, что хотите выйти? Прогресс будет потерян.')) window.location.href = 'diagnostics-hub.html';
        });
        
        renderQuestion(0);
    })();
</script>
</body>
</html>
