<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вред фастфуда • Идеатоника</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: linear-gradient(145deg, #1a1a2e 0%, #16213e 100%); min-height: 100vh; font-family: 'Georgia', serif; padding: 2rem; display: flex; flex-direction: column; align-items: center; }
        .cosmic-bg { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 0; }
        .main-container { max-width: 850px; width: 100%; position: relative; z-index: 1; background: rgba(30,40,60,0.85); backdrop-filter: blur(12px); border: 1px solid rgba(227,184,124,0.4); border-radius: 32px; padding: 2.5rem; box-shadow: 0 20px 40px rgba(0,0,0,0.5); }
        h1 { font-size: 2.5rem; color: #f3e7c0; text-align: center; margin-bottom: 0.5rem; font-weight: 400; }
        .subtitle { text-align: center; color: #c0b090; font-style: italic; margin-bottom: 2rem; border-bottom: 1px solid #5d4a3a; padding-bottom: 1rem; }
        .calc-section { background: rgba(0,0,0,0.2); border-radius: 20px; padding: 2rem; margin-bottom: 2rem; border: 1px solid #5d4a3a; }
        .section-title { font-size: 1.4rem; color: #ffd54f; margin-bottom: 1.5rem; }
        .input-group { margin-bottom: 1.5rem; }
        .input-group label { display: flex; justify-content: space-between; align-items: center; color: #d0c8b8; font-size: 1rem; margin-bottom: 0.5rem; flex-wrap: wrap; }
        .input-group label span { color: #ffd54f; font-weight: bold; font-size: 1.2rem; }
        .input-group select { width: 100%; padding: 0.8rem 1rem; background: rgba(0,0,0,0.3); border: 1px solid #5d4a3a; border-radius: 10px; color: #f3e7c0; font-family: 'Georgia', serif; font-size: 1rem; }
        .input-group select option { background: #1a1a2e; color: #f3e7c0; }
        .checkbox-row { display: flex; align-items: center; gap: 12px; margin-bottom: 0.8rem; color: #d0c8b8; cursor: pointer; padding: 0.5rem 0; }
        .checkbox-row input[type="checkbox"] { width: 20px; height: 20px; accent-color: #ffd54f; cursor: pointer; flex-shrink: 0; }
        .checkbox-row .item-name { flex: 1; }
        .checkbox-row .item-rank { color: #ff9800; font-weight: bold; font-size: 0.9rem; flex-shrink: 0; }
        .result-box { background: rgba(255,215,80,0.1); border: 2px solid #ffd54f; border-radius: 20px; padding: 2rem; text-align: center; margin-top: 2rem; }
        .result-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 1rem; margin: 1.5rem 0; }
        .result-item { background: rgba(0,0,0,0.2); border-radius: 12px; padding: 1rem; text-align: center; border: 1px solid #5d4a3a; }
        .result-item .before { color: #81c784; font-size: 1.5rem; font-weight: bold; }
        .result-item .after { color: #ef5350; font-size: 1.5rem; font-weight: bold; }
        .result-item .label { color: #a09080; font-size: 0.8rem; margin-top: 0.3rem; }
        .result-number { font-size: 3rem; font-weight: bold; color: #ffd54f; line-height: 1; }
        .result-label { color: #c0b090; font-size: 1.2rem; margin-top: 0.5rem; }
        .result-extra { color: #d0c8b8; font-size: 1rem; margin-top: 1rem; font-style: italic; }
        .result-formula { color: #a09080; font-style: italic; font-size: 0.9rem; margin-top: 1rem; font-family: 'Courier New', monospace; }
        .back-link { display: inline-block; margin-top: 1.5rem; color: #ffd54f; text-decoration: none; border: 1px solid #ffd54f; padding: 0.6rem 1.5rem; border-radius: 30px; transition: 0.2s; }
        .back-link:hover { background: #ffd54f; color: #1a1a2e; }
    </style>
</head>
<body>
<div class="cosmic-bg"></div>
<div class="main-container">

    <h1>🍔 Вред фастфуда</h1>
    <div class="subtitle">Семантическая цена одного обеда в фастфуд-ресторане</div>

    <div class="calc-section">
        <div class="section-title">🛒 Что вы съели? (выберите блюда)</div>
        <div id="foodList"></div>
    </div>

    <div class="calc-section">
        <div class="section-title">📐 Ваше состояние до еды</div>

        <div class="input-group">
            <label>☀️ Qₛ до еды: <span id="qsValue">5</span></label>
            <select id="qsSelect">
                <option value="8">+8 (прекрасное, светлое)</option>
                <option value="5" selected>+5 (хорошее, нормальное)</option>
                <option value="3">+3 (нейтральное)</option>
                <option value="1">+1 (уставшее)</option>
                <option value="-2">-2 (плохое, тяжёлое)</option>
            </select>
        </div>

        <div class="input-group">
            <label>🎯 Cₛ до еды: <span id="csValue">0.6</span></label>
            <select id="csSelect">
                <option value="0.8">0.8 (ясный, сфокусированный)</option>
                <option value="0.6" selected>0.6 (обычное)</option>
                <option value="0.4">0.4 (рассеянный)</option>
                <option value="0.2">0.2 (туман, усталость)</option>
            </select>
        </div>

        <div class="input-group">
            <label>💧 Что будете пить после? (для восстановления)</label>
            <select id="recoverySelect">
                <option value="none">Ничего, просто ждать</option>
                <option value="water">Чистая вода (+1 за 2 часа)</option>
                <option value="tea" selected>Травяной чай (+2 за 2 часа)</option>
                <option value="green">Зелёный смузи (+3 за 2 часа)</option>
                <option value="honey">Вода с мёдом и лимоном (+4 за 2 часа)</option>
            </select>
        </div>
    </div>

    <!-- Результат -->
    <div class="result-box" id="resultBox">
        <div class="result-label">Ваши параметры после еды:</div>
        <div class="result-grid" id="resultGrid"></div>
        <div class="result-number" id="resultNumber"></div>
        <div class="result-label" id="resultLabel"></div>
        <div class="result-extra" id="resultExtra"></div>
        <div class="result-formula" id="resultFormula"></div>
    </div>

    <div style="text-align: center;">
        <a href="semantic-calculators.html" class="back-link">← К списку калькуляторов</a>
    </div>

</div>

<script>
    // База фастфуд-блюд
    const fastFoodDB = [
        { id: 'burger', name: '🍔 Гамбургер / Чизбургер', rankDrop: -3, cDrop: -0.15, tRise: 2.5 },
        { id: 'fries', name: '🍟 Картофель фри', rankDrop: -3, cDrop: -0.10, tRise: 1.5 },
        { id: 'nuggets', name: '🍗 Наггетсы куриные', rankDrop: -3, cDrop: -0.10, tRise: 1.5 },
        { id: 'pizza', name: '🍕 Пицца (фастфуд)', rankDrop: -3, cDrop: -0.10, tRise: 1.0 },
        { id: 'hotdog', name: '🌭 Хот-дог', rankDrop: -3, cDrop: -0.10, tRise: 1.0 },
        { id: 'soda', name: '🥤 Сладкая газировка (Кола)', rankDrop: -3, cDrop: -0.15, tRise: 2.0 },
        { id: 'energy', name: '⚡ Энергетический напиток', rankDrop: -4, cDrop: -0.20, tRise: 3.0 },
        { id: 'milkshake', name: '🥛 Молочный коктейль', rankDrop: -3, cDrop: -0.05, tRise: 1.0 },
        { id: 'chips', name: '🥔 Чипсы', rankDrop: -3, cDrop: -0.05, tRise: 0.5 },
        { id: 'donut', name: '🍩 Пончик / Сладкая выпечка', rankDrop: -3, cDrop: -0.10, tRise: 1.0 },
        { id: 'noodles', name: '🍜 Лапша быстрого приготовления', rankDrop: -3, cDrop: -0.10, tRise: 1.5 },
        { id: 'shaurma', name: '🥙 Шаурма (сомнительная)', rankDrop: -3, cDrop: -0.10, tRise: 1.0 }
    ];

    // Строим список чекбоксов
    const foodList = document.getElementById('foodList');
    fastFoodDB.forEach(item => {
        const row = document.createElement('div');
        row.className = 'checkbox-row';
        row.innerHTML = `
            <input type="checkbox" id="cb_${item.id}" value="${item.id}">
            <span class="item-name">${item.name}</span>
            <span class="item-rank">${item.rankDrop} Qₛ</span>
        `;
        row.addEventListener('click', function(e) {
            if (e.target.tagName !== 'INPUT') {
                const cb = this.querySelector('input');
                cb.checked = !cb.checked;
            }
            updateResult();
        });
        foodList.appendChild(row);
    });

    // Слушатели изменений
    document.querySelectorAll('input[type="checkbox"]').forEach(cb => cb.addEventListener('change', updateResult));
    document.getElementById('qsSelect').addEventListener('change', function() {
        document.getElementById('qsValue').textContent = this.value;
        updateResult();
    });
    document.getElementById('csSelect').addEventListener('change', function() {
        document.getElementById('csValue').textContent = this.value;
        updateResult();
    });
    document.getElementById('recoverySelect').addEventListener('change', updateResult);

    function updateResult() {
        const Qbefore = parseInt(document.getElementById('qsSelect').value);
        const Cbefore = parseFloat(document.getElementById('csSelect').value);
        const recoveryType = document.getElementById('recoverySelect').value;

        // Суммируем эффекты выбранных блюд
        let totalQdrop = 0;
        let totalCdrop = 0;
        let totalTrise = 0;
        let selectedNames = [];

        fastFoodDB.forEach(item => {
            const cb = document.getElementById('cb_' + item.id);
            if (cb && cb.checked) {
                totalQdrop += item.rankDrop;
                totalCdrop += item.cDrop;
                totalTrise = Math.max(totalTrise, item.tRise);
                selectedNames.push(item.name);
            }
        });

        // Ограничения
        totalQdrop = Math.max(-15, totalQdrop);
        totalCdrop = Math.min(0, Math.max(-0.5, totalCdrop));

        // После еды
        let Qafter = Qbefore + totalQdrop;
        let Cafter = Cbefore + totalCdrop;
        let Tafter = 5.0 + totalTrise;

        // Ограничения
        Qafter = Math.max(-5, Math.min(10, Qafter));
        Cafter = Math.max(0.05, Math.min(1.0, Cafter));
        Tafter = Math.max(0, Math.min(10, Tafter));

        // Восстановление
        const recoveryMap = { none: 0, water: 1, tea: 2, green: 3, honey: 4 };
        const recoveryBoost = recoveryMap[recoveryType] || 0;
        const recoveryHours = recoveryBoost > 0 ? Math.ceil((Qbefore - Qafter) / recoveryBoost) * 2 : (Qbefore - Qafter) * 3;

        // Отображение
        document.getElementById('resultGrid').innerHTML = `
            <div class="result-item">
                <div class="before">${Qbefore >= 0 ? '+' : ''}${Qbefore}</div>
                <div class="after">${Qafter >= 0 ? '+' : ''}${Qafter}</div>
                <div class="label">Qₛ (заряд)</div>
            </div>
            <div class="result-item">
                <div class="before">${Cbefore.toFixed(2)}</div>
                <div class="after">${Cafter.toFixed(2)}</div>
                <div class="label">Cₛ (когерентность)</div>
            </div>
            <div class="result-item">
                <div class="before">5.0</div>
                <div class="after">${Tafter.toFixed(1)}</div>
                <div class="label">Tₛ (температура)</div>
            </div>
        `;

        if (selectedNames.length === 0) {
            document.getElementById('resultNumber').textContent = '—';
            document.getElementById('resultLabel').textContent = 'Вы ничего не выбрали';
            document.getElementById('resultExtra').textContent = 'Отметьте блюда, чтобы увидеть эффект.';
            document.getElementById('resultFormula').textContent = '';
            return;
        }

        const totalDrop = Qbefore - Qafter;

        document.getElementById('resultNumber').textContent = (totalDrop > 0 ? '–' : '+') + Math.abs(totalDrop).toFixed(0);
        document.getElementById('resultLabel').textContent = 'Пунктов Qₛ потеряно';

        let extra = `Вы съели: ${selectedNames.join(', ')}. `;
        if (Tafter >= 7) extra += '🌡️ Tₛ резко повышена — вы «перегрелись», возможна тревога, суета. ';
        if (Cafter < 0.4) extra += '🌫️ Cₛ сильно упала — будет трудно сосредоточиться, мысли как в тумане. ';
        if (Qafter <= 0) extra += '💀 Qₛ ушёл в минус — вы истощены семантически. ';

        document.getElementById('resultExtra').textContent = extra;

        const recoveryName = document.getElementById('recoverySelect').options[document.getElementById('recoverySelect').selectedIndex].text;
        document.getElementById('resultFormula').textContent = `Восстановление: ${recoveryName}. Ожидаемое время возврата Qₛ к уровню до еды: ~${recoveryHours} часов.`;
    }

    updateResult();
</script>

</body>
</html>
