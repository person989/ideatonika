<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Калькулятор Первого Контакта • Идеатоника</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: linear-gradient(145deg, #1a1a2e 0%, #16213e 100%); min-height: 100vh; font-family: 'Georgia', serif; padding: 2rem; display: flex; flex-direction: column; align-items: center; }
        .cosmic-bg { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 0; }
        .main-container { max-width: 800px; width: 100%; position: relative; z-index: 1; background: rgba(30,40,60,0.85); backdrop-filter: blur(12px); border: 1px solid rgba(227,184,124,0.4); border-radius: 32px; padding: 2.5rem; box-shadow: 0 20px 40px rgba(0,0,0,0.5); }
        h1 { font-size: 2.5rem; color: #f3e7c0; text-align: center; margin-bottom: 0.5rem; font-weight: 400; }
        .subtitle { text-align: center; color: #c0b090; font-style: italic; margin-bottom: 2rem; border-bottom: 1px solid #5d4a3a; padding-bottom: 1rem; }
        .calc-section { background: rgba(0,0,0,0.2); border-radius: 20px; padding: 2rem; margin-bottom: 2rem; border: 1px solid #5d4a3a; }
        .section-title { font-size: 1.4rem; color: #ffd54f; margin-bottom: 1.5rem; }
        .input-group { margin-bottom: 1.5rem; }
        .input-group label { display: flex; justify-content: space-between; align-items: center; color: #d0c8b8; font-size: 1rem; margin-bottom: 0.5rem; }
        .input-group label span { color: #ffd54f; font-weight: bold; font-size: 1.2rem; }
        .input-group input[type="range"] { width: 100%; -webkit-appearance: none; height: 8px; background: #5d4a3a; border-radius: 4px; outline: none; cursor: pointer; }
        .input-group input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; width: 22px; height: 22px; background: #ffd54f; border-radius: 50%; cursor: pointer; }
        .input-group .range-labels { display: flex; justify-content: space-between; color: #706858; font-size: 0.8rem; margin-top: 0.3rem; }
        .input-group select { width: 100%; padding: 0.8rem 1rem; background: rgba(0,0,0,0.3); border: 1px solid #5d4a3a; border-radius: 10px; color: #f3e7c0; font-family: 'Georgia', serif; font-size: 1rem; }
        .input-group select option { background: #1a1a2e; color: #f3e7c0; }
        .result-box { background: rgba(255,215,80,0.1); border: 2px solid #ffd54f; border-radius: 20px; padding: 2rem; text-align: center; margin-top: 2rem; }
        .result-number { font-size: 3.5rem; font-weight: bold; color: #ffd54f; line-height: 1.1; }
        .result-label { color: #c0b090; font-size: 1.2rem; margin-top: 0.5rem; }
        .result-extra { color: #d0c8b8; font-size: 1rem; margin-top: 1rem; font-style: italic; }
        .result-formula { color: #a09080; font-style: italic; font-size: 0.9rem; margin-top: 1rem; font-family: 'Courier New', monospace; }
        .back-link { display: inline-block; margin-top: 1.5rem; color: #ffd54f; text-decoration: none; border: 1px solid #ffd54f; padding: 0.6rem 1.5rem; border-radius: 30px; transition: 0.2s; }
        .back-link:hover { background: #ffd54f; color: #1a1a2e; }
    </style>
</head>
<body>
<div class="cosmic-bg"></div>
<div class="main-container">

    <h1>🚀 Дата Первого Контакта</h1>
    <div class="subtitle">Когда о вашей идее узнает миллиард человек?</div>

    <div class="calc-section">
        <div class="section-title">📐 Параметры распространения</div>

        <!-- Текущая аудитория -->
        <div class="input-group">
            <label>👥 Сколько людей уже знают об идее? <span id="currentValue">10</span></label>
            <input type="range" id="currentSlider" min="1" max="100000" value="10" step="1">
            <div class="range-labels"><span>1 (только вы)</span><span>1000</span><span>100 000</span></div>
        </div>

        <!-- Скорость роста -->
        <div class="input-group">
            <label>📈 Годовой прирост аудитории: <span id="growthValue">50</span>%</label>
            <input type="range" id="growthSlider" min="1" max="300" value="50" step="1">
            <div class="range-labels"><span>1% (почти не растёт)</span><span>50%</span><span>300% (вирусный взрыв)</span></div>
        </div>

        <!-- Качество контакта -->
        <div class="input-group">
            <label>🗣️ Качество «сарафанного радио»:</label>
            <select id="qualitySelect">
                <option value="1.5">Идеальное — каждый рассказывает десяткам (×1.5)</option>
                <option value="1.0" selected>Хорошее — каждый приводит 1-2 друзей (×1.0)</option>
                <option value="0.5">Среднее — многие слушают, но не передают (×0.5)</option>
                <option value="0.1">Слабое — идею игнорируют, распространяется медленно (×0.1)</option>
            </select>
        </div>

        <!-- Целевая аудитория -->
        <div class="input-group">
            <label>🎯 Целевая аудитория (сколько людей должны узнать): <span id="targetValue">1</span> млрд</label>
            <input type="range" id="targetSlider" min="1" max="8" value="1" step="0.1">
            <div class="range-labels"><span>1 млн</span><span>1 млрд</span><span>8 млрд (всё человечество)</span></div>
        </div>
    </div>

    <!-- Результат -->
    <div class="result-box" id="resultBox">
        <div class="result-number" id="resultNumber">—</div>
        <div class="result-label" id="resultLabel">Прогнозируемая дата</div>
        <div class="result-extra" id="resultExtra"></div>
        <div class="result-formula" id="resultFormula"></div>
    </div>

    <div style="text-align: center;">
        <a href="semantic-calculators.html" class="back-link">← К списку калькуляторов</a>
    </div>

</div>

<script>
    const currentSlider = document.getElementById('currentSlider');
    const growthSlider = document.getElementById('growthSlider');
    const qualitySelect = document.getElementById('qualitySelect');
    const targetSlider = document.getElementById('targetSlider');
    const currentValue = document.getElementById('currentValue');
    const growthValue = document.getElementById('growthValue');
    const targetValue = document.getElementById('targetValue');
    const resultNumber = document.getElementById('resultNumber');
    const resultLabel = document.getElementById('resultLabel');
    const resultExtra = document.getElementById('resultExtra');
    const resultFormula = document.getElementById('resultFormula');

    function formatNumber(n) {
        if (n >= 1e9) return (n / 1e9).toFixed(1) + ' млрд';
        if (n >= 1e6) return (n / 1e6).toFixed(1) + ' млн';
        if (n >= 1e3) return (n / 1e3).toFixed(1) + ' тыс.';
        return Math.round(n).toString();
    }

    currentSlider.addEventListener('input', () => { currentValue.textContent = formatNumber(parseInt(currentSlider.value)); calculate(); });
    growthSlider.addEventListener('input', () => { growthValue.textContent = parseInt(growthSlider.value); calculate(); });
    qualitySelect.addEventListener('change', calculate);
    targetSlider.addEventListener('input', () => {
        const val = parseFloat(targetSlider.value);
        if (val >= 7.5) targetValue.textContent = '8 млрд (человечество)';
        else if (val >= 1) targetValue.textContent = val.toFixed(1) + ' млрд';
        else targetValue.textContent = (val * 1000).toFixed(0) + ' млн';
        calculate();
    });

    function calculate() {
        const N0 = parseInt(currentSlider.value);
        const growthPercent = parseInt(growthSlider.value);
        const quality = parseFloat(qualitySelect.value);
        const targetSliderVal = parseFloat(targetSlider.value);

        // Целевая аудитория в абсолютных числах
        const Ntarget = targetSliderVal * 1e9;

        if (N0 >= Ntarget) {
            resultNumber.textContent = 'Уже достигнуто!';
            resultLabel.textContent = 'Текущая аудитория превышает цель';
            resultExtra.textContent = 'Поздравляем! Ваша идея уже покорила мир.';
            resultFormula.textContent = '';
            return;
        }

        // Годовой прирост в долях: 50% → 0.5
        const r = (growthPercent / 100) * quality;

        // Экспоненциальный рост: N(t) = N0 * (1 + r)^t
        // Найти t: t = log(Ntarget / N0) / log(1 + r)
        const years = Math.log(Ntarget / N0) / Math.log(1 + r);
        const currentYear = 2026;
        const targetYear = Math.round(currentYear + years);

        resultNumber.textContent = targetYear + ' год';
        resultLabel.textContent = 'Прогнозируемая дата';

        let interpretation = '';
        if (years < 1) interpretation = '⚡ Молниеносно! Идея захватит мир меньше чем за год.';
        else if (years < 10) interpretation = '🚀 Очень быстро! Вы застанете это при жизни.';
        else if (years < 50) interpretation = '🌱 В течение вашей жизни. Набирайте терпение и продолжайте.';
        else if (years < 200) interpretation = '📜 Эстафета поколений. Увидят ваши внуки или правнуки.';
        else if (years < 500) interpretation = '🏛️ Долгий путь. Ваше имя будут помнить как основателя.';
        else interpretation = '🌌 Эпохальный путь. Ваша идея — семя, которое прорастёт через века.';
        resultExtra.textContent = interpretation + ' (' + Math.round(years) + ' лет)';

        const qualityName = qualitySelect.options[qualitySelect.selectedIndex].text.split(' (')[0];
        resultFormula.textContent = `N(t) = ${formatNumber(N0)} · (1 + ${(r*100).toFixed(1)}%)ᵗ | t = ln(${formatNumber(Ntarget)} / ${formatNumber(N0)}) / ln(1 + ${(r*100).toFixed(1)}%) = ${years.toFixed(1)} лет`;
    }

    calculate();
</script>

</body>
</html>
