<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Калькулятор Дозы Соцсетей • Идеатоника</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: linear-gradient(145deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            font-family: 'Georgia', 'Times New Roman', serif;
            padding: 2rem;
            display: flex; flex-direction: column; align-items: center;
        }
        .cosmic-bg { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 0; }
        .main-container {
            max-width: 800px; width: 100%; position: relative; z-index: 1;
            background: rgba(30, 40, 60, 0.85); backdrop-filter: blur(12px);
            border: 1px solid rgba(227, 184, 124, 0.4); border-radius: 32px;
            padding: 2.5rem; box-shadow: 0 20px 40px rgba(0,0,0,0.5);
        }
        h1 { font-size: 2.5rem; color: #f3e7c0; text-align: center; margin-bottom: 0.5rem; font-weight: 400; }
        .subtitle { text-align: center; color: #c0b090; font-style: italic; margin-bottom: 2rem; border-bottom: 1px solid #5d4a3a; padding-bottom: 1rem; }
        .calc-section { background: rgba(0,0,0,0.2); border-radius: 20px; padding: 2rem; margin-bottom: 2rem; border: 1px solid #5d4a3a; }
        .section-title { font-size: 1.4rem; color: #ffd54f; margin-bottom: 1.5rem; }
        .input-group { margin-bottom: 1.5rem; }
        .input-group label { display: flex; justify-content: space-between; align-items: center; color: #d0c8b8; font-size: 1rem; margin-bottom: 0.5rem; }
        .input-group label span { color: #ffd54f; font-weight: bold; font-size: 1.2rem; }
        .input-group input[type="range"] { width: 100%; -webkit-appearance: none; height: 8px; background: #5d4a3a; border-radius: 4px; outline: none; cursor: pointer; }
        .input-group input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; width: 22px; height: 22px; background: #ffd54f; border-radius: 50%; cursor: pointer; box-shadow: 0 0 10px rgba(255,215,80,0.5); }
        .input-group .range-labels { display: flex; justify-content: space-between; color: #706858; font-size: 0.8rem; margin-top: 0.3rem; }
        .input-group select { width: 100%; padding: 0.8rem 1rem; background: rgba(0,0,0,0.3); border: 1px solid #5d4a3a; border-radius: 10px; color: #f3e7c0; font-family: 'Georgia', serif; font-size: 1rem; }
        .input-group select option { background: #1a1a2e; color: #f3e7c0; }
        .result-box { background: rgba(255,215,80,0.1); border: 2px solid #ffd54f; border-radius: 20px; padding: 2rem; text-align: center; margin-top: 2rem; }
        .result-number { font-size: 4rem; font-weight: bold; color: #ffd54f; line-height: 1; }
        .result-label { color: #c0b090; font-size: 1.2rem; margin-top: 0.5rem; }
        .result-extra { color: #d0c8b8; font-size: 1rem; margin-top: 1rem; font-style: italic; }
        .result-meter { display: flex; align-items: center; gap: 1rem; margin: 1.5rem 0; }
        .meter-bar { flex: 1; height: 24px; background: #5d4a3a; border-radius: 12px; overflow: hidden; }
        .meter-fill { height: 100%; border-radius: 12px; transition: width 0.5s, background 0.5s; }
        .meter-label { color: #d0c8b8; font-size: 0.85rem; min-width: 80px; text-align: right; }
        .result-formula { color: #a09080; font-style: italic; font-size: 0.9rem; margin-top: 1rem; font-family: 'Courier New', monospace; }
        .back-link { display: inline-block; margin-top: 1.5rem; color: #ffd54f; text-decoration: none; border: 1px solid #ffd54f; padding: 0.6rem 1.5rem; border-radius: 30px; transition: 0.2s; }
        .back-link:hover { background: #ffd54f; color: #1a1a2e; }
    </style>
</head>
<body>
<div class="cosmic-bg"></div>
<div class="main-container">

    <h1>📱 Доза соцсетей</h1>
    <div class="subtitle">Калькулятор безопасного времени в соцсетях (§44, §46, §108)</div>

    <div class="calc-section">
        <div class="section-title">📐 Ваши параметры</div>

        <div class="input-group">
            <label>🎯 Утренний Cₛ (до соцсетей): <span id="csValue">0.6</span></label>
            <input type="range" id="csSlider" min="0.1" max="1" value="0.6" step="0.01">
            <div class="range-labels"><span>0.1 (хаос)</span><span>1.0 (лазер)</span></div>
        </div>

        <div class="input-group">
            <label>📊 Тип потребляемого контента:</label>
            <select id="contentSelect">
                <option value="toxic">Токсичный (новости, политика, скандалы)</option>
                <option value="mixed" selected>Смешанный (лента друзей, мемы, блоги)</option>
                <option value="educational">Образовательный (наука, лекции, курсы)</option>
                <option value="inspirational">Вдохновляющий (искусство, природа, цитаты)</option>
            </select>
        </div>

        <div class="input-group">
            <label>🛡️ Уровень семантической защиты (щит):</label>
            <select id="shieldSelect">
                <option value="1.0">Нет щита (×1.0)</option>
                <option value="1.3" selected>Лёгкий щит — визуализация кокона (×1.3)</option>
                <option value="1.7">Средний щит — нательный крест, шунгит (×1.7)</option>
                <option value="2.5">Сильный щит — серебро + молитва (×2.5)</option>
            </select>
        </div>
    </div>

    <!-- Результат -->
    <div class="result-box" id="resultBox">
        <div class="result-number" id="resultNumber">—</div>
        <div class="result-label" id="resultLabel">Безопасный лимит</div>
        
        <div class="result-meter">
            <span class="meter-label" style="color:#81c784;">🟢 Зелёная зона</span>
            <div class="meter-bar"><div class="meter-fill" id="greenBar" style="width:0%; background:#81c784;"></div></div>
        </div>
        <div class="result-meter">
            <span class="meter-label" style="color:#ffb74d;">🟡 Жёлтая зона</span>
            <div class="meter-bar"><div class="meter-fill" id="yellowBar" style="width:0%; background:#ffb74d;"></div></div>
        </div>
        <div class="result-meter">
            <span class="meter-label" style="color:#ef5350;">🔴 Красная зона</span>
            <div class="meter-bar"><div class="meter-fill" id="redBar" style="width:0%; background:#ef5350;"></div></div>
        </div>
        
        <div class="result-extra" id="resultExtra"></div>
        <div class="result-formula" id="resultFormula"></div>
    </div>

    <div style="text-align: center;">
        <a href="semantic-calculators.html" class="back-link">← К списку калькуляторов</a>
    </div>

</div>

<script>
    const csSlider = document.getElementById('csSlider');
    const contentSelect = document.getElementById('contentSelect');
    const shieldSelect = document.getElementById('shieldSelect');
    const csValue = document.getElementById('csValue');
    const resultNumber = document.getElementById('resultNumber');
    const resultLabel = document.getElementById('resultLabel');
    const resultExtra = document.getElementById('resultExtra');
    const resultFormula = document.getElementById('resultFormula');
    const greenBar = document.getElementById('greenBar');
    const yellowBar = document.getElementById('yellowBar');
    const redBar = document.getElementById('redBar');

    csSlider.addEventListener('input', () => { csValue.textContent = parseFloat(csSlider.value).toFixed(2); calculate(); });
    contentSelect.addEventListener('change', calculate);
    shieldSelect.addEventListener('change', calculate);

    function calculate() {
        const C = parseFloat(csSlider.value);
        const content = contentSelect.value;
        const shield = parseFloat(shieldSelect.value);

        // Коэффициент «загрязнения» контента (единиц S_noise в минуту)
        const pollutionRate = content === 'toxic' ? 3.0 :
                            content === 'mixed' ? 1.5 :
                            content === 'educational' ? 0.5 : 0.3;

        // Критический порог S_noise, после которого Cₛ падает ниже 0.3
        const maxSnoise = 10;
        // Текущий запас прочности (чем выше Cₛ, тем больше запас)
        const currentReserve = C * maxSnoise;

        // Безопасное время (в минутах) = запас прочности / (скорость загрязнения / щит)
        const safeTime = Math.round((currentReserve / (pollutionRate / shield)) * 10) / 10;

        // Зоны
        const greenLimit = Math.round(safeTime);
        const yellowLimit = Math.round(safeTime * 1.5);
        const redLimit = Math.round(safeTime * 3);

        resultNumber.textContent = greenLimit + ' мин';
        resultLabel.textContent = 'Безопасный лимит (зелёная зона)';

        // Обновляем полоски
        const maxWidth = redLimit > 0 ? redLimit : 120;
        greenBar.style.width = (greenLimit / maxWidth * 100) + '%';
        yellowBar.style.width = ((yellowLimit - greenLimit) / maxWidth * 100) + '%';
        redBar.style.width = ((redLimit - yellowLimit) / maxWidth * 100) + '%';

        let extra = '';
        if (greenLimit <= 0) {
            extra = '⚠️ Ваш Cₛ уже слишком низок. Соцсети сегодня противопоказаны. Сначала медитация!';
        } else if (greenLimit < 15) {
            extra = '📱 Очень мало. Проверьте только самое важное — и выключайте.';
        } else if (greenLimit < 45) {
            extra = '👍 Норма. Можно полистать ленту, но с таймером.';
        } else {
            extra = '🎉 У вас отличный запас прочности! Можно позволить себе больше, но не увлекайтесь.';
        }

        const contentNames = { toxic: 'токсичный', mixed: 'смешанный', educational: 'образовательный', inspirational: 'вдохновляющий' };
        resultExtra.textContent = extra + ' | Контент: ' + contentNames[content] + ' | Щит: ×' + shield.toFixed(1);

        resultFormula.textContent = 'Лимит = (Cₛ · 10) / (' + pollutionRate.toFixed(1) + ' / ' + shield.toFixed(1) + ') = ' + greenLimit + ' мин | Зелёная: до ' + greenLimit + ' | Жёлтая: ' + (greenLimit + 1) + '–' + yellowLimit + ' | Красная: > ' + yellowLimit;
    }

    calculate();
</script>

</body>
</html>
