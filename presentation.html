<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Презентация • Идеатоника</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #111; font-family: 'Georgia', 'Times New Roman', serif;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            min-height: 100vh; padding: 1rem;
        }
        .slide-container {
            max-width: 900px; width: 100%; background: linear-gradient(145deg, #1a1a2e, #16213e);
            border: 2px solid #ffd54f; border-radius: 24px; padding: 3rem 2.5rem;
            box-shadow: 0 20px 40px rgba(0,0,0,0.5); min-height: 500px;
            display: flex; flex-direction: column; justify-content: center;
            transition: opacity 0.3s;
        }
        .slide-title {
            font-size: 2.5rem; color: #ffd54f; margin-bottom: 1.5rem;
            border-bottom: 2px solid #5d4a3a; padding-bottom: 0.8rem;
        }
        .slide-content { color: #d0c8b8; font-size: 1.2rem; line-height: 1.8; }
        .slide-content ul { padding-left: 2rem; }
        .slide-content li { margin-bottom: 0.8rem; }
        .slide-content strong { color: #ffd54f; }
        .slide-content em { color: #ce93d8; font-style: italic; }
        .slide-number { text-align: right; color: #706858; font-size: 0.9rem; margin-top: 2rem; }

        .nav { display: flex; gap: 1rem; margin-top: 1.5rem; align-items: center; }
        .nav-btn {
            background: transparent; border: 1.5px solid #ffd54f; color: #ffd54f;
            padding: 0.8rem 2rem; font-size: 1.1rem; font-weight: bold;
            border-radius: 40px; cursor: pointer; transition: 0.2s; font-family: inherit;
        }
        .nav-btn:hover { background: #ffd54f; color: #1a1a2e; }
        .nav-btn:disabled { opacity: 0.3; cursor: not-allowed; }
        .page-indicator { color: #a09080; font-size: 1rem; min-width: 100px; text-align: center; }

        .download-btn {
            display: inline-block; background: #ffd54f; color: #1a1a2e;
            padding: 1rem 2.5rem; font-size: 1.2rem; font-weight: bold;
            text-decoration: none; border-radius: 40px; margin-top: 1.5rem;
            transition: 0.2s; text-align: center;
        }
        .download-btn:hover { background: #ffc107; box-shadow: 0 0 20px rgba(255,215,80,0.5); }

        @media print {
            body { background: white !important; }
            .slide-container { background: white !important; border: 1px solid #999 !important; box-shadow: none !important; page-break-after: always; }
            .slide-title { color: #2c1e0e !important; }
            .slide-content { color: #333 !important; }
            .slide-content strong { color: #5d4037 !important; }
            .nav, .download-btn { display: none !important; }
        }
    </style>
</head>
<body>

<div class="slide-container" id="slideContainer">
    <div class="slide-title" id="slideTitle"></div>
    <div class="slide-content" id="slideContent"></div>
    <div class="slide-number" id="slideNumber"></div>
</div>

<div class="nav">
    <button class="nav-btn" id="prevBtn" onclick="prevSlide()">◀ Назад</button>
    <span class="page-indicator" id="pageIndicator">1 / 20</span>
    <button class="nav-btn" id="nextBtn" onclick="nextSlide()">Вперёд ▶</button>
</div>

<button class="download-btn" id="downloadBtn" onclick="prepareAndPrint()">📥 Скачать как PDF</button>

<!-- Скрытый контейнер для печати -->
<div id="printContainer" style="display: none;"></div>

<p style="color:#706858;margin-top:0.5rem;font-size:0.85rem;">Откроется окно печати — выберите «Сохранить как PDF»</p>

<script>
const slides = [

            <ul>

            <p>Есть свои <strong>ёмкость (C_sense), индуктивность (L_sense), импеданс (Z_sense)</strong>.</p>
        `
    },

        title: "🙏 Эффект N² — сила коллективной молитвы",
        content: `

        `

                <li>0: Стекло, бумага.</li>
                <li>-1: Пластик, синтетика.</li>
                <li>-3: Железобетон.</li>
            </ul>
            <p><em>Окружайте себя «светлыми» материалами.</em></p>
        `
    },
    {
        title: "🍽️ Семантическая Кулинария",
        content: `
            <p><strong>Q_блюда = Q_ингредиентов + ΔQ_повара + ΔQ_ритуала</strong></p>
            <ul>
                <li>Еда, приготовленная с любовью (Cₛ > 0.8), имеет ранг на 1-2 пункта выше.</li>

            </ul>

    {

];

let currentSlide = 0;
const totalSlides = slides.length;

function showSlide(index) {
    const slide = slides[index];
    document.getElementById('slideTitle').textContent = slide.title;
    document.getElementById('slideContent').innerHTML = slide.content;
    document.getElementById('slideNumber').textContent = 'Слайд ' + (index + 1) + ' из ' + totalSlides;
    document.getElementById('pageIndicator').textContent = (index + 1) + ' / ' + totalSlides;
    document.getElementById('prevBtn').disabled = (index === 0);
    document.getElementById('nextBtn').disabled = (index === totalSlides - 1);
}

function nextSlide() { if (currentSlide < totalSlides - 1) { currentSlide++; showSlide(currentSlide); } }
function prevSlide() { if (currentSlide > 0) { currentSlide--; showSlide(currentSlide); } }

document.addEventListener('keydown', function(e) {
    if (e.key === 'ArrowRight' || e.key === 'ArrowDown') { e.preventDefault(); nextSlide(); }
    if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') { e.preventDefault(); prevSlide(); }
});

showSlide(0);

function prepareAndPrint() {
    // Строим полную презентацию для печати
    const printContainer = document.getElementById('printContainer');
    let allSlidesHTML = '';
    
    slides.forEach((slide, index) => {
        allSlidesHTML += `
            <div style="
                background: white;
                min-height: 100vh;
                padding: 3rem 2.5rem;
                font-family: 'Georgia', 'Times New Roman', serif;
                page-break-after: always;
                color: #333;
            ">
                <h1 style="color: #3b2a1f; font-size: 2rem; border-bottom: 2px solid #8b7355; padding-bottom: 0.8rem; margin-bottom: 1.5rem;">
                    ${slide.title}
                </h1>
                <div style="font-size: 1.1rem; line-height: 1.8; color: #333;">
                    ${slide.content}
                </div>
                <p style="text-align: right; color: #999; margin-top: 3rem; font-size: 0.9rem;">
                    Слайд ${index + 1} из ${slides.length} • Идеатоника • 2026
                </p>
            </div>
        `;
    });
    
    printContainer.innerHTML = allSlidesHTML;
    printContainer.style.display = 'block';
    
    // Даём браузеру секунду на отрисовку
    setTimeout(function() {
        window.print();
        // После печати (или отмены) скрываем контейнер
        setTimeout(function() {
            printContainer.style.display = 'none';
            printContainer.innerHTML = '';
        }, 500);
    }, 300);
}
</script>

</body>
</html>
