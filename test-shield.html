<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Тест: Насколько вы защищены? • Идеатоника</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: linear-gradient(145deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh; font-family: 'Georgia', 'Times New Roman', serif;
            padding: 2rem; display: flex; flex-direction: column; align-items: center;
            transition: background 0.5s ease;
        }
        .cosmic-bg {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle at 30% 40%, rgba(255,215,150,0.08) 0%, transparent 50%),
                        radial-gradient(circle at 80% 70%, rgba(100,150,255,0.05) 0%, transparent 60%);
            pointer-events: none; z-index: 0;
        }
        .test-container {
            max-width: 700px; width: 100%; position: relative; z-index: 1;
            background: rgba(30, 40, 60, 0.85); backdrop-filter: blur(12px);
            border: 1px solid rgba(227, 184, 124, 0.4); border-radius: 32px;
            padding: 2.5rem; box-shadow: 0 20px 40px rgba(0,0,0,0.5);
            transition: border-color 0.3s ease;
        }
        .test-header { text-align: center; margin-bottom: 2rem; }
        .test-header h1 { font-size: 2.2rem; color: #f3e7c0; margin-bottom: 0.5rem; display: flex; align-items: center; justify-content: center; gap: 10px; }
        .progress-bar { width: 100%; height: 6px; background: rgba(0,0,0,0.3); border-radius: 3px; margin: 1.5rem 0; }
        .progress-fill { height: 100%; background: #42a5f5; border-radius: 3px; width: 0%; transition: width 0.3s ease; }
        .progress-text { text-align: right; color: #a09080; font-size: 0.8rem; margin-top: 0.3rem; }
        .question-box { margin-bottom: 2rem; }
        .question-text { color: #f3e7c0; font-size: 1.3rem; margin-bottom: 1.5rem; line-height: 1.5; }
        .options { display: flex; flex-direction: column; gap: 12px; }
        .option {
            background: rgba(0,0,0,0.2); border: 1px solid #5d4a3a; border-radius: 16px;
            padding: 1rem 1.5rem; cursor: pointer; transition: all 0.2s ease;
            color: #d0c8b8; display: flex; align-items: center; gap: 15px;
        }
        .option:hover { background: rgba(66, 165, 245, 0.15); border-color: #42a5f5; }
        .option.selected { background: rgba(66, 165, 245, 0.25); border-color: #42a5f5; color: #f3e7c0; }
        .option-marker {
            width: 24px; height: 24px; border-radius: 50%; border: 2px solid #5d4a3a;
            display: flex; align-items: center; justify-content: center; transition: all 0.2s;
        }
        .option.selected .option-marker { border-color: #42a5f5; background: #42a5f5; box-shadow: 0 0 10px #42a5f5; }
        .option.selected .option-marker::after { content: "✓"; color: #1a1a2e; font-weight: bold; }
        .option-text { flex: 1; }
        .nav-buttons { display: flex; justify-content: space-between; margin-top: 2rem; gap: 15px; }
        .btn {
            background: transparent; border: 1.5px solid #42a5f5; color: #42a5f5;
            padding: 0.8rem 1.8rem; font-size: 1rem; font-weight: bold; border-radius: 40px;
            cursor: pointer; transition: 0.2s; font-family: inherit;
        }
        .btn:hover { background: #42a5f5; color: #1a1a2e; }
        .btn:disabled { opacity: 0.3; cursor: not-allowed; }
        .btn-secondary { border-color: #5d4a3a; color: #a09080; }
        .btn-secondary:hover { background: #5d4a3a; color: #d0c8b8; }
        .result-container { text-align: center; }
        .result-score { font-size: 5rem; font-weight: bold; margin: 1rem 0; }
        .result-scale { font-size: 1.2rem; margin-bottom: 1.5rem; }
        .result-comment { background: rgba(0,0,0,0.2); border-radius: 20px; padding: 1.5rem; margin: 1.5rem 0; line-height: 1.6; }
        .result-advice { background: rgba(66, 165, 245, 0.1); border-left: 4px solid #42a5f5; padding: 1.2rem 1.5rem; border-radius: 0 12px 12px 0; text-align: left; }
        .hidden { display: none !important; }
        .back-link { display: inline-block; margin-top: 1.5rem; color: #42a5f5; text-decoration: none; font-size: 0.9rem; }
        .back-link:hover { text-decoration: underline; }
    </style>
</head>
<body id="mainBody">
<div class="cosmic-bg"></div>
<div class="test-container" id="testContainer">
    <div class="test-header">
        <h1><span>🛡️</span><span id="testTitle">Ваш щит: Насколько вы защищены?</span><span>⚔️</span></h1>
        <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
        <div class="progress-text" id="progressText">Вопрос 1 из 7</div>
    </div>
    <div id="questionContainer"></div>
    <div class="nav-buttons">
        <button class="btn btn-secondary" id="prevBtn" disabled>← Назад</button>
        <button class="btn btn-secondary" id="exitBtn">🚪 Выйти</button>
        <button class="btn" id="nextBtn">Далее →</button>
    </div>
    <div style="text-align: center;"><a href="diagnostics-hub.html" class="back-link">← Вернуться в Хаб Диагностики</a></div>
</div>

<script>
(function() {
    const questions = [
        {
            text: "После общения с человеком, который постоянно жалуется и ноет, вы чувствуете:",
            options: [
                { text: "Полное опустошение, как выжатый лимон. Мне нужно несколько часов, чтобы восстановиться", value: -3 },
                { text: "Заметную усталость, хочется отдохнуть", value: -2 },
                { text: "Лёгкую усталость, но быстро проходящую", value: -1 },
                { text: "Ничего особенного. Я умею абстрагироваться", value: 1 },
                { text: "Я могу его/её даже немного «зарядить» своим спокойствием, и ему становится легче", value: 3 }
            ]
        },
        {
            text: "Когда вы входите в комнату, где только что произошла ссора, вы:",
            options: [
                { text: "Сразу чувствую тяжесть, давление. Мне физически некомфортно", value: -3 },
                { text: "Чувствую напряжение, хочется уйти", value: -2 },
                { text: "Замечаю, что атмосфера «не та», но меня это не сильно трогает", value: 0 },
                { text: "Спокойно нахожусь, атмосфера меня не задевает", value: 2 },
                { text: "Могу разрядить обстановку одним своим присутствием", value: 3 }
            ]
        },
        {
            text: "Если кто-то на вас кричит или агрессивно спорит, ваша типичная реакция:",
            options: [
                { text: "Я теряюсь, «замираю», не могу ответить. Долго переживаю потом", value: -3 },
                { text: "Я расстраиваюсь, чувствую себя подавленно", value: -2 },
                { text: "Я могу ответить, но внутри всё равно неприятно", value: 0 },
                { text: "Я спокойно отстаиваю границы, не принимая агрессию на свой счёт", value: 2 },
                { text: "Агрессия «отскакивает» от меня, как от стены. Я остаюсь невозмутим", value: 3 }
            ]
        },
        {
            text: "Находясь в толпе (метро, митинг, торговый центр), вы чувствуете:",
            options: [
                { text: "Сильное истощение, «кашу» в голове. Мне нужно уйти как можно скорее", value: -3 },
                { text: "Дискомфорт, усталость, но терпимо", value: -1 },
                { text: "Нейтрально. Толпа есть толпа", value: 1 },
                { text: "Я не теряю себя в толпе, моё поле стабильно", value: 2 },
                { text: "Я могу «вести» толпу, задавать ей настроение", value: 3 }
            ]
        },
        {
            text: "Можете ли вы по своему желанию создать «защитный кокон» (визуализировать щит)?",
            options: [
                { text: "Не понимаю, о чём речь. Это что-то из фантастики?", value: -2 },
                { text: "Пробовал(а), но не чувствую эффекта", value: -1 },
                { text: "Иногда получается, когда я спокоен/спокойна", value: 1 },
                { text: "Да, я регулярно использую визуализацию щита, и это работает", value: 2 },
                { text: "Мой щит — это моя вторая кожа. Я управляю им осознанно в любой момент", value: 3 }
            ]
        },
        {
            text: "Как часто вы чувствуете, что на вас «сглазили» или позавидовали, и после этого начались неприятности?",
            options: [
                { text: "Часто. Я очень чувствителен/чувствительна к таким вещам", value: -3 },
                { text: "Иногда замечаю связь между чьей-то завистью и своими неудачами", value: -1 },
                { text: "Редко. Я не склонен/склонна связывать события с чьим-то взглядом", value: 1 },
                { text: "Никогда. Чужая зависть меня не касается. У меня сильное поле", value: 3 }
            ]
        },
        {
            text: "Как быстро вы восстанавливаетесь после стрессовой ситуации?",
            options: [
                { text: "Очень медленно. Могу переживать days или weeks", value: -3 },
                { text: "Медленно. Нужен день-два, чтобы прийти в себя", value: -2 },
                { text: "Средне. Через несколько часов я уже в норме", value: 0 },
                { text: "Быстро. 15-30 минут — и я снова в строю", value: 2 },
                { text: "Мгновенно. Я «перезагружаюсь» за минуту-две", value: 3 }
            ]
        }
    ];
    
    const totalQuestions = questions.length;
    let currentIndex = 0;
    let answers = new Array(totalQuestions).fill(null);
    
    const questionContainer = document.getElementById('questionContainer');
    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');
    const exitBtn = document.getElementById('exitBtn');
    const progressFill = document.getElementById('progressFill');
    const progressText = document.getElementById('progressText');
    const testContainer = document.getElementById('testContainer');
    const mainBody = document.getElementById('mainBody');
    const testTitle = document.getElementById('testTitle');
    let isResultMode = false;
    
    function renderQuestion(index) {
        const q = questions[index];
        let html = `<div class="question-box"><div class="question-text">${index + 1}. ${q.text}</div><div class="options">`;
        q.options.forEach(opt => {
            const isSelected = answers[index] === opt.value;
            html += `<div class="option ${isSelected ? 'selected' : ''}" data-value="${opt.value}"><div class="option-marker"></div><div class="option-text">${opt.text}</div></div>`;
        });
        html += `</div></div>`;
        questionContainer.innerHTML = html;
        document.querySelectorAll('.option').forEach(opt => {
            opt.addEventListener('click', () => {
                answers[index] = parseInt(opt.dataset.value);
                renderQuestion(index);
            });
        });
        const progress = ((index + 1) / totalQuestions) * 100;
        progressFill.style.width = progress + '%';
        progressText.textContent = `Вопрос ${index + 1} из ${totalQuestions}`;
        prevBtn.disabled = index === 0;
        nextBtn.textContent = index === totalQuestions - 1 ? '🎉 Завершить' : 'Далее →';
    }
    
    function calculateResult() {
        const sum = answers.reduce((acc, val) => acc + val, 0);
        const maxSum = 20, minSum = -20;
        // Приводим к шкале от 0 (Полностью уязвим) до 10 (Абсолютный щит)
        return Math.round((sum - minSum) / (maxSum - minSum) * 10);
    }
    
    function getResultColor(score) {
        if (score > 7) return '#ffd54f'; // Золотой щит
        if (score > 4) return '#42a5f5'; // Стальной щит
        if (score > 1) return '#90caf9'; // Лёгкий щит
        return '#ef5350'; // Нет щита
    }
    
    function getResultComment(score) {
        if (score > 8) return "🛡️ Вы — КРЕПОСТЬ. Ваш семантический щит почти непробиваем. Вы не только защищены, но и можете служить защитой для других. Ваше поле стабильно, как скала.";
        if (score > 5) return "🔰 Вы — ЗАЩИЩЁННЫЙ. У вас хороший уровень семантической защиты. Вы умеете держать удар и быстро восстанавливаетесь. Мелкие атаки вам не страшны.";
        if (score > 2) return "🪶 Вы — УМЕРЕННО ЗАЩИЩЁННЫЙ. Ваш щит есть, но он нестабилен. Вы чувствительны к сильным негативным воздействиям, но с мелкими справляетесь.";
        if (score > 0) return "🌬️ Вы — СЛАБО ЗАЩИЩЁННЫЙ. Ваше поле «продувается» чужими эмоциями. Вы быстро устаёте от людей, вам нужно чаще бывать в одиночестве для восстановления.";
        return "💔 Вы — УЯЗВИМЫЙ. Ваш семантический щит почти отсутствует. Вы «впитываете» всё, как губка. Срочно учитесь ставить защиту (визуализация, материалы-обереги).";
    }
    
    function getResultAdvice(score) {
        if (score > 5) return "🛡️ Совет: Вы — прирождённый защитник. Помогайте другим учиться ставить щиты. Но не забывайте «проветривать» и свой — даже крепости нужна профилактика.";
        if (score > 2) return "🧘 Совет: Укрепляйте щит регулярной практикой. Визуализируйте кокон золотого света каждое утро. Носите с собой оберег (серебро, шунгит, аметист).";
        if (score > 0) return "💧 Совет: Вам нужно осознанно работать над защитой. Начните с малого: перед входом в людное место ставьте «мысленную стену». Используйте соль для очистки поля после контакта с негативом.";
        return "🆘 Совет: Ваша уязвимость — это не приговор. Начните носить закрытую одежду из натуральных тканей. Используйте шунгит и чёрный обсидиан. Практикуйте SHIELD-TEST. Избегайте энергетических вампиров.";
    }
    
    function showResult() {
        isResultMode = true;
        const score = calculateResult();
        const color = getResultColor(score);
        const comment = getResultComment(score);
        const advice = getResultAdvice(score);
        mainBody.style.background = `linear-gradient(145deg, ${color}20 0%, #16213e 100%)`;
        testContainer.style.borderColor = color;
        let html = `<div class="result-container">`;
        html += `<h2 style="color: ${color};">Ваш результат</h2>`;
        html += `<div class="result-score" style="color: ${color};">${score}</div>`;
        html += `<div class="result-scale">по шкале K_shield (от 0 до 10)</div>`;
        html += `<div class="result-comment" style="color: #d0c8b8;">${comment}</div>`;
        html += `<div class="result-advice" style="color: #d0c8b8;">${advice}</div>`;
        html += `<p style="margin-top: 1.5rem; color: #a09080; font-style: italic;">K_shield — это не постоянная величина. Его можно тренировать, как мышцу. SHIELD-TEST покажет ваш прогресс.</p>`;
        html += `</div>`;
        questionContainer.innerHTML = html;
        prevBtn.classList.add('hidden');
        nextBtn.classList.add('hidden');
        exitBtn.textContent = '🔄 Пройти заново';
        exitBtn.classList.remove('btn-secondary');
        exitBtn.classList.add('btn');
        testTitle.textContent = `Результат: K_shield = ${score}/10`;
        progressText.textContent = `Тест завершён`;
        
        setTimeout(function() {
    const passportBtn = document.createElement('button');
    passportBtn.textContent = '💾 Сохранить результат в Семантический Паспорт';
    passportBtn.style.cssText = 'display: block; margin: 2rem auto; padding: 1rem 2rem; background: #4fc3f7; color: #1a1a2e; border: none; border-radius: 40px; font-size: 1rem; cursor: pointer; font-weight: bold; transition: 0.3s;';
    passportBtn.onmouseover = () => passportBtn.style.background = '#03a9f4';
    passportBtn.onmouseout = () => passportBtn.style.background = '#4fc3f7';

    passportBtn.addEventListener('click', function() {
        const scoreElement = document.querySelector('.result-score');
        if (scoreElement) {
            const resultText = scoreElement.textContent.trim();
            const resultValue = parseFloat(resultText);
            if (!isNaN(resultValue)) {
                localStorage.setItem('ideatonika_test_shield', resultValue);
            } else {
                localStorage.setItem('ideatonika_test_shield', resultText);
            }
            passportBtn.textContent = '✅ Сохранено в Паспорт!';
            passportBtn.style.background = '#01579b';
            passportBtn.style.color = 'white';
            passportBtn.disabled = true;
        }
    });

    const container = document.querySelector('.result-container') || document.getElementById('questionContainer');
    if (container) {
        container.appendChild(passportBtn);
    }
}, 100);

// ========== КНОПКА "ПОДЕЛИТЬСЯ РЕЗУЛЬТАТОМ" ==========
setTimeout(function() {
    const shareContainer = document.createElement('div');
    shareContainer.style.cssText = 'text-align: center; margin-top: 1.5rem;';

    const shareBtn = document.createElement('button');
    shareBtn.textContent = '📤 Поделиться результатом';
    shareBtn.style.cssText = 'display: block; margin: 0 auto 0.8rem auto; padding: 0.8rem 2rem; background: transparent; color: #81c784; border: 1.5px solid #81c784; border-radius: 40px; font-size: 1rem; cursor: pointer; font-weight: bold; transition: 0.3s; font-family: Georgia, serif;';
    shareBtn.onmouseover = () => shareBtn.style.background = '#81c784';
    shareBtn.onmouseout = () => shareBtn.style.background = 'transparent';
    shareBtn.onmouseover = () => shareBtn.style.color = '#1a1a2e';
    shareBtn.onmouseout = () => shareBtn.style.color = '#81c784';

    shareBtn.addEventListener('click', function() {
        // Получаем название теста из заголовка страницы
        const testName = document.title.replace(' • Идеатоника', '').trim();
        
        // Получаем результат из элемента .result-score
        const scoreElement = document.querySelector('.result-score');
        let resultText = '';
        if (scoreElement) {
            resultText = scoreElement.textContent.trim();
        }
        
        // Получаем комментарий из элемента .result-comment или .result-interpretation
        const commentElement = document.querySelector('.result-comment') || document.querySelector('.result-interpretation');
        let commentText = '';
        if (commentElement) {
            commentText = commentElement.textContent.trim();
        }
        
        // Формируем текст для отправки
        const shareText = `🧪 Я прошёл тест «${testName}» на портале Идеатоника!\n\n` +
            `📊 Мой результат: ${resultText}\n` +
            `💬 ${commentText}\n\n` +
            `🎯 А какой результат у тебя?\n` +
            `👉 Пройти тест: ${window.location.href}\n\n` +
            `🌌 Идеатоника — физика смысла.`;
        
        // Пытаемся использовать Web Share API (мобильные устройства)
        if (navigator.share) {
            navigator.share({
                title: `Мой результат теста «${testName}»`,
                text: shareText,
                url: window.location.href
            }).catch(() => {
                // Если не получилось — копируем в буфер
                copyToClipboard(shareText);
            });
        } else {
            // Если Web Share API не поддерживается — копируем в буфер
            copyToClipboard(shareText);
        }
    });

    function copyToClipboard(text) {
        if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(text).then(() => {
                const originalText = shareBtn.textContent;
                shareBtn.textContent = '✅ Скопировано! Отправь другу';
                shareBtn.style.borderColor = '#ffd54f';
                shareBtn.style.color = '#ffd54f';
                setTimeout(() => {
                    shareBtn.textContent = originalText;
                    shareBtn.style.borderColor = '#81c784';
                    shareBtn.style.color = '#81c784';
                }, 2500);
            }).catch(() => {
                fallbackCopy(text);
            });
        } else {
            fallbackCopy(text);
        }
    }

    function fallbackCopy(text) {
        const textarea = document.createElement('textarea');
        textarea.value = text;
        textarea.style.position = 'fixed';
        textarea.style.left = '-9999px';
        document.body.appendChild(textarea);
        textarea.select();
        try {
            document.execCommand('copy');
            const originalText = shareBtn.textContent;
            shareBtn.textContent = '✅ Скопировано! Отправь другу';
            shareBtn.style.borderColor = '#ffd54f';
            shareBtn.style.color = '#ffd54f';
            setTimeout(() => {
                shareBtn.textContent = originalText;
                shareBtn.style.borderColor = '#81c784';
                shareBtn.style.color = '#81c784';
            }, 2500);
        } catch(e) {
            shareBtn.textContent = '❌ Не удалось скопировать';
            shareBtn.style.borderColor = '#ef5350';
            shareBtn.style.color = '#ef5350';
        }
        document.body.removeChild(textarea);
    }

    // Добавляем подсказку
    const hint = document.createElement('div');
    hint.style.cssText = 'color: #a09080; font-size: 0.8rem; font-style: italic;';
    hint.textContent = 'Нажмите, чтобы скопировать результат и отправить другу';
    shareContainer.appendChild(shareBtn);
    shareContainer.appendChild(hint);

    // Ищем контейнер с результатом
    const container = document.querySelector('.result-container') || document.getElementById('questionContainer');
    if (container) {
        container.appendChild(shareContainer);
    }
}, 100);

    }
    
    function resetTest() {
        isResultMode = false;
        currentIndex = 0;
        answers = new Array(totalQuestions).fill(null);
        mainBody.style.background = '';
        testContainer.style.borderColor = '';
        testTitle.textContent = 'Ваш щит: Насколько вы защищены?';
        prevBtn.classList.remove('hidden');
        nextBtn.classList.remove('hidden');
        exitBtn.textContent = '🚪 Выйти';
        exitBtn.classList.add('btn-secondary');
        renderQuestion(0);
    }
    
    prevBtn.addEventListener('click', () => { if (currentIndex > 0) { currentIndex--; renderQuestion(currentIndex); } });
    nextBtn.addEventListener('click', () => {
        if (answers[currentIndex] === null) { alert('Пожалуйста, выберите один из вариантов ответа.'); return; }
        if (currentIndex < totalQuestions - 1) { currentIndex++; renderQuestion(currentIndex); }
        else { if (answers.includes(null)) { alert('Пожалуйста, ответьте на все вопросы.'); return; } showResult(); }
    });
    exitBtn.addEventListener('click', () => {
        if (isResultMode) resetTest();
        else { if (confirm('Вы уверены, что хотите выйти? Прогресс будет потерян.')) window.location.href = 'diagnostics-hub.html'; }
    });
    renderQuestion(0);
})();
</script>
</body>
</html>
