                    { text: "Интуиция — это прямое считывание семантического поля.", value: 5 },
                    { text: "Я развиваю свою интуицию, и она становится всё точнее.", value: 6 },
                    { text: "Я доверяю интуиции больше, чем глазам и ушам.", value: 7 },
                    { text: "Интуиция — это голос моей души. Я всегда слушаю его.", value: 8 },
                    { text: "Я и интуиция — одно. Я знаю всё, что мне нужно.", value: 9 },
                    { text: "Нет интуиции. Есть только прямое знание Истины.", value: 10 }
                ]
            }
        ];

        const totalQuestions = questions.length;
        let currentIndex = 0;
        let answers = new Array(totalQuestions).fill(null);

        const questionContainer = document.getElementById('questionContainer');
        const prevBtn = document.getElementById('prevBtn');
        const nextBtn = document.getElementById('nextBtn');
        const exitBtn = document.getElementById('exitBtn');
        const progressFill = document.getElementById('progressFill');
        const progressText = document.getElementById('progressText');
        const testContainer = document.getElementById('testContainer');
        const mainBody = document.getElementById('mainBody');
        const testTitle = document.getElementById('testTitle');
        let isResultMode = false;

        function renderQuestion(index) {
            const q = questions[index];
            let html = `<div class="question-box">`;
            html += `<div class="question-text">${index + 1}. ${q.text}</div>`;
            html += `<div class="options">`;

            q.options.forEach((opt) => {
                const isSelected = answers[index] === opt.value;
                html += `<div class="option ${isSelected ? 'selected' : ''}" data-value="${opt.value}">
                    <div class="option-marker"></div>
                    <div class="option-text">${opt.text}</div>
                </div>`;
            });

            html += `</div></div>`;
            questionContainer.innerHTML = html;

            document.querySelectorAll('.option').forEach(opt => {
                opt.addEventListener('click', () => {
                    const value = parseInt(opt.dataset.value);
                    answers[index] = value;
                    renderQuestion(index);
                });
            });

            const progress = ((index + 1) / totalQuestions) * 100;
            progressFill.style.width = progress + '%';
            progressText.textContent = `Вопрос ${index + 1} из ${totalQuestions}`;
            prevBtn.disabled = index === 0;
            if (index === totalQuestions - 1) { nextBtn.textContent = '🎉 Завершить'; }
            else { nextBtn.textContent = 'Далее →'; }
        }

        function calculateResult() {
            const sum = answers.reduce((acc, val) => acc + val, 0);
            const avg = sum / totalQuestions;
            return Math.round(avg * 10) / 10; // от 0.0 до 10.0
        }

        function getResultStyle(chi) {
            if (chi >= 9) return { color: '#e1bee7', borderColor: '#e1bee7', bg: 'rgba(225,190,231,0.1)', label: '🌌 МЕДИУМ' };
            if (chi >= 7) return { color: '#ce93d8', borderColor: '#ce93d8', bg: 'rgba(206,147,216,0.1)', label: '✨ ЭКСТРАСЕНС' };
            if (chi >= 5) return { color: '#ab47bc', borderColor: '#ab47bc', bg: 'rgba(171,71,188,0.1)', label: '🔮 СЕНСИТИВ' };
            if (chi >= 3) return { color: '#7b1fa2', borderColor: '#7b1fa2', bg: 'rgba(123,31,162,0.1)', label: '🌿 ЧУВСТВУЮЩИЙ' };
            if (chi >= 1) return { color: '#9c27b0', borderColor: '#9c27b0', bg: 'rgba(156,39,176,0.1)', label: '🌫️ ТУМАННЫЙ' };
            return { color: '#78909c', borderColor: '#78909c', bg: 'rgba(120,144,156,0.1)', label: '🪨 ГЛУХАРЬ' };
        }

        function getResultComment(chi) {
            if (chi >= 9) return "Вы — Медиум. Ваша чувствительность почти запредельна. Вы — мост между мирами. Вам необходимы практики заземления и защиты.";
            if (chi >= 7) return "Вы — Экстрасенс. Очень высокая чувствительность. Вы видите ауры, вещие сны, тонкие миры. Это дар, но и большая ответственность.";
            if (chi >= 5) return "Вы — Сенситив. Ваша чувствительность выше среднего. Вы легко считываете людей, места, предчувствуете события. Учитесь защищать своё поле.";
            if (chi >= 3) return "Вы — Чувствующий. У вас средняя, нормальная интуиция. Вы замечаете атмосферу, эмпатичны. Доверяйте своему «нутрю» больше.";
            if (chi >= 1) return "Вы — Туманный. Иногда вы что-то чувствуете, но списываете на совпадения. Ваша интуиция пробивается, но вы ей не доверяете.";
            return "Вы — Семантический глухарь. Ваша чувствительность очень низкая. Вы живёте в плотном, материальном мире. Это не плохо, это просто ваша природа.";
        }

        function getResultAdvice(chi) {
            if (chi >= 9) return "🕊️ Совет: Ваша миссия — служение. Но сначала — выживание. Строгий режим дня, здоровая еда, регулярные практики заземления. Найдите сообщество «таких же».";
            if (chi >= 7) return "⚡ Совет: Вам нужен наставник. Ищите учителя по медитации или духовным практикам. Изучайте техники очищения и защиты.";
            if (chi >= 5) return "🛡️ Совет: Учитесь защищаться. Практикуйте «семантический щит». Избегайте мест с тяжёлой энергетикой. Заземляйтесь через спорт и природу.";
            if (chi >= 3) return "💧 Совет: Укрепляйте доверие к себе. Записывайте свои предчувствия и проверяйте их. Практикуйте тест с угадыванием карт.";
            if (chi >= 1) return "🌱 Совет: Развивайте интуицию. Ведите дневник снов. Медитируйте на образ «третьего глаза».";
            return "🌱 Совет: Не расстраивайтесь. Чувствительность можно развить. Начните с малого: пытайтесь угадать, кто звонит, прежде чем посмотреть на телефон.";
        }

        function showResult() {
            isResultMode = true;
            const chi = calculateResult();
            const style = getResultStyle(chi);
            const comment = getResultComment(chi);
            const advice = getResultAdvice(chi);

            mainBody.style.background = `linear-gradient(145deg, ${style.color}20 0%, #16213e 100%)`;
            testContainer.style.borderColor = style.borderColor;

            let html = `<div class="result-container">`;
            html += `<h2 style="color: ${style.color};">${style.label}</h2>`;
            html += `<div class="result-score" style="color: ${style.color};">${chi.toFixed(1)}</div>`;
            html += `<div class="result-scale">по шкале χ (от 0 до 10)</div>`;
            html += `<div class="result-comment" style="color: #d0c8b8; background: ${style.bg};">${comment}</div>`;
            html += `<div class="result-advice" style="color: #d0c8b8; background: ${style.bg}; border-left: 4px solid ${style.borderColor};">${advice}</div>`;
            html += `<p style="margin-top: 1.5rem; color: #a09080; font-style: italic;">χ — это не магия, а чувствительность к семантическому полю. Её можно развивать.</p>`;
            html += `</div>`;

            questionContainer.innerHTML = html;
            prevBtn.classList.add('hidden');
            nextBtn.classList.add('hidden');
            exitBtn.textContent = '🔄 Пройти заново';
            exitBtn.classList.remove('btn-secondary');
            exitBtn.classList.add('btn');
            testTitle.textContent = `Результат: χ = ${chi.toFixed(1)}`;
            progressText.textContent = `Тест завершён`;
            
            // --- СОХРАНЕНИЕ В УЛЬТРА-ПАСПОРТ ---
setTimeout(function() {
    const passportBtn = document.createElement('button');
    passportBtn.textContent = '💾 Сохранить результат в Ультра-Паспорт';
    passportBtn.style.cssText = 'display: block; margin: 2rem auto; padding: 1rem 2rem; background: #81c784; color: #1a1a2e; border: none; border-radius: 40px; font-size: 1rem; cursor: pointer; font-weight: bold; transition: 0.3s;';
    passportBtn.onmouseover = () => passportBtn.style.background = '#4caf50';
    passportBtn.onmouseout = () => passportBtn.style.background = '#81c784';

    passportBtn.addEventListener('click', function() {
        // Ищем результат на странице
        const scoreElement = document.querySelector('.result-score');
        if (scoreElement) {
            const resultValue = parseFloat(scoreElement.textContent);
            if (!isNaN(resultValue)) {
                // Ключ: ideatonika_deep_qs (НЕ пересекается с обычным ideatonika_test_qs)
                localStorage.setItem('ideatonika_deep_chi', resultValue);
                passportBtn.textContent = '✅ Сохранено в Ультра-Паспорт!';
                passportBtn.style.background = '#388e3c';
                passportBtn.style.color = 'white';
                passportBtn.disabled = true;
            }
        }
    });

    const container = document.querySelector('.result-container') || document.getElementById('questionContainer');
    if (container) {
        container.appendChild(passportBtn);
    }
}, 100);

// ========== КНОПКА "ПОДЕЛИТЬСЯ РЕЗУЛЬТАТОМ" ==========
setTimeout(function() {
    const shareContainer = document.createElement('div');
    shareContainer.style.cssText = 'text-align: center; margin-top: 1.5rem;';

    const shareBtn = document.createElement('button');
    shareBtn.textContent = '📤 Поделиться результатом';
    shareBtn.style.cssText = 'display: block; margin: 0 auto 0.8rem auto; padding: 0.8rem 2rem; background: transparent; color: #81c784; border: 1.5px solid #81c784; border-radius: 40px; font-size: 1rem; cursor: pointer; font-weight: bold; transition: 0.3s; font-family: Georgia, serif;';
    shareBtn.onmouseover = () => shareBtn.style.background = '#81c784';
    shareBtn.onmouseout = () => shareBtn.style.background = 'transparent';
    shareBtn.onmouseover = () => shareBtn.style.color = '#1a1a2e';
    shareBtn.onmouseout = () => shareBtn.style.color = '#81c784';

    shareBtn.addEventListener('click', function() {
        // Получаем название теста из заголовка страницы
        const testName = document.title.replace(' • Идеатоника', '').trim();
        
        // Получаем результат из элемента .result-score
        const scoreElement = document.querySelector('.result-score');
        let resultText = '';
        if (scoreElement) {
            resultText = scoreElement.textContent.trim();
        }
        
        // Получаем комментарий из элемента .result-comment или .result-interpretation
        const commentElement = document.querySelector('.result-comment') || document.querySelector('.result-interpretation');
        let commentText = '';
        if (commentElement) {
            commentText = commentElement.textContent.trim();
        }
        
        // Формируем текст для отправки
        const shareText = `🧪 Я прошёл тест «${testName}» на портале Идеатоника!\n\n` +
            `📊 Мой результат: ${resultText}\n` +
            `💬 ${commentText}\n\n` +
            `🎯 А какой результат у тебя?\n` +
            `👉 Пройти тест: ${window.location.href}\n\n` +
            `🌌 Идеатоника — физика смысла.`;
        
        // Пытаемся использовать Web Share API (мобильные устройства)
        if (navigator.share) {
            navigator.share({
                title: `Мой результат теста «${testName}»`,
                text: shareText,
                url: window.location.href
            }).catch(() => {
                // Если не получилось — копируем в буфер
                copyToClipboard(shareText);
            });
        } else {
            // Если Web Share API не поддерживается — копируем в буфер
            copyToClipboard(shareText);
        }
    });

    function copyToClipboard(text) {
        if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(text).then(() => {
                const originalText = shareBtn.textContent;
                shareBtn.textContent = '✅ Скопировано! Отправь другу';
                shareBtn.style.borderColor = '#ffd54f';
                shareBtn.style.color = '#ffd54f';
                setTimeout(() => {
                    shareBtn.textContent = originalText;
                    shareBtn.style.borderColor = '#81c784';
                    shareBtn.style.color = '#81c784';
                }, 2500);
            }).catch(() => {
                fallbackCopy(text);
            });
        } else {
            fallbackCopy(text);
        }
    }

    function fallbackCopy(text) {
        const textarea = document.createElement('textarea');
        textarea.value = text;
        textarea.style.position = 'fixed';
        textarea.style.left = '-9999px';
        document.body.appendChild(textarea);
        textarea.select();
        try {
            document.execCommand('copy');
            const originalText = shareBtn.textContent;
            shareBtn.textContent = '✅ Скопировано! Отправь другу';
            shareBtn.style.borderColor = '#ffd54f';
            shareBtn.style.color = '#ffd54f';
            setTimeout(() => {
                shareBtn.textContent = originalText;
                shareBtn.style.borderColor = '#81c784';
                shareBtn.style.color = '#81c784';
            }, 2500);
        } catch(e) {
            shareBtn.textContent = '❌ Не удалось скопировать';
            shareBtn.style.borderColor = '#ef5350';
            shareBtn.style.color = '#ef5350';
        }
        document.body.removeChild(textarea);
    }

    // Добавляем подсказку
    const hint = document.createElement('div');
    hint.style.cssText = 'color: #a09080; font-size: 0.8rem; font-style: italic;';
    hint.textContent = 'Нажмите, чтобы скопировать результат и отправить другу';
    shareContainer.appendChild(shareBtn);
    shareContainer.appendChild(hint);

    // Ищем контейнер с результатом
    const container = document.querySelector('.result-container') || document.getElementById('questionContainer');
    if (container) {
        container.appendChild(shareContainer);
    }
}, 100);

        }

        function resetTest() {
            isResultMode = false;
            currentIndex = 0;
            answers = new Array(totalQuestions).fill(null);
            mainBody.style.background = '';
            testContainer.style.borderColor = '';
            testTitle.textContent = 'Мега-тест χ (Хи)';
            prevBtn.classList.remove('hidden');
            nextBtn.classList.remove('hidden');
            exitBtn.textContent = '🚪 Выйти';
            exitBtn.classList.add('btn-secondary');
            renderQuestion(0);
        }

        prevBtn.addEventListener('click', () => { if (currentIndex > 0) { currentIndex--; renderQuestion(currentIndex); } });
        nextBtn.addEventListener('click', () => {
            if (answers[currentIndex] === null) { alert('Пожалуйста, выберите один из вариантов ответа.'); return; }
            if (currentIndex < totalQuestions - 1) { currentIndex++; renderQuestion(currentIndex); }
            else { if (!answers.includes(null)) showResult(); else alert('Пожалуйста, ответьте на все вопросы.'); }
        });
        exitBtn.addEventListener('click', () => { if (isResultMode) resetTest(); else { if (confirm('Вы уверены, что хотите выйти? Прогресс будет потерян.')) window.location.href = 'hidden-tests.html'; } });

        renderQuestion(0);
    })();
</script>
