<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Тест: Спектр вашей души • Идеатоника</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: linear-gradient(145deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh; font-family: 'Georgia', 'Times New Roman', serif;
            padding: 2rem; display: flex; flex-direction: column; align-items: center;
            transition: background 0.5s ease;
        }
        .cosmic-bg { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: radial-gradient(circle at 30% 40%, rgba(255,215,150,0.08) 0%, transparent 50%), radial-gradient(circle at 80% 70%, rgba(100,150,255,0.05) 0%, transparent 60%); pointer-events: none; z-index: 0; }
        .test-container { max-width: 700px; width: 100%; position: relative; z-index: 1; background: rgba(30, 40, 60, 0.85); backdrop-filter: blur(12px); border: 1px solid rgba(227, 184, 124, 0.4); border-radius: 32px; padding: 2.5rem; box-shadow: 0 20px 40px rgba(0,0,0,0.5); transition: border-color 0.3s ease; }
        .test-header { text-align: center; margin-bottom: 2rem; }
        .test-header h1 { font-size: 2.2rem; color: #f3e7c0; margin-bottom: 0.5rem; display: flex; align-items: center; justify-content: center; gap: 10px; }
        .progress-bar { width: 100%; height: 6px; background: rgba(0,0,0,0.3); border-radius: 3px; margin: 1.5rem 0; }
        .progress-fill { height: 100%; background: linear-gradient(90deg, #e91e63, #ff9800, #ffeb3b, #4caf50, #2196f3, #9c27b0); border-radius: 3px; width: 0%; transition: width 0.3s ease; }
        .progress-text { text-align: right; color: #a09080; font-size: 0.8rem; margin-top: 0.3rem; }
        .question-box { margin-bottom: 2rem; }
        .question-text { color: #f3e7c0; font-size: 1.3rem; margin-bottom: 1.5rem; line-height: 1.5; }
        .options { display: flex; flex-direction: column; gap: 12px; }
        .option { background: rgba(0,0,0,0.2); border: 1px solid #5d4a3a; border-radius: 16px; padding: 1rem 1.5rem; cursor: pointer; transition: all 0.2s ease; color: #d0c8b8; display: flex; align-items: center; gap: 15px; }
        .option:hover { background: rgba(255, 152, 0, 0.15); border-color: #ff9800; }
        .option.selected { background: rgba(255, 152, 0, 0.25); border-color: #ff9800; color: #f3e7c0; }
        .option-marker { width: 24px; height: 24px; border-radius: 50%; border: 2px solid #5d4a3a; display: flex; align-items: center; justify-content: center; transition: all 0.2s; }
        .option.selected .option-marker { border-color: #ff9800; background: #ff9800; box-shadow: 0 0 10px #ff9800; }
        .option.selected .option-marker::after { content: "✓"; color: #1a1a2e; font-weight: bold; }
        .option-text { flex: 1; }
        .nav-buttons { display: flex; justify-content: space-between; margin-top: 2rem; gap: 15px; }
        .btn { background: transparent; border: 1.5px solid #ff9800; color: #ff9800; padding: 0.8rem 1.8rem; font-size: 1rem; font-weight: bold; border-radius: 40px; cursor: pointer; transition: 0.2s; font-family: inherit; }
        .btn:hover { background: #ff9800; color: #1a1a2e; }
        .btn:disabled { opacity: 0.3; cursor: not-allowed; }
        .btn-secondary { border-color: #5d4a3a; color: #a09080; }
        .btn-secondary:hover { background: #5d4a3a; color: #d0c8b8; }
        .result-container { text-align: center; }
        .result-color-box { width: 120px; height: 120px; border-radius: 50%; margin: 1rem auto; box-shadow: 0 0 30px currentColor; }
        .result-score { font-size: 1.5rem; font-weight: bold; margin: 1rem 0; }
        .result-comment { background: rgba(0,0,0,0.2); border-radius: 20px; padding: 1.5rem; margin: 1.5rem 0; line-height: 1.6; }
        .result-advice { background: rgba(255, 152, 0, 0.1); border-left: 4px solid #ff9800; padding: 1.2rem 1.5rem; border-radius: 0 12px 12px 0; text-align: left; }
        .hidden { display: none !important; }
        .back-link { display: inline-block; margin-top: 1.5rem; color: #ff9800; text-decoration: none; font-size: 0.9rem; }
        .back-link:hover { text-decoration: underline; }
        .color-preview { display: inline-block; width: 18px; height: 18px; border-radius: 50%; margin-right: 8px; vertical-align: middle; border: 1px solid #fff; }
    </style>
</head>
<body id="mainBody">
<div class="cosmic-bg"></div>
<div class="test-container" id="testContainer">
    <div class="test-header">
        <h1><span>🎨</span><span id="testTitle">Спектр вашей души</span><span>🌈</span></h1>
        <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
        <div class="progress-text" id="progressText">Вопрос 1 из 7</div>
    </div>
    <div id="questionContainer"></div>
    <div class="nav-buttons">
        <button class="btn btn-secondary" id="prevBtn" disabled>← Назад</button>
        <button class="btn btn-secondary" id="exitBtn">🚪 Выйти</button>
        <button class="btn" id="nextBtn">Далее →</button>
    </div>
    <div style="text-align: center;"><a href="diagnostics-hub.html" class="back-link">← Вернуться в Хаб Диагностики</a></div>
</div>

<script>
(function() {
    const questions = [
        {
            text: "Какой цвет преобладает в вашем гардеробе? (Тот, который вы носите чаще всего)",
            options: [
                { text: "<span class='color-preview' style='background:#000;'></span>Чёрный, тёмно-серый", value: -2, color: "#212121" },
                { text: "<span class='color-preview' style='background:#795548;'></span>Коричневый, бежевый, хаки", value: 0, color: "#795548" },
                { text: "<span class='color-preview' style='background:#2196f3;'></span>Синий, голубой", value: 2, color: "#2196f3" },
                { text: "<span class='color-preview' style='background:#4caf50;'></span>Зелёный, оливковый", value: 3, color: "#4caf50" },
                { text: "<span class='color-preview' style='background:#f44336;'></span>Красный, бордовый, розовый", value: 1, color: "#f44336" },
                { text: "<span class='color-preview' style='background:#ff9800;'></span>Оранжевый, жёлтый, золотой", value: 4, color: "#ff9800" },
                { text: "<span class='color-preview' style='background:#fff;'></span>Белый, кремовый, пастельные тона", value: 5, color: "#f5f5f5" }
            ]
        },
        {
            text: "Какие цвета вас окружают дома? (Стены, мебель, текстиль)",
            options: [
                { text: "Серые, бетонные, «голые» — минимализм без тепла", value: -2, color: "#9e9e9e" },
                { text: "Нейтральные бежевые, коричневые — спокойно, но скучно", value: 0, color: "#a1887f" },
                { text: "Приглушённые синие, зелёные — прохлада и покой", value: 2, color: "#607d8b" },
                { text: "Тёплые деревянные, терракотовые, природные", value: 3, color: "#8d6e63" },
                { text: "Яркие акценты — красный, оранжевый, жёлтый в деталях", value: 1, color: "#ff5722" },
                { text: "Светлые, воздушные — много белого, пастельного", value: 4, color: "#f5f5f5" },
                { text: "Насыщенные, глубокие — фиолетовый, бордовый, изумрудный", value: 5, color: "#4a148c" }
            ]
        },
        {
            text: "Какой цвет вы бы никогда не стали использовать в своей спальне?",
            options: [
                { text: "Белый — слишком стерильно и холодно", value: 2, color: "#f5f5f5" },
                { text: "Чёрный — давит, как в склепе", value: -1, color: "#212121" },
                { text: "Красный — слишком агрессивно, не уснуть", value: 0, color: "#f44336" },
                { text: "Серый — тоскливо, как в больнице", value: -2, color: "#9e9e9e" },
                { text: "Жёлтый — слишком ярко, раздражает", value: 1, color: "#ffeb3b" },
                { text: "Фиолетовый — странно, не моё", value: 3, color: "#9c27b0" },
                { text: "Мне всё равно, я не обращаю внимания на цвет", value: 2, color: "#9e9e9e" }
            ]
        },
        {
            text: "Глядя на цвет, вы чувствуете его влияние на настроение?",
            options: [
                { text: "Никогда. Цвет — это просто длина волны", value: -2, color: "#607d8b" },
                { text: "Иногда, если цвет очень яркий или мрачный", value: 0, color: "#9e9e9e" },
                { text: "Да, красный бодрит, синий успокаивает — это базовые вещи", value: 1, color: "#2196f3" },
                { text: "Да, я чувствую «тепло» или «холод» от цвета", value: 3, color: "#ff9800" },
                { text: "Очень сильно. Цвета могут изменить моё состояние за минуту", value: 5, color: "#e91e63" },
                { text: "Я вижу ауру людей в цвете", value: 4, color: "#9c27b0" },
                { text: "Цвета для меня — это эмоции. У каждой эмоции свой цвет", value: 4, color: "#4caf50" }
            ]
        },
        {
            text: "Когда вы представляете «светлое, доброе, чистое», какой цвет приходит первым?",
            options: [
                { text: "Белый или золотой", value: 5, color: "#ffd54f" },
                { text: "Голубой или небесный", value: 3, color: "#42a5f5" },
                { text: "Зелёный или изумрудный", value: 4, color: "#66bb6a" },
                { text: "Розовый или персиковый", value: 2, color: "#f48fb1" },
                { text: "Жёлтый или солнечный", value: 4, color: "#ffee58" },
                { text: "Никакой. Добро не имеет цвета", value: 1, color: "#bdbdbd" },
                { text: "Фиолетовый или сиреневый", value: 3, color: "#ce93d8" }
            ]
        },
        {
            text: "Какой цвет, по вашему мнению, обладает «защитными» свойствами?",
            options: [
                { text: "Чёрный — поглощает всё, защищает", value: -1, color: "#212121" },
                { text: "Красный — отпугивает, как сигнал опасности", value: 1, color: "#f44336" },
                { text: "Синий — успокаивает и ограждает", value: 3, color: "#2196f3" },
                { text: "Золотой/Серебряный — божественная защита", value: 5, color: "#ffd54f" },
                { text: "Белый — чистота, сквозь которую не проходит зло", value: 4, color: "#f5f5f5" },
                { text: "Зелёный — природный щит", value: 2, color: "#4caf50" },
                { text: "Цвет не защищает, защищает намерение", value: 2, color: "#9e9e9e" }
            ]
        },
        {
            text: "Если бы ваша душа имела цвет, каким бы он был? (Интуитивно, первое, что приходит)",
            options: [
                { text: "Золотой, сияющий белый — чистый Свет", value: 5, color: "#ffd54f" },
                { text: "Глубокий синий, индиго, фиолетовый — мудрость и духовность", value: 4, color: "#3f51b5" },
                { text: "Изумрудно-зелёный — гармония, природа, любовь", value: 3, color: "#4caf50" },
                { text: "Тёплый оранжевый, жёлтый — радость, творчество, энергия", value: 2, color: "#ff9800" },
                { text: "Красный, алый — страсть, сила, воля", value: 1, color: "#f44336" },
                { text: "Серый, туманный — неопределённость, поиск", value: 0, color: "#9e9e9e" },
                { text: "Чёрный, тёмный — глубина, тайна, скрытая сила", value: -1, color: "#212121" }
            ]
        }
    ];

    const totalQuestions = questions.length;
    let currentIndex = 0;
    let answers = new Array(totalQuestions).fill(null);

    const questionContainer = document.getElementById('questionContainer');
    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');
    const exitBtn = document.getElementById('exitBtn');
    const progressFill = document.getElementById('progressFill');
    const progressText = document.getElementById('progressText');
    const testContainer = document.getElementById('testContainer');
    const mainBody = document.getElementById('mainBody');
    const testTitle = document.getElementById('testTitle');
    let isResultMode = false;

    function renderQuestion(index) {
        const q = questions[index];
        let html = `<div class="question-box"><div class="question-text">${index + 1}. ${q.text}</div><div class="options">`;
        q.options.forEach((opt) => {
            const isSelected = answers[index] === opt.value;
            html += `<div class="option ${isSelected ? 'selected' : ''}" data-value="${opt.value}"><div class="option-marker"></div><div class="option-text">${opt.text}</div></div>`;
        });
        html += `</div></div>`;
        questionContainer.innerHTML = html;
        document.querySelectorAll('.option').forEach(opt => {
            opt.addEventListener('click', () => {
                const value = parseInt(opt.dataset.value);
                answers[index] = value;
                renderQuestion(index);
            });
        });
        const progress = ((index + 1) / totalQuestions) * 100;
        progressFill.style.width = progress + '%';
        progressText.textContent = `Вопрос ${index + 1} из ${totalQuestions}`;
        prevBtn.disabled = index === 0;
        nextBtn.textContent = index === totalQuestions - 1 ? '🎉 Завершить' : 'Далее →';
    }

    function calculateResult() {
        const sum = answers.reduce((acc, val) => acc + val, 0);
        return Math.max(-7, Math.min(21, sum));
    }

    function getResultInfo(score) {
        if (score >= 18) return { color: "#ffd54f", name: "Золотой / Белый", desc: "Вы — СВЕТ. Ваша душа сияет чистым, золотым светом. Вы близки к состоянию просветления или святости. Ваше присутствие исцеляет.", advice: "🌟 Совет: Берегите свой Свет. Не расплескивайте его на токсичных людей. Медитируйте, благословляйте, светите.", rank: "+7…+10" };
        if (score >= 14) return { color: "#9c27b0", name: "Фиолетовый / Индиго", desc: "Вы — ДУХОВНЫЙ ИСКАТЕЛЬ. Ваша душа вибрирует на высоких частотах. Интуиция, творчество, связь с тонким миром — ваши сильные стороны.", advice: "🔮 Совет: Развивайте свою интуицию. Практикуйте осознанные сны. Носите аметист.", rank: "+5…+7" };
        if (score >= 10) return { color: "#4caf50", name: "Зелёный", desc: "Вы — ГАРМОНИЯ. Ваша душа — целитель. Вы любите природу, спокойствие, рост. Рядом с вами люди расслабляются и восстанавливаются.", advice: "🌿 Совет: Проводите больше времени на природе. Заведите растения. Учитесь говорить «нет», чтобы не истощаться.", rank: "+3…+5" };
        if (score >= 6) return { color: "#2196f3", name: "Синий / Голубой", desc: "Вы — МУДРОСТЬ И ПОКОЙ. Ваша душа спокойна и глубока, как океан. Вы хороший слушатель, аналитик, дипломат.", advice: "💧 Совет: Делитесь своим спокойствием с другими. Но не уходите в «холодность». Иногда нужен и огонь.", rank: "+1…+3" };
        if (score >= 2) return { color: "#ff9800", name: "Оранжевый / Жёлтый", desc: "Вы — ЭНЕРГИЯ И РАДОСТЬ. Ваша душа — сгусток творческой, солнечной энергии. Вы заражаете оптимизмом, но можете «перегорать».", advice: "☀️ Совет: Направляйте энергию в творчество. Не распыляйтесь на сто дел сразу. Заземляйтесь через спорт.", rank: "0…+2" };
        if (score >= -2) return { color: "#795548", name: "Коричневый / Нейтральный", desc: "Вы — ЗЕМЛЯ. Ваша душа практична, стабильна, «заземлена». Вы цените комфорт, традиции, материальный мир. Вам не хватает «воздуха» и «огня».", advice: "🪴 Совет: Добавьте в жизнь ярких красок. Попробуйте новое хобби. Слушайте музыку, которая «поднимает» вас.", rank: "-1…+1" };
        if (score >= -5) return { color: "#9e9e9e", name: "Серый", desc: "Вы — ТУМАН. Ваша душа в состоянии неопределённости, поиска или усталости. Вы потеряли свои краски, но это временно.", advice: "🌫️ Совет: Устройте «цветовой детокс». Окружите себя яркими, чистыми цветами. Зажгите свечу. Наденьте что-то красное или жёлтое.", rank: "-3…-1" };
        return { color: "#212121", name: "Чёрный", desc: "Вы — ТЬМА ИЛИ ЗАЩИТА. Ваша душа либо защищается от мира, либо переживает тёмный период. Чёрный — это не всегда плохо, это может быть глубина и защита.", advice: "🖤 Совет: Если чёрный — ваша защита, это нормально. Но попробуйте добавить немного белого или золотого. Свеча во тьме.", rank: "-7…-3" };
    }

    function showResult() {
        isResultMode = true;
        const score = calculateResult();
        const info = getResultInfo(score);

        mainBody.style.background = `linear-gradient(145deg, ${info.color}20 0%, #16213e 100%)`;
        testContainer.style.borderColor = info.color;

        let html = `<div class="result-container">`;
        html += `<h2 style="color: ${info.color};">Ваш результат</h2>`;
        html += `<div class="result-color-box" style="background: ${info.color}; color: ${info.color};"> </div>`;
        html += `<div class="result-score" style="color: ${info.color};">Цвет души: ${info.name}</div>`;
        html += `<div>Ранг по Семантическому Спектру: <strong>${info.rank}</strong></div>`;
        html += `<div class="result-comment" style="color: #d0c8b8;">${info.desc}</div>`;
        html += `<div class="result-advice" style="color: #d0c8b8;">${info.advice}</div>`;
        html += `<p style="margin-top: 1.5rem; color: #a09080; font-style: italic;">Цвета — это частоты вашего семантического поля. Их можно менять осознанно.</p>`;
        html += `</div>`;

        questionContainer.innerHTML = html;
        prevBtn.classList.add('hidden');
        nextBtn.classList.add('hidden');
        exitBtn.textContent = '🔄 Пройти заново';
        exitBtn.classList.remove('btn-secondary');
        exitBtn.classList.add('btn');
        testTitle.textContent = `Ваш цвет: ${info.name}`;
        progressText.textContent = `Тест завершён`;
        
        setTimeout(function() {
    const passportBtn = document.createElement('button');
    passportBtn.textContent = '💾 Сохранить результат в Семантический Паспорт';
    passportBtn.style.cssText = 'display: block; margin: 2rem auto; padding: 1rem 2rem; background: #e57373; color: white; border: none; border-radius: 40px; font-size: 1rem; cursor: pointer; font-weight: bold; transition: 0.3s;';
    passportBtn.onmouseover = () => passportBtn.style.background = '#f44336';
    passportBtn.onmouseout = () => passportBtn.style.background = '#e57373';

    passportBtn.addEventListener('click', function() {
        const scoreElement = document.querySelector('.result-score');
        if (scoreElement) {
            const resultValue = scoreElement.textContent.trim();
            if (resultValue) {
                localStorage.setItem('ideatonika_test_color', resultValue);
                passportBtn.textContent = '✅ Сохранено в Паспорт!';
                passportBtn.style.background = '#b71c1c';
                passportBtn.disabled = true;
            }
        }
    });

    const container = document.querySelector('.result-container') || document.getElementById('questionContainer');
    if (container) {
        container.appendChild(passportBtn);
    }
}, 100);

// ========== КНОПКА "ПОДЕЛИТЬСЯ РЕЗУЛЬТАТОМ" ==========
setTimeout(function() {
    const shareContainer = document.createElement('div');
    shareContainer.style.cssText = 'text-align: center; margin-top: 1.5rem;';

    const shareBtn = document.createElement('button');
    shareBtn.textContent = '📤 Поделиться результатом';
    shareBtn.style.cssText = 'display: block; margin: 0 auto 0.8rem auto; padding: 0.8rem 2rem; background: transparent; color: #81c784; border: 1.5px solid #81c784; border-radius: 40px; font-size: 1rem; cursor: pointer; font-weight: bold; transition: 0.3s; font-family: Georgia, serif;';
    shareBtn.onmouseover = () => shareBtn.style.background = '#81c784';
    shareBtn.onmouseout = () => shareBtn.style.background = 'transparent';
    shareBtn.onmouseover = () => shareBtn.style.color = '#1a1a2e';
    shareBtn.onmouseout = () => shareBtn.style.color = '#81c784';

    shareBtn.addEventListener('click', function() {
        // Получаем название теста из заголовка страницы
        const testName = document.title.replace(' • Идеатоника', '').trim();
        
        // Получаем результат из элемента .result-score
        const scoreElement = document.querySelector('.result-score');
        let resultText = '';
        if (scoreElement) {
            resultText = scoreElement.textContent.trim();
        }
        
        // Получаем комментарий из элемента .result-comment или .result-interpretation
        const commentElement = document.querySelector('.result-comment') || document.querySelector('.result-interpretation');
        let commentText = '';
        if (commentElement) {
            commentText = commentElement.textContent.trim();
        }
        
        // Формируем текст для отправки
        const shareText = `🧪 Я прошёл тест «${testName}» на портале Идеатоника!\n\n` +
            `📊 Мой результат: ${resultText}\n` +
            `💬 ${commentText}\n\n` +
            `🎯 А какой результат у тебя?\n` +
            `👉 Пройти тест: ${window.location.href}\n\n` +
            `🌌 Идеатоника — физика смысла.`;
        
        // Пытаемся использовать Web Share API (мобильные устройства)
        if (navigator.share) {
            navigator.share({
                title: `Мой результат теста «${testName}»`,
                text: shareText,
                url: window.location.href
            }).catch(() => {
                // Если не получилось — копируем в буфер
                copyToClipboard(shareText);
            });
        } else {
            // Если Web Share API не поддерживается — копируем в буфер
            copyToClipboard(shareText);
        }
    });

    function copyToClipboard(text) {
        if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(text).then(() => {
                const originalText = shareBtn.textContent;
                shareBtn.textContent = '✅ Скопировано! Отправь другу';
                shareBtn.style.borderColor = '#ffd54f';
                shareBtn.style.color = '#ffd54f';
                setTimeout(() => {
                    shareBtn.textContent = originalText;
                    shareBtn.style.borderColor = '#81c784';
                    shareBtn.style.color = '#81c784';
                }, 2500);
            }).catch(() => {
                fallbackCopy(text);
            });
        } else {
            fallbackCopy(text);
        }
    }

    function fallbackCopy(text) {
        const textarea = document.createElement('textarea');
        textarea.value = text;
        textarea.style.position = 'fixed';
        textarea.style.left = '-9999px';
        document.body.appendChild(textarea);
        textarea.select();
        try {
            document.execCommand('copy');
            const originalText = shareBtn.textContent;
            shareBtn.textContent = '✅ Скопировано! Отправь другу';
            shareBtn.style.borderColor = '#ffd54f';
            shareBtn.style.color = '#ffd54f';
            setTimeout(() => {
                shareBtn.textContent = originalText;
                shareBtn.style.borderColor = '#81c784';
                shareBtn.style.color = '#81c784';
            }, 2500);
        } catch(e) {
            shareBtn.textContent = '❌ Не удалось скопировать';
            shareBtn.style.borderColor = '#ef5350';
            shareBtn.style.color = '#ef5350';
        }
        document.body.removeChild(textarea);
    }

    // Добавляем подсказку
    const hint = document.createElement('div');
    hint.style.cssText = 'color: #a09080; font-size: 0.8rem; font-style: italic;';
    hint.textContent = 'Нажмите, чтобы скопировать результат и отправить другу';
    shareContainer.appendChild(shareBtn);
    shareContainer.appendChild(hint);

    // Ищем контейнер с результатом
    const container = document.querySelector('.result-container') || document.getElementById('questionContainer');
    if (container) {
        container.appendChild(shareContainer);
    }
}, 100);

    }

    function resetTest() {
        isResultMode = false; currentIndex = 0; answers = new Array(totalQuestions).fill(null);
        mainBody.style.background = ''; testContainer.style.borderColor = ''; testTitle.textContent = 'Спектр вашей души';
        prevBtn.classList.remove('hidden'); nextBtn.classList.remove('hidden');
        exitBtn.textContent = '🚪 Выйти'; exitBtn.classList.add('btn-secondary');
        renderQuestion(0);
    }

    prevBtn.addEventListener('click', () => { if (currentIndex > 0) { currentIndex--; renderQuestion(currentIndex); } });
    nextBtn.addEventListener('click', () => {
        if (answers[currentIndex] === null) { alert('Пожалуйста, выберите один из вариантов ответа.'); return; }
        if (currentIndex < totalQuestions - 1) { currentIndex++; renderQuestion(currentIndex); }
        else { if (answers.includes(null)) { alert('Пожалуйста, ответьте на все вопросы.'); return; } showResult(); }
    });
    exitBtn.addEventListener('click', () => {
        if (isResultMode) { resetTest(); }
        else { if (confirm('Вы уверены, что хотите выйти? Прогресс будет потерян.')) { window.location.href = 'diagnostics-hub.html'; } }
    });
    renderQuestion(0);
})();
</script>
</body>
</html>
