<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Дифракция Qₛ • Идеатоника</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: linear-gradient(145deg, #0d1117 0%, #161b22 100%);
            min-height: 100vh;
            font-family: 'Georgia', 'Times New Roman', serif;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            padding: 1rem; overflow-x: hidden;
        }
        .stars-bg { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 0; }
        .star { position: absolute; background: white; border-radius: 50%; animation: twinkle var(--duration) ease-in-out infinite; animation-delay: var(--delay); opacity: 0; }
        @keyframes twinkle { 0%,100% { opacity:0.2; transform:scale(1); } 50% { opacity:1; transform:scale(1.8); } }
        .main-container {
            position: relative; z-index: 1; width: 100%; max-width: 1100px;
            background: rgba(22,27,34,0.85); backdrop-filter: blur(12px);
            border: 1px solid rgba(227,184,124,0.3); border-radius: 32px;
            padding: 2rem; box-shadow: 0 20px 40px rgba(0,0,0,0.6);
        }
        .header { text-align: center; margin-bottom: 1.5rem; }
        .header h1 { font-size: 2.5rem; font-weight: 400; letter-spacing: 3px; color: #f3e7c0; text-shadow: 0 0 20px rgba(255,215,80,0.4); margin-bottom: 0.3rem; }
        .header .subtitle { font-size: 1rem; color: #c0b090; font-style: italic; border-bottom: 1px solid #5d4a3a; display: inline-block; padding-bottom: 0.4rem; }
        .canvas-wrapper { position: relative; width: 100%; background: radial-gradient(ellipse at center, #1a2030 0%, #0a0e14 100%); border-radius: 20px; border: 1px solid #5d4a3a; overflow: hidden; margin-bottom: 1.5rem; box-shadow: inset 0 0 80px rgba(0,0,0,0.5); }
        canvas { display: block; width: 100%; height: auto; }
        .controls-panel { background: rgba(0,0,0,0.3); border: 1px solid #5d4a3a; border-radius: 20px; padding: 1.5rem 2rem; }
        .controls-title { font-size: 1.2rem; color: #ffd54f; margin-bottom: 1.2rem; text-align: center; letter-spacing: 1px; }
        .slider-group { margin-bottom: 1.2rem; }
        .slider-group label { display: flex; justify-content: space-between; align-items: center; color: #d0c8b8; font-size: 0.95rem; margin-bottom: 0.4rem; }
        .slider-group label .param-value { color: #ffd54f; font-weight: bold; font-size: 1.1rem; min-width: 50px; text-align: right; }
        .slider-group input[type="range"] { width: 100%; -webkit-appearance: none; height: 8px; background: linear-gradient(90deg, #3a2a4a, #5d4a3a, #3a2a4a); border-radius: 4px; outline: none; cursor: pointer; }
        .slider-group input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; width: 24px; height: 24px; background: radial-gradient(circle at 40% 40%, #ffe082, #ff8f00); border-radius: 50%; cursor: pointer; box-shadow: 0 0 15px rgba(255,215,80,0.6); border: 2px solid #ffd54f; }
        .range-labels { display: flex; justify-content: space-between; color: #706858; font-size: 0.75rem; margin-top: 0.2rem; }
        .info-box { margin-top: 1.5rem; padding: 1rem 1.5rem; background: rgba(255,215,80,0.05); border: 1px solid rgba(255,215,80,0.2); border-radius: 12px; text-align: center; color: #c0b090; font-size: 0.9rem; font-style: italic; }
        .info-box .formula-display { font-family: 'Courier New', monospace; color: #ffd54f; font-size: 1rem; margin: 0.3rem 0; }
        .back-row { text-align: center; margin-top: 1.5rem; }
        .back-link { display: inline-block; color: #ffd54f; text-decoration: none; border: 1px solid #ffd54f; padding: 0.6rem 1.5rem; border-radius: 30px; transition: 0.3s; font-size: 0.9rem; }
        .back-link:hover { background: #ffd54f; color: #0d1117; }
        @media (max-width: 700px) { .main-container { padding: 1rem; } .header h1 { font-size: 1.8rem; } .controls-panel { padding: 1rem; } }
    </style>
</head>
<body>
<div class="stars-bg" id="starsBg"></div>
<div class="main-container">
    <div class="header">
        <h1>🌊 Дифракция Qₛ</h1>
        <div class="subtitle">Визуализация §91: волны огибают края и проникают в «тень»</div>
    </div>
    <div class="canvas-wrapper" id="canvasWrapper">
        <canvas id="diffractionCanvas"></canvas>
    </div>
    <div class="controls-panel">
        <div class="controls-title">🎛️ Параметры</div>
        <div class="slider-group">
            <label><span>🌊 Длина волны λ_sense</span><span class="param-value" id="lambdaValue">40 px</span></label>
            <input type="range" id="lambdaSlider" min="10" max="120" value="40" step="1">
            <div class="range-labels"><span>10 (короткая)</span><span>40</span><span>120 (длинная)</span></div>
        </div>
        <div class="slider-group">
            <label><span>🚪 Ширина зазора D</span><span class="param-value" id="gapValue">60 px</span></label>
            <input type="range" id="gapSlider" min="15" max="180" value="60" step="1">
            <div class="range-labels"><span>15 (узкая щель)</span><span>60</span><span>180 (широкий проём)</span></div>
        </div>
        <div class="slider-group">
            <label><span>☀️ Семантический заряд Qₛ</span><span class="param-value" id="qsValue">+5</span></label>
            <input type="range" id="qsSlider" min="-10" max="10" value="5" step="1">
            <div class="range-labels"><span>-10 (Тьма)</span><span>0</span><span>+10 (Свет)</span></div>
        </div>
        <div class="info-box">
            <span id="statusText" style="color:#ffd54f;font-weight:bold;">🌊 Умеренная дифракция</span>
            <div class="formula-display" id="formulaDisplay"></div>
        </div>
    </div>
    <div class="back-row">
        <a href="visualizations.html" class="back-link">← К списку визуализаций</a>
    </div>
</div>

<script>
(function(){
    const starsBg=document.getElementById('starsBg');
    for(let i=0;i<100;i++){
        const d=document.createElement('div');d.className='star';
        d.style.left=Math.random()*100+'%';d.style.top=Math.random()*100+'%';
        const s=Math.random()*2.5+0.5;d.style.width=s+'px';d.style.height=s+'px';
        d.style.setProperty('--duration',(Math.random()*4+2)+'s');
        d.style.setProperty('--delay',(Math.random()*5)+'s');
        starsBg.appendChild(d);
    }
})();

const canvas=document.getElementById('diffractionCanvas');
const ctx=canvas.getContext('2d');
const wrapper=document.getElementById('canvasWrapper');
let time=0,animId;

function resize(){
    const r=wrapper.getBoundingClientRect();
    canvas.width=r.width;
    canvas.height=Math.max(500,Math.min(650,r.width*0.7));
    wrapper.style.height=canvas.height+'px';
}
resize();window.addEventListener('resize',resize);

const lambdaSlider=document.getElementById('lambdaSlider');
const gapSlider=document.getElementById('gapSlider');
const qsSlider=document.getElementById('qsSlider');
const lambdaValue=document.getElementById('lambdaValue');
const gapValue=document.getElementById('gapValue');
const qsValue=document.getElementById('qsValue');
const statusText=document.getElementById('statusText');
const formulaDisplay=document.getElementById('formulaDisplay');

lambdaSlider.oninput=function(){lambdaValue.textContent=this.value+' px';updateInfo();};
gapSlider.oninput=function(){gapValue.textContent=this.value+' px';updateInfo();};
qsSlider.oninput=function(){qsValue.textContent=(parseInt(this.value)>=0?'+':'')+parseInt(this.value);};

function updateInfo(){
    const lambda=parseFloat(lambdaSlider.value);
    const gap=parseFloat(gapSlider.value);
    const ratio=lambda/gap;
    if(ratio>2) statusText.textContent='🌊 Сильная дифракция — волны затекают в глубокую тень';
    else if(ratio>1) statusText.textContent='🌊 Заметная дифракция — волны огибают препятствие';
    else if(ratio>0.5) statusText.textContent='🌊 Умеренная дифракция';
    else if(ratio>0.25) statusText.textContent='📐 Слабая дифракция — почти геометрическая тень';
    else statusText.textContent='📐 Очень слабая дифракция — резкая тень';
    formulaDisplay.textContent='θ≈λ/D='+lambda.toFixed(0)+'/'+gap.toFixed(0)+'='+ratio.toFixed(2)+' | §91';
}
updateInfo();

function getQSColor(qs,alpha){
    const absQ=Math.abs(qs);
    const norm=absQ/10;
    if(absQ<0.5){const gray=Math.floor(100*norm+30);return `rgba(${gray},${gray},${gray},${alpha*0.4})`;}
    if(qs>=0){const r=Math.floor(30+norm*225);const g=Math.floor(5+norm*235);const b=Math.floor(80*(1-norm)+255*norm);return `rgba(${r},${g},${b},${alpha})`;}
    else{const r=Math.floor(80*(1-norm)+30*norm);const g=Math.floor(40*(1-norm)+5*norm);const b=Math.floor(30+norm*200);return `rgba(${r},${g},${b},${alpha})`;}
}

function drawFrame(){
    const lambda=parseFloat(lambdaSlider.value);
    const gap=parseFloat(gapSlider.value);
    const qs=parseInt(qsSlider.value);
    const w=canvas.width,h=canvas.height;
    time+=0.016;
    
    ctx.fillStyle='#060a10';
    ctx.fillRect(0,0,w,h);
    
    const wallX=w*0.35;
    const gapCenterY=h/2;
    const gapHalf=gap/2;
    
    // === СТЕНА ===
    ctx.fillStyle='rgba(50,40,35,0.9)';
    ctx.strokeStyle='rgba(255,255,255,0.5)';
    ctx.lineWidth=3;
    // Верхняя часть
    ctx.fillRect(wallX-6,0,12,gapCenterY-gapHalf);
    ctx.strokeRect(wallX-6,0,12,gapCenterY-gapHalf);
    // Нижняя часть
    ctx.fillRect(wallX-6,gapCenterY+gapHalf,12,h-(gapCenterY+gapHalf));
    ctx.strokeRect(wallX-6,gapCenterY+gapHalf,12,h-(gapCenterY+gapHalf));
    
    // === ПАДАЮЩИЕ ВОЛНЫ (слева) ===
    const numLines=Math.floor(h/8);
    for(let i=0;i<numLines;i++){
        const y=(i+0.5)*h/numLines;
        const phase=time*2+y*0.02;
        const amplitude=lambda*0.4;
        const dy=Math.sin(phase)*amplitude;
        const alpha=0.5;
        
        ctx.strokeStyle=getQSColor(qs,alpha);
        ctx.lineWidth=1.5;
        ctx.beginPath();
        ctx.moveTo(0,y+dy);
        // Линия идёт до стены
        for(let x=0;x<=wallX-6;x+=4){
            const ly=y+Math.sin(phase+x*0.02)*amplitude;
            ctx.lineTo(x,ly);
        }
        ctx.stroke();
    }
    
    // === ОТРАЖЁННЫЕ ВОЛНЫ (слева от стены) ===
    for(let i=0;i<numLines;i++){
        const y=(i+0.5)*h/numLines;
        const inGap=Math.abs(y-gapCenterY)<gapHalf;
        if(inGap) continue;
        
        const phase=time*2+y*0.02;
        const amplitude=lambda*0.25;
        const alpha=0.25;
        
        ctx.strokeStyle=getQSColor(qs,alpha);
        ctx.lineWidth=1;
        ctx.beginPath();
        ctx.moveTo(wallX-6,y);
        for(let x=wallX-6;x>=0;x-=4){
            const distFromWall=wallX-6-x;
            const ly=y+Math.sin(phase-distFromWall*0.02)*amplitude*Math.exp(-distFromWall/100);
            ctx.lineTo(x,ly);
        }
        ctx.stroke();
    }
    
    // === ДИФРАГИРОВАННЫЕ ВОЛНЫ (за стеной) ===
    // Принцип Гюйгенса: каждая точка зазора — источник круговых волн
    const numSources=Math.floor(gap/6);
    for(let s=0;s<numSources;s++){
        const sy=gapCenterY-gapHalf+(s+0.5)*gap/numSources;
        const rings=8;
        for(let r=0;r<rings;r++){
            const radius=(r+1)*lambda*0.7;
            const alpha=0.35*(1-r/rings)*Math.exp(-radius/(lambda*3));
            if(alpha<0.02) continue;
            
            ctx.strokeStyle=getQSColor(qs,alpha);
            ctx.lineWidth=1;
            ctx.beginPath();
            // Рисуем только правую половину окружности (волна идёт вперёд)
            for(let a=-Math.PI/2;a<=Math.PI/2;a+=0.1){
                const x=wallX+Math.cos(a)*radius;
                const y=sy+Math.sin(a)*radius;
                if(x>wallX&&x<w&&y>0&&y<h){
                    if(a===-Math.PI/2) ctx.moveTo(x,y);
                    else ctx.lineTo(x,y);
                }
            }
            ctx.stroke();
        }
    }
    
    // === ЧАСТИЦЫ В «ТЕНИ» ===
    const numParticles=200;
    for(let i=0;i<numParticles;i++){
        const seed=i*123.456;
        const px=wallX+10+((seed*76.543)%(w-wallX-20));
        const py=(seed*98.765)%h;
        const inGapZone=Math.abs(py-gapCenterY)<gapHalf+lambda;
        const distFromGap=Math.max(0,Math.abs(py-gapCenterY)-gapHalf);
        const distFromWall=px-wallX;
        
        let alpha=0;
        if(inGapZone||distFromGap<lambda*3){
            alpha=0.4*Math.exp(-distFromGap/(lambda*2))*Math.exp(-distFromWall/(lambda*4));
        }
        
        if(alpha>0.015){
            const twinkle=Math.sin(px*0.05+time*4+py*0.03)*0.5+0.5;
            alpha*=0.5+0.5*twinkle;
            ctx.fillStyle=getQSColor(qs,alpha);
            ctx.beginPath();ctx.arc(px,py,1.5,0,Math.PI*2);ctx.fill();
        }
    }
    
    // === ПОДПИСИ ===
    ctx.fillStyle='rgba(255,255,255,0.5)';
    ctx.font='14px Georgia,serif';
    ctx.textAlign='center';
    ctx.fillText('~~~~~~~',60,30);
    ctx.fillText('Падающие волны',60,55);
    ctx.fillText('← Отражённые',wallX-50,30);
    ctx.fillText('«ТЕНЬ»',wallX+(w-wallX)*0.65,h*0.2);
    ctx.fillText('(геометрическая тень)',wallX+(w-wallX)*0.65,h*0.2+22);
    ctx.fillText('Дифракция →',wallX+(w-wallX)*0.65,h*0.2+44);
    
    ctx.fillStyle='rgba(255,255,255,0.4)';
    ctx.font='12px Georgia,serif';
    ctx.textAlign='left';
    ctx.fillText('λ='+lambda.toFixed(0)+' px',10,h-50);
    ctx.fillText('D='+gap.toFixed(0)+' px',10,h-30);
    ctx.fillText('λ/D='+(lambda/gap).toFixed(2),10,h-10);
    
    animId=requestAnimationFrame(drawFrame);
}

drawFrame();
window.addEventListener('beforeunload',()=>{if(animId)cancelAnimationFrame(animId);});
</script>

</body>
</html>
