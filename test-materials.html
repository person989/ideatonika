<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Тест: Из чего вы сделаны? • Идеатоника</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: linear-gradient(145deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            font-family: 'Georgia', 'Times New Roman', serif;
            padding: 2rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            transition: background 0.5s ease;
        }
        .cosmic-bg {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle at 30% 40%, rgba(255,215,150,0.08) 0%, transparent 50%),
                        radial-gradient(circle at 80% 70%, rgba(100,150,255,0.05) 0%, transparent 60%);
            pointer-events: none; z-index: 0;
        }
        .test-container {
            max-width: 700px;
            width: 100%;
            position: relative;
            z-index: 1;
            background: rgba(30, 40, 60, 0.85);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(227, 184, 124, 0.4);
            border-radius: 32px;
            padding: 2.5rem;
            box-shadow: 0 20px 40px rgba(0,0,0,0.5);
            transition: border-color 0.3s ease;
        }
        .test-header {
            text-align: center;
            margin-bottom: 2rem;
        }
        .test-header h1 {
            font-size: 2.2rem;
            color: #f3e7c0;
            margin-bottom: 0.5rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        .progress-bar {
            width: 100%;
            height: 6px;
            background: rgba(0,0,0,0.3);
            border-radius: 3px;
            margin: 1.5rem 0;
        }
        .progress-fill {
            height: 100%;
            background: #a1887f;
            border-radius: 3px;
            width: 0%;
            transition: width 0.3s ease;
        }
        .progress-text {
            text-align: right;
            color: #a09080;
            font-size: 0.8rem;
            margin-top: 0.3rem;
        }
        .question-box {
            margin-bottom: 2rem;
        }
        .question-text {
            color: #f3e7c0;
            font-size: 1.3rem;
            margin-bottom: 1.5rem;
            line-height: 1.5;
        }
        .options {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .option {
            background: rgba(0,0,0,0.2);
            border: 1px solid #5d4a3a;
            border-radius: 16px;
            padding: 1rem 1.5rem;
            cursor: pointer;
            transition: all 0.2s ease;
            color: #d0c8b8;
            display: flex;
            align-items: center;
            gap: 15px;
        }
        .option:hover {
            background: rgba(161, 136, 127, 0.15);
            border-color: #a1887f;
        }
        .option.selected {
            background: rgba(161, 136, 127, 0.25);
            border-color: #a1887f;
            color: #f3e7c0;
        }
        .option-marker {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            border: 2px solid #5d4a3a;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }
        .option.selected .option-marker {
            border-color: #a1887f;
            background: #a1887f;
            box-shadow: 0 0 10px #a1887f;
        }
        .option.selected .option-marker::after {
            content: "✓";
            color: #1a1a2e;
            font-weight: bold;
        }
        .option-text {
            flex: 1;
        }
        .nav-buttons {
            display: flex;
            justify-content: space-between;
            margin-top: 2rem;
            gap: 15px;
        }
        .btn {
            background: transparent;
            border: 1.5px solid #a1887f;
            color: #a1887f;
            padding: 0.8rem 1.8rem;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 40px;
            cursor: pointer;
            transition: 0.2s;
            font-family: inherit;
        }
        .btn:hover {
            background: #a1887f;
            color: #1a1a2e;
        }
        .btn:disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }
        .btn-secondary {
            border-color: #5d4a3a;
            color: #a09080;
        }
        .btn-secondary:hover {
            background: #5d4a3a;
            color: #d0c8b8;
        }
        .result-container {
            text-align: center;
        }
        .result-score {
            font-size: 5rem;
            font-weight: bold;
            margin: 1rem 0;
        }
        .result-scale {
            font-size: 1.2rem;
            margin-bottom: 1.5rem;
        }
        .result-comment {
            background: rgba(0,0,0,0.2);
            border-radius: 20px;
            padding: 1.5rem;
            margin: 1.5rem 0;
            line-height: 1.6;
        }
        .result-advice {
            background: rgba(161, 136, 127, 0.1);
            border-left: 4px solid #a1887f;
            padding: 1.2rem 1.5rem;
            border-radius: 0 12px 12px 0;
            text-align: left;
        }
        .hidden {
            display: none !important;
        }
        .back-link {
            display: inline-block;
            margin-top: 1.5rem;
            color: #a1887f;
            text-decoration: none;
            font-size: 0.9rem;
        }
        .back-link:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body id="mainBody">
<div class="cosmic-bg"></div>
<div class="test-container" id="testContainer">
    
    <div class="test-header">
        <h1>
            <span>🧥</span>
            <span id="testTitle">Из чего вы сделаны?</span>
            <span>🪵</span>
        </h1>
        <div class="progress-bar">
            <div class="progress-fill" id="progressFill"></div>
        </div>
        <div class="progress-text" id="progressText">Вопрос 1 из 7</div>
    </div>
    
    <div id="questionContainer"></div>
    
    <div class="nav-buttons">
        <button class="btn btn-secondary" id="prevBtn" disabled>← Назад</button>
        <button class="btn btn-secondary" id="exitBtn">🚪 Выйти</button>
        <button class="btn" id="nextBtn">Далее →</button>
    </div>
    
    <div style="text-align: center;">
        <a href="diagnostics-hub.html" class="back-link">← Вернуться в Хаб Диагностики</a>
    </div>
</div>

<script>
    (function() {
        const questions = [
            {
                text: "Из какого материала сделана ваша любимая повседневная одежда?",
                options: [
                    { text: "Синтетика (полиэстер, акрил, нейлон) — дёшево, не мнётся", value: -3 },
                    { text: "Смесовые ткани (хлопок+синтетика) — компромисс", value: -1 },
                    { text: "Хлопок, вискоза — натурально, но обычно", value: 1 },
                    { text: "Лён, шерсть, шёлк, кашемир — премиум натуральные", value: 3 }
                ]
            },
            {
                text: "Из чего сделана ваша обувь?",
                options: [
                    { text: "Полностью синтетика (кожзам, резина, пластик)", value: -3 },
                    { text: "Смесь натурального и синтетики", value: -1 },
                    { text: "Натуральная кожа или замша, но промышленного производства", value: 1 },
                    { text: "Натуральная кожа ручной выделки, войлок, пробка", value: 3 }
                ]
            },
            {
                text: "Какие украшения / аксессуары вы носите чаще всего?",
                options: [
                    { text: "Пластиковые, из недрагоценных металлов, бижутерия", value: -2 },
                    { text: "Серебро, натуральные камни", value: 3 },
                    { text: "Золото, платина", value: 1 },
                    { text: "Деревянные, кожаные, костяные (этника)", value: 2 }
                ]
            },
            {
                text: "Из чего сделан ваш письменный / обеденный стол?",
                options: [
                    { text: "ДСП, МДФ, пластик, стекло на металлокаркасе", value: -2 },
                    { text: "Ламинированная фанера", value: 0 },
                    { text: "Массив дерева (дуб, сосна, бук)", value: 3 },
                    { text: "Натуральный камень (мрамор, гранит)", value: 2 }
                ]
            },
            {
                text: "Из какого материала ваша постель (простыни, наволочки, пододеяльник)?",
                options: [
                    { text: "Синтетика (полиэстер, микрофибра)", value: -3 },
                    { text: "Смесовые ткани (поликоттон)", value: -1 },
                    { text: "Хлопок, сатин, бязь", value: 1 },
                    { text: "Лён, шёлк, бамбук, органический хлопок", value: 3 }
                ]
            },
            {
                text: "Из чего сделана ваша любимая кружка / чашка?",
                options: [
                    { text: "Пластик", value: -3 },
                    { text: "Обычное стекло, фаянс", value: 0 },
                    { text: "Керамика ручной работы, толстое стекло", value: 2 },
                    { text: "Глина, дерево, фарфор, серебро", value: 3 }
                ]
            },
            {
                text: "Какие материалы преобладают в вашем домашнем интерьере в целом?",
                options: [
                    { text: "Пластик, бетон, ламинат, винил, много синтетики", value: -3 },
                    { text: "Смесь: что-то натуральное, что-то нет", value: 0 },
                    { text: "В основном дерево, камень, натуральные ткани", value: 3 },
                    { text: "Живые растения, дерево, камень, шерсть, минимум синтетики", value: 4 }
                ]
            }
        ];
        
        const totalQuestions = questions.length;
        let currentIndex = 0;
        let answers = new Array(totalQuestions).fill(null);
        
        const questionContainer = document.getElementById('questionContainer');
        const prevBtn = document.getElementById('prevBtn');
        const nextBtn = document.getElementById('nextBtn');
        const exitBtn = document.getElementById('exitBtn');
        const progressFill = document.getElementById('progressFill');
        const progressText = document.getElementById('progressText');
        const testContainer = document.getElementById('testContainer');
        const mainBody = document.getElementById('mainBody');
        const testTitle = document.getElementById('testTitle');
        
        let isResultMode = false;
        
        function renderQuestion(index) {
            const q = questions[index];
            let html = `<div class="question-box">`;
            html += `<div class="question-text">${index + 1}. ${q.text}</div>`;
            html += `<div class="options">`;
            
            q.options.forEach((opt) => {
                const isSelected = answers[index] === opt.value;
                html += `
                    <div class="option ${isSelected ? 'selected' : ''}" data-value="${opt.value}">
                        <div class="option-marker"></div>
                        <div class="option-text">${opt.text}</div>
                    </div>
                `;
            });
            
            html += `</div></div>`;
            questionContainer.innerHTML = html;
            
            document.querySelectorAll('.option').forEach(opt => {
                opt.addEventListener('click', () => {
                    const value = parseInt(opt.dataset.value);
                    answers[index] = value;
                    renderQuestion(index);
                });
            });
            
            const progress = ((index + 1) / totalQuestions) * 100;
            progressFill.style.width = progress + '%';
            progressText.textContent = `Вопрос ${index + 1} из ${totalQuestions}`;
            
            prevBtn.disabled = index === 0;
            if (index === totalQuestions - 1) {
                nextBtn.textContent = '🎉 Завершить';
            } else {
                nextBtn.textContent = 'Далее →';
            }
        }
        
        function calculateResult() {
            const sum = answers.reduce((acc, val) => acc + val, 0);
            // Максимум около 21, минимум около -17
            // Приводим к шкале от -10 до +10
            const normalized = Math.round(sum / 2);
            return Math.max(-10, Math.min(10, normalized));
        }
        
        function getResultColor(rank) {
            if (rank >= 7) return '#ffd54f';
            if (rank >= 4) return '#81c784';
            if (rank >= 1) return '#90caf9';
            if (rank >= 0) return '#b0bec5';
            if (rank >= -3) return '#a1887f';
            if (rank >= -6) return '#78909c';
            return '#455a64';
        }
        
        function getResultComment(rank) {
            if (rank >= 7) return "🌟 Вы — ЭТАЛОН. Ваше окружение состоит из материалов высшего ранга. Вы интуитивно выбираете лучшее для своего поля. Ваш дом — Храм.";
            if (rank >= 4) return "🌿 Вы — НАТУРАЛ. В вашей жизни много природных, «живых» материалов. Ваше поле получает хорошую поддержку. Продолжайте в том же духе!";
            if (rank >= 1) return "⚖️ Вы — СМЕШАННЫЙ ТИП. У вас есть и натуральное, и синтетика. Ваше поле чувствует себя средне. Замените хотя бы постель и одежду на натуральные.";
            if (rank >= -3) return "🏢 Вы — СИНТЕТИК. Пластик и синтетика преобладают. Ваше поле «не дышит». Начните с малого: купите деревянную расчёску, льняную футболку, керамическую кружку.";
            if (rank >= -6) return "🏭 Вы — ПЛАСТИК. Вы живёте в мире искусственных материалов. Ваше поле истощено. Срочно требуется «материальный детокс». Начните с постельного белья из хлопка или льна.";
            return "💀 Вы — ТОКСИН. Ваше окружение из материалов с крайне низким Qₛ. Вы буквально спите и носите на себе яд. Это может быть причиной хронической усталости и депрессии.";
        }
        
        function getResultAdvice(rank) {
            if (rank >= 4) return "🌟 Совет: Продолжайте выбирать натуральное. Попробуйте деревянную посуду, льняные шторы, шерстяные ковры. Ваше поле скажет вам спасибо.";
            if (rank >= 1) return "🌱 Совет: Замените пластиковые контейнеры для еды на стеклянные. Купите хотя бы одну вещь из 100% льна. Спите на хлопковом белье.";
            if (rank >= -3) return "🧹 Совет: Проведите ревизию гардероба. Выбросите откровенную синтетику. Купите деревянную разделочную доску, керамическую кружку, металлическую ложку. Начните с мелочей.";
            if (rank >= -6) return "🆘 Совет: Это серьёзно. Замените постель на 100% хлопок или лён в первую очередь (вы спите 8 часов в этом!). Купите одежду из натуральных тканей. Переставьте пластиковый стол на деревянный.";
            return "🚨 Совет: Немедленно избавьтесь от пластика в спальне. Замените синтетическое бельё на хлопковое. Купите деревянную мебель. Ваше здоровье под угрозой.";
        }
        
        function showResult() {
            isResultMode = true;
            const rank = calculateResult();
            const color = getResultColor(rank);
            const comment = getResultComment(rank);
            const advice = getResultAdvice(rank);
            
            mainBody.style.background = `linear-gradient(145deg, ${color}20 0%, #16213e 100%)`;
            testContainer.style.borderColor = color;
            
            let html = `<div class="result-container">`;
            html += `<h2 style="color: ${color};">Ваш результат</h2>`;
            html += `<div class="result-score" style="color: ${color};">${rank > 0 ? '+' : ''}${rank}</div>`;
            html += `<div class="result-scale">по шкале Ранга Материалов (от -10 до +10)</div>`;
            html += `<div class="result-comment" style="color: #d0c8b8;">${comment}</div>`;
            html += `<div class="result-advice" style="color: #d0c8b8;">${advice}</div>`;
            html += `<p style="margin-top: 1.5rem; color: #a09080; font-style: italic;">См. Великую Таблицу Материалов для детального изучения свойств каждого материала.</p>`;
            html += `</div>`;
            
            questionContainer.innerHTML = html;
            
            prevBtn.classList.add('hidden');
            nextBtn.classList.add('hidden');
            exitBtn.textContent = '🔄 Пройти заново';
            exitBtn.classList.remove('btn-secondary');
            exitBtn.classList.add('btn');
            
            testTitle.textContent = `Результат: Ранг = ${rank > 0 ? '+' : ''}${rank}`;
            progressText.textContent = `Тест завершён`;
            
            setTimeout(function() {
    const passportBtn = document.createElement('button');
    passportBtn.textContent = '💾 Сохранить результат в Семантический Паспорт';
    passportBtn.style.cssText = 'display: block; margin: 2rem auto; padding: 1rem 2rem; background: #bcaaa4; color: #1a1a2e; border: none; border-radius: 40px; font-size: 1rem; cursor: pointer; font-weight: bold; transition: 0.3s;';
    passportBtn.onmouseover = () => passportBtn.style.background = '#a1887f';
    passportBtn.onmouseout = () => passportBtn.style.background = '#bcaaa4';

    passportBtn.addEventListener('click', function() {
        const scoreElement = document.querySelector('.result-score');
        if (scoreElement) {
            const resultText = scoreElement.textContent.trim();
            const resultValue = parseFloat(resultText);
            if (!isNaN(resultValue)) {
                localStorage.setItem('ideatonika_test_material', resultValue);
            } else {
                localStorage.setItem('ideatonika_test_material', resultText);
            }
            passportBtn.textContent = '✅ Сохранено в Паспорт!';
            passportBtn.style.background = '#5d4037';
            passportBtn.style.color = 'white';
            passportBtn.disabled = true;
        }
    });

    const container = document.querySelector('.result-container') || document.getElementById('questionContainer');
    if (container) {
        container.appendChild(passportBtn);
    }
}, 100);

// ========== КНОПКА "ПОДЕЛИТЬСЯ РЕЗУЛЬТАТОМ" ==========
setTimeout(function() {
    const shareContainer = document.createElement('div');
    shareContainer.style.cssText = 'text-align: center; margin-top: 1.5rem;';

    const shareBtn = document.createElement('button');
    shareBtn.textContent = '📤 Поделиться результатом';
    shareBtn.style.cssText = 'display: block; margin: 0 auto 0.8rem auto; padding: 0.8rem 2rem; background: transparent; color: #81c784; border: 1.5px solid #81c784; border-radius: 40px; font-size: 1rem; cursor: pointer; font-weight: bold; transition: 0.3s; font-family: Georgia, serif;';
    shareBtn.onmouseover = () => shareBtn.style.background = '#81c784';
    shareBtn.onmouseout = () => shareBtn.style.background = 'transparent';
    shareBtn.onmouseover = () => shareBtn.style.color = '#1a1a2e';
    shareBtn.onmouseout = () => shareBtn.style.color = '#81c784';

    shareBtn.addEventListener('click', function() {
        // Получаем название теста из заголовка страницы
        const testName = document.title.replace(' • Идеатоника', '').trim();
        
        // Получаем результат из элемента .result-score
        const scoreElement = document.querySelector('.result-score');
        let resultText = '';
        if (scoreElement) {
            resultText = scoreElement.textContent.trim();
        }
        
        // Получаем комментарий из элемента .result-comment или .result-interpretation
        const commentElement = document.querySelector('.result-comment') || document.querySelector('.result-interpretation');
        let commentText = '';
        if (commentElement) {
            commentText = commentElement.textContent.trim();
        }
        
        // Формируем текст для отправки
        const shareText = `🧪 Я прошёл тест «${testName}» на портале Идеатоника!\n\n` +
            `📊 Мой результат: ${resultText}\n` +
            `💬 ${commentText}\n\n` +
            `🎯 А какой результат у тебя?\n` +
            `👉 Пройти тест: ${window.location.href}\n\n` +
            `🌌 Идеатоника — физика смысла.`;
        
        // Пытаемся использовать Web Share API (мобильные устройства)
        if (navigator.share) {
            navigator.share({
                title: `Мой результат теста «${testName}»`,
                text: shareText,
                url: window.location.href
            }).catch(() => {
                // Если не получилось — копируем в буфер
                copyToClipboard(shareText);
            });
        } else {
            // Если Web Share API не поддерживается — копируем в буфер
            copyToClipboard(shareText);
        }
    });

    function copyToClipboard(text) {
        if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(text).then(() => {
                const originalText = shareBtn.textContent;
                shareBtn.textContent = '✅ Скопировано! Отправь другу';
                shareBtn.style.borderColor = '#ffd54f';
                shareBtn.style.color = '#ffd54f';
                setTimeout(() => {
                    shareBtn.textContent = originalText;
                    shareBtn.style.borderColor = '#81c784';
                    shareBtn.style.color = '#81c784';
                }, 2500);
            }).catch(() => {
                fallbackCopy(text);
            });
        } else {
            fallbackCopy(text);
        }
    }

    function fallbackCopy(text) {
        const textarea = document.createElement('textarea');
        textarea.value = text;
        textarea.style.position = 'fixed';
        textarea.style.left = '-9999px';
        document.body.appendChild(textarea);
        textarea.select();
        try {
            document.execCommand('copy');
            const originalText = shareBtn.textContent;
            shareBtn.textContent = '✅ Скопировано! Отправь другу';
            shareBtn.style.borderColor = '#ffd54f';
            shareBtn.style.color = '#ffd54f';
            setTimeout(() => {
                shareBtn.textContent = originalText;
                shareBtn.style.borderColor = '#81c784';
                shareBtn.style.color = '#81c784';
            }, 2500);
        } catch(e) {
            shareBtn.textContent = '❌ Не удалось скопировать';
            shareBtn.style.borderColor = '#ef5350';
            shareBtn.style.color = '#ef5350';
        }
        document.body.removeChild(textarea);
    }

    // Добавляем подсказку
    const hint = document.createElement('div');
    hint.style.cssText = 'color: #a09080; font-size: 0.8rem; font-style: italic;';
    hint.textContent = 'Нажмите, чтобы скопировать результат и отправить другу';
    shareContainer.appendChild(shareBtn);
    shareContainer.appendChild(hint);

    // Ищем контейнер с результатом
    const container = document.querySelector('.result-container') || document.getElementById('questionContainer');
    if (container) {
        container.appendChild(shareContainer);
    }
}, 100);

        }
        
        function resetTest() {
            isResultMode = false;
            currentIndex = 0;
            answers = new Array(totalQuestions).fill(null);
            
            mainBody.style.background = '';
            testContainer.style.borderColor = '';
            testTitle.textContent = 'Из чего вы сделаны?';
            
            prevBtn.classList.remove('hidden');
            nextBtn.classList.remove('hidden');
            exitBtn.textContent = '🚪 Выйти';
            exitBtn.classList.add('btn-secondary');
            
            renderQuestion(0);
        }
        
        prevBtn.addEventListener('click', () => {
            if (currentIndex > 0) {
                currentIndex--;
                renderQuestion(currentIndex);
            }
        });
        
        nextBtn.addEventListener('click', () => {
            if (answers[currentIndex] === null) {
                alert('Пожалуйста, выберите один из вариантов ответа.');
                return;
            }
            
            if (currentIndex < totalQuestions - 1) {
                currentIndex++;
                renderQuestion(currentIndex);
            } else {
                if (answers.includes(null)) {
                    alert('Пожалуйста, ответьте на все вопросы.');
                    return;
                }
                showResult();
            }
        });
        
        exitBtn.addEventListener('click', () => {
            if (isResultMode) {
                resetTest();
            } else {
                if (confirm('Вы уверены, что хотите выйти? Прогресс будет потерян.')) {
                    window.location.href = 'diagnostics-hub.html';
                }
            }
        });
        
        renderQuestion(0);
    })();
</script>
</body>
</html>
