    title: "🔗 Эксперимент №13. «SEC-3» — Квантовый триггер (запутанность)",
    content: `
        <div class="exp-box" style="border-left-color: #4b0082;">
            <p style="font-weight: bold; font-size: 1.2rem; text-align: center; margin-bottom: 1rem;">🌀 SEC-3: МГНОВЕННАЯ ПЕРЕДАЧА СМЫСЛА 🌀</p>
            <p><strong>Цель эксперимента:</strong> Доказать существование семантической запутанности (§104) и осуществить мгновенную (бездрейфовую) передачу семантического импульса на расстояние без использования классических волноводов.</p>
            
            <p><strong>Теоретическая база:</strong> §104 (Запутанность), §105 (Коллапс), §106 (Суперпозиция). Если два кристалла кварца «запутаны» на семантическом уровне (например, через совместную медитацию или ритуал), изменение состояния одного (коллапс) должно мгновенно вызывать коррелированное изменение в другом, независимо от расстояния.</p>
            
            <div class="sub">🔧 Необходимое оборудование</div>
            <ul>
                <li><strong>Два идентичных кристалла кварца</strong> (размер ~2-3 см, желательно из одной друзы, чтобы усилить связь).</li>
                <li><strong>Два независимых SEC-1</strong> (или просто два пьезоэлемента в экранированных коробках).</li>

                <li><strong>Средства связи</strong> (телефон, рация) для синхронизации времени, но не для передачи сигнала.</li>
            </ul>

            <div class="sub">📐 Схема установки SEC-3</div>
            <pre style="background: #e8e0d0; padding: 10px; border-radius: 8px; font-family: monospace; line-height: 1.2; overflow-x: auto;">

+----------+-----------+                            +----------+-----------+

|   ОСЦИЛЛОГРАФ А      |                            |   ОСЦИЛЛОГРАФ Б      |

            <p><em>Кристаллы А и Б предварительно «запутываются» через совместный ритуал: оба держатся в руках операторов во время синхронной медитации в течение 30 минут.</em></p>

            <div class="sub">📝 Протокол проведения</div>
            <ol>

                <li><strong>Корреляция:</strong> Если семантическая запутанность существует, в моменты коллапса Кристалла А, Кристалл Б будет выдавать статистически значимый импульс в том же временном окне (задержка < 1 секунды).</li>
                <li><strong>Ожидаемая корреляция:</strong> 30-50% (сигнал слабый, много шумов).</li>
            </ul>
            <div class="formula">Коэффициент корреляции r = (Совпадения — Случайные совпадения) / N</div>

                <li><strong>Экранировка:</strong> Кристалл Б должен быть надёжно изолирован от любых внешних Qₛ (фольга, заземление, шунгит), чтобы исключить классическую передачу.</li>
                <li><strong>Статистика:</strong> Одиночный успех — ничто. Нужно набрать статистику (минимум 30-50 проб).</li>
            </ul>

                <li><strong>ПК с программой анализа</strong> (Python/SciPy или специализированное ПО).</li>
                <li><strong>Источник тепла (опционально):</strong> Свеча или лампа накаливания для калибровки.</li>
                <li><strong>Источник «холода» (опционально):</strong> Лёд или пакет с замороженным гелем.</li>
            </ul>

            <div class="sub">📐 Схема установки TEMP-METER</div>
            <pre style="background: #e8e0d0; padding: 10px; border-radius: 8px; font-family: monospace; line-height: 1.2; overflow-x: auto;">
        [ ПОМЕЩЕНИЕ ИЛИ ЗОНА ВОКРУГ ОБЪЕКТА ]
        
        Датчик А (DST-1)          Датчик Б (DST-1)
             |                          |
             |<-------- 0.5-1 м -------->|
             |                          |
             v                          v
        +---------------------------------------------+
        |          ДВУХКАНАЛЬНЫЙ АЦП (ПК)             |
        |                                             |
        |   Запись сигналов A(t) и B(t)               |
        |   Частота дискретизации: ≥ 1 кГц            |
        |   Длительность: 60-300 секунд               |
        +---------------------+-----------------------+
                              |
                              v
        +---------------------------------------------+
        |            АНАЛИЗ НА ПК                     |
        |                                             |
        |   1. Вычисление кросс-корреляции A и B      |
        |   2. Построение спектра мощности P(f)       |
        |   3. Расчёт T_sense = ∫ f²·P(f) df / ∫ P(f) df |
        +---------------------------------------------+
            </pre>
            <p><em>Два датчика нужны для того, чтобы отличить локальные флуктуации Tₛ от глобального «нагрева» среды. Анализируется разностный сигнал (A — B) после вычитания синфазной составляющей.</em></p>

            <ol>
                <li><strong>Калибровка «нуля» (эталон покоя):</strong> В тихой, пустой, нейтральной комнате (например, библиотеке) запишите сигналы с датчиков в течение 5 минут. Это ваш эталон T_opt.</li>
                <li><strong>Калибровка «тепла»:</strong> Внесите в комнату источник физического тепла (включённую лампу 100 Вт) и источник семантического «тепла» (например, включите запись возбуждённого спора). Запишите сигналы. Сравните спектры с эталоном. Вы увидите сдвиг спектра в область более высоких частот.</li>
                <li><strong>Калибровка «холода»:</strong> Внесите в комнату лёд и создайте атмосферу тишины и неподвижности. Запишите сигналы. Спектр сдвинется в область очень низких частот (почти постоянный ток).</li>
                <li><strong>Измерение в тестируемом месте (храм, офис, вокзал):</strong> Установите датчики, запишите 5-10 минут. Вычислите T_sense по формуле.</li>
                <li><strong>Сравнение с эталонами:</strong> Нормируйте T_sense так, чтобы T_opt = 1.0. Тогда T_panic ≈ 5-10, T_fear ≈ 0.1-0.5.</li>
            </ol>

                </tbody>
            </table>

            <div class="sub">🔬 Альтернативный метод: анализ флуктуаций одного SEC-1</div>
            <p>Если нет двух датчиков, можно использовать один SEC-1.</p>
            <ol>
                <li>Запишите длинный (10-30 минут) сигнал SEC-1.</li>
                <li>Разбейте его на короткие интервалы (по 1-5 секунд).</li>
                <li>Для каждого интервала вычислите среднее значение амплитуды.</li>
                <li>Постройте распределение этих средних значений (гистограмму).</li>
                <li>Ширина распределения (стандартное отклонение) пропорциональна T_sense. Чем шире распределение, тем «горячее» среда.</li>
            </ol>
            <div class="formula">T_sense ∝ σ_амплитуд</div>

            <div class="sub">🧊 Связь Tₛ и Sₛ (энтропии)</div>
            <p>Согласно §101, высокая Tₛ обычно означает высокую энтропию Sₛ (хаос). Но есть нюанс: в храме во время службы Tₛ может быть умеренно высокой (из-за энергии молитвы), но Sₛ низкой (из-за высокой когерентности C_collective). Поэтому TEMP-METER лучше всего использовать в паре с COH-METER.</p>

            <div class="sub">⚠️ Возможные проблемы</div>
            <ul>
                <li><strong>Влияние физической температуры:</strong> Датчики SEC-1 чувствительны к физическому теплу (меняется ёмкость кварца). Проводите измерения при стабильной физической температуре или используйте дифференциальную схему.</li>
                <li><strong>Медленный дрейф:</strong> Отличайте медленный дрейф (низкая Tₛ) от быстрых флуктуаций (высокая Tₛ). Для этого используйте полосовые фильтры.</li>
                <li><strong>Калибровка нуля:</strong> Абсолютный ноль Tₛ (0 K) соответствует полному отсутствию флуктуаций — семантической «смерти». Это недостижимо в живом мире.</li>
            </ul>

            <p><strong>Цель эксперимента:</strong> Зарегистрировать и визуализировать «семантический фантом» — остаточное поле Φₛ, оставленное оператором в кресле после сеанса глубокой медитации (Cₛ > 0.8). Измерить время релаксации τ_relax этого следа и сравнить его со следом, оставленным в обычном, рассеянном состоянии (Cₛ < 0.4).</p>

            <p>Частота 432 Гц исторически считается «вердиевским строем» и, по мнению многих исследователей, математически лучше соотносится с естественными ритмами природы (сердцебиение, циклы Земли). Резонанс Шумана (7.83 Гц) — это собственная частота электромагнитного резонатора Земля-ионосфера. На этой частоте «звучит» сама планета. Настройка на неё синхронизирует биоритмы (§47).</p>
            <p>Сочетание 432 Гц (музыка) + 7.83 Гц (ритм Земли) создаёт мощный семантический резонанс, который стимулирует рост и повышает когерентность.</p>

            <p><strong>Цель эксперимента:</strong> Создать устройство, способное улавливать модуляции семантического поля (Φₛ) человека в момент мышления об определённом объекте, распознавать уникальный спектральный паттерн мысли (ω_s) и преобразовывать его в слышимое слово с помощью синтезатора речи.</p>
            
            <p><strong>Теоретическая база:</strong> §146 (ЭПР-парадокс), §11 (Волны смысла), §10 (SEC-1), §130 (Семантическая спектроскопия), §55 (Телепатия). Каждая мысль генерирует уникальный семантический паттерн — «частотный портрет» идеи. S-RADIO — это спектроанализатор семантического поля, сопоставляющий принятый спектр с библиотекой эталонов.</p>
            <div class="formula">ω_apple ≠ ω_house ≠ ω_water ≠ ω_mother</div>
            <p class="note">Гипотеза: разные мысли имеют разные доминирующие частоты ω_s. S-RADIO распознаёт их и воспроизводит соответствующее слово.</p>
            
            <div class="sub">🔧 Необходимое оборудование</div>
            <ul>
                <li><strong>Массив датчиков SEC-mini:</strong> 5-10 кварцевых пластин (5×5 мм), расположенных веером или матрицей для повышения точности.</li>
                <li><strong>Усилитель-мультиплексор:</strong> Схема на OPA333 + аналоговый мультиплексор CD4051 для последовательного опроса датчиков.</li>
                <li><strong>Микроконтроллер с Wi-Fi (ESP32):</strong> Для оцифровки сигнала, выполнения FFT (быстрого преобразования Фурье) и связи с ПК.</li>
                <li><strong>ПК с Python:</strong> Для машинного обучения (классификатор спектров) и управления синтезатором речи.</li>
                <li><strong>Синтезатор речи:</strong> Встроенный в ОС (espeak, pyttsx3) или аппаратный модуль.</li>
                <li><strong>Гарнитура COH-METER 2.0 (опционально):</strong> Для контроля Cₛ оператора во время калибровки.</li>
            </ul>

            <div class="sub">📐 Схема установки S-RADIO</div>
            <pre style="background: #e8e0d0; padding: 10px; border-radius: 8px; font-family: monospace; line-height: 1.2; overflow-x: auto;">

            <p><em>Оператор не произносит слово вслух. Он ТОЛЬКО думает о нём, удерживая образ в сознании. S-RADIO считывает семантический паттерн и «озвучивает» мысль.</em></p>

            <div class="sub">📝 Протокол проведения</div>
            <ol>
                <li><strong>Сборка матрицы SEC-mini.</strong> Закрепите 5-10 кварцевых пластин на диэлектрической подложке веером (угол обзора ~120°). Подключите их к мультиплексору CD4051. Выход мультиплексора — на усилитель OPA333 (усиление ×500). Выход усилителя — на АЦП ESP32.</li>
                <li><strong>Калибровка (Фаза 1): Запись эталонов.</strong> Оператор надевает COH-METER 2.0 и входит в состояние Cₛ > 0.7. Ему предъявляется изображение объекта (например, яблоко). Он смотрит на него 5 секунд, ЗАКРЫВАЕТ ГЛАЗА и 10 секунд УДЕРЖИВАЕТ мысленный образ. ESP32 записывает сигнал, выполняет FFT (512 точек) и отправляет спектр на ПК. Процедура повторяется 30-50 раз для каждого из 5-10 целевых слов.</li>
                <li><strong>Формирование библиотеки эталонов.</strong> Для каждого слова вычисляется усреднённый спектр S_avg(ω) и его дисперсия σ(ω). Сохраняется в файл library.json.</li>
                <li><strong>Тестирование (Фаза 2): Распознавание.</strong> Оператор думает о случайном слове из списка (не произнося его). S-RADIO записывает спектр, сравнивает его с эталонами (используя метод ближайшего соседа — KNN) и выводит на синтезатор речи наиболее вероятное слово.</li>
                <li><strong>Оценка точности.</strong> Проводится 100 попыток. Фиксируется процент правильных распознаваний. Случайный уровень: 10-20% (для 5-10 слов). Ожидаемая точность: 60-90% при Cₛ > 0.8.</li>
            </ol>

            <p><em>Интересный факт: абстрактные понятия («мама», «страх») распознаются ЛУЧШЕ конкретных предметов («яблоко», «мяч»), потому что их семантический заряд Qₛ выше и спектр более уникален.</em></p>

            <div class="sub">🧠 Алгоритм классификации (KNN — метод ближайшего соседа)</div>
            <p>Самый простой и эффективный метод для первых опытов:</p>
            <ol>
                <li>Полученный спектр S_test(ω) представляется как вектор в N-мерном пространстве (где N — число частотных бинов).</li>
                <li>Вычисляется евклидово расстояние до каждого эталонного вектора S_etalon_i(ω).</li>
                <li>Выбирается эталон с минимальным расстоянием.</li>
                <li>Синтезатор произносит соответствующее слово.</li>
            </ol>
            <div class="formula">Distance_i = √( Σ (S_test(ωⱼ) — S_etalon_i(ωⱼ))² )</div>

            <div class="sub">⚠️ Критические факторы успеха</div>
            <ul>
                <li><strong>Cₛ оператора > 0.7.</strong> При низкой когерентности спектр мысли «размывается» и становится неотличимым от шума. Используйте COH-METER для контроля.</li>
                <li><strong>Экранировка.</strong> S-RADIO будет ловить не только мысли оператора, но и наводки 50 Гц от сети, Wi-Fi, радио. Тщательная экранировка (фольга, заземление) обязательна.</li>
                <li><strong>Стабильность эталонов.</strong> Спектр одной и той же мысли может «плыть» в зависимости от настроения, усталости, времени суток. Калибровку нужно проводить в том же состоянии, что и тестирование.</li>
                <li><strong>Количество слов.</strong> Начните с 3-5 слов с максимально разными семантическими частотами (например, «яблоко», «мама», «страх»). Постепенно расширяйте библиотеку.</li>
            </ul>

            <div class="sub">🔮 Будущее S-RADIO</div>
            <ul>
                <li><strong>Медицина.</strong> Общение с полностью парализованными пациентами (синдром «запертого человека»).</li>
                <li><strong>Интерфейсы.</strong> Управление техникой силой мысли без электродов и имплантов.</li>
                <li><strong>Телепатия.</strong> Два S-RADIO + запутанные кристаллы (SEC-3) = мгновенная передача мыслей на расстояние.</li>
                <li><strong>Детектор лжи.</strong> Спектр «правды» и «лжи» отличаются из-за внутреннего семантического конфликта (§5).</li>
            </ul>

    // ========== ЛОГИКА КНИГИ (как в вашем учебнике) ==========
    const pagesContainer = document.getElementById('pagesContainer');
    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');
    const pageIndicator = document.getElementById('pageIndicator');
    const closeBtn = document.getElementById('closeBookBtn');

    let currentPage = 0;
    const totalPages = pagesData.length;

    function renderPages() {
        pagesContainer.innerHTML = '';
        pagesData.forEach((page, index) => {
            const pageDiv = document.createElement('div');
            pageDiv.className = `page ${index === 0 ? 'active-page' : ''}`;
            if (page.type === 'cover') {
                pageDiv.classList.add('cover');
                pageDiv.innerHTML = `
                    <h1>${page.title}</h1>
                    ${page.content}
                `;
            } else {
                pageDiv.innerHTML = `
                    <div class="chapter-title">${page.title}</div>
                    ${page.content}
                    <div class="page-number">Страница ${index}</div>
                `;
            }
            pagesContainer.appendChild(pageDiv);
        });
        updateUI();
    }

    function updateUI() {
        document.querySelectorAll('.page').forEach((p, i) => {
            p.classList.toggle('active-page', i === currentPage);
        });
        pageIndicator.textContent = `Страница ${currentPage} / ${totalPages-1}`;
        prevBtn.disabled = currentPage === 0;
        nextBtn.disabled = currentPage === totalPages - 1;
    }

    prevBtn.addEventListener('click', () => {
        if (currentPage > 0) {
            currentPage--;
            updateUI();
        }
    });
    nextBtn.addEventListener('click', () => {
        if (currentPage < totalPages - 1) {
            currentPage++;
            updateUI();
        }
    });
    closeBtn.addEventListener('click', () => {
        currentPage = 0;
        updateUI();
    });
    
    /* ==========================================
   СКРИПТ ДНЕВНИКА ИССЛЕДОВАТЕЛЯ
   Подключите на всех страницах Практикума
   ========================================== */

function initJournal(expNum) {
    const STORAGE_KEY = 'ideatonika_journal_exp' + expNum;

    function loadJournal() {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) return [];
        try { return JSON.parse(raw); } catch(e) { return []; }
    }

    function saveJournal(entries) {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(entries));
    }

    function renderJournal() {
        const entries = loadJournal();
        const container = document.getElementById('journalEntries');
        if (!container) return;

        if (entries.length === 0) {
            container.innerHTML = '<div class="journal-empty">📭 Пока нет записей. Проведите эксперимент и сохраните первый результат!</div>';
            return;
        }

        let html = '';
        entries.forEach((entry, index) => {
            html += '<div class="journal-entry">';
            html += '<div class="journal-entry-date">📅 ' + entry.date + '</div>';
            html += '<div class="journal-entry-result">📊 ' + entry.result + '</div>';
            if (entry.notes) html += '<div class="journal-entry-notes">📝 ' + entry.notes + '</div>';
            html += '<div class="journal-entry-btns">';
            html += '<button onclick="editJournalEntry(' + index + ')">✏️ Редактировать</button>';
            html += '<button onclick="deleteJournalEntry(' + index + ')">🗑️ Удалить</button>';
            html += '</div></div>';
        });
        container.innerHTML = html;
    }

    window.saveJournalEntry = function() {
        const date = document.getElementById('journalDate').value;
        const result = document.getElementById('journalResult').value.trim();
        const notes = document.getElementById('journalNotes').value.trim();

        if (!date || !result) { alert('Пожалуйста, заполните дату и результат.'); return; }

        const entries = loadJournal();
        const editIndex = document.getElementById('journalDate').dataset.editIndex;

        if (editIndex !== undefined && editIndex !== '') {
            entries[parseInt(editIndex)] = { date, result, notes };
            delete document.getElementById('journalDate').dataset.editIndex;
        } else {
            entries.push({ date, result, notes });
        }

        saveJournal(entries);
        document.getElementById('journalResult').value = '';
        document.getElementById('journalNotes').value = '';
        renderJournal();
    };

    window.editJournalEntry = function(index) {
        const entries = loadJournal();
        const entry = entries[index];
        document.getElementById('journalDate').value = entry.date;
        document.getElementById('journalResult').value = entry.result;
        document.getElementById('journalNotes').value = entry.notes || '';
        document.getElementById('journalDate').dataset.editIndex = index;
        window.scrollTo({ top: document.getElementById('journalDate').offsetTop - 50, behavior: 'smooth' });
    };

    window.deleteJournalEntry = function(index) {
        if (!confirm('Удалить эту запись?')) return;
        const entries = loadJournal();
        entries.splice(index, 1);
        saveJournal(entries);
        renderJournal();
    };

    document.getElementById('journalDate').value = new Date().toISOString().split('T')[0];
    renderJournal();
}

// ========== ПЕРЕХОД ПО ПРЯМОЙ ССЫЛКЕ ==========
const urlParams = new URLSearchParams(window.location.search);
const pageParam = urlParams.get('page');
if (pageParam !== null) {
    const pageNum = parseInt(pageParam);
    if (pageNum >= 0 && pageNum < pagesData.length) {
        currentPage = pageNum;
        updateUI();
    }
}

    renderPages();
</script>
