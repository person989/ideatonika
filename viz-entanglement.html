<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Семантическая Запутанность • Идеатоника</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: linear-gradient(145deg, #0d1117 0%, #161b22 100%);
            min-height: 100vh;
            font-family: 'Georgia', 'Times New Roman', serif;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            padding: 1rem; overflow-x: hidden;
        }
        .stars-bg { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 0; }
        .star { position: absolute; background: white; border-radius: 50%; animation: twinkle var(--duration) ease-in-out infinite; animation-delay: var(--delay); opacity: 0; }
        @keyframes twinkle { 0%,100% { opacity:0.2; transform:scale(1); } 50% { opacity:1; transform:scale(1.8); } }
        .main-container {
            position: relative; z-index: 1; width: 100%; max-width: 1100px;
            background: rgba(22,27,34,0.85); backdrop-filter: blur(12px);
            border: 1px solid rgba(227,184,124,0.3); border-radius: 32px;
            padding: 2rem; box-shadow: 0 20px 40px rgba(0,0,0,0.6);
        }
        .header { text-align: center; margin-bottom: 1.5rem; }
        .header h1 { font-size: 2.5rem; font-weight: 400; letter-spacing: 3px; color: #f3e7c0; text-shadow: 0 0 20px rgba(255,215,80,0.4); margin-bottom: 0.3rem; }
        .header .subtitle { font-size: 1rem; color: #c0b090; font-style: italic; border-bottom: 1px solid #5d4a3a; display: inline-block; padding-bottom: 0.4rem; }
        .canvas-wrapper { position: relative; width: 100%; background: radial-gradient(ellipse at center, #1a2030 0%, #0a0e14 100%); border-radius: 20px; border: 1px solid #5d4a3a; overflow: hidden; margin-bottom: 1.5rem; box-shadow: inset 0 0 80px rgba(0,0,0,0.5); }
        canvas { display: block; width: 100%; height: auto; }
        .controls-panel { background: rgba(0,0,0,0.3); border: 1px solid #5d4a3a; border-radius: 20px; padding: 1.5rem 2rem; }
        .controls-title { font-size: 1.2rem; color: #ffd54f; margin-bottom: 1.2rem; text-align: center; letter-spacing: 1px; }
        .slider-group { margin-bottom: 1.2rem; }
        .slider-group label { display: flex; justify-content: space-between; align-items: center; color: #d0c8b8; font-size: 0.95rem; margin-bottom: 0.4rem; }
        .slider-group label .param-value { color: #ffd54f; font-weight: bold; font-size: 1.1rem; min-width: 50px; text-align: right; }
        .slider-group input[type="range"] { width: 100%; -webkit-appearance: none; height: 8px; background: linear-gradient(90deg, #3a2a4a, #5d4a3a, #3a2a4a); border-radius: 4px; outline: none; cursor: pointer; }
        .slider-group input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; width: 24px; height: 24px; background: radial-gradient(circle at 40% 40%, #ffe082, #ff8f00); border-radius: 50%; cursor: pointer; box-shadow: 0 0 15px rgba(255,215,80,0.6); border: 2px solid #ffd54f; }
        .range-labels { display: flex; justify-content: space-between; color: #706858; font-size: 0.75rem; margin-top: 0.2rem; }
        .info-box { margin-top: 1.5rem; padding: 1rem 1.5rem; background: rgba(255,215,80,0.05); border: 1px solid rgba(255,215,80,0.2); border-radius: 12px; text-align: center; color: #c0b090; font-size: 0.9rem; font-style: italic; }
        .info-box .formula-display { font-family: 'Courier New', monospace; color: #ffd54f; font-size: 1rem; margin: 0.3rem 0; }
        .back-row { text-align: center; margin-top: 1.5rem; }
        .back-link { display: inline-block; color: #ffd54f; text-decoration: none; border: 1px solid #ffd54f; padding: 0.6rem 1.5rem; border-radius: 30px; transition: 0.3s; font-size: 0.9rem; }
        .back-link:hover { background: #ffd54f; color: #0d1117; }
        @media (max-width: 700px) { .main-container { padding: 1rem; } .header h1 { font-size: 1.8rem; } .controls-panel { padding: 1rem; } }
    </style>
</head>
<body>
<div class="stars-bg" id="starsBg"></div>
<div class="main-container">
    <div class="header">
        <h1>🔗 Семантическая Запутанность</h1>
        <div class="subtitle">Визуализация §104: нелокальная связь полей</div>
    </div>
    <div class="canvas-wrapper" id="canvasWrapper">
        <canvas id="entanglementCanvas"></canvas>
    </div>
    <div class="controls-panel">
        <div class="controls-title">🎛️ Параметры</div>
        <div class="slider-group">
            <label><span>🔵 Вращение частицы A (спин)</span><span class="param-value" id="spinAValue">0°</span></label>
            <input type="range" id="spinASlider" min="0" max="360" value="0" step="1">
            <div class="range-labels"><span>0°</span><span>180°</span><span>360°</span></div>
        </div>
        <div class="slider-group">
            <label><span>📏 Расстояние между частицами</span><span class="param-value" id="distValue">300 px</span></label>
            <input type="range" id="distSlider" min="100" max="600" value="300" step="10">
            <div class="range-labels"><span>100 px (рядом)</span><span>600 px (далеко)</span></div>
        </div>
        <div class="slider-group">
            <label><span>💗 Сила запутанности (K)</span><span class="param-value" id="kValue">7 / 10</span></label>
            <input type="range" id="kSlider" min="1" max="10" value="7" step="0.5">
            <div class="range-labels"><span>1 (слабая)</span><span>5</span><span>10 (мать-дитя)</span></div>
        </div>
        <div class="slider-group" style="text-align:center;">
            <button id="pauseBtn" style="padding:0.6rem 2rem;background:rgba(255,215,80,0.1);border:1px solid #ffd54f;color:#ffd54f;border-radius:30px;font-family:Georgia,serif;font-size:1rem;cursor:pointer;">⏯️ Пауза</button>
        </div>
        <div class="info-box">
            <span id="statusText" style="color:#ffd54f;font-weight:bold;">🔗 Сильная запутанность</span>
            <div class="formula-display" id="formulaDisplay"></div>
        </div>
    </div>
    <div class="back-row">
        <a href="visualizations.html" class="back-link">← К списку визуализаций</a>
    </div>
</div>

<script>
(function(){
    const starsBg=document.getElementById('starsBg');
    for(let i=0;i<100;i++){
        const d=document.createElement('div');d.className='star';
        d.style.left=Math.random()*100+'%';d.style.top=Math.random()*100+'%';
        const s=Math.random()*2.5+0.5;d.style.width=s+'px';d.style.height=s+'px';
        d.style.setProperty('--duration',(Math.random()*4+2)+'s');
        d.style.setProperty('--delay',(Math.random()*5)+'s');
        starsBg.appendChild(d);
    }
})();

const canvas=document.getElementById('entanglementCanvas');
const ctx=canvas.getContext('2d');
const wrapper=document.getElementById('canvasWrapper');
let time=0,paused=false,animId;

// Частица B ВСЕГДА мгновенно повторяет состояние A (запутанность!)
let currentSpinA=0, currentSpinB=0;
let targetSpinA=0;

function resize(){
    const r=wrapper.getBoundingClientRect();
    canvas.width=r.width;
    canvas.height=Math.max(500,Math.min(650,r.width*0.7));
    wrapper.style.height=canvas.height+'px';
}
resize();window.addEventListener('resize',resize);

const spinASlider=document.getElementById('spinASlider');
const distSlider=document.getElementById('distSlider');
const kSlider=document.getElementById('kSlider');
const spinAValue=document.getElementById('spinAValue');
const distValue=document.getElementById('distValue');
const kValue=document.getElementById('kValue');
const pauseBtn=document.getElementById('pauseBtn');
const statusText=document.getElementById('statusText');
const formulaDisplay=document.getElementById('formulaDisplay');

spinASlider.oninput=function(){
    spinAValue.textContent=this.value+'°';
    targetSpinA=parseInt(this.value)*Math.PI/180;
    updateInfo();
};
distSlider.oninput=function(){distValue.textContent=this.value+' px';};
kSlider.oninput=function(){
    kValue.textContent=(parseFloat(this.value)).toFixed(1)+' / 10';
    updateInfo();
};

pauseBtn.onclick=function(){
    paused=!paused;
    this.textContent=paused?'▶️ Продолжить':'⏯️ Пауза';
};

function updateInfo(){
    const k=parseFloat(kSlider.value);
    if(k>=8) statusText.textContent='💞 Сверхсильная запутанность — мгновенный отклик';
    else if(k>=5) statusText.textContent='🔗 Сильная запутанность — почти мгновенный отклик';
    else if(k>=2) statusText.textContent='📡 Средняя запутанность — небольшая задержка';
    else statusText.textContent='🌫️ Слабая запутанность — едва заметная связь';
    formulaDisplay.textContent='|Ψ_AB⟩ = (|Φ_A⟩⊗|Φ_B⟩ + |Φ_B⟩⊗|Φ_A⟩)/√2   K='+k.toFixed(1);
}
updateInfo();

function drawFrame(){
    const k=parseFloat(kSlider.value);
    const dist=parseFloat(distSlider.value);
    const w=canvas.width,h=canvas.height;
    
    if(!paused){
        time+=0.02;
        // Плавно двигаем спин A к цели
        const speedA=0.15;
        let diff=targetSpinA-currentSpinA;
        if(diff>Math.PI) diff-=Math.PI*2;
        if(diff<-Math.PI) diff+=Math.PI*2;
        currentSpinA+=diff*speedA;
    }
    
    // Спин B: при K>=9 — мгновенно, при K=1 — очень медленно догоняет
if(!paused){
    let diffB=currentSpinA-currentSpinB;
    // Нормализация угла
    while(diffB>Math.PI) diffB-=Math.PI*2;
    while(diffB<-Math.PI) diffB+=Math.PI*2;
    
    // Защита от NaN
    if(isNaN(diffB)||!isFinite(diffB)) diffB=0;
    
    // Скорость реакции зависит от K:
    // K=10 → speed=1.0 (мгновенно)
    // K=5  → speed=0.15 (заметная задержка)
    // K=1  → speed=0.03 (очень медленно, едва догоняет)
    const speedB=Math.pow((k-1)/9, 2)*0.95+0.03;
    const step=diffB*Math.min(1,speedB);
    
    if(!isNaN(step)&&isFinite(step)){
        currentSpinB+=step;
    }
}

// Финальная защита
if(isNaN(currentSpinB)||!isFinite(currentSpinB)) currentSpinB=0;
    
    // Очистка
    ctx.fillStyle='#060a10';
    ctx.fillRect(0,0,w,h);
    
    // Сетка
    ctx.strokeStyle='rgba(255,255,255,0.02)';ctx.lineWidth=1;
    for(let x=0;x<w;x+=50){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,h);ctx.stroke();}
    for(let y=0;y<h;y+=50){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(w,y);ctx.stroke();}
    
    const cxA=w/2-dist/2, cxB=w/2+dist/2, cy=h/2;
    
    // Линия запутанности
    const lineAlpha=0.2+0.3*k/10;
    const lineGrad=ctx.createLinearGradient(cxA,cy,cxB,cy);
    lineGrad.addColorStop(0,'rgba(100,180,255,0)');
    lineGrad.addColorStop(0.3,'rgba(200,150,255,'+lineAlpha+')');
    lineGrad.addColorStop(0.5,'rgba(255,215,150,'+lineAlpha*1.5+')');
    lineGrad.addColorStop(0.7,'rgba(200,150,255,'+lineAlpha+')');
    lineGrad.addColorStop(1,'rgba(255,100,130,0)');
    
    // Пульсация линии
    const pulse=1+0.2*Math.sin(time*3)*k/10;
    ctx.strokeStyle=lineGrad;
    ctx.lineWidth=(2+k/2)*pulse;
    ctx.beginPath();ctx.moveTo(cxA,cy);ctx.lineTo(cxB,cy);ctx.stroke();
    
    // Волны вдоль линии
    const numWaves=Math.floor(k*3);
    for(let i=0;i<numWaves;i++){
        const t=i/numWaves;
        const wx=cxA+(cxB-cxA)*t;
        const wy=cy+Math.sin(t*Math.PI*4+time*5)*8*k/10;
        const alpha=0.3*k/10*(1-Math.abs(t-0.5)*2);
        ctx.fillStyle=`rgba(255,215,150,${alpha})`;
        ctx.beginPath();ctx.arc(wx,wy,1.5,0,Math.PI*2);ctx.fill();
    }
    
    // Частицы-искры вдоль линии (сигналы)
    const numSparks=Math.floor(k*2);
    for(let i=0;i<numSparks;i++){
        const sparkT=(time*0.5+i/numSparks)%1;
        const sx=cxA+(cxB-cxA)*sparkT;
        const sy=cy+Math.sin(sparkT*Math.PI*6+time*4)*5;
        const alpha=0.5*(1-Math.abs(sparkT-0.5)*2);
        ctx.fillStyle=`rgba(255,255,200,${alpha})`;
        ctx.beginPath();ctx.arc(sx,sy,2.5,0,Math.PI*2);ctx.fill();
    }
    
    // Функция рисования частицы
    function drawParticle(cx,cy,spin,color,label,isSource){
        const radius=25+10*(k/10);
        
        // Свечение
        const glow=ctx.createRadialGradient(cx,cy,radius*0.3,cx,cy,radius*2);
        glow.addColorStop(0,'rgba(255,255,255,0.8)');
        glow.addColorStop(0.2,color);
        glow.addColorStop(0.6,color.replace('1)',(0.3*k/10)+')'));
        glow.addColorStop(1,'rgba(0,0,0,0)');
        ctx.fillStyle=glow;
        ctx.beginPath();ctx.arc(cx,cy,radius*2,0,Math.PI*2);ctx.fill();
        
        // Орбита
        ctx.strokeStyle='rgba(255,255,255,0.1)';
        ctx.lineWidth=1;
        ctx.beginPath();ctx.arc(cx,cy,radius*0.7,0,Math.PI*2);ctx.stroke();
        
        // Спутник на орбите
        const sx=cx+Math.cos(spin)*radius*0.7;
        const sy=cy+Math.sin(spin)*radius*0.7;
        
        // Линия к спутнику
        ctx.strokeStyle=color.replace('1)','0.5)');
        ctx.lineWidth=2;
        ctx.beginPath();ctx.moveTo(cx,cy);ctx.lineTo(sx,sy);ctx.stroke();
        
        // Ядро
        const core=ctx.createRadialGradient(cx,cy,0,cx,cy,radius*0.4);
        core.addColorStop(0,'#ffffff');
        core.addColorStop(1,color.replace('1)','0.8)'));
        ctx.fillStyle=core;
        ctx.beginPath();ctx.arc(cx,cy,radius*0.4,0,Math.PI*2);ctx.fill();
        
        // Спутник
        ctx.fillStyle='#ffffff';
        ctx.beginPath();ctx.arc(sx,sy,5,0,Math.PI*2);ctx.fill();
        
        // Подпись
        ctx.fillStyle=color.replace('1)','0.9)');
        ctx.font='bold 16px Georgia,serif';
        ctx.textAlign='center';
        ctx.fillText(label,cx,cy-radius*2.5-5);
        
        if(isSource){
            ctx.fillText('(источник)',cx,cy-radius*2.5+18);
        }else{
            const sync=Math.abs(currentSpinA-currentSpinB)<0.05;
            ctx.fillText(sync?'(синхронно)':'(догоняет...)',cx,cy-radius*2.5+18);
        }
        
        // Угол спина
let deg=Math.round(spin*180/Math.PI)%360;
if(deg<0) deg+=360;
        ctx.fillText(deg+'°',cx,cy-radius*2.5+36);
    }
    
    drawParticle(cxA,cy,currentSpinA,'rgba(100,180,255,1)','Φₐ',true);
    drawParticle(cxB,cy,currentSpinB,'rgba(255,130,130,1)','Φ_b',false);
    
    // Легенда
    ctx.fillStyle='#c0b090';
    ctx.font='14px Georgia,serif';
    ctx.textAlign='center';
    ctx.fillText('Частица B МГНОВЕННО повторяет состояние частицы A (спин)',w/2,cy+120);
    if(k<8) ctx.fillText('(при K<8 — с небольшой задержкой)',w/2,cy+140);
    ctx.fillText('Расстояние не влияет на связь!',w/2,cy+160);
    
    animId=requestAnimationFrame(drawFrame);
}

drawFrame();
window.addEventListener('beforeunload',()=>{if(animId)cancelAnimationFrame(animId);});
</script>

</body>
</html>
