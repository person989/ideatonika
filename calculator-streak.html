<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Калькулятор Длины Серии Удач • Идеатоника</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: linear-gradient(145deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            font-family: 'Georgia', 'Times New Roman', serif;
            padding: 2rem;
            display: flex; flex-direction: column; align-items: center;
        }
        .cosmic-bg { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 0; }
        .main-container {
            max-width: 800px; width: 100%; position: relative; z-index: 1;
            background: rgba(30, 40, 60, 0.85); backdrop-filter: blur(12px);
            border: 1px solid rgba(227, 184, 124, 0.4); border-radius: 32px;
            padding: 2.5rem; box-shadow: 0 20px 40px rgba(0,0,0,0.5);
        }
        h1 { font-size: 2.5rem; color: #f3e7c0; text-align: center; margin-bottom: 0.5rem; font-weight: 400; }
        .subtitle { text-align: center; color: #c0b090; font-style: italic; margin-bottom: 2rem; border-bottom: 1px solid #5d4a3a; padding-bottom: 1rem; }
        .calc-section { background: rgba(0,0,0,0.2); border-radius: 20px; padding: 2rem; margin-bottom: 2rem; border: 1px solid #5d4a3a; }
        .section-title { font-size: 1.4rem; color: #ffd54f; margin-bottom: 1.5rem; }
        .input-group { margin-bottom: 1.5rem; }
        .input-group label { display: flex; justify-content: space-between; align-items: center; color: #d0c8b8; font-size: 1rem; margin-bottom: 0.5rem; }
        .input-group label span { color: #ffd54f; font-weight: bold; font-size: 1.2rem; }
        .input-group input[type="range"] { width: 100%; -webkit-appearance: none; height: 8px; background: #5d4a3a; border-radius: 4px; outline: none; cursor: pointer; }
        .input-group input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; width: 22px; height: 22px; background: #ffd54f; border-radius: 50%; cursor: pointer; box-shadow: 0 0 10px rgba(255,215,80,0.5); }
        .input-group .range-labels { display: flex; justify-content: space-between; color: #706858; font-size: 0.8rem; margin-top: 0.3rem; }
        .input-group select { width: 100%; padding: 0.8rem 1rem; background: rgba(0,0,0,0.3); border: 1px solid #5d4a3a; border-radius: 10px; color: #f3e7c0; font-family: 'Georgia', serif; font-size: 1rem; }
        .input-group select option { background: #1a1a2e; color: #f3e7c0; }
        .result-box { background: rgba(255,215,80,0.1); border: 2px solid #ffd54f; border-radius: 20px; padding: 2rem; text-align: center; margin-top: 2rem; }
        .result-number { font-size: 5rem; font-weight: bold; color: #ffd54f; line-height: 1; }
        .result-label { color: #c0b090; font-size: 1.2rem; margin-top: 0.5rem; }
        .result-extra { color: #d0c8b8; font-size: 1rem; margin-top: 1rem; font-style: italic; }
        .result-stats { color: #a09080; font-size: 0.9rem; margin-top: 0.5rem; font-style: italic; }
        .result-formula { color: #a09080; font-style: italic; font-size: 0.9rem; margin-top: 1rem; font-family: 'Courier New', monospace; }
        .clover { font-size: 3rem; display: inline-block; animation: spin 3s infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .back-link { display: inline-block; margin-top: 1.5rem; color: #ffd54f; text-decoration: none; border: 1px solid #ffd54f; padding: 0.6rem 1.5rem; border-radius: 30px; transition: 0.2s; }
        .back-link:hover { background: #ffd54f; color: #1a1a2e; }
    </style>
</head>
<body>
<div class="cosmic-bg"></div>
<div class="main-container">

    <h1>🍀 Длина Серии Удач</h1>
    <div class="subtitle">Калькулятор продолжительности «полосы везения» (Формула ⟨N_streak⟩)</div>

    <div class="calc-section">
        <div class="section-title">🎲 Параметры события</div>

        <div class="input-group">
            <label>🎯 Тип события:</label>
            <select id="eventSelect">
                <option value="0.5">Орёл/решка (p=0.5)</option>
                <option value="0.33">Угадать одну из трёх карт (p=0.33)</option>
                <option value="0.166">Бросок кубика: нужная грань (p=0.166)</option>
                <option value="0.1" selected>Случайная встреча (p=0.1)</option>
                <option value="0.01">Выигрыш в лотерею (p=0.01)</option>
                <option value="0.001">Крупный выигрыш (p=0.001)</option>
            </select>
        </div>
    </div>

    <div class="calc-section">
        <div class="section-title">🌟 Ваш заряд удачи</div>

        <div class="input-group">
            <label>☀️ Семантический заряд (Qₛ): <span id="qsValue">+3</span></label>
            <input type="range" id="qsSlider" min="-5" max="10" value="3" step="0.1">
            <div class="range-labels"><span>-5 (проклят)</span><span>0 (нейтрален)</span><span>+10 (везунчик)</span></div>
        </div>

        <div class="input-group">
            <label>🎯 Когерентность (Cₛ): <span id="csValue">0.6</span></label>
            <input type="range" id="csSlider" min="0.1" max="1" value="0.6" step="0.01">
            <div class="range-labels"><span>0.1 (рассеян)</span><span>1.0 (лазер)</span></div>
        </div>

        <div class="input-group">
            <label>🌈 Оптимизм (вера в удачу): <span id="optValue">5</span> из 10</label>
            <input type="range" id="optSlider" min="0" max="10" value="5" step="0.1">
            <div class="range-labels"><span>0 (фаталист)</span><span>10 (оптимист)</span></div>
        </div>

        <div class="input-group">
            <label>😨 Уровень страха (S_fear): <span id="fearValue">3</span> из 10</label>
            <input type="range" id="fearSlider" min="0" max="10" value="3" step="0.1">
            <div class="range-labels"><span>0 (бесстрашен)</span><span>10 (паникёр)</span></div>
        </div>
    </div>

    <!-- Результат -->
    <div class="result-box" id="resultBox">
        <div class="clover" id="cloverIcon">🍀</div>
        <div class="result-number" id="resultNumber">—</div>
        <div class="result-label" id="resultLabel">Средняя длина серии удач</div>
        <div class="result-extra" id="resultExtra"></div>
        <div class="result-stats" id="resultStats"></div>
        <div class="result-formula" id="resultFormula"></div>
    </div>

    <div style="text-align: center;">
        <a href="semantic-calculators.html" class="back-link">← К списку калькуляторов</a>
    </div>

</div>

<script>
    const eventSelect = document.getElementById('eventSelect');
    const qsSlider = document.getElementById('qsSlider');
    const csSlider = document.getElementById('csSlider');
    const optSlider = document.getElementById('optSlider');
    const fearSlider = document.getElementById('fearSlider');
    const qsValue = document.getElementById('qsValue');
    const csValue = document.getElementById('csValue');
    const optValue = document.getElementById('optValue');
    const fearValue = document.getElementById('fearValue');
    const resultNumber = document.getElementById('resultNumber');
    const resultLabel = document.getElementById('resultLabel');
    const resultExtra = document.getElementById('resultExtra');
    const resultStats = document.getElementById('resultStats');
    const resultFormula = document.getElementById('resultFormula');
    const cloverIcon = document.getElementById('cloverIcon');

    eventSelect.addEventListener('change', calculate);
    qsSlider.addEventListener('input', () => { qsValue.textContent = (parseFloat(qsSlider.value) >= 0 ? '+' : '') + parseFloat(qsSlider.value).toFixed(1); calculate(); });
    csSlider.addEventListener('input', () => { csValue.textContent = parseFloat(csSlider.value).toFixed(2); calculate(); });
    optSlider.addEventListener('input', () => { optValue.textContent = parseFloat(optSlider.value).toFixed(1); calculate(); });
    fearSlider.addEventListener('input', () => { fearValue.textContent = parseFloat(fearSlider.value).toFixed(1); calculate(); });

    function calculate() {
    const p = parseFloat(eventSelect.value);
    const Qraw = parseFloat(qsSlider.value);
    const C = parseFloat(csSlider.value);
    const opt = parseFloat(optSlider.value);
    const fear = parseFloat(fearSlider.value);

    // Заряд удачи Q_luck
    const Q0 = 5;
    const Qluck = Q0 * (1 + 0.15 * opt) * (1 + 0.1 * Math.max(0, Qraw)) * Math.exp(-0.2 * fear) * C;

    // Базовая средняя длина серии (геометрическое распределение)
    const baseStreak = p / (1 - p + 0.001); // Для орла/решки = 1, для лотереи ~0.01

    // Усиление от заряда удачи: множитель (Q_luck / Q0)^k
    const luckMultiplier = Math.pow(Qluck / Q0, 1.5);

    // Итоговая длина серии
    const Nstreak = baseStreak * luckMultiplier;

    resultNumber.textContent = Nstreak.toFixed(1);
    resultLabel.textContent = 'успехов подряд';

    let extra = '';
    let clover = '🍀';
    if (Nstreak >= 100) {
        extra = '🦄 Легендарное везение! Вы в потоке невероятной удачи!';
        clover = '🌈';
    } else if (Nstreak >= 50) {
        extra = '✨ Феноменально! Огромная полоса везения.';
        clover = '🍀🍀🍀🍀';
    } else if (Nstreak >= 20) {
        extra = '🌟 Превосходно! Длинная полоса везения. Используйте момент!';
        clover = '🍀🍀🍀';
    } else if (Nstreak >= 10) {
        extra = '👍 Очень хорошая серия. Удача на вашей стороне.';
        clover = '🍀🍀';
    } else if (Nstreak >= 5) {
        extra = '🙂 Хорошая серия. Приятно.';
        clover = '🍀';
    } else if (Nstreak >= 2) {
        extra = '🤞 Небольшая серия.';
        clover = '🌱';
    } else if (Nstreak >= 1) {
        extra = '💤 Один-два успеха.';
        clover = '🍂';
    } else {
        extra = '💔 Удача пока не на вашей стороне.';
        clover = '🥀';
    }
    resultExtra.textContent = extra;
    cloverIcon.textContent = clover;

    resultStats.textContent = `Заряд удачи Q_luck = ${Qluck.toFixed(1)} | Базовая вероятность: ${(p*100).toFixed(1)}% | Базовая серия: ${baseStreak.toFixed(2)} | Множитель: ${luckMultiplier.toFixed(1)}x`;

    resultFormula.textContent = `Q_luck = 5 · (1+0.15·${opt.toFixed(1)}) · (1+0.1·${Math.max(0,Qraw).toFixed(1)}) · e^(-0.2·${fear.toFixed(1)}) · ${C.toFixed(2)} = ${Qluck.toFixed(1)} | ⟨N⟩ = ${baseStreak.toFixed(2)} · (${Qluck.toFixed(1)}/5)^1.5 = ${Nstreak.toFixed(1)}`;
}

    calculate();
</script>

</body>
</html>
