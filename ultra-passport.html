<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Семантический Паспорт (Углублённый) • Идеатоника</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: linear-gradient(145deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            font-family: 'Georgia', 'Times New Roman', serif;
            padding: 2rem;
            display: flex; flex-direction: column; align-items: center;
        }
        .cosmic-bg { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 0; }
        .main-container {
            max-width: 800px; width: 100%; position: relative; z-index: 1;
            background: rgba(30, 40, 60, 0.85); backdrop-filter: blur(12px);
            border: 1px solid rgba(227, 184, 124, 0.4); border-radius: 32px;
            padding: 2.5rem; box-shadow: 0 20px 40px rgba(0,0,0,0.5);
        }
        .passport-header { text-align: center; margin-bottom: 2rem; padding-bottom: 1.5rem; border-bottom: 2px solid #ffd54f; }
        .passport-header h1 { font-size: 2.5rem; color: #ffd54f; font-weight: 400; letter-spacing: 4px; margin-bottom: 0.5rem; }
        .passport-header .subtitle { color: #c0b090; font-style: italic; font-size: 1rem; }
        .passport-header .emblem { font-size: 3rem; margin-bottom: 0.5rem; }
        .deep-badge {
            display: inline-block; background: #81c784; color: #1a1a2e; padding: 4px 12px;
            border-radius: 20px; font-size: 0.8rem; font-weight: bold; margin-bottom: 1rem;
        }
        .personal-data {
            display: flex; flex-wrap: wrap; gap: 1rem; margin-bottom: 2rem;
            padding: 1.5rem; background: rgba(0,0,0,0.2); border-radius: 16px; border: 1px solid #5d4a3a;
        }
        .personal-data input {
            flex: 1; min-width: 150px; padding: 0.8rem 1rem;
            background: rgba(0,0,0,0.3); border: 1px solid #5d4a3a; border-radius: 10px;
            color: #f3e7c0; font-family: 'Georgia', serif; font-size: 1rem;
        }
        .personal-data input::placeholder { color: #706858; }
        .personal-data label { width: 100%; color: #c0b090; font-size: 0.9rem; margin-bottom: -0.5rem; }
        .results-section { margin-bottom: 2rem; }
        .section-title {
            font-size: 1.4rem; color: #ffd54f; margin-bottom: 1rem;
            border-left: 4px solid #ffd54f; padding-left: 1rem;
        }
        .results-table { width: 100%; border-collapse: collapse; font-size: 0.9rem; }
        .results-table th {
            background: #2a2a4a; color: #f3e7c0; padding: 12px;
            text-align: left; border: 1px solid #5d4a3a;
        }
        .results-table td { padding: 10px 12px; border: 1px solid #5d4a3a; color: #d0c8b8; }
        .results-table tr:nth-child(even) td { background: rgba(0,0,0,0.1); }
        .result-value { font-weight: bold; color: #ffd54f; font-size: 1.1rem; }
        .result-missing { color: #706858; font-style: italic; }
        .reset-btn {
            background: transparent; border: 1px solid #ef5350; color: #ef5350;
            padding: 4px 12px; border-radius: 20px; cursor: pointer;
            font-size: 0.75rem; transition: 0.2s; font-family: inherit;
        }
        .reset-btn:hover { background: #ef5350; color: white; }
        .integral-rank {
            text-align: center; margin: 2rem 0; padding: 2rem;
            background: rgba(255,215,80,0.1); border: 2px solid #ffd54f; border-radius: 20px;
        }
        .integral-rank .rank-number { font-size: 5rem; font-weight: bold; color: #ffd54f; line-height: 1; }
        .integral-rank .rank-label { color: #c0b090; font-size: 1.2rem; margin-top: 0.5rem; }
        .print-section { text-align: center; margin-top: 2rem; }
        .print-btn {
            padding: 1rem 3rem; font-size: 1.2rem; font-weight: bold;
            background: #ffd54f; color: #1a1a2e; border: none;
            border-radius: 40px; cursor: pointer; transition: 0.3s; font-family: inherit;
        }
        .print-btn:hover { background: #ffc107; box-shadow: 0 0 20px rgba(255,215,80,0.5); }
        .print-btn:disabled { background: #5d4a3a; color: #706858; cursor: not-allowed; box-shadow: none; }
        .print-hint { color: #a09080; font-size: 0.9rem; margin-top: 0.8rem; font-style: italic; }
        .back-link {
            display: inline-block; margin-top: 1.5rem; color: #ffd54f;
            text-decoration: none; border: 1px solid #ffd54f;
            padding: 0.6rem 1.5rem; border-radius: 30px; transition: 0.2s;
        }
        .back-link:hover { background: #ffd54f; color: #1a1a2e; }
        @media print {
            body { background: white !important; padding: 0 !important; font-size: 11pt; color: black; }
            .cosmic-bg { display: none !important; }
            .main-container { background: white !important; border: none !important; box-shadow: none !important; max-width: 100% !important; padding: 1cm !important; border-radius: 0 !important; }
            .no-print { display: none !important; }
            .passport-header h1 { color: #2c1e0e !important; }
            .passport-header .subtitle { color: #5d4a3a !important; }
            .section-title { color: #2c1e0e !important; border-left-color: #2c1e0e !important; }
            .results-table th { background: #e0e0e0 !important; color: black !important; border-color: #999 !important; }
            .results-table td { color: black !important; border-color: #999 !important; }
            .result-value { color: black !important; }
            .result-missing { color: #999 !important; }
            .integral-rank { border-color: #2c1e0e !important; background: #f5f5f5 !important; }
            .integral-rank .rank-number { color: #2c1e0e !important; }
            .integral-rank .rank-label { color: #5d4a3a !important; }
            .personal-data { background: #f5f5f5 !important; border-color: #999 !important; }
            .personal-data input { background: white !important; border-color: #999 !important; color: black !important; }
            .deep-badge { background: #81c784 !important; color: #1a1a2e !important; }
        }
    </style>
</head>
<body>
<div class="cosmic-bg"></div>
<div class="main-container">
    <div class="passport-header">
        <div class="emblem">🌌</div>
        <h1>СЕМАНТИЧЕСКИЙ ПАСПОРТ</h1>
        <div class="subtitle">Идеатоника • Версия 2.0</div>
        <span class="deep-badge">🔬 УГЛУБЛЁННАЯ ДИАГНОСТИКА</span>
    </div>
    <div class="personal-data">
        <label>👤 Владелец паспорта (для печати):</label>
        <input type="text" id="inputName" placeholder="Ваше имя">
        <input type="text" id="inputSurname" placeholder="Ваша фамилия">
        <input type="date" id="inputDate" placeholder="Дата">
    </div>
    <div class="results-section">
        <div class="section-title">📊 Результаты углублённых тестов</div>
        <table class="results-table" id="resultsTable">
            <thead>
                <tr><th>Тест</th><th>Результат</th><th class="no-print">Действие</th></tr>
            </thead>
            <tbody id="resultsBody"></tbody>
        </table>
    </div>
    <div class="integral-rank" id="integralRank">
        <div class="rank-number" id="rankNumber">—</div>
        <div class="rank-label">Интегральный семантический ранг (углублённый)</div>
    </div>
    <div class="print-section no-print">
        <button class="print-btn" id="printBtn" disabled onclick="window.print()">🖨️ Распечатать Паспорт</button>
        <div class="print-hint" id="printHint"></div>
    </div>
    <div style="text-align: center;" class="no-print">
        <a href="hidden-tests.html" class="back-link">← Вернуться к углублённым тестам</a>
    </div>
</div>
<script>
(function() {
    const testList = [
        { key: 'ideatonika_deep_qs', name: '☀️ Qₛ (Свет / Тьма) [Углуб.]' },
        { key: 'ideatonika_deep_cs', name: '🎯 Cₛ (Лазер / Лампочка) [Углуб.]' },
        { key: 'ideatonika_deep_ts', name: '🌡️ Tₛ (Лёд / Пламя) [Углуб.]' },
        { key: 'ideatonika_deep_chi', name: '🔮 χ (Интуиция) [Углуб.]' },
        { key: 'ideatonika_deep_env', name: '🏠 Окружение (Храм / Бункер) [Углуб.]' },
        { key: 'ideatonika_deep_food', name: '🍽️ Еда (Светлая / Тёмная) [Углуб.]' }
    ];
    let completedCount = 0, totalNumericSum = 0, totalNumericCount = 0;
    const tbody = document.getElementById('resultsBody');
    const printBtn = document.getElementById('printBtn');
    const printHint = document.getElementById('printHint');
    const rankNumber = document.getElementById('rankNumber');
    testList.forEach(test => {
        const raw = localStorage.getItem(test.key);
        const tr = document.createElement('tr');
        const tdName = document.createElement('td');
        tdName.textContent = test.name; tr.appendChild(tdName);
        const tdValue = document.createElement('td');
        if (raw !== null) {
            tdValue.textContent = raw; tdValue.className = 'result-value'; completedCount++;
            const num = parseFloat(raw);
            if (!isNaN(num)) { totalNumericSum += num; totalNumericCount++; }
        } else { tdValue.textContent = '—'; tdValue.className = 'result-missing'; }
        tr.appendChild(tdValue);
        const tdAction = document.createElement('td');
        tdAction.className = 'no-print';
        const resetBtn = document.createElement('button');
        resetBtn.textContent = '🗑️ Обнулить';
        resetBtn.className = 'reset-btn';
        resetBtn.addEventListener('click', function() {
            if (confirm(`Вы точно хотите обнулить результат теста "${test.name}"?`)) {
                localStorage.removeItem(test.key); location.reload();
            }
        });
        tdAction.appendChild(resetBtn); tr.appendChild(tdAction);
        tbody.appendChild(tr);
    });
    const remaining = 6 - completedCount;
    if (remaining === 0) {
        printBtn.disabled = false;
        printHint.textContent = '✅ Все углублённые тесты пройдены! Паспорт готов к печати.';
        printHint.style.color = '#81c784';
    } else {
        printBtn.disabled = true;
        printHint.textContent = `⚠️ Чтобы распечатать Паспорт, пройдите все 6 углублённых тестов. Осталось: ${remaining}`;
        printHint.style.color = '#ef5350';
    }
    if (totalNumericCount > 0) {
        const avg = totalNumericSum / totalNumericCount;
        rankNumber.textContent = (avg >= 0 ? '+' : '') + Math.round(avg * 10) / 10;
    }
    document.getElementById('inputDate').value = new Date().toISOString().split('T')[0];
})();
</script>
</body>
</html>
