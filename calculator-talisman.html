<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Калькулятор Эффективности Талисмана • Идеатоника</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: linear-gradient(145deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            font-family: 'Georgia', 'Times New Roman', serif;
            padding: 2rem;
            display: flex; flex-direction: column; align-items: center;
        }
        .cosmic-bg { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 0; }
        .main-container {
            max-width: 800px; width: 100%; position: relative; z-index: 1;
            background: rgba(30, 40, 60, 0.85); backdrop-filter: blur(12px);
            border: 1px solid rgba(227, 184, 124, 0.4); border-radius: 32px;
            padding: 2.5rem; box-shadow: 0 20px 40px rgba(0,0,0,0.5);
        }
        h1 { font-size: 2.5rem; color: #f3e7c0; text-align: center; margin-bottom: 0.5rem; font-weight: 400; }
        .subtitle { text-align: center; color: #c0b090; font-style: italic; margin-bottom: 2rem; border-bottom: 1px solid #5d4a3a; padding-bottom: 1rem; }
        .calc-section { background: rgba(0,0,0,0.2); border-radius: 20px; padding: 2rem; margin-bottom: 2rem; border: 1px solid #5d4a3a; }
        .section-title { font-size: 1.4rem; color: #ffd54f; margin-bottom: 1.5rem; }
        .input-group { margin-bottom: 1.5rem; }
        .input-group label { display: flex; justify-content: space-between; align-items: center; color: #d0c8b8; font-size: 1rem; margin-bottom: 0.5rem; }
        .input-group label span { color: #ffd54f; font-weight: bold; font-size: 1.2rem; }
        .input-group input[type="range"] { width: 100%; -webkit-appearance: none; height: 8px; background: #5d4a3a; border-radius: 4px; outline: none; cursor: pointer; }
        .input-group input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; width: 22px; height: 22px; background: #ffd54f; border-radius: 50%; cursor: pointer; box-shadow: 0 0 10px rgba(255,215,80,0.5); }
        .input-group .range-labels { display: flex; justify-content: space-between; color: #706858; font-size: 0.8rem; margin-top: 0.3rem; }
        .input-group select { width: 100%; padding: 0.8rem 1rem; background: rgba(0,0,0,0.3); border: 1px solid #5d4a3a; border-radius: 10px; color: #f3e7c0; font-family: 'Georgia', serif; font-size: 1rem; }
        .input-group select option { background: #1a1a2e; color: #f3e7c0; }
        .result-box { background: rgba(255,215,80,0.1); border: 2px solid #ffd54f; border-radius: 20px; padding: 2rem; text-align: center; margin-top: 2rem; }
        .result-number { font-size: 5rem; font-weight: bold; color: #ffd54f; line-height: 1; }
        .result-label { color: #c0b090; font-size: 1.2rem; margin-top: 0.5rem; }
        .result-extra { color: #d0c8b8; font-size: 1rem; margin-top: 1rem; font-style: italic; }
        .result-bar { margin-top: 1.5rem; }
        .result-bar-row { display: flex; align-items: center; margin-bottom: 0.4rem; color: #a09080; font-size: 0.8rem; }
        .result-bar-label { width: 120px; text-align: right; margin-right: 0.8rem; }
        .result-bar-fill { height: 14px; border-radius: 7px; min-width: 2px; transition: width 0.3s; }
        .bar-material { background: #a1887f; }
        .bar-charge { background: #ffb74d; }
        .bar-ritual { background: #ffd54f; }
        .result-bar-value { margin-left: 0.5rem; color: #ffd54f; font-weight: bold; }
        .result-formula { color: #a09080; font-style: italic; font-size: 0.9rem; margin-top: 1rem; font-family: 'Courier New', monospace; }
        .back-link { display: inline-block; margin-top: 1.5rem; color: #ffd54f; text-decoration: none; border: 1px solid #ffd54f; padding: 0.6rem 1.5rem; border-radius: 30px; transition: 0.2s; }
        .back-link:hover { background: #ffd54f; color: #1a1a2e; }
    </style>
</head>
<body>
<div class="cosmic-bg"></div>
<div class="main-container">

    <h1>🔮 Эффективность талисмана</h1>
    <div class="subtitle">Калькулятор семантического заряда предмета (§38, §80, §84, AS-1)</div>

    <div class="calc-section">
        <div class="section-title">📐 Параметры талисмана и зарядки</div>

        <!-- Материал талисмана -->
        <div class="input-group">
            <label>💎 Материал талисмана:</label>
            <select id="materialSelect">
                <option value="4">Кварц / Горный хрусталь (C_sense=8, база +4)</option>
                <option value="5">Серебро освящённое (C_sense=8, база +5)</option>
                <option value="5">Золото (C_sense=9, база +5)</option>
                <option value="2" selected>Дерево (C_sense=5, база +2)</option>
                <option value="3">Медь (C_sense=6, база +3)</option>
                <option value="1">Железо / сталь (C_sense=5, база +1)</option>
                <option value="0">Пластик (C_sense=1, база +0)</option>
                <option value="3">Шунгит (C_sense=7, база +3)</option>
            </select>
        </div>

        <!-- Cₛ зарядчика -->
        <div class="input-group">
            <label>🎯 Когерентность заряжающего (Cₛ): <span id="csValue">0.7</span></label>
            <input type="range" id="csSlider" min="0.1" max="1" value="0.7" step="0.01">
            <div class="range-labels"><span>0.1 (рассеян)</span><span>0.5 (обычно)</span><span>1.0 (лазер)</span></div>
        </div>

        <!-- Время зарядки -->
        <div class="input-group">
            <label>⏱️ Время зарядки: <span id="timeValue">30</span> минут</label>
            <input type="range" id="timeSlider" min="1" max="120" value="30" step="1">
            <div class="range-labels"><span>1 мин</span><span>60 мин</span><span>120 мин</span></div>
        </div>

        <!-- Ритуал зарядки -->
        <div class="input-group">
            <label>🕯️ Ритуал зарядки:</label>
            <select id="ritualSelect">
                <option value="1.5">Освящение в храме / глубокая молитва (×1.5)</option>
                <option value="1.3">Медитация с визуализацией (×1.3)</option>
                <option value="1.1" selected>Спокойное намерение, в руках (×1.1)</option>
                <option value="0.8">Быстрое «намерение» на бегу (×0.8)</option>
                <option value="0.5">Без ритуала, просто лежит рядом (×0.5)</option>
            </select>
        </div>

        <!-- Возраст талисмана (намоленность) -->
        <div class="input-group">
            <label>📅 Возраст / история зарядок: <span id="ageValue">0</span> дней</label>
            <input type="range" id="ageSlider" min="0" max="365" value="0" step="1">
            <div class="range-labels"><span>0 (новый)</span><span>30 дней</span><span>365 дней (намолен)</span></div>
        </div>
    </div>

    <!-- Результат -->
    <div class="result-box" id="resultBox">
        <div class="result-number" id="resultNumber">—</div>
        <div class="result-label" id="resultLabel">Итоговый Qₛ талисмана</div>
        <div class="result-extra" id="resultExtra"></div>
        <div class="result-bar" id="resultBar"></div>
        <div class="result-formula" id="resultFormula"></div>
    </div>

    <div style="text-align: center;">
        <a href="semantic-calculators.html" class="back-link">← К списку калькуляторов</a>
    </div>

</div>

<script>
    const materialSelect = document.getElementById('materialSelect');
    const csSlider = document.getElementById('csSlider');
    const timeSlider = document.getElementById('timeSlider');
    const ritualSelect = document.getElementById('ritualSelect');
    const ageSlider = document.getElementById('ageSlider');
    const csValue = document.getElementById('csValue');
    const timeValue = document.getElementById('timeValue');
    const ageValue = document.getElementById('ageValue');
    const resultNumber = document.getElementById('resultNumber');
    const resultLabel = document.getElementById('resultLabel');
    const resultExtra = document.getElementById('resultExtra');
    const resultBar = document.getElementById('resultBar');
    const resultFormula = document.getElementById('resultFormula');

    csSlider.addEventListener('input', () => { csValue.textContent = parseFloat(csSlider.value).toFixed(2); calculate(); });
    timeSlider.addEventListener('input', () => { timeValue.textContent = parseInt(timeSlider.value); calculate(); });
    ageSlider.addEventListener('input', () => { ageValue.textContent = parseInt(ageSlider.value); calculate(); });
    [materialSelect, ritualSelect].forEach(s => s.addEventListener('change', calculate));

    function calculate() {
        const baseQ = parseInt(materialSelect.value);
        const C = parseFloat(csSlider.value);
        const minutes = parseInt(timeSlider.value);
        const ritualCoeff = parseFloat(ritualSelect.value);
        const ageDays = parseInt(ageSlider.value);

        // Вклад от зарядки: ΔQ = C · ln(1 + t/10) · ритуал
        const chargeDelta = C * Math.log(1 + minutes / 10) * ritualCoeff;
        
        // Бонус за намоленность (возраст) — до +3 за год
        const ageBonus = Math.min(3, ageDays / 120);
        
        // Итоговый Qₛ
        const totalQ = baseQ + chargeDelta + ageBonus;
        const clampedQ = Math.round(Math.max(0, Math.min(10, totalQ)) * 10) / 10;

        resultNumber.textContent = (clampedQ >= 0 ? '+' : '') + clampedQ.toFixed(1);
        resultLabel.textContent = 'Итоговый Qₛ талисмана (из 10)';

        // Интерпретация
        let extra = '';
        if (clampedQ >= 8) extra = '🌟 Легендарный талисман! Сравним с намоленной иконой. Мощная защита.';
        else if (clampedQ >= 6) extra = '💎 Сильный талисман. Реально помогает, чувствуется в руке.';
        else if (clampedQ >= 4) extra = '🔮 Хороший талисман. Мягко работает, поднимает настроение.';
        else if (clampedQ >= 2) extra = '🪨 Слабый талисман. Почти не чувствуется. Зарядите ещё.';
        else extra = '📦 Почти без заряда. Как обычный предмет. Нужна зарядка с высокой Cₛ.';
        resultExtra.textContent = extra;

        // Столбчатая диаграмма
        const materialWidth = Math.min(100, (baseQ / 10) * 200);
        const chargeWidth = Math.min(150, chargeDelta * 30);
        const ageWidth = Math.min(60, ageBonus * 30);
        resultBar.innerHTML = `
            <div class="result-bar-row"><span class="result-bar-label">Материал:</span><span class="result-bar-fill bar-material" style="width:${materialWidth}px"></span><span class="result-bar-value">${baseQ.toFixed(1)}</span></div>
            <div class="result-bar-row"><span class="result-bar-label">Зарядка:</span><span class="result-bar-fill bar-charge" style="width:${chargeWidth}px"></span><span class="result-bar-value">+${chargeDelta.toFixed(1)}</span></div>
            <div class="result-bar-row"><span class="result-bar-label">Намоленность:</span><span class="result-bar-fill bar-ritual" style="width:${ageWidth}px"></span><span class="result-bar-value">+${ageBonus.toFixed(1)}</span></div>
        `;

        resultFormula.textContent = `Q = ${baseQ} + ${C.toFixed(2)} · ln(1 + ${minutes}/10) · ${ritualCoeff} + ${ageBonus.toFixed(1)} = ${clampedQ.toFixed(1)}`;
    }

    calculate();
</script>

</body>
</html>
