<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Калькулятор Эффекта Плацебо • Идеатоника</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: linear-gradient(145deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            font-family: 'Georgia', 'Times New Roman', serif;
            padding: 2rem;
            display: flex; flex-direction: column; align-items: center;
        }
        .cosmic-bg { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 0; }
        .main-container {
            max-width: 800px; width: 100%; position: relative; z-index: 1;
            background: rgba(30, 40, 60, 0.85); backdrop-filter: blur(12px);
            border: 1px solid rgba(227, 184, 124, 0.4); border-radius: 32px;
            padding: 2.5rem; box-shadow: 0 20px 40px rgba(0,0,0,0.5);
        }
        h1 { font-size: 2.5rem; color: #f3e7c0; text-align: center; margin-bottom: 0.5rem; font-weight: 400; }
        .subtitle { text-align: center; color: #c0b090; font-style: italic; margin-bottom: 2rem; border-bottom: 1px solid #5d4a3a; padding-bottom: 1rem; }
        .calc-section { background: rgba(0,0,0,0.2); border-radius: 20px; padding: 2rem; margin-bottom: 2rem; border: 1px solid #5d4a3a; }
        .section-title { font-size: 1.4rem; color: #ffd54f; margin-bottom: 1.5rem; }
        .input-group { margin-bottom: 1.5rem; }
        .input-group label { display: flex; justify-content: space-between; align-items: center; color: #d0c8b8; font-size: 1rem; margin-bottom: 0.5rem; }
        .input-group label span { color: #ffd54f; font-weight: bold; font-size: 1.2rem; }
        .input-group input[type="range"] { width: 100%; -webkit-appearance: none; height: 8px; background: #5d4a3a; border-radius: 4px; outline: none; cursor: pointer; }
        .input-group input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; width: 22px; height: 22px; background: #ffd54f; border-radius: 50%; cursor: pointer; box-shadow: 0 0 10px rgba(255,215,80,0.5); }
        .input-group .range-labels { display: flex; justify-content: space-between; color: #706858; font-size: 0.8rem; margin-top: 0.3rem; }
        .input-group select { width: 100%; padding: 0.8rem 1rem; background: rgba(0,0,0,0.3); border: 1px solid #5d4a3a; border-radius: 10px; color: #f3e7c0; font-family: 'Georgia', serif; font-size: 1rem; }
        .input-group select option { background: #1a1a2e; color: #f3e7c0; }
        .result-box { background: rgba(255,215,80,0.1); border: 2px solid #ffd54f; border-radius: 20px; padding: 2rem; text-align: center; margin-top: 2rem; }
        .result-number { font-size: 5rem; font-weight: bold; color: #ffd54f; line-height: 1; }
        .result-label { color: #c0b090; font-size: 1.2rem; margin-top: 0.5rem; }
        .result-extra { color: #d0c8b8; font-size: 1rem; margin-top: 1rem; font-style: italic; }
        .result-stats { color: #a09080; font-size: 0.9rem; margin-top: 0.5rem; font-style: italic; }
        .result-formula { color: #a09080; font-style: italic; font-size: 0.9rem; margin-top: 1rem; font-family: 'Courier New', monospace; }
        .back-link { display: inline-block; margin-top: 1.5rem; color: #ffd54f; text-decoration: none; border: 1px solid #ffd54f; padding: 0.6rem 1.5rem; border-radius: 30px; transition: 0.2s; }
        .back-link:hover { background: #ffd54f; color: #1a1a2e; }
    </style>
</head>
<body>
<div class="cosmic-bg"></div>
<div class="main-container">

    <h1>💊 Эффект Плацебо</h1>
    <div class="subtitle">Калькулятор силы веры в исцеление (Формула P = Q²/(θ²+Q²) · e^(-t/τ))</div>

    <div class="calc-section">
        <div class="section-title">🙏 Параметры веры</div>

        <div class="input-group">
            <label>💪 Сила веры в лечение (Q_belief): <span id="beliefValue">5</span> из 10</label>
            <input type="range" id="beliefSlider" min="0" max="10" value="5" step="0.1">
            <div class="range-labels"><span>0 (полный скепсис)</span><span>10 (абсолютная вера)</span></div>
        </div>

        <div class="input-group">
            <label>🎯 Когерентность пациента (Cₛ): <span id="csValue">0.6</span></label>
            <input type="range" id="csSlider" min="0.1" max="1" value="0.6" step="0.01">
            <div class="range-labels"><span>0.1 (хаос, страх)</span><span>1.0 (спокоен, сфокусирован)</span></div>
        </div>

        <div class="input-group">
            <label>👨‍⚕️ Авторитет врача / источника лечения:</label>
            <select id="doctorSelect">
                <option value="2.5">Всемирно известный профессор, «светило» (×2.5)</option>
                <option value="1.8">Опытный врач с хорошей репутацией (×1.8)</option>
                <option value="1.2">Обычный врач, доверие среднее (×1.2)</option>
                <option value="1.0" selected>Неизвестный специалист (×1.0)</option>
                <option value="0.6">Шарлатан, сомнительный целитель (×0.6)</option>
                <option value="0.3">Самолечение, интернет-совет (×0.3)</option>
            </select>
        </div>

        <div class="input-group">
            <label>💊 Тип «лекарства»:</label>
            <select id="drugSelect">
                <option value="1.8">Инъекция / капельница (сильное впечатление) (×1.8)</option>
                <option value="1.5">Таблетки в блистере, «серьёзное» лекарство (×1.5)</option>
                <option value="1.2">Капсулы, микстура (×1.2)</option>
                <option value="1.0" selected>Обычные таблетки (×1.0)</option>
                <option value="0.7">Гомеопатия, «лёгкое» средство (×0.7)</option>
            </select>
        </div>

        <div class="input-group">
            <label>💰 Цена лечения (эффект «дорогого плацебо»):</label>
            <select id="priceSelect">
                <option value="1.6">Очень дорогое (×1.6)</option>
                <option value="1.3">Дорогое (×1.3)</option>
                <option value="1.0" selected>Средняя цена (×1.0)</option>
                <option value="0.8">Дёшево (×0.8)</option>
                <option value="0.5">Бесплатно (×0.5)</option>
            </select>
        </div>

        <div class="input-group">
            <label>⏳ Время с момента приёма: <span id="timeValue">1</span> час</label>
            <input type="range" id="timeSlider" min="0" max="72" value="1" step="0.5">
            <div class="range-labels"><span>0 (сразу)</span><span>24 ч</span><span>72 ч</span></div>
        </div>
    </div>

    <!-- Результат -->
    <div class="result-box" id="resultBox">
        <div class="result-number" id="resultNumber">—</div>
        <div class="result-label" id="resultLabel">Вероятность плацебо-эффекта</div>
        <div class="result-extra" id="resultExtra"></div>
        <div class="result-stats" id="resultStats"></div>
        <div class="result-formula" id="resultFormula"></div>
    </div>

    <div style="text-align: center;">
        <a href="semantic-calculators.html" class="back-link">← К списку калькуляторов</a>
    </div>

</div>

<script>
    const beliefSlider = document.getElementById('beliefSlider');
    const csSlider = document.getElementById('csSlider');
    const doctorSelect = document.getElementById('doctorSelect');
    const drugSelect = document.getElementById('drugSelect');
    const priceSelect = document.getElementById('priceSelect');
    const timeSlider = document.getElementById('timeSlider');
    const beliefValue = document.getElementById('beliefValue');
    const csValue = document.getElementById('csValue');
    const timeValue = document.getElementById('timeValue');
    const resultNumber = document.getElementById('resultNumber');
    const resultLabel = document.getElementById('resultLabel');
    const resultExtra = document.getElementById('resultExtra');
    const resultStats = document.getElementById('resultStats');
    const resultFormula = document.getElementById('resultFormula');

    beliefSlider.addEventListener('input', () => { beliefValue.textContent = parseFloat(beliefSlider.value).toFixed(1); calculate(); });
    csSlider.addEventListener('input', () => { csValue.textContent = parseFloat(csSlider.value).toFixed(2); calculate(); });
    doctorSelect.addEventListener('change', calculate);
    drugSelect.addEventListener('change', calculate);
    priceSelect.addEventListener('change', calculate);
    timeSlider.addEventListener('input', () => { timeValue.textContent = parseFloat(timeSlider.value).toFixed(1); calculate(); });

    function calculate() {
        const Qraw = parseFloat(beliefSlider.value);
        const C = parseFloat(csSlider.value);
        const doctorCoeff = parseFloat(doctorSelect.value);
        const drugCoeff = parseFloat(drugSelect.value);
        const priceCoeff = parseFloat(priceSelect.value);
        const t = parseFloat(timeSlider.value);

        // Эффективный заряд веры = базовая вера · Cₛ · авторитет · лекарство · цена
        const Qeff = Qraw * (0.3 + 0.7 * C) * doctorCoeff * drugCoeff * priceCoeff;

        // Порог плацебо (зависит от скепсиса — чем выше Qraw, тем ниже порог)
        const theta0 = 10;
        const theta = theta0 / (1 + Qraw * 0.3);

        // Время затухания эффекта (часы)
        const tauDecay = 24;

        // Вероятность плацебо-эффекта
        const Pmax = (Qeff * Qeff) / (theta * theta + Qeff * Qeff);
        const P = Pmax * Math.exp(-t / tauDecay);

        const percent = (P * 100).toFixed(1);

        resultNumber.textContent = percent + '%';
        resultLabel.textContent = 'Вероятность плацебо-эффекта';

        let extra = '';
        if (P >= 0.8) {
            extra = '🌟 Мощнейший плацебо-эффект! Высока вероятность значительного улучшения.';
        } else if (P >= 0.5) {
            extra = '✅ Сильный плацебо-эффект. Ожидается заметное облегчение симптомов.';
        } else if (P >= 0.25) {
            extra = '👍 Умеренный плацебо-эффект. Частичное улучшение возможно.';
        } else if (P >= 0.1) {
            extra = '🤏 Слабый плацебо-эффект. Эффект незначителен.';
        } else if (P >= 0.02) {
            extra = '🌫️ Очень слабый эффект. Скорее всего, лечение не подействует.';
        } else {
            extra = '💔 Плацебо-эффект отсутствует. Даже вера не поможет.';
        }
        resultExtra.textContent = extra;

        resultStats.textContent = `Эффективный заряд веры: ${Qeff.toFixed(1)} / Порог: ${theta.toFixed(1)} / Пиковая вероятность: ${(Pmax*100).toFixed(1)}%`;

        resultFormula.textContent = `Q_eff = ${Qraw.toFixed(1)} · (0.3 + 0.7·${C.toFixed(2)}) · ${doctorCoeff.toFixed(1)} · ${drugCoeff.toFixed(1)} · ${priceCoeff.toFixed(1)} = ${Qeff.toFixed(1)} | P = ${Qeff.toFixed(1)}²/(${theta.toFixed(1)}² + ${Qeff.toFixed(1)}²) · e^(-${t.toFixed(1)}/${tauDecay}) = ${P.toFixed(3)}`;
    }

    calculate();
</script>

</body>
</html>
