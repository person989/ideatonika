<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Пограничный Слой • Идеатоника</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: linear-gradient(145deg, #0d1117 0%, #161b22 100%); min-height: 100vh; font-family: 'Georgia', 'Times New Roman', serif; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 1rem; overflow-x: hidden; }
        .stars-bg { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 0; }
        .star { position: absolute; background: white; border-radius: 50%; animation: twinkle var(--duration) ease-in-out infinite; animation-delay: var(--delay); opacity: 0; }
        @keyframes twinkle { 0%,100% { opacity:0.2; transform:scale(1); } 50% { opacity:1; transform:scale(1.8); } }
        .main-container { position: relative; z-index: 1; width: 100%; max-width: 1100px; background: rgba(22,27,34,0.85); backdrop-filter: blur(12px); border: 1px solid rgba(227,184,124,0.3); border-radius: 32px; padding: 2rem; box-shadow: 0 20px 40px rgba(0,0,0,0.6); }
        .header { text-align: center; margin-bottom: 1.5rem; }
        .header h1 { font-size: 2.5rem; font-weight: 400; letter-spacing: 3px; color: #f3e7c0; text-shadow: 0 0 20px rgba(255,215,80,0.4); margin-bottom: 0.3rem; }
        .header .subtitle { font-size: 1rem; color: #c0b090; font-style: italic; border-bottom: 1px solid #5d4a3a; display: inline-block; padding-bottom: 0.4rem; }
        .canvas-wrapper { position: relative; width: 100%; background: radial-gradient(ellipse at center, #1a2030 0%, #0a0e14 100%); border-radius: 20px; border: 1px solid #5d4a3a; overflow: hidden; margin-bottom: 1.5rem; box-shadow: inset 0 0 80px rgba(0,0,0,0.5); }
        canvas { display: block; width: 100%; height: auto; }
        .controls-panel { background: rgba(0,0,0,0.3); border: 1px solid #5d4a3a; border-radius: 20px; padding: 1.5rem 2rem; }
        .controls-title { font-size: 1.2rem; color: #ffd54f; margin-bottom: 1.2rem; text-align: center; letter-spacing: 1px; }
        .slider-group { margin-bottom: 1.2rem; }
        .slider-group label { display: flex; justify-content: space-between; align-items: center; color: #d0c8b8; font-size: 0.95rem; margin-bottom: 0.4rem; }
        .slider-group label .param-value { color: #ffd54f; font-weight: bold; font-size: 1.1rem; min-width: 50px; text-align: right; }
        .slider-group input[type="range"] { width: 100%; -webkit-appearance: none; height: 8px; background: linear-gradient(90deg, #3a2a4a, #5d4a3a, #3a2a4a); border-radius: 4px; outline: none; cursor: pointer; }
        .slider-group input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; width: 24px; height: 24px; background: radial-gradient(circle at 40% 40%, #ffe082, #ff8f00); border-radius: 50%; cursor: pointer; box-shadow: 0 0 15px rgba(255,215,80,0.6); border: 2px solid #ffd54f; }
        .range-labels { display: flex; justify-content: space-between; color: #706858; font-size: 0.75rem; margin-top: 0.2rem; }
        .info-box { margin-top: 1.5rem; padding: 1rem 1.5rem; background: rgba(255,215,80,0.05); border: 1px solid rgba(255,215,80,0.2); border-radius: 12px; text-align: center; color: #c0b090; font-size: 0.9rem; font-style: italic; }
        .info-box .formula-display { font-family: 'Courier New', monospace; color: #ffd54f; font-size: 1rem; margin: 0.3rem 0; }
        .back-row { text-align: center; margin-top: 1.5rem; }
        .back-link { display: inline-block; color: #ffd54f; text-decoration: none; border: 1px solid #ffd54f; padding: 0.6rem 1.5rem; border-radius: 30px; transition: 0.3s; font-size: 0.9rem; }
        .back-link:hover { background: #ffd54f; color: #0d1117; }
        @media (max-width: 700px) { .main-container { padding: 1rem; } .header h1 { font-size: 1.8rem; } .controls-panel { padding: 1rem; } }
    </style>
</head>
<body>
<div class="stars-bg" id="starsBg"></div>
<div class="main-container">
    <div class="header"><h1>📐 Пограничный Слой</h1><div class="subtitle">Визуализация §115: Qₛ прилипает к шероховатой поверхности</div></div>
    <div class="canvas-wrapper" id="canvasWrapper"><canvas id="boundaryCanvas"></canvas></div>
    <div class="controls-panel">
        <div class="controls-title">🎛️ Параметры</div>
        <div class="slider-group">
            <label><span>🪨 Шероховатость</span><span class="param-value" id="roughValue">Гладкая</span></label>
            <input type="range" id="roughSlider" min="0" max="100" value="0" step="1">
            <div class="range-labels"><span>0 (полировка)</span><span>50</span><span>100 (наждак)</span></div>
        </div>
        <div class="slider-group">
            <label><span>💨 Скорость потока</span><span class="param-value" id="flowValue">5.0</span></label>
            <input type="range" id="flowSlider" min="1" max="10" value="5" step="0.5">
            <div class="range-labels"><span>1</span><span>5</span><span>10</span></div>
        </div>
        <div class="slider-group">
            <label><span>☀️ Qₛ</span><span class="param-value" id="qsValue">+5</span></label>
            <input type="range" id="qsSlider" min="-10" max="10" value="5" step="1">
            <div class="range-labels"><span>-10</span><span>0</span><span>+10</span></div>
        </div>
        <div class="info-box"><span id="statusText" style="color:#ffd54f;font-weight:bold;">🌊 Ламинарный слой</span><div class="formula-display" id="formulaDisplay"></div></div>
    </div>
    <div class="back-row"><a href="visualizations.html" class="back-link">← К списку визуализаций</a></div>
</div>

<script>
(function(){
    const bg=document.getElementById('starsBg');
    for(let i=0;i<100;i++){const d=document.createElement('div');d.className='star';d.style.left=Math.random()*100+'%';d.style.top=Math.random()*100+'%';const s=Math.random()*2.5+0.5;d.style.width=s+'px';d.style.height=s+'px';d.style.setProperty('--duration',(Math.random()*4+2)+'s');d.style.setProperty('--delay',(Math.random()*5)+'s');bg.appendChild(d);}
})();

const canvas=document.getElementById('boundaryCanvas');
const ctx=canvas.getContext('2d');
const wrapper=document.getElementById('canvasWrapper');
let time=0,animId;
let freeParticles=[];
let stuckParticles=[];
const MAX_FREE=200;
const MAX_STUCK=500;

function rebuildParticles(){
    const w=canvas.width,h=canvas.height;
    const surfY=h*0.65;
    freeParticles=[];
    stuckParticles=[];
    for(let i=0;i<MAX_FREE;i++){
        freeParticles.push({
            x:Math.random()*w,
            y:10+Math.random()*(surfY-15),
            vx:(2+Math.random()*6),
            vy:0,
            stuck:false,
            stickTimer:0
        });
    }
}

function resize(){
    const r=wrapper.getBoundingClientRect();
    canvas.width=r.width;
    canvas.height=Math.max(500,Math.min(650,r.width*0.7));
    wrapper.style.height=canvas.height+'px';
    rebuildParticles();
}
resize();window.addEventListener('resize',resize);

const roughSlider=document.getElementById('roughSlider');
const flowSlider=document.getElementById('flowSlider');
const qsSlider=document.getElementById('qsSlider');
const roughValue=document.getElementById('roughValue');
const flowValue=document.getElementById('flowValue');
const qsValue=document.getElementById('qsValue');
const statusText=document.getElementById('statusText');
const formulaDisplay=document.getElementById('formulaDisplay');

roughSlider.oninput=function(){
    const r=parseInt(this.value);
    if(r<10) roughValue.textContent='Гладкая';
    else if(r<40) roughValue.textContent='Слегка шероховатая';
    else if(r<70) roughValue.textContent='Шероховатая';
    else roughValue.textContent='Очень шероховатая';
    updateInfo();
};
flowSlider.oninput=function(){flowValue.textContent=parseFloat(this.value).toFixed(1);updateInfo();};
qsSlider.oninput=function(){qsValue.textContent=(parseInt(this.value)>=0?'+':'')+parseInt(this.value);};

function updateInfo(){
    const roughness=parseInt(roughSlider.value)/100;
    if(roughness<0.1) statusText.textContent='🌊 Ламинарный — Qₛ скользит мимо';
    else if(roughness<0.4) statusText.textContent='🌊 Переходный — Qₛ начинает прилипать';
    else if(roughness<0.7) statusText.textContent='🌪️ Турбулентный — Qₛ активно прилипает';
    else statusText.textContent='🌪️ Сильно турбулентный — максимальное накопление!';
    formulaDisplay.textContent='Прилипло: '+stuckParticles.length+' частиц Qₛ';
}
updateInfo();

function getQSColor(qs,alpha){
    const absQ=Math.abs(qs);
    const norm=Math.min(1,absQ/10);
    if(absQ<0.5){const g=Math.floor(100*norm+30);return `rgba(${g},${g},${g},${alpha*0.3})`;}
    if(qs>=0){return `rgba(${Math.floor(30+norm*225)},${Math.floor(5+norm*235)},${Math.floor(80*(1-norm)+255*norm)},${alpha})`;}
    return `rgba(${Math.floor(80*(1-norm)+30*norm)},${Math.floor(40*(1-norm)+5*norm)},${Math.floor(30+norm*200)},${alpha})`;
}

function drawFrame(){
    const roughness=parseInt(roughSlider.value)/100;
    const flowSpeed=parseFloat(flowSlider.value);
    const qs=parseFloat(qsSlider.value);
    const w=canvas.width,h=canvas.height;
    time+=0.016;
    const surfaceY=h*0.65;
    const blThickness=20+roughness*120;

    ctx.fillStyle='#060a10';
    ctx.fillRect(0,0,w,h);
    ctx.strokeStyle='rgba(255,255,255,0.02)';ctx.lineWidth=1;
    for(let x=0;x<w;x+=50){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,h);ctx.stroke();}
    for(let y=0;y<h;y+=50){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(w,y);ctx.stroke();}

    // Материал
    const matGrad=ctx.createLinearGradient(0,surfaceY,0,h);
    matGrad.addColorStop(0,'rgba(80,70,60,0.95)');
    matGrad.addColorStop(1,'rgba(40,30,20,0.95)');
    ctx.fillStyle=matGrad;
    ctx.fillRect(0,surfaceY,w,h-surfaceY);

    // Шероховатости
    if(roughness>0.01){
        for(let x=0;x<w;x+=6+Math.floor((1-roughness)*10)){
            const hh=roughness*18;
            const y=surfaceY+Math.sin(x*0.5)*roughness*6;
            ctx.fillStyle='rgba(100,90,80,0.6)';
            ctx.beginPath();ctx.ellipse(x,y,3+roughness*8,hh,0,0,Math.PI*2);ctx.fill();
        }
    }
    ctx.strokeStyle='rgba(255,255,255,0.3)';ctx.lineWidth=1;
    ctx.beginPath();ctx.moveTo(0,surfaceY);ctx.lineTo(w,surfaceY);ctx.stroke();

    // Обновление свободных частиц
    for(const p of freeParticles){
        if(p.stuck){
            p.stickTimer-=0.016;
            if(p.stickTimer<=0){p.stuck=false;p.y=surfaceY-blThickness*0.3;p.vx=flowSpeed*2;p.vy=0;}
            else continue;
        }
        const heightAbove=Math.max(0.5,surfaceY-p.y);
        const inBL=heightAbove<blThickness;
        const blFactor=Math.min(1,heightAbove/blThickness);
        const targetVx=flowSpeed*3*(0.03+0.97*blFactor);
        p.vx+=(targetVx-p.vx)*0.1;
        if(inBL&&roughness>0.1){
            const force=roughness*(1-blFactor);
            p.vy+=(0.5+force*4)*0.03;
            p.vx*=0.95;
            if(p.y>=surfaceY-3&&roughness>0.3&&Math.random()<roughness*0.08){
                p.stuck=true;
                p.stickTimer=3+Math.random()*8;
                p.y=surfaceY+Math.random()*roughness*10;
                p.vx=0;p.vy=0;
                stuckParticles.push({x:p.x,y:p.y,alpha:0.9});
                if(stuckParticles.length>MAX_STUCK) stuckParticles.shift();
            }
        }else{p.vy*=0.9;}
        p.x+=p.vx;p.y+=p.vy;
        if(p.y>=surfaceY-1&&!p.stuck){p.y=surfaceY-1;p.vy=-Math.abs(p.vy)*0.3;}
        if(p.y<=5){p.y=5;p.vy=Math.abs(p.vy)*0.3;}
        if(p.x>w+50){p.x=-50;p.y=10+Math.random()*(surfaceY-20);p.stuck=false;}
        if(p.x<-50){p.x=w+50;}
    }

    // Поддержание количества
    while(freeParticles.length<MAX_FREE){
        freeParticles.push({x:-50-Math.random()*100,y:10+Math.random()*(surfaceY-20),vx:flowSpeed*3,vy:0,stuck:false,stickTimer:0});
    }

    // Рисуем прилипшие
    for(const p of stuckParticles){
        p.alpha*=0.999;
        ctx.fillStyle=getQSColor(qs,p.alpha*0.7);
        ctx.beginPath();ctx.arc(p.x,p.y,1.8,0,Math.PI*2);ctx.fill();
    }

    // Рисуем свободные
    for(const p of freeParticles){
        if(p.stuck) continue;
        const heightAbove=Math.max(0.5,surfaceY-p.y);
        const inBL=heightAbove<blThickness;
        let alpha=0.5,size=2.5;
        if(inBL){alpha=0.2+0.5*(1-heightAbove/blThickness);size=1.5+2*(1-heightAbove/blThickness);}
        ctx.fillStyle=getQSColor(qs,alpha);
        ctx.beginPath();ctx.arc(p.x,p.y,size,0,Math.PI*2);ctx.fill();
    }

    // Граница слоя
    const blTop=surfaceY-blThickness;
    if(blTop>10){
        ctx.strokeStyle='rgba(255,200,50,0.3)';ctx.lineWidth=1.5;ctx.setLineDash([5,7]);
        ctx.beginPath();for(let x=0;x<w;x+=10)ctx.lineTo(x,blTop+Math.sin(x*0.05)*roughness*15);
        ctx.stroke();ctx.setLineDash([]);
    }

    // Подписи
    ctx.fillStyle='rgba(255,200,50,0.8)';ctx.font='bold 14px Georgia,serif';ctx.textAlign='left';
    if(blTop>20) ctx.fillText('Пограничный слой (δ≈'+Math.round(blThickness)+' px)',20,blTop-10);
    ctx.fillStyle='rgba(255,255,255,0.5)';ctx.font='13px Georgia,serif';
    ctx.fillText('Свободный поток Qₛ',20,25);
    ctx.fillText('Прилипло: '+stuckParticles.length+' частиц',20,h-20);
    const layerType=roughness<0.15?'ЛАМИНАРНЫЙ':roughness<0.5?'ПЕРЕХОДНЫЙ':'ТУРБУЛЕНТНЫЙ';
    ctx.fillStyle='rgba(255,255,255,0.8)';ctx.font='bold 15px Georgia,serif';ctx.textAlign='center';
    ctx.fillText(layerType,w/2,blTop>30?blTop-40:surfaceY-50);

    animId=requestAnimationFrame(drawFrame);
}
drawFrame();
window.addEventListener('beforeunload',()=>{if(animId)cancelAnimationFrame(animId);});
</script>
</body>
</html>
