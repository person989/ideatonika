<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Тест: Живая или Мёртвая вода? • Идеатоника</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: linear-gradient(145deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            font-family: 'Georgia', 'Times New Roman', serif;
            padding: 2rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            transition: background 0.5s ease;
        }
        .cosmic-bg {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle at 30% 40%, rgba(255,215,150,0.08) 0%, transparent 50%),
                        radial-gradient(circle at 80% 70%, rgba(100,150,255,0.05) 0%, transparent 60%);
            pointer-events: none; z-index: 0;
        }
        .test-container {
            max-width: 700px;
            width: 100%;
            position: relative;
            z-index: 1;
            background: rgba(30, 40, 60, 0.85);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(227, 184, 124, 0.4);
            border-radius: 32px;
            padding: 2.5rem;
            box-shadow: 0 20px 40px rgba(0,0,0,0.5);
            transition: border-color 0.3s ease;
        }
        
        .test-header {
            text-align: center;
            margin-bottom: 2rem;
        }
        .test-header h1 {
            font-size: 2.2rem;
            color: #f3e7c0;
            margin-bottom: 0.5rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        .progress-bar {
            width: 100%;
            height: 6px;
            background: rgba(0,0,0,0.3);
            border-radius: 3px;
            margin: 1.5rem 0;
        }
        .progress-fill {
            height: 100%;
            background: #4fc3f7;
            border-radius: 3px;
            width: 0%;
            transition: width 0.3s ease;
        }
        .progress-text {
            text-align: right;
            color: #a09080;
            font-size: 0.8rem;
            margin-top: 0.3rem;
        }
        
        .question-box {
            margin-bottom: 2rem;
        }
        .question-text {
            color: #f3e7c0;
            font-size: 1.3rem;
            margin-bottom: 1.5rem;
            line-height: 1.5;
        }
        .options {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .option {
            background: rgba(0,0,0,0.2);
            border: 1px solid #5d4a3a;
            border-radius: 16px;
            padding: 1rem 1.5rem;
            cursor: pointer;
            transition: all 0.2s ease;
            color: #d0c8b8;
            display: flex;
            align-items: center;
            gap: 15px;
        }
        .option:hover {
            background: rgba(79, 195, 247, 0.15);
            border-color: #4fc3f7;
        }
        .option.selected {
            background: rgba(79, 195, 247, 0.25);
            border-color: #4fc3f7;
            color: #f3e7c0;
        }
        .option-marker {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            border: 2px solid #5d4a3a;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }
        .option.selected .option-marker {
            border-color: #4fc3f7;
            background: #4fc3f7;
            box-shadow: 0 0 10px #4fc3f7;
        }
        .option.selected .option-marker::after {
            content: "✓";
            color: #1a1a2e;
            font-weight: bold;
        }
        .option-text {
            flex: 1;
        }
        
        .nav-buttons {
            display: flex;
            justify-content: space-between;
            margin-top: 2rem;
            gap: 15px;
        }
        .btn {
            background: transparent;
            border: 1.5px solid #4fc3f7;
            color: #4fc3f7;
            padding: 0.8rem 1.8rem;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 40px;
            cursor: pointer;
            transition: 0.2s;
            font-family: inherit;
        }
        .btn:hover {
            background: #4fc3f7;
            color: #1a1a2e;
        }
        .btn:disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }
        .btn-secondary {
            border-color: #5d4a3a;
            color: #a09080;
        }
        .btn-secondary:hover {
            background: #5d4a3a;
            color: #d0c8b8;
        }
        
        .result-container {
            text-align: center;
        }
        .result-score {
            font-size: 5rem;
            font-weight: bold;
            margin: 1rem 0;
        }
        .result-scale {
            font-size: 1.2rem;
            margin-bottom: 1.5rem;
        }
        .result-comment {
            background: rgba(0,0,0,0.2);
            border-radius: 20px;
            padding: 1.5rem;
            margin: 1.5rem 0;
            line-height: 1.6;
        }
        .result-advice {
            background: rgba(79, 195, 247, 0.1);
            border-left: 4px solid #4fc3f7;
            padding: 1.2rem 1.5rem;
            border-radius: 0 12px 12px 0;
            text-align: left;
        }
        
        .hidden {
            display: none !important;
        }
        
        .back-link {
            display: inline-block;
            margin-top: 1.5rem;
            color: #4fc3f7;
            text-decoration: none;
            font-size: 0.9rem;
        }
        .back-link:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body id="mainBody">
<div class="cosmic-bg"></div>
<div class="test-container" id="testContainer">
    
    <div class="test-header">
        <h1>
            <span>💧</span>
            <span id="testTitle">Живая или Мёртвая вода?</span>
            <span>🌊</span>
        </h1>
        <div class="progress-bar">
            <div class="progress-fill" id="progressFill"></div>
        </div>
        <div class="progress-text" id="progressText">Вопрос 1 из 7</div>
    </div>
    
    <div id="questionContainer"></div>
    
    <div class="nav-buttons">
        <button class="btn btn-secondary" id="prevBtn" disabled>← Назад</button>
        <button class="btn btn-secondary" id="exitBtn">🚪 Выйти</button>
        <button class="btn" id="nextBtn">Далее →</button>
    </div>
    
    <div style="text-align: center;">
        <a href="diagnostics-hub.html" class="back-link">← Вернуться в Хаб Диагностики</a>
    </div>
</div>

<script>
    (function() {
        const questions = [
            {
                text: "Какую воду вы пьёте чаще всего?",
                options: [
                    { text: "Водопроводную (из-под крана), не фильтруя", value: -3 },
                    { text: "Водопроводную, но фильтрованную (кувшин, фильтр)", value: -1 },
                    { text: "Бутилированную (из магазина, 19 л или 5 л)", value: 0 },
                    { text: "Родниковую / из проверенного источника", value: 3 },
                    { text: "Талую / структурированную (заморозка, шунгит, кварц)", value: 5 },
                    { text: "Освящённую / заряженную молитвой или намерением", value: 7 }
                ]
            },
            {
                text: "В чём вы обычно храните воду для питья?",
                options: [
                    { text: "В пластиковых бутылках (ПЭТ)", value: -3 },
                    { text: "В пластиковом кувшине или баке", value: -1 },
                    { text: "В металлической или керамической ёмкости", value: 1 },
                    { text: "В стеклянной бутылке или графине", value: 3 },
                    { text: "В серебряном или медном сосуде", value: 5 }
                ]
            },
            {
                text: "Как часто вы пьёте чистую воду (не чай, не сок) в течение дня?",
                options: [
                    { text: "Почти не пью. Только когда совсем жажда", value: -2 },
                    { text: "1-2 стакана в день", value: -1 },
                    { text: "3-5 стаканов", value: 1 },
                    { text: "6-8 стаканов (примерно 1.5-2 литра)", value: 3 },
                    { text: "Больше 2 литров, пью осознанно и с благодарностью", value: 4 }
                ]
            },
            {
                text: "Что вы чувствуете после стакана чистой воды?",
                options: [
                    { text: "Ничего особенного, просто утоляю жажду", value: 0 },
                    { text: "Иногда чувствую тяжесть или вздутие", value: -1 },
                    { text: "Лёгкость, прояснение в голове", value: 2 },
                    { text: "Прилив сил, ощущение «очищения»", value: 4 },
                    { text: "Благодарность, ощущение связи с природой", value: 5 }
                ]
            },
            {
                text: "Используете ли вы воду для ритуалов (умывание с намерением, зарядка, очищение пространства)?",
                options: [
                    { text: "Никогда. Вода — это просто H₂O", value: -2 },
                    { text: "Нет, но слышал(а) о таком", value: 0 },
                    { text: "Иногда умываюсь с мыслью «смыть негатив»", value: 2 },
                    { text: "Регулярно заряжаю воду позитивным намерением", value: 4 },
                    { text: "Да, использую святую воду, воду с серебром, заговорённую", value: 6 }
                ]
            },
            {
                text: "Какую воду вы используете для приготовления пищи (супы, чай)?",
                options: [
                    { text: "Из-под крана, не фильтруя", value: -2 },
                    { text: "Фильтрованную, но не задумываясь", value: 0 },
                    { text: "Бутилированную или родниковую, когда есть возможность", value: 2 },
                    { text: "Всегда использую хорошую воду, это важно для вкуса и пользы", value: 4 }
                ]
            },
            {
                text: "Есть ли у вас «любимая» вода (конкретный источник, бренд, способ очистки), к которой вы возвращаетесь?",
                options: [
                    { text: "Нет, пью что есть. Вода везде одинакова", value: -1 },
                    { text: "Есть предпочтения, но не придаю значения", value: 1 },
                    { text: "Да, я чувствую разницу и выбираю лучшую из доступного", value: 3 },
                    { text: "Да, у меня есть «свой» источник, я езжу туда специально", value: 5 }
                ]
            }
        ];
        
        const totalQuestions = questions.length;
        let currentIndex = 0;
        let answers = new Array(totalQuestions).fill(null);
        
        const questionContainer = document.getElementById('questionContainer');
        const prevBtn = document.getElementById('prevBtn');
        const nextBtn = document.getElementById('nextBtn');
        const exitBtn = document.getElementById('exitBtn');
        const progressFill = document.getElementById('progressFill');
        const progressText = document.getElementById('progressText');
        const testContainer = document.getElementById('testContainer');
        const mainBody = document.getElementById('mainBody');
        const testTitle = document.getElementById('testTitle');
        
        let isResultMode = false;
        
        function renderQuestion(index) {
            const q = questions[index];
            let html = `<div class="question-box">`;
            html += `<div class="question-text">${index + 1}. ${q.text}</div>`;
            html += `<div class="options">`;
            
            q.options.forEach((opt) => {
                const isSelected = answers[index] === opt.value;
                html += `
                    <div class="option ${isSelected ? 'selected' : ''}" data-value="${opt.value}">
                        <div class="option-marker"></div>
                        <div class="option-text">${opt.text}</div>
                    </div>
                `;
            });
            
            html += `</div></div>`;
            questionContainer.innerHTML = html;
            
            document.querySelectorAll('.option').forEach(opt => {
                opt.addEventListener('click', () => {
                    const value = parseInt(opt.dataset.value);
                    answers[index] = value;
                    renderQuestion(index);
                });
            });
            
            const progress = ((index + 1) / totalQuestions) * 100;
            progressFill.style.width = progress + '%';
            progressText.textContent = `Вопрос ${index + 1} из ${totalQuestions}`;
            
            prevBtn.disabled = index === 0;
            if (index === totalQuestions - 1) {
                nextBtn.textContent = '🎉 Завершить';
            } else {
                nextBtn.textContent = 'Далее →';
            }
        }
        
        function calculateResult() {
            const sum = answers.reduce((acc, val) => acc + val, 0);
            // Максимум ~32, минимум ~-13
            // Приводим к шкале от -5 до +8
            let normalized = Math.round(sum / 3.5);
            return Math.max(-5, Math.min(8, normalized));
        }
        
        function getResultColor(rank) {
            if (rank >= 6) return '#4fc3f7'; // Живая вода (ярко-голубой)
            if (rank >= 3) return '#81d4fa'; // Хорошая вода
            if (rank >= 0) return '#b0bec5'; // Нейтральная
            if (rank >= -2) return '#ffb74d'; // Слабая вода
            return '#ef5350'; // Мёртвая вода (красный)
        }
        
        function getResultComment(rank) {
            if (rank >= 7) return "💎 Вы пьёте ЖИВУЮ ВОДУ. Ваша вода — это источник Света. Она не просто утоляет жажду, но и подпитывает ваше семантическое поле. Вы на уровне мастеров водной алхимии.";
            if (rank >= 5) return "💧 Вы пьёте ОЧЕНЬ ХОРОШУЮ воду. Вы осознанно выбираете источники, возможно, заряжаете воду намерением. Ваше поле получает качественную подпитку.";
            if (rank >= 3) return "🌿 Вы пьёте ХОРОШУЮ воду. Вы заботитесь о качестве, используете фильтры или покупаете проверенную воду. Это хороший уровень.";
            if (rank >= 1) return "🚰 Вы пьёте НЕЙТРАЛЬНУЮ воду. Она безопасна физически, но почти не несёт Qₛ. Попробуйте улучшить качество воды (фильтр с шунгитом, стеклянная тара, намерение).";
            if (rank >= -1) return "⚠️ Вы пьёте СЛАБУЮ воду. Возможно, вы не придаёте значения качеству воды. Это влияет не только на здоровье, но и на ваше поле. Начните с малого: фильтруйте воду, пейте больше.";
            if (rank >= -3) return "🏭 Вы пьёте МЁРТВУЮ воду. Пластик, водопровод, отсутствие фильтрации — всё это вносит S_noise в ваше поле. Срочно меняйте подход к воде!";
            return "☠️ Вы пьёте ОТРАВЛЕННУЮ воду. Ваша вода не просто «пустая», она может вредить вашему полю. Купите фильтр, найдите родник, используйте стекло. Это базовый уровень заботы о себе.";
        }
        
        function getResultAdvice(rank) {
            if (rank >= 5) return "💎 Совет: Продолжайте! Делитесь своей водой с близкими. Заряжайте её позитивным намерением. Используйте серебряные или медные сосуды для хранения.";
            if (rank >= 3) return "🌿 Совет: Попробуйте «оживить» воду. Замораживайте и размораживайте её (талая вода). Настаивайте на шунгите или кварце. Произносите над водой слова благодарности.";
            if (rank >= 1) return "💧 Совет: Улучшите качество воды. Купите фильтр-кувшин с шунгитом. Храните воду в стекле, а не в пластике. Пейте больше (цель — 1.5-2 л в день).";
            if (rank >= -1) return "⚠️ Совет: Начните с замены тары. Перелейте воду в стеклянный графин. Добавьте в воду дольку лимона или веточку мяты (это повышает Qₛ). Пейте осознанно, с благодарностью.";
            if (rank >= -3) return "🆘 Совет: Срочно купите фильтр. Храните воду в стекле или керамике. Никогда не пейте из пластиковых бутылок, которые долго стояли на солнце. Начните с малого: один стакан чистой воды утром с мыслью «спасибо».";
            return "🚨 Совет: Ваша вода вредит вам. Купите фильтр-кувшин СЕГОДНЯ. Перейдите на стеклянную тару. Найдите родник или заказывайте бутилированную воду в стекле. Пейте воду с молитвой или позитивным намерением.";
        }
        
        function showResult() {
            isResultMode = true;
            const rank = calculateResult();
            const color = getResultColor(rank);
            const comment = getResultComment(rank);
            const advice = getResultAdvice(rank);
            
            mainBody.style.background = `linear-gradient(145deg, ${color}20 0%, #16213e 100%)`;
            testContainer.style.borderColor = color;
            
            let html = `<div class="result-container">`;
            html += `<h2 style="color: ${color};">Ваш результат</h2>`;
            html += `<div class="result-score" style="color: ${color};">${rank > 0 ? '+' : ''}${rank}</div>`;
            html += `<div class="result-scale">Ранг вашей воды (от -5 до +8)</div>`;
            html += `<div class="result-comment" style="color: #d0c8b8;">${comment}</div>`;
            html += `<div class="result-advice" style="color: #d0c8b8;">${advice}</div>`;
            html += `<p style="margin-top: 1.5rem; color: #a09080; font-style: italic;">Вода — универсальный проводник Qₛ (§82, §127). Её качество напрямую влияет на ваше поле.</p>`;
            html += `</div>`;
            
            questionContainer.innerHTML = html;
            
            prevBtn.classList.add('hidden');
            nextBtn.classList.add('hidden');
            exitBtn.textContent = '🔄 Пройти заново';
            exitBtn.classList.remove('btn-secondary');
            exitBtn.classList.add('btn');
            
            testTitle.textContent = `Результат: Ранг воды = ${rank > 0 ? '+' : ''}${rank}`;
            progressText.textContent = `Тест завершён`;
            
            setTimeout(function() {
    const passportBtn = document.createElement('button');
    passportBtn.textContent = '💾 Сохранить результат в Семантический Паспорт';
    passportBtn.style.cssText = 'display: block; margin: 2rem auto; padding: 1rem 2rem; background: #4fc3f7; color: #1a1a2e; border: none; border-radius: 40px; font-size: 1rem; cursor: pointer; font-weight: bold; transition: 0.3s;';
    passportBtn.onmouseover = () => passportBtn.style.background = '#03a9f4';
    passportBtn.onmouseout = () => passportBtn.style.background = '#4fc3f7';

    passportBtn.addEventListener('click', function() {
        const scoreElement = document.querySelector('.result-score');
        if (scoreElement) {
            const resultText = scoreElement.textContent.trim();
            const resultValue = parseFloat(resultText);
            if (!isNaN(resultValue)) {
                localStorage.setItem('ideatonika_test_water', resultValue);
            } else {
                localStorage.setItem('ideatonika_test_water', resultText);
            }
            passportBtn.textContent = '✅ Сохранено в Паспорт!';
            passportBtn.style.background = '#01579b';
            passportBtn.style.color = 'white';
            passportBtn.disabled = true;
        }
    });

    const container = document.querySelector('.result-container') || document.getElementById('questionContainer');
    if (container) {
        container.appendChild(passportBtn);
    }
}, 100);

// ========== КНОПКА "ПОДЕЛИТЬСЯ РЕЗУЛЬТАТОМ" ==========
setTimeout(function() {
    const shareContainer = document.createElement('div');
    shareContainer.style.cssText = 'text-align: center; margin-top: 1.5rem;';

    const shareBtn = document.createElement('button');
    shareBtn.textContent = '📤 Поделиться результатом';
    shareBtn.style.cssText = 'display: block; margin: 0 auto 0.8rem auto; padding: 0.8rem 2rem; background: transparent; color: #81c784; border: 1.5px solid #81c784; border-radius: 40px; font-size: 1rem; cursor: pointer; font-weight: bold; transition: 0.3s; font-family: Georgia, serif;';
    shareBtn.onmouseover = () => shareBtn.style.background = '#81c784';
    shareBtn.onmouseout = () => shareBtn.style.background = 'transparent';
    shareBtn.onmouseover = () => shareBtn.style.color = '#1a1a2e';
    shareBtn.onmouseout = () => shareBtn.style.color = '#81c784';

    shareBtn.addEventListener('click', function() {
        // Получаем название теста из заголовка страницы
        const testName = document.title.replace(' • Идеатоника', '').trim();
        
        // Получаем результат из элемента .result-score
        const scoreElement = document.querySelector('.result-score');
        let resultText = '';
        if (scoreElement) {
            resultText = scoreElement.textContent.trim();
        }
        
        // Получаем комментарий из элемента .result-comment или .result-interpretation
        const commentElement = document.querySelector('.result-comment') || document.querySelector('.result-interpretation');
        let commentText = '';
        if (commentElement) {
            commentText = commentElement.textContent.trim();
        }
        
        // Формируем текст для отправки
        const shareText = `🧪 Я прошёл тест «${testName}» на портале Идеатоника!\n\n` +
            `📊 Мой результат: ${resultText}\n` +
            `💬 ${commentText}\n\n` +
            `🎯 А какой результат у тебя?\n` +
            `👉 Пройти тест: ${window.location.href}\n\n` +
            `🌌 Идеатоника — физика смысла.`;
        
        // Пытаемся использовать Web Share API (мобильные устройства)
        if (navigator.share) {
            navigator.share({
                title: `Мой результат теста «${testName}»`,
                text: shareText,
                url: window.location.href
            }).catch(() => {
                // Если не получилось — копируем в буфер
                copyToClipboard(shareText);
            });
        } else {
            // Если Web Share API не поддерживается — копируем в буфер
            copyToClipboard(shareText);
        }
    });

    function copyToClipboard(text) {
        if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(text).then(() => {
                const originalText = shareBtn.textContent;
                shareBtn.textContent = '✅ Скопировано! Отправь другу';
                shareBtn.style.borderColor = '#ffd54f';
                shareBtn.style.color = '#ffd54f';
                setTimeout(() => {
                    shareBtn.textContent = originalText;
                    shareBtn.style.borderColor = '#81c784';
                    shareBtn.style.color = '#81c784';
                }, 2500);
            }).catch(() => {
                fallbackCopy(text);
            });
        } else {
            fallbackCopy(text);
        }
    }

    function fallbackCopy(text) {
        const textarea = document.createElement('textarea');
        textarea.value = text;
        textarea.style.position = 'fixed';
        textarea.style.left = '-9999px';
        document.body.appendChild(textarea);
        textarea.select();
        try {
            document.execCommand('copy');
            const originalText = shareBtn.textContent;
            shareBtn.textContent = '✅ Скопировано! Отправь другу';
            shareBtn.style.borderColor = '#ffd54f';
            shareBtn.style.color = '#ffd54f';
            setTimeout(() => {
                shareBtn.textContent = originalText;
                shareBtn.style.borderColor = '#81c784';
                shareBtn.style.color = '#81c784';
            }, 2500);
        } catch(e) {
            shareBtn.textContent = '❌ Не удалось скопировать';
            shareBtn.style.borderColor = '#ef5350';
            shareBtn.style.color = '#ef5350';
        }
        document.body.removeChild(textarea);
    }

    // Добавляем подсказку
    const hint = document.createElement('div');
    hint.style.cssText = 'color: #a09080; font-size: 0.8rem; font-style: italic;';
    hint.textContent = 'Нажмите, чтобы скопировать результат и отправить другу';
    shareContainer.appendChild(shareBtn);
    shareContainer.appendChild(hint);

    // Ищем контейнер с результатом
    const container = document.querySelector('.result-container') || document.getElementById('questionContainer');
    if (container) {
        container.appendChild(shareContainer);
    }
}, 100);

        }
        
        function resetTest() {
            isResultMode = false;
            currentIndex = 0;
            answers = new Array(totalQuestions).fill(null);
            
            mainBody.style.background = '';
            testContainer.style.borderColor = '';
            testTitle.textContent = 'Живая или Мёртвая вода?';
            
            prevBtn.classList.remove('hidden');
            nextBtn.classList.remove('hidden');
            exitBtn.textContent = '🚪 Выйти';
            exitBtn.classList.add('btn-secondary');
            
            renderQuestion(0);
        }
        
        prevBtn.addEventListener('click', () => {
            if (currentIndex > 0) {
                currentIndex--;
                renderQuestion(currentIndex);
            }
        });
        
        nextBtn.addEventListener('click', () => {
            if (answers[currentIndex] === null) {
                alert('Пожалуйста, выберите один из вариантов ответа.');
                return;
            }
            
            if (currentIndex < totalQuestions - 1) {
                currentIndex++;
                renderQuestion(currentIndex);
            } else {
                if (answers.includes(null)) {
                    alert('Пожалуйста, ответьте на все вопросы.');
                    return;
                }
                showResult();
            }
        });
        
        exitBtn.addEventListener('click', () => {
            if (isResultMode) {
                resetTest();
            } else {
                if (confirm('Вы уверены, что хотите выйти? Прогресс будет потерян.')) {
                    window.location.href = 'diagnostics-hub.html';
                }
            }
        });
        
        renderQuestion(0);
    })();
</script>

</html>
