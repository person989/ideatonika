<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Затухание Qₛ • Идеатоника</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: linear-gradient(145deg, #0d1117 0%, #161b22 100%);
            min-height: 100vh;
            font-family: 'Georgia', 'Times New Roman', serif;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            padding: 1rem; overflow-x: hidden;
        }
        .stars-bg { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 0; }
        .star { position: absolute; background: white; border-radius: 50%; animation: twinkle var(--duration) ease-in-out infinite; animation-delay: var(--delay); opacity: 0; }
        @keyframes twinkle { 0%,100% { opacity:0.2; transform:scale(1); } 50% { opacity:1; transform:scale(1.8); } }
        .main-container {
            position: relative; z-index: 1; width: 100%; max-width: 1100px;
            background: rgba(22,27,34,0.85); backdrop-filter: blur(12px);
            border: 1px solid rgba(227,184,124,0.3); border-radius: 32px;
            padding: 2rem; box-shadow: 0 20px 40px rgba(0,0,0,0.6);
        }
        .header { text-align: center; margin-bottom: 1.5rem; }
        .header h1 { font-size: 2.5rem; font-weight: 400; letter-spacing: 3px; color: #f3e7c0; text-shadow: 0 0 20px rgba(255,215,80,0.4); margin-bottom: 0.3rem; }
        .header .subtitle { font-size: 1rem; color: #c0b090; font-style: italic; border-bottom: 1px solid #5d4a3a; display: inline-block; padding-bottom: 0.4rem; }
        .canvas-wrapper { position: relative; width: 100%; background: radial-gradient(ellipse at center, #1a2030 0%, #0a0e14 100%); border-radius: 20px; border: 1px solid #5d4a3a; overflow: hidden; margin-bottom: 1.5rem; box-shadow: inset 0 0 80px rgba(0,0,0,0.5); }
        canvas { display: block; width: 100%; height: auto; }
        .controls-panel { background: rgba(0,0,0,0.3); border: 1px solid #5d4a3a; border-radius: 20px; padding: 1.5rem 2rem; }
        .controls-title { font-size: 1.2rem; color: #ffd54f; margin-bottom: 1.2rem; text-align: center; letter-spacing: 1px; }
        .slider-group { margin-bottom: 1.2rem; }
        .slider-group label { display: flex; justify-content: space-between; align-items: center; color: #d0c8b8; font-size: 0.95rem; margin-bottom: 0.4rem; }
        .slider-group label .param-value { color: #ffd54f; font-weight: bold; font-size: 1.1rem; min-width: 50px; text-align: right; }
        .slider-group input[type="range"] { width: 100%; -webkit-appearance: none; height: 8px; background: linear-gradient(90deg, #3a2a4a, #5d4a3a, #3a2a4a); border-radius: 4px; outline: none; cursor: pointer; }
        .slider-group input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; width: 24px; height: 24px; background: radial-gradient(circle at 40% 40%, #ffe082, #ff8f00); border-radius: 50%; cursor: pointer; box-shadow: 0 0 15px rgba(255,215,80,0.6); border: 2px solid #ffd54f; }
        .range-labels { display: flex; justify-content: space-between; color: #706858; font-size: 0.75rem; margin-top: 0.2rem; }
        .info-box { margin-top: 1.5rem; padding: 1rem 1.5rem; background: rgba(255,215,80,0.05); border: 1px solid rgba(255,215,80,0.2); border-radius: 12px; text-align: center; color: #c0b090; font-size: 0.9rem; font-style: italic; }
        .info-box .formula-display { font-family: 'Courier New', monospace; color: #ffd54f; font-size: 1rem; margin: 0.3rem 0; }
        .back-row { text-align: center; margin-top: 1.5rem; }
        .back-link { display: inline-block; color: #ffd54f; text-decoration: none; border: 1px solid #ffd54f; padding: 0.6rem 1.5rem; border-radius: 30px; transition: 0.3s; font-size: 0.9rem; }
        .back-link:hover { background: #ffd54f; color: #0d1117; }
        @media (max-width: 700px) { .main-container { padding: 1rem; } .header h1 { font-size: 1.8rem; } .controls-panel { padding: 1rem; } }
    </style>
</head>
<body>
<div class="stars-bg" id="starsBg"></div>
<div class="main-container">
    <div class="header">
        <h1>📡 Затухание Qₛ</h1>
        <div class="subtitle">Визуализация §129: закон Бугера-Ламберта-Бера</div>
    </div>
    <div class="canvas-wrapper" id="canvasWrapper">
        <canvas id="attenuationCanvas"></canvas>
    </div>
    <div class="controls-panel">
        <div class="controls-title">🎛️ Параметры</div>
        <div class="slider-group">
            <label><span>🧱 Материал (коэфф. поглощения α)</span><span class="param-value" id="alphaValue">0.5 (дерево)</span></label>
            <input type="range" id="alphaSlider" min="0.01" max="20" value="0.5" step="0.01">
            <div class="range-labels"><span>0.01 (воздух)</span><span>0.5 (дерево)</span><span>5 (бетон)</span><span>20 (свинец)</span></div>
        </div>
        <div class="slider-group">
            <label><span>☀️ Начальная мощность Qₛ</span><span class="param-value" id="powerValue">100</span></label>
            <input type="range" id="powerSlider" min="10" max="200" value="100" step="1">
            <div class="range-labels"><span>10</span><span>100</span><span>200</span></div>
        </div>
        <div class="slider-group">
            <label><span>📏 Толщина материала</span><span class="param-value" id="thickValue">1.0 м</span></label>
            <input type="range" id="thickSlider" min="0.1" max="3" value="1" step="0.1">
            <div class="range-labels"><span>0.1 м</span><span>1 м</span><span>3 м</span></div>
        </div>
        <div class="info-box">
            <span id="statusText" style="color:#ffd54f;font-weight:bold;">📡 Сигнал проходит хорошо</span>
            <div class="formula-display" id="formulaDisplay"></div>
        </div>
    </div>
    <div class="back-row">
        <a href="visualizations.html" class="back-link">← К списку визуализаций</a>
    </div>
</div>

<script>
(function(){
    const starsBg=document.getElementById('starsBg');
    for(let i=0;i<100;i++){
        const d=document.createElement('div');d.className='star';
        d.style.left=Math.random()*100+'%';d.style.top=Math.random()*100+'%';
        const s=Math.random()*2.5+0.5;d.style.width=s+'px';d.style.height=s+'px';
        d.style.setProperty('--duration',(Math.random()*4+2)+'s');
        d.style.setProperty('--delay',(Math.random()*5)+'s');
        starsBg.appendChild(d);
    }
})();

const canvas=document.getElementById('attenuationCanvas');
const ctx=canvas.getContext('2d');
const wrapper=document.getElementById('canvasWrapper');
let time=0,animId;

function resize(){
    const r=wrapper.getBoundingClientRect();
    canvas.width=r.width;
    canvas.height=Math.max(500,Math.min(650,r.width*0.7));
    wrapper.style.height=canvas.height+'px';
}
resize();window.addEventListener('resize',resize);

const alphaSlider=document.getElementById('alphaSlider');
const powerSlider=document.getElementById('powerSlider');
const thickSlider=document.getElementById('thickSlider');
const alphaValue=document.getElementById('alphaValue');
const powerValue=document.getElementById('powerValue');
const thickValue=document.getElementById('thickValue');
const statusText=document.getElementById('statusText');
const formulaDisplay=document.getElementById('formulaDisplay');

const materialNames={
    0.01:'Воздух',0.1:'Вода',0.5:'Дерево',2.0:'Гранит',5.0:'Бетон',20.0:'Свинец'
};
function getMaterialName(alpha){
    let closest=0.01,minDiff=100;
    for(const [k,v] of Object.entries(materialNames)){
        const diff=Math.abs(alpha-parseFloat(k));
        if(diff<minDiff){minDiff=diff;closest=parseFloat(k);}
    }
    const name=materialNames[closest]||'Неизвестно';
    return name+' (α='+alpha.toFixed(2)+')';
}

alphaSlider.oninput=function(){
    const a=parseFloat(this.value);
    alphaValue.textContent=getMaterialName(a);
    updateInfo();
};
powerSlider.oninput=function(){
    powerValue.textContent=parseInt(this.value)+' усл. ед.';
    updateInfo();
};
thickSlider.oninput=function(){
    thickValue.textContent=parseFloat(this.value).toFixed(1)+' м';
    updateInfo();
};

function updateInfo(){
    const alpha=parseFloat(alphaSlider.value);
    const power=parseInt(powerSlider.value);
    const thick=parseFloat(thickSlider.value);
    const remaining=power*Math.exp(-alpha*thick);
    const percent=(remaining/power*100).toFixed(1);
    if(percent>80) statusText.textContent='📡 Сигнал почти не ослаб — среда прозрачна';
    else if(percent>40) statusText.textContent='📶 Сигнал заметно ослаб, но проходит';
    else if(percent>10) statusText.textContent='📡 Сигнал сильно ослаб — едва доходит';
    else statusText.textContent='💀 Сигнал практически исчез — среда слишком плотная';
    formulaDisplay.textContent='Q(x) = '+power+'·e^(-'+alpha.toFixed(2)+'·'+thick.toFixed(1)+') = '+remaining.toFixed(1)+' ('+percent+'%)';
}
updateInfo();

function drawFrame(){
    const alpha=parseFloat(alphaSlider.value);
    const power=parseInt(powerSlider.value);
    const thick=parseFloat(thickSlider.value);
    const w=canvas.width,h=canvas.height;
    
    time+=0.02;
    
    // Очистка
    ctx.fillStyle='#060a10';
    ctx.fillRect(0,0,w,h);
    
    // Сетка
    ctx.strokeStyle='rgba(255,255,255,0.02)';ctx.lineWidth=1;
    for(let x=0;x<w;x+=50){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,h);ctx.stroke();}
    for(let y=0;y<h;y+=50){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(w,y);ctx.stroke();}
    
    const margin=w*0.12;
    const matStart=margin+60;
    const matWidth=(w-2*margin-120)*0.7;
    const matEnd=matStart+matWidth;
    const matY=h*0.25;
    const matH=h*0.5;
    
    // Источник (звезда слева)
    const srcX=margin,srcY=h/2;
    const srcGlow=ctx.createRadialGradient(srcX,srcY,0,srcX,srcY,40);
    srcGlow.addColorStop(0,'rgba(255,240,180,0.9)');
    srcGlow.addColorStop(0.3,'rgba(255,200,60,0.5)');
    srcGlow.addColorStop(1,'rgba(0,0,0,0)');
    ctx.fillStyle=srcGlow;
    ctx.beginPath();ctx.arc(srcX,srcY,40,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#ffd54f';
    ctx.font='bold 14px Georgia,serif';
    ctx.textAlign='center';
    ctx.fillText('Источник',srcX,srcY-50);
    ctx.fillText('Qₛ='+power,srcX,srcY-30);
    
    // Материал (блок)
    const matGrad=ctx.createLinearGradient(matStart,0,matEnd,0);
    const darkness=Math.min(0.7,alpha/10);
    matGrad.addColorStop(0,'rgba(60,50,40,0.6)');
    matGrad.addColorStop(0.3,'rgba(80,70,60,0.7)');
    matGrad.addColorStop(0.7,'rgba(80,70,60,0.7)');
    matGrad.addColorStop(1,'rgba(60,50,40,0.6)');
    ctx.fillStyle=matGrad;
    ctx.strokeStyle='rgba(255,255,255,0.3)';
    ctx.lineWidth=2;
    ctx.beginPath();
    ctx.roundRect(matStart,matY,matWidth,matH,8);
    ctx.fill();
    ctx.stroke();
    
    // Метка материала
    ctx.fillStyle='rgba(255,255,255,0.4)';
    ctx.font='bold 16px Georgia,serif';
    ctx.textAlign='center';
    ctx.fillText(getMaterialName(alpha),matStart+matWidth/2,matY-10);
    ctx.fillText('Толщина: '+thick.toFixed(1)+' м',matStart+matWidth/2,matY+matH+25);
    
    // Текстура материала (линии)
    ctx.strokeStyle='rgba(255,255,255,0.05)';
    ctx.lineWidth=1;
    for(let y=matY+10;y<matY+matH;y+=15){
        ctx.beginPath();ctx.moveTo(matStart,y);ctx.lineTo(matEnd,y+Math.sin(y*0.3)*3);ctx.stroke();
    }
    
    // Луч Qₛ, проходящий сквозь материал
    const rayY=srcY;
    const numParticles=Math.floor(power/2);
    const maxAlpha=0.7;
    
    for(let i=0;i<numParticles;i++){
        const startT=(i/numParticles+time*0.1)%1;
        let px=margin+startT*(w-margin*2);
        
        // Проверяем, внутри ли материала
        let alpha_particle=0;
        if(px>=matStart&&px<=matEnd){
            const distInMat=px-matStart;
            const localAlpha=alpha*0.15; // масштабируем для визуализации
            alpha_particle=maxAlpha*(1-Math.exp(-localAlpha*distInMat));
        }
        
        const particleAlpha=maxAlpha-alpha_particle;
        if(particleAlpha<0.02) continue;
        
        const py=rayY+Math.sin(i*0.7+time*2)*3;
        
        ctx.fillStyle=`rgba(255,220,100,${particleAlpha})`;
        ctx.beginPath();ctx.arc(px,py,2,0,Math.PI*2);ctx.fill();
    }
    
    // График затухания (справа от материала)
    const graphX=matEnd+20,graphW=w-matEnd-30,graphH=matH,graphY=matY;
    
    // Оси
    ctx.strokeStyle='rgba(255,255,255,0.2)';
    ctx.lineWidth=1;
    ctx.beginPath();ctx.moveTo(graphX,graphY);ctx.lineTo(graphX,graphY+graphH);ctx.stroke();
    ctx.beginPath();ctx.moveTo(graphX,graphY+graphH);ctx.lineTo(graphX+graphW,graphY+graphH);ctx.stroke();
    
    // Подписи
    ctx.fillStyle='rgba(255,255,255,0.4)';
    ctx.font='10px Georgia,serif';
    ctx.textAlign='center';
    ctx.fillText('Q(x)',graphX-15,graphY-5);
    ctx.fillText('x (м)',graphX+graphW/2,graphY+graphH+20);
    
    // Кривая затухания
    ctx.strokeStyle='#ffd54f';
    ctx.lineWidth=2;
    ctx.beginPath();
    for(let i=0;i<=graphW;i+=2){
        const t=i/graphW;
        const x=t*thick;
        const q=power*Math.exp(-alpha*x)/power;
        const px=graphX+i;
        const py=graphY+graphH*(1-q);
        if(i===0) ctx.moveTo(px,py);
        else ctx.lineTo(px,py);
    }
    ctx.stroke();
    
    // Точка выхода
    const exitQ=power*Math.exp(-alpha*thick);
    const exitT=Math.min(1,exitQ/power);
    const exitPX=graphX+graphW;
    const exitPY=graphY+graphH*(1-exitT);
    
    ctx.fillStyle='#ffd54f';
    ctx.beginPath();ctx.arc(exitPX,exitPY,5,0,Math.PI*2);ctx.fill();
    ctx.fillText(exitQ.toFixed(0),exitPX+25,exitPY+4);
    
    // Приёмник
const rx=w-margin/2,ry=h/2;
const rxRatio=exitQ/power;

if(rxRatio>0.001){
    const rxGlow=ctx.createRadialGradient(rx,ry,0,rx,ry,25);
    rxGlow.addColorStop(0,`rgba(255,240,180,${rxRatio*0.8})`);
    rxGlow.addColorStop(0.5,`rgba(255,200,60,${rxRatio*0.4})`);
    rxGlow.addColorStop(1,'rgba(0,0,0,0)');
    ctx.fillStyle=rxGlow;
    ctx.beginPath();ctx.arc(rx,ry,25,0,Math.PI*2);ctx.fill();
}else{
    // Тусклый контур приёмника
    ctx.strokeStyle='rgba(255,255,255,0.15)';
    ctx.lineWidth=1;
    ctx.beginPath();ctx.arc(rx,ry,25,0,Math.PI*2);ctx.stroke();
}

ctx.fillStyle='#c0b090';
ctx.font='bold 14px Georgia,serif';
ctx.textAlign='center';
ctx.fillText('Приёмник',rx,ry-40);
if(rxRatio<0.001){
    ctx.fillStyle='#ef5350';
    ctx.fillText('Q=0 (нет сигнала)',rx,ry-20);
}else{
    ctx.fillText('Q='+exitQ.toFixed(0),rx,ry-20);
}
    
    animId=requestAnimationFrame(drawFrame);
}

drawFrame();
window.addEventListener('beforeunload',()=>{if(animId)cancelAnimationFrame(animId);});
</script>

</body>
</html>
