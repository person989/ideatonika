<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ударная Волна • Идеатоника</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: linear-gradient(145deg, #0d1117 0%, #161b22 100%);
            min-height: 100vh;
            font-family: 'Georgia', 'Times New Roman', serif;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            padding: 1rem; overflow-x: hidden;
        }
        .stars-bg { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 0; }
        .star { position: absolute; background: white; border-radius: 50%; animation: twinkle var(--duration) ease-in-out infinite; animation-delay: var(--delay); opacity: 0; }
        @keyframes twinkle { 0%,100% { opacity:0.2; transform:scale(1); } 50% { opacity:1; transform:scale(1.8); } }
        .main-container {
            position: relative; z-index: 1; width: 100%; max-width: 1100px;
            background: rgba(22,27,34,0.85); backdrop-filter: blur(12px);
            border: 1px solid rgba(227,184,124,0.3); border-radius: 32px;
            padding: 2rem; box-shadow: 0 20px 40px rgba(0,0,0,0.6);
        }
        .header { text-align: center; margin-bottom: 1.5rem; }
        .header h1 { font-size: 2.5rem; font-weight: 400; letter-spacing: 3px; color: #f3e7c0; text-shadow: 0 0 20px rgba(255,215,80,0.4); margin-bottom: 0.3rem; }
        .header .subtitle { font-size: 1rem; color: #c0b090; font-style: italic; border-bottom: 1px solid #5d4a3a; display: inline-block; padding-bottom: 0.4rem; }
        .canvas-wrapper { position: relative; width: 100%; background: radial-gradient(ellipse at center, #1a2030 0%, #0a0e14 100%); border-radius: 20px; border: 1px solid #5d4a3a; overflow: hidden; margin-bottom: 1.5rem; box-shadow: inset 0 0 80px rgba(0,0,0,0.5); }
        canvas { display: block; width: 100%; height: auto; }
        .controls-panel { background: rgba(0,0,0,0.3); border: 1px solid #5d4a3a; border-radius: 20px; padding: 1.5rem 2rem; }
        .controls-title { font-size: 1.2rem; color: #ffd54f; margin-bottom: 1.2rem; text-align: center; letter-spacing: 1px; }
        .slider-group { margin-bottom: 1.2rem; }
        .slider-group label { display: flex; justify-content: space-between; align-items: center; color: #d0c8b8; font-size: 0.95rem; margin-bottom: 0.4rem; }
        .slider-group label .param-value { color: #ffd54f; font-weight: bold; font-size: 1.1rem; min-width: 50px; text-align: right; }
        .slider-group input[type="range"] { width: 100%; -webkit-appearance: none; height: 8px; background: linear-gradient(90deg, #3a2a4a, #5d4a3a, #3a2a4a); border-radius: 4px; outline: none; cursor: pointer; }
        .slider-group input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; width: 24px; height: 24px; background: radial-gradient(circle at 40% 40%, #ffe082, #ff8f00); border-radius: 50%; cursor: pointer; box-shadow: 0 0 15px rgba(255,215,80,0.6); border: 2px solid #ffd54f; }
        .range-labels { display: flex; justify-content: space-between; color: #706858; font-size: 0.75rem; margin-top: 0.2rem; }
        .info-box { margin-top: 1.5rem; padding: 1rem 1.5rem; background: rgba(255,215,80,0.05); border: 1px solid rgba(255,215,80,0.2); border-radius: 12px; text-align: center; color: #c0b090; font-size: 0.9rem; font-style: italic; }
        .info-box .formula-display { font-family: 'Courier New', monospace; color: #ffd54f; font-size: 1rem; margin: 0.3rem 0; }
        .back-row { text-align: center; margin-top: 1.5rem; }
        .back-link { display: inline-block; color: #ffd54f; text-decoration: none; border: 1px solid #ffd54f; padding: 0.6rem 1.5rem; border-radius: 30px; transition: 0.3s; font-size: 0.9rem; }
        .back-link:hover { background: #ffd54f; color: #0d1117; }
        @media (max-width: 700px) { .main-container { padding: 1rem; } .header h1 { font-size: 1.8rem; } .controls-panel { padding: 1rem; } }
    </style>
</head>
<body>
<div class="stars-bg" id="starsBg"></div>
<div class="main-container">
    <div class="header">
        <h1>💥 Ударная Волна</h1>
        <div class="subtitle">Визуализация §118: сверхзвуковой импульс Qₛ и конус Маха</div>
    </div>
    <div class="canvas-wrapper" id="canvasWrapper">
        <canvas id="shockwaveCanvas"></canvas>
    </div>
    <div class="controls-panel">
        <div class="controls-title">🎛️ Параметры</div>
        <div class="slider-group">
            <label><span>🚀 Число Маха (M_sense)</span><span class="param-value" id="machValue">0.8 (дозвук)</span></label>
            <input type="range" id="machSlider" min="0.3" max="4" value="0.8" step="0.1">
            <div class="range-labels"><span>0.3 (медленно)</span><span>1.0 (звук)</span><span>2.0</span><span>4.0 (гиперзвук)</span></div>
        </div>
        <div class="slider-group">
            <label><span>☀️ Семантический заряд Qₛ</span><span class="param-value" id="qsValue">+5</span></label>
            <input type="range" id="qsSlider" min="-10" max="10" value="5" step="1">
            <div class="range-labels"><span>-10 (Тьма)</span><span>0</span><span>+10 (Свет)</span></div>
        </div>
        <div class="slider-group" style="text-align:center;">
            <button id="resetBtn" style="padding:0.6rem 2rem;background:rgba(255,215,80,0.1);border:1px solid #ffd54f;color:#ffd54f;border-radius:30px;font-family:Georgia,serif;font-size:1rem;cursor:pointer;margin-right:1rem;">🔄 Сброс позиции</button>
            <button id="pauseBtn" style="padding:0.6rem 2rem;background:rgba(255,215,80,0.1);border:1px solid #ffd54f;color:#ffd54f;border-radius:30px;font-family:Georgia,serif;font-size:1rem;cursor:pointer;">⏯️ Пауза</button>
        </div>
        <div class="info-box">
            <span id="statusText" style="color:#ffd54f;font-weight:bold;">🐌 Дозвуковой режим — волны впереди</span>
            <div class="formula-display" id="formulaDisplay"></div>
        </div>
    </div>
    <div class="back-row">
        <a href="visualizations.html" class="back-link">← К списку визуализаций</a>
    </div>
</div>

<script>
(function(){
    const starsBg=document.getElementById('starsBg');
    for(let i=0;i<100;i++){
        const d=document.createElement('div');d.className='star';
        d.style.left=Math.random()*100+'%';d.style.top=Math.random()*100+'%';
        const s=Math.random()*2.5+0.5;d.style.width=s+'px';d.style.height=s+'px';
        d.style.setProperty('--duration',(Math.random()*4+2)+'s');
        d.style.setProperty('--delay',(Math.random()*5)+'s');
        starsBg.appendChild(d);
    }
})();

const canvas=document.getElementById('shockwaveCanvas');
const ctx=canvas.getContext('2d');
const wrapper=document.getElementById('canvasWrapper');
let time=0,paused=false,animId;

// Позиция источника и история волн
let sourceX=0;
const waveRings=[]; // {x, y, radius, birthTime, alpha}
const MAX_RINGS=80;

function resize(){
    const r=wrapper.getBoundingClientRect();
    canvas.width=r.width;
    canvas.height=Math.max(500,Math.min(650,r.width*0.7));
    wrapper.style.height=canvas.height+'px';
    sourceX=canvas.width*0.1;
    waveRings.length=0;
}
resize();window.addEventListener('resize',resize);

const machSlider=document.getElementById('machSlider');
const qsSlider=document.getElementById('qsSlider');
const machValue=document.getElementById('machValue');
const qsValue=document.getElementById('qsValue');
const pauseBtn=document.getElementById('pauseBtn');
const resetBtn=document.getElementById('resetBtn');
const statusText=document.getElementById('statusText');
const formulaDisplay=document.getElementById('formulaDisplay');

machSlider.oninput=function(){
    const m=parseFloat(this.value);
    if(m<0.5) machValue.textContent=m.toFixed(1)+' (очень медленно)';
    else if(m<0.9) machValue.textContent=m.toFixed(1)+' (дозвук)';
    else if(m<1.1) machValue.textContent=m.toFixed(1)+' (трансзвук)';
    else if(m<2) machValue.textContent=m.toFixed(1)+' (сверхзвук)';
    else machValue.textContent=m.toFixed(1)+' (гиперзвук)';
    updateInfo();
};
qsSlider.oninput=function(){
    qsValue.textContent=(parseInt(this.value)>=0?'+':'')+parseInt(this.value);
};

pauseBtn.onclick=function(){
    paused=!paused;
    this.textContent=paused?'▶️ Продолжить':'⏯️ Пауза';
};
resetBtn.onclick=function(){
    sourceX=canvas.width*0.1;
    waveRings.length=0;
};

function updateInfo(){
    const m=parseFloat(machSlider.value);
    if(m<0.5) statusText.textContent='🐌 Очень медленно — волны далеко впереди';
    else if(m<0.9) statusText.textContent='🐌 Дозвуковой режим — волны предупреждают среду';
    else if(m<1.1) statusText.textContent='⚡ Трансзвук — образование скачка уплотнения';
    else if(m<2) statusText.textContent='💥 СВЕРХЗВУК — ударная волна! Конус Маха!';
    else statusText.textContent='🌋 ГИПЕРЗВУК — мощнейший скачок, Экран пробит!';
    
    if(m<1){
        formulaDisplay.textContent='M='+m.toFixed(1)+' | Дозвук: волны обгоняют источник';
    }else{
        const machAngle=Math.asin(1/m)*180/Math.PI;
        formulaDisplay.textContent='M='+m.toFixed(1)+' | Угол конуса Маха: sin(α)=1/M → α='+machAngle.toFixed(1)+'°';
    }
}
updateInfo();

function getQSColor(qs,alpha){
    const absQ=Math.abs(qs);
    const norm=absQ/10; // 0..1
    
    if(absQ<0.5){
        // Почти ноль — серый, едва заметный
        const gray=Math.floor(100*norm+30);
        return `rgba(${gray},${gray},${gray},${alpha*0.4})`;
    }
    
    if(qs>=0){
        // Положительный — золотой/белый
        const r=Math.floor(30+norm*225);
        const g=Math.floor(5+norm*235);
        const b=Math.floor(80*(1-norm)+255*norm);
        return `rgba(${r},${g},${b},${alpha})`;
    }else{
        // Отрицательный — фиолетовый/тёмный
        const r=Math.floor(80*(1-norm)+30*norm);
        const g=Math.floor(40*(1-norm)+5*norm);
        const b=Math.floor(30+norm*200);
        return `rgba(${r},${g},${b},${alpha})`;
    }
}

function drawFrame(){
    const m=parseFloat(machSlider.value);
    const qs=parseInt(qsSlider.value);
    const w=canvas.width,h=canvas.height;
    
    if(!paused){
        time+=0.016;
        sourceX+=m*2.5; // скорость пропорциональна M
        
        if(sourceX>w+100){
            sourceX=-100;
            waveRings.length=0;
        }
    }
    
    // Очистка
    ctx.fillStyle='#060a10';
    ctx.fillRect(0,0,w,h);
    
    // Сетка
    ctx.strokeStyle='rgba(255,255,255,0.02)';ctx.lineWidth=1;
    for(let x=0;x<w;x+=50){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,h);ctx.stroke();}
    for(let y=0;y<h;y+=50){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(w,y);ctx.stroke();}
    
    const srcY=h*0.5;
    
    // Испускаем новые кольца
    if(!paused&&sourceX>-50&&sourceX<w+50){
        const interval=15/m;
        const lastRing=waveRings[waveRings.length-1];
        if(!lastRing||time-lastRing.birthTime>interval*0.016){
            waveRings.push({
                x:sourceX,
                y:srcY,
                radius:0,
                birthTime:time,
                alpha:0.8
            });
        }
    }
    
    // Обновляем кольца
    const cSound=2.5; // "скорость звука" в пикселях/кадр
    for(let i=waveRings.length-1;i>=0;i--){
        const ring=waveRings[i];
        ring.radius+=cSound;
        ring.alpha-=0.003;
        
        if(ring.alpha<=0||ring.radius>w*1.5){
            waveRings.splice(i,1);
        }
    }
    
    // Рисуем кольца волн
    for(const ring of waveRings){
        if(ring.alpha<0.01) continue;
        ctx.strokeStyle=getQSColor(qs,ring.alpha*0.5);
        ctx.lineWidth=1.5;
        ctx.beginPath();
        ctx.arc(ring.x,ring.y,ring.radius,0,Math.PI*2);
        ctx.stroke();
    }
    
    // Конус Маха (только при M>=1)
    if(m>=1){
        const machAngle=Math.asin(1/m);
        
        // Левая граница конуса
        const coneLen=w;
        const leftX=sourceX-Math.cos(machAngle)*coneLen;
        const leftY1=srcY-Math.sin(machAngle)*coneLen;
        const leftY2=srcY+Math.sin(machAngle)*coneLen;
        
        // Правая граница конуса
        const rightX=sourceX-Math.cos(machAngle)*coneLen;
        
        // Рисуем конус
        ctx.strokeStyle=getQSColor(qs,0.6);
        ctx.lineWidth=2;
        ctx.setLineDash([8,4]);
        
        // Верхняя линия конуса
        ctx.beginPath();
        ctx.moveTo(sourceX,srcY);
        ctx.lineTo(leftX,leftY1);
        ctx.stroke();
        
        // Нижняя линия конуса
        ctx.beginPath();
        ctx.moveTo(sourceX,srcY);
        ctx.lineTo(leftX,leftY2);
        ctx.stroke();
        
        ctx.setLineDash([]);
        
        // Заполнение конуса (зона возмущения)
        const coneGrad=ctx.createLinearGradient(sourceX,0,leftX,0);
        coneGrad.addColorStop(0,getQSColor(qs,0.15));
        coneGrad.addColorStop(1,'rgba(0,0,0,0)');
        ctx.fillStyle=coneGrad;
        ctx.beginPath();
        ctx.moveTo(sourceX,srcY);
        ctx.lineTo(leftX,leftY1);
        ctx.lineTo(leftX,leftY2);
        ctx.closePath();
        ctx.fill();
        
        // Скачок уплотнения (дуга перед источником)
        const shockRadius=15+m*10;
        const shockGrad=ctx.createRadialGradient(sourceX,srcY,shockRadius*0.5,sourceX,srcY,shockRadius);
        shockGrad.addColorStop(0,'rgba(255,255,255,0.9)');
        shockGrad.addColorStop(0.3,getQSColor(qs,0.7));
        shockGrad.addColorStop(0.6,'rgba(255,100,50,0.3)');
        shockGrad.addColorStop(1,'rgba(0,0,0,0)');
        ctx.fillStyle=shockGrad;
        ctx.beginPath();
        ctx.arc(sourceX,srcY,shockRadius,-Math.PI/2-machAngle,-Math.PI/2+machAngle);
        ctx.fill();
        
        // Подпись угла
        const labelDist=150;
        const labelX=sourceX-Math.cos(machAngle)*labelDist;
        const labelY=srcY-Math.sin(machAngle)*labelDist;
        ctx.fillStyle='rgba(255,255,255,0.7)';
        ctx.font='13px Georgia,serif';
        ctx.textAlign='right';
        const angleDeg=(machAngle*180/Math.PI).toFixed(1);
        ctx.fillText('α='+angleDeg+'°',labelX-10,labelY-10);
    }
    
    // Рисуем источник
    const srcGlow=ctx.createRadialGradient(sourceX,srcY,0,sourceX,srcY,25);
    srcGlow.addColorStop(0,'rgba(255,255,255,0.9)');
    srcGlow.addColorStop(0.3,getQSColor(qs,0.8));
    srcGlow.addColorStop(1,'rgba(0,0,0,0)');
    ctx.fillStyle=srcGlow;
    ctx.beginPath();ctx.arc(sourceX,srcY,25,0,Math.PI*2);ctx.fill();
    
    // Ядро
    ctx.fillStyle='white';
    ctx.beginPath();ctx.arc(sourceX,srcY,8,0,Math.PI*2);ctx.fill();
    
    // Подпись
    ctx.fillStyle='white';
    ctx.font='bold 14px Georgia,serif';
    ctx.textAlign='center';
    ctx.fillText('M='+m.toFixed(1),sourceX,srcY-35);
    
    // Линия "звукового барьера"
    if(m>=0.9&&m<=1.1){
        const barrierX=sourceX;
        ctx.strokeStyle='rgba(255,255,255,0.3)';
        ctx.lineWidth=1;
        ctx.setLineDash([2,6]);
        ctx.beginPath();
        ctx.moveTo(barrierX,0);
        ctx.lineTo(barrierX,h);
        ctx.stroke();
        ctx.setLineDash([]);
        ctx.fillStyle='rgba(255,255,255,0.5)';
        ctx.fillText('ЗВУКОВОЙ',barrierX+40,30);
        ctx.fillText('БАРЬЕР',barrierX+40,50);
    }
    
    // Легенда
    ctx.fillStyle='rgba(255,255,255,0.5)';
    ctx.font='12px Georgia,serif';
    ctx.textAlign='left';
    ctx.fillText('c_sense (скорость звука)',20,h-40);
    ctx.strokeStyle='rgba(255,255,255,0.4)';
    ctx.lineWidth=1;
    ctx.beginPath();ctx.moveTo(20,h-28);ctx.lineTo(60,h-28);ctx.stroke();
    ctx.fillText('v (скорость источника)',20,h-15);
    ctx.strokeStyle=getQSColor(qs,0.7);
    ctx.beginPath();ctx.moveTo(20,h-3);ctx.lineTo(60,h-3);ctx.stroke();
    
    animId=requestAnimationFrame(drawFrame);
}

drawFrame();
window.addEventListener('beforeunload',()=>{if(animId)cancelAnimationFrame(animId);});
</script>

</body>
</html>
