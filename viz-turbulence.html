<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Турбулентность Qₛ • Идеатоника</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: linear-gradient(145deg, #0d1117 0%, #161b22 100%);
            min-height: 100vh;
            font-family: 'Georgia', 'Times New Roman', serif;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            padding: 1rem; overflow-x: hidden;
        }
        .stars-bg { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 0; }
        .star { position: absolute; background: white; border-radius: 50%; animation: twinkle var(--duration) ease-in-out infinite; animation-delay: var(--delay); opacity: 0; }
        @keyframes twinkle { 0%,100% { opacity:0.2; transform:scale(1); } 50% { opacity:1; transform:scale(1.8); } }
        .main-container {
            position: relative; z-index: 1; width: 100%; max-width: 1100px;
            background: rgba(22,27,34,0.85); backdrop-filter: blur(12px);
            border: 1px solid rgba(227,184,124,0.3); border-radius: 32px;
            padding: 2rem; box-shadow: 0 20px 40px rgba(0,0,0,0.6);
        }
        .header { text-align: center; margin-bottom: 1.5rem; }
        .header h1 { font-size: 2.5rem; font-weight: 400; letter-spacing: 3px; color: #f3e7c0; text-shadow: 0 0 20px rgba(255,215,80,0.4); margin-bottom: 0.3rem; }
        .header .subtitle { font-size: 1rem; color: #c0b090; font-style: italic; border-bottom: 1px solid #5d4a3a; display: inline-block; padding-bottom: 0.4rem; }
        .canvas-wrapper { position: relative; width: 100%; background: radial-gradient(ellipse at center, #1a2030 0%, #0a0e14 100%); border-radius: 20px; border: 1px solid #5d4a3a; overflow: hidden; margin-bottom: 1.5rem; box-shadow: inset 0 0 80px rgba(0,0,0,0.5); }
        canvas { display: block; width: 100%; height: auto; }
        .controls-panel { background: rgba(0,0,0,0.3); border: 1px solid #5d4a3a; border-radius: 20px; padding: 1.5rem 2rem; }
        .controls-title { font-size: 1.2rem; color: #ffd54f; margin-bottom: 1.2rem; text-align: center; letter-spacing: 1px; }
        .slider-group { margin-bottom: 1.2rem; }
        .slider-group label { display: flex; justify-content: space-between; align-items: center; color: #d0c8b8; font-size: 0.95rem; margin-bottom: 0.4rem; }
        .slider-group label .param-value { color: #ffd54f; font-weight: bold; font-size: 1.1rem; min-width: 50px; text-align: right; }
        .slider-group input[type="range"] { width: 100%; -webkit-appearance: none; height: 8px; background: linear-gradient(90deg, #3a2a4a, #5d4a3a, #3a2a4a); border-radius: 4px; outline: none; cursor: pointer; }
        .slider-group input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; width: 24px; height: 24px; background: radial-gradient(circle at 40% 40%, #ffe082, #ff8f00); border-radius: 50%; cursor: pointer; box-shadow: 0 0 15px rgba(255,215,80,0.6); border: 2px solid #ffd54f; }
        .range-labels { display: flex; justify-content: space-between; color: #706858; font-size: 0.75rem; margin-top: 0.2rem; }
        .info-box { margin-top: 1.5rem; padding: 1rem 1.5rem; background: rgba(255,215,80,0.05); border: 1px solid rgba(255,215,80,0.2); border-radius: 12px; text-align: center; color: #c0b090; font-size: 0.9rem; font-style: italic; }
        .info-box .formula-display { font-family: 'Courier New', monospace; color: #ffd54f; font-size: 1rem; margin: 0.3rem 0; }
        .back-row { text-align: center; margin-top: 1.5rem; }
        .back-link { display: inline-block; color: #ffd54f; text-decoration: none; border: 1px solid #ffd54f; padding: 0.6rem 1.5rem; border-radius: 30px; transition: 0.3s; font-size: 0.9rem; }
        .back-link:hover { background: #ffd54f; color: #0d1117; }
        @media (max-width: 700px) { .main-container { padding: 1rem; } .header h1 { font-size: 1.8rem; } .controls-panel { padding: 1rem; } }
    </style>
</head>
<body>
<div class="stars-bg" id="starsBg"></div>
<div class="main-container">
    <div class="header">
        <h1>🌪️ Турбулентность Qₛ</h1>
        <div class="subtitle">Визуализация §111: ламинарный и турбулентный поток</div>
    </div>
    <div class="canvas-wrapper" id="canvasWrapper">
        <canvas id="turbulenceCanvas"></canvas>
    </div>
    <div class="controls-panel">
        <div class="controls-title">🎛️ Параметры</div>
        <div class="slider-group">
            <label><span>🌊 Число Рейнольдса (Re)</span><span class="param-value" id="reValue">1000</span></label>
            <input type="range" id="reSlider" min="0" max="5000" value="1000" step="10">
            <div class="range-labels"><span>0 (ламинарный)</span><span>2500 (переход)</span><span>5000 (турбулентный)</span></div>
        </div>
        <div class="slider-group">
            <label><span>☀️ Семантический заряд Qₛ</span><span class="param-value" id="qsValue">+5</span></label>
            <input type="range" id="qsSlider" min="-10" max="10" value="5" step="1">
            <div class="range-labels"><span>-10 (Тьма)</span><span>0</span><span>+10 (Свет)</span></div>
        </div>
        <div class="slider-group">
            <label><span>⏱️ Скорость потока</span><span class="param-value" id="speedValue">1.0x</span></label>
            <input type="range" id="speedSlider" min="0.1" max="3.0" value="1.0" step="0.1">
            <div class="range-labels"><span>0.1x</span><span>1.0x</span><span>3.0x</span></div>
        </div>
        <div class="slider-group" style="text-align:center;">
            <button id="pauseBtn" style="padding:0.6rem 2rem;background:rgba(255,215,80,0.1);border:1px solid #ffd54f;color:#ffd54f;border-radius:30px;font-family:Georgia,serif;font-size:1rem;cursor:pointer;">⏯️ Пауза</button>
        </div>
        <div class="info-box">
            <span id="statusText" style="color:#ffd54f;font-weight:bold;">🌊 Ламинарный поток</span>
            <div class="formula-display" id="formulaDisplay"></div>
        </div>
    </div>
    <div class="back-row">
        <a href="visualizations.html" class="back-link">← К списку визуализаций</a>
    </div>
</div>

<script>
(function(){
    const starsBg=document.getElementById('starsBg');
    for(let i=0;i<100;i++){
        const d=document.createElement('div');d.className='star';
        d.style.left=Math.random()*100+'%';d.style.top=Math.random()*100+'%';
        const s=Math.random()*2.5+0.5;d.style.width=s+'px';d.style.height=s+'px';
        d.style.setProperty('--duration',(Math.random()*4+2)+'s');
        d.style.setProperty('--delay',(Math.random()*5)+'s');
        starsBg.appendChild(d);
    }
})();

const canvas=document.getElementById('turbulenceCanvas');
const ctx=canvas.getContext('2d');
const wrapper=document.getElementById('canvasWrapper');
let time=0,paused=false,animId;

// Массив для хранения линий тока и их фаз
let streamlines=[];
const NUM_LINES=60;

function resize(){
    const r=wrapper.getBoundingClientRect();
    canvas.width=r.width;
    canvas.height=Math.max(450,Math.min(600,r.width*0.6));
    wrapper.style.height=canvas.height+'px';
    initStreamlines();
}
function initStreamlines(){
    streamlines=[];
    const h=canvas.height;
    for(let i=0;i<NUM_LINES;i++){
        streamlines.push({
            baseY:(i+0.5)*h/NUM_LINES,
            phase:Math.random()*Math.PI*2,
            amplitude:0,
            frequency:0
        });
    }
}
resize();window.addEventListener('resize',resize);

const reSlider=document.getElementById('reSlider');
const qsSlider=document.getElementById('qsSlider');
const speedSlider=document.getElementById('speedSlider');
const reValue=document.getElementById('reValue');
const qsValue=document.getElementById('qsValue');
const speedValue=document.getElementById('speedValue');
const pauseBtn=document.getElementById('pauseBtn');
const statusText=document.getElementById('statusText');
const formulaDisplay=document.getElementById('formulaDisplay');

reSlider.oninput=function(){
    reValue.textContent=parseInt(this.value);
    updateInfo();
};
qsSlider.oninput=function(){
    qsValue.textContent=(parseInt(this.value)>=0?'+':'')+parseInt(this.value);
};
speedSlider.oninput=function(){
    speedValue.textContent=parseFloat(this.value).toFixed(1)+'x';
};

pauseBtn.onclick=function(){
    paused=!paused;
    this.textContent=paused?'▶️ Продолжить':'⏯️ Пауза';
};

function getQSColor(qs,t){
    const norm=(qs+10)/20;
    const hue=norm*50-5;
    const r=Math.floor(30+norm*225);
    const g=Math.floor(5+norm*235);
    const b=Math.floor(80*(1-norm)+255*norm);
    return {r,g,b};
}

function updateInfo(){
    const re=parseInt(reSlider.value);
    if(re<500) statusText.textContent='🌊 ЛАМИНАРНЫЙ поток — плавный, слоистый';
    else if(re<2000) statusText.textContent='🌊 Ламинарный поток — плавный, слоистый';
    else if(re<3000) statusText.textContent='🌫️ ПЕРЕХОДНЫЙ режим — появляются вихри';
    else statusText.textContent='🌪️ ТУРБУЛЕНТНЫЙ поток — хаос и вихри';
    formulaDisplay.textContent='Re = '+re+' | Re_crit ≈ 2000 | §111';
}
updateInfo();

function drawFrame(){
    const re=parseInt(reSlider.value);
    const qs=parseInt(qsSlider.value);
    const speed=parseFloat(speedSlider.value);
    const w=canvas.width,h=canvas.height;
    
    if(!paused) time+=0.02*speed;
    
    // Очистка
    ctx.fillStyle='#060a10';
    ctx.fillRect(0,0,w,h);
    
    // Сетка фона
    ctx.strokeStyle='rgba(255,255,255,0.02)';ctx.lineWidth=1;
    for(let x=0;x<w;x+=50){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,h);ctx.stroke();}
    for(let y=0;y<h;y+=50){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(w,y);ctx.stroke();}
    
    // Цвет потока
    const baseColor=getQSColor(qs);
    
    // Плавная турбулентность (нелинейная шкала)
    let turbIntensity;
    if(re<500) turbIntensity=re/500*0.05;           // 0..0.05 (почти нет)
    else if(re<1500) turbIntensity=0.05+(re-500)/1000*0.15; // 0.05..0.2 (лёгкие волны)
    else if(re<3000) turbIntensity=0.2+(re-1500)/1500*0.5;  // 0.2..0.7 (активные волны)
    else turbIntensity=0.7+(re-3000)/2000*0.3;              // 0.7..1.0 (хаос)
    
    // Для каждой линии тока вычисляем её Y-позицию
    const lineData=[];
    for(let i=0;i<streamlines.length;i++){
        const sl=streamlines[i];
        const baseY=sl.baseY;
        
        // Амплитуда: плавно растёт с turbIntensity
        const maxAmp=turbIntensity*h*0.45;
        
        // Частота тоже растёт
        const baseFreq=1+turbIntensity*6;
        
        if(re>0){
            sl.phase+=0.01*(0.2+Math.random()*turbIntensity);
        }
        sl.amplitude=maxAmp*(0.5+0.5*Math.sin(time*0.7+sl.phase));
        sl.frequency=baseFreq*(0.7+0.3*Math.sin(time*1.1+sl.phase*1.3));
        
        lineData.push({
            baseY:baseY,
            amp:sl.amplitude,
            freq:sl.frequency,
            phase:sl.phase
        });
    }
    
    // Рисуем вихри (начинаются с Re > 800)
    if(turbIntensity>0.1){
        const numVortices=Math.floor(turbIntensity*14);
        for(let v=0;v<numVortices;v++){
            const seed=v*123.456+time*0.5;
            const vx=(seed*76.543)%w;
            const vy=(seed*98.765)%h;
            const radius=3+turbIntensity*18;
            const alpha=turbIntensity*0.22*(0.5+0.5*Math.sin(time*3+seed));
            
            if(alpha<0.005) continue;
            
            ctx.strokeStyle=`rgba(${baseColor.r},${baseColor.g},${baseColor.b},${alpha})`;
            ctx.lineWidth=0.5+turbIntensity*2;
            ctx.beginPath();
            for(let a=0;a<Math.PI*4;a+=0.2){
                const r=radius*a/(Math.PI*4);
                const x=vx+Math.cos(a+time*4+seed)*r;
                const y=vy+Math.sin(a+time*4+seed)*r;
                if(a===0) ctx.moveTo(x,y);
                else ctx.lineTo(x,y);
            }
            ctx.stroke();
        }
    }
    
    // Рисуем линии тока
    for(let i=0;i<lineData.length;i++){
        const ld=lineData[i];
        const y0=ld.baseY;
        
        ctx.strokeStyle=`rgba(${baseColor.r},${baseColor.g},${baseColor.b},0.7)`;
        ctx.lineWidth=1+(turbIntensity>0.5?1:0);
        ctx.beginPath();
        
        const step=8;
        for(let x=0;x<w;x+=step){
            let dy=0;
            
            if(re>0){
                // Основная волна
                dy=Math.sin(x*0.01*ld.freq+time*2+ld.phase)*ld.amp;
                
                // Мелкие возмущения при turbIntensity > 0.4
                if(turbIntensity>0.4){
                    dy+=Math.sin(x*0.05*ld.freq+time*5+ld.phase*2)*ld.amp*0.3;
                    dy+=Math.cos(x*0.02*ld.freq+time*3+ld.phase*0.7)*ld.amp*0.2;
                }
                // Ещё более мелкая рябь при turbIntensity > 0.7
                if(turbIntensity>0.7){
                    dy+=Math.sin(x*0.1*ld.freq+time*8+ld.phase*3)*ld.amp*0.15;
                }
            }
            
            const y=y0+dy;
            const clampedY=Math.max(3,Math.min(h-3,y));
            
            if(x===0) ctx.moveTo(x,clampedY);
            else ctx.lineTo(x,clampedY);
        }
        ctx.stroke();
    }
    
    // Стрелка потока
    const arrowX=w*0.9, arrowY=h*0.5;
    ctx.fillStyle=`rgba(${baseColor.r},${baseColor.g},${baseColor.b},0.8)`;
    ctx.font='bold 20px Georgia,serif';
    ctx.textAlign='center';
    ctx.fillText('→',arrowX,arrowY);
    
    // Метки
    ctx.fillStyle='#c0b090';
    ctx.font='14px Georgia,serif';
    ctx.textAlign='left';
    ctx.fillText('Qₛ поток →',10,25);
    
    ctx.textAlign='right';
    ctx.fillText(`Re = ${re}`,w-10,25);
    ctx.fillText(`Qₛ = ${qs>=0?'+':''}${qs}`,w-10,45);
    
    // Подписи режимов
    let regimeText='';
    if(re<500) regimeText='Ламинарный — почти прямые линии';
    else if(re<1500) regimeText='Ламинарный с возмущениями';
    else if(re<3000) regimeText='Переходный — волны и вихри';
    else regimeText='Турбулентный — полный хаос';
    
    ctx.fillStyle='rgba(255,255,255,0.3)';
    ctx.font='italic 16px Georgia,serif';
    ctx.textAlign='center';
    ctx.fillText(regimeText,w/2,h-30);
    
    animId=requestAnimationFrame(drawFrame);
}

drawFrame();
window.addEventListener('beforeunload',()=>{if(animId)cancelAnimationFrame(animId);});
</script>

</body>
</html>
