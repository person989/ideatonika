<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Калькулятор Мощности Воздействия • Идеатоника</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: linear-gradient(145deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            font-family: 'Georgia', 'Times New Roman', serif;
            padding: 2rem;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .cosmic-bg {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle at 30% 40%, rgba(255,215,150,0.08) 0%, transparent 50%),
                        radial-gradient(circle at 80% 70%, rgba(100,150,255,0.05) 0%, transparent 60%);
            pointer-events: none; z-index: 0;
        }
        .main-container {
            max-width: 800px;
            width: 100%;
            position: relative;
            z-index: 1;
            background: rgba(30, 40, 60, 0.85);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(227, 184, 124, 0.4);
            border-radius: 32px;
            padding: 2.5rem;
            box-shadow: 0 20px 40px rgba(0,0,0,0.5);
        }
        h1 {
            font-size: 2.5rem;
            color: #f3e7c0;
            text-align: center;
            margin-bottom: 0.5rem;
            font-weight: 400;
        }
        .subtitle {
            text-align: center;
            color: #c0b090;
            font-style: italic;
            margin-bottom: 2rem;
            border-bottom: 1px solid #5d4a3a;
            padding-bottom: 1rem;
        }
        .calc-section {
            background: rgba(0,0,0,0.2);
            border-radius: 20px;
            padding: 2rem;
            margin-bottom: 2rem;
            border: 1px solid #5d4a3a;
        }
        .section-title {
            font-size: 1.4rem;
            color: #ffd54f;
            margin-bottom: 1.5rem;
        }
        .input-group {
            margin-bottom: 1.5rem;
        }
        .input-group label {
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: #d0c8b8;
            font-size: 1rem;
            margin-bottom: 0.5rem;
        }
        .input-group label span {
            color: #ffd54f;
            font-weight: bold;
            font-size: 1.2rem;
        }
        .input-group input[type="range"] {
            width: 100%;
            -webkit-appearance: none;
            height: 8px;
            background: #5d4a3a;
            border-radius: 4px;
            outline: none;
            cursor: pointer;
        }
        .input-group input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 22px;
            height: 22px;
            background: #ffd54f;
            border-radius: 50%;
            cursor: pointer;
            box-shadow: 0 0 10px rgba(255,215,80,0.5);
        }
        .input-group .range-labels {
            display: flex;
            justify-content: space-between;
            color: #706858;
            font-size: 0.8rem;
            margin-top: 0.3rem;
        }
        .result-box {
            background: rgba(255,215,80,0.1);
            border: 2px solid #ffd54f;
            border-radius: 20px;
            padding: 2rem;
            text-align: center;
            margin-top: 2rem;
        }
        .result-number {
            font-size: 4rem;
            font-weight: bold;
            color: #ffd54f;
            line-height: 1;
        }
        .result-label {
            color: #c0b090;
            font-size: 1.2rem;
            margin-top: 0.5rem;
        }
        .result-extra {
            color: #d0c8b8;
            font-size: 1rem;
            margin-top: 1rem;
            font-style: italic;
        }
        .result-formula {
            color: #a09080;
            font-style: italic;
            font-size: 0.9rem;
            margin-top: 1rem;
            font-family: 'Courier New', monospace;
        }
        .back-link {
            display: inline-block;
            margin-top: 1.5rem;
            color: #ffd54f;
            text-decoration: none;
            border: 1px solid #ffd54f;
            padding: 0.6rem 1.5rem;
            border-radius: 30px;
            transition: 0.2s;
        }
        .back-link:hover {
            background: #ffd54f;
            color: #1a1a2e;
        }
    </style>
</head>
<body>
<div class="cosmic-bg"></div>
<div class="main-container">

    <h1>⚡ Мощность Воздействия</h1>
    <div class="subtitle">Калькулятор семантической силы (§85, §86, §94)</div>

    <div class="calc-section">
        <div class="section-title">📐 Параметры семантической цепи</div>

        <!-- U_sense — напряжение -->
        <div class="input-group">
            <label>🔋 Семантическое напряжение (U): <span id="uValue">5</span> Вольт смысла</label>
            <input type="range" id="uSlider" min="0" max="10" value="5" step="0.1">
            <div class="range-labels">
                <span>0 (штиль)</span>
                <span>10 (колоссальное)</span>
            </div>
        </div>

        <!-- R_sense — сопротивление -->
        <div class="input-group">
            <label>🛡️ Сопротивление среды (R): <span id="rValue">1.0</span> Ом смысла</label>
            <input type="range" id="rSlider" min="0.1" max="10" value="1.0" step="0.1">
            <div class="range-labels">
                <span>0.1 (вода, храм)</span>
                <span>5.0 (бетон)</span>
                <span>10.0 (вакуум?)</span>
            </div>
        </div>

        <!-- Длительность импульса -->
        <div class="input-group">
            <label>⏱️ Длительность импульса (Δt): <span id="tValue">1.0</span> сек</label>
            <input type="range" id="tSlider" min="0.1" max="10" value="1.0" step="0.1">
            <div class="range-labels">
                <span>0.1 сек (удар)</span>
                <span>10 сек (напитывание)</span>
            </div>
        </div>
    </div>

    <!-- Результат -->
    <div class="result-box" id="resultBox">
        <div class="result-number" id="resultNumber">—</div>
        <div class="result-label" id="resultLabel">Мощность и энергия</div>
        <div class="result-extra" id="resultExtra"></div>
        <div class="result-formula" id="resultFormula"></div>
    </div>

    <div style="text-align: center;">
        <a href="semantic-calculators.html" class="back-link">← К списку калькуляторов</a>
    </div>

</div>

<script>
    const uSlider = document.getElementById('uSlider');
    const rSlider = document.getElementById('rSlider');
    const tSlider = document.getElementById('tSlider');
    const uValue = document.getElementById('uValue');
    const rValue = document.getElementById('rValue');
    const tValue = document.getElementById('tValue');
    const resultNumber = document.getElementById('resultNumber');
    const resultLabel = document.getElementById('resultLabel');
    const resultExtra = document.getElementById('resultExtra');
    const resultFormula = document.getElementById('resultFormula');

    // Обновление отображаемых значений
    uSlider.addEventListener('input', () => uValue.textContent = parseFloat(uSlider.value).toFixed(1));
    rSlider.addEventListener('input', () => rValue.textContent = parseFloat(rSlider.value).toFixed(1));
    tSlider.addEventListener('input', () => tValue.textContent = parseFloat(tSlider.value).toFixed(1));

    function calculate() {
        const U = parseFloat(uSlider.value);
        const R = parseFloat(rSlider.value);
        const dt = parseFloat(tSlider.value);

        // Расчёт тока I = U / R
        const I = U / R;
        // Расчёт мощности P = U² / R = I² * R
        const P = (U * U) / R;
        // Расчёт энергии импульса J = P * dt
        const J = P * dt;
        // Порог пробития Семантического Экрана (условный)
        const threshold = 50; // Ватт смысла

        resultNumber.textContent = P.toFixed(1) + ' Вт';
        resultLabel.textContent = 'Семантическая мощность';

        let statusText = `Ток: ${I.toFixed(1)} А. Энергия импульса: ${J.toFixed(1)} Дж. `;
        if (P >= threshold) {
            statusText += '✅ Этого достаточно, чтобы «пробить» Семантический Экран!';
        } else {
            statusText += '❌ Мощность ниже порога. Экран не пробит.';
        }
        resultExtra.textContent = statusText;

        resultFormula.textContent = `I = ${U.toFixed(1)} / ${R.toFixed(1)} = ${I.toFixed(1)} A | P = ${U.toFixed(1)}² / ${R.toFixed(1)} = ${P.toFixed(1)} Вт | J = ${P.toFixed(1)} · ${dt.toFixed(1)} = ${J.toFixed(1)} Дж`;
    }

    uSlider.addEventListener('input', calculate);
    rSlider.addEventListener('input', calculate);
    tSlider.addEventListener('input', calculate);
    calculate();
</script>

</body>
</html>
