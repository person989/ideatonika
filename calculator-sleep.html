<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Калькулятор Семантического Сна • Идеатоника</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: linear-gradient(145deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            font-family: 'Georgia', 'Times New Roman', serif;
            padding: 2rem;
            display: flex; flex-direction: column; align-items: center;
        }
        .cosmic-bg { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 0; }
        .main-container {
            max-width: 800px; width: 100%; position: relative; z-index: 1;
            background: rgba(30, 40, 60, 0.85); backdrop-filter: blur(12px);
            border: 1px solid rgba(227, 184, 124, 0.4); border-radius: 32px;
            padding: 2.5rem; box-shadow: 0 20px 40px rgba(0,0,0,0.5);
        }
        h1 { font-size: 2.5rem; color: #f3e7c0; text-align: center; margin-bottom: 0.5rem; font-weight: 400; }
        .subtitle { text-align: center; color: #c0b090; font-style: italic; margin-bottom: 2rem; border-bottom: 1px solid #5d4a3a; padding-bottom: 1rem; }
        .calc-section { background: rgba(0,0,0,0.2); border-radius: 20px; padding: 2rem; margin-bottom: 2rem; border: 1px solid #5d4a3a; }
        .section-title { font-size: 1.4rem; color: #ffd54f; margin-bottom: 1.5rem; }
        .input-group { margin-bottom: 1.5rem; }
        .input-group label { display: flex; justify-content: space-between; align-items: center; color: #d0c8b8; font-size: 1rem; margin-bottom: 0.5rem; }
        .input-group label span { color: #ffd54f; font-weight: bold; font-size: 1.2rem; }
        .input-group input[type="range"] { width: 100%; -webkit-appearance: none; height: 8px; background: #5d4a3a; border-radius: 4px; outline: none; cursor: pointer; }
        .input-group input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; width: 22px; height: 22px; background: #ffd54f; border-radius: 50%; cursor: pointer; box-shadow: 0 0 10px rgba(255,215,80,0.5); }
        .input-group .range-labels { display: flex; justify-content: space-between; color: #706858; font-size: 0.8rem; margin-top: 0.3rem; }
        .input-group select { width: 100%; padding: 0.8rem 1rem; background: rgba(0,0,0,0.3); border: 1px solid #5d4a3a; border-radius: 10px; color: #f3e7c0; font-family: 'Georgia', serif; font-size: 1rem; }
        .input-group select option { background: #1a1a2e; color: #f3e7c0; }
        .result-box { background: rgba(255,215,80,0.1); border: 2px solid #ffd54f; border-radius: 20px; padding: 2rem; text-align: center; margin-top: 2rem; }
        .result-number { font-size: 4rem; font-weight: bold; color: #ffd54f; line-height: 1; }
        .result-label { color: #c0b090; font-size: 1.2rem; margin-top: 0.5rem; }
        .result-extra { color: #d0c8b8; font-size: 1rem; margin-top: 1rem; font-style: italic; }
        .result-formula { color: #a09080; font-style: italic; font-size: 0.9rem; margin-top: 1rem; font-family: 'Courier New', monospace; }
        .back-link { display: inline-block; margin-top: 1.5rem; color: #ffd54f; text-decoration: none; border: 1px solid #ffd54f; padding: 0.6rem 1.5rem; border-radius: 30px; transition: 0.2s; }
        .back-link:hover { background: #ffd54f; color: #1a1a2e; }
    </style>
</head>
<body>
<div class="cosmic-bg"></div>
<div class="main-container">

    <h1>😴 Семантический Сон</h1>
    <div class="subtitle">Калькулятор восстановления Qₛ во время сна (§18, §126, DREAM-CATCH)</div>

    <div class="calc-section">
        <div class="section-title">📐 Параметры сна</div>

        <!-- Qₛ перед сном -->
        <div class="input-group">
            <label>🌙 Qₛ перед сном: <span id="qsValue">3</span> (из 10)</label>
            <input type="range" id="qsSlider" min="0" max="10" value="3" step="0.1">
            <div class="range-labels"><span>0 (истощён)</span><span>5</span><span>10 (полон сил)</span></div>
        </div>

        <!-- Cₛ перед сном -->
        <div class="input-group">
            <label>🎯 Когерентность перед сном (Cₛ): <span id="csValue">0.5</span></label>
            <input type="range" id="csSlider" min="0.1" max="1" value="0.5" step="0.01">
            <div class="range-labels"><span>0.1 (тревога, экран)</span><span>1.0 (медитация, покой)</span></div>
        </div>

        <!-- S_noise в спальне -->
        <div class="input-group">
            <label>🔇 Уровень шума в спальне (S_noise):</label>
            <select id="noiseSelect">
                <option value="0.1">Идеальная тишина (0.1)</option>
                <option value="0.3">Лёгкий фоновый шум (0.3)</option>
                <option value="0.5" selected>Улица за окном, техника (0.5)</option>
                <option value="0.8">Громко, свет, беспокойство (0.8)</option>
            </select>
        </div>

        <!-- Длительность сна -->
        <div class="input-group">
            <label>⏱️ Длительность сна: <span id="sleepValue">7</span> часов</label>
            <input type="range" id="sleepSlider" min="2" max="10" value="7" step="0.5">
            <div class="range-labels"><span>2 ч (мало)</span><span>8 ч (норма)</span><span>10 ч (много)</span></div>
        </div>

        <!-- Качество сна -->
        <div class="input-group">
            <label>💤 Качество сна:</label>
            <select id="qualitySelect">
                <option value="1.5">Превосходное (осознанные сны, глубокий) — коэфф. 1.5</option>
                <option value="1.2">Хорошее (без пробуждений) — коэфф. 1.2</option>
                <option value="1.0" selected>Среднее — коэфф. 1.0</option>
                <option value="0.7">Плохое (частые пробуждения) — коэфф. 0.7</option>
                <option value="0.4">Кошмары, бессонница — коэфф. 0.4</option>
            </select>
        </div>
    </div>

    <!-- Результат -->
    <div class="result-box" id="resultBox">
        <div class="result-number" id="resultNumber">—</div>
        <div class="result-label" id="resultLabel">Восстановлено Qₛ</div>
        <div class="result-extra" id="resultExtra"></div>
        <div class="result-formula" id="resultFormula"></div>
    </div>

    <div style="text-align: center;">
        <a href="semantic-calculators.html" class="back-link">← К списку калькуляторов</a>
    </div>

</div>

<script>
    const qsSlider = document.getElementById('qsSlider');
    const csSlider = document.getElementById('csSlider');
    const noiseSelect = document.getElementById('noiseSelect');
    const sleepSlider = document.getElementById('sleepSlider');
    const qualitySelect = document.getElementById('qualitySelect');
    const qsValue = document.getElementById('qsValue');
    const csValue = document.getElementById('csValue');
    const sleepValue = document.getElementById('sleepValue');
    const resultNumber = document.getElementById('resultNumber');
    const resultLabel = document.getElementById('resultLabel');
    const resultExtra = document.getElementById('resultExtra');
    const resultFormula = document.getElementById('resultFormula');

    qsSlider.addEventListener('input', () => { qsValue.textContent = parseFloat(qsSlider.value).toFixed(1); calculate(); });
    csSlider.addEventListener('input', () => { csValue.textContent = parseFloat(csSlider.value).toFixed(2); calculate(); });
    noiseSelect.addEventListener('change', calculate);
    sleepSlider.addEventListener('input', () => { sleepValue.textContent = parseFloat(sleepSlider.value).toFixed(1); calculate(); });
    qualitySelect.addEventListener('change', calculate);

    function calculate() {
        const Qbefore = parseFloat(qsSlider.value);
        const C = parseFloat(csSlider.value);
        const Snoise = parseFloat(noiseSelect.value);
        const hours = parseFloat(sleepSlider.value);
        const qualityCoeff = parseFloat(qualitySelect.value);

        // Максимальное восстановление за час идеального сна ~ 1.5 ед. Qₛ
        const maxRecoveryPerHour = 1.5;
        // Формула: ΔQ = maxRecovery · C · (1 - Snoise) · t · quality
        const deltaQ = maxRecoveryPerHour * C * (1 - Snoise) * hours * qualityCoeff;
        
        // Итоговый Qₛ после сна
        let Qafter = Qbefore + deltaQ;
        if (Qafter > 10) Qafter = 10; // Потолок

        resultNumber.textContent = '+' + deltaQ.toFixed(1) + ' (итого: ' + Qafter.toFixed(1) + ' из 10)';
        resultLabel.textContent = 'Восстановлено Qₛ за ночь';

        let extra = '';
        if (deltaQ >= 5) extra = '🌟 Великолепное восстановление! Вы проснулись полным Света.';
        else if (deltaQ >= 3) extra = '✅ Хороший сон. Вы восстановили силы.';
        else if (deltaQ >= 1.5) extra = '🟰 Средний сон. Частично восстановились.';
        else if (deltaQ >= 0.5) extra = '⚠️ Слабый сон. Вы почти не отдохнули.';
        else extra = '❌ Сон не восстановил вас. Возможно, вы даже потеряли Qₛ.';
        resultExtra.textContent = extra;

        resultFormula.textContent = `ΔQ = 1.5 · ${C.toFixed(2)} · (1 — ${Snoise}) · ${hours} · ${qualityCoeff} = +${deltaQ.toFixed(1)}`;
    }

    calculate();
</script>

</body>
</html>
