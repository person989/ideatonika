<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Экзамен Практика • Академия Идеатоники</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: linear-gradient(145deg, #1a1a2e 0%, #16213e 100%); min-height: 100vh; font-family: 'Georgia', serif; padding: 2rem; display: flex; justify-content: center; align-items: flex-start; }
        .main-container { max-width: 800px; width: 100%; background: rgba(30,40,60,0.85); backdrop-filter: blur(12px); border: 2px solid #ffb74d; border-radius: 32px; padding: 2.5rem; box-shadow: 0 20px 40px rgba(0,0,0,0.5); }
        h1 { text-align: center; color: #ffb74d; font-size: 2.5rem; font-weight: 400; margin-bottom: 0.5rem; }
        .subtitle { text-align: center; color: #c0b090; font-style: italic; margin-bottom: 2rem; }
        .progress-bar { width: 100%; height: 6px; background: rgba(0,0,0,0.3); border-radius: 3px; margin: 1rem 0; }
        .progress-fill { height: 100%; background: #ffb74d; border-radius: 3px; width: 0%; transition: width 0.3s; }
        .question-box { margin-bottom: 2rem; }
        .question-text { color: #f3e7c0; font-size: 1.2rem; margin-bottom: 1.5rem; line-height: 1.5; }
        .options { display: flex; flex-direction: column; gap: 10px; }
        .option { background: rgba(0,0,0,0.2); border: 1px solid #5d4a3a; border-radius: 12px; padding: 1rem 1.5rem; cursor: pointer; color: #d0c8b8; transition: 0.2s; display: flex; align-items: center; gap: 12px; }
        .option:hover { border-color: #ffb74d; background: rgba(255,183,77,0.1); }
        .option.selected { border-color: #ffb74d; background: rgba(255,183,77,0.2); color: #f3e7c0; }
        .nav-buttons { display: flex; justify-content: space-between; margin-top: 2rem; gap: 10px; }
        .btn { background: transparent; border: 1.5px solid #ffb74d; color: #ffb74d; padding: 0.8rem 1.8rem; font-size: 1rem; font-weight: bold; border-radius: 40px; cursor: pointer; font-family: inherit; }
        .btn:hover { background: #ffb74d; color: #1a1a2e; }
        .btn:disabled { opacity: 0.3; cursor: not-allowed; }
        .result-container { text-align: center; }
        .result-score { font-size: 5rem; color: #ffb74d; font-weight: bold; }
        .result-table { width: 100%; margin: 2rem 0; border-collapse: collapse; }
        .result-table th, .result-table td { padding: 10px; border: 1px solid #5d4a3a; color: #d0c8b8; text-align: left; }
        .result-table th { background: #2a2a4a; color: #ffb74d; }
        .correct { color: #81c784; } .wrong { color: #ef5350; }
        .hidden { display: none; }
        .back-link { display: block; text-align: center; margin-top: 1.5rem; color: #ffb74d; text-decoration: none; }
    </style>
</head>
<body>
<div class="main-container" id="quizContainer">
    <h1>🔬 ЭКЗАМЕН ПРАКТИКА</h1>
    <div class="subtitle">10 задач • 5 вариантов • звание «Адепт»</div>
    <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
    <div id="questionArea"></div>
    <div class="nav-buttons">
        <button class="btn" id="prevBtn" disabled>← Назад</button>
        <button class="btn" id="exitBtn" onclick="window.location.href='academy-practicum-menu.html'">🚪 Выйти</button>
        <button class="btn" id="nextBtn">Далее →</button>
    </div>
    <a href="academy-practicum-menu.html" class="back-link">← Вернуться к темам Практики</a>
</div>

<script>
const questions = [
    {
        q: "Дано: Φ_иконы = +7, Φ_чел = +3. Чему равно семантическое напряжение U_sense?",
        opts: ["4 V", "10 V", "7 V", "3 V", "0 V"],
        ans: 0
    },
    {
        q: "Дано: U_sense = 8 V, R_sense = 2 Ω. Чему равен семантический ток I_Q?",
        opts: ["16 A", "4 A", "8 A", "2 A", "0.25 A"],
        ans: 1
    },
    {
        q: "Дано: U_sense = 6 V, R_sense = 3 Ω. Чему равна семантическая мощность P_sense?",
        opts: ["2 W", "18 W", "12 W", "6 W", "9 W"],
        ans: 2
    },
    {
        q: "Дано: L_sense = 200 H, R_sense = 0.5 Ω. Чему равно время релаксации τ_relax?",
        opts: ["100 с", "200 с", "400 с", "0.0025 с", "50 с"],
        ans: 2
    },
    {
        q: "Дано: L_sense = 500 H, C_sense = 8 F. Чему равна резонансная частота ω_res?",
        opts: ["0.0158 рад/с", "0.5 рад/с", "4000 рад/с", "63.2 рад/с", "0.002 рад/с"],
        ans: 0
    },
    {
        q: "Дано: R_sense = 0.4 Ω, L_sense = 640 H, C_sense = 5 F. Чему равна добротность Q_factor?",
        opts: ["2500", "0.0004", "28.3", "12.5", "200"],
        ans: 2
    },
    {
        q: "Дано: Φ_проклинающего = -6, Φ_жертвы = +2, R_общ = 5 Ω. Чему равен модуль напряжения источника |U_ист|?",
        opts: ["4 V", "6 V", "2 V", "8 V", "10 V"],
        ans: 3
    },
    {
        q: "Дано: P_sense = 50 W, Q_нужно = 10000 ед. Сколько часов потребуется для «намоленности» предмета?",
        opts: ["200 часов", "50 часов", "500 часов", "100 часов", "20 часов"],
        ans: 0
    },
    {
        q: "Как изменится мощность P_sense в храме, если потенциал человека Φ_чел вырастет с +3 до +5?",
        opts: ["Мощность упадёт", "Мощность вырастет", "Мощность не изменится", "Мощность удвоится", "Мощность станет равна нулю"],
        ans: 0
    },
    {
        q: "Во сколько раз молитва в храме (R=0.4 Ω) «сильнее» по мощности, чем дома (R=2.5 Ω) при одинаковом U_sense?",
        opts: ["В 2 раза", "В 4 раза", "В 6.25 раза", "В 10 раз", "Одинаково"],
        ans: 2
    }
];

let idx = 0, answers = Array(10).fill(null);
const qArea = document.getElementById('questionArea');
const pf = document.getElementById('progressFill');
const prev = document.getElementById('prevBtn'), next = document.getElementById('nextBtn');

function render() {
    const q = questions[idx];
    let h = `<div class="question-box"><div class="question-text">${idx+1}. ${q.q}</div><div class="options">`;
    q.opts.forEach((o, i) => {
        h += `<div class="option${answers[idx]===i?' selected':''}" data-i="${i}">${o}</div>`;
    });
    h += '</div></div>';
    qArea.innerHTML = h;
    document.querySelectorAll('.option').forEach(o => o.addEventListener('click', function(){
        answers[idx] = parseInt(this.dataset.i);
        render();
    }));
    pf.style.width = ((idx+1)/10*100)+'%';
    prev.disabled = idx===0;
    next.textContent = idx===9 ? '🎉 Завершить' : 'Далее →';
}

function showResult() {
    let correct=0, rows='';
    questions.forEach((q,i)=>{
        const ok = answers[i]===q.ans;
        if(ok) correct++;
        rows += `<tr><td>${i+1}. ${q.q.substring(0,70)}...</td><td class="${ok?'correct':'wrong'}">${ok?'✅':'❌'}</td></tr>`;
    });
    const pct = Math.round(correct/10*100);
    let comment = pct>=90?'🧙 Вы — Магистр вычислений!':pct>=70?'🔬 Отличный результат, Адепт!':pct>=50?'📐 Хорошо, но есть куда расти.': '📖 Нужно повторить формулы.';
    qArea.innerHTML = `<div class="result-container"><div class="result-score">${pct}%</div><p style="color:#c0b090;">${comment}</p><table class="result-table"><tr><th>Задача</th><th>Результат</th></tr>${rows}</table><p style="color:#a09080;">Звание: ${pct>=90?'🧙 Магистр':pct>=70?'🔬 Адепт':pct>=50?'📐 Практик':'📖 Ученик'}</p></div>`;
    document.querySelector('.nav-buttons').classList.add('hidden');
}

prev.addEventListener('click', ()=>{ if(idx>0){idx--; render();} });
next.addEventListener('click', ()=>{
    if(answers[idx]===null){ alert('Выберите ответ!'); return; }
    if(idx<9){ idx++; render(); } else showResult();
});
render();
</script>
</body>
</html>
