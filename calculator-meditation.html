<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Калькулятор медитации • Идеатоника</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: linear-gradient(145deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            font-family: 'Georgia', 'Times New Roman', serif;
            padding: 2rem;
            display: flex; flex-direction: column; align-items: center;
        }
        .cosmic-bg { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 0; }
        .main-container {
            max-width: 800px; width: 100%; position: relative; z-index: 1;
            background: rgba(30, 40, 60, 0.85); backdrop-filter: blur(12px);
            border: 1px solid rgba(227, 184, 124, 0.4); border-radius: 32px;
            padding: 2.5rem; box-shadow: 0 20px 40px rgba(0,0,0,0.5);
        }
        h1 { font-size: 2.5rem; color: #f3e7c0; text-align: center; margin-bottom: 0.5rem; font-weight: 400; }
        .subtitle { text-align: center; color: #c0b090; font-style: italic; margin-bottom: 2rem; border-bottom: 1px solid #5d4a3a; padding-bottom: 1rem; }
        .calc-section { background: rgba(0,0,0,0.2); border-radius: 20px; padding: 2rem; margin-bottom: 2rem; border: 1px solid #5d4a3a; }
        .section-title { font-size: 1.4rem; color: #ffd54f; margin-bottom: 1.5rem; }
        .input-group { margin-bottom: 1.5rem; }
        .input-group label { display: flex; justify-content: space-between; align-items: center; color: #d0c8b8; font-size: 1rem; margin-bottom: 0.5rem; }
        .input-group label span { color: #ffd54f; font-weight: bold; font-size: 1.2rem; }
        .input-group input[type="range"] { width: 100%; -webkit-appearance: none; height: 8px; background: #5d4a3a; border-radius: 4px; outline: none; cursor: pointer; }
        .input-group input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; width: 22px; height: 22px; background: #ffd54f; border-radius: 50%; cursor: pointer; box-shadow: 0 0 10px rgba(255,215,80,0.5); }
        .input-group .range-labels { display: flex; justify-content: space-between; color: #706858; font-size: 0.8rem; margin-top: 0.3rem; }
        .input-group select { width: 100%; padding: 0.8rem 1rem; background: rgba(0,0,0,0.3); border: 1px solid #5d4a3a; border-radius: 10px; color: #f3e7c0; font-family: 'Georgia', serif; font-size: 1rem; }
        .input-group select option { background: #1a1a2e; color: #f3e7c0; }
        .result-box { background: rgba(255,215,80,0.1); border: 2px solid #ffd54f; border-radius: 20px; padding: 2rem; text-align: center; margin-top: 2rem; }
        .result-number { font-size: 5rem; font-weight: bold; color: #ffd54f; line-height: 1; }
        .result-label { color: #c0b090; font-size: 1.2rem; margin-top: 0.5rem; }
        .result-extra { color: #d0c8b8; font-size: 1rem; margin-top: 1rem; font-style: italic; }
        .result-advice { background: rgba(0,0,0,0.2); border-radius: 12px; padding: 1rem; margin-top: 1rem; color: #d0c8b8; text-align: left; line-height: 1.6; }
        .result-formula { color: #a09080; font-style: italic; font-size: 0.9rem; margin-top: 1rem; font-family: 'Courier New', monospace; }
        .back-link { display: inline-block; margin-top: 1.5rem; color: #ffd54f; text-decoration: none; border: 1px solid #ffd54f; padding: 0.6rem 1.5rem; border-radius: 30px; transition: 0.2s; }
        .back-link:hover { background: #ffd54f; color: #1a1a2e; }
    </style>
</head>
<body>
<div class="cosmic-bg"></div>
<div class="main-container">

    <h1>🧘 Сколько медитировать?</h1>
    <div class="subtitle">Калькулятор оптимальной длительности медитации (§6, §108, §125)</div>

    <div class="calc-section">
        <div class="section-title">📐 Ваше состояние</div>

        <div class="input-group">
            <label>🎯 Текущий Cₛ (когерентность): <span id="csValue">0.5</span></label>
            <input type="range" id="csSlider" min="0.1" max="1" value="0.5" step="0.01">
            <div class="range-labels"><span>0.1 (хаос)</span><span>1.0 (лазер)</span></div>
        </div>

        <div class="input-group">
            <label>🌡️ Текущая Tₛ (температура): <span id="tsValue">6.0</span></label>
            <input type="range" id="tsSlider" min="0" max="10" value="6" step="0.1">
            <div class="range-labels"><span>0 (ступор)</span><span>5 (оптимум)</span><span>10 (перегрев)</span></div>
        </div>

        <div class="input-group">
            <label>🎯 Цель медитации:</label>
            <select id="goalSelect">
                <option value="calm" selected>Успокоиться (снизить Tₛ)</option>
                <option value="focus">Сфокусироваться (повысить Cₛ)</option>
                <option value="flow">Войти в поток (Cₛ + Tₛ → оптимум)</option>
                <option value="heal">Исцеление (макс. Qₛ, Cₛ → 0.9+)</option>
            </select>
        </div>
    </div>

    <!-- Результат -->
    <div class="result-box" id="resultBox">
        <div class="result-number" id="resultNumber">—</div>
        <div class="result-label" id="resultLabel">Рекомендуемая длительность</div>
        <div class="result-extra" id="resultExtra"></div>
        <div class="result-advice" id="resultAdvice"></div>
        <div class="result-formula" id="resultFormula"></div>
    </div>

    <div style="text-align: center;">
        <a href="semantic-calculators.html" class="back-link">← К списку калькуляторов</a>
    </div>

</div>

<script>
    const csSlider = document.getElementById('csSlider');
    const tsSlider = document.getElementById('tsSlider');
    const goalSelect = document.getElementById('goalSelect');
    const csValue = document.getElementById('csValue');
    const tsValue = document.getElementById('tsValue');
    const resultNumber = document.getElementById('resultNumber');
    const resultLabel = document.getElementById('resultLabel');
    const resultExtra = document.getElementById('resultExtra');
    const resultAdvice = document.getElementById('resultAdvice');
    const resultFormula = document.getElementById('resultFormula');

    csSlider.addEventListener('input', () => { csValue.textContent = parseFloat(csSlider.value).toFixed(2); calculate(); });
    tsSlider.addEventListener('input', () => { tsValue.textContent = parseFloat(tsSlider.value).toFixed(1); calculate(); });
    goalSelect.addEventListener('change', calculate);

    function calculate() {
        const C = parseFloat(csSlider.value);
        const T = parseFloat(tsSlider.value);
        const goal = goalSelect.value;

        let minutes = 0;
        let technique = '';
        let advice = '';

        if (goal === 'calm') {
            // Успокоиться: чем выше Tₛ, тем дольше
            const Tdistance = Math.abs(T - 5); // отклонение от оптимума
            minutes = Math.round(5 + Tdistance * 3 + (1 - C) * 10);
            technique = 'Дыхание 4-7-8 (вдох 4с, задержка 7с, выдох 8с).';
        } else if (goal === 'focus') {
            // Сфокусироваться: чем ниже Cₛ, тем дольше
            minutes = Math.round(5 + (1 - C) * 30 + Math.abs(T - 5) * 2);
            technique = 'Концентрация на пламени свечи или точке на стене.';
        } else if (goal === 'flow') {
            // Войти в поток: нужно и Cₛ поднять, и Tₛ выровнять
            minutes = Math.round(10 + (1 - C) * 25 + Math.abs(T - 5) * 3);
            technique = 'Сначала дыхание (5 мин), затем визуализация потока золотого света.';
        } else if (goal === 'heal') {
            // Исцеление: максимальная отдача, нужно Cₛ > 0.9
            if (C >= 0.9) {
                minutes = 10;
                technique = 'Направьте внимание на больное место, визуализируйте золотой свет.';
            } else {
                minutes = Math.round(15 + (0.9 - C) * 60);
                technique = 'Сначала поднимите Cₛ до 0.9 через концентрацию на дыхании, затем направьте свет.';
            }
        }

        // Ограничения
        if (minutes < 1) minutes = 1;
        if (minutes > 120) minutes = 120;

        resultNumber.textContent = minutes + ' мин';
        resultLabel.textContent = 'Рекомендуемая длительность';

        const goalNames = { calm: 'Успокоение', focus: 'Фокусировка', flow: 'Вход в поток', heal: 'Исцеление' };
        resultExtra.textContent = 'Цель: ' + goalNames[goal] + ' | Cₛ = ' + C.toFixed(2) + ' | Tₛ = ' + T.toFixed(1);

        advice = '<strong>🧘 Техника:</strong> ' + technique + '<br><br>';
        advice += '<strong>🎵 Фон:</strong> ' + (goal === 'calm' ? 'Резонанс Шумана 7.83 Гц или тишина.' : 
            (goal === 'focus' ? 'Белый шум или звук дождя.' :
            (goal === 'flow' ? 'Музыка 432 Гц, эмбиент.' : 'Частота 528 Гц (исцеление ДНК).'))) + '<br><br>';
        advice += '<strong>💡 Совет:</strong> ' + (minutes < 10 ? 'Короткая, но интенсивная практика. Не отвлекайтесь ни на секунду.' :
            (minutes < 30 ? 'Удобная длительность. Поставьте таймер и забудьте о времени.' :
            'Длительная практика. Найдите тихое место, предупредите близких.'));

        resultAdvice.innerHTML = advice;
        resultFormula.textContent = 'Расчёт: цель=' + goal + ', Cₛ=' + C.toFixed(2) + ', Tₛ=' + T.toFixed(1) + ' → ' + minutes + ' мин';
    }

    calculate();
</script>

</body>
</html>
